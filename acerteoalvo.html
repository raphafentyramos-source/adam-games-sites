<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Adam Games • Acerte o Alvo</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#06223b,#031727);color:#fff;font-family:Arial,sans-serif}.page{max-width:650px;margin:auto;padding:12px}.top{display:flex;align-items:center;justify-content:space-between}.back{background:#07304f;color:#fff;border:0;border-radius:12px;width:44px;height:44px;font-size:25px}.title{text-align:center}.title small{display:block;color:#8eb7d2;font-size:8px;letter-spacing:2px}.title b{font-size:20px}.coins{background:#092a43;border:1px solid #1c4560;border-radius:12px;padding:7px 10px;text-align:center}.coins small{display:block;color:#9bb9ca;font-size:8px}.coins b{color:#ffd329}.hero{margin-top:10px;background:#082943;border:1px solid #17435f;border-radius:18px;text-align:center;padding:13px}.hero h1{margin:0;font-size:27px}.hero p{margin:5px 0 0;color:#b5d0e0;font-size:12px}.info{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.box{background:#082943;border:1px solid #17435f;border-radius:11px;text-align:center;padding:7px 2px}.box small{display:block;color:#91b2c7;font-size:8px}.box b{display:block;margin-top:3px;font-size:14px}.card{margin-top:8px;padding:8px;background:#061f35;border:1px solid #17435f;border-radius:18px}#arena{position:relative;height:min(66vh,600px);min-height:460px;overflow:hidden;border-radius:13px;background:linear-gradient(#092b47,#0b3a56 70%,#08233a);touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%}.hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:bold;color:#c2d9e6;white-space:nowrap;text-shadow:0 2px 4px #000}.jump{position:absolute;bottom:7px;left:7px;border:0;border-radius:10px;padding:9px;background:#a82343;color:#fff;font-weight:bold}.msg{text-align:center;min-height:22px;padding:6px;font-weight:bold;font-size:13px}.legend{text-align:center;color:#9dbacc;font-size:10px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modal>div{max-width:410px;width:100%;background:#082943;border:1px solid #26506a;border-radius:22px;padding:23px;text-align:center}.mi{font-size:48px}.modal h2{margin:5px 0}.modal p{color:#b8d0df;white-space:pre-line;line-height:1.45;font-size:14px}.ms{color:#ffd329;font-size:20px;font-weight:bold}.modal button{width:100%;margin-top:16px;height:48px;border:0;border-radius:13px;background:#13ad61;color:#fff;font-weight:bold;font-size:13px}</style></head><body><main class="page"><div class="top"><button class="back" id="back">←</button><div class="title"><small>ADAM GAMES</small><b>ACERTE O ALVO</b></div><div class="coins"><small>ADAM COINS</small><b id="coins">0</b></div></div><section class="hero"><h1>🎯 Acerte o Alvo</h1><p>Toque na arena para disparar. A mira se move, mas os alvos ficam FIXOS.</p></section><div class="info"><div class="box"><small>NÍVEL</small><b id="level">1 / 9</b></div><div class="box"><small>PONTOS</small><b id="score">0</b></div><div class="box"><small>META</small><b id="goal">180</b></div><div class="box"><small>PULOS</small><b id="hearts">❤️ ❤️</b></div></div><div class="card"><div id="arena"><canvas id="cv"></canvas><button class="jump" id="jump">❤️ PULAR ALVO</button><div class="hint" id="hint">TOQUE NA ARENA PARA ATIRAR</div></div><div class="msg" id="msg"></div><div class="legend">🎯 centro = 100 • interno = 75 • médio = 50 • externo = 25</div></div></main><div class="modal" id="modal"><div><div class="mi" id="icon">🎯</div><h2 id="mt"></h2><p id="mp"></p><div class="ms" id="ms"></div><button id="mb">CONTINUAR</button></div></div><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,collection,query,where,getDocs,getDoc,runTransaction}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc',authDomain:'adam-games-21081.firebaseapp.com',projectId:'adam-games-21081',storageBucket:'adam-games-21081.firebasestorage.app',messagingSenderId:'1055528418738',appId:'1:1055528418738:web:5fafdf63424ba9744eb8ab'};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);let user,userRef,coins=0,level=1,score=0,idx=0,hearts=2,shooting=false,targets=[],aim=-1.5,dir=1,W=0,H=0,arrow=null,raf;
const L={1:[3,180,.145,1.5],2:[3,210,.135,1.7],3:[3,240,.125,1.9],4:[4,300,.116,2.1],5:[4,330,.108,2.3],6:[4,360,.100,2.5],7:[5,425,.092,2.7],8:[5,450,.084,3],9:[6,500,.078,3.3]};const P={3:[[.22,.25],[.78,.29],[.5,.52]],4:[[.21,.23],[.79,.23],[.25,.52],[.75,.53]],5:[[.18,.21],[.5,.2],[.82,.22],[.25,.5],[.72,.54]],6:[[.17,.19],[.5,.18],[.83,.2],[.2,.46],[.52,.51],[.8,.47]]};const c=$('cv'),x=c.getContext('2d'),arena=$('arena');
function ui(){$('level').textContent=level+' / 9';$('score').textContent=score;$('goal').textContent=L[level][1];$('hearts').textContent=hearts===2?'❤️ ❤️':hearts===1?'❤️ 🖤':'🖤 🖤';$('jump').disabled=hearts<1||shooting}
function resize(){let r=arena.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);draw()}addEventListener('resize',resize);
async function findUser(u){let s=await getDocs(query(collection(db,'admins'),where('uid','==',u.uid)));if(!s.empty)return s.docs[0].ref;if(u.email){s=await getDocs(query(collection(db,'admins'),where('email','==',u.email)));if(!s.empty)return s.docs[0].ref}return null}
async function chance(){await runTransaction(db,async t=>{let s=await t.get(userRef);if(!s.exists())throw Error('CADASTRO');let n=Number(s.data().chances||0);if(n<1)throw Error('SEM_CHANCES');t.update(userRef,{chances:n-1})})}async function reward(n){await runTransaction(db,async t=>{let s=await t.get(userRef);if(!s.exists())throw Error('CADASTRO');t.update(userRef,{moedas:Number(s.data().moedas||0)+n})});coins+=n;$('coins').textContent=coins.toLocaleString('pt-BR')}
function make(){let [n,,r]=L[level];targets=P[n].map((p,i)=>({x:W*p[0],y:H*(p[1]+.02),r:Math.min(W,H)*r,hit:false}));idx=0}
function target(t){let r=t.r;x.save();x.translate(t.x,t.y);if(t.hit)x.globalAlpha=.22;x.fillStyle='#111';x.beginPath();x.arc(0,4,r+4,0,7);x.fill();for(let [rr,col]of[[1,'#f5f5f5'],[.76,'#1671d9'],[.54,'#e9343c'],[.34,'#ffd43b'],[.18,'#111']]){x.fillStyle=col;x.beginPath();x.arc(0,0,r*rr,0,7);x.fill()}x.restore()}
function draw(){if(!W)return;x.clearRect(0,0,W,H);targets.forEach(target);let sx=W*.5+12,sy=H*.86-18;x.strokeStyle='#c88b4b';x.lineWidth=4;x.beginPath();x.arc(sx+12,sy,29,-2.25,2.25);x.stroke();x.strokeStyle='#dce7ef';x.lineWidth=2;x.beginPath();x.moveTo(sx,sy);x.lineTo(sx+70*Math.cos(aim),sy+70*Math.sin(aim));x.stroke();x.fillStyle='#e3b27a';x.beginPath();x.arc(sx,sy-30,12,0,7);x.fill();x.fillStyle='#2588c5';x.fillRect(sx-13,sy-18,26,32);x.fillStyle='#173b5c';x.fillRect(sx-12,sy+14,9,22);x.fillRect(sx+3,sy+14,9,22);if(arrow){x.strokeStyle='#8b5a2b';x.lineWidth=5;x.beginPath();x.moveTo(arrow.x,arrow.y);x.lineTo(arrow.x-30*Math.cos(arrow.a),arrow.y-30*Math.sin(arrow.a));x.stroke()}}
function loop(t){let dt=Math.min(30,t-(loop.last||t));loop.last=t;if(!shooting){aim+=dir*L[level][3]*dt/1000;if(aim>-0.7){aim=-.7;dir=-1}if(aim<-2.45){aim=-2.45;dir=1}}draw();raf=requestAnimationFrame(loop)}
function modal(i,t,p,s,b,fn){$('icon').textContent=i;$('mt').textContent=t;$('mp').textContent=p;$('ms').textContent=s||'';$('mb').textContent=b;$('modal').classList.add('show');$('mb').onclick=async()=>{try{await fn()}catch(e){alert(e.message==='SEM_CHANCES'?'Você não tem chances disponíveis.':'Não foi possível concluir.')} }}function close(){ $('modal').classList.remove('show')}
async function start(){try{await chance();level=1;score=0;hearts=2;begin()}catch(e){modal('🚫','SEM CHANCES','Você não possui chances disponíveis.','','VOLTAR',close)}}function begin(){close();shooting=false;arrow=null;make();aim=-1.55;dir=1;ui();resize();$('msg').textContent=level===8?'🔥 HARD':level===9?'👑 BÔNUS FINAL':'';cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function zone(t,px,py){let d=Math.hypot(px-t.x,py-t.y);if(d>t.r)return 0;if(d<=t.r*.18)return 100;if(d<=t.r*.34)return 75;if(d<=t.r*.54)return 50;return 25}
function fire(){if(shooting||!targets[idx])return;shooting=true;let t=targets[idx],sx=W*.5+12,sy=H*.86-18,dx=Math.cos(aim),dy=Math.sin(aim),vx=t.x-sx,vy=t.y-sy,proj=vx*dx+vy*dy,cross=Math.abs(vx*dy-vy*dx),hit=proj>0&&cross<=t.r,px=hit?sx+dx*proj:sx+dx*W*1.2,py=hit?sy+dy*proj:sy+dy*W*1.2,st=performance.now(),dur=Math.max(300,Math.min(650,Math.hypot(px-sx,py-sy)*1.4));arrow={x:sx,y:sy,a:aim};function step(now){let q=Math.min(1,(now-st)/dur),e=1-(1-q)**2;arrow.x=sx+(px-sx)*e;arrow.y=sy+(py-sy)*e;draw();if(q<1)return requestAnimationFrame(step);arrow=null;if(hit){let pts=zone(t,px,py);score+=pts;t.hit=true;$('msg').textContent=pts===100?'🎯 CENTRO! +100':'+'+pts+' PONTOS'}else $('msg').textContent='❌ ERROU O ALVO';setTimeout(()=>{idx++;shooting=false;if(idx>=targets.length)finish();else ui()},220)}requestAnimationFrame(step)}
function jump(){if(shooting||hearts<1)return;hearts--;targets[idx].hit=true;idx++;if(idx>=targets.length)finish();else{$('msg').textContent='❤️ ALVO PULADO';ui()}}
async function finish(){shooting=true;ui();let goal=L[level][1];if(score<goal)return modal('💥','VOCÊ PERDEU','Você terminou este nível sem atingir a meta.\n\nTente novamente o mesmo nível.','PONTOS: '+score,'🔄 TENTAR NOVAMENTE',retry);if(level<9)return modal(level===8?'🔥':'🎯',level===8?'HARD SUPERADO!':'NÍVEL CONCLUÍDO','Você atingiu a meta e avançou para o próximo nível.','PONTOS: '+score,level===8?'👑 NÍVEL 9':'PRÓXIMO NÍVEL',async()=>{level++;begin()});try{await reward(100)}catch(e){}modal('👑','9 NÍVEIS CONCLUÍDOS!','Você venceu o Acerte o Alvo completo.\n\nParabéns!','+100 ADAM COINS','VOLTAR AOS JOGOS',()=>location.href='jogos.html')}
async function retry(){try{await chance();score=0;hearts=2;begin()}catch(e){if(e.message==='SEM_CHANCES')modal('🚫','SEM CHANCES','Você não possui outra chance para tentar novamente.','','VOLTAR AOS JOGOS',()=>location.href='jogos.html');else throw e}}
arena.addEventListener('pointerdown',e=>{e.preventDefault();fire()});$('jump').addEventListener('pointerdown',e=>{e.stopPropagation();jump()});$('back').onclick=()=>location.href='jogos.html';onAuthStateChanged(auth,async u=>{if(!u)return location.href='index.html';user=u;try{userRef=await findUser(u);if(!userRef)return location.href='jogos.html';let s=await getDoc(userRef);coins=Number(s.data()?.moedas||0);$('coins').textContent=coins.toLocaleString('pt-BR');resize();modal('🎯','ACERTE O ALVO','São 9 níveis.\n\nAcerte o centro dos alvos FIXOS para pontuar. Você recebe 2 pulos por partida.\n\nA chance só é consumida ao clicar em INICIAR.','3 → 4 → 5 → 5 → 6 ALVOS','▶️ INICIAR • USAR 1 CHANCE',start)}catch(e){console.error(e);alert('Erro ao carregar seus dados.')}});
</script></body></html>
