<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Adam Games • Administração</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  color:#fff;
  min-height:100vh;
  background:
    linear-gradient(
      145deg,
      #087fe0,
      #031b3d 75%

  padding:20px 12px 40px;
}

.container{

  margin:auto;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:25px;
}

.logo{
  display:flex;

}

.logoIcon{

  border-radius:18px;
  display:flex;

  justify-content:center;

  background:

}

.logo h1{
  font-size:22px;
}

.logo span{

}

.badge{
  display:inline-block;
  margin-top:5px;
  padding:5px 9px;
  border-radius:8px;
  background:#d99b12;
  font-size:11px;
  font-weight:bold;
}

button{
  border:0;
  cursor:pointer;
  color:#fff;
  font-weight:bold;
}

.logout{
  padding:12px 16px;
  border-radius:12px;
  background:#17395f;
}

h2{
  font-size:38px;
  margin-bottom:6px;
}

.subtitle{

  margin-bottom:22px;

.card{

  border:

  padding:20px;
  margin-bottom:18px;
}

.card h3{
  margin-bottom:15px;
  font-size:20px;
}

.search{

  gap:10px;
}

input,

.search button{

  border-radius:12px;
  background:#168ff0;
}

.message{
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  display:none;
  font-size:14px;
}

.success{
  display:block;
  background:

}

.error{

}

#userArea{

}

.user{

  gap:15px;
  margin-bottom:20px;

.avatar{

  height:65px;

  background:#ffd52b;
  color:#111;

  align-items:center;
  justify-content:center;

}

.userName{
  font-size:22px;
  font-weight:bold;
}

.userEmail,

  margin-top:4px;
  color:#a9c8e5;
  font-size:13px;
}

.balances{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:10px;
  margin-bottom:22px;
}

.balance{
  text-align:center;
  padding:15px 8px;

}

.balanceIcon{

}

.balanceName{

  font-size:10px;

  margin-top:5px;
}

.balanceValue{
  font-size:18px;
  font-weight:bold;
  margin-top:5px;
}

.form{
  display:grid;
  grid-template-columns:
    1fr 1fr;
  gap:12px;
}

.field label{
  display:block;
  color:#a9c8e5;
  font-size:11px;
  font-weight:bold;
  margin-bottom:6px;
}

.full{
  grid-column:1 / -1;
}

.actions{
  display:grid;
  grid-template-columns:
    1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.add{
  background:#07934c;
  padding:14px;
  border-radius:12px;
}

.remove{
  background:#c8233c;
  padding:14px;
  border-radius:12px;
}

.special{
  display:grid;
  grid-template-columns:
    1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.vip{
  padding:14px;
  border-radius:12px;
  background:#c38b0d;
}

.box{
  padding:14px;
  border-radius:12px;
  background:#087edb;
}

.history{
  margin-top:22px;
}

.historyItem{

  margin-top:9px;
  border-radius:14px;
  background:

  border:

}

.historyTop{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-weight:bold;
}

.historyDate{
  color:#75d4ff;
  font-size:12px;
  text-align:right;
}

.plus{
  color:#65ff9c;
}

.minus{
  color:#ff7382;
}

.historyInfo{
  color:#9dbbd3;
  font-size:12px;

  line-height:1.6;
}

.operation-id{

  padding:7px 9px;
  border-radius:8px;
  background:
    rgba(0,0,0,.2);
  color:#7fc9ff;
  font-size:11px;
  word-break:break-all;
}

.empty{
  padding:15px;
  border-radius:12px;
  background:
    rgba(255,255,255,.04);
  color:#9dbbd3;
}

@media(max-width:650px){

  h2{
    font-size:32px;
  }

  }

  .search button{
    width:100%;
    height:50px;
  }

  .balances{
    grid-template-columns:
      1fr 1fr;
  }

  .form{
    grid-template-columns:
      1fr;
  }

  .full{
    grid-column:auto;
  }

  .actions,
  .special{
    grid-template-columns:
      1fr;
  }

  .historyTop{
    flex-direction:column;
  }

  .historyDate{
    text-align:left;
  }

}

</style>

<script type="module">


/* ==========================================

}
from

}
from

import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  updateDoc,
  addDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:
    "adam-games-21081.firebaseapp.com",

  projectId:
    "adam-games-21081",

  storageBucket:
    "adam-games-21081.firebasestorage.app",

  messagingSenderId:
    "1055528418738",

  appId:
    "1:1055528418738:web:5fafdf63424ba9744eb8ab"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* ==========================================
   ADMIN
========================================== */

const ADMIN =
  "raphafentyramos@gmail.com";


let usuarioSelecionado =
  null;


let adminLogado =
  null;


/* ==========================================
   MENSAGENS
========================================== */

function mensagem(
  elemento,
  texto,
  tipo
){

  elemento.textContent =
    texto;

  elemento.className =
    "message " +
    tipo;

}


/* ==========================================
   NÚMEROS
========================================== */

function numero(
  valor
){

  return Number(
    valor || 0
  ).toLocaleString(
    "pt-BR"
  );

}


/* ==========================================
   DINHEIRO
========================================== */

function dinheiro(
  valor
){

  return Number(
    valor || 0
  ).toLocaleString(
    "pt-BR",
    {
      style:"currency",
      currency:"BRL"
    }
  );

}


/* ==========================================
   ID ÚNICO DA MOVIMENTAÇÃO
========================================== */

function gerarIdMovimentacao(){

  const agora =
    new Date();


  const ano =
    agora.getFullYear();


  const mes =
    String(
      agora.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const dia =
    String(
      agora.getDate()
    ).padStart(
      2,
      "0"
    );


  const hora =
    String(
      agora.getHours()
    ).padStart(
      2,
      "0"
    );


  const minuto =
    String(
      agora.getMinutes()
    ).padStart(
      2,
      "0"
    );


  const segundo =
    String(
      agora.getSeconds()
    ).padStart(
      2,
      "0"
    );


  let aleatorio;


  if(
    window.crypto &&
    crypto.randomUUID
  ){

    aleatorio =
      crypto
      .randomUUID()
      .split("-")[0]
      .toUpperCase();

  }

  else{

    aleatorio =
      Math.random()
      .toString(36)
      .substring(
        2,
        8
      )
      .toUpperCase();

  }


  return (
    "MOV-" +
    ano +
    mes +
    dia +
    "-" +
    hora +
    minuto +
    segundo +
    "-" +
    aleatorio
  );

}


/* ==========================================
   MOSTRAR USUÁRIO
========================================== */

function mostrarUsuario(
  doc
){

  const data =
    doc.data();


  usuarioSelecionado = {

    ref:
      doc.ref,

    docId:
      doc.id,

    data:
      data

  };


  document.getElementById(
    "userArea"
  ).style.display =
    "block";


  document.getElementById(
    "nome"
  ).textContent =

    data.nome ||
    data.name ||
    "Usuário";


  document.getElementById(
    "email"
  ).textContent =

    data.email ||
    "Sem e-mail";


  document.getElementById(
    "id"
  ).textContent =

    "ID: " +
    (
      data.publicId ||
      doc.id
    );


  document.getElementById(
    "avatar"
  ).textContent =

    data.avatar ||
    "🙂";


  atualizarSaldos();


  carregarExtrato(
    data.publicId ||
    doc.id
  );

}


/* ==========================================
   ATUALIZAR SALDOS
========================================== */

function atualizarSaldos(){

  if(
    !usuarioSelecionado
  ){

    return;

  }


  const data =
    usuarioSelecionado.data;


  document.getElementById(
    "chances"
  ).textContent =

    numero(
      data.chances
    );


  document.getElementById(
    "moedas"
  ).textContent =

    numero(
      data.moedas
    );


  document.getElementById(
    "chaves"
  ).textContent =

    numero(
      data.chaves
    );


  document.getElementById(
    "creditos"
  ).textContent =

    dinheiro(
      data.creditos
    );

}


/* ==========================================
   BUSCAR USUÁRIO
========================================== */

async function buscarUsuario(){

  const id =
    document.getElementById(
      "publicId"
    ).value.trim();


  if(!id){

    mensagem(
      document.getElementById(
        "searchMessage"
      ),
      "Digite o ID do usuário.",
      "error"
    );

    return;

  }


  try{

    const ref =
      collection(
        db,
        "admins"
      );


    const busca =
      query(
        ref,
        where(
          "publicId",
          "==",
          id
        )
      );


    const resultado =
      await getDocs(
        busca
      );


    if(
      resultado.empty
    ){

      document.getElementById(
        "userArea"
      ).style.display =
        "none";


      mensagem(
        document.getElementById(
          "searchMessage"
        ),
        "Usuário não encontrado.",
        "error"
      );


      return;

    }


    const doc =
      resultado.docs[0];


    mostrarUsuario(
      doc
    );


    mensagem(
      document.getElementById(
        "searchMessage"
      ),
      "Usuário encontrado.",
      "success"
    );


  }catch(erro){

    console.error(
      erro
    );


    mensagem(
      document.getElementById(
        "searchMessage"
      ),
      "Erro ao buscar usuário.",
      "error"
    );

  }

}


/* ==========================================
   ALTERAR SALDO
========================================== */

async function alterarSaldo(
  operacao
){

  if(
    !usuarioSelecionado ||
    !adminLogado
  ){

    mensagem(
      document.getElementById(
        "operationMessage"
      ),
      "Nenhum usuário selecionado.",
      "error"
    );

    return;

  }


  const item =
    document.getElementById(
      "item"
    ).value;


  const quantidade =
    Number(
      document.getElementById(
        "quantidade"
      ).value
    );


  const motivo =
    document.getElementById(
      "motivo"
    ).value.trim();


  if(
    !Number.isFinite(
      quantidade
    ) ||
    quantidade <= 0
  ){

    mensagem(
      document.getElementById(
        "operationMessage"
      ),
      "Digite uma quantidade válida.",
      "error"
    );

    return;

  }


  if(
    !Number.isInteger(
      quantidade
    )
  ){

    mensagem(
      document.getElementById(
        "operationMessage"
      ),
      "A quantidade deve ser um número inteiro.",
      "error"
    );

    return;

  }


  if(
    !motivo
  ){

    mensagem(
      document.getElementById(
        "operationMessage"
      ),
      "O motivo é obrigatório.",
      "error"
    );

    return;

  }


  const antigo =
    Number(
      usuarioSelecionado.data[item] ||
      0
    );


  const movimento =

    operacao === "adicionar"
      ? quantidade
      : -quantidade;


  const novo =
    antigo +
    movimento;


  if(
    novo < 0
  ){

    mensagem(
      document.getElementById(
        "operationMessage"
      ),
      "O saldo não pode ficar negativo.",
      "error"
    );

    return;

  }


  const confirmacao =

    operacao === "adicionar"

      ?

      "Adicionar " +
      numero(
        quantidade
      ) +
      " " +
      item +
      " ao usuário?"

      :

      "Remover " +
      numero(
        quantidade
      ) +
      " " +
      item +
      " do usuário?";


  if(
    !confirm(
      confirmacao
    )
  ){

    return;

  }


  const movimentacaoId =
    gerarIdMovimentacao();


  const agora =
    new Date();


  const criadoEm =
    agora.toISOString();


  try{

    /* ================================
       ATUALIZA SALDO
    ================================= */

    await updateDoc(
      usuarioSelecionado.ref,
      {
        [item]:
          novo
      }
    );


    /* ================================
       REGISTRA HISTÓRICO
    ================================= */

    await addDoc(
      collection(
        db,
        "historico"
      ),
      {

        movimentacaoId:
          movimentacaoId,

        usuarioId:
          usuarioSelecionado.docId,

        publicId:
          usuarioSelecionado.data.publicId ||
          usuarioSelecionado.docId,

        usuarioEmail:
          usuarioSelecionado.data.email ||
          "",

        usuarioNome:
          usuarioSelecionado.data.nome ||
          usuarioSelecionado.data.name ||
          "",

        adminEmail:
          adminLogado.email ||
          "",

        adminUid:
          adminLogado.uid ||
          "",

        item:
          item,

        operacao:
          operacao,

        quantidade:
          quantidade,

        saldoAnterior:
          antigo,

        saldoFinal:
          novo,

        motivo:
          motivo,

        criadoEm:
          criadoEm

      }
    );


    usuarioSelecionado.data[item] =
      novo;


    atualizarSaldos();


    document.getElementById(
      "quantidade"
    ).value =
      "";


    document.getElementById(
      "motivo"
    ).value =
      "";


    mensagem(
      document.getElementById(
        "operationMessage"
      ),
      "Movimentação realizada e registrada no extrato.",
      "success"
    );


    await carregarExtrato(
      usuarioSelecionado.data.publicId ||
      usuarioSelecionado.docId
    );


  }catch(erro){

    console.error(
      "Erro na movimentação:",
      erro
    );


    mensagem(
      document.getElementById(
        "operationMessage"
      ),
      "Erro ao realizar movimentação.",
      "error"
    );

  }

}


/* ==========================================
   EXTRATO
========================================== */

async function carregarExtrato(
  publicId
){

  const area =
    document.getElementById(
      "historyList"
    );


  area.innerHTML =
    "<div class='empty'>🔄 Carregando extrato...</div>";


  try{

    const ref =
      collection(
        db,
        "historico"
      );


    const busca =
      query(
        ref,
        where(
          "publicId",
          "==",
          publicId
        )
      );


    const resultado =
      await getDocs(
        busca
      );


    if(
      resultado.empty
    ){

      area.innerHTML =
        "<div class='empty'>" +
        "Nenhuma movimentação registrada." +
        "</div>";

      return;

    }


    const registros =

      resultado.docs

      .map(
        doc => ({
          id:
            doc.id,
          ...doc.data()
        })
      )

      .sort(
        (
          a,
          b
        ) =>

          String(
            b.criadoEm ||
            ""
          ).localeCompare(
            String(
              a.criadoEm ||
              ""
            )
          )
      );


    area.innerHTML =
      "";


    registros.forEach(
      registro => {


        const div =
          document.createElement(
            "div"
          );


        div.className =
          "historyItem";


        const positivo =

          registro.operacao ===
          "adicionar";


        const sinal =
          positivo
            ? "+"
            : "-";


        const classe =
          positivo
            ? "plus"
            : "minus";


        const data =

          registro.criadoEm

            ?

            new Date(
              registro.criadoEm
            ).toLocaleString(
              "pt-BR"
            )

            :

            "—";


        div.innerHTML =

          "<div class='historyTop'>" +

            "<span class='" +
            classe +
            "'>" +

              sinal +
              " " +

              numero(
                registro.quantidade
              ) +

              " " +

              registro.item +

            "</span>" +


            "<span class='historyDate'>" +

              data +

            "</span>" +

          "</div>" +


          "<div class='historyInfo'>" +

            "Saldo anterior: " +

            numero(
              registro.saldoAnterior
            ) +

            "<br>" +


            "Saldo final: " +

            numero(
              registro.saldoFinal
            ) +

            "<br>" +


            "Motivo: " +

            (
              registro.motivo ||
              "—"
            ) +

            "<br>" +


            "Administrador: " +

            (
              registro.adminEmail ||
              "—"
            ) +

            "<br>" +


            "UID administrador: " +

            (
              registro.adminUid ||
              "—"
            ) +

          "</div>" +


          "<div class='operation-id'>" +

            "🆔 ID da movimentação: " +

            (
              registro.movimentacaoId ||
              "Registro antigo"
            ) +

          "</div>";


        area.appendChild(
          div
        );

      }
    );


  }catch(erro){

    console.error(
      "Erro ao carregar extrato:",
      erro
    );


    area.innerHTML =

      "<div class='empty'>" +
      "Erro ao carregar o extrato." +
      "</div>";

  }

}


/* ==========================================
   VIP
========================================== */

async function alterarVIP(){

  if(
    !usuarioSelecionado ||
    !adminLogado
  ){

    return;

  }


  const atual =
    usuarioSelecionado.data.vip === true;


  const novo =
    !atual;


  if(
    !confirm(
      novo
        ?
        "Ativar VIP para este usuário?"
        :
        "Desativar VIP deste usuário?"
    )
  ){

    return;

  }


  const movimentacaoId =
    gerarIdMovimentacao();


  try{

    await updateDoc(
      usuarioSelecionado.ref,
      {
        vip:
          novo
      }
    );


    await addDoc(
      collection(
        db,
        "historico"
      ),
      {

        movimentacaoId:
          movimentacaoId,

        usuarioId:
          usuarioSelecionado.docId,

        publicId:
          usuarioSelecionado.data.publicId ||
          usuarioSelecionado.docId,

        usuarioEmail:
          usuarioSelecionado.data.email ||
          "",

        usuarioNome:
          usuarioSelecionado.data.nome ||
          usuarioSelecionado.data.name ||
          "",

        adminEmail:
          adminLogado.email ||
          "",

        adminUid:
          adminLogado.uid ||
          "",

        item:
          "VIP",

        operacao:
          novo
            ? "adicionar"
            : "remover",

        quantidade:
          1,

        saldoAnterior:
          atual
            ? 1
            : 0,

        saldoFinal:
          novo
            ? 1
            : 0,

        motivo:
          novo
            ?
            "VIP ativado pelo administrador"
            :
            "VIP desativado pelo administrador",

        criadoEm:
          new Date().toISOString()

      }
    );


    usuarioSelecionado.data.vip =
      novo;


    mensagem(
      document.getElementById(
        "operationMessage"
      ),
      novo
        ?
        "VIP ativado e registrado."
        :
        "VIP desativado e registrado.",
      "success"
    );


    await carregarExtrato(
      usuarioSelecionado.data.publicId ||
      usuarioSelecionado.docId
    );


  }catch(erro){

    console.error(
      erro
    );


    mensagem(
      document.getElementById(
        "operationMessage"
      ),
      "Erro ao alterar VIP.",
      "error"
    );

  }

}

/* ==========================================
   AUTENTICAÇÃO E ADMIN
========================================== */

onAuthStateChanged(
  auth,
  async usuario => {


    if(
      !usuario
    ){

      window.location.replace(
        "index.html"
      );

      return;

    }


    if(
      !usuario.email ||
      usuario.email.toLowerCase()
      !==
      ADMIN.toLowerCase()
    ){

      alert(
        "Acesso negado. Área exclusiva do administrador."
      );


      await signOut(
        auth
      );


      window.location.replace(
        "index.html"
      );


      return;

    }


    adminLogado =
      usuario;


    console.log(
      "ADMIN AUTENTICADO:",
      usuario.email
    );


  }
);
