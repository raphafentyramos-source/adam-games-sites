let clientes = [];

let entregas = [];

/* =====================================================
   UTILITÁRIOS
===================================================== */

function numero(valor){

  return Number(
    valor || 0
  ).toLocaleString(
    "pt-BR"
  );

}


function dinheiro(valor){

  return "R$ " +
    Number(
      valor || 0
    )
    .toFixed(2)
    .replace(
      ".",
      ","
    );

}


function escapar(valor){

  return String(
    valor ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


function data(valor){

  if(!valor){

    return "—";

  }


  try{

    if(
      typeof valor.toDate ===
      "function"
    ){

      return valor
        .toDate()
        .toLocaleString(
          "pt-BR"
        );

    }


    if(
      typeof valor.seconds ===
      "number"
    ){

      return new Date(
        valor.seconds * 1000
      )
      .toLocaleString(
        "pt-BR"
      );

    }


    const d =
      new Date(valor);


    if(
      Number.isNaN(
        d.getTime()
      )
    ){

      return "—";

    }


    return d.toLocaleString(
      "pt-BR"
    );

  }

  catch{

    return "—";

  }

}


function millis(valor){

  if(!valor){

    return 0;

  }


  if(
    typeof valor.toMillis ===
    "function"
  ){

    return valor.toMillis();

  }


  if(
    typeof valor.seconds ===
    "number"
  ){

    return valor.seconds * 1000;

  }


  const d =
    new Date(valor);


  return Number.isNaN(
    d.getTime()
  )
    ? 0
    : d.getTime();

}


function mensagem(texto, erro=false){

  const el =
    $("message");

  el.textContent =
    texto;

  el.className =
    erro
      ? "message error"
      : "message";

}


/* =====================================================
   LOGIN
===================================================== */

function mensagemLogin(
  texto,
  tipo="error"
){

  const el =
    $("loginMessage");

  el.textContent =
    texto;

  el.className =
    "login-message " +
    tipo;

}


$("loginButton")
.addEventListener(
  "click",
  async () => {

    const email =
      $("loginEmail")
      .value
      .trim()
      .toLowerCase();


    const senha =
      $("loginPassword")
      .value;


    if(
      email !==
      ADMIN_EMAIL
    ){

      mensagemLogin(
        "Apenas o administrador principal pode entrar.",
        "error"
      );

      return;

    }


    if(!senha){

      mensagemLogin(
        "Digite a senha.",
        "error"
      );

      return;

    }


    const botao =
      $("loginButton");


    botao.disabled =
      true;

    botao.textContent =
      "ENTRANDO...";


    try{

      await signInWithEmailAndPassword(
        auth,
        email,
        senha
      );


      mensagemLogin(
        "Login realizado!",
        "success"
      );

    }

    catch(error){

      console.error(
        error
      );


      mensagemLogin(
        traduzirErro(
          error
        ),
        "error"
      );

      botao.disabled =
        false;

      botao.textContent =
        "ENTRAR NO ADMIN";

    }

  }
);


$("loginPassword")
.addEventListener(
  "keydown",
  e => {

    if(
      e.key ===
      "Enter"
    ){

      $("loginButton")
      .click();

    }

  }
);


function traduzirErro(error){

  const code =
    error?.code ||
    "";


  if(
    code.includes(
      "invalid-credential"
    ) ||
    code.includes(
      "wrong-password"
    )
  ){

    return "E-mail ou senha incorretos.";

  }


  if(
    code.includes(
      "user-not-found"
    )
  ){

    return "Administrador não encontrado.";

  }


  if(
    code.includes(
      "too-many-requests"
    )
  ){

    return "Muitas tentativas. Aguarde alguns minutos.";

  }


  if(
    code.includes(
      "network-request-failed"
    )
  ){

    return "Erro de conexão com o Firebase.";

  }


  return (
    error?.message ||
    "Não foi possível entrar."
  );

}


/* =====================================================
   AUTENTICAÇÃO
===================================================== */

onAuthStateChanged(
  auth,
  async usuario => {

    usuarioAtual =
      usuario;


    if(!usuario){

      $("loginScreen")
        .style
        .display =
        "block";


      $("adminScreen")
        .style
        .display =
        "none";


      return;

    }


    const email =
      (
        usuario.email ||
        ""
      )
      .trim()
      .toLowerCase();


    if(
      email !==
      ADMIN_EMAIL
    ){

      await signOut(auth);

      mensagemLogin(
        "Acesso permitido somente ao administrador principal.",
        "error"
      );

      return;

    }


    $("loginScreen")
      .style
      .display =
      "none";


    $("adminScreen")
      .style
      .display =
      "block";


    await carregarTudo();

  }
);


/* =====================================================
   CARREGAR TUDO
===================================================== */

async function carregarTudo(){

  mensagem(
    "🔄 Carregando clientes e prêmios..."
  );


  try{

    await Promise.all([
      carregarClientes(),
      carregarEntregas()
    ]);


    atualizarEstatisticas();

    renderizarClientes();

    renderizarPendentes();


    mensagem(
      "✅ Painel atualizado."
    );

  }

  catch(error){

    console.error(
      error
    );


    mensagem(
      "Erro ao carregar o painel: " +
      (
        error.message ||
        "erro desconhecido"
      ),
      true
    );

  }

}


/* =====================================================
   CARREGAR CLIENTES
===================================================== */

async function carregarClientes(){

  clientes = [];


  const snapshot =
    await getDocs(
      collection(
        db,
        "admins"
      )
    );


  snapshot.forEach(
    documento => {

      const dados =
        documento.data();


      /*
        NÃO mostra a própria conta
        do administrador na lista.
      */

      const email =
        String(
          dados.email ||
          ""
        )
        .trim()
        .toLowerCase();


      if(
        email ===
        ADMIN_EMAIL
      ){

        return;

      }


      clientes.push({

        id:
          documento.id,

        ...dados

      });

    }
  );


  clientes.sort(
    (a,b) => {

      const nomeA =
        String(
          a.nome ||
          a.name ||
          ""
        )
        .toLowerCase();


      const nomeB =
        String(
          b.nome ||
          b.name ||
          ""
        )
        .toLowerCase();


      return nomeA.localeCompare(
        nomeB
      );

    }
  );

}


/* =====================================================
   CARREGAR ENTREGAS
===================================================== */

async function carregarEntregas(){

  entregas = [];


  const snapshot =
    await getDocs(
      collection(
        db,
        "entregas"
      )
    );


  snapshot.forEach(
    documento => {

      entregas.push({

        id:
          documento.id,

        ...documento.data()

      });

    }
  );


  entregas.sort(
    (a,b) => {

      return millis(
        b.criadoEm ||
        b.dataHora
      )
      -
      millis(
        a.criadoEm ||
        a.dataHora
      );

    }
  );

}


/* =====================================================
   ESTATÍSTICAS
===================================================== */

function atualizarEstatisticas(){

  const pendentes =
    entregas.filter(
      item =>
        item.entregue !== true
    );


  const vip =
    clientes.filter(
      item =>
        item.vip === true
    );


  $("totalClientes")
    .textContent =
    numero(
      clientes.length
    );


  $("totalPremios")
    .textContent =
    numero(
      entregas.length
    );


  $("totalPendentes")
    .textContent =
    numero(
      pendentes.length
    );


  $("totalVip")
    .textContent =
    numero(
      vip.length
    );

}


/* =====================================================

    .value

    .toLowerCase();

    clientes.filter(
      cliente => {

        if(!busca){

          return true;

        }

          (
            cliente.nome ||
            cliente.name ||
            ""
          )

          + " " +

          (
            cliente.email ||
            ""
          )

          + " " +

          (
            cliente.uid ||
            cliente.id ||
            ""
          )

          + " " +

          (
            cliente.publicId ||
            ""
          );


        return texto
          .toLowerCase()
          .includes(
            busca
          );

      }
    );


  container.innerHTML =
    "";


  if(
    filtrados.length === 0
  ){

    container.innerHTML = `

      <div class="empty">

        👥 Nenhum cliente encontrado.

      </div>

    `;

    return;

  }


  filtrados.forEach(
    cliente => {

        cliente.uid ||
        cliente.id;


      const nome =
        cliente.nome ||
        cliente.name ||
        "Cliente";


      const email =
        cliente.email ||
        "Sem e-mail";


      const avatar =
        cliente.avatar ||
        "👤";


      const vip =
        cliente.vip === true;


      const premios =
        entregas.filter(

            String(

              ""

        );

            item.entregue !== true

      const div =
        document.createElement(

        );


      div.className =
        "client";


      div.innerHTML = `

        <div class="client-top">

          <div class="avatar">

            ${escapar(avatar)}

          </div>


          <div class="client-info">

            <div class="client-name">

              ${escapar(nome)}

            </div>

            <div class="client-email">

              ${escapar(email)}

            </div>

            <div class="client-id">

              UID:
              ${escapar(uid)}

            </div>


            ${
              vip

              ?

              `
              <span class="vip">
                👑 VIP ATIVO
              </span>
              `

              :

              `
              <span class="normal">
                MEMBRO NORMAL
              </span>
              `

            }

          </div>

        </div>


        <div class="client-resources">

          <div class="client-resource">

            <b>
              ${numero(cliente.chances)}
            </b>

            <span>
              CHANCES
            </span>

          </div>


          <div class="client-resource">

            <b>
              ${numero(cliente.girosRoleta)}
            </b>

            <span>
              GIROS
            </span>

          </div>


          <div class="client-resource">

            <b>
              ${numero(cliente.moedas)}
            </b>

            <span>
              MOEDAS
            </span>

          </div>


          <div class="client-resource">

            <b>
              ${numero(cliente.chaves)}
            </b>

            <span>
              CHAVES
            </span>

          </div>

        </div>


        <div class="client-actions">

          <button
            class="profile-button"
            data-profile="${escapar(uid)}">

            👤 VER PERFIL COMPLETO

          </button>


          <button
            class="delivery-button"
            data-delivery="${escapar(uid)}">

            🎁 PRÊMIOS
            ${
              pendentes > 0
                ? `(${pendentes})`
                : ""
            }

          </button>

        </div>

      `;


      container.appendChild(
        div
      );

    }
  );


  container
    .querySelectorAll(
      "[data-profile]"
    )
    .forEach(
      botao => {

        botao.addEventListener(
          "click",
          () => {

            abrirPerfil(
              botao.dataset.profile
            );

          }
        );

      }
    );


  container
    .querySelectorAll(
      "[data-delivery]"
    )
    .forEach(
      botao => {

        botao.addEventListener(
          "click",
          () => {

            abrirEntregas(
              botao.dataset.delivery
            );

          }
        );

      }

}

/* =====================================================
   ENCONTRAR CLIENTE
===================================================== */

function encontrarCliente(uid){

  return clientes.find(
    cliente => {

      return String(
        cliente.uid ||
        cliente.id
      ) ===
      String(uid);

    }
  );

}


/* =====================================================
   ABRIR PERFIL
===================================================== */

    entregas.filter(

    );

/* =====================================================
   VER ENTREGAS
===================================================== */

function abrirEntregas(uid){

  window.location.href =
    "entregas.html?uid=" +
    encodeURIComponent(
      uid
    );

}


/* =====================================================
   FECHAR MODAL
===================================================== */

$("closeModal")
.addEventListener(
  "click",
  () => {

    $("profileModal")
      .classList
      .remove("show");

  }
);


$("profileModal")
.addEventListener(
  "click",
  e => {

    if(
      e.target ===
      $("profileModal")
    ){

      $("profileModal")
        .classList
        .remove("show");

    }

  }
);

   BUSCA
===================================================== */

);

   ATUALIZAR
===================================================== */
