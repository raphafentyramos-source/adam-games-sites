/* =====================================================
   DATA FIREBASE
===================================================== */

function converterData(
  valor
){

  if(!valor){

    return null;

  }

  if(
    typeof valor.toMillis ===
    "function"
  ){

    return valor.toMillis();

  }

  if(
    typeof valor.seconds ===
    "number"
  ){

    return valor.seconds * 1000;

  }

  return null;

}


/* =====================================================
   FORMATAR DATA
===================================================== */

function formatarData(
  valor
){

  const millis =
    converterData(
      valor
    );

  if(!millis){

    return "";

  }

  return new Date(
    millis
  ).toLocaleString(
    "pt-BR",
    {
      dateStyle:"short",
      timeStyle:"medium"
    }
  );

}


/* =====================================================
   FORMATAR TIMER
===================================================== */

function formatarTimer(
  ms
){

  const total =
    Math.max(
      0,
      Math.floor(
        ms / 1000
      )
    );

  const horas =
    Math.floor(
      total / 3600
    );

  const minutos =
    Math.floor(
      (
        total % 3600
      ) / 60
    );

  const segundos =
    total % 60;

  return (

    String(
      horas
    ).padStart(
      2,
      "0"
    )

    +

    ":"

    +

    String(
      minutos
    ).padStart(
      2,
      "0"
    )

    +

    ":"

    +

    String(
      segundos
    ).padStart(
      2,
      "0"
    )

  );

}

async function iniciarCronometro(){

    return;

  }

  const duracao =
    ehVip
      ? MS_VIP
      : MS_NAO_VIP;

  const horas =
    ehVip
      ? HORAS_VIP
      : HORAS_NAO_VIP;


  let fim =
    converterData(
      usuario.proximaChance
    );


  /*
  PRIMEIRO ACESSO

  Se não existe contador,
  começa agora.
  */

  if(!fim){

    fim =
      Date.now() +
      duracao;

    const timestamp =
      Timestamp.fromMillis(
        fim
      );

    await updateDoc(

      usuarioRef,

      {
        proximaChance:
          timestamp
      }

    );

    usuario.proximaChance =
      timestamp;

  Limpa contador anterior.
  */

  if(intervalo){

    clearInterval(
      intervalo
    );

  }


  async function atualizar(){

    const agora =
      Date.now();

    const restante =
      fim -
      agora;


    /*
    CONTANDO
    */

      restante > 0
    ){

      timer.textContent =
        formatarTimer(
          restante
        );

      progressBar.style.width =

        Math.max(
          0,
          Math.min(
            100,
            (
              restante /
              duracao
            ) * 100
          )

        "PRÓXIMA CHANCE EXTRA";

      status.textContent =
        "⏳ Próxima chance em " +
        horas +
        " horas.";

      status.className =
        "status waiting";

      return;

    }


    /*
    TIMER ZEROU

    Libera a chance.
    */

    try{

      const chancesAtuais =
        Number(
          usuario.chances || 0
        );

      const novasChances =
        chancesAtuais + 1;

      /*
      Novo contador começa
      exatamente a partir de agora.
      */

      const novoFim =
        Date.now() +
        duracao;

      const novoTimestamp =
        Timestamp.fromMillis(
          novoFim
        );


      await updateDoc(

        usuarioRef,

        {

          chances:
            novasChances,

          proximaChance:
            novoTimestamp

        }

      );


      usuario.chances =
        novasChances;

      usuario.proximaChance =
        novoTimestamp;

      chanceNumber.textContent =
        novasChances;


      /*
      Notificação da chance.
      */

      await criarNotificacaoChance();


      /*
      Reinicia o cronômetro.
      */

      fim =
        novoFim;


      timer.textContent =
        formatarTimer(
          duracao
        );

      progressBar.style.width =
        "100%";

      status.textContent =
        "🎟️ +1 chance liberada!";

      status.className =
        "status available";


      /*
      Depois de alguns segundos
      volta a mostrar a contagem.
      */

      setTimeout(
        () => {

          if(
            usuario &&
            fim
          ){

            status.textContent =
              "⏳ Próxima chance em " +
              horas +
              " horas.";

            status.className =
              "status waiting";

          }

        },
        3000
      );

    }
    catch(error){

      console.error(
        "Erro ao liberar chance:",
        error
      );

      status.textContent =
        "⚠️ Erro ao liberar sua chance.";

      status.className =
        "status locked";

    }

  }


  await atualizar();


  /*
  Atualiza automaticamente
  a cada segundo.
  */

  intervalo =
    setInterval(
      atualizar,
      1000
    );

}


/* =====================================================
   BUSCAR CADASTRO
===================================================== */

async function buscarCadastro(
  user
){

  let resultado =
    await getDocs(

      query(

        collection(
          db,
          "admins"
        ),

        where(
          "uid",
          "==",
          user.uid
        )

      )

    );


  if(
    !resultado.empty
  ){

    return resultado.docs[0];

  }


  if(
    user.email
  ){

    resultado =
      await getDocs(

        query(

          collection(
            db,
            "admins"
          ),

          where(
            "email",
            "==",
            user.email
          )

        )

      );


    if(
      !resultado.empty
    ){

      return resultado.docs[0];

    }

  }


  return null;

}


/* =====================================================
   CARREGAR USUÁRIO
===================================================== */

async function carregar(
  user
){

  const documento =
    await buscarCadastro(
      user
    );


  if(
    !documento
  ){

    vipStatus.textContent =
      "🔒 CONTA NÃO ENCONTRADA";

    timer.textContent =
      "—";

    status.textContent =
      "Não foi possível encontrar seu cadastro.";

    status.className =
      "status locked";

    rescue.disabled =
      true;

    return;

  }


  usuario =
    documento.data();

  usuarioRef =
    documento.ref;

  ehVip =
    usuario.vip === true;


  /*
  Carrega caixa do mês.
  */

  carregarVisual();


  /*
  Mostra chances.
  */

  chanceNumber.textContent =
    Number(
      usuario.chances || 0
    );


  /*
  VIP
  */

  if(
    ehVip
  ){

    vipStatus.textContent =
      "👑 VIP ATIVO";

    chanceDescription.textContent =
      "A cada 72 horas você recebe +1 chance para usar nos jogos.";

  }


  /*
  NÃO VIP
  */

  else{

    vipStatus.textContent =
      "🔒 NÃO VIP";

    chanceDescription.textContent =
      "A cada 120 horas você recebe +1 chance para usar nos jogos.";

  }


  /*
  Caixa Box:

  Somente VIP.
  Uma vez por mês.
  */

  if(
    ehVip
  ){

    const mes =
      mesAtual();

    const jaResgatou =
      usuario.caixaBoxMes ===
      mes;


    if(
      jaResgatou
    ){

      rescue.disabled =
        true;

      rescue.textContent =
        "🎁 CAIXA JÁ RESGATADA";

      message.textContent =
        "Uma nova Caixa estará disponível no dia 1º do próximo mês.";

      status.textContent =
        "✅ Caixa deste mês já foi resgatada.";

      status.className =
        "status available";


      if(
        usuario.caixaBoxResgatadaEm
      ){

        rescueDate.textContent =
          "Resgatada em: " +
          formatarData(
            usuario.caixaBoxResgatadaEm
          );

      }

    }

    else{

      rescue.disabled =
        false;

      rescue.textContent =
        "🎁 RESGATAR CAIXA";

      message.textContent =
        "Você pode resgatar 1 Caixa Box por mês.";

      rescueDate.textContent =
        "";

    }


    /*
    Verifica a notificação
    da nova Caixa.
    */

    await verificarNotificacaoCaixa();

  }


  else{

    rescue.disabled =
      true;

    rescue.textContent =
      "🔒 EXCLUSIVO VIP";

    message.textContent =
      "A Caixa Box é exclusiva para membros VIP.";

    rescueDate.textContent =
      "";

  }


  /*
  IMPORTANTE:

  O cronômetro funciona tanto
  para VIP quanto para não VIP.

  VIP = 72h
  Não VIP = 120h
  */

  await iniciarCronometro();

}


/* =====================================================
   RESGATAR CAIXA
===================================================== */

rescue.addEventListener(
  "click",
  async () => {

    if(
      !ehVip ||
      !usuarioRef ||
      processando
    ){

      return;

    }


    const mes =
      mesAtual();


    if(
      usuario.caixaBoxMes ===
      mes
    ){

      return;

    }


    processando =
      true;

    rescue.disabled =
      true;

    rescue.textContent =
      "REGISTRANDO...";


    try{

      const agora =
        Timestamp.now();


      await updateDoc(

        usuarioRef,

        {

          caixaBoxMes:
            mes,

          caixaBoxResgatadaEm:
            agora,

          caixaBox:
            true

        }

      );


      usuario.caixaBoxMes =
        mes;

      usuario.caixaBoxResgatadaEm =
        agora;


      rescue.textContent =
        "🎁 CAIXA JÁ RESGATADA";


      status.textContent =
        "🎉 Caixa resgatada com sucesso!";

      status.className =
        "status available";


      message.textContent =
        "Seu resgate foi registrado. Uma nova Caixa estará disponível no dia 1º do próximo mês.";


      rescueDate.textContent =
        "Resgatada em: " +
        formatarData(
          agora
        );

    }
    catch(error){

      console.error(
        "Erro ao registrar Caixa:",
        error
      );


      rescue.disabled =
        false;

      rescue.textContent =
        "🎁 RESGATAR CAIXA";


      status.textContent =
        "⚠️ Não foi possível registrar o resgate.";

      status.className =
        "status locked";


      message.textContent =
        error.message ||
        "Tente novamente.";

    }
    finally{

      processando =
        false;

    }

  }
);

  auth,

  async user => {

    if(
      !user

      window.location.href =

      return;

    }


    try{

      await carregar(

      );

      vipStatus.textContent =

      status.textContent =

);
