<style>

.chance-card{

}

.chance-title{

}

.chance-number{

}

.chance-description{

}

.prizes{

.prizes h2{

.prize{

}

<body>

<div class="page">

  <div class="chest-area">

<a

<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  updateDoc,
  Timestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:
    "adam-games-21081.firebaseapp.com",

  projectId:
    "adam-games-21081",

  storageBucket:
    "adam-games-21081.firebasestorage.app",

  messagingSenderId:
    "1055528418738",

  appId:
    "1:1055528418738:web:5fafdf63424ba9744eb8ab"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


const timer =
  document.getElementById("timer");

const status =
  document.getElementById("status");

const rescue =
  document.getElementById("rescue");

const message =
  document.getElementById("message");

const vipStatus =
  document.getElementById("vipStatus");

const chanceNumber =
  document.getElementById("chanceNumber");

const chanceDescription =
  document.getElementById("chanceDescription");

const progressBar =
  document.getElementById("progressBar");

const boxTitle =
  document.getElementById("boxTitle");

const boxSubtitle =
  document.getElementById("boxSubtitle");

const prizeList =
  document.getElementById("prizeList");

const rescueDate =
  document.getElementById("rescueDate");


const HORAS_NAO_VIP =
  120;

const MS_HORA =
  60 * 60 * 1000;

const MS_120 =
  HORAS_NAO_VIP * MS_HORA;


let usuarioRef = null;

let usuario = null;

let ehVip = false;

let userUid = null;

let intervalo = null;

let processando = false;


/* ==========================================
   MÊS ATUAL
========================================== */

function mesAtual(){

  const agora =
    new Date();

  return (
    agora.getFullYear() +
    "-" +
    String(
      agora.getMonth()+1
    ).padStart(2,"0")
  );

}


/* ==========================================
   CONFIGURAÇÃO DAS CAIXAS
========================================== */

const caixas = {

  "2026-09": {

    titulo:
      "🇧🇷 Caixa da Independência",

    subtitulo:
      "Recompensa especial de Setembro.",

    itens: [

      ["🎩","500 Chapéus de Bobo"],

      ["🔧","3.000 Ferramentas de Rubi"],

      ["📦","1.000 Itens"],

      ["🎰","2 Giros da Roleta"],

      ["🎉","Evento do Dia"],

      ["🔑","1 Chave da Independência"]

    ]

  },


  "2026-10": {

    titulo:
      "🎃 Caixa Halloween",

    subtitulo:
      "Uma recompensa assustadoramente especial.",

    itens: [

      ["🔑","1 Chave do Halloween"],

      ["🎰","2 Giros da Roleta"],

      ["🎟️","2 Chances no site"],

      ["🎩","600 Chapéus de Bobo"],

      ["📦","1.000 Itens"],

      ["🥘","1.000 Comidas do Castor"],

      ["🎉","Evento do Dia"]

    ]

  }

};


function configuracaoMes(){

  const mes =
    mesAtual();

  if(
    caixas[mes]
  ){

    return caixas[mes];

  }


  return {

    titulo:
      "🎁 Caixa do Mês",

    subtitulo:
      "Recompensa especial Adam Games.",

    itens:[]

  };

}


function carregarVisual(){

  const config =
    configuracaoMes();


  boxTitle.textContent =
    config.titulo;


  boxSubtitle.textContent =
    config.subtitulo;


  prizeList.innerHTML =
    "";


  config.itens.forEach(
    item => {

      const div =
        document.createElement("div");

      div.className =
        "prize";

      div.innerHTML =
        "<span>" +
        item[0] +
        "</span>" +
        "<b>" +
        item[1] +
        "</b>";

      prizeList.appendChild(
        div
      );

    }
  );

}


/* ==========================================
   FORMATAR DATA
========================================== */

function formatarData(
  valor
){

  if(!valor){

    return "";

  }


  let data;


  if(
    typeof valor.toDate ===
    "function"
  ){

    data =
      valor.toDate();

  }
  else{

    data =
      new Date(valor);

  }


  if(
    Number.isNaN(
      data.getTime()
    )
  ){

    return "";

  }


  return data.toLocaleString(
    "pt-BR",
    {
      dateStyle:"short",
      timeStyle:"medium"
    }
  );

}


/* ==========================================
   BUSCAR CADASTRO
========================================== */

async function buscarCadastro(user){

  let resultado =
    await getDocs(

      query(

        collection(
          db,
          "admins"
        ),

        where(
          "uid",
          "==",
          user.uid
        )

      )

    );


  if(
    !resultado.empty
  ){

    return resultado.docs[0];

  }


  if(
    user.email
  ){

    resultado =
      await getDocs(

        query(

          collection(
            db,
            "admins"
          ),

          where(
            "email",
            "==",
            user.email
          )

        )

      );


    if(
      !resultado.empty
    ){

      return resultado.docs[0];

    }

  }


  return null;

}


/* ==========================================
   TIMER NÃO VIP
========================================== */

async function iniciarTimerNaoVip(){

  let fim = null;


  if(
    usuario.proximaChance &&
    typeof usuario.proximaChance.toMillis ===
    "function"
  ){

    fim =
      usuario.proximaChance.toMillis();

  }


  if(
    !fim
  ){

    fim =
      Date.now() +
      MS_120;


    await updateDoc(

      usuarioRef,

      {

        proximaChance:
          Timestamp.fromMillis(fim)

      }

    );

  }


  atualizarTimerNaoVip(
    fim
  );

}


function atualizarTimerNaoVip(
  fim
){

  if(intervalo){

    clearInterval(
      intervalo
    );

  }


  async function tick(){

    const restante =
      fim -
      Date.now();


    if(
      restante > 0
    ){

      timer.textContent =
        formatarTimer(
          restante
        );

      progressBar.style.width =
        Math.min(
          100,
          (
            restante /
            MS_120
          ) * 100
        ) +
        "%";

      status.textContent =
        "⏳ Sua próxima chance está contando automaticamente.";

      status.className =
        "status waiting";

      return;

    }


    timer.textContent =
      "00:00:00";

    progressBar.style.width =
      "0%";


    try{

      const chances =
        Number(
          usuario.chances || 0
        ) + 1;


      const novoFim =
        Date.now() +
        MS_120;


      await updateDoc(

        usuarioRef,

        {

          chances:
            chances,

          proximaChance:
            Timestamp.fromMillis(
              novoFim
            )

        }

      );


      usuario.chances =
        chances;


      usuario.proximaChance =
        Timestamp.fromMillis(
          novoFim
        );


      chanceNumber.textContent =
        chances;


      status.textContent =
        "🎟️ +1 chance liberada!";

      status.className =
        "status available";


      fim =
        novoFim;

    }

    catch(error){

      console.error(
        error
      );

      status.textContent =
        "⚠️ Erro ao liberar sua chance.";

      status.className =
        "status locked";

    }

  }


  await tick();


  intervalo =
    setInterval(
      tick,
      1000
    );

}


/* ==========================================
   TIMER
========================================== */

function formatarTimer(ms){

  const total =
    Math.max(
      0,
      Math.floor(ms / 1000)
    );


  const h =
    Math.floor(
      total / 3600
    );


  const m =
    Math.floor(
      (total % 3600) / 60
    );


  const s =
    total % 60;


  return (
    String(h).padStart(2,"0") +
    ":" +
    String(m).padStart(2,"0") +
    ":" +
    String(s).padStart(2,"0")
  );

}


/* ==========================================
   CARREGAR
========================================== */

async function carregar(user){

  userUid =
    user.uid;


  const documento =
    await buscarCadastro(
      user
    );


  if(!documento){

    vipStatus.textContent =
      "🔒 NÃO VIP";

    status.textContent =
      "Conta não encontrada.";

    status.className =
      "status locked";

    return;

  }


  usuario =
    documento.data();


  usuarioRef =
    documento.ref;


  ehVip =
    usuario.vip === true;


  chanceNumber.textContent =
    Number(
      usuario.chances || 0
    );


  carregarVisual();


  /* ========================================
     VIP
  ======================================== */

  if(ehVip){

    vipStatus.textContent =
      "👑 VIP ATIVO";


    const mes =
      mesAtual();


    const resgatadoNoMes =
      usuario.caixaBoxMes === mes;


    if(
      resgatadoNoMes
    ){

      timer.textContent =
        "RESGATADA";


      progressBar.style.width =
        "100%";


      status.textContent =
        "✅ Caixa deste mês já foi resgatada.";

      status.className =
        "status available";


      rescue.disabled =
        true;


      rescue.textContent =
        "🎁 CAIXA JÁ RESGATADA";


      if(
        usuario.caixaBoxResgatadaEm
      ){

        rescueDate.textContent =
          "Resgatada em: " +
          formatarData(
            usuario.caixaBoxResgatadaEm
          );

      }


      message.textContent =
        "Uma nova Caixa será liberada no dia 1º do próximo mês.";

      return;

    }


    timer.textContent =
      "DISPONÍVEL";


    progressBar.style.width =
      "100%";


    status.textContent =
      "🎟️ Sua Caixa deste mês está disponível!";

    status.className =
      "status available";


    rescue.disabled =
      false;


    rescue.textContent =
      "🎁 RESGATAR CAIXA";


    message.textContent =
      "Você pode resgatar 1 Caixa Box por mês.";

    return;

  }


  /* ========================================
     NÃO VIP
  ======================================== */

  vipStatus.textContent =
    "🔒 NÃO VIP";


  rescue.disabled =
    true;


  rescue.textContent =
    "🔒 EXCLUSIVO VIP";


  message.textContent =
    "A Caixa Box é exclusiva para membros VIP.";


  await iniciarTimerNaoVip();

}


/* ==========================================
   RESGATAR CAIXA
========================================== */

rescue.addEventListener(
  "click",
  async () => {

    if(
      !ehVip ||
      !usuarioRef ||
      processando
    ){

      return;

    }


    const mes =
      mesAtual();


    /*
    Proteção contra duplo clique.
    */

    if(
      usuario.caixaBoxMes === mes
    ){

      return;

    }


    processando =
      true;


    rescue.disabled =
      true;


    rescue.textContent =
      "REGISTRANDO...";


    try{

      const agora =
        Timestamp.now();


      await updateDoc(

        usuarioRef,

        {

          caixaBoxMes:
            mes,

          caixaBoxResgatadaEm:
            agora,

          caixaBox:
            true

        }

      );


      usuario.caixaBoxMes =
        mes;


      usuario.caixaBoxResgatadaEm =
        agora;


      timer.textContent =
        "RESGATADA";


      progressBar.style.width =
        "100%";


      status.textContent =
        "🎉 Caixa resgatada com sucesso!";

      status.className =
        "status available";


      rescue.textContent =
        "🎁 CAIXA JÁ RESGATADA";


      rescueDate.textContent =
        "Resgatada em: " +
        formatarData(
          agora
        );


      message.textContent =
        "Seu resgate foi registrado. Uma nova Caixa estará disponível no próximo dia 1º.";

    }

    catch(error){

      console.error(
        "Erro Caixa:",
        error
      );


      rescue.disabled =
        false;


      rescue.textContent =
        "🎁 RESGATAR CAIXA";


      status.textContent =
        "⚠️ Não foi possível registrar o resgate.";

      status.className =
        "status locked";


      message.textContent =
        error.message ||
        "Tente novamente.";

    }

    finally{

      processando =
        false;

    }

  }
);


/* ==========================================
   BAÚ
========================================== */

document
  .getElementById("chest")
  .addEventListener(
    "click",
    () => {

      const elemento =
        document.getElementById("chest");


      elemento.style.transform =
        "scale(1.06)";


      setTimeout(
        () => {

          elemento.style.transform =
            "scale(1)";

        },
        180
      );

    }
  );


/* ==========================================
   VOLTAR
========================================== */

document
  .getElementById("back")
  .addEventListener(
    "click",
    () => {

      window.location.href =
        "painel.html";

    }
  );


/* ==========================================
   LOGIN
========================================== */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      window.location.href =
        "index.html";

      return;

    }


    try{

      await carregar(
        user
      );

    }
    catch(error){

      console.error(
        error
      );

      status.textContent =
        "⚠️ Erro ao carregar a Caixa.";

      status.className =
        "status locked";

    }

  }
);

</script>
