/* =====================================================
   FORMATAR DATA
===================================================== */

function formatarData(
  valor
){

  if(
    !valor
  ){

    return "";

  }


  let data;


  if(
    typeof valor.toDate ===
    "function"
  ){

    data =
      valor.toDate();

  }

  else{

    data =
      new Date(
        valor
      );

  }


  if(
    Number.isNaN(
      data.getTime()
    )
  ){

    return "";

  }


  return data.toLocaleString(
    "pt-BR",
    {

      dateStyle:
        "short",

      timeStyle:
        "medium"

    }
  );

}


/* =====================================================
   BUSCAR CADASTRO
===================================================== */

async function buscarCadastro(
  user
){

  let resultado;


  /*
  UID
  */

  resultado =
    await getDocs(

      query(

        collection(
          db,
          "admins"
        ),

        where(
          "uid",
          "==",
          user.uid
        )

      )

    );


  if(
    !resultado.empty
  ){

    return resultado.docs[0];

  }


  /*
  EMAIL
  */

  if(
    user.email
  ){

    resultado =
      await getDocs(

        query(

          collection(
            db,
            "admins"
          ),

          where(
            "email",
            "==",
            user.email
          )

        )

      );


    if(
      !resultado.empty
    ){

      return resultado.docs[0];

    }

  }


  return null;

}


/* =====================================================
   FORMATAR TIMER
===================================================== */

function formatarTimer(
  ms
){

  const total =
    Math.max(
      0,
      Math.floor(
        ms / 1000
      )
    );


  const horas =
    Math.floor(
      total / 3600
    );


  const minutos =
    Math.floor(
      (
        total % 3600
      ) / 60
    );


  const segundos =
    total % 60;


  return (

    String(
      horas
    ).padStart(
      2,
      "0"
    )

    +

    ":"

    +

    String(
      minutos
    ).padStart(
      2,
      "0"
    )

    +

    ":"

    +

    String(
      segundos
    ).padStart(
      2,
      "0"
    )

  );

}


/* =====================================================
   TIMER NÃO VIP
===================================================== */

async function iniciarTimerNaoVip(){

  let fim =
    null;


  /*
  Se já existe uma próxima chance
  no Firebase, usa ela.
  */

  if(

    usuario.proximaChance &&

    typeof
    usuario.proximaChance.toMillis
    ===
    "function"

  ){

    fim =
      usuario.proximaChance.toMillis();

  }


  /*
  Primeira entrada:
  começa imediatamente.
  */

  if(
    !fim
  ){

    fim =
      Date.now() +
      MS_120;


    await updateDoc(

      usuarioRef,

      {

        proximaChance:

          Timestamp.fromMillis(
            fim
          )

      }

    );

  }


  if(
    intervalo
  ){

    clearInterval(
      intervalo
    );

  }


  async function atualizar(){

    const restante =
      fim -
      Date.now();


    /*
    CONTANDO
    */

    if(
      restante > 0
    ){

      timer.textContent =
        formatarTimer(
          restante
        );


      progressBar.style.width =

        Math.max(
          0,
          Math.min(
            100,
            (
              restante /
              MS_120
            ) *
            100
          )
        )

        +

        "%";


      status.textContent =
        "⏳ Sua próxima chance está contando automaticamente.";


      status.className =
        "status waiting";


      return;

    }


    /*
    TIMER TERMINOU
    */

    timer.textContent =
      "00:00:00";


    progressBar.style.width =
      "0%";


    try{

      const chances =
        Number(
          usuario.chances || 0
        )
        +
        1;


      const novoFim =
        Date.now() +
        MS_120;


      await updateDoc(

        usuarioRef,

        {

          chances:
            chances,

          proximaChance:

            Timestamp.fromMillis(
              novoFim
            )

        }

      );


      usuario.chances =
        chances;


      usuario.proximaChance =
        Timestamp.fromMillis(
          novoFim
        );


      chanceNumber.textContent =
        chances;


      status.textContent =
        "🎟️ +1 chance liberada!";


      status.className =
        "status available";


      fim =
        novoFim;

    }

    catch(error){

      console.error(
        "Erro ao liberar chance:",
        error
      );


      status.textContent =
        "⚠️ Erro ao liberar sua chance.";


      status.className =
        "status locked";

    }

  }


  await atualizar();


  intervalo =
    setInterval(
      atualizar,
      1000
    );

}

    status.textContent =

    status.className =

      false;


    rescue.textContent =
      "🎁 RESGATAR CAIXA";


    message.textContent =
      "Você pode resgatar 1 Caixa Box por mês.";


    rescueDate.textContent =
      "";


    return;

  }


  /* =================================================
     NÃO VIP
  ================================================= */

  vipStatus.textContent =
    "🔒 NÃO VIP";


  chanceDescription.textContent =
    "A cada 120 horas você recebe +1 chance. A Caixa Box continua exclusiva para membros VIP.";


  rescue.disabled =
    true;


  rescue.textContent =
    "🔒 EXCLUSIVO VIP";


  message.textContent =
    "A Caixa Box é exclusiva para membros VIP.";


  await iniciarTimerNaoVip();

}


/* =====================================================
   RESGATAR CAIXA
===================================================== */

rescue.addEventListener(

  "click",

  async () => {


    if(
      !ehVip ||
      !usuarioRef ||
      processando
    ){

      return;

    }


    const mes =
      mesAtual();


    /*
    Proteção contra duplo resgate.
    */

    if(
      usuario.caixaBoxMes ===
      mes
    ){

      return;

    }


    processando =
      true;


    rescue.disabled =
      true;


    rescue.textContent =
      "REGISTRANDO...";


    try{

      /*
      Data e hora exatas.
      */

      const agora =
        Timestamp.now();


      /*
      Registra somente o controle
      do resgate.
      */

      await updateDoc(

        usuarioRef,

        {

          caixaBoxMes:
            mes,

          caixaBoxResgatadaEm:
            agora,

          caixaBox:
            true

        }

      );


      /*
      Atualiza memória da página.
      */

      usuario.caixaBoxMes =
        mes;


      usuario.caixaBoxResgatadaEm =
        agora;


      /*
      Mostra resultado.
      */

      timer.textContent =
        "RESGATADA";


      progressBar.style.width =
        "100%";


      status.textContent =
        "🎉 Caixa resgatada com sucesso!";


      status.className =
        "status available";


      rescue.textContent =
        "🎁 CAIXA JÁ RESGATADA";


      rescueDate.textContent =

        "Resgatada em: " +

        formatarData(
          agora
        );


      message.textContent =
        "Seu resgate foi registrado. Uma nova Caixa estará disponível no próximo dia 1º.";

    }

    catch(error){

      console.error(
        "Erro ao registrar Caixa:",
        error
      );


      rescue.disabled =
        false;


      rescue.textContent =
        "🎁 RESGATAR CAIXA";


      status.textContent =
        "⚠️ Não foi possível registrar o resgate.";


      status.className =
        "status locked";


      message.textContent =
        error.message ||
        "Tente novamente.";

    }

    finally{

      processando =
        false;

    }

  }

);


/* =====================================================
   CLIQUE NO BAÚ
===================================================== */

document
  .getElementById("chest")
  .addEventListener(

    "click",

    () => {

      const elemento =
        document.getElementById(
          "chest"
        );


      elemento.style.transform =
        "scale(1.06)";


      setTimeout(
        () => {

          elemento.style.transform =
            "scale(1)";

        },
        180
      );

    }

  );


/* =====================================================
   VOLTAR
===================================================== */

document
  .getElementById("back")
  .addEventListener(

    "click",

    () => {

      window.location.href =
        "painel.html";

    }

  );


/* =====================================================
   LOGIN
===================================================== */

onAuthStateChanged(

  auth,

  async user => {


    if(
      !user
    ){

      window.location.href =
        "index.html";

      return;

    }


    try{

      await carregar(
        user
      );

    }

    catch(error){

      console.error(
        "Erro ao carregar Caixa:",
        error
      );


      vipStatus.textContent =
        "⚠️ ERRO";


      status.textContent =
        "Não foi possível carregar a Caixa.";


      status.className =
        "status locked";

    }

  }

);

</script>
