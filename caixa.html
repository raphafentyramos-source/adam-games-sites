/* =====================================================
   CAIXA ATIVA
===================================================== */

function configuracaoMes(){

  const agora =
    new Date();


  const ano =
    agora.getFullYear();


  const mes =
    agora.getMonth() + 1;


  /*
    TESTE DA CAIXA DE SETEMBRO

    Durante agosto de 2026,
    setembro fica visível para testes.

    Em setembro inteiro,
    setembro continua ativo.

    A partir de outubro,
    muda automaticamente.
  */

  if(
    ano === 2026 &&
    (
      mes === 8 ||
      mes === 9
    )
  ){

    return caixas["09"];

  }


  if(
    mes === 10
  ){

    return caixas["10"];

  }


  if(
    mes === 11
  ){

    return caixas["11"];

  }


  if(
    mes === 12
  ){

    return caixas["12"];

  }


  return caixas["09"];

}


/* =====================================================
   IDENTIFICADOR DO MÊS DA CAIXA
===================================================== */

function identificadorCaixa(){

  const agora =
    new Date();


  /*
    Durante agosto de 2026,
    a caixa de teste é setembro.
  */

  if(
    agora.getFullYear() === 2026 &&
    agora.getMonth() === 7
  ){

    return "2026-09";

  }


  return (

    agora.getFullYear() +

    "-" +

    String(
      agora.getMonth() + 1
    ).padStart(
      2,
      "0"
    )

  );

}

/* =====================================================
   CONVERTER DATA FIREBASE
===================================================== */

function converterData(
  valor
){

  if(
    !valor
  ){

    return null;

  }


  if(
    typeof valor.toMillis ===
    "function"
  ){

    return valor.toMillis();

  }


  if(
    typeof valor.seconds ===
    "number"
  ){

    return valor.seconds * 1000;

  }


  return null;

}


/* =====================================================
   FORMATAR DATA
===================================================== */

function formatarData(
  valor
){

  const millis =
    converterData(
      valor
    );


  if(
    !millis
  ){

    return "";

  }


  return new Date(
    millis
  ).toLocaleString(
    "pt-BR",
    {
      dateStyle:"short",
      timeStyle:"medium"
    }
  );

}


/* =====================================================
   TIMER
===================================================== */

function formatarTimer(
  ms
){

  const total =
    Math.max(
      0,
      Math.floor(
        ms / 1000
      )
    );


  const horas =
    Math.floor(
      total / 3600
    );


  const minutos =
    Math.floor(
      (
        total % 3600
      ) / 60
    );


  const segundos =
    total % 60;


  return (

    String(
      horas
    ).padStart(
      2,
      "0"
    )

    +

    ":"

    +

    String(
      minutos
    ).padStart(
      2,
      "0"
    )

    +

    ":"

    +

    String(
      segundos
    ).padStart(
      2,
      "0"
    )

  );

}


/* =====================================================
   BUSCAR CADASTRO
===================================================== */

async function buscarCadastro(
  user
){

  let resultado;


  resultado =
    await getDocs(

      query(

        collection(
          db,
          "admins"
        ),

        where(
          "uid",
          "==",
          user.uid
        )

      )

    );


  if(
    !resultado.empty
  ){

    return resultado.docs[0];

  }


  if(
    user.email
  ){

    resultado =
      await getDocs(

        query(

          collection(
            db,
            "admins"
          ),

          where(
            "email",
            "==",
            user.email
          )

        )

      );


    if(
      !resultado.empty
    ){

      return resultado.docs[0];

    }

  }


  return null;

}

async function criarNotificacaoChance(){

  if(
    !usuario
  ){

    return;

  }


  const id =
    "chance_" +
    usuario.uid +
    "_" +
    Date.now();


  try{

    await criarNotificacao(

      id,

      "🎟️ Nova chance disponível!",

      "Você recebeu +1 chance para usar nos jogos.",

      "chance"

    );

  }

  catch(error){

    console.warn(
      "Não foi possível criar notificação da chance:",
      error
    );

  }

}


/* =====================================================
   CRONÔMETRO
===================================================== */

async function iniciarCronometro(){

  if(
    !usuarioRef
  ){

    return;

  }


  const duracao =
    ehVip
      ? MS_VIP
      : MS_NAO_VIP;


  const horas =
    ehVip
      ? HORAS_VIP
      : HORAS_NAO_VIP;


  let fim =
    converterData(
      usuario.proximaChance
    );


  /*
    PRIMEIRA VEZ

    Se ainda não houver contador,
    começa agora.
  */

  if(
    !fim
  ){

    fim =
      Date.now() +
      duracao;


    const timestamp =
      Timestamp.fromMillis(
        fim
      );


    await updateDoc(

      usuarioRef,

      {

        proximaChance:
          timestamp

      }

    );


    usuario.proximaChance =
      timestamp;

  }


  if(
    intervalo
  ){

    clearInterval(
      intervalo
    );

  }


  async function atualizar(){

    const restante =
      fim -
      Date.now();


    /*
      CONTANDO
    */

    if(
      restante > 0
    ){

      timer.textContent =
        formatarTimer(
          restante
        );


      progressBar.style.width =

        Math.max(
          0,
          Math.min(
            100,
            (
              restante /
              duracao
            ) * 100
          )
        ) +

        "%";


      timerLabel.textContent =
        "PRÓXIMA CHANCE EXTRA";


      status.textContent =
        "⏳ Próxima chance em " +
        horas +
        " horas.";


      status.className =
        "status waiting";


      return;

    }


    /*
      TIMER ZEROU
    */

    try{

      const atuais =
        Number(
          usuario.chances || 0
        );


      const novas =
        atuais + 1;


      const novoFim =
        Date.now() +
        duracao;


      const timestamp =
        Timestamp.fromMillis(
          novoFim
        );


      await updateDoc(

        usuarioRef,

        {

          chances:
            novas,

          proximaChance:
            timestamp

        }

      );


      usuario.chances =
        novas;


      usuario.proximaChance =
        timestamp;


      chanceNumber.textContent =
        novas;


      fim =
        novoFim;


      timer.textContent =
        formatarTimer(
          duracao
        );


      progressBar.style.width =
        "100%";


      status.textContent =
        "🎟️ +1 chance liberada!";


      status.className =
        "status available";


      await criarNotificacaoChance();

    }

    catch(error){

      console.error(
        "Erro ao liberar chance:",
        error
      );


      status.textContent =
        "⚠️ Erro ao liberar chance.";


      status.className =
        "status locked";

    }

  }


  await atualizar();


  intervalo =
    setInterval(
      atualizar,
      1000
    );

}


/* =====================================================
   CARREGAR USUÁRIO
===================================================== */

async function carregar(
  user
){

  const documento =
    await buscarCadastro(
      user
    );


  if(
    !documento
  ){

    vipStatus.textContent =
      "🔒 CONTA NÃO ENCONTRADA";


    timer.textContent =
      "—";


    status.textContent =
      "Conta não encontrada.";


    status.className =
      "status locked";


    rescue.disabled =
      true;


    return;

  }


  usuario =
    documento.data();


  usuarioRef =
    documento.ref;


  /*
    Garante UID para notificações.
  */

  if(
    !usuario.uid
  ){

    usuario.uid =
      user.uid;

  }


  ehVip =
    usuario.vip === true;


  /*
    CARREGA A CAIXA PRIMEIRO
  */

  carregarVisual();


  /*
    CARREGA CHANCES
  */

  chanceNumber.textContent =
    Number(
      usuario.chances || 0
    );


  /*
    VIP
  */

  if(
    ehVip
  ){

    vipStatus.textContent =
      "👑 VIP ATIVO";


    chanceDescription.textContent =
      "A cada 72 horas você recebe +1 chance para usar nos jogos.";

  }

  else{

    vipStatus.textContent =
      "🔒 NÃO VIP";


    chanceDescription.textContent =
      "A cada 120 horas você recebe +1 chance para usar nos jogos.";

  }


  /*
    CAIXA BOX
    1 RESGATE POR MÊS
  */

  if(
    ehVip
  ){

    const mesControle =
      identificadorCaixa();


    if(
      usuario.caixaBoxMes ===
      mesControle
    ){

      timerLabel.textContent =
        "PRÓXIMA CHANCE EXTRA";


      rescue.disabled =
        true;


      rescue.textContent =
        "🎁 CAIXA JÁ RESGATADA";


      status.textContent =
        "✅ Caixa deste mês já foi resgatada.";


      status.className =
        "status available";


      message.textContent =
        "Uma nova Caixa estará disponível no próximo mês.";


      if(
        usuario.caixaBoxResgatadaEm
      ){

        rescueDate.textContent =

          "Resgatada em: " +

          formatarData(
            usuario.caixaBoxResgatadaEm
          );

      }

    }

    else{

      rescue.disabled =
        false;


      rescue.textContent =
        "🎁 RESGATAR CAIXA";


      status.textContent =
        "🎟️ Sua Caixa deste mês está disponível!";


      status.className =
        "status available";


      message.textContent =
        "Você pode resgatar 1 Caixa Box por mês.";


      rescueDate.textContent =
        "";

    }


    /*
      NOTIFICAÇÃO DA CAIXA
    */

    await verificarNotificacaoCaixa();

  }

  else{

    rescue.disabled =
      true;


    rescue.textContent =
      "🔒 EXCLUSIVO VIP";


    message.textContent =
      "A Caixa Box é exclusiva para membros VIP.";

  }


  /*
    CRONÔMETRO DE CHANCES
  */

  await iniciarCronometro();

}


/* =====================================================
   RESGATAR CAIXA
===================================================== */

rescue.addEventListener(

  "click",

  async () => {


    if(
      !ehVip ||
      !usuarioRef ||
      processando
    ){

      return;

    }


    const mesControle =
      identificadorCaixa();


    /*
      PROTEÇÃO
      1 RESGATE POR MÊS
    */

    if(
      usuario.caixaBoxMes ===
      mesControle
    ){

      return;

    }


    processando =
      true;


    rescue.disabled =
      true;


    rescue.textContent =
      "REGISTRANDO...";


    try{

      const agora =
        Timestamp.now();


      await updateDoc(

        usuarioRef,

        {

          caixaBoxMes:
            mesControle,

          caixaBoxResgatadaEm:
            agora,

          caixaBox:
            true

        }

      );


      usuario.caixaBoxMes =
        mesControle;


      usuario.caixaBoxResgatadaEm =
        agora;


      rescue.textContent =
        "🎁 CAIXA JÁ RESGATADA";


      status.textContent =
        "🎉 Caixa resgatada com sucesso!";


      status.className =
        "status available";


      message.textContent =
        "Seu resgate foi registrado.";


      rescueDate.textContent =

        "Resgatada em: " +

        formatarData(
          agora
        );

    }

    catch(error){

      console.error(
        "Erro ao registrar Caixa:",
        error
      );


      rescue.disabled =
        false;


      rescue.textContent =
        "🎁 RESGATAR CAIXA";


      status.textContent =
        "⚠️ Não foi possível registrar o resgate.";


      status.className =
        "status locked";


      message.textContent =
        error.message ||
        "Tente novamente.";

    }

    finally{

      processando =
        false;

    }

  }

);
