<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Adam Games • Chat</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#031a35;color:#fff}body{overflow:hidden}.chat-page{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% -10%,rgba(24,143,255,.2),transparent 35%),#031a35}.top{height:76px;min-height:76px;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.1);background:rgba(4,27,57,.97);backdrop-filter:blur(15px)}.top button{border:0;color:#fff;background:#12385f;border-radius:15px;height:48px;padding:0 15px;font-weight:900;font-size:14px;cursor:pointer}.back{font-size:24px!important;padding:0 16px!important}.brand{flex:1;min-width:0}.brand strong{display:block;font-size:20px}.brand small{color:#8eafd0}.status{display:flex;align-items:center;gap:7px;background:#09294d!important}.dot{width:10px;height:10px;border-radius:50%;background:#21d36b}.offline .dot{background:#8994a2}.actions{display:flex;gap:7px}.body{flex:1;min-height:0;display:flex}.rooms{width:300px;min-width:300px;border-right:1px solid rgba(255,255,255,.1);background:#041a34;display:flex;flex-direction:column}.room-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}.tab{border:0;border-radius:13px;padding:12px 7px;background:#0a2b50;color:#aac6df;font-weight:900;font-size:13px}.tab.active{background:#168fff;color:#fff}.search{margin:0 12px 12px;padding:13px;border-radius:13px;border:1px solid rgba(255,255,255,.1);background:#08284b;color:#fff;outline:none;width:calc(100% - 24px);font-size:14px}.search-btn{margin:0 12px 12px;padding:12px;border:0;border-radius:13px;background:#ffd02f;color:#14233a;font-weight:900}.list{flex:1;overflow:auto;padding:0 10px 20px}.item{display:flex;align-items:center;gap:10px;padding:11px;border-radius:14px;margin-bottom:6px;cursor:pointer}.item:hover,.item.active{background:rgba(22,143,255,.17)}.avatar{width:45px;height:45px;min-width:45px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#ffd64a,#ed9e00);font-size:25px}.item-text{min-width:0;flex:1}.item-name{font-weight:900;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-last{font-size:11px;color:#8eafd0;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{flex:1;min-width:0;display:flex;flex-direction:column}.head{height:78px;min-height:78px;padding:10px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.1);background:#07284e}.head-title{font-size:18px;font-weight:900}.head-sub{font-size:12px;color:#8eafd0;margin-top:3px}.messages{flex:1;overflow:auto;padding:18px 20px}.empty{text-align:center;color:#87a9c9;padding:60px 20px;font-size:15px}.msg{display:flex;margin:9px 0}.msg.me{justify-content:flex-end}.wrap{max-width:min(75%,620px)}.name{font-size:10px;color:#8eafd0;margin:0 8px 4px}.msg.me .name{text-align:right}.bubble{background:#0b315c;padding:11px 14px;border-radius:17px 17px 17px 5px;line-height:1.4;word-break:break-word}.msg.me .bubble{background:#168fff;border-radius:17px 17px 5px 17px}.time{font-size:9px;color:#6f92b2;margin:4px 8px}.msg.me .time{text-align:right}.compose{display:flex;gap:8px;padding:11px;border-top:1px solid rgba(255,255,255,.1);background:#041a34}.input{flex:1;resize:none;height:48px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:#08284b;color:#fff;padding:13px;outline:none;font-family:inherit}.send{width:55px;border:0;border-radius:14px;background:#168fff;color:#fff;font-size:22px;font-weight:900}.privacy{padding:12px;border-top:1px solid rgba(255,255,255,.08);background:#03172d}.privacy button{width:100%;padding:11px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:#0a2b50;color:#fff;font-weight:900}.result{margin:0 12px 12px;padding:10px;border-radius:13px;background:#092c50}.result .call{margin-top:8px;width:100%;padding:10px;border:0;border-radius:10px;background:#1fca6a;color:#05251a;font-weight:900}.notice{padding:30px 15px;text-align:center;color:#88aaca;line-height:1.5}.off{opacity:.65}
@media(max-width:700px){.top{height:68px;min-height:68px;padding:8px 10px}.top button{height:44px;padding:0 11px}.back{font-size:22px!important}.brand strong{font-size:16px}.brand small{font-size:10px}.actions button span.label{display:none}.rooms{width:100%;min-width:100%;border-right:0}.main{display:none}.body.private-open .rooms{display:none}.body.private-open .main{display:flex}.body.room-open .rooms{display:none}.body.room-open .main{display:flex}.room-tabs{grid-template-columns:1fr 1fr}.item{padding:12px}.compose{padding-bottom:max(11px,env(safe-area-inset-bottom))}.wrap{max-width:88%}.status-text{display:none}.head{height:68px;min-height:68px}.head:before{content:'←';font-size:26px;margin-right:3px;cursor:pointer}.head-back{display:block}.actions{gap:5px}.top .privacy-top{display:none}}
</style>
</head>
<body>
<div class="chat-page">
  <header class="top">
    <button class="back" id="backBtn">←</button>
    <div class="brand"><strong>💬 Chat Adam Games</strong><small>Converse com segurança</small></div>
    <button class="status" id="statusBtn"><span class="dot"></span><span class="status-text">Online</span></button>
    <div class="actions">
      <button class="privacy-top" id="privacyBtn">⚙️ Privacidade</button>
      <button id="minBtn">—</button>
      <button id="closeBtn">⏻</button>
    </div>
  </header>
  <div class="body" id="body">
    <aside class="rooms">
      <div class="room-tabs"><button class="tab active" id="roomsTab">🌎 Geral</button><button class="tab" id="privateTab">🔒 Privados</button></div>
      <input class="search" id="idSearch" placeholder="🔎 Procurar pessoa por ID" autocomplete="off">
      <button class="search-btn" id="searchBtn">PROCURAR POR ID</button>
      <div id="searchResult"></div>
      <div class="list" id="list"><div class="notice">Carregando...</div></div>
      <div class="privacy"><button id="privacySide">🔒 Permitir chamadas privadas: <b id="privacyState">SIM</b></button></div>
    </aside>
    <main class="main">
      <div class="head"><div class="avatar" id="headAvatar">🌎</div><div><div class="head-title" id="headTitle">Chat Geral</div><div class="head-sub" id="headSub">Todos os usuários</div></div></div>
      <div class="messages" id="messages"><div class="empty">Carregando chat...</div></div>
      <form class="compose" id="form"><textarea class="input" id="input" maxlength="1000" placeholder="Digite sua mensagem..."></textarea><button class="send">➤</button></form>
    </main>
  </div>
</div>
<script type="module">
import {initializeApp,getApps,getApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,query,where,getDocs,getDoc,addDoc,updateDoc,doc,setDoc,onSnapshot,orderBy,limit,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",authDomain:"adam-games-21081.firebaseapp.com",projectId:"adam-games-21081",storageBucket:"adam-games-21081.firebasestorage.app",messagingSenderId:"1055528418738",appId:"1:1055528418738:web:5fafdf63424ba9744eb8ab",measurementId:"G-KVFSF864GE"};
const app=getApps().length?getApp():initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const ADMIN="raphafentyramos@gmail.com";
let usuario=null,cadastro=null,unsubscribe=null,modo="geral",alvo=null,online=true;
const $=id=>document.getElementById(id), esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
const av=v=>String(v||"🙂");
const chatId=(a,b)=>[a,b].sort().join("_");
function dt(ts){if(!ts)return "";const d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}
async function loadCadastro(u){const q=query(collection(db,"admins"),where("uid","==",u.uid));const s=await getDocs(q);if(s.empty)return {id:null,nome:u.displayName||"Usuário",avatar:"🙂",vip:false,aceitaChamadasPrivadas:true};return {id:s.docs[0].id,...s.docs[0].data()};}
function stop(){if(unsubscribe){unsubscribe();unsubscribe=null}}
function setMain(title,sub,icon){$("headTitle").textContent=title;$("headSub").textContent=sub;$("headAvatar").textContent=icon}
function listenMessages(ref,privateMode=false){stop();$("messages").innerHTML='<div class="empty">Carregando mensagens...</div>';const q=query(ref,orderBy("criadoEm","asc"),limit(300));unsubscribe=onSnapshot(q,s=>{const area=$("messages");area.innerHTML="";if(s.empty){area.innerHTML='<div class="empty">Ainda não há mensagens. Seja o primeiro a falar! 👋</div>';return}s.forEach(d=>{const m=d.data(),me=m.remetenteUid===usuario.uid,e=document.createElement("div");e.className="msg"+(me?" me":"");e.innerHTML='<div class="wrap"><div class="name">'+(me?"Você":esc(m.remetenteNome||"Usuário"))+(m.remetenteVip===true?" 👑":"")+'</div><div class="bubble">'+esc(m.texto||"")+'</div><div class="time">'+dt(m.criadoEm)+'</div></div>';area.appendChild(e)});area.scrollTop=area.scrollHeight},e=>{$("messages").innerHTML='<div class="empty">Não foi possível carregar as mensagens.<br><small>'+esc(e.message)+'</small></div>'})}
async function ensureGeneral(){const r=doc(db,"salas","geral"),s=await getDoc(r);if(!s.exists())await setDoc(r,{nome:"Chat Geral",descricao:"Todos os usuários",icone:"🌎",publica:true,criadoEm:serverTimestamp()})}
async function openGeneral(){modo="geral";alvo=null;$("body").classList.add("room-open");$("body").classList.remove("private-open");setMain("Chat Geral","Todos os usuários","🌎");await ensureGeneral();listenMessages(collection(db,"salas","geral","mensagens"));loadRooms()}
async function loadRooms(){const list=$("list");list.innerHTML='<div class="notice">Carregando...</div>';try{const s=await getDocs(collection(db,"salas"));const rooms=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.id==="geral"||x.publica!==false);rooms.sort((a,b)=>a.id==="geral"?-1:b.id==="geral"?1:String(a.nome||"").localeCompare(String(b.nome||"")));list.innerHTML="";rooms.forEach(r=>{const e=document.createElement("div");e.className="item";e.innerHTML='<div class="avatar">'+esc(r.icone||"🏠")+'</div><div class="item-text"><div class="item-name">'+esc(r.nome||r.id)+'</div><div class="item-last">'+esc(r.descricao||"Sala Adam Games")+'</div></div>';e.onclick=()=>openRoom(r);list.appendChild(e)})}catch(e){list.innerHTML='<div class="notice">Não foi possível carregar as salas.<br><small>'+esc(e.message)+'</small></div>'}}
function openRoom(r){modo="geral";alvo=null;$("body").addClass("room-open");$("body").removeClass("private-open");setMain(r.nome||"Sala","Sala Adam Games",r.icone||"🏠");listenMessages(collection(db,"salas",r.id,"mensagens"));}
async function loadPrivates(){modo="privados";$("body").addClass("room-open");$("body").removeClass("private-open");$("list").innerHTML='<div class="notice">Carregando conversas...</div>';$("idSearch").placeholder="🔎 Procurar pessoa por ID";try{const s=await getDocs(query(collection(db,"conversas"),where("participantes","array-contains",usuario.uid)));const cs=s.docs.map(d=>({id:d.id,...d.data()}));cs.sort((a,b)=>(b.ultimaMensagemEm?.seconds||0)-(a.ultimaMensagemEm?.seconds||0));$("list").innerHTML="";if(!cs.length){$("list").innerHTML='<div class="notice">Nenhuma conversa privada ainda.<br><br>Procure uma pessoa pelo ID acima para iniciar.</div>';return}cs.forEach(c=>{const other=c.participantes.find(x=>x!==usuario.uid),name=c.nomes?.[other]||"Usuário",icon=c.avatars?.[other]||"🙂";const e=document.createElement("div");e.className="item";e.innerHTML='<div class="avatar">'+esc(icon)+'</div><div class="item-text"><div class="item-name">'+esc(name)+'</div><div class="item-last">'+esc(c.ultimaMensagem||"Sem mensagens")+'</div></div>';e.onclick=()=>openPrivate(c,other,name,icon);$("list").appendChild(e)})}catch(e){$("list").innerHTML='<div class="notice">Não foi possível carregar os privados.<br><small>'+esc(e.message)+'</small></div>'}}
async function searchId(){const id=$("idSearch").value.trim().replace(/^#/,"");const box=$("searchResult");box.innerHTML="";if(!id){box.innerHTML='<div class="notice">Digite o ID da pessoa.</div>';return}try{const s=await getDocs(query(collection(db,"admins"),where("publicId","==",id)));if(s.empty){box.innerHTML='<div class="notice">Nenhuma pessoa encontrada com esse ID.</div>';return}const d=s.docs[0],u={id:d.id,...d.data()};if(u.uid===usuario.uid){box.innerHTML='<div class="notice">Esse é o seu próprio ID.</div>';return}const e=document.createElement("div");e.className="result";e.innerHTML='<b>'+esc(u.nome||"Usuário")+'</b>'+(u.vip===true?' 👑':'')+'<br><small>ID: '+esc(u.publicId||id)+'</small><button class="call">🔒 CHAMAR NO PRIVADO</button>';e.querySelector("button").onclick=()=>startPrivate(u);box.appendChild(e)}catch(e){box.innerHTML='<div class="notice">Erro na busca.<br><small>'+esc(e.message)+'</small></div>'}}
async function startPrivate(u){if(u.aceitaChamadasPrivadas===false){alert("Esse usuário não permite chamadas privadas.");return}const id=chatId(usuario.uid,u.uid),r=doc(db,"conversas",id);let s=await getDoc(r);if(!s.exists()){await setDoc(r,{participantes:[usuario.uid,u.uid],nomes:{[usuario.uid]:cadastro.nome||"Usuário",[u.uid]:u.nome||"Usuário"},avatars:{[usuario.uid]:av(cadastro.avatar),[u.uid]:av(u.avatar)},ultimaMensagem:"",ultimaMensagemEm:null,ultimoRemetenteUid:"",criadoEm:serverTimestamp()});s=await getDoc(r)}openPrivate({id:r.id,...s.data()},u.uid,u.nome||"Usuário",av(u.avatar));}
function openPrivate(c,other,name,icon){modo="privados";alvo={id:c.id,outroUid:other};$("body").addClass("private-open");$("body").removeClass("room-open");setMain(name,"🔒 Conversa privada",icon);listenMessages(collection(db,"conversas",c.id,"mensagens"),true);updateDoc(doc(db,"conversas",c.id),{ultimaMensagemLida:true}).catch(()=>{})}
async function send(){const text=$("input").value.trim();if(!text||!usuario)return;try{if(modo==="privados"&&alvo){await addDoc(collection(db,"conversas",alvo.id,"mensagens"),{texto:text,remetenteUid:usuario.uid,remetenteNome:cadastro.nome||"Usuário",remetenteAvatar:av(cadastro.avatar),remetenteVip:cadastro.vip===true,destinatarioUid:alvo.outroUid,criadoEm:serverTimestamp(),lida:false});await updateDoc(doc(db,"conversas",alvo.id),{ultimaMensagem:text,ultimaMensagemEm:serverTimestamp(),ultimoRemetenteUid:usuario.uid,ultimaMensagemLida:false})}else{await addDoc(collection(db,"salas","geral","mensagens"),{texto:text,remetenteUid:usuario.uid,remetenteNome:cadastro.nome||"Usuário",remetenteAvatar:av(cadastro.avatar),remetenteVip:cadastro.vip===true,criadoEm:serverTimestamp()});await updateDoc(doc(db,"salas","geral"),{ultimaMensagem:text,ultimaMensagemEm:serverTimestamp(),ultimoRemetenteUid:usuario.uid}).catch(()=>{})}$("input").value=""}catch(e){alert("Não foi possível enviar a mensagem.\n\n"+e.message)}}
async function togglePrivacy(){const value=!(cadastro.aceitaChamadasPrivadas!==false);if(!cadastro.id){alert("Não foi possível atualizar sua privacidade.");return}await updateDoc(doc(db,"admins",cadastro.id),{aceitaChamadasPrivadas:value});cadastro.aceitaChamadasPrivadas=value;renderPrivacy()}
function renderPrivacy(){$("privacyState").textContent=cadastro?.aceitaChamadasPrivadas===false?"NÃO":"SIM";$('privacySide').classList.toggle('off',cadastro?.aceitaChamadasPrivadas===false)}
async function toggleOnline(){online=!online;$("statusBtn").classList.toggle("offline",!online);$("statusBtn").innerHTML='<span class="dot"></span><span class="status-text">'+(online?"Online":"Off-line")+'</span>';if(cadastro?.id)await updateDoc(doc(db,"admins",cadastro.id),{chatOnline:online}).catch(()=>{})}
async function leave(){stop();location.href="painel.html"}
async function endChat(){if(cadastro?.id)await updateDoc(doc(db,"admins",cadastro.id),{chatOnline:false}).catch(()=>{});stop();location.href="painel.html"}
$("backBtn").onclick=leave;$("closeBtn").onclick=endChat;$("minBtn").onclick=leave;$("roomsTab").onclick=()=>{$("roomsTab").classList.add("active");$("privateTab").classList.remove("active");openGeneral()};$("privateTab").onclick=()=>{$("privateTab").classList.add("active");$("roomsTab").classList.remove("active");loadPrivates()};$("searchBtn").onclick=searchId;$("idSearch").onkeydown=e=>{if(e.key==="Enter")searchId()};$("form").onsubmit=e=>{e.preventDefault();send()};$("privacySide").onclick=togglePrivacy;$("privacyBtn").onclick=()=>alert("Sua privacidade atual: "+(cadastro?.aceitaChamadasPrivadas===false?"você NÃO aceita chamadas privadas.":"você aceita chamadas privadas."));$("statusBtn").onclick=toggleOnline;
window.addEventListener("beforeunload",()=>stop());
onAuthStateChanged(auth,async u=>{if(!u){location.href="index.html";return}usuario=u;try{cadastro=await loadCadastro(u);renderPrivacy();if(cadastro.id)await updateDoc(doc(db,"admins",cadastro.id),{chatOnline:true}).catch(()=>{});await openGeneral()}catch(e){$("list").innerHTML='<div class="notice">Não foi possível iniciar o chat.<br><small>'+esc(e.message)+'</small></div>';console.error(e)}});
</script>
</body>
</html>
