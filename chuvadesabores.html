<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Adam Games - Chuva de Sabores</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;color:#fff;background:#031a2d}
button{font-family:inherit}
#app{height:100dvh;width:100%;display:flex;justify-content:center}
.page{width:min(100%,760px);height:100%;padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px}
.top{height:45px;flex:0 0 45px;display:flex;align-items:center;justify-content:space-between}
.back{width:42px;height:42px;border:0;border-radius:12px;background:rgba(0,25,45,.9);color:#fff;font-size:25px;font-weight:900}
.title{text-align:center}.title small{display:block;color:#8eb5cb;font-size:7px;letter-spacing:2px}.title strong{font-size:18px}
.wallet{min-width:94px;padding:5px 7px;border-radius:12px;text-align:center;background:rgba(255,213,43,.08);border:1px solid rgba(255,213,43,.15)}
.wallet .label{font-size:7px;color:#9bb7c9;font-weight:800}.wallet .coins{font-size:15px;color:#ffd52b;font-weight:900}.wallet .chances{font-size:9px;color:#ffcf4a;font-weight:900}
.hud{display:grid;grid-template-columns:1fr 1fr 1fr 1.15fr 42px;gap:5px;flex:0 0 auto}
.box{padding:6px 4px;border-radius:10px;text-align:center;background:rgba(2,27,48,.88);border:1px solid rgba(255,255,255,.08)}
.box small{display:block;color:#9bb6c8;font-size:7px;font-weight:900}.box b{display:block;margin-top:2px;font-size:13px}
#hearts{color:#ff6171;letter-spacing:1px}
#pauseBtn{border:0;border-radius:10px;background:#087eae;color:#fff;font-size:17px;font-weight:900}
.status{height:25px;flex:0 0 25px;padding:5px 8px;border-radius:9px;text-align:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);font-size:9px;font-weight:800;color:#bdd3e0}
.status.ok{color:#7dffb0}.status.warn{color:#ffd86b}.status.err{color:#ff9aa6}
.game-card{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:19px;border:2px solid rgba(255,255,255,.16);box-shadow:0 18px 50px rgba(0,0,0,.4);touch-action:none;background:#4b9b6b}
#scene{position:absolute;inset:0;background-position:center center;background-repeat:no-repeat;background-size:cover;transition:background-image .3s ease}
#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.16),transparent 30%,rgba(0,0,0,.08));pointer-events:none}
.phase-badge{position:absolute;z-index:20;top:10px;left:50%;transform:translateX(-50%);padding:7px 18px;border-radius:999px;background:rgba(0,26,45,.84);border:2px solid rgba(255,255,255,.75);box-shadow:0 5px 18px rgba(0,0,0,.35);font-size:12px;font-weight:1000;letter-spacing:.7px;white-space:nowrap}
#items{position:absolute;inset:0;z-index:10;overflow:hidden}
.food-item{position:absolute;left:0;top:0;width:64px;height:64px;display:flex;align-items:center;justify-content:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:58px;line-height:1;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25));user-select:none;pointer-events:none;will-change:transform}
#bowlWrap{position:absolute;z-index:30;bottom:8px;left:0;width:100%;height:112px;pointer-events:none}
#bowl{position:absolute;width:128px;height:104px;object-fit:contain;left:50%;bottom:0;transform:translateX(-50%);filter:drop-shadow(0 8px 8px rgba(0,0,0,.4));user-select:none;pointer-events:none}
#catchZone{position:absolute;width:74px;height:28px;left:50%;bottom:68px;transform:translateX(-50%);pointer-events:none}
.bowl-hit{animation:bowlHit .14s ease}
@keyframes bowlHit{50%{transform:translateX(-50%) scale(1.06) rotate(-2deg)}}
.bottom{display:flex;gap:6px;flex:0 0 39px}.action{flex:1;height:39px;border:0;border-radius:11px;background:#16a360;color:#fff;font-size:10px;font-weight:900}.action.secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}
#loading{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#062b49,#031a2d);padding:20px}
.loadbox{width:min(380px,100%);padding:26px 18px;border-radius:22px;text-align:center;background:#082945;border:1px solid rgba(255,255,255,.12)}
.spinner{width:40px;height:40px;margin:0 auto 12px;border:4px solid rgba(255,255,255,.15);border-top-color:#2ddc8a;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.loadbox h2{font-size:22px}.loadbox p{margin-top:7px;color:#aac7d9;font-size:11px;line-height:1.45}.loaderr{display:none;margin-top:10px;color:#ffabb4;font-size:10px}
#retryBtn{display:none;width:100%;height:42px;margin-top:12px;border:0;border-radius:11px;background:#159d5c;color:#fff;font-weight:900}
.modal{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,8,18,.84);backdrop-filter:blur(5px)}
.modal.show{display:flex}.modal-card{width:min(400px,100%);padding:23px 18px;border-radius:22px;text-align:center;background:#082945;border:1px solid rgba(255,255,255,.12);box-shadow:0 25px 70px rgba(0,0,0,.5)}
.modal-icon{font-size:45px}.modal-card h2{margin-top:6px;font-size:24px}.modal-card p{margin-top:8px;color:#b8d3e3;font-size:12px;line-height:1.5}.modal-reward{margin-top:11px;color:#ffd52b;font-size:18px;font-weight:900}.modal-actions{display:grid;gap:8px;margin-top:16px}.modal-actions button{height:44px;border:0;border-radius:12px;color:#fff;font-weight:900;background:#16a45f}.modal-actions .alt{background:rgba(255,255,255,.08)}
@media(max-height:650px){.page{padding-top:4px;gap:4px}.top{height:39px;flex-basis:39px}.back{height:36px;width:36px}.wallet{padding:3px 6px}.hud .box{padding:4px}.status{height:22px;flex-basis:22px;padding:4px}.bottom{flex-basis:35px}.action{height:35px}.food-item{font-size:52px;width:58px;height:58px}#bowl{width:118px;height:96px}}
</style>
</head>
<body>
<div id="loading"><div class="loadbox"><div class="spinner" id="spinner"></div><h2>Chuva de Sabores</h2><p id="loadText">Preparando o jogo...</p><div class="loaderr" id="loadError"></div><button id="retryBtn">TENTAR NOVAMENTE</button></div></div>
<div id="app"><div class="page">
  <div class="top"><button class="back" id="back" type="button">←</button><div class="title"><small>ADAM GAMES</small><strong>CHUVA DE SABORES</strong></div><div class="wallet"><div class="label">ADAM COINS</div><div class="coins" id="coins">0</div><div class="chances" id="chances">🎟️ 0</div></div></div>
  <div class="hud"><div class="box"><small>ITENS</small><b id="score">0 / 20</b></div><div class="box"><small>FASE</small><b id="level">1 / 9</b></div><div class="box"><small>TEMPO</small><b id="time">—</b></div><div class="box"><small>VIDAS</small><b id="hearts">♥ ♥ ♥</b></div><button id="pauseBtn" type="button">Ⅱ</button></div>
  <div class="status" id="status">Conectando...</div>
  <div class="game-card" id="gameArea">
    <div id="scene"></div><div id="shade"></div><div class="phase-badge" id="phaseBadge">FASE 1</div><div id="items"></div>
    <div id="bowlWrap"><img id="bowl" alt="Tigela"><div id="catchZone"></div></div>
  </div>
  <div class="bottom"><button class="action secondary" id="restartBtn" type="button">↻ RECOMEÇAR</button><button class="action" id="soundBtn" type="button">🔊 SOM</button></div>
</div></div>
<div class="modal" id="modal"><div class="modal-card"><div class="modal-icon" id="modalIcon">🍎</div><h2 id="modalTitle">Você venceu!</h2><p id="modalText"></p><div class="modal-reward" id="modalReward"></div><div class="modal-actions"><button id="modalPrimary" type="button">CONTINUAR</button><button class="alt" id="modalSecondary" type="button">SAIR</button></div></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,query,where,getDocs,getDoc,runTransaction,addDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",authDomain:"adam-games-21081.firebaseapp.com",projectId:"adam-games-21081",storageBucket:"adam-games-21081.firebasestorage.app",messagingSenderId:"1055528418738",appId:"1:1055528418738:web:5fafdf63424ba9744eb8ab"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);

let user=null,userRef=null,coins=0,chances=0,gameStarted=false,paused=false,phaseFinished=false;
let level=1,collected=0,lives=3,timeLeft=0,last=0,spawnTimer=0,raf=0;
let targetX=0,items=[],sessionEntryKey="adam_games_chuva_entry_v5",soundOn=true;

// 1-3 muito suaves | 4-5 médios | 6-7 difíceis | 8 HARD | 9 BOSS.
// Cronômetro SOMENTE nas fases 8 e 9.
const phases=[
 {need:20,speed:42,spawn:1250,max:5,time:null,reward:20},
 {need:25,speed:48,spawn:1150,max:5,time:null,reward:25},
 {need:30,speed:55,spawn:1050,max:5,time:null,reward:30},
 {need:35,speed:75,spawn:850,max:6,time:null,reward:40},
 {need:40,speed:88,spawn:760,max:7,time:null,reward:50},
 {need:45,speed:105,spawn:680,max:8,time:null,reward:65},
 {need:50,speed:120,spawn:610,max:9,time:null,reward:80},
 {need:50,speed:165,spawn:430,max:10,time:55,reward:100},
 {need:80,speed:220,spawn:330,max:12,time:65,reward:0}
];

const foods=["🫐","🍅","🍓","🍑","🍌","🍐","🍒","🥨","🥐","🍔","🍟","🍕","🥓","🍝","🍭","🍼","🫘"];
const trash=["🛝","🥎","🎽","🎤","♟️","🎰","🎭","🏓","🥊","🎨","🎲"];
const bowlFiles=["tigela_1_niveis_1_a_7.png","tigela_2_nivel_8.png","tigela_3_nivel_9_boss.png"];
const bgFiles=["fase_1_7.png","fase_8.png","fase_9.png"];

function phase(){return phases[level-1]}
function isTimed(){return level>=8}
function coinsUI(){$("coins").textContent=Number(coins||0).toLocaleString("pt-BR")}
function chancesUI(){$("chances").textContent="🎟️ "+Number(chances||0)}
function status(t,c=""){const e=$("status");e.textContent=t;e.className="status "+c}
function hud(){const p=phase();$("score").textContent=collected+" / "+p.need;$("level").textContent=level+" / 9";$("time").textContent=isTimed()?Math.max(0,Math.ceil(timeLeft)):"—";$("hearts").textContent=[0,1,2].map(i=>i<lives?"♥":"♡").join(" ")}
function sceneAssets(){
 const bg=level<=7?bgFiles[0]:level===8?bgFiles[1]:bgFiles[2];
 const bowl=level<=7?bowlFiles[0]:level===8?bowlFiles[1]:bowlFiles[2];
 $("scene").style.backgroundImage=`url("${bg}")`;
 $("bowl").src=bowl;
 $("phaseBadge").textContent=level===9?"👑 FASE 9 • BÔNUS BOSS":level===8?"💀 FASE 8 • HARD":`FASE ${level}`;
}
function clearItems(){for(const x of items)x.el.remove();items=[]}
function resetPhase(){
 clearItems();collected=0;lives=3;spawnTimer=0;phaseFinished=false;paused=false;targetX=$("gameArea").clientWidth/2;
 timeLeft=phase().time||0;$ ("pauseBtn").textContent="Ⅱ";
 sceneAssets();hud();status(level<=3?"Pegue as comidas com calma. 🍓":"Pegue as comidas e evite os obstáculos.","ok");
}

async function findUser(u){
 let r=await getDocs(query(collection(db,"admins"),where("uid","==",u.uid)));
 if(r.empty&&u.email)r=await getDocs(query(collection(db,"admins"),where("email","==",u.email.toLowerCase())));
 return r.empty?null:r.docs[0].ref;
}
async function addCoins(amount,reason){
 if(!userRef||!amount)return;
 try{await runTransaction(db,async tx=>{const s=await tx.get(userRef);if(!s.exists())throw new Error("Cadastro não encontrado.");tx.update(userRef,{moedas:Number(s.data().moedas||0)+amount})});coins+=amount;coinsUI()}catch(e){console.warn(e)}
 try{await addDoc(collection(db,"resultadosJogos"),{uid:user.uid,jogoId:"frutas",moedasGanhos:amount,motivo:reason,rodada:level,itens:collected,dataHora:new Date().toISOString(),criadoEm:serverTimestamp()})}catch(e){}
}
async function consumeEntry(){
 const saved=sessionStorage.getItem(sessionEntryKey);
 if(saved===user.uid)return false;
 await runTransaction(db,async tx=>{const s=await tx.get(userRef);if(!s.exists())throw new Error("Cadastro não encontrado.");const n=Number(s.data().chances||0);if(n<=0)throw new Error("SEM_CHANCES");tx.update(userRef,{chances:n-1})});
 chances=Math.max(0,chances-1);chancesUI();sessionStorage.setItem(sessionEntryKey,user.uid);return true;
}
async function consumeContinue(){
 await runTransaction(db,async tx=>{const s=await tx.get(userRef);if(!s.exists())throw new Error("Cadastro não encontrado.");const n=Number(s.data().chances||0);if(n<=0)throw new Error("SEM_CHANCES");tx.update(userRef,{chances:n-1})});
 chances=Math.max(0,chances-1);chancesUI();await addCoins(30,"continuar_apos_derrota");
}

function spawn(){
 const p=phase();if(items.length>=p.max)return;
 const good=Math.random()<0.72;const emoji=(good?foods:trash)[Math.floor(Math.random()*(good?foods.length:trash.length))];
 const el=document.createElement("div");el.className="food-item";el.textContent=emoji;$("items").appendChild(el);
 const w=$("gameArea").clientWidth;const x=34+Math.random()*(w-68);
 const item={el,x,y:-70,vy:p.speed*(.9+Math.random()*.18),good,dead:false};items.push(item);position(item);
}
function position(it){it.el.style.transform=`translate3d(${it.x-32}px,${it.y-32}px,0)`}
function removeItem(it){it.dead=true;it.el.remove()}
function hitBowl(it){
 const area=$("gameArea").getBoundingClientRect();const bowlX=targetX;
 return it.y>area.height-125 && Math.abs(it.x-bowlX)<39;
}
function collect(it){
 if(it.dead)return;removeItem(it);$("bowl").classList.remove("bowl-hit");void $("bowl").offsetWidth;$("bowl").classList.add("bowl-hit");
 if(it.good){collected++;if(collected>=phase().need)finish(true)}else{lives--;status("⚠️ Você pegou um obstáculo!","err");if(lives<=0)finish(false)}
 hud();
}
function update(dt){
 if(!gameStarted||paused||phaseFinished)return;
 const p=phase();spawnTimer+=dt*1000;
 if(spawnTimer>=p.spawn){spawnTimer=0;spawn()}
 for(const it of [...items]){
  if(it.dead)continue;it.y+=it.vy*dt;position(it);
  if(hitBowl(it))collect(it);else if(it.y>$("gameArea").clientHeight+75)removeItem(it);
 }
 items=items.filter(x=>!x.dead);
 if(isTimed()){timeLeft-=dt;if(timeLeft<=0){timeLeft=0;finish(collected>=p.need)} }
 hud();
}
function loop(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);raf=requestAnimationFrame(loop)}

function showModal(icon,title,text,reward,primary,secondary){$("modalIcon").textContent=icon;$("modalTitle").textContent=title;$("modalText").textContent=text;$("modalReward").textContent=reward;$("modalPrimary").textContent=primary;$("modalSecondary").textContent=secondary;$("modal").classList.add("show")}
function hideModal(){$("modal").classList.remove("show")}
async function finish(win){
 if(phaseFinished)return;phaseFinished=true;paused=true;clearItems();
 if(win){
  if(level===9){const reward=collected>=80?200:collected>=60?150:collected>=40?100:0;if(reward)await addCoins(reward,"fase_9_bonus");showModal("👑","BOSS DERROTADO!",`Você conseguiu ${collected} itens na fase bônus.`,reward?`+${reward} Adam Coins`:"Nenhuma recompensa","JOGAR NOVAMENTE","SAIR");return}
  const r=phase().reward;await addCoins(r,"fase_"+level);showModal("🎉","FASE CONCLUÍDA!",`Você pegou ${collected} itens e avançou.`,`+${r} Adam Coins`,`PRÓXIMA FASE`,`SAIR`);return;
 }
 showModal("💔","VOCÊ PERDEU!",`Você pegou ${collected} de ${phase().need} itens. Continue para o próximo nível.`,`-1 chance  •  +30 Adam Coins`,`CONTINUAR`,`SAIR`);
}

$("modalPrimary").onclick=async()=>{
 hideModal();
 if(phaseFinished&&lives<=0){
  try{await consumeContinue()}catch(e){showModal("🎟️","SEM CHANCES","Você não possui chances para continuar.","","SAIR","SAIR");$("modalPrimary").onclick=()=>location.href="jogos.html";$("modalSecondary").onclick=()=>location.href="jogos.html";return}
  if(level<9)level++;else level=1;resetPhase();return;
 }
 if(level<9){level++;resetPhase()}else{level=1;resetPhase()}
};
$("modalSecondary").onclick=()=>location.href="jogos.html";
$("back").onclick=()=>location.href="jogos.html";
$("restartBtn").onclick=()=>{if(gameStarted)resetPhase()};
$("pauseBtn").onclick=()=>{if(!gameStarted||phaseFinished)return;paused=!paused;$("pauseBtn").textContent=paused?"▶":"Ⅱ";status(paused?"Jogo pausado.":"Jogo retomado.","warn")};
$("soundBtn").onclick=()=>{soundOn=!soundOn;$("soundBtn").textContent=soundOn?"🔊 SOM":"🔇 SOM"};

function moveBowl(clientX){const r=$("gameArea").getBoundingClientRect();targetX=Math.max(65,Math.min(r.width-65,clientX-r.left));$("bowl").style.left=targetX+"px";$("catchZone").style.left=targetX+"px"}
$("gameArea").addEventListener("pointerdown",e=>{if(gameStarted)moveBowl(e.clientX)});
$("gameArea").addEventListener("pointermove",e=>{if(gameStarted&&(e.buttons||e.pointerType==="touch"))moveBowl(e.clientX)});
window.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")moveBowl($("gameArea").getBoundingClientRect().left+targetX-55);if(e.key==="ArrowRight")moveBowl($("gameArea").getBoundingClientRect().left+targetX+55);if(e.key===" "){e.preventDefault();$("pauseBtn").click()}});
window.addEventListener("resize",()=>{if(gameStarted)moveBowl($("gameArea").getBoundingClientRect().left+targetX)});

function failLoading(msg){$("spinner").style.display="none";$("loadText").textContent="O jogo não conseguiu carregar.";$("loadError").style.display="block";$("loadError").textContent=msg;$("retryBtn").style.display="block"}
$("retryBtn").onclick=()=>location.reload();
setTimeout(()=>{if(!gameStarted)failLoading("A conexão demorou demais. Tente novamente.")},8000);

onAuthStateChanged(auth,async u=>{
 if(!u){location.replace("index.html");return}user=u;
 try{
  $("loadText").textContent="Carregando seu perfil...";
  userRef=await findUser(u);if(!userRef)throw new Error("Cadastro Adam Games não encontrado.");
  const snap=await getDoc(userRef);coins=Number(snap.data()?.moedas||0);chances=Number(snap.data()?.chances||0);coinsUI();chancesUI();
  const first=await consumeEntry();if(first)await addCoins(30,"entrada_jogo");
  gameStarted=true;resetPhase();$("loading").style.display="none";requestAnimationFrame(loop);
 }catch(e){console.error(e);failLoading(e.message||"Erro ao carregar o perfil.")}
});
</script>
</body>
</html>
