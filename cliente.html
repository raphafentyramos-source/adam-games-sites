<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {

  initializeApp

}

from

"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {

  getAuth,

  onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {

  getFirestore,

  collection,

  query,

  where,

  getDocs,

  updateDoc,

  Timestamp

}

from

"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:
    "adam-games-21081.firebaseapp.com",

  projectId:
    "adam-games-21081",

  storageBucket:
    "adam-games-21081.firebasestorage.app",

  messagingSenderId:
    "1055528418738",

  appId:
    "1:1055528418738:web:5fafdf63424ba9744eb8ab"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================================
   ELEMENTOS
===================================================== */

const $ =
  id =>
    document.getElementById(
      id
    );


const message =
  $("message");


/* =====================================================
   ESTADO
===================================================== */

let cliente =
  null;

let entregas =
  [];

let resultadosRoleta =
  [];


/* =====================================================
   URL
===================================================== */

const parametros =
  new URLSearchParams(
    window.location.search
  );


const clienteUid =
  parametros.get(
    "uid"
  );


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
  texto,
  tipo = ""
){

  message.textContent =
    texto;

  message.className =
    "message " +
    tipo;

}


/* =====================================================
   NÚMERO
===================================================== */

function numero(
  valor
){

  return Number(
    valor || 0
  ).toLocaleString(
    "pt-BR"
  );

}


/* =====================================================
   DATA
===================================================== */

function formatarData(
  valor
){

  if(!valor){

    return "—";

  }


  try{

    if(
      typeof valor.toDate ===
      "function"
    ){

      return valor
        .toDate()
        .toLocaleString(
          "pt-BR"
        );

    }


    if(
      typeof valor.seconds ===
      "number"
    ){

      return new Date(
        valor.seconds * 1000
      ).toLocaleString(
        "pt-BR"
      );

    }


    const data =
      new Date(
        valor
      );


    if(
      Number.isNaN(
        data.getTime()
      )
    ){

      return "—";

    }


    return data.toLocaleString(
      "pt-BR"
    );

  }

  catch{

    return "—";

  }

}


/* =====================================================
   MILLIS
===================================================== */

function obterMillis(
  valor
){

  if(!valor){

    return 0;

  }


  if(
    typeof valor.toMillis ===
    "function"
  ){

    return valor.toMillis();

  }


  if(
    typeof valor.seconds ===
    "number"
  ){

    return valor.seconds * 1000;

  }


  const data =
    new Date(
      valor
    );


  return Number.isNaN(
    data.getTime()
  )
    ? 0
    : data.getTime();

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapar(
  valor
){

  return String(
    valor ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   CARREGAR CLIENTE
===================================================== */

async function carregarCliente(){

  if(!clienteUid){

    mostrarMensagem(
      "Nenhum UID foi informado na URL.",
      "error"
    );

    return;

  }


  try{

    /*
    =====================================================
    O UID é um CAMPO dentro de admins.
    Não presumimos que seja o ID do documento.
    =====================================================
    */

    const resultado =
      await getDocs(

        query(

          collection(
            db,
            "admins"
          ),

          where(
            "uid",
            "==",
            clienteUid
          )

        )

      );


    if(
      resultado.empty
    ){

      mostrarMensagem(
        "Cliente não encontrado para este UID.",
        "error"
      );

      return;

    }


    const documento =
      resultado.docs[0];


    cliente = {

      id:
        documento.id,

      ...documento.data()

    };


    renderizarCliente();


    await Promise.all([

      carregarEntregas(),

      carregarRoleta()

    ]);


    renderizarResumo();


    mostrarMensagem(
      "Cliente carregado com sucesso.",
      "success"
    );

  }

  catch(error){

    console.error(
      "Erro ao carregar cliente:",
      error
    );


    mostrarMensagem(

      "Não foi possível carregar o cliente: " +

      (
        error.message ||
        "erro desconhecido"
      ),

      "error"

    );

  }

}


/* =====================================================
   RENDER CLIENTE
===================================================== */

function renderizarCliente(){

  $("profile").style.display =
    "block";

  $("recursosSection").style.display =
    "block";

  $("resumoSection").style.display =
    "block";

  $("ordersSection").style.display =
    "block";

  $("roletaSection").style.display =
    "block";


  const nome =
    cliente.nome ||
    cliente.name ||
    "Cliente";


  $("nome").textContent =
    nome;


  $("email").textContent =
    cliente.email ||
    "Sem e-mail";


  $("uid").textContent =
    cliente.uid ||
    clienteUid;


  $("publicId").textContent =
    cliente.publicId ||
    "Não definido";


  $("docId").textContent =
    cliente.id;


  $("avatar").textContent =
    cliente.avatar ||
    "👤";


  if(
    cliente.vip === true
  ){

    $("vipBadge").innerHTML =
      `<span class="vip-badge">
        👑 VIP ATIVO
      </span>`;

  }

  else{

    $("vipBadge").innerHTML =
      `<span class="normal-badge">
        🔒 NÃO VIP
      </span>`;

  }


  atualizarRecursos();

}


/* =====================================================
   ATUALIZAR RECURSOS
===================================================== */

function atualizarRecursos(){

  $("rChances").textContent =
    numero(
      cliente.chances
    );


  $("rGiros").textContent =
    numero(
      cliente.girosRoleta
    );


  $("rMoedas").textContent =
    numero(
      cliente.moedas
    );


  $("rChaves").textContent =
    numero(
      cliente.chaves
    );


  $("rCreditos").textContent =

    "R$ " +

    Number(
      cliente.creditos || 0
    )
    .toFixed(2)
    .replace(
      ".",
      ","
    );

}


/* =====================================================
   CARREGAR ENTREGAS
===================================================== */

async function carregarEntregas(){

  entregas = [];


  try{

    const resultado =
      await getDocs(

        query(

          collection(
            db,
            "entregas"
          ),

          where(
            "uid",
            "==",
            clienteUid
          )

        )

      );


    entregas =
      resultado.docs.map(
        documento => ({

          id:
            documento.id,

          ...documento.data()

        })
      );

  }

  catch(error){

    console.warn(
      "Erro ao carregar entregas:",
      error
    );

    entregas = [];

  }


  renderizarEntregas();

}


/* =====================================================
   MARCAR ENTREGA
===================================================== */

async function marcarComoEntregue(
  entregaId
){

  if(!entregaId){

    return;

  }


  const entrega =
    entregas.find(
      item =>
        item.id ===
        entregaId
    );


  if(!entrega){

    return;

  }


  if(
    entrega.entregue === true
  ){

    return;

  }


  const confirmar =
    confirm(
      "Marcar este prêmio como ENTREGUE?"
    );


  if(!confirmar){

    return;

  }


  try{

    const referencia =
      /*
      -------------------------------------------------
      O ID recebido aqui é o ID do documento
      da coleção entregas.
      -------------------------------------------------
      */

      (
        await import(
          "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js"
        )
      )
      .doc(
        db,
        "entregas",
        entregaId
      );


    const agora =
      Timestamp.now();


    const usuarioAdmin =
      auth.currentUser;


    await updateDoc(

      referencia,

      {

        entregue:
          true,

        entregueEm:
          agora,

        entreguePor:
          usuarioAdmin?.email ||
          "Administrador"

      }

    );


    /*
    -----------------------------------------------------
    ATUALIZA LOCALMENTE
    -----------------------------------------------------
    */

    entrega.entregue =
      true;

    entrega.entregueEm =
      agora;

    entrega.entreguePor =
      usuarioAdmin?.email ||
      "Administrador";


    renderizarEntregas();

    renderizarResumo();


    mostrarMensagem(
      "✅ Prêmio marcado como entregue com sucesso.",
      "success"
    );

  }

  catch(error){

    console.error(
      "Erro ao marcar entrega:",
      error
    );


    mostrarMensagem(

      "❌ Não foi possível marcar como entregue: " +

      (
        error.message ||
        "erro desconhecido"
      ),

      "error"

    );

  }

}


/* =====================================================
   RENDER ENTREGAS
===================================================== */

function renderizarEntregas(){

  const lista =
    $("orders");


  const statusFiltro =
    $("statusFilter").value;


  const tipoFiltro =
    $("typeFilter").value;


  const busca =
    $("search")
      .value
      .trim()
      .toLowerCase();


  let listaFiltrada =
    entregas.filter(
      pedido => {

        const entregue =
          pedido.entregue === true;


        const status =
          entregue
            ? "entregue"
            : "pendente";


        if(
          statusFiltro !==
          "todos" &&
          status !==
          statusFiltro
        ){

          return false;

        }


        const tipo =
          String(
            pedido.tipo ||
            "outro"
          )
          .toLowerCase();


        if(
          tipoFiltro !==
          "todos" &&
          tipo !==
          tipoFiltro
        ){

          return false;

        }


        if(
          busca
        ){

          const texto =

            (

              pedido.premioNome ||

              pedido.nome ||

              pedido.titulo ||

              ""

            )
            .toLowerCase() +

            " " +

            (

              pedido.id ||

              ""

            )
            .toLowerCase() +

            " " +

            tipo;


          if(
            !texto.includes(
              busca
            )
          ){

            return false;

          }

        }


        return true;

      }
    );


  listaFiltrada.sort(
    (
      a,
      b
    ) => {

      return (

        obterMillis(
          b.criadoEm ||
          b.dataHora
        )

        -

        obterMillis(
          a.criadoEm ||
          a.dataHora
        )

      );

    }
  );


  lista.innerHTML =
    "";


  if(
    listaFiltrada.length === 0
  ){

    lista.innerHTML = `

      <div class="empty">

        🎉 Nenhum pedido encontrado.

      </div>

    `;

    return;

  }


  listaFiltrada.forEach(
    pedido => {

      const entregue =
        pedido.entregue === true;


      const titulo =

        pedido.premioNome ||

        pedido.nome ||

        pedido.titulo ||

        "Recompensa";


      const tipo =
        pedido.tipo ||
        "outro";


      const quantidade =
        pedido.quantidade;


      const data =
        formatarData(
          pedido.criadoEm ||
          pedido.dataHora
        );


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "order";


      div.innerHTML = `

        <div class="order-top">

          <div class="order-title">

            ${escapar(titulo)}

          </div>

          <div class="status ${
            entregue
              ? "status-entregue"
              : "status-pendente"
          }">

            ${
              entregue
                ? "✅ ENTREGUE"
                : "⏳ PENDENTE"
            }

          </div>

        </div>


        <div class="order-info">

          <div>
            Tipo:
            <b>
              ${escapar(tipo)}
            </b>
          </div>


          ${
            quantidade !== undefined

              ?

              `
              <div>

                Quantidade:

                <b>
                  ${numero(quantidade)}
                </b>

              </div>
              `

              :

              ""

          }


          <div>

            Data:

            <b>
              ${escapar(data)}
            </b>

          </div>


          ${
            pedido.entregueEm

              ?

              `
              <div>

                Entregue em:

                <b>
                  ${escapar(
                    formatarData(
                      pedido.entregueEm
                    )
                  )}
                </b>

              </div>
              `

              :

              ""

          }


          ${
            pedido.entreguePor

              ?

              `
              <div>

                Entregue por:

                <b>
                  ${escapar(
                    pedido.entreguePor
                  )}
                </b>

              </div>
              `

              :

              ""

          }

        </div>


        <div class="order-id">

          📦 ID DA ENTREGA:

          ${escapar(pedido.id)}

        </div>


        ${
          !entregue

            ?

            `
            <button
              class="entregar-button"
              data-entrega-id="${escapar(
                pedido.id
              )}"
              type="button">

              ✅ MARCAR COMO ENTREGUE

            </button>
            `

            :

            ""

        }

      `;


      lista.appendChild(
        div
      );

    }
  );


  /*
  =====================================================
  EVENTOS DOS BOTÕES DE ENTREGA
  =====================================================
  */

  lista
    .querySelectorAll(
      ".entregar-button"
    )
    .forEach(
      botao => {

        botao.addEventListener(
          "click",
          () => {

            marcarComoEntregue(
              botao.dataset.entregaId
            );

          }
        );

      }
    );

}

        query(

          collection(
            db,
            "historicoRoleta"
          ),

          where(
            "uid",

          )

        )

      );


    resultadosRoleta =
      resultado.docs.map(
        documento => ({

          id:
            documento.id,

          ...documento.data()

        })
      );

  }

  catch(error){

    console.warn(
      "Erro histórico Roleta:",
      error
    );

    resultadosRoleta = [];

  }


  renderizarRoleta();

}


/* =====================================================
   RENDER ROLETA
===================================================== */

function renderizarRoleta(){

  const lista =
    $("roletaHistorico");


  lista.innerHTML =
    "";


  if(
    resultadosRoleta.length === 0
  ){

    lista.innerHTML = `

      <div class="empty">

        🎰 Este cliente ainda não possui
        resultados registrados na Roleta.

      </div>

    `;

    return;

  }


  resultadosRoleta.sort(
    (
      a,
      b
    ) => {

      return (

        obterMillis(
          b.criadoEm ||
          b.dataHora
        )

        -

        obterMillis(
          a.criadoEm ||
          a.dataHora
        )

      );

    }
  );


  resultadosRoleta.forEach(
    resultado => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "roleta-result";


      const premio =

        (
          resultado.quantidade ||
          0
        ).toLocaleString(
          "pt-BR"
        ) +

        " " +

        (
          resultado.premioNome ||
          "Prêmio"
        );


      div.innerHTML = `

        <div class="roleta-result-top">

          <div class="roleta-premio">

            🎁 ${escapar(premio)}

          </div>

          <div class="roleta-data">

            ${escapar(
              formatarData(
                resultado.criadoEm ||
                resultado.dataHora
              )
            )}

          </div>

        </div>


        <div class="roleta-status">

          ${
            resultado.entregue === true
              ? "✅ Prêmio entregue"
              : "⏳ Aguardando entrega"
          }

        </div>


        <div class="order-id">

          🎰 ID:

          ${escapar(
            resultado.id
          )}

        </div>

      `;


      lista.appendChild(
        div
      );

    }
  );

}


/* =====================================================
   RESUMO
===================================================== */

function renderizarResumo(){

  const total =
    entregas.length;


  const pendentes =
    entregas.filter(
      item =>
        item.entregue !== true
    ).length;


  const entregues =
    entregas.filter(
      item =>
        item.entregue === true
    ).length;


  $("totalPremios").textContent =
    total;


  $("pendentes").textContent =
    pendentes;


  $("entregues").textContent =
    entregues;

}
