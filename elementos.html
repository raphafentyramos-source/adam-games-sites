<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Minha Coleção de Elementos</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#020a19;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{position:relative;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(1,9,24,.46),rgba(1,9,24,.78)),url("fundo-elementos-vertical.png") center top/cover no-repeat;z-index:0}
.page{position:relative;z-index:1;width:min(1120px,96vw);margin:auto;padding:18px 0 35px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.top a{color:#fff;text-decoration:none;background:#061a34dd;border:1px solid #3abfff55;border-radius:11px;padding:9px 12px;font-weight:800;font-size:12px}
.title{text-align:center;font-weight:1000;font-size:clamp(22px,4.5vw,42px);letter-spacing:.5px;text-shadow:0 0 15px #00bfff99;margin:4px 0 12px}
.subtitle{text-align:center;color:#b9cce3;font-size:12px;margin-bottom:13px}
.wallbox{padding:10px;border-radius:18px;background:rgba(1,13,31,.67);border:1px solid #43cfff66;box-shadow:0 15px 50px #0009}
.periodic{width:100%;display:grid;grid-template-columns:repeat(18,minmax(0,1fr));grid-template-rows:repeat(10,clamp(34px,5.1vw,60px));gap:3px}
.element{appearance:none;min-width:0;padding:4px 2px;border-radius:7px;border:1px solid #37baff88;background:linear-gradient(145deg,#082e54ee,#03172eee);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:.15s;box-shadow:inset 0 0 10px #00aaff15}
.element:hover{transform:translateY(-2px);border-color:#fff;box-shadow:0 0 15px #20caff77}
.element .num{font-size:clamp(7px,.9vw,11px);opacity:.72;align-self:flex-start;margin-left:3px}
.element strong{font-size:clamp(12px,1.7vw,23px);line-height:1}
.element .ename{font-size:clamp(5px,.62vw,9px);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rarity-comum{border-color:#26b7ff99;background:linear-gradient(145deg,#073a64ee,#061d38ee)}
.rarity-incomum{border-color:#39d66b99;background:linear-gradient(145deg,#0a432bee,#08221bee)}
.rarity-raro{border-color:#b75cffbb;background:linear-gradient(145deg,#321051ee,#17082bee)}
.rarity-super-raro{border-color:#ffb52fcc;background:linear-gradient(145deg,#51300bee,#241607ee)}
.element.missing{filter:grayscale(1);opacity:.38;background:#020711ee;border-color:#ffffff22}
.element.owned{opacity:1;box-shadow:0 0 13px #39e5ff55}
.element.owned:after{content:"✓";position:absolute;transform:translate(120%, -115%);font-size:9px;color:#61ffdb}
.element{position:relative}.element .quantity{position:absolute;right:3px;bottom:2px;font-size:8px;font-weight:1000;color:#fff;background:#000b;padding:2px 4px;border-radius:5px;line-height:1}
.legend{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:10px}
.legend span{font-size:10px;padding:5px 8px;border-radius:8px;background:#031328cc;border:1px solid #ffffff18}
.bottom{margin:14px auto 0;width:min(800px,100%);min-height:112px;border-radius:18px;border:1px solid #4acfff77;background:rgba(2,15,34,.94);box-shadow:0 12px 35px #000b;padding:16px 18px;display:flex;gap:15px;align-items:center}
.symbol{width:70px;height:70px;flex:0 0 70px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:1000;background:linear-gradient(145deg,#063e67,#1c1450);border:1px solid #50d9ff88;box-shadow:0 0 20px #00bfff33}
.info h2{margin:0 0 4px;font-size:22px} .info p{margin:5px 0;color:#b9cbe0;line-height:1.45;font-size:13px}
.meta{font-size:10px;color:#67ddff;text-transform:uppercase;letter-spacing:1px}
.counter{text-align:center;color:#9fb4cc;font-size:10px;margin-top:8px}
@media(max-width:700px){
.page{width:98vw;padding:9px 0 25px}
.top a{padding:7px 9px;font-size:10px}
.wallbox{padding:5px;border-radius:12px}
.periodic{gap:2px;grid-template-rows:repeat(10,clamp(25px,7.7vw,42px))}
.element{border-radius:4px;padding:2px 1px}
.element .ename{display:none}
.element strong{font-size:clamp(9px,2.9vw,15px)}
.element .num{font-size:7px;margin-left:2px}
.legend span{font-size:8px;padding:4px 6px}
.bottom{min-height:95px;padding:12px;border-radius:14px;gap:10px}
.symbol{width:58px;height:58px;flex-basis:58px;font-size:24px;border-radius:12px}
.info h2{font-size:17px}
.info p{font-size:11px}
}
</style>
</head>

/* =====================================================
   ATUALIZA A PAREDE
===================================================== */

function updateWall(){

  let owned = 0;
  let dupes = 0;

  DATA.forEach(e => {

    const q =
      Number(
        inventarioElementos[String(e.n)] || 0
      );

    const el =
      document.querySelector(
        '[data-n="' + e.n + '"]'
      );

    if(el){

      el.classList.toggle(
        'owned',
        q > 0
      );

      el.classList.toggle(
        'missing',
        q === 0
      );

      /*
        Remove contador anterior para evitar
        duplicação visual.
      */
      const oldQuantity =
        el.querySelector('.quantity');

      if(oldQuantity){
        oldQuantity.remove();
      }

      /*
        Repetidos aparecem no próprio elemento.
      */
      if(q > 1){

        const quantity =
          document.createElement('span');

        quantity.className =
          'quantity';

        quantity.textContent =
          '×' + q;

        el.appendChild(
          quantity
        );

      }

    }

    if(q > 0){
      owned++;
    }

    if(q > 1){
      dupes += q - 1;
    }

  });


  const counter =
    document.getElementById(
      'counter'
    );

  if(counter){

    counter.textContent =
      'Coleção: ' +
      owned +
      ' / 118 • Duplicatas: ' +
      dupes;

  }

}

function openElement(n){

  const e =
    DATA.find(

    );

  if(!e) return;


  const quantidade =
    Number(

        String(n)
      ] || 0
    );

  ).textContent =

    e.n +

    e.rarity.toUpperCase();


  document.getElementById(
    'detailName'
  ).textContent =
    e.name;


  document.getElementById(
    'detailText'
  ).textContent =
    e.desc;


  /*
    Mostra a quantidade de cartas/elementos
    que o jogador possui.
  */
  let quantityBox =
    document.getElementById(
      'detailQuantity'
    );


  if(!quantityBox){

    quantityBox =
      document.createElement(
        'div'
      );

    quantityBox.id =
      'detailQuantity';

    quantityBox.style.cssText =
      'margin-top:8px;color:#67ddff;font-weight:800;font-size:12px;';

      document.getElementById(
        'detailText'
      );

    if(detailText){

      detailText.insertAdjacentElement(
        'afterend',
        quantityBox
      );

    }

  }


  quantityBox.textContent =
    quantidade > 0
      ? '⚛️ Você possui: ' + quantidade
      : '🔒 Você ainda não possui este elemento';


  document.getElementById(
    'detail'
  ).scrollIntoView({
    behavior: 'smooth',
    block: 'nearest'
  });

}


/* =====================================================
   CARREGAR CADASTRO DO FIREBASE
===================================================== */

async function carregarInventario(
  user
){

  const admins =
    collection(
      db,
      'admins'
    );


  let snapshot =
    await getDocs(
      query(
        admins,
        where(
          'uid',
          '==',
          user.uid
        )
      )
    );


  /*
    Compatibilidade com cadastros antigos
    que possam estar identificados pelo e-mail.
  */
  if(
    snapshot.empty &&
    user.email
  ){

    snapshot =
      await getDocs(
        query(
          admins,
          where(
            'email',
            '==',
            user.email
              .trim()
              .toLowerCase()
          )
        )
      );

  }


  if(
    snapshot.empty
  ){

    inventarioElementos =
      {};

    updateWall();

    return;

  }


  const dados =
    snapshot.docs[0].data();


  inventarioElementos =
    dados.elementos &&
    typeof dados.elementos === 'object'
      ? dados.elementos
      : {};


  updateWall();

}

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      window.location.replace(
        'index.html'
      );

      return;

    }


    try{

      await carregarInventario(
        user
      );

    }catch(error){

      console.error(
        'Erro ao carregar coleção de elementos:',
        error
      );

      inventarioElementos =
        {};

      updateWall();

    }

  }
);
