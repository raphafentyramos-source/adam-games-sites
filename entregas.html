<script type="module">


/* =====================================================
   FIREBASE

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:
    "adam-games-21081.firebaseapp.com",

  projectId:
    "adam-games-21081",

  storageBucket:
    "adam-games-21081.firebasestorage.app",

  messagingSenderId:
    "1055528418738",

  appId:
    "1:1055528418738:web:5fafdf63424ba9744eb8ab"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================================
   ELEMENTOS
===================================================== */

const lista =
  document.getElementById(
    "lista"
  );

const busca =
  document.getElementById(
    "busca"
  );

const totalPedidos =
  document.getElementById(
    "totalPedidos"
  );

const totalPendentes =
  document.getElementById(
    "totalPendentes"
  );

const totalEntregues =
  document.getElementById(
    "totalEntregues"
  );

const filtroPendentes =
  document.getElementById(
    "filtroPendentes"
  );

const filtroTodos =
  document.getElementById(
    "filtroTodos"
  );

const mensagem =
  document.getElementById(
    "mensagem"
  );


/* =====================================================
   ESTADO
===================================================== */

let adminAtual =
  null;

let pedidos =
  [];

let filtroAtual =
  "pendentes";


/* =====================================================
   ADMIN
===================================================== */

const EMAIL_ADMIN =
  "raphafentyramos@gmail.com";


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
  texto,
  tipo
){

  mensagem.textContent =
    texto;

  mensagem.className =
    "mensagem show " +
    tipo;


  setTimeout(
    () => {

      mensagem.className =
        "mensagem";

    },
    3500
  );

}


/* =====================================================
   CONVERTER DATA
===================================================== */

function converterData(
  valor
){

  if(
    !valor
  ){

    return null;

  }


  if(
    typeof valor.toDate ===
    "function"
  ){

    return valor.toDate();

  }


  if(
    typeof valor.toMillis ===
    "function"
  ){

    return new Date(
      valor.toMillis()
    );

  }


  if(
    typeof valor.seconds ===
    "number"
  ){

    return new Date(
      valor.seconds * 1000
    );

  }


  if(
    valor instanceof Date
  ){

    return valor;

  }


  return null;

}


/* =====================================================
   FORMATAR DATA
===================================================== */

function formatarData(
  valor
){

  const data =
    converterData(
      valor
    );


  if(
    !data
  ){

    return "—";

  }


  return data.toLocaleString(
    "pt-BR",
    {
      dateStyle:
        "short",

      timeStyle:
        "medium"
    }
  );

}


/* =====================================================
   CARREGAR ENTREGAS
===================================================== */

async function carregarEntregas(){

  lista.innerHTML = `

    <div class="sem-resultados">

      🔄 Carregando entregas...

    </div>

  `;


  try{

    /*
    -----------------------------------------------------
    PRIMEIRA COLEÇÃO
    -----------------------------------------------------

    A coleção principal será:

      entregas

    */

    const resultadoEntregas =
      await getDocs(
        collection(
          db,
          "entregas"
        )
      );


    /*
    -----------------------------------------------------
    SEGUNDA COLEÇÃO
    -----------------------------------------------------

    Também carregamos pedidosRecompensas.

    Isso mantém compatibilidade com os pedidos
    que criarmos posteriormente pela loja.
    */

    const resultadoPedidos =
      await getDocs(
        collection(
          db,
          "pedidosRecompensas"
        )
      );


    const listaEntregas =

      resultadoEntregas.docs.map(
        documento => ({

          id:
            documento.id,

          origem:
            "entregas",

          ...documento.data()

        })
      );


    const listaPedidos =

      resultadoPedidos.docs.map(
        documento => ({

          id:
            documento.id,

          origem:
            "pedidosRecompensas",

          ...documento.data()

        })
      );


    /*
    -----------------------------------------------------
    JUNTA AS DUAS COLEÇÕES
    -----------------------------------------------------
    */

    pedidos =
      [
        ...listaEntregas,
        ...listaPedidos
      ];


    /*
    Remove possíveis duplicados.
    */

    const mapa =
      new Map();


    pedidos.forEach(
      pedido => {

        const chave =

          pedido.id +
          "_" +
          pedido.uid +
          "_" +
          pedido.origem;


        mapa.set(
          chave,
          pedido
        );

      }
    );


    pedidos =
      Array.from(
        mapa.values()
      );


    /*
    -----------------------------------------------------
    ORDENA MAIS RECENTES PRIMEIRO
    -----------------------------------------------------
    */

    pedidos.sort(
      (
        a,
        b
      ) => {

        const aData =
          converterData(
            a.criadoEm ||
            a.dataHora ||
            a.solicitadoEm
          )?.getTime() || 0;


        const bData =
          converterData(
            b.criadoEm ||
            b.dataHora ||
            b.solicitadoEm
          )?.getTime() || 0;


        return bData - aData;

      }
    );


    atualizarResumo();

    renderizar();

  }

  catch(error){

    console.error(
      "Erro ao carregar entregas:",
      error
    );


    lista.innerHTML = `

      <div class="erro-box">

        ❌ <b>Não foi possível carregar as entregas.</b>

        <br><br>

        ${error.message || "Erro desconhecido."}

        <br><br>

        Se ainda não existe nenhuma entrega,
        isso é normal. Quando a primeira recompensa
        for criada, ela aparecerá aqui.

      </div>

    `;

  }

}


/* =====================================================
   RESUMO
===================================================== */

function atualizarResumo(){

  const pendentes =
    pedidos.filter(
      pedido =>
        pedido.status !==
        "entregue"
        &&
        pedido.entregue !==
        true
    );


  const entregues =
    pedidos.filter(
      pedido =>
        pedido.status ===
        "entregue"
        ||
        pedido.entregue ===
        true
    );


  totalPedidos.textContent =
    pedidos.length;


  totalPendentes.textContent =
    pendentes.length;


  totalEntregues.textContent =
    entregues.length;

}


/* =====================================================
   FILTRAR
===================================================== */

function pedidosFiltrados(){

  let resultado;


  if(
    filtroAtual ===
    "pendentes"
  ){

    resultado =
      pedidos.filter(
        pedido =>

          pedido.status !==
          "entregue"

          &&

          pedido.entregue !==
          true
      );

  }

  else{

    resultado =
      [...pedidos];

  }


  const termo =
    busca.value
      .trim()
      .toLowerCase();


  if(
    termo
  ){

    resultado =
      resultado.filter(
        pedido => {

          const texto = [

            pedido.id,

            pedido.uid,

            pedido.usuarioId,

            pedido.usuarioEmail,

            pedido.email,

            pedido.usuarioNome,

            pedido.nome,

            pedido.recompensaNome,

            pedido.premioNome,

            pedido.tipo,

            pedido.status

          ]

          .filter(Boolean)

          .join(" ")

          .toLowerCase();


          return texto.includes(
            termo
          );

        }
      );

  }


  return resultado;

}


/* =====================================================
   RENDERIZAR
===================================================== */

function renderizar(){

  const listaAtual =
    pedidosFiltrados();


  lista.innerHTML =
    "";


  if(
    listaAtual.length === 0
  ){

    const vazio =
      document.createElement(
        "div"
      );


    vazio.className =
      "sem-resultados";


    vazio.innerHTML =

      filtroAtual ===
      "pendentes"

        ?

      "🎉 <b>Nenhuma entrega pendente.</b><br><br>" +
      "Quando houver um prêmio para entregar, " +
      "ele aparecerá automaticamente aqui."

        :

      "📜 Nenhum pedido encontrado.";


    lista.appendChild(
      vazio
    );


    return;

  }


  listaAtual.forEach(
    pedido => {

      lista.appendChild(
        criarPedido(
          pedido
        )
      );

    }
  );

}


/* =====================================================
   CRIAR CARD
===================================================== */

function criarPedido(
  pedido
){

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "pedido";


  const entregue =

    pedido.status ===
    "entregue"

    ||

    pedido.entregue ===
    true;


  /*
  -----------------------------------------------------
  TOPO
  -----------------------------------------------------
  */

  const top =
    document.createElement(
      "div"
    );


  top.className =
    "pedido-top";


  const numero =
    document.createElement(
      "div"
    );


  numero.className =
    "pedido-numero";


  numero.textContent =

    "PEDIDO #" +
    pedido.id;


  const status =
    document.createElement(
      "div"
    );


  status.className =

    entregue

      ?

    "status status-entregue"

      :

    "status status-pendente";


  status.textContent =

    entregue

      ?

    "✅ ENTREGUE"

      :

    "⏳ PENDENTE";


  top.appendChild(
    numero
  );


  top.appendChild(
    status
  );


  card.appendChild(
    top
  );


  /*
  -----------------------------------------------------
  ORIGEM
  -----------------------------------------------------
  */

  const origem =
    document.createElement(
      "div"
    );


  origem.style.cssText = `

    margin-top:10px;

    color:#72c9ff;

    font-size:11px;

    font-weight:bold;

  `;


  origem.textContent =

    pedido.origem ===
    "pedidosRecompensas"

      ?

    "🛍️ LOJA / PEDIDO"

      :

    "📦 ENTREGA";


  card.appendChild(
    origem
  );


  /*
  -----------------------------------------------------
  USUÁRIO
  -----------------------------------------------------
  */

  const usuario =
    document.createElement(
      "div"
    );


  usuario.className =
    "usuario";


  const nome =
    document.createElement(
      "div"
    );


  nome.className =
    "usuario-nome";


  nome.textContent =

    "👤 " +

    (
      pedido.usuarioNome ||
      pedido.nome ||
      "Usuário"
    );


  const email =
    document.createElement(
      "div"
    );


  email.className =
    "usuario-email";


  email.textContent =

    pedido.usuarioEmail ||

    pedido.email ||

    pedido.uid ||

    pedido.usuarioId ||

    "Usuário sem identificação";


  usuario.appendChild(
    nome
  );


  usuario.appendChild(
    email
  );


  card.appendChild(
    usuario
  );


  /*
  -----------------------------------------------------
  RECOMPENSA
  -----------------------------------------------------
  */

  const recompensa =
    document.createElement(
      "div"
    );


  recompensa.className =
    "recompensa";


  const titulo =
    document.createElement(
      "div"
    );


  titulo.className =
    "recompensa-titulo";


  titulo.textContent =
    "RECOMPENSA";


  const recompensaNome =
    document.createElement(
      "div"
    );


  recompensaNome.className =
    "recompensa-nome";


  recompensaNome.textContent =

    "🎁 " +

    (
      pedido.recompensaNome ||

      pedido.premioNome ||

      pedido.recompensa ||

      pedido.nomeRecompensa ||

      "Recompensa"
    );


  const quantidade =
    pedido.quantidade;


  if(
    quantidade != null
  ){

    const qtd =
      document.createElement(
        "div"
      );


    qtd.className =
      "recompensa-qtd";


    qtd.textContent =

      "Quantidade: " +

      Number(
        quantidade
      ).toLocaleString(
        "pt-BR"
      );


    recompensa.appendChild(
      qtd
    );

  }


  recompensa.appendChild(
    titulo
  );


  recompensa.appendChild(
    recompensaNome
  );


  card.appendChild(
    recompensa
  );


  /*
  -----------------------------------------------------
  DETALHES
  -----------------------------------------------------
  */

  const detalhes =
    document.createElement(
      "div"
    );


  detalhes.className =
    "detalhes";


  adicionarDetalhe(
    detalhes,
    "Tipo",
    pedido.tipo ||
    "recompensa"
  );


  adicionarDetalhe(
    detalhes,
    "Solicitado em",
    formatarData(
      pedido.criadoEm ||
      pedido.dataHora ||
      pedido.solicitadoEm
    )
  );


  if(
    pedido.custoMoedas != null
  ){

    adicionarDetalhe(

      detalhes,

      "Custo",

      Number(
        pedido.custoMoedas
      ).toLocaleString(
        "pt-BR"
      ) +

      " Adam Coins"

    );

  }


  card.appendChild(
    detalhes
  );


  /*
  -----------------------------------------------------
  BOTÃO ENTREGAR
  -----------------------------------------------------
  */

  if(
    !entregue
  ){

    const botao =
      document.createElement(
        "button"
      );


    botao.className =
      "entregar";


    botao.type =
      "button";


    botao.textContent =
      "✅ MARCAR COMO ENTREGUE";


    botao.addEventListener(
      "click",
      () => {

        marcarComoEntregue(
          pedido,
          botao
        );

      }
    );


    card.appendChild(
      botao
    );

  }

  else{

    /*
    ---------------------------------------------------
    INFORMAÇÃO DA ENTREGA
    ---------------------------------------------------
    */

    const info =
      document.createElement(
        "div"
      );


    info.className =
      "entrega-info";


    info.innerHTML =

      "✅ <b>Prêmio entregue</b><br>" +

      "Data: " +

      formatarData(
        pedido.entregueEm ||
        pedido.dataEntrega
      ) +

      "<br>" +

      "Entregue por: " +

      (
        pedido.entreguePor ||
        "Administrador"
      );


    card.appendChild(
      info
    );

  }


  return card;

}


/* =====================================================
   DETALHE
===================================================== */

function adicionarDetalhe(
  container,
  titulo,
  valor
){

  const linha =
    document.createElement(
      "div"
    );


  linha.className =
    "detalhe";


  const label =
    document.createElement(
      "span"
    );


  label.textContent =
    titulo;


  const valorEl =
    document.createElement(
      "strong"
    );


  valorEl.textContent =
    valor;


  linha.appendChild(
    label
  );


  linha.appendChild(
    valorEl
  );


  container.appendChild(
    linha
  );

}


/* =====================================================
   MARCAR COMO ENTREGUE
===================================================== */

async function marcarComoEntregue(
  pedido,
  botao
){

  if(
    !adminAtual
  ){

    mostrarMensagem(
      "❌ Administrador não identificado.",
      "erro"
    );

    return;

  }


  const confirmar =
    confirm(
      "Marcar este prêmio como ENTREGUE?"
    );


  if(
    !confirmar
  ){

    return;

  }


  botao.disabled =
    true;


  botao.textContent =
    "REGISTRANDO...";


  try{

    const referencia =
      doc(

        db,

        pedido.origem,

        pedido.id

      );


    await updateDoc(

      referencia,

      {

        status:
          "entregue",

        entregue:
          true,

        entregueEm:
          Timestamp.now(),

        entreguePor:
          adminAtual.email

      }

    );


    mostrarMensagem(
      "✅ Prêmio marcado como entregue!",
      "sucesso"
    );


    await carregarEntregas();

  }

  catch(error){

    console.error(
      "Erro ao marcar entrega:",
      error
    );


    botao.disabled =
      false;


    botao.textContent =
      "✅ MARCAR COMO ENTREGUE";


    mostrarMensagem(

      "❌ Não foi possível registrar a entrega: " +

      (
        error.message ||
        "Erro desconhecido."
      ),

      "erro"

    );

  }

}

  auth,

    ){

        "index.html";

      return;

    }


    /*
    -----------------------------------------------------

    */

    adminAtual =

    /*
    -----------------------------------------------------

    -----------------------------------------------------
    */

    if(

      (

      .toLowerCase()

          justify-content:center;

          font-family:Arial;

          background:#061b2d;
        ">

            <div style="

            ">
              🔒
            </div>

            <h1>
              Acesso restrito
            </h1>

            <p style="
              margin-top:10px;
              color:#9fc5e3;
            ">
              Esta área é exclusiva do administrador.
            </p>

          </div>

        </div>

      `;

    /*

    await carregarEntregas();

  }

);
