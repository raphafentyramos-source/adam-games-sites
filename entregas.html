<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
}
from

  getDocs,
  updateDoc,
  doc,
  Timestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:
    "adam-games-21081.firebaseapp.com",

  projectId:
    "adam-games-21081",

  storageBucket:
    "adam-games-21081.firebasestorage.app",

  messagingSenderId:
    "1055528418738",

  appId:
    "1:1055528418738:web:5fafdf63424ba9744eb8ab"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================================
   ELEMENTOS
===================================================== */

const lista =
  document.getElementById(
    "lista"
  );


const busca =
  document.getElementById(
    "busca"
  );


const totalPedidos =
  document.getElementById(
    "totalPedidos"
  );


const totalPendentes =
  document.getElementById(
    "totalPendentes"
  );


const totalEntregues =
  document.getElementById(
    "totalEntregues"
  );


const filtroPendentes =
  document.getElementById(
    "filtroPendentes"
  );


const filtroTodos =
  document.getElementById(
    "filtroTodos"
  );


const mensagem =
  document.getElementById(
    "mensagem"
  );


/* =====================================================
   ESTADO
===================================================== */

let usuarioAdmin =
  null;

let pedidos =
  [];

let filtroAtual =
  "pendentes";


/* =====================================================
   ADMIN
===================================================== */

const EMAIL_ADMIN =
  "raphafentyramos@gmail.com";


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
  texto,
  tipo
){

  mensagem.textContent =
    texto;

  mensagem.className =
    "mensagem show " +
    tipo;


  setTimeout(
    () => {

      mensagem.className =
        "mensagem";

    },
    3500
  );

}


/* =====================================================
   DATA
===================================================== */

function converterData(
  valor
){

  if(
    !valor
  ){

    return null;

  }


  if(
    typeof valor.toDate ===
    "function"
  ){

    return valor.toDate();

  }


  if(
    typeof valor.toMillis ===
    "function"
  ){

    return new Date(
      valor.toMillis()
    );

  }


  if(
    typeof valor.seconds ===
    "number"
  ){

    return new Date(
      valor.seconds * 1000
    );

  }


  if(
    valor instanceof Date
  ){

    return valor;

  }


  return null;

}


/* =====================================================
   FORMATAR DATA
===================================================== */

function formatarData(
  valor
){

  const data =
    converterData(
      valor
    );


  if(
    !data
  ){

    return "—";

  }


  return data.toLocaleString(
    "pt-BR",
    {
      dateStyle:
        "short",

      timeStyle:
        "medium"
    }
  );

}


/* =====================================================
   CARREGAR PEDIDOS
===================================================== */

async function carregarPedidos(){

  try{

    const resultado =
      await getDocs(
        collection(
          db,
          "pedidosRecompensas"
        )
      );


    pedidos =
      resultado.docs

      .map(
        documento => ({

          id:
            documento.id,

          ...documento.data()

        })
      );


    /*
    Ordena os mais recentes primeiro.
    */

    pedidos.sort(
      (
        a,
        b
      ) => {

        const aData =
          converterData(
            a.criadoEm
          )?.getTime() || 0;


        const bData =
          converterData(
            b.criadoEm
          )?.getTime() || 0;


        return bData - aData;

      }
    );


    atualizarResumo();

    renderizar();

  }

  catch(error){

    console.error(
      "Erro ao carregar pedidos:",
      error
    );


    lista.innerHTML = `

      <div class="sem-resultados">

        ❌ Não foi possível carregar os pedidos.

        <br><br>

        Verifique as Rules do Firestore.

      </div>

    `;

  }

}


/* =====================================================
   RESUMO
===================================================== */

function atualizarResumo(){

  const pendentes =
    pedidos.filter(
      pedido =>
        pedido.status !==
        "entregue"
    );


  const entregues =
    pedidos.filter(
      pedido =>
        pedido.status ===
        "entregue"
    );


  totalPedidos.textContent =
    pedidos.length;


  totalPendentes.textContent =
    pendentes.length;


  totalEntregues.textContent =
    entregues.length;

}


/* =====================================================
   FILTRAR
===================================================== */

function pedidosFiltrados(){

  let resultado =

    filtroAtual ===
    "pendentes"

      ?

    pedidos.filter(
      pedido =>
        pedido.status !==
        "entregue"
    )

      :

    [...pedidos];


  const termo =
    busca.value
      .trim()
      .toLowerCase();


  if(
    termo
  ){

    resultado =
      resultado.filter(
        pedido => {

          const texto = [

            pedido.id,

            pedido.usuarioId,

            pedido.usuarioEmail,

            pedido.usuarioNome,

            pedido.recompensaNome,

            pedido.tipo,

            pedido.status

          ]

          .filter(Boolean)

          .join(" ")

          .toLowerCase();


          return texto.includes(
            termo
          );

        }
      );

  }


  return resultado;

}


/* =====================================================
   RENDERIZAR
===================================================== */

function renderizar(){

  const listaAtual =
    pedidosFiltrados();


  lista.innerHTML =
    "";


  if(
    listaAtual.length === 0
  ){

    const vazio =
      document.createElement(
        "div"
      );


    vazio.className =
      "sem-resultados";


    vazio.textContent =

      filtroAtual ===
      "pendentes"

        ?

      "🎉 Não existem entregas pendentes."

        :

      "📜 Nenhum pedido encontrado.";


    lista.appendChild(
      vazio
    );


    return;

  }


  listaAtual.forEach(
    pedido => {

      lista.appendChild(
        criarPedido(
          pedido
        )
      );

    }
  );

}


/* =====================================================
   CRIAR CARD
===================================================== */

function criarPedido(
  pedido
){

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "pedido";


  const entregue =
    pedido.status ===
    "entregue";


  /*
  -----------------------------------------------------
  TOPO
  -----------------------------------------------------
  */

  const top =
    document.createElement(
      "div"
    );


  top.className =
    "pedido-top";


  const numero =
    document.createElement(
      "div"
    );


  numero.className =
    "pedido-numero";


  numero.textContent =
    "PEDIDO #" +
    pedido.id;


  const status =
    document.createElement(
      "div"
    );


  status.className =

    entregue

      ?

    "status status-entregue"

      :

    "status status-pendente";


  status.textContent =

    entregue

      ?

    "✅ ENTREGUE"

      :

    "⏳ PENDENTE";


  top.appendChild(
    numero
  );


  top.appendChild(
    status
  );


  card.appendChild(
    top
  );


  /*
  -----------------------------------------------------
  USUÁRIO
  -----------------------------------------------------
  */

  const usuario =
    document.createElement(
      "div"
    );


  usuario.className =
    "usuario";


  const nome =
    document.createElement(
      "div"
    );


  nome.className =
    "usuario-nome";


  nome.textContent =

    "👤 " +

    (
      pedido.usuarioNome ||
      "Usuário"
    );


  const email =
    document.createElement(
      "div"
    );


  email.className =
    "usuario-email";


  email.textContent =

    pedido.usuarioEmail ||

    pedido.usuarioId ||

    "Usuário sem e-mail";


  usuario.appendChild(
    nome
  );


  usuario.appendChild(
    email
  );


  card.appendChild(
    usuario
  );


  /*
  -----------------------------------------------------
  RECOMPENSA
  -----------------------------------------------------
  */

  const recompensa =
    document.createElement(
      "div"
    );


  recompensa.className =
    "recompensa";


  const titulo =
    document.createElement(
      "div"
    );


  titulo.className =
    "recompensa-titulo";


  titulo.textContent =
    "RECOMPENSA";


  const recompensaNome =
    document.createElement(
      "div"
    );


  recompensaNome.className =
    "recompensa-nome";


  recompensaNome.textContent =

    "🎁 " +

    (
      pedido.recompensaNome ||
      "Recompensa"
    );


  const recompensaQtd =
    document.createElement(
      "div"
    );


  recompensaQtd.className =
    "recompensa-qtd";


  recompensaQtd.textContent =

    pedido.quantidade != null

      ?

    "Quantidade: " +
    Number(
      pedido.quantidade
    ).toLocaleString(
      "pt-BR"
    )

      :

    "";


  recompensa.appendChild(
    titulo
  );


  recompensa.appendChild(
    recompensaNome
  );


  if(
    recompensaQtd.textContent
  ){

    recompensa.appendChild(
      recompensaQtd
    );

  }


  card.appendChild(
    recompensa
  );


  /*
  -----------------------------------------------------
  DETALHES
  -----------------------------------------------------
  */

  const detalhes =
    document.createElement(
      "div"
    );


  detalhes.className =
    "detalhes";


  adicionarDetalhe(
    detalhes,
    "Tipo",
    pedido.tipo ||
    "recompensa"
  );


  adicionarDetalhe(
    detalhes,
    "Solicitado em",
    formatarData(
      pedido.criadoEm
    )
  );


  if(
    pedido.custoMoedas != null
  ){

    adicionarDetalhe(
      detalhes,
      "Custo",
      Number(
        pedido.custoMoedas
      ).toLocaleString(
        "pt-BR"
      ) +
      " Adam Coins"
    );

  }


  card.appendChild(
    detalhes
  );


  /*
  -----------------------------------------------------
  BOTÃO
  -----------------------------------------------------
  */

  if(
    !entregue
  ){

    const botao =
      document.createElement(
        "button"
      );


    botao.className =
      "entregar";


    botao.type =
      "button";


    botao.textContent =
      "✅ MARCAR COMO ENTREGUE";


    botao.addEventListener(
      "click",
      () => {

        marcarComoEntregue(
          pedido.id,
          botao
        );

      }
    );


    card.appendChild(
      botao
    );

  }

  else{

    const info =
      document.createElement(
        "div"
      );


    info.className =
      "entrega-info";


    info.innerHTML =

      "✅ <b>Prêmio entregue</b><br>" +

      "Data: " +

      formatarData(
        pedido.entregueEm
      ) +

      "<br>" +

      "Entregue por: " +

      (
        pedido.entreguePor ||
        "Administrador"
      );


    card.appendChild(
      info
    );

  }


  return card;

}


/* =====================================================
   DETALHE
===================================================== */

function adicionarDetalhe(
  container,
  titulo,
  valor
){

  const linha =
    document.createElement(
      "div"
    );


  linha.className =
    "detalhe";


  const label =
    document.createElement(
      "span"
    );


  label.textContent =
    titulo;


  const valorEl =
    document.createElement(
      "strong"
    );


  valorEl.textContent =
    valor;


  linha.appendChild(
    label
  );


  linha.appendChild(
    valorEl
  );


  container.appendChild(
    linha
  );

}


/* =====================================================
   MARCAR COMO ENTREGUE
===================================================== */

async function marcarComoEntregue(
  pedidoId,
  botao
){

  if(
    !usuarioAdmin
  ){

    return;

  }


  const confirmar =
    confirm(
      "Marcar este prêmio como ENTREGUE?"
    );


  if(
    !confirmar
  ){

    return;

  }


  botao.disabled =
    true;


  botao.textContent =
    "REGISTRANDO...";


  try{

    await updateDoc(

      doc(
        db,
        "pedidosRecompensas",
        pedidoId
      ),

      {

        status:
          "entregue",

        entregue:
          true,

        entregueEm:
          Timestamp.now(),

        entreguePor:
          usuarioAdmin.email

      }

    );


    mostrarMensagem(
      "✅ Prêmio marcado como entregue!",
      "sucesso"
    );


    await carregarPedidos();

  }

  catch(error){

    console.error(
      "Erro ao marcar entrega:",
      error
    );


    botao.disabled =
      false;


    botao.textContent =
      "✅ MARCAR COMO ENTREGUE";


    mostrarMensagem(
      "❌ Não foi possível registrar a entrega.",
      "erro"
    );

  }

}
