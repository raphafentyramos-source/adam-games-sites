<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adam Games • Feed</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%}
body{
  min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#fff;overflow-x:hidden;
  background:linear-gradient(rgba(2,20,45,.22),rgba(2,20,45,.72)),
  url("6AB154F8-5052-4D70-B604-F3C0BEE88348.png") center top/cover fixed no-repeat;
}
button{font-family:inherit}
.page{width:100%;max-width:820px;margin:auto;padding:14px 14px 105px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;padding:8px 15px 8px 8px;border-radius:21px;background:rgba(4,45,91,.88);border:1px solid rgba(255,255,255,.14);box-shadow:0 12px 30px rgba(0,0,0,.22)}
.brand-icon{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:29px;background:linear-gradient(145deg,#218fff,#0754a7)}
.brand-name{font-size:18px;font-weight:900;line-height:.95}.brand-name span{color:#ffd52b}
.back{width:52px;height:52px;border:0;border-radius:17px;background:rgba(4,40,82,.92);color:#fff;font-size:25px;cursor:pointer}

.hero-feed{
  position:relative;overflow:hidden;margin-top:8px;padding:25px 21px 23px;border-radius:28px;
  background:
    radial-gradient(circle at 88% 15%,rgba(255,213,43,.25),transparent 24%),
    radial-gradient(circle at 8% 90%,rgba(38,159,255,.28),transparent 32%),
    linear-gradient(145deg,#075db1,#082c60 68%,#061d42);
  border:1px solid rgba(78,190,255,.55);box-shadow:0 20px 48px rgba(0,0,0,.3);
}
.hero-feed:after{content:"";position:absolute;width:150px;height:150px;right:-55px;top:-55px;border-radius:50%;background:rgba(255,255,255,.09);filter:blur(2px)}
.new-tag{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:12px;background:rgba(255,213,43,.17);border:1px solid rgba(255,213,43,.4);color:#ffe36a;font-size:10px;font-weight:1000;letter-spacing:.7px}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:15px;position:relative;z-index:1}
.hero-title{margin-top:10px;font-size:clamp(29px,7vw,46px);font-weight:1000;line-height:.95}
.hero-text{margin-top:9px;color:#d0e8fa;font-size:13px;line-height:1.4;max-width:560px}
.hero-icon{font-size:65px;filter:drop-shadow(0 10px 15px rgba(0,0,0,.35))}
.feed-button{
  margin-top:17px;border:0;border-radius:15px;padding:13px 17px;background:linear-gradient(135deg,#ffd52b,#e49b08);
  color:#3a2600;font-weight:1000;font-size:13px;cursor:pointer;box-shadow:0 9px 20px rgba(0,0,0,.2)
}
.composer{
  margin-top:14px;padding:15px;border-radius:22px;background:rgba(3,28,58,.88);
  border:1px solid rgba(255,255,255,.12);box-shadow:0 12px 28px rgba(0,0,0,.2)
}
.composer-top{display:flex;align-items:center;gap:10px}
.my-avatar{width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,#ffd347,#f4a800);display:flex;align-items:center;justify-content:center;font-size:25px;border:2px solid #ffd52b}
.fake-input{flex:1;min-width:0;padding:13px 15px;border-radius:15px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#9db8d0;font-size:13px;cursor:pointer}
.composer-actions{display:flex;gap:8px;margin-top:11px}
.action-mini{flex:1;border:0;border-radius:12px;padding:10px;background:rgba(255,255,255,.06);color:#cce4f7;font-weight:900;font-size:11px;cursor:pointer}
.section-head{display:flex;align-items:end;justify-content:space-between;margin:22px 3px 10px}
.section-head h2{font-size:20px}.section-head span{color:#8fb6d5;font-size:11px}
.post{
  margin-top:12px;padding:15px;border-radius:23px;background:rgba(3,29,59,.91);
  border:1px solid rgba(255,255,255,.11);box-shadow:0 14px 32px rgba(0,0,0,.25)
}
.post-head{display:flex;align-items:center;gap:10px}
.post-avatar{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,#ffd347,#e8a800);border:2px solid #ffd52b;display:flex;align-items:center;justify-content:center;font-size:25px;flex:0 0 46px}
.post-user{font-size:14px;font-weight:1000}.post-meta{margin-top:3px;color:#7fa7c5;font-size:10px}
.post-text{margin-top:12px;color:#e7f3fc;font-size:14px;line-height:1.48;white-space:pre-wrap}
.post-image{width:100%;margin-top:12px;border-radius:18px;display:block;max-height:520px;object-fit:cover;border:1px solid rgba(255,255,255,.08)}
.post-actions{display:grid;grid-template-columns:1fr 1fr;margin-top:12px;border-top:1px solid rgba(255,255,255,.08);padding-top:9px;gap:7px}
.post-action{border:0;background:transparent;color:#a8c2d9;padding:9px;border-radius:11px;font-weight:900;font-size:12px;cursor:pointer}
.post-action:hover{background:rgba(255,255,255,.06);color:#fff}.post-action.liked{color:#ff5570}
.comments{margin-top:8px;display:none}.comments.show{display:block}
.comment{padding:9px 10px;margin-top:7px;border-radius:12px;background:rgba(255,255,255,.045);color:#cfe2f2;font-size:12px;line-height:1.35}
.comment strong{color:#fff}
.comment-box{display:flex;gap:7px;margin-top:9px}
.comment-input{flex:1;min-width:0;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.18);color:#fff;border-radius:12px;padding:10px;font-size:12px;outline:none}
.comment-send{border:0;border-radius:12px;background:#168fff;color:#fff;padding:0 14px;font-weight:1000;cursor:pointer}
.empty{padding:35px 15px;text-align:center;color:#8eaac2}
.modal{position:fixed;inset:0;z-index:999;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(0,0,0,.72);backdrop-filter:blur(7px)}
.modal.show{display:flex}
.modal-box{width:100%;max-width:480px;max-height:90vh;overflow:auto;padding:20px;border-radius:24px;background:linear-gradient(145deg,#073d76,#021a38);border:1px solid rgba(255,255,255,.16);box-shadow:0 25px 80px rgba(0,0,0,.5)}
.modal-box h3{font-size:22px}.subtitle{margin-top:5px;color:#9fc0db;font-size:12px;line-height:1.4}
.form-label{display:block;margin:16px 0 6px;color:#8db9dc;font-size:10px;font-weight:1000;text-transform:uppercase}
.textarea{width:100%;min-height:105px;resize:vertical;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.2);color:#fff;padding:12px;outline:none;font-family:inherit}
.file{width:100%;padding:11px;border-radius:13px;background:rgba(255,255,255,.07);color:#bcd7eb;border:1px solid rgba(255,255,255,.1)}
.preview{display:none;width:100%;max-height:260px;object-fit:cover;border-radius:15px;margin-top:10px}
.modal-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.modal-buttons button{height:47px;border:0;border-radius:13px;font-weight:1000;cursor:pointer}
.publish{background:linear-gradient(135deg,#168fff,#0065d5);color:#fff}.cancel{background:rgba(255,255,255,.09);color:#fff}
.bottom-nav{position:fixed;z-index:100;left:50%;bottom:10px;transform:translateX(-50%);width:min(95%,700px);padding:9px;border-radius:27px;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(4,25,52,.96);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,.13);box-shadow:0 15px 40px rgba(0,0,0,.4)}
.nav-button{border:0;background:transparent;color:#8198af;padding:6px;cursor:pointer;font-size:10px;font-weight:bold}.nav-button span{display:block;margin-bottom:3px;font-size:23px}.nav-button.active{color:#1fa2ff}
.toast{position:fixed;z-index:2000;left:50%;bottom:88px;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:12px 17px;border-radius:14px;background:#082f58;border:1px solid rgba(60,180,255,.5);box-shadow:0 10px 30px rgba(0,0,0,.4);font-size:12px;font-weight:900;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){
 .page{padding:10px 10px 105px}.hero-feed{padding:21px 17px}.hero-icon{font-size:52px}.hero-title{font-size:32px}
 .post{padding:13px}.composer-actions{gap:6px}.action-mini{font-size:10px;padding:9px 5px}
}

.feed-mural-banner{
  margin:14px 0 0;
  border-radius:24px;
  overflow:hidden;
  border:2px solid rgba(54,185,255,.58);
  background:#061b3a;
  box-shadow:0 14px 34px rgba(0,0,0,.30);
}
.feed-mural-banner img{
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:2048/768;
  object-fit:cover;
  object-position:center;
}
@media(max-width:520px){
  .feed-mural-banner{border-radius:20px}
}
</style>
</head>
<body>
<div class="page">
<header class="topbar">
  <div class="brand"><div class="brand-icon">👑</div><div class="brand-name">ADAM<br><span>GAMES</span></div></div>
  <button class="back" id="backButton" type="button">←</button>
</header>
<section class="feed-mural-banner" aria-label="Mural da Comunidade">
  <img src="04596C32-08FC-4D7A-BD75-B800607B10A4.png" alt="Mural da Comunidade Adam Games" loading="eager">
</section>


<section class="hero-feed">
  <div class="hero-row">
    <div>
      <div class="new-tag">✨ NOVO • COMUNIDADE</div>
      <div class="hero-title">MURAL<br>ADAM GAMES</div>
      <div class="hero-text">Mostre suas conquistas, compartilhe seus momentos e descubra o que a comunidade está fazendo.</div>
      <button class="feed-button" id="heroCreate" type="button">＋ CRIAR PUBLICAÇÃO</button>
    </div>
    <div class="hero-icon">📰</div>
  </div>
</section>

<section class="composer">
  <div class="composer-top">
    <div class="my-avatar">🙂</div>
    <div class="fake-input" id="fakeInput">O que você quer compartilhar?</div>
  </div>
  <div class="composer-actions">
    <button class="action-mini" id="photoButton" type="button">📷 FOTO</button>
    <button class="action-mini" id="textButton" type="button">✍️ PUBLICAR</button>
  </div>
</section>

<div class="section-head"><h2>📰 Publicações</h2><span id="postCount">0 publicações</span></div>
<main id="feed"></main>
</div>

<nav class="bottom-nav">
  <button class="nav-button" id="panelNav"><span>🏠</span>Painel</button>
  <button class="nav-button active"><span>📰</span>Feed</button>
  <button class="nav-button" id="profileNav"><span>👤</span>Perfil</button>
</nav>

<div class="modal" id="publishModal">
 <div class="modal-box">
  <h3>✨ Nova publicação</h3>
  <div class="subtitle">Compartilhe um momento com a comunidade Adam Games.</div>
  <label class="form-label">Texto</label>
  <textarea class="textarea" id="postText" maxlength="500" placeholder="Escreva algo..."></textarea>
  <label class="form-label">Foto • opcional • 1 por publicação</label>
  <input class="file" id="postImage" type="file" accept="image/*">
  <img class="preview" id="preview" alt="Prévia da foto">
  <div class="modal-buttons">
    <button class="cancel" id="cancelModal" type="button">CANCELAR</button>
    <button class="publish" id="publishButton" type="button">PUBLICAR</button>
  </div>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY="adam_games_feed_v1";
let posts=[];
try{posts=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){posts=[]}

const feed=document.getElementById("feed");
const modal=document.getElementById("publishModal");
const text=document.getElementById("postText");
const image=document.getElementById("postImage");
const preview=document.getElementById("preview");
const toast=document.getElementById("toast");

function save(){localStorage.setItem(KEY,JSON.stringify(posts))}
function showToast(msg){
 toast.textContent=msg;toast.classList.add("show");
 clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove("show"),1800);
}
function openModal(){modal.classList.add("show");text.focus()}
function closeModal(){modal.classList.remove("show");text.value="";image.value="";preview.style.display="none";preview.src=""}
document.getElementById("heroCreate").onclick=openModal;
document.getElementById("fakeInput").onclick=openModal;
document.getElementById("textButton").onclick=openModal;
document.getElementById("photoButton").onclick=()=>{openModal();setTimeout(()=>image.click(),80)};
document.getElementById("cancelModal").onclick=closeModal;
modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});

image.addEventListener("change",()=>{
 const f=image.files[0]; if(!f)return;
 if(f.size>5*1024*1024){showToast("A foto deve ter no máximo 5 MB.");image.value="";return}
 const r=new FileReader();
 r.onload=()=>{preview.src=r.result;preview.style.display="block"};
 r.readAsDataURL(f);
});

function timeAgo(ts){
 const s=Math.floor((Date.now()-ts)/1000);
 if(s<60)return"agora";
 const m=Math.floor(s/60);if(m<60)return`há ${m} min`;
 const h=Math.floor(m/60);if(h<24)return`há ${h} h`;
 const d=Math.floor(h/24);return`há ${d} dia${d>1?"s":""}`;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

function render(){
 document.getElementById("postCount").textContent=`${posts.length} publicação${posts.length===1?"":"ões"}`;
 if(!posts.length){
   feed.innerHTML=`<div class="empty">🌟<br><br>O mural ainda está vazio.<br><strong>Seja o primeiro a publicar!</strong></div>`;
   return;
 }
 feed.innerHTML=posts.map((p,i)=>`
 <article class="post">
   <div class="post-head">
    <div class="post-avatar">🙂</div>
    <div><div class="post-user">${escapeHtml(p.user||"Jogador Adam Games")}</div><div class="post-meta">⭐ Nível ${p.level||1} • ${timeAgo(p.createdAt)}</div></div>
   </div>
   ${p.text?`<div class="post-text">${escapeHtml(p.text)}</div>`:""}
   ${p.image?`<img class="post-image" src="${p.image}" alt="Foto da publicação">`:""}
   <div class="post-actions">
    <button class="post-action ${p.liked?"liked":""}" onclick="toggleLike(${i})">❤️ ${p.likes||0} Curtir</button>
    <button class="post-action" onclick="toggleComments(${i})">💬 ${(p.comments||[]).length} Comentar</button>
   </div>
   <div class="comments ${p.showComments?"show":""}" id="comments-${i}">
    ${(p.comments||[]).map(c=>`<div class="comment"><strong>${escapeHtml(c.user)}:</strong> ${escapeHtml(c.text)}</div>`).join("")}
    <div class="comment-box"><input class="comment-input" id="comment-${i}" maxlength="250" placeholder="Escreva um comentário..."><button class="comment-send" onclick="addComment(${i})">➤</button></div>
   </div>
 </article>`).join("");
}
window.toggleLike=function(i){posts[i].liked=!posts[i].liked;posts[i].likes=Math.max(0,(posts[i].likes||0)+(posts[i].liked?1:-1));save();render()}
window.toggleComments=function(i){posts[i].showComments=!posts[i].showComments;save();render()}
window.addComment=function(i){
 const el=document.getElementById("comment-"+i);const value=el.value.trim();if(!value)return;
 posts[i].comments=posts[i].comments||[];posts[i].comments.push({user:"Você",text:value});posts[i].showComments=true;save();render();
 setTimeout(()=>{const x=document.getElementById("comment-"+i);if(x)x.focus()},30);
}
document.getElementById("publishButton").onclick=()=>{
 const value=text.value.trim();const f=image.files[0];
 if(!value && !f){showToast("Escreva algo ou adicione uma foto.");return}
 const finish=(img="")=>{
  posts.unshift({user:"Você",level:1,text:value,image:img,likes:0,liked:false,comments:[],createdAt:Date.now()});
  save();render();closeModal();showToast("Publicação criada! 🎉");
 };
 if(f){
  if(f.size>5*1024*1024){showToast("A foto deve ter no máximo 5 MB.");return}
  const r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(f);
 }else finish();
}
document.getElementById("backButton").onclick=()=>{location.href="painel.html"};
document.getElementById("panelNav").onclick=()=>{location.href="painel.html"};
document.getElementById("profileNav").onclick=()=>{showToast("Perfil social em breve.")};
render();
setInterval(render,60000);
</script>
</body>
</html>
