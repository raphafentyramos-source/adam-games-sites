<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"

<title>Adam Games • Forca</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  background:#061b2d;
}

body{

  min-height:100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:#fff;

  background:

    radial-gradient(
      circle at 10% 0%,
      rgba(0,205,120,.42),
      transparent 30%
    ),

    radial-gradient(
      circle at 90% 10%,
      rgba(25,170,255,.42),
      transparent 30%
    ),

    linear-gradient(
      180deg,
      #087fc1 0%,
      #064b80 48%,
      #031c35 100%
    );

}


/* =====================================================
   PÁGINA
===================================================== */

.page{

  width:100%;

  max-width:650px;

  margin:0 auto;

  padding:
    16px
    15px
    80px;

}


/* =====================================================
   TOPO
===================================================== */

.top{

  display:flex;

  align-items:center;

  justify-content:space-between;

}


.back{

  width:45px;

  height:45px;

  border:0;

  border-radius:14px;

  background:
    rgba(0,30,60,.82);

  color:#fff;

  font-size:25px;

  cursor:pointer;

}


.title{

  text-align:center;

  text-shadow:
    0 2px 8px #000;

}


.title small{

  display:block;

  font-size:9px;

  letter-spacing:2px;

}


.title strong{

  font-size:20px;

}


/* =====================================================
   SALDO
===================================================== */

.top-coins{

  min-width:72px;

  padding:7px 9px;

  border-radius:12px;

  text-align:center;

  background:
    rgba(255,213,43,.12);

  border:
    1px solid
    rgba(255,213,43,.2);

}


.top-coins-label{

  color:#b8d2e6;

  font-size:8px;

  font-weight:bold;

}


.top-coins-value{

  margin-top:2px;

  color:#ffd52b;

  font-size:17px;

  font-weight:900;

}


/* =====================================================
   HERO
===================================================== */

.hero{

  margin-top:15px;

  padding:18px;

  border-radius:23px;

  text-align:center;

  background:
    linear-gradient(
      135deg,
      rgba(0,45,80,.97),
      rgba(2,30,58,.97)
    );

  border:
    1px solid
    rgba(255,255,255,.1);

  box-shadow:
    0 12px 30px
    rgba(0,0,0,.25);

}


.hero-icon{

  font-size:43px;

}


.hero h1{

  margin-top:4px;

  font-size:31px;

  font-weight:900;

}


.hero p{

  margin-top:5px;

  color:#bcd9ec;

  font-size:13px;

}


/* =====================================================
   NÍVEL
===================================================== */

.level-row{

  display:grid;

  grid-template-columns:
    1fr
    1fr
    1fr;

  gap:8px;

  margin-top:12px;

}


.level-box{

  padding:10px 6px;

  border-radius:13px;

  text-align:center;

  background:
    rgba(255,255,255,.065);

  border:
    1px solid
    rgba(255,255,255,.08);

}


.level-label{

  color:#9fc5df;

  font-size:8px;

  font-weight:bold;

}


.level-value{

  margin-top:3px;

  font-size:16px;

  font-weight:900;

}


.level-easy .level-value{
  color:#65ff9c;
}

.level-medium .level-value{
  color:#ffd52b;
}

.level-hard .level-value{
  color:#ff7583;
}


/* =====================================================
   PROGRESSO
===================================================== */

.progress-card{

  margin-top:12px;

  padding:13px;

  border-radius:16px;

  background:
    rgba(2,27,55,.86);

}


.progress-top{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

}


.progress-title{

  font-size:12px;

  font-weight:900;

}


.progress-count{

  color:#9fc5df;

  font-size:11px;

}


.progress-bar{

  height:8px;

  margin-top:8px;

  overflow:hidden;

  border-radius:20px;

  background:
    rgba(255,255,255,.09);

}


.progress-fill{

  height:100%;

  width:0%;

  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      #18bd68,
      #ffd52b
    );

  transition:
    width .3s ease;

}


/* =====================================================
   ÁREA DA FORCA
===================================================== */

.game-card{

  margin-top:13px;

  padding:14px;

  border-radius:21px;

  background:
    rgba(2,27,55,.95);

  border:
    1px solid
    rgba(255,255,255,.1);

  box-shadow:
    0 10px 27px
    rgba(0,0,0,.22);

}


.hangman-wrap{

  position:relative;

  width:100%;

  aspect-ratio:1.15 / 1;

  max-width:460px;

  margin:0 auto;

  overflow:hidden;

  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      rgba(9,55,86,.95),
      rgba(3,27,52,.98)
    );

}


.hangman-wrap img{

  width:100%;

  height:100%;

  display:block;

  object-fit:contain;

}


/* =====================================================
   ERROS
===================================================== */

.errors-row{

  display:flex;

  justify-content:center;

  gap:6px;

  margin-top:11px;

}


.error-dot{

  width:10px;

  height:10px;

  border-radius:50%;

  background:
    rgba(255,255,255,.14);

  border:
    1px solid
    rgba(255,255,255,.1);

}


.error-dot.active{

  background:#ff5365;

  box-shadow:
    0 0 8px
    rgba(255,60,80,.5);

}


/* =====================================================
   DICA
===================================================== */

.hint{

  margin-top:13px;

  padding:13px;

  border-radius:15px;

  text-align:center;

  background:
    rgba(25,170,255,.09);

  border:
    1px solid
    rgba(25,170,255,.13);

}


.hint-label{

  color:#76c9ff;

  font-size:9px;

  font-weight:900;

  letter-spacing:1px;

}


.hint-text{

  margin-top:4px;

  color:#fff;

  font-size:15px;

  font-weight:bold;

}


/* =====================================================
   PALAVRA
===================================================== */

.word{

  display:flex;

  flex-wrap:wrap;

  justify-content:center;

  gap:6px;

  margin-top:18px;

  min-height:48px;

}


.letter{

  width:27px;

  height:39px;

  display:flex;

  align-items:flex-end;

  justify-content:center;

  padding-bottom:5px;

  border-bottom:
    3px solid
    #69cfff;

  color:#fff;

  font-size:24px;

  font-weight:900;

  text-transform:uppercase;

}


.letter.space{

  width:13px;

  border-bottom:0;

}


/* =====================================================
   TECLADO
===================================================== */

.keyboard{

  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  gap:6px;

  margin-top:20px;

}


.key{

  min-height:42px;

  border:0;

  border-radius:10px;

  background:
    linear-gradient(
      145deg,
      #12679a,
      #08476f
    );

  color:#fff;

  font-size:15px;

  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 3px 0
    rgba(0,0,0,.25);

}


.key:active{

  transform:translateY(2px);

}


.key.used{

  opacity:.28;

  cursor:not-allowed;

}


.key.correct{

  background:
    linear-gradient(
      145deg,
      #16b866,
      #087d45
    );

}


.key.wrong{

  background:
    linear-gradient(
      145deg,
      #c72e45,
      #8d182c
    );

}


.key:disabled{

  cursor:not-allowed;

}


/* =====================================================
   MENSAGEM
===================================================== */

.message{

  display:none;

  margin-top:14px;

  padding:15px;

  border-radius:15px;

  text-align:center;

  font-size:14px;

  font-weight:bold;

}


.message.show{
  display:block;
}


.message.success{

  background:
    rgba(0,220,110,.12);

  border:
    1px solid
    rgba(0,220,110,.2);

  color:#72ffae;

}


.message.error{

  background:
    rgba(255,50,70,.12);

  border:
    1px solid
    rgba(255,50,70,.2);

  color:#ff9ca8;

}


/* =====================================================
   BOTÃO CONTINUAR
===================================================== */

.next-button{

  width:100%;

  height:50px;

  margin-top:13px;

  border:0;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #18bd68,
      #087d45
    );

  color:#fff;

  font-size:14px;

  font-weight:900;

  cursor:pointer;

  display:none;

}


.next-button.show{

  display:block;

}


/* =====================================================
   RECOMPENSA
===================================================== */

.reward{

  margin-top:12px;

  padding:13px;

  border-radius:15px;

  text-align:center;

  background:
    rgba(255,213,43,.08);

  border:
    1px solid
    rgba(255,213,43,.17);

}


.reward strong{

  color:#ffd52b;

  font-size:20px;

}


/* =====================================================
   MODAL
===================================================== */

.modal{

  position:fixed;

  inset:0;

  z-index:100;

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:
    rgba(0,10,25,.84);

  backdrop-filter:
    blur(5px);

}


.modal.show{

  display:flex;

}


.modal-card{

  width:100%;

  max-width:380px;

  padding:25px 20px;

  border-radius:23px;

  text-align:center;

  background:#082742;

  border:
    1px solid
    rgba(255,255,255,.12);

  box-shadow:
    0 20px 50px
    rgba(0,0,0,.45);

}


.modal-icon{

  font-size:52px;

}


.modal-card h2{

  margin-top:8px;

  font-size:24px;

}


.modal-card p{

  margin-top:8px;

  color:#b9d5e8;

  font-size:14px;

  line-height:1.5;

}


.modal-coins{

  margin-top:12px;

  color:#ffd52b;

  font-size:22px;

  font-weight:900;

}


.modal-button{

  width:100%;

  height:48px;

  margin-top:18px;

  border:0;

  border-radius:13px;

  background:#18a85c;

  color:#fff;

  font-weight:900;

  cursor:pointer;

}


/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:430px){

  .keyboard{

    grid-template-columns:
      repeat(7,1fr);

    gap:5px;

  }

  .key{

    min-height:39px;

    font-size:14px;

  }

  .letter{

    width:24px;

    font-size:21px;

  }

}

</style>

</head>

/* =====================================================
   NORMALIZAÇÃO
===================================================== */

function normalizarTexto(
  texto
){

  return texto
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .toLowerCase()
    .replace(
      /[^a-z]/g,
      ""
    );

}


/* =====================================================
   CHAVE DE REPETIÇÃO
===================================================== */

function chavePalavrasUsadas(){

  return (
    "adamGames_forca_usadas_" +
    (
      firebaseUser?.uid ||
      "visitante"
    )
  );

}


function carregarPalavrasUsadas(){

  try{

    const dados =
      localStorage.getItem(
        chavePalavrasUsadas()
      );

    if(!dados){
      return [];
    }

    const lista =
      JSON.parse(dados);

    return Array.isArray(lista)
      ?
      lista
      :
      [];

  }
  catch(error){

    return [];

  }

}


function salvarPalavraUsada(
  palavra
){

  try{

    const usadas =
      carregarPalavrasUsadas();

    const chave =
      normalizarTexto(
        palavra
      );

    if(
      !usadas.includes(chave)
    ){

      usadas.push(
        chave
      );

    }

    localStorage.setItem(
      chavePalavrasUsadas(),
      JSON.stringify(usadas)
    );

  }
  catch(error){

    console.error(
      "Erro ao salvar palavra:",
      error
    );

  }

}


/* =====================================================
   ESCOLHER PALAVRA SEM REPETIR
===================================================== */

function escolherPalavra(
  nivel
){

  const lista =
    nivel === "FÁCIL"
      ?
      palavras.facil
      :
      nivel === "MÉDIO"
        ?
        palavras.medio
        :
        palavras.dificil;


  const usadas =
    carregarPalavrasUsadas();


  const disponiveis =
    lista.filter(
      item =>
        !usadas.includes(
          normalizarTexto(
            item[0]
          )
        )
    );


  /*
    Se todas daquele nível já foram usadas,
    limpa SOMENTE aquele nível.

    Assim o jogador não recebe repetição
    enquanto ainda existirem palavras novas.
  */

  let pool =
    disponiveis;


  if(!pool.length){

    const prefixo =
      nivel === "FÁCIL"
        ?
        palavras.facil
        :
        nivel === "MÉDIO"
          ?
          palavras.medio
          :
          palavras.dificil;

    pool =
      prefixo;

  }


  const indice =
    Math.floor(
      Math.random() *
      pool.length
    );


  const escolhida =
    pool[indice];


  salvarPalavraUsada(
    escolhida[0]
  );


  return {

    palavra:
      escolhida[0],

    dica:
      escolhida[1],

    normalizada:
      normalizarTexto(
        escolhida[0]
      )

  };

}


/* =====================================================
   RECOMPENSA
===================================================== */

function recompensaAtual(){

  return sequencia[
    (rodada - 1) %
    sequencia.length
  ].recompensa;

}


function nivelAtual(){

  return sequencia[
    (rodada - 1) %
    sequencia.length
  ];

}


/* =====================================================
   ATUALIZAR INTERFACE DO NÍVEL
===================================================== */

function atualizarNivel(){

  const nivel =
    nivelAtual();


  levelNameEl.textContent =
    nivel.nivel;


  levelNameEl.style.color =
    nivel.nivel === "FÁCIL"
      ?
      "#65ff9c"
      :
      nivel.nivel === "MÉDIO"
        ?
        "#ffd52b"
        :
        "#ff7583";


  roundNumberEl.textContent =
    rodada;


  roundRewardEl.textContent =
    "🪙 " +
    nivel.recompensa;


  const posicao =
    (
      (rodada - 1) %
      sequencia.length
    ) + 1;


  progressTextEl.textContent =
    posicao +
    " / " +
    sequencia.length;


  progressFillEl.style.width =
    (
      posicao /
      sequencia.length *
      100
    ) +
    "%";

}


/* =====================================================
   MOEDAS
===================================================== */

function atualizarMoedas(){

  coinsEl.textContent =
    Number(
      moedasLocais || 0
    ).toLocaleString(
      "pt-BR"
    );

}


/* =====================================================
   RESETAR ERROS
===================================================== */

function atualizarImagem(){

  const numeroImagem =
    Math.min(
      erros,
      7
    );


  hangmanImage.src =
    "assets/forca/forca-" +
    numeroImagem +
    ".png";


  const pontos =
    errorsRow.querySelectorAll(
      ".error-dot"
    );


  pontos.forEach(
    (ponto,index) => {

      ponto.classList.toggle(
        "active",
        index < erros
      );

    }
  );

}


/* =====================================================
   DESENHAR PALAVRA
===================================================== */

function desenharPalavra(){

  wordEl.innerHTML =
    "";


  const palavra =
    palavraAtual.normalizada;


  const original =
    palavraAtual.palavra;


  /*
    Mantém apenas letras no jogo.
  */

  for(
    let i = 0;
    i < palavra.length;
    i++
  ){

    const letra =
      palavra[i];


    const span =
      document.createElement(
        "span"
      );


    span.className =
      "letter";


    if(
      letrasEscolhidas.has(
        letra
      )
    ){

      span.textContent =
        letra.toUpperCase();

    }
    else{

      span.textContent =
        "";

    }


    wordEl.appendChild(
      span
    );

  }

}


/* =====================================================
   CRIAR TECLADO
===================================================== */

const letras =
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ";


function criarTeclado(){

  keyboardEl.innerHTML =
    "";


  for(
    const letra of letras
  ){

    const button =
      document.createElement(
        "button"
      );


    button.className =
      "key";


    button.type =
      "button";


    button.textContent =
      letra;


    button.dataset.letra =
      letra.toLowerCase();


    button.addEventListener(
      "click",
      () => {

        escolherLetra(
          letra.toLowerCase(),
          button
        );

      }
    );


    keyboardEl.appendChild(
      button
    );

  }

}


/* =====================================================
   ESCOLHER LETRA
===================================================== */

function escolherLetra(
  letra,
  botao
){

  if(
    partidaTerminou
  ){

    return;

  }


  if(
    letrasEscolhidas.has(
      letra
    )
  ){

    return;

  }


  letrasEscolhidas.add(
    letra
  );


  botao.disabled =
    true;


  botao.classList.add(
    "used"
  );


  const acertou =
    palavraAtual.normalizada
      .includes(
        letra
      );


  if(acertou){

    botao.classList.add(
      "correct"
    );


    desenharPalavra();


    if(
      palavraCompleta()
    ){

      ganhar();

    }

  }
  else{

    botao.classList.add(
      "wrong"
    );


    erros++;


    atualizarImagem();


    if(
      erros >= 7
    ){

      perder();

    }

  }

}


/* =====================================================
   VERIFICAR PALAVRA COMPLETA
===================================================== */

function palavraCompleta(){

  for(
    const letra of palavraAtual.normalizada
  ){

    if(
      !letrasEscolhidas.has(
        letra
      )
    ){

      return false;

    }

  }


  return true;

}


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
  texto,
  tipo
){

  messageEl.textContent =
    texto;

  messageEl.className =
    "message show " +
    tipo;

}


/* =====================================================
   GANHOU
===================================================== */

function ganhar(){

  if(
    partidaTerminou
  ){

    return;

  }


  partidaTerminou =
    true;

  palavraResolvida =
    true;


  const recompensa =
    recompensaAtual();


  moedasLocais +=
    recompensa;


  atualizarMoedas();


  rewardValueEl.textContent =
    recompensa;


  rewardEl.style.display =
    "block";


  keyboardEl
    .querySelectorAll("button")
    .forEach(
      button => {

        button.disabled =
          true;

      }
    );


  mostrarMensagem(
    "🎉 Você acertou!",
    "success"
  );


  /*
    A palavra fica totalmente revelada.
  */

  letrasEscolhidas =
    new Set(
      palavraAtual.normalizada
        .split("")
    );


  desenharPalavra();


  abrirModal(
    true,
    recompensa
  );

}


/* =====================================================
   PERDEU
===================================================== */

function perder(){

  if(
    partidaTerminou
  ){

    return;

  }


  partidaTerminou =
    true;


  palavraResolvida =
    false;


  keyboardEl
    .querySelectorAll("button")
    .forEach(
      button => {

        button.disabled =
          true;

      }
    );


  /*
    Revela a palavra.
  */

  letrasEscolhidas =
    new Set(
      palavraAtual.normalizada
        .split("")
    );


  desenharPalavra();


  mostrarMensagem(
    "💀 Você perdeu! A palavra era: " +
    palavraAtual.palavra,
    "error"
  );


  rewardEl.style.display =
    "none";


  abrirModal(
    false,
    0
  );

}


/* =====================================================
   MODAL
===================================================== */

function abrirModal(
  ganhou,
  recompensa
){

  if(ganhou){

    modalIcon.textContent =
      "🎉";

    modalTitle.textContent =
      "Parabéns!";

    modalText.textContent =
      "Você descobriu a palavra e avançou para a próxima rodada.";

    modalCoins.textContent =
      "+" +
      recompensa +
      " 🪙";

    modalButton.textContent =
      "PRÓXIMA PALAVRA";

  }
  else{

    modalIcon.textContent =
      "💀";

    modalTitle.textContent =
      "Você perdeu!";

    modalText.textContent =
      "O personagem chegou ao último estágio da forca.";

    modalCoins.textContent =
      "Sem recompensa nesta rodada";

    modalButton.textContent =
      "VOLTAR AOS JOGOS";

  }


  modal.classList.add(
    "show"
  );

}


/* =====================================================
   FECHAR / CONTINUAR
===================================================== */

modalButton.addEventListener(
  "click",
  () => {

    modal.classList.remove(
      "show"
    );


    if(
      palavraResolvida
    ){

      rodada++;

      iniciarRodada();

    }
    else{

      window.location.href =
        "jogos.html";

    }

  }
);


/* =====================================================
   PRÓXIMA RODADA
===================================================== */

nextButton.addEventListener(
  "click",
  () => {

    rodada++;

    iniciarRodada();

  }
);


/* =====================================================
   INICIAR RODADA
===================================================== */

function iniciarRodada(){

  partidaTerminou =
    false;

  palavraResolvida =
    false;

  erros =
    0;

  letrasEscolhidas =
    new Set();


  const nivel =
    nivelAtual();


  palavraAtual =
    escolherPalavra(
      nivel.nivel
    );


  atualizarNivel();


  hintEl.textContent =
    palavraAtual.dica;


  rewardEl.style.display =
    "none";


  nextButton.classList.remove(
    "show"
  );


  messageEl.className =
    "message";


  hangmanImage.src =
    "assets/forca/forca-0.png";


  atualizarImagem();


  criarTeclado();


  desenharPalavra();

}


/* =====================================================
   LOCALIZAR USUÁRIO
===================================================== */

async function localizarUsuario(
  user
){

  let resultado;


  resultado =
    await getDocs(

      query(

        collection(
          db,
          "admins"
        ),

        where(
          "uid",
          "==",
          user.uid
        )

      )

    );


  if(
    !resultado.empty
  ){

    return resultado.docs[0];

  }


  if(
    user.email
  ){

    resultado =
      await getDocs(

        query(

          collection(
            db,
            "admins"
          ),

          where(
            "email",
            "==",
            user.email
          )

        )

      );


    if(
      !resultado.empty
    ){

      return resultado.docs[0];

    }

  }


  return null;

}


/* =====================================================
   VOLTAR
===================================================== */

document
  .getElementById("back")
  .addEventListener(
    "click",
    () => {

      window.location.href =
        "jogos.html";

    }
  );


/* =====================================================
   LOGIN
===================================================== */

onAuthStateChanged(

  auth,

  async user => {

    if(
      !user
    ){

      window.location.href =
        "index.html";

      return;

    }


    firebaseUser =
      user;


    try{

      const documento =
        await localizarUsuario(
          user
        );


      if(
        !documento
      ){

        alert(
          "Cadastro Adam Games não encontrado."
        );

        window.location.href =
          "jogos.html";

        return;

      }


      usuario =
        documento.data();


      moedasLocais =
        Number(
          usuario.moedas || 0
        );


      atualizarMoedas();


      /*
        Começa a primeira rodada.
      */

      iniciarRodada();

    }
    catch(error){

      console.error(
        "Erro ao carregar Forca:",
        error
      );


      alert(
        "Não foi possível carregar seus dados."
      );

    }

  }

);

</script>
