<title>Adam Games • Forca</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

  min-height:100vh;

  background:
    linear-gradient(
      180deg,
      #031b30,
      #062d4c
    );

  color:#fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}

.page{

  width:100%;

  max-width:680px;

  margin:auto;

  padding:
    14px
    14px
    50px;

}


/* =====================================================
   TOPO
===================================================== */

.top{

  display:flex;

  align-items:center;

  justify-content:space-between;

}

.back{

  width:45px;

  height:45px;

  border:0;

  border-radius:14px;

  background:#082b48;

  color:#fff;

  font-size:25px;

}

.top-title{

  text-align:center;

}

.top-title small{

  display:block;

  color:#62c8ff;

  font-size:10px;

  letter-spacing:2px;

}

.top-title strong{

  font-size:20px;

}


/* =====================================================
   INFORMAÇÕES DO JOGO
===================================================== */

.game-info{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;

  margin-top:14px;

}

.info-card{

  min-height:78px;

  padding:12px 8px;

  border-radius:18px;

  background:
    linear-gradient(
      180deg,
      #123e59,
      #0a304a
    );

  border:
    1px solid
    rgba(255,255,255,.10);

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

}

.info-card small{

  color:#91b2c8;

  font-size:10px;

  font-weight:900;

  letter-spacing:.5px;

}

.info-card strong{

  margin-top:5px;

  font-size:22px;

}

.info-card.reward strong{

  font-size:20px;

}


/* =====================================================
   PROGRESSO
===================================================== */

.progress-card{

  margin-top:14px;

  padding:17px;

  border-radius:20px;

  background:#061e34;

  border:
    1px solid
    rgba(255,255,255,.06);

}

.progress-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  font-size:14px;

  font-weight:900;

}

.progress-header span:last-child{

  color:#9bb4c9;

  font-weight:normal;

}

.progress-bar{

  height:12px;

  margin-top:12px;

  overflow:hidden;

  border-radius:20px;

  background:#163c57;

}

.progress-fill{

  width:14.2857%;

  height:100%;

  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      #18c866,
      #ffe000
    );

  transition:
    width .35s ease;

}


/* =====================================================
   IMAGEM
===================================================== */

.image-card{

  margin-top:16px;

  padding:10px;

  overflow:hidden;

  border-radius:23px;

  background:#082b48;

  border:
    1px solid
    rgba(255,255,255,.10);

}

.image-card img{

  width:100%;

  display:block;

  aspect-ratio:16 / 9;

  object-fit:cover;

  border-radius:18px;

}


/* =====================================================
   INDICADOR DE ERROS
===================================================== */

.errors{

  display:flex;

  justify-content:center;

  gap:9px;

  margin-top:12px;

}

.error-dot{

  width:19px;

  height:19px;

  border-radius:50%;

  background:#243e55;

  box-shadow:
    inset 0 0 0 1px
    rgba(255,255,255,.03);

}

.error-dot.active{

  background:#ff476b;

  box-shadow:
    0 0 12px
    rgba(255,55,95,.55);

}


/* =====================================================
   DICA
===================================================== */

.dica{

  margin-top:14px;

  padding:17px 14px;

  border-radius:19px;

  text-align:center;

  background:#082b48;

  border:
    1px solid
    rgba(255,255,255,.07);

}

.dica small{

  color:#65d2ff;

  font-weight:900;

  letter-spacing:1px;

}

.dica strong{

  display:block;

  margin-top:7px;

  font-size:18px;

}


/* =====================================================
   PALAVRA
===================================================== */

.word{

  margin-top:25px;

  min-height:62px;

  display:flex;

  align-items:center;

  justify-content:center;

  flex-wrap:wrap;

  gap:8px;

  text-align:center;

  font-size:
    clamp(
      25px,
      7vw,
      42px
    );

  font-weight:900;

}

.word-letter{

  min-width:25px;

  border-bottom:
    4px solid
    #63c9ff;

  padding:
    0 2px
    5px;

  line-height:1;

}


/* =====================================================
   TECLADO
===================================================== */

.keyboard{

  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  gap:7px;

  margin-top:23px;

}

.key{

  min-height:52px;

  border:0;

  border-radius:12px;

  background:
    linear-gradient(
      180deg,
      #159bd7,
      #0872a8
    );

  color:#fff;

  font-size:16px;

  font-weight:900;

  cursor:pointer;

  transition:
    transform .1s ease,
    opacity .15s ease;

}

.key:active{

  transform:scale(.95);

}

.key.correct{

  background:#168a57;

}

.key.wrong{

  background:#7c3151;

}

.key:disabled{

  opacity:.45;

  cursor:not-allowed;

}


/* =====================================================
   STATUS
===================================================== */

.status{

  margin-top:17px;

  padding:15px;

  border-radius:17px;

  text-align:center;

  font-weight:900;

  line-height:1.4;

}

.status.success{

  background:
    rgba(18,170,92,.18);

  border:
    1px solid
    rgba(18,220,120,.3);

  color:#7cffb1;

}

.status.error{

  background:
    rgba(220,50,70,.15);

  border:
    1px solid
    rgba(255,80,90,.3);

  color:#ff9aa4;

}

.status.info{

  background:
    rgba(50,150,220,.15);

  border:
    1px solid
    rgba(80,180,255,.25);

  color:#a9ddff;

}


/* =====================================================
   MODAL
===================================================== */

.modal{

  position:fixed;

  inset:0;

  z-index:100;

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:
    rgba(0,10,25,.88);

}

.modal.show{

  display:flex;

}

.modal-card{

  width:100%;

  max-width:390px;

  padding:28px 20px;

  border-radius:23px;

  background:#082b48;

  text-align:center;

  border:
    1px solid
    rgba(255,255,255,.10);

}

.modal-card h2{

  font-size:25px;

}

.modal-card p{

  margin-top:10px;

  color:#b9d7e8;

  line-height:1.5;

}

.modal-card button{

  width:100%;

  height:48px;

  margin-top:20px;

  border:0;

  border-radius:13px;

  background:#17a95d;

  color:#fff;

  font-weight:900;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:430px){

  .page{

    padding:
      12px
      10px
      40px;

  }

  .info-card{

    min-height:76px;

  }

  .info-card strong{

    font-size:20px;

  }

  .info-card.reward strong{

    font-size:18px;

  }

  .keyboard{

    gap:6px;

  }

  .key{

    min-height:50px;

    font-size:15px;

  }

}

</style>

/* =====================================================
   NÍVEL DA RODADA
===================================================== */

function nivelDaRodada(
  numero
){

  if(
    numero <= 3
  ){

    return "FÁCIL";

  }

  if(
    numero <= 5
  ){

    return "MÉDIO";

  }

  return "DIFÍCIL";

}


/* =====================================================
   LISTA DO NÍVEL
===================================================== */

function listaDoNivel(
  nivel
){

  if(
    nivel === "FÁCIL"
  ){

    return FACIL;

  }

  if(
    nivel === "MÉDIO"
  ){

    return MEDIO;

  }

  return DIFICIL;

}


/* =====================================================
   EMBARALHAR
===================================================== */

function embaralhar(
  lista
){

  const copia =
    [...lista];


  for(
    let i =
      copia.length - 1;

    i > 0;

    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      copia[i],
      copia[j]
    ] =
    [
      copia[j],
      copia[i]
    ];

  }


  return copia;

}


/* =====================================================
   CRIAR AS 7 PALAVRAS
===================================================== */

function criarSequencia(){

  const facil =
    embaralhar(
      FACIL
    ).slice(
      0,
      3
    );


  const medio =
    embaralhar(
      MEDIO
    ).slice(
      0,
      2
    );


  const dificil =
    embaralhar(
      DIFICIL
    ).slice(
      0,
      2
    );


  palavrasDaPartida = [

    ...facil,

    ...medio,

    ...dificil

  ];


  console.log(
    "SEQUÊNCIA:",
    palavrasDaPartida
  );

}

/* =====================================================
   RECUPERAR ESTADO
===================================================== */

function recuperarEstado(){

  try{

    const salvo =
      sessionStorage.getItem(
        "adamForcaEstado"
      );


    if(
      !salvo
    ){

      return false;

    }


    const dados =
      JSON.parse(
        salvo
      );


    if(
      !dados ||
      !dados.partidaId ||
      !Array.isArray(
        dados.palavras
      ) ||
      dados.palavras.length !==
        TOTAL_RODADAS
    ){

      return false;

    }


    partidaId =
      dados.partidaId;


    palavrasDaPartida =
      dados.palavras;


    rodadaAtual =
      Number(
        dados.rodada || 0
      );


    return true;

  }

  catch(error){

    console.error(
      error
    );

    return false;

  }

}

  }


  wordEl.innerHTML =

  [...palavra].forEach(

/* =====================================================

===================================================== */

function criarTeclado(){

  const alfabeto =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ";


  keyboardEl.innerHTML =
    "";


  [...alfabeto].forEach(
    letra => {

      const botao =
        document.createElement(
          "button"
        );


      botao.type =
        "button";


      botao.className =
        "key";


      botao.textContent =

      botao.addEventListener(
        "click",
        () => {

          escolherLetra(
            letra,
            botao
          );

        }
      );


      keyboardEl.appendChild(
        botao
      );

    }
  );

}

   BLOQUEAR TECLADO
===================================================== */

function bloquearTeclado(){

  keyboardEl
    .querySelectorAll(
      "button"
    )
    .forEach(
      botao => {

        botao.disabled =

      }
    );

===================================================== */

  keyboardEl
    .querySelectorAll(
      "button"
    )
    .forEach(
      botao => {

        botao.disabled =
          false;

      }
    );

}


/* =====================================================
   RESETAR RODADA
===================================================== */

function resetarRodada(){

  letras =
    new Set();


  erros =
    0;


  finalizandoRodada =
    false;


  criarTeclado();

  atualizarInterface();

  liberarTeclado();

}


/* =====================================================
   ESCOLHER LETRA
===================================================== */

function escolherLetra(
  letra,
  botao
){

  if(
    finalizandoRodada
  ){

    return;

  }


  if(
    letras.has(letra)
  ){

    return;

  }


  letras.add(
    letra
  );


  botao.disabled =
    true;


  const palavra =
    normalizar(
      palavrasDaPartida[
        rodadaAtual
      ]
    );


  if(
    palavra.includes(
      letra
    )
  ){

    botao.classList.add(
      "correct"
    );


    statusEl.textContent =
      "✅ Boa! A letra está na palavra.";


    statusEl.className =
      "status success";


    desenharPalavra();


    verificarVitoria();

  }

  else{

    botao.classList.add(
      "wrong"
    );


    erros++;


    atualizarErros();


    statusEl.textContent =
      "❌ Letra errada. Tentativas: " +
      erros +
      " / " +
      MAX_ERROS;


    statusEl.className =
      "status error";


    if(
      erros >= MAX_ERROS
    ){

      perderRodada();

    }

  }

}


/* =====================================================
   VERIFICAR VITÓRIA
===================================================== */

function verificarVitoria(){

  const palavra =
    normalizar(
      palavrasDaPartida[
        rodadaAtual
      ]
    );


  const venceu =
    [...new Set(
      palavra.split("")
    )]
    .every(
      letra =>
        letras.has(
          letra
        )
    );


  if(
    venceu
  ){

    ganharRodada();

  }

}


/* =====================================================
   PROCURAR CADASTRO
===================================================== */

async function localizarCadastro(
  user
){

  let snapshot =
    await getDocs(

      query(
        collection(
          db,
          "admins"
        ),

        where(
          "uid",
          "==",
          user.uid
        )

      )

    );


  if(
    !snapshot.empty
  ){

    return snapshot.docs[0];

  }


  if(
    user.email
  ){

    snapshot =
      await getDocs(

        query(
          collection(
            db,
            "admins"
          ),

          where(
            "email",
            "==",
            user.email
          )

        )

      );


    if(
      !snapshot.empty
    ){

      return snapshot.docs[0];

    }

  }


  return null;

}


/* =====================================================
   INICIAR PARTIDA
===================================================== */

async function iniciarPartida(){

  if(
    iniciando
  ){

    return;

  }


  iniciando =
    true;


  try{

    const cadastro =
      await localizarCadastro(
        usuario
      );


    if(
      !cadastro
    ){

      throw new Error(
        "Cadastro não encontrado para esta conta."
      );

    }


    usuarioRef =
      cadastro.ref;


    dadosUsuario =
      cadastro.data();


    const chances =
      Number(
        dadosUsuario.chances || 0
      );


    if(
      chances <= 0
    ){

      throw new Error(
        "Você não possui chances para jogar."
      );

    }


    criarSequencia();


    const novaPartida =
      doc(
        collection(
          db,
          "gameSessions"
        )
      );


    const batch =
      writeBatch(
        db
      );


    batch.set(
      novaPartida,
      {

        uid:
          usuario.uid,

        email:
          usuario.email || "",

        game:
          "forca",

        status:
          "ativa",

        totalRodadas:
          TOTAL_RODADAS,

        rodadaAtual:
          1,

        rewardPerRound:
          RECOMPENSA_RODADA,

        chanceConsumed:
          true,

        createdAt:
          serverTimestamp(),

        finalizadoEm:
          null

      }
    );


    /*
      UMA chance é consumida no começo da
      sequência inteira.

      Não é descontada novamente nas 7 rodadas.
    */

    batch.update(
      usuarioRef,
      {

        chances:
          chances - 1,

        ultimaPartidaForcaId:
          novaPartida.id,

        ultimaPartidaForcaEm:
          serverTimestamp()

      }
    );


    await batch.commit();


    partidaId =
      novaPartida.id;


    salvarEstado();


    atualizarInterface();


    mostrarStatus(
      "🎟️ Partida iniciada! Complete as 7 rodadas.",
      "success"
    );


    iniciando =
      false;

  }

  catch(error){

    console.error(
      "ERRO AO INICIAR FORCA:",
      error
    );


    iniciando =
      false;


    let texto =
      "⚠️ Não foi possível iniciar a partida.";


    if(
      error.code ===
      "permission-denied"
    ){

      texto =
        "⚠️ O Firebase recusou o início da partida. As Rules precisam permitir a criação de gameSessions e o consumo da chance.";

    }
    else if(
      error.message
    ){

      texto =
        "⚠️ " +
        error.message;

    }


    mostrarStatus(
      texto,
      "error"
    );


    bloquearTeclado();

  }

}


/* =====================================================
   REGISTRAR RESULTADO DA RODADA
===================================================== */

async function registrarResultado(
  ganhou
){

  if(
    !partidaId ||
    !usuario
  ){

    return;

  }


  try{

    await addDoc(

      collection(
        db,
        "resultadosJogos"
      ),

      {

        uid:
          usuario.uid,

        jogoId:
          partidaId,

        rodada:
          rodadaAtual + 1,

        nivel:
          nivelDaRodada(
            rodadaAtual + 1
          ),

        palavra:
          palavrasDaPartida[
            rodadaAtual
          ],

        ganhou:
          ganhou,

        moedasGanhos:
          ganhou
            ? RECOMPENSA_RODADA
            : 0,

        criadoEm:
          new Date().toISOString()

      }

    );

  }

  catch(error){

    console.error(
      "ERRO AO REGISTRAR RESULTADO:",
      error
    );

  }

}


/* =====================================================
   DAR MOEDAS
===================================================== */

async function darMoedas(){

  if(
    !usuarioRef ||
    !dadosUsuario
  ){

    throw new Error(
      "Cadastro do usuário não carregado."
    );

  }


  const moedasAtuais =
    Number(
      dadosUsuario.moedas || 0
    );


  const novoSaldo =
    moedasAtuais +
    RECOMPENSA_RODADA;


  const batch =
    writeBatch(
      db
    );


  /*
    Adiciona as 20 moedas.
  */

  batch.update(
    usuarioRef,
    {

      moedas:
        novoSaldo

    }
  );


  /*
    Atualiza a rodada da sessão.
  */

  batch.update(

    doc(
      db,
      "gameSessions",
      partidaId
    ),

    {

      rodadaAtual:
        rodadaAtual + 1,

      ultimaRecompensa:
        RECOMPENSA_RODADA,

      ultimaRecompensaEm:
        serverTimestamp()

    }

  );


  await batch.commit();


  dadosUsuario.moedas =
    novoSaldo;

}


/* =====================================================
   GANHAR RODADA
===================================================== */

async function ganharRodada(){

  if(
    finalizandoRodada
  ){

    return;

  }


  finalizandoRodada =
    true;


  bloquearTeclado();


  try{

    /*
      Primeiro registra o resultado.
    */

    await registrarResultado(
      true
    );


    /*
      Depois tenta adicionar 20 moedas.
    */

    await darMoedas();


    statusEl.textContent =
      "🎉 Acertou! +20 moedas";


    statusEl.className =
      "status success";


    if(
      rodadaAtual >=
      TOTAL_RODADAS - 1
    ){

      setTimeout(
        finalizarPartida,
        1200
      );

      return;

    }


    setTimeout(
      () => {

        rodadaAtual++;


        salvarEstado();


        resetarRodada();


        mostrarStatus(
          "➡️ Próxima rodada!",
          "success"
        );

      },
      1200
    );

  }

  catch(error){

    console.error(
      "ERRO AO DAR MOEDAS:",
      error
    );


    /*
      Não avança a rodada se a recompensa
      não foi registrada.
    */

    finalizandoRodada =
      false;


    liberarTeclado();


    if(
      error.code ===
      "permission-denied"
    ){

      mostrarStatus(

        "⚠️ A palavra foi acertada, mas o Firebase não permitiu registrar as 20 moedas. A partida ficou nesta rodada.",

        "error"

      );

    }
    else{

      mostrarStatus(

        "⚠️ Não foi possível registrar a recompensa. Tente novamente.",

        "error"

      );

    }

  }

}


/* =====================================================
   PERDER RODADA
===================================================== */

async function perderRodada(){

  if(
    finalizandoRodada
  ){

    return;

  }


  finalizandoRodada =
    true;


  bloquearTeclado();


  await registrarResultado(
    false
  );


  const palavra =
    palavrasDaPartida[
      rodadaAtual
    ];


  if(
    rodadaAtual >=
    TOTAL_RODADAS - 1
  ){

    finalizarPartida();

    return;

  }


  statusEl.textContent =
    "❌ A palavra era " +
    palavra +
    ". Próxima rodada!";


  statusEl.className =
    "status error";


  setTimeout(
    () => {

      rodadaAtual++;


      salvarEstado();


      resetarRodada();


      mostrarStatus(
        "➡️ Próxima rodada!",
        "info"
      );

    },
    1600
  );

}


/* =====================================================
   FINALIZAR PARTIDA
===================================================== */

async function finalizarPartida(){

  bloquearTeclado();


  try{

    if(
      partidaId
    ){

      await writeBatch(
        db
      ).update;

    }

  }
  catch(error){

    console.error(
      error
    );

  }


  /*
    Tenta atualizar a sessão separadamente.
  */

  try{

    if(
      partidaId
    ){

      const batch =
        writeBatch(
          db
        );


      batch.update(

        doc(
          db,
          "gameSessions",
          partidaId
        ),

        {

          status:
            "completed",

          rodadaAtual:
            TOTAL_RODADAS,

          totalRodadas:
            TOTAL_RODADAS,

          finalizadoEm:
            serverTimestamp()

        }

      );


      await batch.commit();

    }

  }

  catch(error){

    console.error(
      "ERRO AO FINALIZAR PARTIDA:",
      error
    );

  }


  limparEstado();


  modalTitle.textContent =
    "🏆 SEQUÊNCIA COMPLETA!";


  modalText.textContent =
    "Parabéns! Você completou as 7 rodadas da Forca.";


  modalButton.textContent =
    "VOLTAR PARA OS JOGOS";


  modal.classList.add(
    "show"
  );

}

  );


/* =====================================================
   AUTENTICAÇÃO
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    if(
      !user
    ){

      window.location.replace(
        "index.html"
      );

      return;

    }


    usuario =
      user;


    /*
      Se a página foi recarregada durante uma partida,
      recupera a mesma sequência em vez de começar
      outra partida e gastar outra chance.
    */

    const recuperou =
      recuperarEstado();


    if(
      recuperou
    ){

      try{

        const cadastro =
          await localizarCadastro(
            usuario
          );


        if(
          cadastro
        ){

          usuarioRef =
            cadastro.ref;

          dadosUsuario =
            cadastro.data();

        }


        atualizarInterface();


        mostrarStatus(
          "🎮 Partida recuperada. Continue a sequência!",
          "info"
        );


        return;

      }

      catch(error){

        console.error(
          error
        );

      }

    }


    iniciarPartida();

  }
);


/* =====================================================
   INICIALIZAÇÃO VISUAL
===================================================== */

criarTeclado();

atualizarErros();

</script>
