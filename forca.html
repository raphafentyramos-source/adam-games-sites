*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;overflow-x:hidden}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#fff;background:radial-gradient(circle at 10% 0%,rgba(0,190,120,.30),transparent 32%),radial-gradient(circle at 90% 0%,rgba(20,150,255,.30),transparent 32%),linear-gradient(180deg,#06233d,#031a2e)}
.page{width:100%;max-width:650px;margin:auto;padding:15px 15px 70px}
.top{display:flex;align-items:center;justify-content:space-between}
.back{width:45px;height:45px;border:0;border-radius:13px;background:rgba(0,40,70,.9);color:#fff;font-size:26px;cursor:pointer}
.title{text-align:center}.title small{display:block;color:#8bb8d5;font-size:8px;letter-spacing:2px}.title strong{display:block;margin-top:2px;font-size:21px}
.top-coins{min-width:88px;padding:7px 9px;border-radius:13px;text-align:center;background:rgba(255,213,43,.08);border:1px solid rgba(255,213,43,.15)}
.top-coins-label{color:#9ab9cd;font-size:8px;font-weight:bold}.top-coins-value{margin-top:2px;color:#ffd52b;font-size:17px;font-weight:900}
.hero{margin-top:14px;padding:18px;border-radius:22px;text-align:center;background:linear-gradient(135deg,rgba(5,48,82,.97),rgba(3,27,49,.97));border:1px solid rgba(255,255,255,.08)}
.hero-icon{font-size:42px}.hero h1{margin-top:3px;font-size:30px}.hero p{margin-top:5px;color:#b7d0e2;font-size:13px}
.level-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:11px}.level-box{padding:10px 5px;border-radius:13px;text-align:center;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.07)}
.level-label{color:#91b2c9;font-size:8px;font-weight:bold}.level-value{margin-top:3px;font-size:15px;font-weight:900}
.progress-card{margin-top:11px;padding:13px;border-radius:15px;background:rgba(2,25,46,.9)}.progress-top{display:flex;justify-content:space-between;align-items:center}.progress-title{font-size:11px;font-weight:900}.progress-count{color:#9bb9ce;font-size:10px}.progress-bar{width:100%;height:8px;margin-top:8px;overflow:hidden;border-radius:20px;background:rgba(255,255,255,.09)}.progress-fill{height:100%;width:0;border-radius:20px;background:linear-gradient(90deg,#13b965,#ffd52b);transition:width .3s ease}
.game-card{margin-top:12px;padding:13px;border-radius:21px;background:rgba(2,25,47,.97);border:1px solid rgba(255,255,255,.09)}
.hangman-wrap{position:relative;width:100%;aspect-ratio:437/275;overflow:hidden;border-radius:17px;background:#071f35;line-height:0;isolation:isolate}
.hangman-layer{position:absolute;inset:0;width:100%!important;height:100%!important;object-fit:fill;opacity:0;visibility:hidden;pointer-events:none;user-select:none;-webkit-user-drag:none}
.hangman-layer.active{opacity:1;visibility:visible;z-index:2}
.errors-row{min-height:10px;display:flex;align-items:center;justify-content:center;gap:7px;margin-top:11px}.error-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.13)}.error-dot.active{background:#ff5365;box-shadow:0 0 7px rgba(255,70,90,.5)}
.hint{margin-top:12px;padding:12px;border-radius:14px;text-align:center;background:rgba(20,145,220,.08);border:1px solid rgba(20,145,220,.12)}.hint-label{color:#69c5fa;font-size:8px;font-weight:900;letter-spacing:1px}.hint-text{margin-top:4px;color:#fff;font-size:14px;font-weight:bold}
.word{min-height:47px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:6px;margin-top:17px}.letter{width:27px;height:39px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;border-bottom:3px solid #62c9ff;font-size:23px;font-weight:900;text-transform:uppercase}
.keyboard{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:19px}.key{min-height:41px;border:0;border-radius:9px;background:linear-gradient(145deg,#126a9e,#07466e);color:#fff;font-size:14px;font-weight:900;cursor:pointer}.key.correct{background:linear-gradient(145deg,#16bd68,#087d45)}.key.wrong{background:linear-gradient(145deg,#c9344a,#8b182b)}.key:disabled{cursor:not-allowed;opacity:.42}
.message{display:none;margin-top:13px;padding:13px;border-radius:14px;text-align:center;font-size:13px;font-weight:bold}.message.show{display:block}.message.success{color:#70ffac;background:rgba(0,210,100,.1);border:1px solid rgba(0,210,100,.18)}.message.error{color:#ff9ca8;background:rgba(255,50,70,.1);border:1px solid rgba(255,50,70,.18)}

.timer-box{display:none;margin-top:10px;padding:10px;border-radius:12px;text-align:center;background:rgba(255,213,43,.08);border:1px solid rgba(255,213,43,.2);color:#ffd52b;font-weight:900;font-size:15px}.timer-box small{display:block;color:#b7d0e2;font-size:9px;margin-bottom:3px}@media(max-width:430px){.keyboard{gap:4px}.key{min-height:38px;font-size:13px}.letter{width:24px;font-size:21px}}

const storageFinal="adam_games_forca_used_final_v1";

let user=null,userRef=null,coins=0,round=1,errors=0,current=null;

const usedHard=new Set(JSON.parse(localStorage.getItem(storageHard)||"[]"));
const usedFinal=new Set(JSON.parse(localStorage.getItem(storageFinal)||"[]"));

const $=id=>document.getElementById(id);

function norm(s){
 return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z]/g,"");
}
function saveSet(key,set){localStorage.setItem(key,JSON.stringify([...set]))}

function chooseFrom(pool,set,key){
 let available=pool.filter(x=>!set.has(norm(x.palavra)));
 if(!available.length){
  set.clear();
  saveSet(key,set);
  available=[...pool];
 }
 const x=available[Math.floor(Math.random()*available.length)];
 set.add(norm(x.palavra));
 saveSet(key,set);
 return {...x,normal:norm(x.palavra)};
}

function choose(){
 if(round<=7)return chooseFrom(NORMAL,usedNormal,storageNormal);
 if(round===8)return chooseFrom(HARD,usedHard,storageHard);
 return chooseFrom(FINAL,usedFinal,storageFinal);
}

function coinsUI(){
 $("coins").textContent=Number(coins||0).toLocaleString("pt-BR");
}

function frame(){
 const n=Math.min(errors,6);
 document.querySelectorAll(".hangman-layer").forEach((x,i)=>x.classList.toggle("active",i===n));
 [...$("errorsRow").children].forEach((x,i)=>x.classList.toggle("active",i<errors));
}

function wordUI(){
 $("word").innerHTML="";
 for(const c of current.normal){
  const el=document.createElement("span");
  el.className="letter";
  el.textContent=usedLetters.has(c)?c.toUpperCase():"";
  $("word").appendChild(el);
 }
}

function complete(){
 return [...new Set(current.normal)].every(c=>usedLetters.has(c));
}

  b.type="button";
  b.textContent=c;
  b.onclick=()=>guess(c.toLowerCase(),b);
  k.appendChild(b);

}

}

function stopTimer(){
 if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
 timerStarted=false;
 $("timerBox").style.display="none";
}

function startTimer(){
 if(timerStarted||round!==8&&round!==9)return;
 timerStarted=true;
 timerStart=performance.now();
 $("timerBox").style.display="block";
 timerInterval=setInterval(()=>{
  const sec=(performance.now()-timerStart)/1000;
  $("timerValue").textContent=sec.toFixed(1)+"s";
 },100);
}

function currentSeconds(){
 return timerStarted?(performance.now()-timerStart)/1000:null;
}

function start(){
 stopTimer();
 errors=0;
 locked=false;
 usedLetters=new Set();
 finalConsolationGiven=false;
 current=choose();

 const isHard=round===8;
 const isFinal=round===9;

 if(isFinal){
  $("levelName").textContent="👑 FINAL";
  $("roundReward").textContent="🪙 100–150";
 }else if(isHard){
  $("levelName").textContent="🔥 HARD";
  hardTarget=[9,10,11,12][Math.floor(Math.random()*4)];
  const hardBonus={9:25,10:20,11:15,12:10}[hardTarget];
  $("roundReward").textContent="🪙 75 + "+hardBonus;
 }else{
  $("levelName").textContent=round<=2?"FÁCIL":round<=4?"MÉDIO":"DIFÍCIL";
  $("roundReward").textContent="🪙 "+rewards[round-1];
 }

 $("roundNumber").textContent=round+" / "+TOTAL_ROUNDS;
 $("progressText").textContent=round+" / "+TOTAL_ROUNDS;
 $("progressFill").style.width=(round/TOTAL_ROUNDS*100)+"%";

 $("hint").textContent=current.pista;
 $("reward").style.display="none";
 $("message").className="message";
 $("message").textContent="";
 $("timerBox").style.display="none";
 $("timerValue").textContent="0.0s";

 frame();
 wordUI();
 keyboard();
}

async function reward(n){
 if(!userRef)throw Error("Cadastro não encontrado.");
 await runTransaction(db,async tx=>{
  const snap=await tx.get(userRef);
  if(!snap.exists())throw Error("Cadastro não encontrado.");
  const old=Number(snap.data().moedas||0);
  tx.update(userRef,{moedas:old+n});
 });
 coins+=n;
 coinsUI();
}

async function finalLoss(){
 if(finalConsolationGiven)return;
 finalConsolationGiven=true;
 const distinct=[...new Set(current.normal)].filter(c=>usedLetters.has(c)).length;
 const consolation=Math.min(distinct*10,100);
 stopTimer();
 if(consolation>0){
  try{
   await reward(consolation);
   msg("💡 Você acertou "+distinct+" letras diferentes: +"+consolation+" Adam Coins.","success");
  }catch(e){
   console.error(e);
  }
 }
 openModal("💀","DESAFIO FINAL","+"+consolation+" ADAM COINS","Você não completou a palavra. A palavra era: "+current.palavra+". Letras diferentes acertadas: "+distinct+".","VOLTAR AOS JOGOS","exit");
}

async function win(){
 if(locked)return;
 locked=true;
 lock();

 const isHard=round===8;
 const isFinal=round===9;

 try{
  if(isFinal){
   const sec=currentSeconds()??999;
   stopTimer();
   let n=100;
   if(sec<=10)n=150;
   else if(sec<=11)n=120;
   else if(sec<=12)n=110;
   await reward(n);
   $("rewardValue").textContent=n;
   $("reward").style.display="block";
   msg("👑 DESAFIO FINAL CONCLUÍDO! +"+n+" Adam Coins!","success");
   setTimeout(()=>openModal("🏆","DESAFIO FINAL CONCLUÍDO!","+"+n+" ADAM COINS","Você venceu a última rodada em "+sec.toFixed(1)+" segundos. Parabéns!","VOLTAR AOS JOGOS","exit"),3000);
   return;
  }

  if(isHard){
   const sec=currentSeconds()??999;
   stopTimer();
   const bonus={9:25,10:20,11:15,12:10}[hardTarget];
   const total=75+(sec<=hardTarget?bonus:0);
   await reward(total);
   $("rewardValue").textContent=total;
   $("reward").style.display="block";
   msg("🔥 HARD concluída! +"+total+" Adam Coins!","success");
   setTimeout(()=>finalIntro(),3000);
   return;
  }

  const n=rewards[round-1];
  await reward(n);
  $("rewardValue").textContent=n;
  $("reward").style.display="block";
  msg("🎉 Palavra correta! +"+n+" Adam Coins!","success");

  setTimeout(()=>{
   if(round<7)openModal("🎉","PARABÉNS!","+"+n+" ADAM COINS","Prepare-se para a próxima rodada.","PRÓXIMA RODADA","next");
   else hardIntro();
  },3000);

 }catch(e){
  console.error("Erro ao registrar recompensa:",e);
  locked=false;
  msg("⚠️ Não foi possível registrar as moedas. Tente novamente.","error");
  keyboard();
 }
}

function lose(){
 if(locked)return;
 locked=true;
 lock();
 errors=6;
 frame();
 msg("💀 Você perdeu!","error");
 if(round===9){
  setTimeout(()=>finalLoss(),3000);
 }else{
  setTimeout(loss,3000);
 }
}

function guess(c,b){
 if(locked||usedLetters.has(c))return;

 usedLetters.add(c);
 b.disabled=true;

 if(current.normal.includes(c)){
  b.classList.add("correct");
  wordUI();

  if((round===8||round===9)&&!timerStarted)startTimer();

  if(complete())win();
 }else{
  b.classList.add("wrong");
  errors++;
  frame();
  if(errors>=6)lose();
 }
}

 }else if(action==="final"){
  round=9;
  start();
 }else{
  location.href="jogos.html";
 }
};
