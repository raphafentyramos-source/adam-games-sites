<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"

<title>Adam Games - Forca</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
  overflow-x:hidden;
}

body{

  min-height:100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:#fff;

  background:
    radial-gradient(
      circle at 10% 0%,
      rgba(0,190,120,.30),
      transparent 32%
    ),
    radial-gradient(
      circle at 90% 0%,
      rgba(20,150,255,.30),
      transparent 32%
    ),
    linear-gradient(
      180deg,
      #06233d 0%,
      #031a2e 100%
    );

}


/* =====================================================
   CONTAINER
===================================================== */

.page{

  width:100%;

  max-width:650px;

  margin:0 auto;

  padding:
    15px
    15px
    70px;

}


/* =====================================================
   TOPO
===================================================== */

.top{

  width:100%;

  display:flex;

  align-items:center;

  justify-content:space-between;

}


.back{

  width:45px;

  height:45px;

  border:0;

  border-radius:13px;

  background:
    rgba(0,40,70,.9);

  color:#fff;

  font-size:26px;

  cursor:pointer;

}


.title{

  text-align:center;

}


.title small{

  display:block;

  color:#8bb8d5;

  font-size:8px;

  letter-spacing:2px;

}


.title strong{

  display:block;

  margin-top:2px;

  font-size:21px;

  text-shadow:
    0 2px 6px rgba(0,0,0,.5);

}


.top-coins{

  min-width:88px;

  padding:7px 9px;

  border-radius:13px;

  text-align:center;

  background:
    rgba(255,213,43,.08);

  border:
    1px solid
    rgba(255,213,43,.15);

}


.top-coins-label{

  color:#9ab9cd;

  font-size:8px;

  font-weight:bold;

}


.top-coins-value{

  margin-top:2px;

  color:#ffd52b;

  font-size:17px;

  font-weight:900;

}


/* =====================================================
   HERO
===================================================== */

.hero{

  margin-top:14px;

  padding:18px;

  border-radius:22px;

  text-align:center;

  background:
    linear-gradient(
      135deg,
      rgba(5,48,82,.97),
      rgba(3,27,49,.97)
    );

  border:
    1px solid
    rgba(255,255,255,.08);

}


.hero-icon{

  font-size:42px;

}


.hero h1{

  margin-top:3px;

  font-size:30px;

}


.hero p{

  margin-top:5px;

  color:#b7d0e2;

  font-size:13px;

}


/* =====================================================
   INFORMAÇÕES
===================================================== */

.level-row{

  display:grid;

  grid-template-columns:
    1fr
    1fr
    1fr;

  gap:8px;

  margin-top:11px;

}


.level-box{

  padding:10px 5px;

  border-radius:13px;

  text-align:center;

  background:
    rgba(255,255,255,.055);

  border:
    1px solid
    rgba(255,255,255,.07);

}


.level-label{

  color:#91b2c9;

  font-size:8px;

  font-weight:bold;

}


.level-value{

  margin-top:3px;

  font-size:15px;

  font-weight:900;

}


/* =====================================================
   PROGRESSO
===================================================== */

.progress-card{

  margin-top:11px;

  padding:13px;

  border-radius:15px;

  background:
    rgba(2,25,46,.9);

}


.progress-top{

  display:flex;

  justify-content:space-between;

  align-items:center;

}


.progress-title{

  font-size:11px;

  font-weight:900;

}


.progress-count{

  color:#9bb9ce;

  font-size:10px;

}


.progress-bar{

  width:100%;

  height:8px;

  margin-top:8px;

  overflow:hidden;

  border-radius:20px;

  background:
    rgba(255,255,255,.09);

}


.progress-fill{

  height:100%;

  width:0;

  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      #13b965,
      #ffd52b
    );

  transition:
    width .3s ease;

}


/* =====================================================
   CARTÃO
===================================================== */

.game-card{

  margin-top:12px;

  padding:13px;

  border-radius:21px;

  background:
    rgba(2,25,47,.97);

  border:
    1px solid
    rgba(255,255,255,.09);

}


/* =====================================================
   FRAME FIXO
===================================================== */

.hangman-wrap{

  position:relative;

  width:100%;

  aspect-ratio:437 / 275;

  overflow:hidden;

  border-radius:17px;

  background:#071f35;

  line-height:0;

  isolation:isolate;

}


#hangmanImage{

  position:absolute;

  inset:0;

  width:100% !important;

  height:100% !important;

  min-width:100%;

  min-height:100%;

  max-width:none;

  max-height:none;

  margin:0 !important;

  padding:0 !important;

  border:0;

  outline:0;

  box-shadow:none;

  object-fit:fill;

  object-position:center center;

  transform:none !important;

  transition:none !important;

  animation:none !important;

  pointer-events:none;

  user-select:none;

  -webkit-user-drag:none;

}


/* =====================================================
   ERROS
===================================================== */

.errors-row{

  width:100%;

  min-height:10px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:7px;

  margin-top:11px;

}


.error-dot{

  flex:0 0 10px;

  width:10px;

  height:10px;

  border-radius:50%;

  background:
    rgba(255,255,255,.13);

}


.error-dot.active{

  background:#ff5365;

  box-shadow:
    0 0 7px
    rgba(255,70,90,.5);

}


/* =====================================================
   DICA
===================================================== */

.hint{

  margin-top:12px;

  padding:12px;

  border-radius:14px;

  text-align:center;

  background:
    rgba(20,145,220,.08);

  border:
    1px solid
    rgba(20,145,220,.12);

}


.hint-label{

  color:#69c5fa;

  font-size:8px;

  font-weight:900;

  letter-spacing:1px;

}


.hint-text{

  margin-top:4px;

  color:#fff;

  font-size:14px;

  font-weight:bold;

}


/* =====================================================
   PALAVRA
===================================================== */

.word{

  min-height:47px;

  display:flex;

  flex-wrap:wrap;

  align-items:flex-end;

  justify-content:center;

  gap:6px;

  margin-top:17px;

}


.letter{

  width:27px;

  height:39px;

  display:flex;

  align-items:flex-end;

  justify-content:center;

  padding-bottom:4px;

  border-bottom:
    3px solid
    #62c9ff;

  font-size:23px;

  font-weight:900;

  text-transform:uppercase;

}


/* =====================================================
   TECLADO
===================================================== */

.keyboard{

  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  gap:5px;

  margin-top:19px;

}


.key{

  min-height:41px;

  border:0;

  border-radius:9px;

  background:
    linear-gradient(
      145deg,
      #126a9e,
      #07466e
    );

  color:#fff;

  font-size:14px;

  font-weight:900;

  cursor:pointer;

}


.key.correct{

  background:
    linear-gradient(
      145deg,
      #16bd68,
      #087d45
    );

}


.key.wrong{

  background:
    linear-gradient(
      145deg,
      #c9344a,
      #8b182b
    );

}


.key.used{

  opacity:.28;

}


.key:disabled{

  cursor:not-allowed;

}


/* =====================================================
   MENSAGEM
===================================================== */

.message{

  display:none;

  margin-top:13px;

  padding:13px;

  border-radius:14px;

  text-align:center;

  font-size:13px;

  font-weight:bold;

}


.message.show{

  display:block;

}


.message.success{

  color:#70ffac;

  background:
    rgba(0,210,100,.1);

  border:
    1px solid
    rgba(0,210,100,.18);

}


.message.error{

  color:#ff9ca8;

  background:
    rgba(255,50,70,.1);

  border:
    1px solid
    rgba(255,50,70,.18);

}


/* =====================================================
   RECOMPENSA
===================================================== */

.reward{

  display:none;

  margin-top:12px;

  padding:12px;

  border-radius:14px;

  text-align:center;

  background:
    rgba(255,213,43,.07);

  border:
    1px solid
    rgba(255,213,43,.15);

}


.reward strong{

  color:#ffd52b;

  font-size:20px;

}


/* =====================================================
   MODAL
===================================================== */

.modal{

  position:fixed;

  inset:0;

  z-index:9999;

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:
    rgba(0,8,20,.86);

  backdrop-filter:
    blur(6px);

}


.modal.show{

  display:flex;

}


.modal-card{

  width:100%;

  max-width:380px;

  padding:25px 20px;

  border-radius:23px;

  text-align:center;

  background:#082843;

  border:
    1px solid
    rgba(255,255,255,.12);

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.5);

}


.modal-icon{

  font-size:54px;

}


.modal-card h2{

  margin-top:8px;

  font-size:25px;

}


.modal-card p{

  margin-top:9px;

  color:#b8d3e5;

  font-size:14px;

  line-height:1.5;

}


.modal-coins{

  margin-top:13px;

  color:#ffd52b;

  font-size:21px;

  font-weight:900;

}


.modal-button{

  width:100%;

  height:49px;

  margin-top:18px;

  border:0;

  border-radius:14px;

  background:#18ae60;

  color:#fff;

  font-size:13px;

  font-weight:900;

  cursor:pointer;

}


@media(max-width:430px){

  .keyboard{
    gap:4px;
  }

  .key{
    min-height:38px;
    font-size:13px;
  }

  .letter{
    width:24px;
    font-size:21px;
  }

}


@media(max-width:360px){

  .page{
    padding-left:10px;
    padding-right:10px;
  }

  .game-card{
    padding:10px;
  }

  .hangman-wrap{
    width:100%;
    aspect-ratio:437 / 275;
  }

  .errors-row{
    gap:5px;
  }

  .error-dot{
    flex-basis:9px;
    width:9px;
    height:9px;
  }

}


img{
  vertical-align:top;
}

</style>

</head>

/* =====================================================
   NORMALIZAR
===================================================== */

function normalizar(texto){

  return texto
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .toLowerCase()
    .replace(
      /[^a-z]/g,
      ""
    );

}


/* =====================================================
   ESCOLHER PALAVRA
===================================================== */

function escolherPalavra(){

  const indice =
    Math.floor(
      Math.random() *
      banco.length
    );

  const item =
    banco[indice];

  return {

    original:item[0],

    dica:item[1],

    normalizada:
      normalizar(
        item[0]
      )

  };

}


/* =====================================================
   MOEDAS
===================================================== */

function atualizarMoedas(){

  coinsEl.textContent =
    Number(
      moedas || 0
    ).toLocaleString(
      "pt-BR"
    );

}


/* =====================================================
   CONSUMIR CHANCE
===================================================== */

async function consumirChance(){

  /*
   * IMPORTANTE:
   * esta função só pode executar uma vez
   * durante esta entrada na Forca.
   */

  if(
    chanceContabilizada
  ){

    return true;

  }


  if(
    !usuarioRef
  ){

    throw new Error(
      "Documento do usuário não encontrado."
    );

  }


  const quantidade =
    Number(
      chances || 0
    );


  if(
    quantidade <= 0
  ){

    return false;

  }


  /*
   * O CAMPO CORRETO É:
   *
   * chances
   *
   * NÃO é giros.
   * NÃO é girosRoleta.
   */

  await updateDoc(

    usuarioRef,

    {

      chances:
        increment(-1)

    }

  );


  chances =
    quantidade - 1;


  chanceContabilizada =
    true;


  return true;

}


/* =====================================================
   ADICIONAR MOEDAS
===================================================== */

async function adicionarMoedas(
  quantidade
){

  if(
    !usuarioRef
  ){

    throw new Error(
      "Documento do usuário não encontrado."
    );

  }


  await updateDoc(

    usuarioRef,

    {

      moedas:
        increment(
          quantidade
        )

    }

  );


  moedas +=
    quantidade;


  atualizarMoedas();

}


/* =====================================================
   ATUALIZAR IMAGEM
===================================================== */

function atualizarImagem(){

  const indice =
    Math.min(
      Math.max(
        erros,
        0
      ),
      imagensForca.length - 1
    );


  /*
   * Troca somente o SRC.
   *
   * O frame permanece exatamente
   * no mesmo lugar.
   */

  hangmanImage.src =
    imagensForca[indice];


  const pontos =
    errorsRow.querySelectorAll(
      ".error-dot"
    );


  pontos.forEach(
    (
      ponto,
      index
    ) => {

      ponto.classList.toggle(
        "active",
        index < erros
      );

    }
  );

}


/* =====================================================
   DESENHAR PALAVRA
===================================================== */

function desenharPalavra(){

  wordEl.innerHTML =
    "";


  for(
    const letra of
    palavraAtual.normalizada
  ){

    const span =
      document.createElement(
        "span"
      );


    span.className =
      "letter";


    if(
      letrasUsadas.has(
        letra
      )
    ){

      span.textContent =
        letra.toUpperCase();

    }


    wordEl.appendChild(
      span
    );

  }

}


/* =====================================================
   PALAVRA COMPLETA
===================================================== */

function palavraCompleta(){

  for(
    const letra of
    palavraAtual.normalizada
  ){

    if(
      !letrasUsadas.has(
        letra
      )
    ){

      return false;

    }

  }


  return true;

}


/* =====================================================
   TECLADO
===================================================== */

function criarTeclado(){

  keyboardEl.innerHTML =
    "";


  const letras =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ";


  for(
    const letra of letras
  ){

    const botao =
      document.createElement(
        "button"
      );


    botao.type =
      "button";


    botao.className =
      "key";


    botao.textContent =
      letra;


    botao.addEventListener(
      "click",
      () => {

        escolherLetra(
          letra.toLowerCase(),
          botao
        );

      }
    );


    keyboardEl.appendChild(
      botao
    );

  }

}


/* =====================================================
   BLOQUEAR TECLADO
===================================================== */

function bloquearTeclado(){

  keyboardEl
    .querySelectorAll(
      "button"
    )
    .forEach(
      botao => {

        botao.disabled =
          true;

      }
    );

}


/* =====================================================
   ESCOLHER LETRA
===================================================== */

function escolherLetra(
  letra,
  botao
){

  if(
    terminou
  ){

    return;

  }


  if(
    letrasUsadas.has(
      letra
    )
  ){

    return;

  }


  letrasUsadas.add(
    letra
  );


  botao.disabled =
    true;


  botao.classList.add(
    "used"
  );


  if(
    palavraAtual.normalizada
      .includes(
        letra
      )
  ){

    botao.classList.add(
      "correct"
    );


    desenharPalavra();


    if(
      palavraCompleta()
    ){

      ganhar();

    }


    return;

  }


  botao.classList.add(
    "wrong"
  );


  erros++;


  /*
   * PRIMEIRO troca para a imagem.
   */

  atualizarImagem();


  /*
   * Só depois verifica o último erro.
   */

  if(
    erros >= 6
  ){

    erroFinal();

  }

}


/* =====================================================
   ÚLTIMO ERRO
===================================================== */

function erroFinal(){

  if(
    processandoErroFinal
  ){

    return;

  }


  processandoErroFinal =
    true;


  terminou =
    true;


  bloquearTeclado();


  erros =
    6;


  /*
   * GARANTE A IMAGEM 07.
   */

  atualizarImagem();


  messageEl.className =
    "message";


  messageEl.textContent =
    "";


  /*
   * Dois frames permitem que o navegador
   * renderize a imagem 07 antes do timer.
   */

  requestAnimationFrame(
    () => {

      requestAnimationFrame(
        () => {

          setTimeout(
            () => {

              mostrarDerrota();

            },
            3000
          );

        }
      );

    }
  );

}


/* =====================================================
   DERROTA
===================================================== */

function mostrarDerrota(){

  messageEl.textContent =
    "💀 Você perdeu! A palavra era: " +
    palavraAtual.original;


  messageEl.className =
    "message show error";


  modalIcon.textContent =
    "💀";


  modalTitle.textContent =
    "Você perdeu!";


  modalText.textContent =
    "O personagem chegou ao último estágio da forca. Você precisa de uma nova chance para jogar novamente.";


  modalCoins.textContent =
    "Precisa de uma nova chance";


  modalButton.textContent =
    "VOLTAR AOS JOGOS";


  modal.classList.add(
    "show"
  );

}


/* =====================================================
   GANHOU
===================================================== */

async function ganhar(){

  if(
    terminou
  ){

    return;

  }


  terminou =
    true;


  ganhouRodada =
    true;


  bloquearTeclado();


  const recompensa =
    recompensas[rodada] ||
    20;


  try{

    /*
     * Salva a moeda imediatamente.
     */

    await adicionarMoedas(
      recompensa
    );


    rewardValueEl.textContent =
      recompensa;


    rewardEl.style.display =
      "block";


    messageEl.textContent =
      "🎉 Você acertou a palavra!";


    messageEl.className =
      "message show success";


    if(
      rodada >= 7
    ){

      modalIcon.textContent =
        "🏆";


      modalTitle.textContent =
        "Você venceu!";


      modalText.textContent =
        "Você completou as 7 rodadas e recebeu sua recompensa.";


      modalCoins.textContent =
        "+" +
        recompensa +
        " 🪙";


      modalButton.textContent =
        "VOLTAR AOS JOGOS";

    }
    else{

      modalIcon.textContent =
        "🎉";


      modalTitle.textContent =
        "Parabéns!";


      modalText.textContent =
        "Você acertou a palavra e ganhou sua recompensa.";


      modalCoins.textContent =
        "+" +
        recompensa +
        " 🪙";


      modalButton.textContent =
        "PRÓXIMA RODADA";

    }


    modal.classList.add(
      "show"
    );

  }
  catch(error){

    console.error(
      error
    );


    terminou =
      false;


    ganhouRodada =
      false;


    messageEl.textContent =
      "Não foi possível registrar as moedas. Tente novamente.";


    messageEl.className =
      "message show error";

  }

}


/* =====================================================
   NOVA RODADA
===================================================== */

function iniciarRodada(){

  erros =
    0;


  terminou =
    false;


  ganhouRodada =
    false;


  processandoErroFinal =
    false;


  letrasUsadas =
    new Set();


  palavraAtual =
    escolherPalavra();


  const recompensa =
    recompensas[rodada] ||
    20;


  roundNumberEl.textContent =
    rodada;


  roundRewardEl.textContent =
    "🪙 " +
    recompensa;


  progressTextEl.textContent =
    rodada +
    " / 7";


  progressFillEl.style.width =
    (
      rodada /
      7 *
      100
    ) +
    "%";


  hintEl.textContent =
    palavraAtual.dica;


  rewardEl.style.display =
    "none";


  messageEl.className =
    "message";


  messageEl.textContent =
    "";


  /*
   * Sempre começa na primeira imagem.
   */

  hangmanImage.src =
    imagensForca[0];


  criarTeclado();


  desenharPalavra();


  atualizarImagem();

}


/* =====================================================
   BOTÃO DO MODAL
===================================================== */

modalButton.addEventListener(
  "click",
  () => {

    modal.classList.remove(
      "show"
    );


    /*
     * Perdeu.
     *
     * A chance já foi descontada
     * na entrada.
     */

    if(
      !ganhouRodada
    ){

      window.location.href =
        "jogos.html";

      return;

    }


    /*
     * Terminou as 7 rodadas.
     */

    if(
      rodada >= 7
    ){

      window.location.href =
        "jogos.html";

      return;

    }


    /*
     * Próxima rodada.
     *
     * NÃO desconta outra chance.
     */

    rodada++;

    iniciarRodada();

  }
);

   SETA VOLTAR

document

  );


/* =====================================================
   LOCALIZAR USUÁRIO
===================================================== */

async function localizarUsuario(
  user
){

  let resultado =
    await getDocs(

      query(

        collection(
          db,
          "admins"
        ),

        where(
          "uid",
          "==",
          user.uid
        )

      )

    );


  if(
    !resultado.empty
  ){

    return resultado.docs[0];

  }


  if(
    user.email
  ){

    resultado =
      await getDocs(

        query(

          collection(
            db,
            "admins"
          ),

          where(
            "email",
            "==",
            user.email
          )

        )

      );


    if(
      !resultado.empty
    ){

      return resultado.docs[0];

    }

  }


  return null;

}


/* =====================================================
   AUTENTICAÇÃO
===================================================== */

onAuthStateChanged(

  auth,

  async user => {

    if(
      !user
    ){

      window.location.href =
        "index.html";

      return;

    }


    usuarioAtual =
      user;


    try{

      const documento =
        await localizarUsuario(
          user
        );


      if(
        !documento
      ){

        alert(
          "Cadastro Adam Games não encontrado."
        );


        window.location.href =
          "jogos.html";


        return;

      }


      usuarioRef =
        documento.ref;


      const dados =
        documento.data();


      /*
       * CARREGA MOEDAS.
       */

      moedas =
        Number(
          dados.moedas || 0
        );


      atualizarMoedas();


      /*
       * CARREGA CHANCES.
       *
       * ESTE É O CAMPO CORRETO.
       */

      chances =
        Number(
          dados.chances || 0
        );


      /*
       * CONSUME UMA CHANCE
       * AO ENTRAR NA FORCA.
       */

      const podeJogar =
        await consumirChance();


      if(
        !podeJogar
      ){

        alert(
          "Você não possui chances suficientes para jogar a Forca."
        );


        window.location.href =
          "jogos.html";


        return;

      }


      /*
       * Chance já foi descontada.
       *
       * Agora começa a primeira rodada.
       */

      iniciarRodada();

    }
    catch(error){

      console.error(
        "Erro ao carregar usuário:",
        error
      );


      alert(
        "Erro ao carregar seus dados."
      );

    }

  }

);
