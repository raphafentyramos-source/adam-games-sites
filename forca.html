  {palavra:"cosmopsicologia",pista:"Psicologia"},
  {palavra:"cosmofarmacologia",pista:"Medicamentos"},
  {palavra:"cosmoecologia",pista:"Ecologia"},
  {palavra:"cosmohistologia",pista:"Tecidos"},
  {palavra:"cosmopatologia",pista:"Doenças"},
  {palavra:"cosmoanatomia",pista:"Corpo"},
  {palavra:"cosmofisiologia",pista:"Organismo"}
];

const rewards=[20,20,20,30,30,30,30,75];
let user=null,userRef=null,coins=0,round=1,errors=0,current=null,usedLetters=new Set(),locked=false,action=null;
const storageKey="adam_games_forca_used_v3";
let used=new Set(JSON.parse(localStorage.getItem(storageKey)||"[]"));

const $=id=>document.getElementById(id);
function norm(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z]/g,"")}
function saveUsed(){localStorage.setItem(storageKey,JSON.stringify([...used]))}
function choose(){
 const pool=round===8?HARD:NORMAL;
 let available=pool.filter(x=>!used.has(norm(x.palavra)));
 if(!available.length){pool.forEach(x=>used.delete(norm(x.palavra)));saveUsed();available=[...pool]}
 const x=available[Math.floor(Math.random()*available.length)];
 used.add(norm(x.palavra));saveUsed();
 return {...x,normal:norm(x.palavra)};
}
function coinsUI(){$("coins").textContent=Number(coins||0).toLocaleString("pt-BR")}
function frame(){
 const n=Math.min(errors,6);
 document.querySelectorAll(".hangman-layer").forEach((x,i)=>x.classList.toggle("active",i===n));
 [...$("errorsRow").children].forEach((x,i)=>x.classList.toggle("active",i<errors));
}
function wordUI(){
 $("word").innerHTML="";
 for(const c of current.normal){
  const s=document.createElement("span");s.className="letter";s.textContent=usedLetters.has(c)?c.toUpperCase():"";$("word").appendChild(s);
 }
}
function complete(){return [...new Set(current.normal)].every(c=>usedLetters.has(c))}
function keyboard(){
 const k=$("keyboard");k.innerHTML="";
 for(const c of "ABCDEFGHIJKLMNOPQRSTUVWXYZ"){
  const b=document.createElement("button");b.className="key";b.type="button";b.textContent=c;
  b.onclick=()=>guess(c.toLowerCase(),b);k.appendChild(b);
 }
}
function lock(){ $("keyboard").querySelectorAll("button").forEach(b=>b.disabled=true) }
function msg(t,c){$("message").textContent=t;$("message").className="message show "+c}
function start(){
 errors=0;locked=false;usedLetters=new Set();current=choose();
 const hard=round===8;
 $("levelName").textContent=hard?"🔥 HARD":round<=2?"FÁCIL":round<=4?"MÉDIO":"DIFÍCIL";
 $("roundNumber").textContent=round+" / 8";$("roundReward").textContent="🪙 "+rewards[round-1];
 $("progressText").textContent=round+" / 8";$("progressFill").style.width=(round/8*100)+"%";
 $("hint").textContent=current.pista;$("reward").style.display="none";$("message").className="message";
 frame();wordUI();keyboard();
}
async function reward(n){
 if(!userRef)throw Error("Cadastro não encontrado.");
 await runTransaction(db,async tx=>{
  const s=await tx.get(userRef);
  if(!s.exists())throw Error("Cadastro não encontrado.");
  const old=Number(s.data().moedas||0);
  tx.update(userRef,{moedas:old+n});
 });
 coins+=n;coinsUI();
}
function openModal(icon,title,coinsText,text,button,a){
 $("modalIcon").textContent=icon;$("modalTitle").textContent=title;$("modalCoins").textContent=coinsText;$("modalText").textContent=text;$("modalButton").textContent=button;action=a;$("modal").classList.add("show");
}
function loss(){openModal("💀","Você perdeu!","Tente novamente","A palavra era: "+current.palavra,"VOLTAR AOS JOGOS","exit")}
function hardIntro(){openModal("🔥","Você chegou à fase HARD!","🪙 75 ADAM COINS","Rodada bônus! Acerte a palavra e ganhe 75 Adam Coins.","JOGAR RODADA BÔNUS","hard")}
async function win(){
 if(locked)return;
 locked=true;lock();
 const n=rewards[round-1];
 try{
  await reward(n);
  $("rewardValue").textContent=n;$("reward").style.display="block";msg("🎉 Palavra correta! +"+n+" Adam Coins!","success");
  setTimeout(()=>{
   if(round<7)openModal("🎉","Parabéns!","+"+n+" Adam Coins","Prepare-se para a próxima rodada.","PRÓXIMA RODADA","next");
   else if(round===7)hardIntro();
   else openModal("🏆","RODADA BÔNUS CONCLUÍDA!","+75 ADAM COINS","Você completou as 8 rodadas.","VOLTAR AOS JOGOS","exit");
  },3000);
 }catch(e){
  console.error(e);locked=false;msg("⚠️ Não foi possível registrar as moedas. Tente novamente.","error");keyboard();
 }
}
function lose(){
 if(locked)return;
 locked=true;lock();errors=6;frame();msg("💀 Você perdeu!","error");
 setTimeout(loss,3000);
}
function guess(c,b){
 if(locked||usedLetters.has(c))return;
 usedLetters.add(c);b.disabled=true;
 if(current.normal.includes(c)){
  b.classList.add("correct");wordUI();
  if(complete())win();
 }else{
  b.classList.add("wrong");errors++;frame();
  if(errors>=6)lose();
 }
}
$("modalButton").onclick=()=>{
 $("modal").classList.remove("show");
 if(action==="next"){round++;start()}
 else if(action==="hard"){round=8;start()}
 else location.href="jogos.html";
};
$("back").onclick=()=>location.href="jogos.html";

async function findUser(u){
 let s=await getDocs(query(collection(db,"admins"),where("uid","==",u.uid)));
 if(!s.empty)return s.docs[0].ref;
 if(u.email){
  s=await getDocs(query(collection(db,"admins"),where("email","==",u.email)));
  if(!s.empty)return s.docs[0].ref;
 }
 return null;
}

onAuthStateChanged(auth,async u=>{
 if(!u){location.href="index.html";return}
 user=u;
 try{
  userRef=await findUser(u);
  if(!userRef){alert("Cadastro Adam Games não encontrado.");location.href="jogos.html";return}
  const s=await getDoc(userRef);
  coins=Number(s.data()?.moedas||0);coinsUI();start();
 }catch(e){console.error(e);alert("Erro ao carregar seus dados.")}
});
</script>
</body>
</html>
