<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Adam Games • Forca</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

  min-height:100vh;

  background:
    linear-gradient(
      180deg,
      #031b30,
      #062d4c
    );

  color:#fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}


.page{

  width:100%;

  max-width:650px;

  margin:auto;

  padding:
    16px
    14px
    50px;

}


/* =====================================================
   TOPO
===================================================== */

.top{

  display:flex;

  align-items:center;

  justify-content:space-between;

}


.back{

  width:45px;

  height:45px;

  border:0;

  border-radius:14px;

  background:#082b48;

  color:#fff;

  font-size:25px;

}


.top-title{

  text-align:center;

}


.top-title small{

  display:block;

  color:#62c8ff;

  font-size:10px;

  letter-spacing:2px;

}


.top-title strong{

  font-size:20px;

}


/* =====================================================
   PROGRESSO
===================================================== */

.progress-card{

  margin-top:15px;

  padding:16px;

  border-radius:20px;

  background:#082b48;

  border:
    1px solid
    rgba(255,255,255,.08);

}


.progress-header{

  display:flex;

  justify-content:space-between;

  font-size:13px;

  font-weight:900;

}


.progress-bar{

  height:11px;

  margin-top:10px;

  overflow:hidden;

  border-radius:20px;

  background:#163c57;

}


.progress-fill{

  width:0%;

  height:100%;

  background:
    linear-gradient(
      90deg,
      #19c968,
      #ffe000
    );

  transition:
    width .3s ease;

}


/* =====================================================
   IMAGEM
===================================================== */

.image-card{

  margin-top:16px;

  overflow:hidden;

  border-radius:22px;

  background:#082b48;

  border:
    1px solid
    rgba(255,255,255,.1);

}


.image-card img{

  width:100%;

  display:block;

  aspect-ratio:16 / 9;

  object-fit:cover;

}


/* =====================================================
   DICA
===================================================== */

.dica{

  margin-top:14px;

  padding:15px;

  border-radius:18px;

  text-align:center;

  background:#082b48;

}


.dica small{

  color:#65d2ff;

  font-weight:900;

}


.dica strong{

  display:block;

  margin-top:5px;

  font-size:17px;

}


/* =====================================================
   PALAVRA
===================================================== */

.word{

  margin-top:25px;

  text-align:center;

  font-size:
    clamp(
      25px,
      8vw,
      43px
    );

  font-weight:900;

  letter-spacing:
    clamp(
      5px,
      2vw,
      12px
    );

  color:#fff;

}


/* =====================================================
   TECLADO
===================================================== */

.keyboard{

  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  gap:7px;

  margin-top:25px;

}


.key{

  min-height:50px;

  border:0;

  border-radius:12px;

  background:
    linear-gradient(
      180deg,
      #159bd7,
      #0872a8
    );

  color:#fff;

  font-size:16px;

  font-weight:900;

  cursor:pointer;

}


.key:active{

  transform:scale(.95);

}


.key.correct{

  background:#168a57;

}


.key.wrong{

  background:#7c3151;

}


.key:disabled{

  opacity:.45;

  cursor:not-allowed;

}


/* =====================================================
   STATUS
===================================================== */

.status{

  margin-top:18px;

  padding:15px;

  border-radius:17px;

  text-align:center;

  font-weight:900;

  line-height:1.4;

}


.status.success{

  background:
    rgba(18,170,92,.18);

  border:
    1px solid
    rgba(18,220,120,.3);

  color:#7cffb1;

}


.status.error{

  background:
    rgba(220,50,70,.15);

  border:
    1px solid
    rgba(255,80,90,.3);

  color:#ff9aa4;

}


.status.info{

  background:
    rgba(50,150,220,.15);

  border:
    1px solid
    rgba(80,180,255,.25);

  color:#a9ddff;

}


/* =====================================================
   BOTÃO
===================================================== */

.action{

  width:100%;

  height:50px;

  margin-top:15px;

  border:0;

  border-radius:14px;

  background:#16a85b;

  color:#fff;

  font-size:15px;

  font-weight:900;

  cursor:pointer;

}


/* =====================================================
   MODAL
===================================================== */

.modal{

  position:fixed;

  inset:0;

  z-index:100;

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:
    rgba(0,10,25,.85);

}


.modal.show{

  display:flex;

}


.modal-card{

  width:100%;

  max-width:380px;

  padding:28px 20px;

  border-radius:23px;

  background:#082b48;

  text-align:center;

}


.modal-card h2{

  font-size:25px;

}


.modal-card p{

  margin-top:10px;

  color:#b9d7e8;

  line-height:1.5;

}


.modal-card button{

  width:100%;

  height:48px;

  margin-top:20px;

  border:0;

  border-radius:13px;

  background:#17a95d;

  color:#fff;

  font-weight:900;

}

</style>

</head>


<body>


<div class="page">


  <div class="top">

    <button
      class="back"
      id="back">

      ←

    </button>


    <div class="top-title">

      <small>
        ADAM GAMES
      </small>

      <strong>
        FORCA
      </strong>

    </div>


    <div style="width:45px"></div>

  </div>


  <div class="progress-card">

    <div class="progress-header">

      <span>
        PROGRESSO DA SEQUÊNCIA
      </span>

      <span id="fase">
        1 / 7
      </span>

    </div>


    <div class="progress-bar">

      <div
        class="progress-fill"
        id="progress">

      </div>

    </div>

  </div>


  <div class="image-card">

    <img
      src="./card_forca.png"
      alt="Forca">

  </div>


  <div class="dica">

    <small>
      💡 DICA
    </small>

    <strong id="dica">
      Animal de grande porte e tromba
    </strong>

  </div>


  <div
    class="word"
    id="word">

  </div>


  <div
    class="keyboard"
    id="keyboard">

  </div>


  <div
    class="status info"
    id="status">

    🎟️ Preparando sua partida...

  </div>


  <button
    class="action"
    id="voltar"
    style="display:none">

    VOLTAR PARA OS JOGOS

  </button>


</div>


<div
  class="modal"
  id="modal">

  <div class="modal-card">

    <h2 id="modalTitle">
      Você perdeu
    </h2>

    <p id="modalText">
      A partida terminou.
    </p>

    <button
      id="modalButton">

      CONTINUAR

    </button>

  </div>

</div>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  doc,
  writeBatch,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:
    "adam-games-21081.firebaseapp.com",

  projectId:
    "adam-games-21081",

  storageBucket:
    "adam-games-21081.firebasestorage.app",

  messagingSenderId:
    "1055528418738",

  appId:
    "1:1055528418738:web:5fafdf63424ba9744eb8ab"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================================
   ELEMENTOS
===================================================== */

const wordEl =
  document.getElementById("word");


const keyboardEl =
  document.getElementById("keyboard");


const statusEl =
  document.getElementById("status");


const progressEl =
  document.getElementById("progress");


const modal =
  document.getElementById("modal");


const modalTitle =
  document.getElementById("modalTitle");


const modalText =
  document.getElementById("modalText");


const modalButton =
  document.getElementById("modalButton");


const voltar =
  document.getElementById("voltar");


/* =====================================================
   PALAVRA
===================================================== */

const PALAVRA =
  "ELEFANTE";


const DICA =
  "Animal de grande porte e tromba";


const MAX_ERROS =
  6;


let letras =
  new Set();


let erros =
  0;


let usuario =
  null;


let usuarioRef =
  null;


let partidaId =
  null;


let partidaFinalizada =
  false;


/* =====================================================
   DESENHAR PALAVRA
===================================================== */

function desenharPalavra(){

  wordEl.textContent =
    PALAVRA
      .split("")
      .map(letra => {

        if(
          letras.has(letra)
        ){

          return letra;

        }

        return "_";

      })
      .join(" ");

}


/* =====================================================
   PROGRESSO
===================================================== */

function atualizarProgresso(){

  const acertos =
    PALAVRA
      .split("")
      .filter(
        letra =>
          letras.has(letra)
      )
      .length;


  const percentual =
    (
      acertos /
      PALAVRA.length
    ) * 100;


  progressEl.style.width =
    percentual + "%";

}


/* =====================================================
   TECLADO
===================================================== */

function criarTeclado(){

  const alfabeto =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ";


  keyboardEl.innerHTML =
    "";


  [...alfabeto].forEach(
    letra => {

      const botao =
        document.createElement("button");


      botao.className =
        "key";


      botao.textContent =
        letra;


      botao.type =
        "button";


      botao.addEventListener(
        "click",
        () => {

          escolherLetra(
            letra,
            botao
          );

        }
      );


      keyboardEl.appendChild(
        botao
      );

    }
  );

}


/* =====================================================
   ESCOLHER LETRA
===================================================== */

function escolherLetra(
  letra,
  botao
){

  if(
    partidaFinalizada ||
    letras.has(letra)
  ){

    return;

  }


  letras.add(letra);

  botao.disabled =
    true;


  if(
    PALAVRA.includes(letra)
  ){

    botao.classList.add(
      "correct"
    );


    statusEl.textContent =
      "✅ Boa! A letra está na palavra.";

    statusEl.className =
      "status success";


    desenharPalavra();

    atualizarProgresso();


    verificarVitoria();

  }

  else{

    botao.classList.add(
      "wrong"
    );


    erros++;


    statusEl.textContent =
      "❌ Letra errada. Tentativas: " +
      erros +
      " / " +
      MAX_ERROS;

    statusEl.className =
      "status error";


    if(
      erros >= MAX_ERROS
    ){

      perder();

    }

  }

}


/* =====================================================
   VERIFICAR VITÓRIA
===================================================== */

async function verificarVitoria(){

  const venceu =
    PALAVRA
      .split("")
      .every(
        letra =>
          letras.has(letra)
      );


  if(
    venceu
  ){

    await ganhar();

  }

}


/* =====================================================
   COMEÇAR PARTIDA
===================================================== */

async function iniciarPartida(){

  if(
    !usuarioRef
  ){

    return;

  }


  try{

    const snapshot =
      await getDocs(
        query(
          collection(db,"admins"),
          where(
            "uid",
            "==",
            usuario.uid
          )
        )
      );


    if(
      snapshot.empty
    ){

      throw new Error(
        "Cadastro não encontrado."
      );

    }


    const cadastro =
      snapshot.docs[0];


    usuarioRef =
      cadastro.ref;


    const dados =
      cadastro.data();


    const chances =
      Number(
        dados.chances || 0
      );


    if(
      chances <= 0
    ){

      throw new Error(
        "Você não possui chances."
      );

    }


    const novaPartida =
      doc(
        collection(
          db,
          "gameSessions"
        )
      );


    const batch =
      writeBatch(db);


    batch.set(
      novaPartida,
      {

        uid:
          usuario.uid,

        game:
          "forca",

        status:
          "ativa",

        rewardBase:
          30,

        rewardWin:
          20,

        chanceConsumed:
          true,

        createdAt:
          serverTimestamp(),

        finalizadoEm:
          null

      }
    );


    batch.update(
      usuarioRef,
      {

        chances:
          chances - 1,

        moedas:
          Number(
            dados.moedas || 0
          ) + 30,

        ultimaPartidaForcaId:
          novaPartida.id,

        ultimaPartidaForcaEm:
          serverTimestamp()

      }
    );


    await batch.commit();


    partidaId =
      novaPartida.id;


    statusEl.textContent =
      "🪙 +30 moedas recebidas! Boa sorte!";


    statusEl.className =
      "status success";


  }

  catch(error){

    console.error(
      "ERRO AO INICIAR FORCA:",
      error
    );


    statusEl.textContent =
      "⚠️ Não foi possível iniciar a partida. " +
      (
        error.code ===
        "permission-denied"

        ?

        "Verifique as Rules do Firebase."

        :

        error.message
      );


    statusEl.className =
      "status error";


    keyboardEl
      .querySelectorAll("button")
      .forEach(
        b =>
          b.disabled = true
      );

  }

}


/* =====================================================
   GANHAR
===================================================== */

async function ganhar(){

  if(
    partidaFinalizada
  ){

    return;

  }


  partidaFinalizada =
    true;


  try{

    const batch =
      writeBatch(db);


    const sessionRef =
      doc(
        db,
        "gameSessions",
        partidaId
      );


    batch.update(
      sessionRef,
      {

        status:
          "won",

        finalizadoEm:
          serverTimestamp()

      }
    );


    batch.update(
      usuarioRef,
      {

        moedas:
          Number(
            usuario.moedas || 0
          ) + 20,

        ultimaPartidaForcaId:
          partidaId,

        ultimaPartidaForcaEm:
          serverTimestamp()

      }
    );


    await batch.commit();


    usuario.moedas =
      Number(
        usuario.moedas || 0
      ) + 20;


    statusEl.textContent =
      "🎉 Palavra correta! +20 moedas extras!";


    statusEl.className =
      "status success";


    bloquearTeclado();


    setTimeout(
      () => {

        abrirModal(
          "🎉 VOCÊ ACERTOU!",
          "Parabéns! Você ganhou +20 moedas extras.",
          "CONTINUAR"
        );

      },
      3000
    );

  }

  catch(error){

    console.error(
      "ERRO AO REGISTRAR VITÓRIA:",
      error
    );


    partidaFinalizada =
      false;


    statusEl.textContent =
      "⚠️ A palavra foi acertada, mas não foi possível registrar as 20 moedas. Tente novamente.";

    statusEl.className =
      "status error";

  }

}


/* =====================================================
   PERDER
===================================================== */

async function perder(){

  if(
    partidaFinalizada
  ){

    return;

  }


  partidaFinalizada =
    true;


  bloquearTeclado();


  try{

    const batch =
      writeBatch(db);


    batch.update(

      doc(
        db,
        "gameSessions",
        partidaId
      ),

      {

        status:
          "perdida",

        finalizadoEm:
          serverTimestamp()

      }

    );


    await batch.commit();

  }

  catch(error){

    console.error(
      "ERRO AO FINALIZAR DERROTA:",
      error
    );

  }


  statusEl.textContent =
    "❌ Você perdeu a partida.";

  statusEl.className =
    "status error";


  setTimeout(
    () => {

      abrirModal(
        "😢 VOCÊ PERDEU",
        "A palavra era ELEFANTE. As 30 moedas da partida continuam com você.",
        "CONTINUAR"
      );

    },
    3000
  );

}


/* =====================================================
   BLOQUEAR TECLADO
===================================================== */

function bloquearTeclado(){

  keyboardEl
    .querySelectorAll("button")
    .forEach(
      button => {

        button.disabled =
          true;

      }
    );

}


/* =====================================================
   MODAL
===================================================== */

function abrirModal(
  titulo,
  texto,
  botao
){

  modalTitle.textContent =
    titulo;


  modalText.textContent =
    texto;


  modalButton.textContent =
    botao;


  modal.classList.add(
    "show"
  );

}


/* =====================================================
   MODAL CONTINUAR
===================================================== */

modalButton.addEventListener(
  "click",
  () => {

    window.location.href =
      "jogos.html";

  }
);


/* =====================================================
   VOLTAR
===================================================== */

document
  .getElementById("back")
  .addEventListener(
    "click",
    () => {

      window.location.href =
        "jogos.html";

    }
  );


voltar.addEventListener(
  "click",
  () => {

    window.location.href =
      "jogos.html";

  }
);


/* =====================================================
   LOGIN
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      window.location.replace(
        "index.html"
      );

      return;

    }


    usuario =
      user;


    try{

      const snapshot =
        await getDocs(

          query(
            collection(db,"admins"),
            where(
              "uid",
              "==",
              user.uid
            )
          )

        );


      if(
        snapshot.empty
      ){

        statusEl.textContent =
          "⚠️ Cadastro não encontrado.";

        statusEl.className =
          "status error";

        return;

      }


      const cadastro =
        snapshot.docs[0];


      usuarioRef =
        cadastro.ref;


      const dados =
        cadastro.data();


      usuario.moedas =
        Number(
          dados.moedas || 0
        );


      usuario.chances =
        Number(
          dados.chances || 0
        );


      if(
        usuario.chances <= 0
      ){

        statusEl.textContent =
          "🎟️ Você não possui chances para jogar.";

        statusEl.className =
          "status error";

        return;

      }


      iniciarPartida();

    }

    catch(error){

      console.error(error);

      statusEl.textContent =
        "⚠️ Erro ao carregar sua partida.";

      statusEl.className =
        "status error";

    }

  }
);


/* =====================================================
   INICIALIZAÇÃO VISUAL
===================================================== */

document.getElementById(
  "dica"
).textContent =
  DICA;


document.getElementById(
  "fase"
).textContent =
  "1 / 7";


desenharPalavra();

criarTeclado();

atualizarProgresso();

</script>

</body>

</html>
