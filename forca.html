<!DOCTYPE html>
<html lang="pt-BR">

<meta charset="UTF-8">

<title>Adam Games • Forca</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  background:#061b2d;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;

  background:
    radial-gradient(
      circle at 10% 0%,
      rgba(0,205,120,.42),
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 10%,
      rgba(25,170,255,.42),
      transparent 30%
    ),
    linear-gradient(
      180deg,
      #087fc1 0%,
      #064b80 48%,
      #031c35 100%
    );
}

.page{
  width:100%;
  max-width:650px;
  margin:0 auto;
  padding:16px 15px 80px;
}

/* TOPO */

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.back{
  width:45px;
  height:45px;
  border:0;
  border-radius:14px;
  background:rgba(0,30,60,.82);
  color:#fff;
  font-size:25px;
  cursor:pointer;
}

.title{
  text-align:center;
  text-shadow:0 2px 8px #000;
}

.title small{
  display:block;
  font-size:9px;
  letter-spacing:2px;
}

.title strong{
  font-size:20px;
}

.top-coins{
  min-width:72px;
  padding:7px 9px;
  border-radius:12px;
  text-align:center;
  background:rgba(255,213,43,.12);
  border:1px solid rgba(255,213,43,.2);
}

.top-coins-label{
  color:#b8d2e6;
  font-size:8px;
  font-weight:bold;
}

.top-coins-value{
  margin-top:2px;
  color:#ffd52b;
  font-size:17px;
  font-weight:900;
}

/* HERO */

.hero{
  margin-top:15px;
  padding:18px;
  border-radius:23px;
  text-align:center;

  background:
    linear-gradient(
      135deg,
      rgba(0,45,80,.97),
      rgba(2,30,58,.97)
    );

  border:1px solid rgba(255,255,255,.1);

  box-shadow:
    0 12px 30px rgba(0,0,0,.25);
}

.hero-icon{
  font-size:43px;
}

.hero h1{
  margin-top:4px;
  font-size:31px;
  font-weight:900;
}

.hero p{
  margin-top:5px;
  color:#bcd9ec;
  font-size:13px;
}

/* NÍVEL */

.level-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.level-box{
  padding:10px 6px;
  border-radius:13px;
  text-align:center;
  background:rgba(255,255,255,.065);
  border:1px solid rgba(255,255,255,.08);
}

.level-label{
  color:#9fc5df;
  font-size:8px;
  font-weight:bold;
}

.level-value{
  margin-top:3px;
  font-size:16px;
  font-weight:900;
}

/* PROGRESSO */

.progress-card{
  margin-top:12px;
  padding:13px;
  border-radius:16px;
  background:rgba(2,27,55,.86);
}

.progress-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.progress-title{
  font-size:12px;
  font-weight:900;
}

.progress-count{
  color:#9fc5df;
  font-size:11px;
}

.progress-bar{
  height:8px;
  margin-top:8px;
  overflow:hidden;
  border-radius:20px;
  background:rgba(255,255,255,.09);
}

.progress-fill{
  height:100%;
  width:0%;
  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      #18bd68,
      #ffd52b
    );

  transition:width .3s ease;
}

/* FORCA */

.game-card{
  margin-top:13px;
  padding:14px;
  border-radius:21px;

  background:rgba(2,27,55,.95);

  border:1px solid rgba(255,255,255,.1);

  box-shadow:
    0 10px 27px rgba(0,0,0,.22);
}

.hangman-wrap{
  position:relative;
  width:100%;
  aspect-ratio:1.15 / 1;
  max-width:460px;
  margin:0 auto;
  overflow:hidden;
  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      rgba(9,55,86,.95),
      rgba(3,27,52,.98)
    );
}

.hangman-wrap img{
  width:100%;
  height:100%;
  display:block;
  object-fit:contain;
}

/* ERROS */

.errors-row{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-top:11px;
}

.error-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.1);
}

.error-dot.active{
  background:#ff5365;
  box-shadow:0 0 8px rgba(255,60,80,.5);
}

/* DICA */

.hint{
  margin-top:13px;
  padding:13px;
  border-radius:15px;
  text-align:center;

  background:rgba(25,170,255,.09);
  border:1px solid rgba(25,170,255,.13);
}

.hint-label{
  color:#76c9ff;
  font-size:9px;
  font-weight:900;
  letter-spacing:1px;
}

.hint-text{
  margin-top:4px;
  color:#fff;
  font-size:15px;
  font-weight:bold;
}

/* PALAVRA */

.word{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:6px;
  margin-top:18px;
  min-height:48px;
}

.letter{
  width:27px;
  height:39px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding-bottom:5px;

  border-bottom:3px solid #69cfff;

  color:#fff;
  font-size:24px;
  font-weight:900;
  text-transform:uppercase;
}

/* TECLADO */

.keyboard{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  margin-top:20px;
}

.key{
  min-height:42px;
  border:0;
  border-radius:10px;

  background:
    linear-gradient(
      145deg,
      #12679a,
      #08476f
    );

  color:#fff;
  font-size:15px;
  font-weight:900;
  cursor:pointer;

  box-shadow:
    0 3px 0 rgba(0,0,0,.25);
}

.key:active{
  transform:translateY(2px);
}

.key.used{
  opacity:.28;
  cursor:not-allowed;
}

.key.correct{
  background:
    linear-gradient(
      145deg,
      #16b866,
      #087d45
    );
}

.key.wrong{
  background:
    linear-gradient(
      145deg,
      #c72e45,
      #8d182c
    );
}

.key:disabled{
  cursor:not-allowed;
}

/* MENSAGEM */

.message{
  display:none;
  margin-top:14px;
  padding:15px;
  border-radius:15px;
  text-align:center;
  font-size:14px;
  font-weight:bold;
}

.message.show{
  display:block;
}

.message.success{
  background:rgba(0,220,110,.12);
  border:1px solid rgba(0,220,110,.2);
  color:#72ffae;
}

.message.error{
  background:rgba(255,50,70,.12);
  border:1px solid rgba(255,50,70,.2);
  color:#ff9ca8;
}

/* RECOMPENSA */

.reward{
  margin-top:12px;
  padding:13px;
  border-radius:15px;
  text-align:center;

  background:rgba(255,213,43,.08);
  border:1px solid rgba(255,213,43,.17);
}

.reward strong{
  color:#ffd52b;
  font-size:20px;
}

/* BOTÃO */

.next-button{
  width:100%;
  height:50px;
  margin-top:13px;

  border:0;
  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #18bd68,
      #087d45
    );

  color:#fff;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:100;

  display:none;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(0,10,25,.84);

  backdrop-filter:blur(5px);
}

.modal.show{
  display:flex;
}

.modal-card{
  width:100%;
  max-width:380px;
  padding:25px 20px;
  border-radius:23px;
  text-align:center;

  background:#082742;

  border:1px solid rgba(255,255,255,.12);

  box-shadow:
    0 20px 50px rgba(0,0,0,.45);
}

.modal-icon{
  font-size:52px;
}

.modal-card h2{
  margin-top:8px;
  font-size:24px;
}

.modal-card p{
  margin-top:8px;
  color:#b9d5e8;
  font-size:14px;
  line-height:1.5;
}

.modal-coins{
  margin-top:12px;
  color:#ffd52b;
  font-size:22px;
  font-weight:900;
}

.modal-button{
  width:100%;
  height:48px;
  margin-top:18px;
  border:0;
  border-radius:13px;
  background:#18a85c;
  color:#fff;
  font-weight:900;
  cursor:pointer;
}

@media(max-width:430px){

  .keyboard{
    grid-template-columns:repeat(7,1fr);
    gap:5px;
  }

  .key{
    min-height:39px;
    font-size:14px;
  }

  .letter{
    width:24px;
    font-size:21px;
  }

}

</style>

</head>

/* =====================================================
   NORMALIZAR
===================================================== */

function normalizarTexto(texto){

  return texto
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/[^a-z]/g,"");

}


/* =====================================================
   PALAVRAS USADAS
===================================================== */

function chavePalavrasUsadas(){

  return "adamGames_forca_usadas_" +
    (firebaseUser?.uid || "visitante");

}

function carregarPalavrasUsadas(){

  try{

    const dados =
      localStorage.getItem(
        chavePalavrasUsadas()
      );

    if(!dados){
      return [];
    }

    const lista =
      JSON.parse(dados);

    return Array.isArray(lista)
      ? lista
      : [];

  }catch(error){

    return [];

  }

}

function salvarPalavraUsada(palavra){

  try{

    const usadas =
      carregarPalavrasUsadas();

    const chave =
      normalizarTexto(palavra);

    if(!usadas.includes(chave)){
      usadas.push(chave);
    }

    localStorage.setItem(
      chavePalavrasUsadas(),
      JSON.stringify(usadas)
    );

  }catch(error){

    console.error(
      "Erro ao salvar palavra:",
      error
    );

  }

}


/* =====================================================
   ESCOLHER PALAVRA
===================================================== */

function escolherPalavra(nivel){

  let lista;

  if(nivel === "FÁCIL"){
    lista = palavras.facil;
  }
  else if(nivel === "MÉDIO"){
    lista = palavras.medio;
  }
  else{
    lista = palavras.dificil;
  }

  const usadas =
    carregarPalavrasUsadas();

  let disponiveis =
    lista.filter(
      item =>
        !usadas.includes(
          normalizarTexto(item[0])
        )
    );

  /*
   * Só reinicia aquele nível quando
   * todas as palavras daquele nível
   * já tiverem sido utilizadas.
   */

  if(!disponiveis.length){

    disponiveis = lista;

  }

  const escolhida =
    disponiveis[
      Math.floor(
        Math.random() *
        disponiveis.length
      )
    ];

  salvarPalavraUsada(
    escolhida[0]
  );

  return {

    palavra:escolhida[0],

    dica:escolhida[1],

    normalizada:
      normalizarTexto(
        escolhida[0]
      )

  };

}

  );

/* =====================================================
   DESENHAR PALAVRA
===================================================== */

function desenharPalavra(){

  wordEl.innerHTML = "";

  const palavra =
    palavraAtual.normalizada;

  for(
    let i = 0;
    i < palavra.length;
    i++
  ){

    const letra =
      palavra[i];

    const span =
      document.createElement(
        "span"
      );

    span.className =
      "letter";

    if(
      letrasEscolhidas.has(
        letra
      )
    ){

      span.textContent =
        letra.toUpperCase();

    }

    wordEl.appendChild(
      span
    );

  }

}


/* =====================================================
   TECLADO
===================================================== */

const letras =
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ";


function criarTeclado(){

  keyboardEl.innerHTML = "";

  for(
    const letra of letras
  ){

    const button =
      document.createElement(
        "button"
      );

    button.className =
      "key";

    button.type =
      "button";

    button.textContent =
      letra;

    button.addEventListener(
      "click",
      () => {

        escolherLetra(
          letra.toLowerCase(),
          button
        );

      }
    );

    keyboardEl.appendChild(
      button
    );

  }

}


/* =====================================================
   ESCOLHER LETRA
===================================================== */

function escolherLetra(
  letra,
  botao
){

  if(partidaTerminou){
    return;
  }

  if(
    letrasEscolhidas.has(
      letra
    )
  ){
    return;
  }

  letrasEscolhidas.add(
    letra
  );

  botao.disabled = true;

  botao.classList.add(
    "used"
  );

  const acertou =
    palavraAtual.normalizada.includes(
      letra
    );

  if(acertou){

    botao.classList.add(
      "correct"
    );

    desenharPalavra();

    if(
      palavraCompleta()
    ){

      ganhar();

    }

  }
  else{

    botao.classList.add(
      "wrong"
    );

    erros++;

    atualizarImagem();

    if(
      erros >= 7
    ){

      perder();

    }

  }

}


/* =====================================================
   PALAVRA COMPLETA
===================================================== */

function palavraCompleta(){

  for(
    const letra of palavraAtual.normalizada
  ){

    if(
      !letrasEscolhidas.has(
        letra
      )
    ){

      return false;

    }

  }

  return true;

}


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
  texto,
  tipo
){

  messageEl.textContent =
    texto;

  messageEl.className =
    "message show " +
    tipo;

}


/* =====================================================
   DESABILITAR TECLADO
===================================================== */

function bloquearTeclado(){

  keyboardEl
    .querySelectorAll(
      "button"
    )
    .forEach(
      button => {

        button.disabled =
          true;

      }
    );

}


/* =====================================================
   REVELAR PALAVRA
===================================================== */

function revelarPalavra(){

  letrasEscolhidas =
    new Set(
      palavraAtual.normalizada.split("")
    );

  desenharPalavra();

}


/* =====================================================
   ADICIONAR MOEDAS
===================================================== */

async function adicionarMoedas(
  quantidade
){

  if(!usuarioRef){
    return;
  }

  const moedasAtuais =
    Number(
      usuario.moedas || 0
    );

  const novoSaldo =
    moedasAtuais +
    quantidade;

  await updateDoc(
    usuarioRef,
    {
      moedas:
        novoSaldo
    }
  );

  usuario.moedas =
    novoSaldo;

  moedasLocais =
    novoSaldo;

  atualizarMoedas();

}


/* =====================================================
   GANHOU
===================================================== */

async function ganhar(){

  if(partidaTerminou){
    return;
  }

  partidaTerminou =
    true;

  const recompensa =
    nivelAtual().recompensa;

  bloquearTeclado();

  revelarPalavra();

  rewardValueEl.textContent =
    recompensa;

  rewardEl.style.display =
    "block";

  try{

    await adicionarMoedas(
      recompensa
    );

  }
  catch(error){

    console.error(
      "Erro ao adicionar moedas:",
      error
    );

    mostrarMensagem(
      "Você acertou, mas houve um erro ao salvar as moedas.",
      "error"
    );

    return;

  }

  /*
   * Se chegou na rodada 7,
   * a sequência terminou.
   */

  if(rodada === 7){

    sequenciaConcluida =
      true;

    mostrarMensagem(
      "🏆 SEQUÊNCIA CONCLUÍDA! Você completou as 7 rodadas!",
      "success"
    );

    abrirModalFinal();

    return;

  }

  mostrarMensagem(
    "🎉 Você acertou! +" +
    recompensa +
    " moedas.",
    "success"
  );

  abrirModalProxima(
    recompensa
  );

}


/* =====================================================
   PERDEU
===================================================== */

function perder(){

  if(partidaTerminou){
    return;
  }

  partidaTerminou =
    true;

  bloquearTeclado();

  revelarPalavra();

  rewardEl.style.display =
    "none";

  mostrarMensagem(
    "💀 Você perdeu! A palavra era: " +
    palavraAtual.palavra,
    "error"
  );

  abrirModalDerrota();

}


/* =====================================================
   MODAL PRÓXIMA
===================================================== */

function abrirModalProxima(
  recompensa
){

  modalIcon.textContent =
    "🎉";

  modalTitle.textContent =
    "Parabéns!";

  modalText.textContent =
    "Você acertou a palavra e pode continuar para a próxima rodada.";

  modalCoins.textContent =
    "+" +
    recompensa +
    " 🪙";

  modalButton.textContent =
    "PRÓXIMA PALAVRA";

  modal.classList.add(
    "show"
  );

}


/* =====================================================
   MODAL FINAL DA SEQUÊNCIA
===================================================== */

function abrirModalFinal(){

  modalIcon.textContent =
    "🏆";

  modalTitle.textContent =
    "Sequência concluída!";

  modalText.textContent =
    "Você completou as 7 rodadas da Forca. Para jogar uma nova sequência, será necessária uma nova chance.";

  modalCoins.textContent =
    "7 RODADAS COMPLETAS 🎉";

  modalButton.textContent =
    "VOLTAR AOS JOGOS";

  modal.classList.add(
    "show"
  );

}


/* =====================================================
   MODAL DERROTA
===================================================== */

function abrirModalDerrota(){

  modalIcon.textContent =
    "💀";

  modalTitle.textContent =
    "Você perdeu!";

  modalText.textContent =
    "O personagem chegou ao último estágio. Sua sequência terminou. Para jogar novamente, será necessária uma nova chance.";

  modalCoins.textContent =
    "SEQUÊNCIA ENCERRADA";

  modalButton.textContent =
    "VOLTAR AOS JOGOS";

  modal.classList.add(
    "show"
  );

}


/* =====================================================
   PRÓXIMA RODADA
===================================================== */

function iniciarRodada(){

  partidaTerminou =
    false;

  sequenciaConcluida =
    false;

  erros =
    0;

  letrasEscolhidas =
    new Set();

  const nivel =
    nivelAtual();

  palavraAtual =
    escolherPalavra(
      nivel.nivel
    );

  atualizarNivel();

  hintEl.textContent =
    palavraAtual.dica;

  rewardEl.style.display =
    "none";

  messageEl.className =
    "message";

  messageEl.textContent =
    "";

  hangmanImage.src =
    "assets/forca/forca-0.png";

  atualizarImagem();

  criarTeclado();

  desenharPalavra();

}


/* =====================================================
   CONSUMIR CHANCE
===================================================== */

async function consumirChance(){

  if(
    chanceConsumida
  ){

    return true;

  }

  if(!usuarioRef){

    return false;

  }

  const chancesAtuais =
    Number(
      usuario.chances || 0
    );

  if(
    chancesAtuais <= 0
  ){

    return false;

  }

  const novasChances =
    chancesAtuais - 1;

  await updateDoc(
    usuarioRef,
    {
      chances:
        novasChances
    }
  );

  usuario.chances =
    novasChances;

  chanceConsumida =
    true;

  return true;

}


/* =====================================================
   INICIAR JOGO
===================================================== */

async function iniciarJogo(){

  if(!usuarioRef){

    alert(
      "Os dados do usuário ainda não foram carregados."
    );

    return;

  }

  const chances =
    Number(
      usuario.chances || 0
    );

  if(
    chances <= 0
  ){

    alert(
      "Você não possui chances para jogar. Aguarde uma nova chance."
    );

    window.location.href =
      "jogos.html";

    return;

  }

  try{

    const consumiu =
      await consumirChance();

    if(!consumiu){

      alert(
        "Não foi possível consumir sua chance."
      );

      window.location.href =
        "jogos.html";

      return;

    }

    /*
     * UMA chance libera as 7 rodadas.
     */

    rodada = 1;

    iniciarRodada();

  }
  catch(error){

    console.error(
      "Erro ao consumir chance:",
      error
    );

    alert(
      "Não foi possível iniciar a partida. Tente novamente."
    );

    window.location.href =
      "jogos.html";

  }

}


/* =====================================================
   MODAL
===================================================== */

modalButton.addEventListener(
  "click",
  () => {

    modal.classList.remove(
      "show"
    );

    /*
     * Se completou as 7 ou perdeu,
     * não começa outra sequência.
     *
     * Volta para jogos.
     */

    if(
      sequenciaConcluida ||
      partidaTerminou &&
      (
        rodada === 7 ||
        !palavraCompleta()
      )
    ){

      window.location.href =
        "jogos.html";

      return;

    }

    rodada++;

    iniciarRodada();

  }
);


/* =====================================================
   VOLTAR
===================================================== */

document
  .getElementById("back")
  .addEventListener(
    "click",
    () => {

      window.location.href =
        "jogos.html";

    }
  );


/* =====================================================
   LOCALIZAR USUÁRIO
===================================================== */

async function localizarUsuario(
  user
){

  let resultado;

  resultado =
    await getDocs(

      query(

        collection(
          db,
          "admins"
        ),

        where(
          "uid",
          "==",
          user.uid
        )

      )

    );

  if(
    !resultado.empty
  ){

    return resultado.docs[0];

  }

  if(
    user.email
  ){

    resultado =
      await getDocs(

        query(

          collection(
            db,
            "admins"
          ),

          where(
            "email",
            "==",
            user.email
          )

        )

      );

    if(
      !resultado.empty
    ){

      return resultado.docs[0];

    }

  }

  return null;

}


/* =====================================================
   LOGIN
===================================================== */

onAuthStateChanged(

  auth,

  async user => {

    if(!user){

      window.location.href =
        "index.html";

      return;

    }

    firebaseUser =
      user;

    try{

      const documento =
        await localizarUsuario(
          user
        );

      if(!documento){

        alert(
          "Cadastro Adam Games não encontrado."
        );

        window.location.href =
          "jogos.html";

        return;

      }

      usuarioRef =
        documento.ref;

      usuario =
        documento.data();

      moedasLocais =
        Number(
          usuario.moedas || 0
        );

      atualizarMoedas();

      /*
       * IMPORTANTE:
       *
       * Não inicia automaticamente sem
       * consumir a chance.
       */

      await iniciarJogo();

    }
    catch(error){

      console.error(
        "Erro ao carregar Forca:",
        error
      );

      alert(
        "Não foi possível carregar seus dados."
      );

    }

  }

);

</script>
