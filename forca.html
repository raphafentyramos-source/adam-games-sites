<title>Adam Games • Forca</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

  min-height:100vh;

  background:
    linear-gradient(
      180deg,
      #031b30,
      #062d4c
    );

  color:#fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}

.page{

  width:100%;

  max-width:650px;

  margin:auto;

  padding:
    16px
    14px
    50px;

}


/* =====================================================
   TOPO
===================================================== */

.top{

  display:flex;

  align-items:center;

  justify-content:space-between;

}

.back{

  width:45px;

  height:45px;

  border:0;

  border-radius:14px;

  background:#082b48;

  color:#fff;

  font-size:25px;

}

.top-title{

  text-align:center;

}

.top-title small{

  display:block;

  color:#62c8ff;

  font-size:10px;

  letter-spacing:2px;

}

.top-title strong{

  font-size:20px;

}


/* =====================================================
   PROGRESSO
===================================================== */

.progress-card{

  margin-top:15px;

  padding:16px;

  border-radius:20px;

  background:#082b48;

  border:
    1px solid
    rgba(255,255,255,.08);

}

.progress-header{

  display:flex;

  justify-content:space-between;

  font-size:13px;

  font-weight:900;

}

.progress-bar{

  height:11px;

  margin-top:10px;

  overflow:hidden;

  border-radius:20px;

  background:#163c57;

}

.progress-fill{

  width:0%;

  height:100%;

  background:
    linear-gradient(
      90deg,
      #19c968,
      #ffe000
    );

  transition:
    width .3s ease;

}


/* =====================================================
   IMAGEM
===================================================== */

.image-card{

  margin-top:16px;

  overflow:hidden;

  border-radius:22px;

  background:#082b48;

  border:
    1px solid
    rgba(255,255,255,.1);

}

.image-card img{

  width:100%;

  display:block;

  aspect-ratio:16 / 9;

  object-fit:cover;

}


/* =====================================================
   DICA
===================================================== */

.dica{

  margin-top:14px;

  padding:15px;

  border-radius:18px;

  text-align:center;

  background:#082b48;

}

.dica small{

  color:#65d2ff;

  font-weight:900;

}

.dica strong{

  display:block;

  margin-top:5px;

  font-size:17px;

}


/* =====================================================
   PALAVRA
===================================================== */

.word{

  margin-top:25px;

  text-align:center;

  font-size:
    clamp(
      25px,
      8vw,
      43px
    );

  font-weight:900;

  letter-spacing:
    clamp(
      5px,
      2vw,
      12px
    );

  color:#fff;

}


/* =====================================================
   TECLADO
===================================================== */

.keyboard{

  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  gap:7px;

  margin-top:25px;

}

.key{

  min-height:50px;

  border:0;

  border-radius:12px;

  background:
    linear-gradient(
      180deg,
      #159bd7,
      #0872a8
    );

  color:#fff;

  font-size:16px;

  font-weight:900;

  cursor:pointer;

}

.key:active{

  transform:scale(.95);

}

.key.correct{

  background:#168a57;

}

.key.wrong{

  background:#7c3151;

}

.key:disabled{

  opacity:.45;

  cursor:not-allowed;

}


/* =====================================================
   STATUS
===================================================== */

.status{

  margin-top:18px;

  padding:15px;

  border-radius:17px;

  text-align:center;

  font-weight:900;

  line-height:1.4;

}

.status.success{

  background:
    rgba(18,170,92,.18);

  border:
    1px solid
    rgba(18,220,120,.3);

  color:#7cffb1;

}

.status.error{

  background:
    rgba(220,50,70,.15);

  border:
    1px solid
    rgba(255,80,90,.3);

  color:#ff9aa4;

}

.status.info{

  background:
    rgba(50,150,220,.15);

  border:
    1px solid
    rgba(80,180,255,.25);

  color:#a9ddff;

}


/* =====================================================
   BOTÃO
===================================================== */

.action{

  width:100%;

  height:50px;

  margin-top:15px;

  border:0;

  border-radius:14px;

  background:#16a85b;

  color:#fff;

  font-size:15px;

  font-weight:900;

  cursor:pointer;

}


/* =====================================================
   MODAL
===================================================== */

.modal{

  position:fixed;

  inset:0;

  z-index:100;

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:
    rgba(0,10,25,.85);

}

.modal.show{

  display:flex;

}

.modal-card{

  width:100%;

  max-width:380px;

  padding:28px 20px;

  border-radius:23px;

  background:#082b48;

  text-align:center;

}

.modal-card h2{

  font-size:25px;

}

.modal-card p{

  margin-top:10px;

  color:#b9d7e8;

  line-height:1.5;

}

.modal-card button{

  width:100%;

  height:48px;

  margin-top:20px;

  border:0;

  border-radius:13px;

  background:#17a95d;

  color:#fff;

  font-weight:900;

}

</style>

</head>

    </h2>

    </p>

    <button
      id="modalButton"
      type="button"

<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  addDoc,
  doc,
  writeBatch,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:
    "adam-games-21081.firebaseapp.com",

  projectId:
    "adam-games-21081",

  storageBucket:
    "adam-games-21081.firebasestorage.app",

  messagingSenderId:
    "1055528418738",

  appId:
    "1:1055528418738:web:5fafdf63424ba9744eb8ab"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================================
   ELEMENTOS
===================================================== */

const wordEl =
  document.getElementById("word");


const keyboardEl =
  document.getElementById("keyboard");


const statusEl =
  document.getElementById("status");


const progressEl =
  document.getElementById("progress");


const modal =
  document.getElementById("modal");


const modalTitle =
  document.getElementById("modalTitle");


const modalText =
  document.getElementById("modalText");


const modalButton =
  document.getElementById("modalButton");


const voltar =
  document.getElementById("voltar");


/* =====================================================
   JOGO
===================================================== */

const PALAVRA =
  "ELEFANTE";


const DICA =
  "Animal de grande porte e tromba";


const MAX_ERROS =
  6;


/*
  Recompensa inicial da partida.
*/
const MOEDAS_PARTIDA =
  30;


/*
  Recompensa extra ao vencer.
*/
const MOEDAS_VITORIA =
  20;


/* =====================================================
   ESTADO
===================================================== */

let letras =
  new Set();


let erros =
  0;


let usuario =
  null;


/*
  Documento do usuário em /admins.
*/
let usuarioRef =
  null;


/*
  Dados atuais do documento /admins.
*/
let dadosUsuario =
  null;


/*
  ID da partida.
*/
let partidaId =
  null;


/*
  Evita finalizar duas vezes.
*/
let partidaFinalizada =
  false;


/*
  Impede iniciar duas partidas ao mesmo tempo.
*/
let iniciandoPartida =
  false;


/* =====================================================
   STATUS
===================================================== */

function mostrarStatus(
  texto,
  tipo
){

  statusEl.textContent =
    texto;

  statusEl.className =
    "status " +
    tipo;

}


/* =====================================================
   DESENHAR PALAVRA
===================================================== */

function desenharPalavra(){

  wordEl.textContent =
    PALAVRA
      .split("")
      .map(
        letra => {

          if(
            letras.has(letra)
          ){

            return letra;

          }

          return "_";

        }
      )
      .join(" ");

}


/* =====================================================
   PROGRESSO
===================================================== */

function atualizarProgresso(){

  const letrasUnicas =
    new Set(
      PALAVRA.split("")
    );


  const acertos =
    [...letrasUnicas]
      .filter(
        letra =>
          letras.has(letra)
      )
      .length;


  const percentual =
    (
      acertos /
      letrasUnicas.size
    ) * 100;


  progressEl.style.width =
    percentual + "%";

}


/* =====================================================
   TECLADO
===================================================== */

function criarTeclado(){

  const alfabeto =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ";


  keyboardEl.innerHTML =
    "";


  [...alfabeto].forEach(
    letra => {

      const botao =
        document.createElement(
          "button"
        );


      botao.className =
        "key";


      botao.textContent =
        letra;


      botao.type =
        "button";


      botao.addEventListener(
        "click",
        () => {

          escolherLetra(
            letra,
            botao
          );

        }
      );


      keyboardEl.appendChild(
        botao
      );

    }
  );

}


/* =====================================================
   BLOQUEAR TECLADO
===================================================== */

function bloquearTeclado(){

  keyboardEl
    .querySelectorAll("button")
    .forEach(
      button => {

        button.disabled =
          true;

      }
    );

}


/* =====================================================
   ESCOLHER LETRA
===================================================== */

function escolherLetra(
  letra,
  botao
){

  if(
    partidaFinalizada ||
    !partidaId ||
    letras.has(letra)
  ){

    return;

  }


  letras.add(letra);


  botao.disabled =
    true;


  if(
    PALAVRA.includes(letra)
  ){

    botao.classList.add(
      "correct"
    );


    mostrarStatus(
      "✅ Boa! A letra está na palavra.",
      "success"
    );


    desenharPalavra();

    atualizarProgresso();


    verificarVitoria();

  }
  else{

    botao.classList.add(
      "wrong"
    );


    erros++;


    mostrarStatus(
      "❌ Letra errada. Tentativas: " +
      erros +
      " / " +
      MAX_ERROS,
      "error"
    );


    if(
      erros >= MAX_ERROS
    ){

      perder();

    }

  }

}


/* =====================================================
   VERIFICAR VITÓRIA
===================================================== */

async function verificarVitoria(){

  const venceu =
    PALAVRA
      .split("")
      .every(
        letra =>
          letras.has(letra)
      );


  if(
    venceu
  ){

    await ganhar();

  }

}


/* =====================================================
   PROCURAR CADASTRO
===================================================== */

async function localizarCadastro(
  user
){

  /*
    -----------------------------------------------------
    1. PRIMEIRO: UID
    -----------------------------------------------------
  */

  let snapshot =
    await getDocs(

      query(
        collection(
          db,
          "admins"
        ),
        where(
          "uid",
          "==",
          user.uid
        )
      )

    );


  if(
    !snapshot.empty
  ){

    return snapshot.docs[0];

  }


  /*
    -----------------------------------------------------
    2. SEGUNDO: E-MAIL
    -----------------------------------------------------
  */

  if(
    user.email
  ){

    snapshot =
      await getDocs(

        query(
          collection(
            db,
            "admins"
          ),
          where(
            "email",
            "==",
            user.email
          )
        )

      );


    if(
      !snapshot.empty
    ){

      return snapshot.docs[0];

    }

  }


  /*
    -----------------------------------------------------
    3. NÃO EXISTE CADASTRO
    -----------------------------------------------------

    Criamos somente o cadastro básico do próprio
    usuário autenticado.

    Isso usa a mesma estrutura do index.html.
  */

  const caracteres =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


  let publicId =
    "";


  for(
    let i = 0;
    i < 7;
    i++
  ){

    publicId +=
      caracteres[
        Math.floor(
          Math.random() *
          caracteres.length
        )
      ];

  }


  const novoCadastro =
    await addDoc(

      collection(
        db,
        "admins"
      ),

      {

        uid:
          user.uid,

        nome:
          user.displayName ||
          "Usuário",

        email:
          user.email || "",

        publicId:
          publicId,

        idade:
          "",

        telefone:
          "",

        avatar:
          "🙂",

        vip:
          false,

        caixaBox:
          false,

        chances:
          0,

        moedas:
          0,

        chaves:
          0,

        creditos:
          0,

        criadoEm:
          new Date().toISOString()

      }

    );


  return novoCadastro;

}


/* =====================================================
   INICIAR PARTIDA
===================================================== */

async function iniciarPartida(){

  if(
    iniciandoPartida ||
    partidaId ||
    !usuario
  ){

    return;

  }


  iniciandoPartida =
    true;


  try{

    mostrarStatus(
      "🎟️ Verificando seu cadastro...",
      "info"
    );


    /*
      Localiza o documento correto.
    */

    const cadastro =
      await localizarCadastro(
        usuario
      );


    if(
      !cadastro
    ){

      throw new Error(
        "Não foi possível localizar seu cadastro."
      );

    }


    usuarioRef =
      cadastro.ref;


    dadosUsuario =
      cadastro.data();


    /*
      Garante valores numéricos.
    */

    const chances =
      Number(
        dadosUsuario.chances || 0
      );


    const moedas =
      Number(
        dadosUsuario.moedas || 0
      );


    /*
      Sem chance = não começa partida.
    */

    if(
      chances <= 0
    ){

      mostrarStatus(
        "🎟️ Você não possui chances para jogar.",
        "error"
      );


      bloquearTeclado();


      iniciandoPartida =
        false;


      return;

    }


    /*
      Cria ID da partida.
    */

    const novaPartida =
      doc(
        collection(
          db,
          "gameSessions"
        )
      );


    /*
      Tudo será feito em uma única operação.
    */

    const batch =
      writeBatch(db);


    /*
      Cria a sessão.
    */

    batch.set(
      novaPartida,
      {

        uid:
          usuario.uid,

        email:
          usuario.email || "",

        game:
          "forca",

        status:
          "ativa",

        rewardBase:
          MOEDAS_PARTIDA,

        rewardWin:
          MOEDAS_VITORIA,

        chanceConsumed:
          true,

        createdAt:
          serverTimestamp(),

        finalizadoEm:
          null

      }
    );


    /*
      Consome 1 chance e adiciona 30 moedas.
    */

    batch.update(
      usuarioRef,
      {

        chances:
          chances - 1,

        moedas:
          moedas + MOEDAS_PARTIDA,

        ultimaPartidaForcaId:
          novaPartida.id,

        ultimaPartidaForcaEm:
          serverTimestamp()

      }
    );


    /*
      Commit.
    */

    await batch.commit();


    /*
      Só chegamos aqui se o Firebase aceitou
      a operação inteira.
    */

    partidaId =
      novaPartida.id;


    dadosUsuario.chances =
      chances - 1;


    dadosUsuario.moedas =
      moedas + MOEDAS_PARTIDA;


    mostrarStatus(
      "🪙 +30 moedas recebidas! Boa sorte!",
      "success"
    );


    iniciandoPartida =
      false;

  }

  catch(error){

    console.error(
      "ERRO AO INICIAR FORCA:",
      error
    );


    iniciandoPartida =
      false;


    let mensagem =
      "⚠️ Não foi possível iniciar a partida.";


    if(
      error.code ===
      "permission-denied"
    ){

      mensagem =
        "⚠️ O Firebase recusou a gravação. As Rules precisam permitir a atualização das moedas, chances e da partida.";

    }
    else if(
      error.message
    ){

      mensagem =
        "⚠️ " +
        error.message;

    }


    mostrarStatus(
      mensagem,
      "error"
    );


    bloquearTeclado();

  }

}


/* =====================================================
   GANHAR
===================================================== */

async function ganhar(){

  if(
    partidaFinalizada ||
    !partidaId ||
    !usuarioRef ||
    !dadosUsuario
  ){

    return;

  }


  partidaFinalizada =
    true;


  bloquearTeclado();


  try{

    const saldoAtual =
      Number(
        dadosUsuario.moedas || 0
      );


    const novoSaldo =
      saldoAtual +
      MOEDAS_VITORIA;


    const batch =
      writeBatch(db);


    /*
      Atualiza a sessão.
    */

    const sessionRef =
      doc(
        db,
        "gameSessions",
        partidaId
      );


    batch.update(
      sessionRef,
      {

        status:
          "won",

        finalizadoEm:
          serverTimestamp()

      }
    );


    /*
      Adiciona +20 moedas.
    */

    batch.update(
      usuarioRef,
      {

        moedas:
          novoSaldo,

        ultimaPartidaForcaId:
          partidaId,

        ultimaPartidaForcaEm:
          serverTimestamp()

      }
    );


    await batch.commit();


    dadosUsuario.moedas =
      novoSaldo;


    mostrarStatus(
      "🎉 Palavra correta! +20 moedas extras!",
      "success"
    );


    setTimeout(
      () => {

        abrirModal(

          "🎉 VOCÊ ACERTOU!",

          "Parabéns! Você ganhou +20 moedas extras.",

          "CONTINUAR"

        );

      },
      1200
    );

  }

  catch(error){

    console.error(
      "ERRO AO REGISTRAR VITÓRIA:",
      error
    );


    /*
      Permite tentar novamente caso a escrita
      tenha sido recusada.
    */

    partidaFinalizada =
      false;


    mostrarStatus(

      error.code ===
      "permission-denied"

      ?

      "⚠️ A palavra foi acertada, mas o Firebase recusou o registro das 20 moedas. Precisamos ajustar a permissão de moedas."

      :

      "⚠️ A palavra foi acertada, mas não foi possível registrar as moedas. Tente novamente.",

      "error"

    );

  }

}


/* =====================================================
   PERDER
===================================================== */

async function perder(){

  if(
    partidaFinalizada ||
    !partidaId
  ){

    return;

  }


  partidaFinalizada =
    true;


  bloquearTeclado();


  try{

    const sessionRef =
      doc(
        db,
        "gameSessions",
        partidaId
      );


    const batch =
      writeBatch(db);


    batch.update(
      sessionRef,
      {

        status:
          "lost",

        finalizadoEm:
          serverTimestamp()

      }
    );


    await batch.commit();

  }

  catch(error){

    console.error(
      "ERRO AO FINALIZAR DERROTA:",
      error
    );

  }


  mostrarStatus(
    "❌ Você perdeu a partida.",
    "error"
  );


  setTimeout(
    () => {

      abrirModal(

        "😢 VOCÊ PERDEU",

        "A palavra era ELEFANTE. As 30 moedas da partida continuam com você.",

        "CONTINUAR"

      );

    },
    1200
  );

}


/* =====================================================
   MODAL
===================================================== */

function abrirModal(

  botao
){

  modalTitle.textContent =

  modalText.textContent =
    texto;


  modalButton.textContent =
    botao;


  modal.classList.add(
    "show"
  );

}

/* =====================================================
   AUTENTICAÇÃO
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    if(
      !user
    ){

      window.location.replace(
        "index.html"
      );

      return;

    }


    usuario =
      user;


    /*
      Não usamos o usuário do Authentication
      como banco de moedas.

      As moedas ficam no documento /admins.
    */

    try{

      mostrarStatus(
        "🎟️ Preparando sua partida...",
        "info"
      );


      await iniciarPartida();

    }

    catch(error){

      console.error(
        "ERRO AUTH/FORCA:",
        error
      );


      mostrarStatus(
        "⚠️ Erro ao carregar sua partida.",
        "error"
      );


      bloquearTeclado();

    }

  }
);
