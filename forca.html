<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Adam Games • Forca</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

  min-height:100vh;

  background:
    linear-gradient(
      180deg,
      #031b30,
      #062d4c
    );

  color:#fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}


.page{

  width:100%;

  max-width:650px;

  margin:auto;

  padding:
    16px
    14px
    50px;

}


/* =====================================================
   TOPO
===================================================== */

.top{

  display:flex;

  align-items:center;

  justify-content:space-between;

}


.back{

  width:45px;

  height:45px;

  border:0;

  border-radius:14px;

  background:#082b48;

  color:#fff;

  font-size:25px;

}


.top-title{

  text-align:center;

}


.top-title small{

  display:block;

  color:#62c8ff;

  font-size:10px;

  letter-spacing:2px;

}


.top-title strong{

  font-size:20px;

}


/* =====================================================
   PROGRESSO
===================================================== */

.progress-card{

  margin-top:15px;

  padding:16px;

  border-radius:20px;

  background:#082b48;

  border:
    1px solid
    rgba(255,255,255,.08);

}


.progress-header{

  display:flex;

  justify-content:space-between;

  font-size:13px;

  font-weight:900;

}


.progress-bar{

  height:11px;

  margin-top:10px;

  overflow:hidden;

  border-radius:20px;

  background:#163c57;

}


.progress-fill{

  width:0%;

  height:100%;

  background:
    linear-gradient(
      90deg,
      #19c968,
      #ffe000
    );

  transition:
    width .3s ease;

}


/* =====================================================
   IMAGEM
===================================================== */

.image-card{

  margin-top:16px;

  overflow:hidden;

  border-radius:22px;

  background:#082b48;

  border:
    1px solid
    rgba(255,255,255,.1);

}


.image-card img{

  width:100%;

  display:block;

  aspect-ratio:16 / 9;

  object-fit:cover;

}


/* =====================================================
   DICA
===================================================== */

.dica{

  margin-top:14px;

  padding:15px;

  border-radius:18px;

  text-align:center;

  background:#082b48;

}


.dica small{

  color:#65d2ff;

  font-weight:900;

}


.dica strong{

  display:block;

  margin-top:5px;

  font-size:17px;

}


/* =====================================================
   PALAVRA
===================================================== */

.word{

  margin-top:25px;

  text-align:center;

  font-size:
    clamp(
      25px,
      8vw,
      43px
    );

  font-weight:900;

  letter-spacing:
    clamp(
      5px,
      2vw,
      12px
    );

  color:#fff;

}


/* =====================================================
   TECLADO
===================================================== */

.keyboard{

  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  gap:7px;

  margin-top:25px;

}


.key{

  min-height:50px;

  border:0;

  border-radius:12px;

  background:
    linear-gradient(
      180deg,
      #159bd7,
      #0872a8
    );

  color:#fff;

  font-size:16px;

  font-weight:900;

  cursor:pointer;

}


.key:active{

  transform:scale(.95);

}


.key.correct{

  background:#168a57;

}


.key.wrong{

  background:#7c3151;

}


.key:disabled{

  opacity:.45;

  cursor:not-allowed;

}


/* =====================================================
   STATUS
===================================================== */

.status{

  margin-top:18px;

  padding:15px;

  border-radius:17px;

  text-align:center;

  font-weight:900;

  line-height:1.4;

}


.status.success{

  background:
    rgba(18,170,92,.18);

  border:
    1px solid
    rgba(18,220,120,.3);

  color:#7cffb1;

}


.status.error{

  background:
    rgba(220,50,70,.15);

  border:
    1px solid
    rgba(255,80,90,.3);

  color:#ff9aa4;

}


.status.info{

  background:
    rgba(50,150,220,.15);

  border:
    1px solid
    rgba(80,180,255,.25);

  color:#a9ddff;

}


/* =====================================================
   MODAL
===================================================== */

.modal{

  position:fixed;

  inset:0;

  z-index:100;

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:
    rgba(0,10,25,.85);

}


.modal.show{

  display:flex;

}


.modal-card{

  width:100%;

  max-width:380px;

  padding:28px 20px;

  border-radius:23px;

  background:#082b48;

  text-align:center;

}


.modal-card h2{

  font-size:25px;

}


.modal-card p{

  margin-top:10px;

  color:#b9d7e8;

  line-height:1.5;

}


.modal-card button{

  width:100%;

  height:48px;

  margin-top:20px;

  border:0;

  border-radius:13px;

  background:#17a95d;

  color:#fff;

  font-weight:900;

}

</style>

</head>


<body>


<div class="page">


  <div class="top">

    <button
      class="back"
      id="back">

      ←

    </button>


    <div class="top-title">

      <small>
        ADAM GAMES
      </small>

      <strong>
        FORCA
      </strong>

    </div>


    <div style="width:45px"></div>

  </div>


  <!-- =================================================
       PROGRESSO DA SEQUÊNCIA
  ================================================== -->

  <div class="progress-card">

    <div class="progress-header">

      <span>
        PROGRESSO DA SEQUÊNCIA
      </span>

      <span id="fase">
        1 / 7
      </span>

    </div>


    <div class="progress-bar">

      <div
        class="progress-fill"
        id="progress">

      </div>

    </div>

  </div>


  <!-- =================================================
       IMAGEM
  ================================================== -->

  <div class="image-card">

    <img
      src="./card_forca.png"
      alt="Forca">

  </div>


  <!-- =================================================
       DICA
  ================================================== -->

  <div class="dica">

    <small>
      💡 DICA
    </small>

    <strong id="dica">
      Animal de grande porte e tromba
    </strong>

  </div>


  <!-- =================================================
       PALAVRA
  ================================================== -->

  <div
    class="word"
    id="word">

  </div>


  <!-- =================================================
       TECLADO
  ================================================== -->

  <div
    class="keyboard"
    id="keyboard">

  </div>


  <!-- =================================================
       STATUS
  ================================================== -->

  <div
    class="status info"
    id="status">

    🎟️ Preparando sua partida...

  </div>


</div>


<!-- =====================================================
     MODAL
===================================================== -->

<div
  class="modal"
  id="modal">

  <div class="modal-card">

    <h2 id="modalTitle">
      Você perdeu
    </h2>

    <p id="modalText">
      A partida terminou.
    </p>

    <button
      id="modalButton">

      CONTINUAR

    </button>

  </div>

</div>


<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  getDoc,
  doc,
  runTransaction,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:
    "adam-games-21081.firebaseapp.com",

  projectId:
    "adam-games-21081",

  storageBucket:
    "adam-games-21081.firebasestorage.app",

  messagingSenderId:
    "1055528418738",

  appId:
    "1:1055528418738:web:5fafdf63424ba9744eb8ab"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================================
   ELEMENTOS
===================================================== */

const wordEl =
  document.getElementById("word");

const keyboardEl =
  document.getElementById("keyboard");

const statusEl =
  document.getElementById("status");

const progressEl =
  document.getElementById("progress");

const modal =
  document.getElementById("modal");

const modalTitle =
  document.getElementById("modalTitle");

const modalText =
  document.getElementById("modalText");

const modalButton =
  document.getElementById("modalButton");


/* =====================================================
   CONFIGURAÇÃO DA PARTIDA
===================================================== */

const PALAVRA =
  "ELEFANTE";


const DICA =
  "Animal de grande porte e tromba";


const MAX_ERROS =
  6;


const RECOMPENSA_INICIAL =
  30;


const RECOMPENSA_VITORIA =
  20;


/* =====================================================
   ESTADO
===================================================== */

let letras =
  new Set();


let erros =
  0;


let usuario =
  null;


let usuarioRef =
  null;


let partidaId =
  null;


let partidaFinalizada =
  false;


/* =====================================================
   PALAVRA
===================================================== */

function desenharPalavra(){

  wordEl.textContent =
    PALAVRA
      .split("")
      .map(
        letra =>
          letras.has(letra)
            ? letra
            : "_"
      )
      .join(" ");

}


/* =====================================================
   PROGRESSO
===================================================== */

function atualizarProgresso(){

  const acertos =
    PALAVRA
      .split("")
      .filter(
        letra =>
          letras.has(letra)
      )
      .length;


  const percentual =
    (
      acertos /
      PALAVRA.length
    ) * 100;


  progressEl.style.width =
    percentual + "%";

}


/* =====================================================
   TECLADO
===================================================== */

function criarTeclado(){

  const alfabeto =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ";


  keyboardEl.innerHTML =
    "";


  [...alfabeto].forEach(
    letra => {

      const botao =
        document.createElement(
          "button"
        );


      botao.className =
        "key";


      botao.type =
        "button";


      botao.textContent =
        letra;


      botao.addEventListener(
        "click",
        () => {

          escolherLetra(
            letra,
            botao
          );

        }
      );


      keyboardEl.appendChild(
        botao
      );

    }
  );

}


/* =====================================================
   ESCOLHER LETRA
===================================================== */

function escolherLetra(
  letra,
  botao
){

  if(
    partidaFinalizada ||
    letras.has(letra)
  ){

    return;

  }


  letras.add(letra);

  botao.disabled =
    true;


  if(
    PALAVRA.includes(letra)
  ){

    botao.classList.add(
      "correct"
    );


    statusEl.textContent =
      "✅ Boa! A letra está na palavra.";

    statusEl.className =
      "status success";


    desenharPalavra();

    atualizarProgresso();

    verificarVitoria();

  }

  else{

    botao.classList.add(
      "wrong"
    );


    erros++;


    statusEl.textContent =
      "❌ Letra errada. Tentativas: " +
      erros +
      " / " +
      MAX_ERROS;

    statusEl.className =
      "status error";


    if(
      erros >= MAX_ERROS
    ){

      perder();

    }

  }

}


/* =====================================================
   VITÓRIA
===================================================== */

async function verificarVitoria(){

  const venceu =
    PALAVRA
      .split("")
      .every(
        letra =>
          letras.has(letra)
      );


  if(
    venceu
  ){

    await ganhar();

  }

}


/* =====================================================
   LOCALIZAR CADASTRO CORRETO
===================================================== */

async function localizarCadastro(
  user
){

  /*
     PRIMEIRA TENTATIVA:

     O documento possui o próprio UID.
  */

  const refDireta =
    doc(
      db,
      "admins",
      user.uid
    );


  const direto =
    await getDoc(
      refDireta
    );


  if(
    direto.exists()
  ){

    const dados =
      direto.data();


    /*
       Se existir campo uid,
       ele obrigatoriamente precisa
       pertencer à conta autenticada.
    */

    if(
      dados.uid &&
      dados.uid !== user.uid
    ){

      return null;

    }


    return direto;

  }


  /*
     SEGUNDA TENTATIVA:

     procura exatamente pelo UID.
  */

  const resultadoUid =
    await getDocs(
      query(
        collection(
          db,
          "admins"
        ),
        where(
          "uid",
          "==",
          user.uid
        )
      )
    );


  if(
    !resultadoUid.empty
  ){

    return resultadoUid.docs[0];

  }


  /*
     TERCEIRA TENTATIVA:

     procura pelo e-mail.

     MAS só aceita se o documento:
     - tiver o mesmo e-mail
     - e, se tiver uid, for o mesmo UID.
  */

  if(
    user.email
  ){

    const resultadoEmail =
      await getDocs(
        query(
          collection(
            db,
            "admins"
          ),
          where(
            "email",
            "==",
            user.email
          )
        )
      );


    for(
      const documento
      of resultadoEmail.docs
    ){

      const dados =
        documento.data();


      if(
        !dados.uid ||
        dados.uid === user.uid
      ){

        return documento;

      }

    }

  }


  return null;

}


/* =====================================================
   INICIAR PARTIDA
===================================================== */

async function iniciarPartida(){

  if(
    !usuarioRef
  ){

    return;

  }


  try{

    const novaPartida =
      doc(
        collection(
          db,
          "gameSessions"
        )
      );


    let saldoFinal =
      0;


    let chancesFinais =
      0;


    await runTransaction(
      db,
      async transaction => {

        /*
           SEMPRE LÊ PRIMEIRO.
        */

        const cadastroSnapshot =
          await transaction.get(
            usuarioRef
          );


        if(
          !cadastroSnapshot.exists()
        ){

          throw new Error(
            "Cadastro não encontrado."
          );

        }


        const dados =
          cadastroSnapshot.data();


        const chances =
          Number(
            dados.chances || 0
          );


        const moedas =
          Number(
            dados.moedas || 0
          );


        if(
          chances <= 0
        ){

          throw new Error(
            "Você não possui chances para jogar."
          );

        }


        saldoFinal =
          moedas +
          RECOMPENSA_INICIAL;


        chancesFinais =
          chances -
          1;


        /*
           CRIA SESSÃO
        */

        transaction.set(
          novaPartida,
          {

            uid:
              usuario.uid,

            game:
              "forca",

            status:
              "ativa",

            rewardBase:
              RECOMPENSA_INICIAL,

            rewardWin:
              RECOMPENSA_VITORIA,

            chanceConsumed:
              true,

            createdAt:
              serverTimestamp(),

            finalizadoEm:
              null

          }
        );


        /*
           ATUALIZA USUÁRIO

           -1 chance
           +30 moedas
        */

        transaction.update(
          usuarioRef,
          {

            chances:
              chancesFinais,

            moedas:
              saldoFinal,

            ultimaPartidaForcaId:
              novaPartida.id,

            ultimaPartidaForcaEm:
              serverTimestamp()

          }
        );

      }
    );


    partidaId =
      novaPartida.id;


    statusEl.textContent =
      "🪙 +30 moedas recebidas! Boa sorte!";


    statusEl.className =
      "status success";


  }

  catch(error){

    console.error(
      "ERRO AO INICIAR PARTIDA:",
      error
    );


    if(
      error.code ===
      "permission-denied"
    ){

      statusEl.textContent =
        "⚠️ O Firebase bloqueou o início da partida. Verifique as Rules.";

    }

    else{

      statusEl.textContent =
        "⚠️ " +
        (
          error.message ||
          "Não foi possível iniciar a partida."
        );

    }


    statusEl.className =
      "status error";


    bloquearTeclado();

  }

}


/* =====================================================
   GANHAR
===================================================== */

async function ganhar(){

  if(
    partidaFinalizada ||
    !partidaId ||
    !usuarioRef
  ){

    return;

  }


  partidaFinalizada =
    true;


  try{

    await runTransaction(
      db,
      async transaction => {

        /*
           TODAS AS LEITURAS PRIMEIRO
        */

        const cadastroSnapshot =
          await transaction.get(
            usuarioRef
          );


        const sessionRef =
          doc(
            db,
            "gameSessions",
            partidaId
          );


        const sessionSnapshot =
          await transaction.get(
            sessionRef
          );


        if(
          !cadastroSnapshot.exists()
        ){

          throw new Error(
            "Cadastro do jogador não encontrado."
          );

        }


        if(
          !sessionSnapshot.exists()
        ){

          throw new Error(
            "Partida não encontrada."
          );

        }


        const dados =
          cadastroSnapshot.data();


        const session =
          sessionSnapshot.data();


        if(
          session.uid !==
          usuario.uid
        ){

          throw new Error(
            "Esta partida pertence a outro usuário."
          );

        }


        if(
          session.status !==
          "ativa"
        ){

          throw new Error(
            "Esta partida já foi finalizada."
          );

        }


        const moedas =
          Number(
            dados.moedas || 0
          );


        /*
           FINALIZA PARTIDA
        */

        transaction.update(
          sessionRef,
          {

            status:
              "won",

            finalizadoEm:
              serverTimestamp()

          }
        );


        /*
           +20 MOEDAS
        */

        transaction.update(
          usuarioRef,
          {

            moedas:
              moedas +
              RECOMPENSA_VITORIA

          }
        );

      }
    );


    statusEl.textContent =
      "🎉 Palavra correta! +20 moedas extras!";


    statusEl.className =
      "status success";


    bloquearTeclado();


    setTimeout(
      () => {

        abrirModal(
          "🎉 VOCÊ ACERTOU!",
          "Parabéns! Você ganhou +20 moedas extras.",
          "CONTINUAR"
        );

      },
      1500
    );

  }

  catch(error){

    console.error(
      "ERRO AO REGISTRAR VITÓRIA:",
      error
    );


    partidaFinalizada =
      false;


    statusEl.textContent =
      "⚠️ Não foi possível registrar as moedas. " +
      (
        error.message ||
        "Tente novamente."
      );


    statusEl.className =
      "status error";

  }

}


/* =====================================================
   PERDER
===================================================== */

async function perder(){

  if(
    partidaFinalizada
  ){

    return;

  }


  partidaFinalizada =
    true;


  bloquearTeclado();


  try{

    const sessionRef =
      doc(
        db,
        "gameSessions",
        partidaId
      );


    await runTransaction(
      db,
      async transaction => {

        const sessionSnapshot =
          await transaction.get(
            sessionRef
          );


        if(
          !sessionSnapshot.exists()
        ){

          return;

        }


        const session =
          sessionSnapshot.data();


        if(
          session.status !==
          "ativa"
        ){

          return;

        }


        transaction.update(
          sessionRef,
          {

            status:
              "perdida",

            finalizadoEm:
              serverTimestamp()

          }

        );

      }
    );

  }

  catch(error){

    console.error(
      "ERRO AO FINALIZAR DERROTA:",
      error
    );

  }


  statusEl.textContent =
    "❌ Você perdeu a partida.";

  statusEl.className =
    "status error";


  setTimeout(
    () => {

      abrirModal(
        "😢 VOCÊ PERDEU",
        "A palavra era ELEFANTE. As 30 moedas recebidas no início continuam com você.",
        "CONTINUAR"
      );

    },
    1500
  );

}


/* =====================================================
   BLOQUEAR TECLADO
===================================================== */

function bloquearTeclado(){

  keyboardEl
    .querySelectorAll("button")
    .forEach(
      button => {

        button.disabled =
          true;

      }
    );

}


/* =====================================================
   MODAL
===================================================== */

function abrirModal(
  titulo,
  texto,
  botao
){

  modalTitle.textContent =
    titulo;

  modalText.textContent =
    texto;

  modalButton.textContent =
    botao;

  modal.classList.add(
    "show"
  );

}


/* =====================================================
   BOTÃO MODAL
===================================================== */

modalButton.addEventListener(
  "click",
  () => {

    window.location.href =
      "jogos.html";

  }
);


/* =====================================================
   VOLTAR
===================================================== */

document
  .getElementById("back")
  .addEventListener(
    "click",
    () => {

      window.location.href =
        "jogos.html";

    }
  );


/* =====================================================
   AUTENTICAÇÃO
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    if(
      !user
    ){

      window.location.replace(
        "index.html"
      );

      return;

    }


    usuario =
      user;


    console.log(
      "USUÁRIO FIREBASE AUTENTICADO:",
      {
        uid: user.uid,
        email: user.email
      }
    );


    try{

      const cadastro =
        await localizarCadastro(
          user
        );


      if(
        !cadastro
      ){

        statusEl.textContent =
          "⚠️ Cadastro desta conta não foi encontrado.";

        statusEl.className =
          "status error";


        bloquearTeclado();


        console.error(
          "NENHUM CADASTRO /admins ENCONTRADO PARA:",
          user.uid,
          user.email
        );


        return;

      }


      usuarioRef =
        cadastro.ref;


      const dados =
        cadastro.data();


      /*
         SEGURANÇA EXTRA:

         Se houver UID no cadastro,
         ele precisa ser o usuário atual.
      */

      if(
        dados.uid &&
        dados.uid !== user.uid
      ){

        statusEl.textContent =
          "⚠️ Este cadastro pertence a outra conta.";

        statusEl.className =
          "status error";

        bloquearTeclado();

        return;

      }


      /*
         Mostra o nome correto no console,
         sem usar cadastro de outra pessoa.
      */

      console.log(
        "CADASTRO CORRETO ENCONTRADO:",
        cadastro.id,
        dados
      );


      const chances =
        Number(
          dados.chances || 0
        );


      if(
        chances <= 0
      ){

        statusEl.textContent =
          "🎟️ Você não possui chances para jogar.";

        statusEl.className =
          "status error";

        bloquearTeclado();

        return;

      }


      await iniciarPartida();

    }

    catch(error){

      console.error(
        "ERRO AO CARREGAR FORCA:",
        error
      );


      statusEl.textContent =
        "⚠️ " +
        (
          error.message ||
          "Erro ao carregar sua partida."
        );


      statusEl.className =
        "status error";


      bloquearTeclado();

    }

  }
);

   INICIALIZAÇÃO VISUAL
===================================================== */

document.getElementById(
  "dica"
).textContent =
  DICA;


document.getElementById(
  "fase"
).textContent =
  "1 / 7";


desenharPalavra();

criarTeclado();

atualizarProgresso();

</script>
