/* =====================================

import {

}
from

/* =====================================

import {

import {

}
from

/* =====================================
   CONFIGURAÇÃO
===================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:
    "adam-games-21081.firebaseapp.com",

  projectId:
    "adam-games-21081",

  storageBucket:
    "adam-games-21081.firebasestorage.app",

  messagingSenderId:
    "1055528418738",

  appId:
    "1:1055528418738:web:5fafdf63424ba9744eb8ab",

  measurementId:
    "G-KVFSF864GE"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================
   ELEMENTOS
===================================== */

const loginBox =
  document.getElementById(
    "loginBox"
  );


const registerBox =
  document.getElementById(
    "registerBox"
  );


const loginForm =
  document.getElementById(
    "loginForm"
  );


const registerForm =
  document.getElementById(
    "registerForm"
  );


const email =
  document.getElementById(
    "email"
  );


const password =
  document.getElementById(
    "password"
  );


const message =
  document.getElementById(
    "message"
  );


const registerMessage =
  document.getElementById(
    "registerMessage"
  );


/* =====================================
   MENSAGEM LOGIN
===================================== */

function mostrarMensagem(
  texto,
  tipo="error"
){

  message.textContent =
    texto;

  message.className =
    "message " + tipo;

}


/* =====================================
   MENSAGEM CADASTRO
===================================== */

function mostrarMensagemCadastro(
  texto,
  tipo="error"
){

  registerMessage.textContent =
    texto;

  registerMessage.className =
    "message " + tipo;

}


/* =====================================
   ID ADAM GAMES
   6 CARACTERES
   MAIÚSCULAS + NÚMEROS
===================================== */

function gerarPublicId(){

  const letras =
    "ABCDEFGHJKLMNPQRSTUVWXYZ";

  const numeros =
    "23456789";

  const todos =
    letras + numeros;

  let resultado =
    "";

  /*
  Garante que sempre existam
  letras e números.
  */

  resultado +=
    letras[
      Math.floor(
        Math.random() *
        letras.length
      )
    ];

  resultado +=
    letras[
      Math.floor(
        Math.random() *
        letras.length
      )
    ];

  resultado +=
    numeros[
      Math.floor(
        Math.random() *
        numeros.length
      )
    ];

  resultado +=
    numeros[
      Math.floor(
        Math.random() *
        numeros.length
      )
    ];

  /*
  Completa até 6 caracteres.
  */

  while(
    resultado.length < 6
  ){

    resultado +=
      todos[
        Math.floor(
          Math.random() *
          todos.length
        )
      ];

  }

  /*
  Embaralha para não ficar
  sempre no mesmo padrão.
  */

  return resultado
    .split("")
    .sort(
      () =>
        Math.random() - 0.5
    )
    .join("");

}


/* =====================================
   SENHA
===================================== */

document
.getElementById(
  "showPassword"
)
.addEventListener(
  "click",
  () => {

    if(
      password.type ===
      "password"
    ){

      password.type =
        "text";

      document.getElementById(
        "showPassword"
      ).textContent =
        "🙈";

    }

    else{

      password.type =
        "password";

      document.getElementById(
        "showPassword"
      ).textContent =
        "👁️";

    }

  }
);


/* =====================================
   CADASTRO
===================================== */

document
.getElementById(
  "showRegister"
)
.addEventListener(
  "click",
  () => {

    loginBox.classList.add(
      "hidden"
    );

    registerBox.classList.add(
      "active"
    );

    window.scrollTo(
      0,
      0
    );

  }
);


/* =====================================
   VOLTAR LOGIN
===================================== */

document
.getElementById(
  "backLogin"
)
.addEventListener(
  "click",
  () => {

    registerBox.classList.remove(
      "active"
    );

    loginBox.classList.remove(
      "hidden"
    );

    registerMessage.textContent =
      "";

    registerMessage.className =
      "message";

  }
);


/* =====================================
   LOGIN E-MAIL
===================================== */

loginForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const emailValue =
      email.value.trim();


    const passwordValue =
      password.value;


    if(
      !emailValue ||
      !passwordValue
    ){

      mostrarMensagem(
        "Preencha seu e-mail e sua senha."
      );

      return;

    }


    const button =
      document.getElementById(
        "loginButton"
      );


    button.disabled =
      true;

    button.textContent =
      "ENTRANDO...";


    try{

      await signInWithEmailAndPassword(
        auth,
        emailValue,
        passwordValue
      );


      mostrarMensagem(
        "Login realizado! Entrando...",
        "success"
      );


      setTimeout(
        () => {

          window.location.replace(
            "painel.html"
          );

        },
        400
      );


    }

    catch(error){

      console.error(
        "Erro login:",
        error
      );


      let texto =
        "Não foi possível entrar.";


      if(
        error.code ===
        "auth/invalid-credential"
      ){

        texto =
          "E-mail ou senha incorretos.";

      }

      else if(
        error.code ===
        "auth/invalid-email"
      ){

        texto =
          "Digite um e-mail válido.";

      }

      else if(
        error.code ===
        "auth/too-many-requests"
      ){

        texto =
          "Muitas tentativas. Aguarde alguns minutos.";

      }


      mostrarMensagem(
        texto
      );


      button.disabled =
        false;

      button.textContent =
        "ENTRAR";

    }

  }
);


/* =====================================
   CRIAR CONTA COM E-MAIL
===================================== */

registerForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const nome =
      document
      .getElementById(
        "registerName"
      )
      .value
      .trim();


    const emailNovo =
      document
      .getElementById(
        "registerEmail"
      )
      .value
      .trim()
      .toLowerCase();


    const senha =
      document
      .getElementById(
        "registerPassword"
      )
      .value;


    const senha2 =
      document
      .getElementById(
        "registerPassword2"
      )
      .value;


    if(
      !nome
    ){

      mostrarMensagemCadastro(
        "Digite seu nome."
      );

      return;

    }


    if(
      senha !== senha2
    ){

      mostrarMensagemCadastro(
        "As senhas não são iguais."
      );

      return;

    }


    const button =
      document.getElementById(
        "registerButton"
      );


    button.disabled =
      true;

    button.textContent =
      "CRIANDO...";


    try{

      const resultado =
        await createUserWithEmailAndPassword(
          auth,
          emailNovo,
          senha
        );


      const usuario =
        resultado.user;


      const publicId =
        gerarPublicId();


      await addDoc(
        collection(
          db,
          "admins"
        ),
        {

          uid:
            usuario.uid,

          nome:
            nome,

          email:
            emailNovo,

          publicId:
            publicId,

          idade:
            "",

          telefone:
            "",

          avatar:
            "🙂",

          vip:
            false,

          caixaBox:
            false,

          chances:
            0,

          moedas:
            0,

          chaves:
            0,

          creditos:
            0,

          girosRoleta:
            0,

          criadoEm:
            new Date().toISOString()

        }
      );


      mostrarMensagemCadastro(
        "Conta criada com sucesso! Seu ID Adam Games é " +
        publicId +
        ". Entrando...",
        "success"
      );


      setTimeout(
        () => {

          window.location.replace(
            "painel.html"
          );

        },
        900
      );


    }

    catch(error){

      console.error(
        "Erro cadastro:",
        error
      );


      let texto =
        "Não foi possível criar a conta.";


      if(
        error.code ===
        "auth/email-already-in-use"
      ){

        texto =
          "Este e-mail já possui uma conta.";

      }

      else if(
        error.code ===
        "auth/weak-password"
      ){

        texto =
          "A senha precisa ter pelo menos 6 caracteres.";

      }

      else if(
        error.code ===
        "auth/invalid-email"
      ){

        texto =
          "Digite um e-mail válido.";

      }


      mostrarMensagemCadastro(
        texto
      );


      button.disabled =
        false;

      button.textContent =
        "CRIAR CONTA";

    }

  }
);


/* =====================================
   GOOGLE
===================================== */

document
.getElementById(
  "googleLogin"
)
.addEventListener(
  "click",
  async () => {

    const button =
      document.getElementById(
        "googleLogin"
      );


    button.disabled =
      true;

    button.innerHTML =
      "🔄 Entrando com Google...";


    try{

      const provider =
        new GoogleAuthProvider();


      provider.setCustomParameters({
        prompt:
          "select_account"
      });


      const resultado =
        await signInWithPopup(
          auth,
          provider
        );


      const usuario =
        resultado.user;


      /*
      Procura primeiro pelo UID.
      */

      let busca =
        await getDocs(
          query(
            collection(
              db,
              "admins"
            ),
            where(
              "uid",
              "==",
              usuario.uid
            )
          )
        );


      /*
      Se não encontrou pelo UID,
      procura pelo e-mail.

      Isso também evita criar
      uma segunda conta para um
      e-mail que já esteja cadastrado.
      */

      if(
        busca.empty &&
        usuario.email
      ){

        busca =
          await getDocs(
            query(
              collection(
                db,
                "admins"
              ),
              where(
                "email",
                "==",
                usuario.email
                  .trim()
                  .toLowerCase()
              )
            )
          );

      }


      /*
      PRIMEIRO LOGIN GOOGLE
      */

      if(
        busca.empty
      ){

        const publicId =
          gerarPublicId();


        await addDoc(
          collection(
            db,
            "admins"
          ),
          {

            uid:
              usuario.uid,

            nome:
              usuario.displayName ||
              "Usuário",

            email:
              (
                usuario.email ||
                ""
              )
              .trim()
              .toLowerCase(),

            publicId:
              publicId,

            idade:
              "",

            telefone:
              "",

            avatar:
              "🙂",

            vip:
              false,

            caixaBox:
              false,

            chances:
              0,

            moedas:
              0,

            chaves:
              0,

            creditos:
              0,

            girosRoleta:
              0,

            criadoEm:
              new Date().toISOString()

          }
        );


        console.log(
          "Cadastro Google criado:",
          publicId
        );


        mostrarMensagem(
          "Conta criada com Google! Seu ID Adam Games é " +
          publicId +
          ". Entrando...",
          "success"
        );

      }

      else{

        /*
        Usuário Google já cadastrado.
        */

        const dados =
          busca.docs[0].data();


        mostrarMensagem(
          "Login com Google realizado! Entrando...",
          "success"
        );


        console.log(
          "Usuário Google existente:",
          dados.publicId
        );

      }


      setTimeout(
        () => {

          window.location.replace(
            "painel.html"
          );

        },
        700
      );

    }

    catch(error){

      console.error(
        "ERRO GOOGLE:",
        error
      );


      let texto =
        "Não foi possível entrar com Google.";


      if(
        error.code ===
        "auth/popup-closed-by-user"
      ){

        texto =
          "A janela do Google foi fechada.";

      }

      else if(
        error.code ===
        "auth/popup-blocked"
      ){

        texto =
          "O navegador bloqueou a janela do Google.";

      }

      else if(
        error.code ===
        "auth/unauthorized-domain"
      ){

        texto =
          "Este domínio não está autorizado no Firebase Authentication.";

      }

      else if(
        error.code ===
        "auth/operation-not-allowed"
      ){

        texto =
          "O login com Google não está ativado no Firebase.";

      }

      else if(
        error.code ===
        "auth/account-exists-with-different-credential"
      ){

        texto =
          "Este e-mail já possui uma conta usando outro método de login.";

      }

      else if(
        error.code ===
        "permission-denied"
      ){

        texto =
          "O Firebase bloqueou a criação do cadastro. Verifique as Rules do Firestore.";

      }


      mostrarMensagem(
        texto
      );


      button.disabled =
        false;


      button.innerHTML =
        `
        <span class="social-icon">
          🌈
        </span>
        Google
        `;

    }

  }
);

===================================== */

document
.getElementById(
  "forgotPassword"
)
.addEventListener(
  "click",
  async () => {

    const emailValue =
      email.value.trim();


    if(
      !emailValue
    ){

      mostrarMensagem(
        "Digite seu e-mail primeiro."
      );

      email.focus();

      return;

    }


    try{

      await sendPasswordResetEmail(
        auth,
        emailValue
      );


      mostrarMensagem(
        "E-mail de recuperação enviado!",
        "success"
      );

    }

    catch(error){

      console.error(
        "Erro recuperação:",
        error
      );


      mostrarMensagem(
        "Não foi possível enviar o e-mail de recuperação."
      );

    }

  }
);

    "adamWhatsAppMenu"

  () => {

      "active"
    );

  }
);


document
.getElementById(
  "adamWhatsAppClose"
)
.addEventListener(
  "click",
  () => {

    whatsappMenu.classList.remove(
      "active"
    );

  }
);


function abrirWhatsApp(
  mensagem
){

  const url =
    "https://wa.me/5531987350267?text=" +
    encodeURIComponent(
      mensagem
    );


  window.open(
    url,
    "_blank"
  );

}
