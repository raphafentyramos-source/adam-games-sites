<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Adam Games • Login</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{

  min-height:100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:#fff;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:25px 15px;

  overflow-x:hidden;

  background:

    radial-gradient(
      circle at 15% 10%,
      rgba(66,170,255,.95) 0%,
      rgba(66,170,255,.35) 18%,
      transparent 38%
    ),

    radial-gradient(
      circle at 90% 85%,
      rgba(0,130,255,.35),
      transparent 35%
    ),

    linear-gradient(
      145deg,
      #087ee1 0%,
      #0755a8 35%,
      #061d43 78%,
      #020d20 100%
    );
}


/* =====================================
   CONTAINER
===================================== */

.login-container{

  width:100%;

  max-width:440px;

  margin:auto;
}


/* =====================================
   LOGO
===================================== */

.logo{

  text-align:center;

  margin-bottom:25px;
}


.logo-icon{

  width:100px;

  height:100px;

  margin:auto;

  border-radius:28px;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:58px;

  background:

    linear-gradient(
      145deg,
      #218fff,
      #0754a7
    );

  border:
    3px solid
    rgba(255,255,255,.16);

  box-shadow:

    0 20px 50px
    rgba(0,0,0,.30);
}


.logo h1{

  margin-top:15px;

  font-size:35px;

  font-weight:900;

  line-height:.95;

  letter-spacing:-1px;
}


.logo h1 span{

  color:#ffd52b;
}


.logo p{

  margin-top:10px;

  color:#c5def5;

  font-size:15px;

  font-weight:600;
}


/* =====================================
   CARD
===================================== */

.login-card{

  width:100%;

  padding:28px;

  border-radius:30px;

  background:

    linear-gradient(
      145deg,
      rgba(4,55,110,.97),
      rgba(2,25,56,.98)
    );

  border:
    1px solid
    rgba(255,255,255,.14);

  box-shadow:

    0 25px 60px
    rgba(0,0,0,.38);
}


.login-card h2{

  text-align:center;

  font-size:27px;

  margin-bottom:8px;
}


.subtitle{

  text-align:center;

  color:#a9c7e4;

  font-size:14px;

  margin-bottom:25px;
}


/* =====================================
   MENSAGEM
===================================== */

.message{

  display:none;

  margin-bottom:18px;

  padding:13px;

  border-radius:13px;

  text-align:center;

  font-size:13px;

  font-weight:bold;
}


.message.error{

  display:block;

  background:
    rgba(255,50,70,.15);

  border:
    1px solid
    rgba(255,70,90,.35);

  color:#ff9ba7;
}


.message.success{

  display:block;

  background:
    rgba(50,255,140,.12);

  border:
    1px solid
    rgba(50,255,140,.3);

  color:#72ffae;
}


/* =====================================
   CAMPOS
===================================== */

label{

  display:block;

  margin-bottom:7px;

  font-size:13px;

  font-weight:bold;

  color:#cce3f8;
}


.input{

  width:100%;

  height:54px;

  border:
    1px solid
    rgba(255,255,255,.13);

  border-radius:15px;

  background:
    rgba(0,0,0,.22);

  color:white;

  padding:
    0 16px;

  font-size:16px;

  outline:none;

  margin-bottom:17px;
}


.input::placeholder{

  color:#8fa8c0;
}


.input:focus{

  border-color:#27a1ff;

  box-shadow:
    0 0 0 3px
    rgba(39,161,255,.12);
}


/* =====================================
   SENHA
===================================== */

.password-wrap{

  position:relative;
}


.password-wrap .input{

  padding-right:55px;
}


.show-password{

  position:absolute;

  right:8px;

  top:0;

  width:45px;

  height:54px;

  border:0;

  background:transparent;

  color:#9fc4e5;

  font-size:21px;

  cursor:pointer;
}


/* =====================================
   BOTÃO LOGIN
===================================== */

.login-button{

  width:100%;

  height:55px;

  border:0;

  border-radius:16px;

  background:

    linear-gradient(
      135deg,
      #22a2ff,
      #0069db
    );

  color:white;

  font-size:16px;

  font-weight:900;

  cursor:pointer;

  box-shadow:

    0 10px 25px
    rgba(0,105,219,.3);
}


.login-button:disabled{

  opacity:.6;

  cursor:not-allowed;
}


/* =====================================
   LINKS
===================================== */

.forgot{

  display:block;

  text-align:center;

  margin-top:18px;

  color:#65bdff;

  font-size:13px;

  text-decoration:none;

  cursor:pointer;
}


.create-account{

  display:block;

  text-align:center;

  margin-top:18px;

  color:#ffd52b;

  font-size:14px;

  font-weight:bold;

  text-decoration:none;

  cursor:pointer;
}


/* =====================================
   DIVISOR
===================================== */

.divider{

  display:flex;

  align-items:center;

  gap:12px;

  margin:25px 0 18px;

  color:#a9c7e4;

  font-size:13px;

  white-space:nowrap;
}


.divider::before,
.divider::after{

  content:"";

  height:1px;

  flex:1;

  background:
    rgba(255,255,255,.15);
}


/* =====================================
   LOGIN SOCIAL
===================================== */

.social-buttons{

  display:flex;

  flex-direction:column;

  gap:10px;
}


.social-button{

  width:100%;

  height:52px;

  border:0;

  border-radius:15px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:10px;

  font-size:15px;

  font-weight:bold;

  cursor:pointer;
}


.google{

  background:#fff;

  color:#202124;
}


.facebook{

  background:#1877f2;

  color:#fff;
}


.apple{

  background:#000;

  color:#fff;
}


.social-icon{

  font-size:19px;

  width:25px;

  text-align:center;
}


/* =====================================
   CADASTRO
===================================== */

.register-box{

  display:none;
}


.register-box.active{

  display:block;
}


.login-box.hidden{

  display:none;
}


.back-login{

  display:block;

  text-align:center;

  margin-top:18px;

  color:#65bdff;

  font-size:13px;

  cursor:pointer;
}


/* =====================================
   FOOTER
===================================== */

.footer{

  text-align:center;

  margin-top:22px;

  color:#9ab9d5;

  font-size:12px;
}


/* =====================================
   MOBILE
===================================== */

@media(max-width:480px){

  body{

    padding:
      18px
      12px;
  }


  .logo-icon{

    width:88px;

    height:88px;

    font-size:50px;
  }


  .logo h1{

    font-size:31px;
  }


  .login-card{

    padding:23px 18px;

    border-radius:25px;
  }


  .login-card h2{

    font-size:24px;
  }

}

</style>

</head>


<body>


<div class="login-container">


  <!-- LOGO -->

  <div class="logo">

    <div class="logo-icon">
      👑
    </div>

    <h1>
      ADAM <span>GAMES</span>
    </h1>

    <p>
      Seu mundo começa aqui!
    </p>

  </div>


  <!-- =====================================
       LOGIN
  ====================================== -->

  <div
    class="login-card login-box"
    id="loginBox"
  >

    <h2>
      Bem-vindo de volta! 👋
    </h2>

    <div class="subtitle">
      Entre na sua conta para continuar
    </div>


    <div
      id="message"
      class="message"
    ></div>


    <form id="loginForm">


      <label for="email">
        E-mail
      </label>


      <input
        id="email"
        class="input"
        type="email"
        placeholder="seu@email.com"
        autocomplete="email"
        required
      >


      <label for="password">
        Senha
      </label>


      <div class="password-wrap">

        <input
          id="password"
          class="input"
          type="password"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          required
        >


        <button
          type="button"
          class="show-password"
          id="showPassword"
        >
          👁️
        </button>

      </div>


      <button
        type="submit"
        class="login-button"
        id="loginButton"
      >
        ENTRAR
      </button>


    </form>


    <a
      class="forgot"
      id="forgotPassword"
    >
      Esqueci minha senha
    </a>


    <div class="divider">
      ou continue com
    </div>


    <div class="social-buttons">


      <button
        type="button"
        class="social-button google"
        id="googleLogin"
      >

        <span class="social-icon">
          🌈
        </span>

        Google

      </button>


      <button
        type="button"
        class="social-button facebook"
        id="facebookLogin"
      >

        <span class="social-icon">
          f
        </span>

        Facebook

      </button>


      <button
        type="button"
        class="social-button apple"
        id="appleLogin"
      >

        <span class="social-icon">
          
        </span>

        Apple

      </button>


    </div>


    <a
      class="create-account"
      id="showRegister"
    >
      ✨ Criar minha conta
    </a>


  </div>


  <!-- =====================================
       CADASTRO
  ====================================== -->

  <div
    class="login-card register-box"
    id="registerBox"
  >

    <h2>
      Criar minha conta ✨
    </h2>

    <div class="subtitle">
      Faça seu cadastro no Adam Games
    </div>


    <div
      id="registerMessage"
      class="message"
    ></div>


    <form id="registerForm">


      <label for="registerName">
        Nome
      </label>


      <input
        id="registerName"
        class="input"
        type="text"
        placeholder="Seu nome"
        required
      >


      <label for="registerEmail">
        E-mail
      </label>


      <input
        id="registerEmail"
        class="input"
        type="email"
        placeholder="seu@email.com"
        required
      >


      <label for="registerPassword">
        Senha
      </label>


      <input
        id="registerPassword"
        class="input"
        type="password"
        placeholder="Crie uma senha"
        minlength="6"
        required
      >


      <label for="registerPassword2">
        Confirmar senha
      </label>


      <input
        id="registerPassword2"
        class="input"
        type="password"
        placeholder="Digite a senha novamente"
        minlength="6"
        required
      >


      <button
        type="submit"
        class="login-button"
        id="registerButton"
      >
        CRIAR CONTA
      </button>


    </form>


    <a
      class="back-login"
      id="backLogin"
    >
      ← Já tenho uma conta
    </a>


  </div>


  <div class="footer">

    © 2026 Adam Games

  </div>


</div>


<script type="module">


/* =====================================
   FIREBASE
===================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  sendPasswordResetEmail,
  GoogleAuthProvider,
  FacebookAuthProvider,
  OAuthProvider,
  signInWithPopup
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================
   CONFIGURAÇÃO
===================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:
    "adam-games-21081.firebaseapp.com",

  projectId:
    "adam-games-21081",

  storageBucket:
    "adam-games-21081.firebasestorage.app",

  messagingSenderId:
    "1055528418738",

  appId:
    "1:1055528418738:web:5fafdf63424ba9744eb8ab",

  measurementId:
    "G-KVFSF864GE"

};


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================
   ADMINISTRADOR
===================================== */

const ADMIN_EMAIL =
  "raphafentyramos@gmail.com";


/* =====================================
   CONTROLE DE REDIRECIONAMENTO
===================================== */

let redirecionando = false;


/* =====================================
   FUNÇÃO PRINCIPAL
===================================== */

function direcionarUsuario(usuario){

  if(
    !usuario ||
    redirecionando
  ){

    return;

  }


  const emailUsuario =
    String(
      usuario.email || ""
    )
    .trim()
    .toLowerCase();


  console.log(
    "E-mail autenticado:",
    emailUsuario
  );


  redirecionando = true;


  /*
   * ADMIN
   *
   * IMPORTANTE:
   * admin.html está no mesmo diretório
   * do index.html.
   */

  if(
    emailUsuario ===
    ADMIN_EMAIL.toLowerCase()
  ){

    console.log(
      "ACESSO ADMINISTRADOR"
    );


    window.location.assign(
      "./admin.html"
    );


    return;

  }


  /*
   * USUÁRIO NORMAL
   */

  console.log(
    "ACESSO USUÁRIO"
  );


  window.location.assign(
    "./painel.html"
  );

}


/* =====================================
   ELEMENTOS
===================================== */

const loginBox =
  document.getElementById(
    "loginBox"
  );


const registerBox =
  document.getElementById(
    "registerBox"
  );


const loginForm =
  document.getElementById(
    "loginForm"
  );


const registerForm =
  document.getElementById(
    "registerForm"
  );


const email =
  document.getElementById(
    "email"
  );


const password =
  document.getElementById(
    "password"
  );


const message =
  document.getElementById(
    "message"
  );


const registerMessage =
  document.getElementById(
    "registerMessage"
  );


/* =====================================
   MENSAGENS
===================================== */

function mostrarMensagem(
  texto,
  tipo="error"
){

  message.textContent =
    texto;

  message.className =
    "message " + tipo;

}


function mostrarMensagemCadastro(
  texto,
  tipo="error"
){

  registerMessage.textContent =
    texto;

  registerMessage.className =
    "message " + tipo;

}


/* =====================================
   MOSTRAR SENHA
===================================== */

document
.getElementById(
  "showPassword"
)
.addEventListener(
  "click",
  () => {

    if(
      password.type ===
      "password"
    ){

      password.type =
        "text";


      document
      .getElementById(
        "showPassword"
      )
      .textContent =
        "🙈";

    }

    else{

      password.type =
        "password";


      document
      .getElementById(
        "showPassword"
      )
      .textContent =
        "👁️";

    }

  }
);


/* =====================================
   ABRIR CADASTRO
===================================== */

document
.getElementById(
  "showRegister"
)
.addEventListener(
  "click",
  () => {

    loginBox.classList.add(
      "hidden"
    );

    registerBox.classList.add(
      "active"
    );

    window.scrollTo(
      0,
      0
    );

  }
);


/* =====================================
   VOLTAR LOGIN
===================================== */

document
.getElementById(
  "backLogin"
)
.addEventListener(
  "click",
  () => {

    registerBox.classList.remove(
      "active"
    );

    loginBox.classList.remove(
      "hidden"
    );

    mostrarMensagemCadastro(
      "",
      ""
    );

  }
);


/* =====================================
   LOGIN POR E-MAIL
===================================== */

loginForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const emailValue =
      email.value.trim();


    const passwordValue =
      password.value;


    if(
      !emailValue ||
      !passwordValue
    ){

      mostrarMensagem(
        "Preencha seu e-mail e sua senha."
      );

      return;

    }


    const button =
      document.getElementById(
        "loginButton"
      );


    button.disabled =
      true;


    button.textContent =
      "ENTRANDO...";


    try{

      const resultado =
        await signInWithEmailAndPassword(
          auth,
          emailValue,
          passwordValue
        );


      mostrarMensagem(
        "Login realizado! Entrando...",
        "success"
      );


      /*
       * Usa EXATAMENTE o usuário
       * que acabou de fazer login.
       */

      direcionarUsuario(
        resultado.user
      );


    }

    catch(error){

      console.error(
        "ERRO LOGIN:",
        error
      );


      let texto =
        "Não foi possível entrar.";


      if(
        error.code ===
        "auth/invalid-credential"
      ){

        texto =
          "E-mail ou senha incorretos.";

      }

      else if(
        error.code ===
        "auth/invalid-email"
      ){

        texto =
          "Digite um e-mail válido.";

      }

      else if(
        error.code ===
        "auth/too-many-requests"
      ){

        texto =
          "Muitas tentativas. Aguarde alguns minutos.";

      }


      mostrarMensagem(
        texto
      );


      button.disabled =
        false;


      button.textContent =
        "ENTRAR";

    }

  }
);


/* =====================================
   CRIAR CONTA
===================================== */

registerForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const nome =
      document
      .getElementById(
        "registerName"
      )
      .value
      .trim();


    const emailNovo =
      document
      .getElementById(
        "registerEmail"
      )
      .value
      .trim();


    const senha =
      document
      .getElementById(
        "registerPassword"
      )
      .value;


    const senha2 =
      document
      .getElementById(
        "registerPassword2"
      )
      .value;


    if(
      senha !== senha2
    ){

      mostrarMensagemCadastro(
        "As senhas não são iguais."
      );

      return;

    }


    const button =
      document.getElementById(
        "registerButton"
      );


    button.disabled =
      true;


    button.textContent =
      "CRIANDO...";


    try{

      const resultado =
        await createUserWithEmailAndPassword(
          auth,
          emailNovo,
          senha
        );


      const usuario =
        resultado.user;


      /*
       * GERA ID PÚBLICO
       */

      const caracteres =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


      let publicId =
        "";


      for(
        let i=0;
        i<7;
        i++
      ){

        publicId +=
          caracteres[
            Math.floor(
              Math.random() *
              caracteres.length
            )
          ];

      }


      /*
       * TODA CONTA NOVA COMEÇA:
       *
       * VIP = false
       * Caixa = false
       * Chances = 0
       * Moedas = 0
       * Chaves = 0
       * Créditos = 0
       */

      await addDoc(
        collection(
          db,
          "admins"
        ),
        {

          uid:
            usuario.uid,

          nome:
            nome,

          email:
            emailNovo,

          publicId:
            publicId,

          idade:
            "",

          telefone:
            "",

          avatar:
            "🙂",

          vip:
            false,

          caixaBox:
            false,

          chances:
            0,

          moedas:
            0,

          chaves:
            0,

          creditos:
            0,

          criadoEm:
            new Date().toISOString()

        }
      );


      mostrarMensagemCadastro(
        "Conta criada com sucesso! Entrando...",
        "success"
      );


      direcionarUsuario(
        usuario
      );


    }

    catch(error){

      console.error(
        "ERRO CADASTRO:",
        error
      );


      let texto =
        "Não foi possível criar a conta.";


      if(
        error.code ===
        "auth/email-already-in-use"
      ){

        texto =
          "Este e-mail já possui uma conta.";

      }

      else if(
        error.code ===
        "auth/weak-password"
      ){

        texto =
          "A senha precisa ter pelo menos 6 caracteres.";

      }

      else if(
        error.code ===
        "auth/invalid-email"
      ){

        texto =
          "Digite um e-mail válido.";

      }


      mostrarMensagemCadastro(
        texto
      );


      button.disabled =
        false;


      button.textContent =
        "CRIAR CONTA";

    }

  }
);


/* =====================================
   RECUPERAR SENHA
===================================== */

document
.getElementById(
  "forgotPassword"
)
.addEventListener(
  "click",
  async () => {

    const emailValue =
      email.value.trim();


    if(!emailValue){

      mostrarMensagem(
        "Digite seu e-mail primeiro."
      );

      email.focus();

      return;

    }


    try{

      await sendPasswordResetEmail(
        auth,
        emailValue
      );


      mostrarMensagem(
        "E-mail de recuperação enviado!",
        "success"
      );

    }

    catch(error){

      console.error(
        error
      );


      mostrarMensagem(
        "Não foi possível enviar o e-mail de recuperação."
      );

    }

  }
);


/* =====================================
   GOOGLE
===================================== */

document
.getElementById(
  "googleLogin"
)
.addEventListener(
  "click",
  async () => {

    try{

      const provider =
        new GoogleAuthProvider();


      const resultado =
        await signInWithPopup(
          auth,
          provider
        );


      direcionarUsuario(
        resultado.user
      );

    }

    catch(error){

      console.error(
        "ERRO GOOGLE:",
        error
      );


      mostrarMensagem(
        "Não foi possível entrar com Google."
      );

    }

  }
);


/* =====================================
   FACEBOOK
===================================== */

document
.getElementById(
  "facebookLogin"
)
.addEventListener(
