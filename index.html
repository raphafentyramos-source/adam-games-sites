<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Adam Games</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{

  min-height:100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:#fff;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:25px 15px;

  overflow-x:hidden;

  background-color:#061d43;

  background-image:
    linear-gradient(
      rgba(2,20,55,.30),
      rgba(2,20,55,.48)
    ),
    url("./fundo-login-adam-games.png");

  background-size:cover;

  background-position:center;

  background-repeat:no-repeat;

  background-attachment:fixed;
}


/* =====================================
   CONTAINER
===================================== */

.login-container{

  width:100%;

  max-width:450px;

  position:relative;

  z-index:2;
}


/* =====================================
   LOGO
===================================== */

.logo{

  text-align:center;

  margin-bottom:20px;

  text-shadow:
    0 4px 15px
    rgba(0,0,0,.45);
}

.logo-icon{

  width:92px;

  height:92px;

  margin:auto;

  border-radius:27px;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:55px;

  background:
    linear-gradient(
      145deg,
      #218fff,
      #0754a7
    );

  border:
    3px solid
    rgba(255,255,255,.25);

  box-shadow:
    0 15px 40px
    rgba(0,0,0,.4);
}

.logo h1{

  margin-top:13px;

  font-size:34px;

  font-weight:900;

  line-height:.95;
}

.logo h1 span{

  color:#ffd52b;
}

.logo p{

  margin-top:9px;

  color:#e0efff;

  font-size:14px;
}


/* =====================================
   CARD
===================================== */

.login-card{

  padding:26px;

  border-radius:30px;

  background:
    linear-gradient(
      145deg,
      rgba(4,45,95,.94),
      rgba(2,20,48,.96)
    );

  border:
    1px solid
    rgba(255,255,255,.18);

  box-shadow:
    0 25px 70px
    rgba(0,0,0,.45);

  backdrop-filter:
    blur(10px);
}

.login-card h2{

  text-align:center;

  font-size:25px;

  margin-bottom:7px;
}

.subtitle{

  text-align:center;

  color:#b9d4ee;

  font-size:14px;

  margin-bottom:22px;
}


/* =====================================
   MENSAGEM
===================================== */

.message{

  display:none;

  margin-bottom:16px;

  padding:12px;

  border-radius:13px;

  text-align:center;

  font-size:13px;

  font-weight:bold;
}

.message.error{

  display:block;

  background:
    rgba(255,50,70,.15);

  border:
    1px solid
    rgba(255,70,90,.35);

  color:#ff9ca8;
}

.message.success{

  display:block;

  background:
    rgba(50,255,140,.12);

  border:
    1px solid
    rgba(50,255,140,.30);

  color:#72ffae;
}


/* =====================================
   CAMPOS
===================================== */

label{

  display:block;

  margin-bottom:7px;

  font-size:13px;

  font-weight:bold;

  color:#d5e8fa;
}

.input{

  width:100%;

  height:54px;

  border:
    1px solid
    rgba(255,255,255,.15);

  border-radius:15px;

  background:
    rgba(0,0,0,.27);

  color:#fff;

  padding:
    0 16px;

  font-size:16px;

  outline:none;

  margin-bottom:16px;
}

.input::placeholder{

  color:#8ca8c3;
}

.input:focus{

  border-color:#27a1ff;

  box-shadow:
    0 0 0 3px
    rgba(39,161,255,.12);
}

.password-wrap{

  position:relative;
}

.password-wrap .input{

  padding-right:55px;
}

.show-password{

  position:absolute;

  right:8px;

  top:0;

  width:45px;

  height:54px;

  border:0;

  background:transparent;

  color:#a9c8e5;

  font-size:21px;

  cursor:pointer;
}


/* =====================================
   BOTÃO LOGIN
===================================== */

.login-button{

  width:100%;

  height:55px;

  border:0;

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      #22a2ff,
      #0069db
    );

  color:#fff;

  font-size:16px;

  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 10px 25px
    rgba(0,105,219,.35);
}

.login-button:disabled{

  opacity:.6;

  cursor:not-allowed;
}


/* =====================================
   ESQUECI SENHA
===================================== */

.forgot{

  display:block;

  text-align:center;

  margin-top:16px;

  color:#6dc3ff;

  font-size:13px;

  text-decoration:none;

  cursor:pointer;
}


/* =====================================
   DIVISOR
===================================== */

.divider{

  display:flex;

  align-items:center;

  gap:10px;

  margin:22px 0;

  color:#7897b6;

  font-size:12px;
}

.divider::before,
.divider::after{

  content:"";

  height:1px;

  flex:1;

  background:
    rgba(255,255,255,.13);
}


/* =====================================
   LOGIN SOCIAL
===================================== */

.social-buttons{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:9px;
}

.social-button{

  height:48px;

  border-radius:13px;

  border:
    1px solid
    rgba(255,255,255,.12);

  background:
    rgba(255,255,255,.07);

  color:#fff;

  font-size:20px;

  cursor:pointer;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:6px;
}

.social-button span{

  font-size:11px;

  font-weight:bold;
}

.google{

  background:
    rgba(255,255,255,.09);
}

.facebook{

  background:
    rgba(24,119,242,.28);
}

.apple{

  background:
    rgba(0,0,0,.35);
}


/* =====================================
   CRIAR CONTA
===================================== */

.create-account{

  margin-top:22px;

  padding-top:20px;

  border-top:
    1px solid
    rgba(255,255,255,.10);

  text-align:center;
}

.create-account p{

  color:#a9c7e4;

  font-size:13px;

  margin-bottom:10px;
}

.create-button{

  width:100%;

  height:50px;

  border-radius:14px;

  border:
    1px solid
    rgba(255,211,43,.55);

  background:
    linear-gradient(
      135deg,
      #d99b12,
      #f3c62d
    );

  color:#fff;

  font-size:15px;

  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 8px 20px
    rgba(217,155,18,.25);
}


/* =====================================
   CADASTRO
===================================== */

.register-panel{

  display:none;

  margin-top:20px;

  padding-top:20px;

  border-top:
    1px solid
    rgba(255,255,255,.10);
}

.register-panel h3{

  text-align:center;

  font-size:20px;

  margin-bottom:18px;
}

.register-button{

  width:100%;

  height:52px;

  border:0;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #12b866,
      #078b4b
    );

  color:white;

  font-weight:900;

  cursor:pointer;
}

.back-login{

  display:block;

  margin-top:13px;

  text-align:center;

  color:#69c2ff;

  font-size:13px;

  cursor:pointer;
}


/* =====================================
   LOADING
===================================== */

.loading{

  display:none;

  text-align:center;

  margin-top:14px;

  color:#8fcaff;

  font-size:13px;
}


/* =====================================
   FOOTER
===================================== */

.footer{

  text-align:center;

  margin-top:18px;

  color:#d2e4f5;

  font-size:11px;

  text-shadow:
    0 2px 8px
    rgba(0,0,0,.5);
}


/* =====================================
   MOBILE
===================================== */

@media(max-width:500px){

  body{

    padding:
      18px
      12px;
  }

  .logo-icon{

    width:78px;

    height:78px;

    font-size:45px;
  }

  .logo h1{

    font-size:29px;
  }

  .login-card{

    padding:22px 18px;

    border-radius:25px;
  }

  .login-card h2{

    font-size:22px;
  }

  .social-button span{

    display:none;
  }

}

</style>

</head>


<body>


<div class="login-container">


  <!-- LOGO -->

  <div class="logo">

    <div class="logo-icon">
      👑
    </div>

    <h1>
      ADAM
      <span>GAMES</span>
    </h1>

    <p>
      Seu mundo começa aqui!
    </p>

  </div>


  <!-- LOGIN -->

  <div class="login-card">


    <h2>
      Bem-vindo de volta 👋
    </h2>


    <div class="subtitle">
      Entre na sua conta para continuar
    </div>


    <div
      id="message"
      class="message">
    </div>


    <form id="loginForm">


      <label for="email">
        E-mail
      </label>


      <input
        id="email"
        class="input"
        type="email"
        placeholder="seu@email.com"
        autocomplete="email"
        required
      >


      <label for="password">
        Senha
      </label>


      <div class="password-wrap">


        <input
          id="password"
          class="input"
          type="password"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          required
        >


        <button
          type="button"
          class="show-password"
          id="showPassword">

          👁️

        </button>


      </div>


      <button
        type="submit"
        class="login-button"
        id="loginButton">

        ENTRAR

      </button>


    </form>


    <a
      href="#"
      class="forgot"
      id="forgotPassword">

      Esqueci minha senha

    </a>


    <!-- SOCIAL -->

    <div class="divider">
      OU CONTINUE COM
    </div>


    <div class="social-buttons">


      <button
        type="button"
        class="social-button google"
        id="googleLogin">

        🔵
        <span>Google</span>

      </button>


      <button
        type="button"
        class="social-button facebook"
        id="facebookLogin">

        🔵
        <span>Facebook</span>

      </button>


      <button
        type="button"
        class="social-button apple"
        id="appleLogin">

        
        <span>Apple</span>

      </button>


    </div>


    <!-- CRIAR CONTA -->

    <div class="create-account">

      <p>
        Ainda não tem uma conta?
      </p>


      <button
        type="button"
        class="create-button"
        id="createButton">

        👤 CRIAR MINHA CONTA

      </button>


    </div>


    <!-- CADASTRO -->

    <div
      class="register-panel"
      id="registerPanel">


      <h3>
        Criar conta 🎮
      </h3>


      <label for="registerName">
        Nome
      </label>


      <input
        id="registerName"
        class="input"
        type="text"
        placeholder="Seu nome"
      >


      <label for="registerEmail">
        E-mail
      </label>


      <input
        id="registerEmail"
        class="input"
        type="email"
        placeholder="seu@email.com"
      >


      <label for="registerPassword">
        Senha
      </label>


      <input
        id="registerPassword"
        class="input"
        type="password"
        placeholder="Mínimo de 6 caracteres"
      >


      <button
        type="button"
        class="register-button"
        id="registerButton">

        CRIAR CONTA

      </button>


      <span
        class="back-login"
        id="backLogin">

        ← Voltar para entrar

      </span>


    </div>


    <div
      class="loading"
      id="loading">

      🔄 Verificando sua conta...

    </div>


  </div>


  <div class="footer">

    © 2026 Adam Games

  </div>


</div>


<script type="module">


/* =====================================
   FIREBASE
===================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  sendPasswordResetEmail,
  GoogleAuthProvider,
  signInWithPopup
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  addDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================
   CONFIG
===================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:
    "adam-games-21081.firebaseapp.com",

  projectId:
    "adam-games-21081",

  storageBucket:
    "adam-games-21081.firebasestorage.app",

  messagingSenderId:
    "1055528418738",

  appId:
    "1:1055528418738:web:5fafdf63424ba9744eb8ab",

  measurementId:
    "G-KVFSF864GE"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================
   ELEMENTOS
===================================== */

const form =
  document.getElementById(
    "loginForm"
  );

const email =
  document.getElementById(
    "email"
  );

const password =
  document.getElementById(
    "password"
  );

const button =
  document.getElementById(
    "loginButton"
  );

const message =
  document.getElementById(
    "message"
  );

const loading =
  document.getElementById(
    "loading"
  );

const forgot =
  document.getElementById(
    "forgotPassword"
  );

const showPassword =
  document.getElementById(
    "showPassword"
  );

const createButton =
  document.getElementById(
    "createButton"
  );

const registerPanel =
  document.getElementById(
    "registerPanel"
  );

const registerButton =
  document.getElementById(
    "registerButton"
  );

const backLogin =
  document.getElementById(
    "backLogin"
  );


/* =====================================
   MENSAGEM
===================================== */

function mostrarMensagem(
  texto,
  tipo="error"
){

  message.textContent =
    texto;

  message.className =
    "message " +
    tipo;

}


/* =====================================
   MOSTRAR SENHA
===================================== */

showPassword.addEventListener(
  "click",
  () => {

    if(
      password.type ===
      "password"
    ){

      password.type =
        "text";

      showPassword.textContent =
        "🙈";

    }

    else{

      password.type =
        "password";

      showPassword.textContent =
        "👁️";

    }

  }
);


/* =====================================
   LOGIN NORMAL
===================================== */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const emailValue =
      email.value.trim();


    const passwordValue =
      password.value;


    if(
      !emailValue ||
      !passwordValue
    ){

      mostrarMensagem(
        "Preencha seu e-mail e sua senha."
      );

      return;

    }


    button.disabled =
      true;


    button.textContent =
      "ENTRANDO...";


    loading.style.display =
      "block";


    try{

      await signInWithEmailAndPassword(
        auth,
        emailValue,
        passwordValue
      );


      mostrarMensagem(
        "Login realizado! Entrando...",
        "success"
      );


      setTimeout(
        () => {

          window.location.replace(
            "painel.html"
          );

        },
        500
      );


    }

    catch(error){

      console.error(
        error
      );


      mostrarMensagem(
        "E-mail ou senha incorretos."
      );


      button.disabled =
        false;


      button.textContent =
        "ENTRAR";


      loading.style.display =
        "none";

    }

  }
);


/* =====================================
   CRIAR CONTA
===================================== */

createButton.addEventListener(
  "click",
  () => {

    registerPanel.style.display =
      "block";

    createButton.style.display =
      "none";

  }
);


/* =====================================
   VOLTAR
===================================== */

backLogin.addEventListener(
  "click",
  () => {

    registerPanel.style.display =
      "none";

    createButton.style.display =
      "block";

  }
);


/* =====================================
   CADASTRO
===================================== */

registerButton.addEventListener(
  "click",
  async () => {

    const nome =
      document.getElementById(
        "registerName"
      ).value.trim();


    const emailCadastro =
      document.getElementById(
        "registerEmail"
      ).value.trim();


    const senha =
      document.getElementById(
        "registerPassword"
      ).value;


    if(
      !nome ||
      !emailCadastro ||
      !senha
    ){

      mostrarMensagem(
        "Preencha nome, e-mail e senha."
      );

      return;

    }


    if(
      senha.length < 6
    ){

      mostrarMensagem(
        "A senha precisa ter pelo menos 6 caracteres."
      );

      return;

    }


    registerButton.disabled =
      true;


    registerButton.textContent =
      "CRIANDO...";


    try{

      const resultado =
        await createUserWithEmailAndPassword(
          auth,
          emailCadastro,
          senha
        );


      /*
        Criamos o cadastro inicial
        na coleção admins.
      */

      await addDoc(
        collection(
          db,
          "admins"
        ),
        {

          uid:
            resultado.user.uid,

          nome:
            nome,

          name:
            nome,

          email:
            emailCadastro,

          chances:
            0,

          moedas:
            0,

          chaves:
            0,

          creditos:
            0,

          vip:
            false,

          caixaBox:
            false,

          criadoEm:
            new Date().toISOString()

        }
      );


      mostrarMensagem(
        "Conta criada com sucesso! Entrando...",
        "success"
      );


      setTimeout(
        () => {

          window.location.replace(
            "painel.html"
          );

        },
        800
      );


    }

    catch(error){

      console.error(
        error
      );


      if(
        error.code ===
        "auth/email-already-in-use"
      ){

        mostrarMensagem(
          "Este e-mail já possui uma conta."
        );

      }

      else if(
        error.code ===
        "auth/invalid-email"
      ){

        mostrarMensagem(
          "Digite um e-mail válido."
        );

      }

      else{

        mostrarMensagem(
          "Não foi possível criar a conta."
        );

      }


      registerButton.disabled =
        false;


      registerButton.textContent =
        "CRIAR CONTA";

    }

  }
);


/* =====================================
   ESQUECI SENHA
===================================== */

forgot.addEventListener(
  "click",
  async event => {

    event.preventDefault();


    const emailValue =
      email.value.trim();


    if(!emailValue){

      mostrarMensagem(
        "Digite seu e-mail primeiro."
      );

      email.focus();

      return;

    }


    try{

      await sendPasswordResetEmail(
        auth,
        emailValue
      );


      mostrarMensagem(
        "E-mail de recuperação enviado!",
        "success"
      );

    }

    catch(error){

      console.error(
        error
      );


      mostrarMensagem(
        "Não foi possível enviar o e-mail."
      );

    }

  }
);


/* =====================================
   GOOGLE
===================================== */

document
.getElementById(
  "googleLogin"
)
.addEventListener(
  "click",
  async () => {

    try{

      const provider =
        new GoogleAuthProvider();


      await signInWithPopup(
        auth,
        provider
      );


      window.location.replace(
        "painel.html"
      );

    }

    catch(error){

      console.error(
        error
      );


      mostrarMensagem(
        "Não foi possível entrar com Google."
      );

    }

  }
);


/* =====================================
   FACEBOOK
===================================== */

document
.getElementById(
  "facebookLogin"
)
.addEventListener(
  "click",
  () => {

    mostrarMensagem(
      "Facebook precisa ser ativado no Firebase antes de funcionar."
    );

  }
);


/* =====================================
   APPLE
===================================== */

document
.getElementById(
  "appleLogin"
)
.addEventListener(
  "click",
  () => {

    mostrarMensagem(
      "Apple precisa ser configurado no Firebase antes de funcionar."
    );

  }
);


/* =====================================
   SESSÃO
===================================== */

onAuthStateChanged(
  auth,
  usuario => {

    if(usuario){

      window.location.replace(
        "painel.html"
      );

    }

  }
);


</script>

</body>

</html>
