<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Adam Games • Login</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{

  min-height:100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:18px 12px 25px;

  overflow-x:hidden;

  background-color:#061d43;

  /*
  =====================================================
  FUNDO DO ADAM GAMES
  =====================================================
  */

  background-image:
    linear-gradient(
      rgba(0,20,55,.08),
      rgba(0,20,55,.08)
    ),
    url("6AB154F8-5052-4D70-B604-F3C0BEE88348.png");

  background-size:cover;

  background-position:center;

  background-repeat:no-repeat;

  background-attachment:fixed;

}


/* =====================================================
   CONTAINER
===================================================== */

.login-container{

  width:100%;

  max-width:440px;

  margin:auto;

  position:relative;

  z-index:2;

}


/* =====================================================
   LOGO
===================================================== */

.logo{

  text-align:center;

  margin-bottom:9px;

  position:relative;

  z-index:5;

}


/*
=========================================================
ÍCONE DA COROA
=========================================================
*/

.logo-icon{

  display:none;

}


/*
=========================================================
ADAM GAMES
=========================================================
*/

.logo h1{

  margin:0;

  font-size:
    clamp(
      38px,
      10vw,
      56px
    );

  font-weight:900;

  line-height:.95;

  letter-spacing:-2px;

  text-shadow:

    0 4px 12px
    rgba(0,0,0,.55),

    0 0 25px
    rgba(255,255,255,.15);

}


.logo h1 .adam{

  color:#fff;

}


.logo h1 .games{

  color:#ffd52b;

}


.logo p{

  display:none;

}


/* =====================================================
   CARD LOGIN
===================================================== */

.login-card{

  width:100%;

  max-width:390px;

  margin:0 auto;

  padding:
    21px
    23px;

  border-radius:26px;

  background:

    linear-gradient(
      145deg,
      rgba(4,55,110,.93),
      rgba(2,25,56,.96)
    );

  border:
    1px solid
    rgba(255,255,255,.17);

  box-shadow:

    0 20px 50px
    rgba(0,0,0,.45);

  position:relative;

  z-index:10;

}


.login-card h2{

  text-align:center;

  font-size:25px;

  margin-bottom:6px;

}


.subtitle{

  text-align:center;

  color:#b5d0e8;

  font-size:14px;

  margin-bottom:19px;

}


/* =====================================================
   MENSAGEM
===================================================== */

.message{

  display:none;

  margin-bottom:15px;

  padding:12px;

  border-radius:13px;

  text-align:center;

  font-size:13px;

  font-weight:bold;

}


.message.error{

  display:block;

  background:
    rgba(255,50,70,.15);

  border:
    1px solid
    rgba(255,70,90,.35);

  color:#ff9ba7;

}


.message.success{

  display:block;

  background:
    rgba(50,255,140,.12);

  border:
    1px solid
    rgba(50,255,140,.3);

  color:#72ffae;

}


/* =====================================================
   CAMPOS
===================================================== */

label{

  display:block;

  margin-bottom:6px;

  font-size:13px;

  font-weight:bold;

  color:#cce3f8;

}


.input{

  width:100%;

  height:51px;

  border:
    1px solid
    rgba(255,255,255,.14);

  border-radius:15px;

  background:
    rgba(0,0,0,.25);

  color:white;

  padding:
    0 16px;

  font-size:16px;

  outline:none;

  margin-bottom:14px;

}


.input::placeholder{

  color:#8fa8c0;

}


.input:focus{

  border-color:#27a1ff;

  box-shadow:
    0 0 0 3px
    rgba(39,161,255,.12);

}


/* =====================================================
   SENHA
===================================================== */

.password-wrap{

  position:relative;

}


.password-wrap .input{

  padding-right:55px;

}


.show-password{

  position:absolute;

  right:8px;

  top:0;

  width:45px;

  height:51px;

  border:0;

  background:transparent;

  color:#9fc4e5;

  font-size:21px;

  cursor:pointer;

}


/* =====================================================
   BOTÃO ENTRAR
===================================================== */

.login-button{

  width:100%;

  height:52px;

  border:0;

  border-radius:16px;

  background:

    linear-gradient(
      135deg,
      #22a2ff,
      #0069db
    );

  color:white;

  font-size:16px;

  font-weight:900;

  cursor:pointer;

  box-shadow:

    0 10px 25px
    rgba(0,105,219,.30);

}


.login-button:disabled{

  opacity:.6;

  cursor:not-allowed;

}


/* =====================================================
   ESQUECI SENHA
===================================================== */

.forgot{

  display:block;

  text-align:center;

  margin-top:14px;

  color:#65bdff;

  font-size:13px;

  text-decoration:none;

  cursor:pointer;

}


/* =====================================================
   DIVISOR
===================================================== */

.divider{

  display:flex;

  align-items:center;

  gap:10px;

  margin:
    19px
    0
    14px;

  color:#a9c7e4;

  font-size:13px;

  white-space:nowrap;

}


.divider::before,
.divider::after{

  content:"";

  height:1px;

  flex:1;

  background:
    rgba(255,255,255,.15);

}


/* =====================================================
   LOGIN SOCIAL
===================================================== */

.social-buttons{

  display:flex;

  flex-direction:column;

  gap:8px;

}


.social-button{

  width:100%;

  height:47px;

  border:0;

  border-radius:15px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:10px;

  font-size:15px;

  font-weight:bold;

  cursor:pointer;

}


.google{

  background:#fff;

  color:#202124;

}


.facebook{

  background:#1877f2;

  color:#fff;

}


.apple{

  background:#000;

  color:#fff;

}


.social-icon{

  font-size:19px;

  width:25px;

  text-align:center;

}


/* =====================================================
   CRIAR CONTA
===================================================== */

.create-account{

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  margin-top:14px;

  padding:13px 10px;

  min-height:50px;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #20c95c,
      #079b42
    );

  color:#fff;

  font-size:15px;

  font-weight:900;

  text-decoration:none;

  cursor:pointer;

  box-shadow:
    0 8px 20px
    rgba(0,160,70,.22);

}


.create-account:hover{

  filter:brightness(1.08);

}


/* =====================================================
   CADASTRO
===================================================== */

.register-box{

  display:none;

}


.register-box.active{

  display:block;

}


.login-box.hidden{

  display:none;

}


.back-login{

  display:block;

  text-align:center;

  margin-top:17px;

  color:#65bdff;

  font-size:13px;

  cursor:pointer;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

  display:none;

  text-align:center;

  margin-top:14px;

  color:#8fcaff;

  font-size:13px;

}


/* =====================================================
   FOOTER
===================================================== */

.footer{

  text-align:center;

  margin-top:13px;

  color:#d0e2f2;

  font-size:11px;

  text-shadow:
    0 2px 5px
    rgba(0,0,0,.6);

}


/* =====================================================
   WHATSAPP
===================================================== */

.adam-whatsapp-button{

  position:fixed;

  right:17px;

  bottom:19px;

  z-index:99999;

  width:58px;

  height:58px;

  border:0;

  border-radius:50%;

  background:#25D366;

  color:#fff;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:29px;

  cursor:pointer;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.38);

  transition:
    transform .2s ease;

}


.adam-whatsapp-button:hover{

  transform:scale(1.08);

}


.adam-whatsapp-menu{

  position:fixed;

  right:17px;

  bottom:89px;

  z-index:99999;

  width:270px;

  padding:17px;

  border-radius:20px;

  background:

    linear-gradient(
      145deg,
      #073d76,
      #021a38
    );

  border:
    1px solid
    rgba(255,255,255,.15);

  box-shadow:
    0 15px 40px
    rgba(0,0,0,.45);

  display:none;

}


.adam-whatsapp-menu.active{

  display:block;

}


.adam-whatsapp-title{

  font-size:16px;

  font-weight:900;

  margin-bottom:12px;

}


.adam-whatsapp-option{

  width:100%;

  border:0;

  border-radius:13px;

  padding:14px 12px;

  margin-top:8px;

  color:#fff;

  font-size:14px;

  font-weight:800;

  text-align:left;

  cursor:pointer;

}


.adam-whatsapp-buy{

  background:#07934c;

}


.adam-whatsapp-help{

  background:#168ff0;

}


.adam-whatsapp-close{

  width:100%;

  margin-top:10px;

  border:0;

  border-radius:12px;

  padding:9px;

  background:
    rgba(255,255,255,.08);

  color:#a9c8e5;

  cursor:pointer;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:480px){

  body{

    padding:
      12px
      10px
      20px;

    align-items:flex-start;

    background-attachment:scroll;

  }


  .login-container{

    padding-top:6px;

  }


  .logo{

    margin-bottom:8px;

  }


  .logo h1{

    font-size:38px;

    letter-spacing:-1.5px;

  }


  .login-card{

    width:100%;

    max-width:390px;

    padding:
      19px
      17px;

    border-radius:24px;

  }


  .login-card h2{

    font-size:23px;

  }


  .subtitle{

    font-size:13px;

    margin-bottom:17px;

  }


  .input{

    height:50px;

    margin-bottom:13px;

  }


  .show-password{

    height:50px;

  }


  .login-button{

    height:51px;

  }


  .divider{

    margin:
      18px
      0
      13px;

  }


  .social-buttons{

    gap:8px;

  }


  .social-button{

    height:46px;

  }


  .create-account{

    min-height:52px;

    font-size:15px;

  }


  .adam-whatsapp-button{

    right:15px;

    bottom:17px;

    width:56px;

    height:56px;

  }


  .adam-whatsapp-menu{

    right:15px;

    bottom:83px;

    width:
      calc(100% - 30px);

    max-width:300px;

  }

}


/* =====================================================
   TELAS MUITO PEQUENAS
===================================================== */

@media(max-width:380px){

  .logo h1{

    font-size:34px;

  }


  .login-card{

    padding:
      17px
      15px;

  }


  .login-card h2{

    font-size:21px;

  }


  .social-button{

    height:44px;

    font-size:14px;

  }

}

</style>

</head>


<body>

        <span class="social-icon">

  <!-- =================================================

  <div

    id="registerBox"
  >

    <h2>

    <div

    <form id="registerForm">


      <label for="registerName">

        minlength="6"

    <a

  </div>


  <div class="footer">
    © 2026 Adam Games
  </div>


</div>


<!-- =====================================================
     WHATSAPP
===================================================== -->

<div
  class="adam-whatsapp-menu"
  id="adamWhatsAppMenu"
>

  <div class="adam-whatsapp-title">
    💬 Como podemos ajudar?
  </div>


  <button
    type="button"
    class="adam-whatsapp-option adam-whatsapp-buy"
    id="adamWhatsAppBuy"
  >
    🛒 Quero comprar
  </button>


  <button
    type="button"
    class="adam-whatsapp-option adam-whatsapp-help"
    id="adamWhatsAppHelp"
  >
    💬 Tenho uma dúvida
  </button>


  <button
    type="button"

    id="adamWhatsAppClose"

    Fechar
  </button>

</div>


<button
  type="button"
  class="adam-whatsapp-button"
  id="adamWhatsAppButton"
  aria-label="Abrir WhatsApp"
>
  💬
</button>


<script type="module">


/* =====================================================
   FIREBASE APP
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


/* =====================================================
   FIREBASE AUTH
===================================================== */

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  sendPasswordResetEmail,
  GoogleAuthProvider,
  FacebookAuthProvider,
  OAuthProvider,
  signInWithPopup
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =====================================================
   FIRESTORE
===================================================== */

import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  addDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   CONFIGURAÇÃO FIREBASE
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:
    "adam-games-21081.firebaseapp.com",

  projectId:
    "adam-games-21081",

  storageBucket:
    "adam-games-21081.firebasestorage.app",

  messagingSenderId:
    "1055528418738",

  appId:
    "1:1055528418738:web:5fafdf63424ba9744eb8ab",

  measurementId:
    "G-KVFSF864GE"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================================
   ELEMENTOS
===================================================== */

const loginBox =
  document.getElementById(
    "loginBox"
  );


const registerBox =
  document.getElementById(
    "registerBox"
  );


const loginForm =
  document.getElementById(
    "loginForm"
  );


const registerForm =
  document.getElementById(
    "registerForm"
  );


const email =
  document.getElementById(
    "email"
  );


const password =
  document.getElementById(
    "password"
  );


const message =
  document.getElementById(
    "message"
  );


const registerMessage =
  document.getElementById(
    "registerMessage"
  );


/* =====================================================
   MENSAGEM LOGIN
===================================================== */

function mostrarMensagem(
  texto,
  tipo="error"
){

  message.textContent =
    texto;

  message.className =
    "message " + tipo;

}


/* =====================================================
   MENSAGEM CADASTRO
===================================================== */

function mostrarMensagemCadastro(
  texto,
  tipo="error"
){

  registerMessage.textContent =
    texto;

  registerMessage.className =
    "message " + tipo;

}


/* =====================================================
   MOSTRAR / OCULTAR SENHA
===================================================== */

document
.getElementById(
  "showPassword"
)
.addEventListener(
  "click",
  () => {

    if(
      password.type ===
      "password"
    ){

      password.type =
        "text";

      document.getElementById(
        "showPassword"
      ).textContent =
        "🙈";

    }

    else{

      password.type =
        "password";

      document.getElementById(
        "showPassword"
      ).textContent =
        "👁️";

    }

  }
);


/* =====================================================
   ABRIR CADASTRO
===================================================== */

document
.getElementById(
  "showRegister"
)
.addEventListener(
  "click",
  () => {

    loginBox.classList.add(
      "hidden"
    );

    registerBox.classList.add(
      "active"
    );

    window.scrollTo(
      0,
      0
    );

  }
);


/* =====================================================
   VOLTAR LOGIN
===================================================== */

document
.getElementById(
  "backLogin"
)
.addEventListener(
  "click",
  () => {

    registerBox.classList.remove(
      "active"
    );

    loginBox.classList.remove(
      "hidden"
    );

    mostrarMensagemCadastro(
      "",
      ""
    );

  }
);


/* =====================================================
   LOGIN COM E-MAIL
===================================================== */

loginForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const emailValue =
      email.value.trim();


    const passwordValue =
      password.value;


    if(
      !emailValue ||
      !passwordValue
    ){

      mostrarMensagem(
        "Preencha seu e-mail e sua senha."
      );

      return;

    }


    const button =
      document.getElementById(
        "loginButton"
      );


    button.disabled =
      true;

    button.textContent =
      "ENTRANDO...";


    try{

      await signInWithEmailAndPassword(
        auth,
        emailValue,
        passwordValue
      );


      mostrarMensagem(
        "Login realizado! Entrando...",
        "success"
      );


      setTimeout(
        () => {

          window.location.replace(
            "painel.html"
          );

        },
        400
      );


    }

    catch(error){

      console.error(
        error
      );


      let texto =
        "Não foi possível entrar.";


      if(
        error.code ===
        "auth/invalid-credential"
      ){

        texto =
          "E-mail ou senha incorretos.";

      }

      else if(
        error.code ===
        "auth/invalid-email"
      ){

        texto =
          "Digite um e-mail válido.";

      }

      else if(
        error.code ===
        "auth/too-many-requests"
      ){

        texto =
          "Muitas tentativas. Aguarde alguns minutos.";

      }


      mostrarMensagem(
        texto
      );


      button.disabled =
        false;

      button.textContent =
        "ENTRAR";

    }

  }
);


/* =====================================================
   CRIAR CONTA
===================================================== */

registerForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const nome =
      document
      .getElementById(
        "registerName"
      )
      .value
      .trim();


    const emailNovo =
      document
      .getElementById(
        "registerEmail"
      )
      .value
      .trim()
      .toLowerCase();


    const senha =
      document
      .getElementById(
        "registerPassword"
      )
      .value;


    const senha2 =
      document
      .getElementById(
        "registerPassword2"
      )
      .value;


    if(
      senha !== senha2
    ){

      mostrarMensagemCadastro(
        "As senhas não são iguais."
      );

      return;

    }


    const button =
      document.getElementById(
        "registerButton"
      );


    button.disabled =
      true;

    button.textContent =
      "CRIANDO...";


    try{

      const resultado =
        await createUserWithEmailAndPassword(
          auth,
          emailNovo,
          senha
        );


      const usuario =
        resultado.user;


      /* =================================================
         ID PÚBLICO

         EXATAMENTE 6 CARACTERES
         LETRAS MAIÚSCULAS + NÚMEROS
      ================================================= */

      const caracteres =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


      let publicId =
        "";


      for(
        let i = 0;
        i < 6;
        i++
      ){

        publicId +=
          caracteres[
            Math.floor(
              Math.random() *
              caracteres.length
            )
          ];

      }


      await addDoc(
        collection(
          db,
          "admins"
        ),
        {

          uid:
            usuario.uid,

          nome:
            nome,

          email:
            emailNovo,

          publicId:
            publicId,

          idade:
            "",

          telefone:
            "",

          avatar:
            "🙂",

          vip:
            false,

          caixaBox:
            false,

          chances:
            0,

          moedas:
            0,

          chaves:
            0,

          creditos:
            0,

          girosRoleta:
            0,

          criadoEm:
            new Date().toISOString()

        }
      );


      mostrarMensagemCadastro(
        "Conta criada com sucesso! Entrando...",
        "success"
      );


      setTimeout(
        () => {

          window.location.replace(
            "painel.html"
          );

        },
        700
      );


    }

    catch(error){

      console.error(
        error
      );


      let texto =
        "Não foi possível criar a conta.";


      if(
        error.code ===
        "auth/email-already-in-use"
      ){

        texto =
          "Este e-mail já possui uma conta.";

      }

      else if(
        error.code ===
        "auth/weak-password"
      ){

        texto =
          "A senha precisa ter pelo menos 6 caracteres.";

      }

      else if(
        error.code ===
        "auth/invalid-email"
      ){

        texto =
          "Digite um e-mail válido.";

      }


      mostrarMensagemCadastro(
        texto
      );


      button.disabled =
        false;

      button.textContent =
        "CRIAR CONTA";

    }

  }
);

/* =====================================================
   ABRIR WHATSAPP
===================================================== */

function abrirWhatsApp(
  mensagem
){

  const url =
    "https://wa.me/5531987350267?text=" +
    encodeURIComponent(
      mensagem
    );


  window.open(
    url,
    "_blank"
  );

}
