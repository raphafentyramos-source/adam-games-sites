<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adam Games</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: #fff;
  overflow-x: hidden;

  background:
    radial-gradient(circle at 50% 10%, #36bfff 0%, transparent 28%),
    linear-gradient(180deg, #0879c9 0%, #07508c 42%, #03182e 100%);
}

/* CENÁRIO */
.scene {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.cloud {
  position: absolute;
  width: 180px;
  height: 55px;
  border-radius: 50px;
  background: rgba(255,255,255,.22);
  filter: blur(3px);
}

.cloud::before,
.cloud::after {
  content: "";
  position: absolute;
  background: inherit;
  border-radius: 50%;
}

.cloud::before {
  width: 80px;
  height: 80px;
  left: 25px;
  bottom: 10px;
}

.cloud::after {
  width: 100px;
  height: 100px;
  right: 25px;
  bottom: 5px;
}

.cloud1 {
  top: 18%;
  left: -50px;
  animation: cloudMove 18s linear infinite;
}

.cloud2 {
  top: 38%;
  right: -100px;
  transform: scale(.7);
  animation: cloudMove2 24s linear infinite;
}

@keyframes cloudMove {
  from { transform: translateX(-30px); }
  to { transform: translateX(120px); }
}

@keyframes cloudMove2 {
  from { transform: translateX(80px); }
  to { transform: translateX(-160px); }
}

/* MONTANHAS */
.mountains {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 34%;
  background:
    linear-gradient(135deg, transparent 50%, #164c67 51%) 0 0/35% 100%,
    linear-gradient(225deg, transparent 50%, #0d3d59 51%) 20% 0/40% 100%,
    linear-gradient(135deg, transparent 50%, #14506a 51%) 55% 0/40% 100%;
  opacity: .8;
}

/* CONTEÚDO */
.page {
  position: relative;
  z-index: 2;
  width: 100%;
  min-height: 100vh;
  padding: 30px 18px 35px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* IDIOMA */
.language {
  position: absolute;
  top: 20px;
  right: 18px;

  padding: 10px 14px;
  border-radius: 18px;

  background: rgba(0,35,75,.7);
  border: 1px solid rgba(255,255,255,.2);
  backdrop-filter: blur(10px);

  font-size: 13px;
  font-weight: bold;
}

/* LOGO */
.logo-area {
  text-align: center;
  margin-top: 25px;
  margin-bottom: 20px;
}

.shield {
  width: 90px;
  height: 90px;
  margin: auto;

  display: flex;
  align-items: center;
  justify-content: center;

  background: linear-gradient(145deg,#168cff,#034b9d);
  border: 4px solid #ffd029;
  border-radius: 27px;

  font-size: 48px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.45),
    inset 0 2px 8px rgba(255,255,255,.35);
}

.logo {
  margin-top: 8px;

  font-size: clamp(42px,12vw,70px);
  font-weight: 1000;
  line-height: .85;
  letter-spacing: -4px;

  text-shadow:
    0 5px #17395f,
    0 10px 18px rgba(0,0,0,.5);
}

.logo span {
  display: block;
  color: #ffd029;

  text-shadow:
    0 5px #9b6000,
    0 10px 18px rgba(0,0,0,.5);
}

.tagline {
  display: inline-block;
  margin-top: 14px;

  padding: 9px 18px;

  border-radius: 25px;
  background: rgba(0,65,125,.75);

  font-size: 15px;
  font-weight: bold;
}

/* LOGIN */
.login-card {
  width: 100%;
  max-width: 470px;

  padding: 27px 20px;

  border-radius: 30px;

  background: linear-gradient(
    145deg,
    rgba(4,48,91,.96),
    rgba(2,19,39,.97)
  );

  border: 1px solid rgba(255,255,255,.16);

  box-shadow:
    0 25px 60px rgba(0,0,0,.55),
    inset 0 1px rgba(255,255,255,.12);

  backdrop-filter: blur(15px);
}

.welcome {
  text-align: center;
  margin-bottom: 22px;
}

.welcome h1 {
  font-size: 29px;
  margin-bottom: 7px;
}

.welcome p {
  color: #bcd1e6;
  font-size: 14px;
}

/* CAMPOS */
.field {
  margin-bottom: 14px;
}

.field label {
  display: block;
  margin: 0 0 7px 6px;

  font-size: 13px;
  font-weight: bold;
}

.input {
  height: 61px;

  display: flex;
  align-items: center;

  padding: 0 14px;

  border-radius: 18px;

  background: rgba(0,19,43,.85);
  border: 1px solid rgba(87,166,255,.2);
}

.input:focus-within {
  border-color: #1593ff;
  box-shadow: 0 0 0 3px rgba(21,147,255,.12);
}

.icon {
  width: 38px;
  height: 38px;

  display: flex;
  align-items: center;
  justify-content: center;

  margin-right: 11px;

  border-radius: 12px;
  background: #086bd8;

  font-size: 18px;
}

.input input {
  flex: 1;

  min-width: 0;

  border: 0;
  outline: 0;

  background: transparent;

  color: white;
  font-size: 16px;
}

.input input::placeholder {
  color: #7893ae;
}

.eye {
  cursor: pointer;
  font-size: 20px;
}

/* ESQUECEU */
.forgot {
  display: block;

  text-align: right;

  margin: 5px 5px 18px;

  color: #35a5ff;

  font-size: 14px;
  font-weight: bold;

  cursor: pointer;
}

/* BOTÃO */
.btn {
  width: 100%;
  height: 61px;

  border: 0;
  border-radius: 19px;

  color: white;

  font-size: 18px;
  font-weight: 900;

  cursor: pointer;

  transition: .15s;
}

.btn-login {
  background: linear-gradient(180deg,#1592ff,#0562d8);

  box-shadow:
    0 6px #03499d,
    0 15px 25px rgba(0,93,210,.3);
}

.btn-login:active {
  transform: translateY(4px);
  box-shadow: 0 2px #03499d;
}

.or {
  display: flex;
  align-items: center;
  gap: 12px;

  margin: 23px 0;

  color: #7893ad;
  font-weight: bold;
}

.or::before,
.or::after {
  content: "";
  flex: 1;
  height: 1px;
  background: rgba(255,255,255,.12);
}

.btn-register {
  background: rgba(6,39,72,.8);
  border: 1px solid rgba(255,255,255,.13);
}

/* SUPORTE */
.support {
  width: 100%;
  max-width: 470px;

  margin-top: 17px;
  padding: 15px;

  display: flex;
  align-items: center;
  gap: 12px;

  border-radius: 21px;

  background: rgba(2,38,65,.9);
  border: 1px solid rgba(255,255,255,.13);
}

.whatsapp {
  width: 46px;
  height: 46px;

  display: flex;
  align-items: center;
  justify-content: center;

  flex-shrink: 0;

  border-radius: 14px;
  background: #20c96b;

  font-size: 25px;
}

.support-text {
  flex: 1;
}

.support-text strong {
  display: block;
  font-size: 14px;
}

.support-text small {
  display: block;
  margin-top: 4px;
  color: #91abc4;
  font-size: 11px;
}

.support-btn {
  border: 0;
  border-radius: 12px;

  padding: 11px 13px;

  background: #20c96b;
  color: white;

  font-weight: 900;
}

/* RODAPÉ */
.footer {
  margin-top: 22px;

  text-align: center;

  color: #9bb2c8;
  font-size: 12px;
  line-height: 1.7;
}

.footer strong {
  display: block;
  color: #31a2ff;
  font-size: 15px;
}

/* DESKTOP */
@media (min-width: 700px) {
  .page {
    padding-top: 45px;
  }

  .login-card {
    padding: 32px;
  }

  .shield {
    width: 105px;
    height: 105px;
  }
}
</style>
</head>

<body>

<div class="scene">
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="mountains"></div>
</div>

<div class="page">

  <div class="language">
    🌎 PT-BR ▾
  </div>

  <div class="logo-area">

    <div class="shield">👑</div>

    <div class="logo">
      ADAM
      <span>GAMES</span>
    </div>

    <div class="tagline">
      🌎 Seu mundo começa aqui!
    </div>

  </div>

  <main class="login-card">

    <div class="welcome">
      <h1>Bem-vindo! 👋</h1>
      <p>Entre na sua conta para continuar</p>
    </div>

    <div class="field">
      <label>E-mail</label>

      <div class="input">
        <div class="icon">✉️</div>

        <input
          id="email"
          type="email"
          placeholder="Digite seu e-mail"
        >
      </div>
    </div>

    <div class="field">
      <label>Senha</label>

      <div class="input">
        <div class="icon">🔒</div>

        <input
          id="password"
          type="password"
          placeholder="Digite sua senha"
        >

        <div class="eye" onclick="togglePassword()">👁️</div>
      </div>
    </div>

    <div class="forgot" onclick="forgotPassword()">
      Esqueceu a senha?
    </div>

    <button class="btn btn-login" onclick="login()">
      ENTRAR&nbsp;&nbsp; →
    </button>

    <div class="or">OU</div>

    <button class="btn btn-register" onclick="register()">
      👤 &nbsp; Criar uma conta &nbsp; ›
    </button>

  </main>

  <div class="support">

    <div class="whatsapp">💬</div>

    <div class="support-text">
      <strong>Precisa de ajuda?</strong>
      <small>Fale com nosso suporte via WhatsApp</small>
    </div>

    <button class="support-btn" onclick="support()">
      Falar agora
    </button>

  </div>

  <div class="footer">
    <strong>♛ Adam Games</strong>
    Diversão, aventuras e prêmios te esperam!
  </div>

</div>

<script>
function togglePassword() {
  const input = document.getElementById("password");

  input.type =
    input.type === "password"
      ? "text"
      : "password";
}

function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Preencha seu e-mail e sua senha.");
    return;
  }

  alert("Firebase será conectado nesta etapa.");
}

function register() {
  alert("A tela de cadastro será criada na próxima etapa.");
}

function forgotPassword() {
  alert("A recuperação de senha será conectada ao Firebase.");
}

function support() {
  alert("Vamos configurar o WhatsApp do suporte depois.");
}
</script>

</body>
</html>
