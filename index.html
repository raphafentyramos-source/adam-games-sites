<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Adam Games • Login</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;

  background:
    radial-gradient(circle at 20% 10%,#42aaff 0%,transparent 30%),
    linear-gradient(135deg,#087ee1,#061d43 75%);
}

.login-container{
  width:100%;
  max-width:430px;
}

.logo{
  text-align:center;
  margin-bottom:25px;
}

.logo-icon{
  width:100px;
  height:100px;
  margin:auto;

  border-radius:28px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:58px;

  background:
    linear-gradient(145deg,#218fff,#0754a7);

  border:3px solid rgba(255,255,255,.15);

  box-shadow:
    0 20px 50px rgba(0,0,0,.3);
}

.logo h1{
  margin-top:15px;
  font-size:34px;
  font-weight:900;
  line-height:.9;
}

.logo h1 span{
  color:#ffd52b;
}

.logo p{
  margin-top:10px;
  color:#c5def5;
  font-size:14px;
}

.login-card{
  padding:28px;

  border-radius:30px;

  background:
    linear-gradient(
      145deg,
      rgba(4,55,110,.97),
      rgba(2,25,56,.97)
    );

  border:1px solid rgba(255,255,255,.14);

  box-shadow:
    0 25px 60px rgba(0,0,0,.35);
}

.login-card h2{
  text-align:center;
  font-size:26px;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#a9c7e4;
  font-size:14px;
  margin-bottom:25px;
}

label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:bold;
  color:#cce3f8;
}

.input{
  width:100%;
  height:54px;

  border:1px solid rgba(255,255,255,.13);
  border-radius:15px;

  background:rgba(0,0,0,.22);

  color:white;

  padding:0 16px;

  font-size:16px;

  outline:none;

  margin-bottom:17px;
}

.input:focus{
  border-color:#27a1ff;
  box-shadow:0 0 0 3px rgba(39,161,255,.12);
}

.password-wrap{
  position:relative;
}

.password-wrap .input{
  padding-right:55px;
}

.show-password{
  position:absolute;

  right:10px;
  top:0;

  width:42px;
  height:54px;

  border:0;
  background:transparent;

  color:#9fc4e5;

  font-size:21px;
}

.login-button{
  width:100%;
  height:55px;

  border:0;
  border-radius:16px;

  background:
    linear-gradient(135deg,#22a2ff,#0069db);

  color:white;

  font-size:16px;
  font-weight:900;

  box-shadow:
    0 10px 25px rgba(0,105,219,.3);
}

.login-button:disabled{
  opacity:.6;
}

.forgot{
  display:block;

  text-align:center;

  margin-top:18px;

  color:#65bdff;

  font-size:13px;

  text-decoration:none;
}

.message{
  display:none;

  margin-bottom:18px;

  padding:13px;

  border-radius:13px;

  text-align:center;

  font-size:13px;

  font-weight:bold;
}

.message.error{
  display:block;

  background:rgba(255,50,70,.15);

  border:1px solid rgba(255,70,90,.35);

  color:#ff9ba7;
}

.message.success{
  display:block;

  background:rgba(50,255,140,.12);

  border:1px solid rgba(50,255,140,.3);

  color:#72ffae;
}

.footer{
  text-align:center;

  margin-top:22px;

  color:#9ab9d5;

  font-size:12px;
}

.loading{
  display:none;

  text-align:center;

  margin-top:15px;

  color:#8fcaff;

  font-size:13px;
}

</style>
</head>

<body>

<div class="login-container">

  <div class="logo">

    <div class="logo-icon">
      👑
    </div>

    <h1>
      ADAM
      <span>GAMES</span>
    </h1>

    <p>
      Seu mundo começa aqui!
    </p>

  </div>


  <div class="login-card">

    <h2>
      Bem-vindo de volta 👋
    </h2>

    <div class="subtitle">
      Entre na sua conta para continuar
    </div>


    <div
      id="message"
      class="message">
    </div>


    <form id="loginForm">

      <label for="email">
        E-mail
      </label>

      <input
        id="email"
        class="input"
        type="email"
        placeholder="seu@email.com"
        autocomplete="email"
        required
      >


      <label for="password">
        Senha
      </label>

      <div class="password-wrap">

        <input
          id="password"
          class="input"
          type="password"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          required
        >

        <button
          type="button"
          class="show-password"
          id="showPassword">
          👁️
        </button>

      </div>


      <button
        type="submit"
        class="login-button"
        id="loginButton">

        ENTRAR

      </button>

    </form>


    <a
      href="#"
      class="forgot"
      id="forgotPassword">

      Esqueci minha senha

    </a>


    <div
      class="loading"
      id="loading">

      🔄 Verificando sua conta...

    </div>

  </div>


  <div class="footer">

    © 2026 Adam Games

  </div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =====================================
   FIREBASE
===================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:
    "adam-games-21081.firebaseapp.com",

  projectId:
    "adam-games-21081",

  storageBucket:
    "adam-games-21081.firebasestorage.app",

  messagingSenderId:
    "1055528418738",

  appId:
    "1:1055528418738:web:5fafdf63424ba9744eb8ab",

  measurementId:
    "G-KVFSF864GE"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);


/* =====================================
   ELEMENTOS
===================================== */

const form =
  document.getElementById("loginForm");

const email =
  document.getElementById("email");

const password =
  document.getElementById("password");

const button =
  document.getElementById("loginButton");

const message =
  document.getElementById("message");

const loading =
  document.getElementById("loading");

const forgot =
  document.getElementById("forgotPassword");

const showPassword =
  document.getElementById("showPassword");


/* =====================================
   MENSAGEM
===================================== */

function mostrarMensagem(
  texto,
  tipo = "error"
){

  message.textContent =
    texto;

  message.className =
    "message " + tipo;

}


/* =====================================
   MOSTRAR SENHA
===================================== */

showPassword.addEventListener(
  "click",
  () => {

    if(password.type === "password"){

      password.type =
        "text";

      showPassword.textContent =
        "🙈";

    }else{

      password.type =
        "password";

      showPassword.textContent =
        "👁️";

    }

  }
);


/* =====================================
   LOGIN
===================================== */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const emailValue =
      email.value.trim();

    const passwordValue =
      password.value;


    if(!emailValue ||
       !passwordValue){

      mostrarMensagem(
        "Preencha seu e-mail e sua senha."
      );

      return;
    }


    button.disabled =
      true;

    button.textContent =
      "ENTRANDO...";

    loading.style.display =
      "block";

    message.className =
      "message";


    try{

      await signInWithEmailAndPassword(
        auth,
        emailValue,
        passwordValue
      );


      mostrarMensagem(
        "Login realizado! Entrando...",
        "success"
      );


      setTimeout(
        () => {

          window.location.replace(
            "painel.html"
          );

        },
        500
      );


    }catch(error){

      console.error(
        "Erro de login:",
        error
      );


      let texto =
        "Não foi possível entrar.";


      if(
        error.code ===
        "auth/invalid-credential"
      ){

        texto =
          "E-mail ou senha incorretos.";

      }

      else if(
        error.code ===
        "auth/user-not-found"
      ){

        texto =
          "Usuário não encontrado.";

      }

      else if(
        error.code ===
        "auth/wrong-password"
      ){

        texto =
          "Senha incorreta.";

      }

      else if(
        error.code ===
        "auth/invalid-email"
      ){

        texto =
          "Digite um e-mail válido.";

      }

      else if(
        error.code ===
        "auth/too-many-requests"
      ){

        texto =
          "Muitas tentativas. Aguarde alguns minutos.";

      }


      mostrarMensagem(
        texto
      );


      button.disabled =
        false;

      button.textContent =
        "ENTRAR";

      loading.style.display =
        "none";

    }

  }
);


/* =====================================
   ESQUECI A SENHA
===================================== */

forgot.addEventListener(
  "click",
  async event => {

    event.preventDefault();


    const emailValue =
      email.value.trim();


    if(!emailValue){

      mostrarMensagem(
        "Digite seu e-mail primeiro."
      );

      email.focus();

      return;
    }


    try{

      await sendPasswordResetEmail(
        auth,
        emailValue
      );


      mostrarMensagem(
        "E-mail de recuperação enviado!",
        "success"
      );


    }catch(error){

      console.error(
        error
      );


      mostrarMensagem(
        "Não foi possível enviar o e-mail de recuperação."
      );

    }

  }
);


/* =====================================
   VERIFICAR SESSÃO
===================================== */

onAuthStateChanged(
  auth,
  usuario => {

    if(usuario){

      /*
        Se já estiver logado,
        entra automaticamente no painel.
      */

      window.location.replace(
        "painel.html"
      );

    }

  }
);

</script>

</body>
</html>
