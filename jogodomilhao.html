question":"ÚLTIMA CHANCE: qual é a capital da Armênia. Escolha a alternativa correta.","options":["Tbilisi","Yerevan","Baku","Tirana"],"answer":"B"},{"id":2590,"difficulty":"Bônus / Mega difícil","points":1000,"category":"Conhecimentos Gerais","question":"DESAFIO MÁXIMO: qual é a capital do Azerbaijão. Qual é a resposta?","options":["Yerevan","Tbilisi","Baku","Astana"],"answer":"C"},{"id":2591,"difficulty":"Bônus / Mega difícil","points":1000,"category":"Conhecimentos Gerais","question":"MEGA DESAFIO BÔNUS: qual é a capital da Albânia. Qual alternativa está correta?","options":["Podgorica","Pristina","Tirana","Skopje"],"answer":"C"},{"id":2592,"difficulty":"Bônus / Mega difícil","points":1000,"category":"Conhecimentos Gerais","question":"PERGUNTA DO MILHÃO: qual é a capital da Macedônia do Norte. Você sabe a resposta?","options":["Skopje","Pristina","Sofia","Tirana"],"answer":"A"},{"id":2593,"difficulty":"Bônus / Mega difícil","points":1000,"category":"Conhecimentos Gerais","question":"ÚLTIMA CHANCE: qual é a capital de Montenegro. Escolha a alternativa correta.","options":["Budva","Tirana","Podgorica","Sarajevo"],"answer":"C"},{"id":2594,"difficulty":"Bônus / Mega difícil","points":1000,"category":"Conhecimentos Gerais","question":"DESAFIO MÁXIMO: qual é o símbolo químico do potássio. Qual é a resposta?","options":["Pt","P","K","Po"],"answer":"C"},{"id":2595,"difficulty":"Bônus / Mega difícil","points":1000,"category":"Conhecimentos Gerais","question":"MEGA DESAFIO BÔNUS: qual é o símbolo químico do tungstênio. Qual alternativa está correta?","options":["Th","W","Tu","T"],"answer":"B"},{"id":2596,"difficulty":"Bônus / Mega difícil","points":1000,"category":"Conhecimentos Gerais","question":"PERGUNTA DO MILHÃO: qual é o símbolo químico do sódio. Você sabe a resposta?","options":["Sd","So","S","Na"],"answer":"D"},{"id":2597,"difficulty":"Bônus / Mega difícil","points":1000,"category":"Conhecimentos Gerais","question":"ÚLTIMA CHANCE: qual é o símbolo químico do potássio. Escolha a alternativa correta.","options":["P","Kr","K","Ca"],"answer":"C"},{"id":2598,"difficulty":"Bônus / Mega difícil","points":1000,"category":"Conhecimentos Gerais","question":"DESAFIO MÁXIMO: qual é a unidade astronômica usada para distâncias médias no Sistema Solar. Qual é a resposta?","options":["quilômetro lunar","parsec","unidade astronômica","ano-luz"],"answer":"C"},{"id":2599,"difficulty":"Bônus / Mega difícil","points":1000,"category":"Mega Desafio","question":"MEGA DESAFIO BÔNUS: qual é o nome do processo pelo qual uma estrela semelhante ao Sol termina sua evolução e pode originar uma anã branca após expelir suas camadas externas. Qual alternativa está correta?","options":["buraco negro estelar em todos os casos","estrela de nêutrons em todos os casos","nebulosa planetária seguida de anã branca","supernova de par-instabilidade obrigatoriamente"],"answer":"C"},{"id":2600,"difficulty":"Bônus / Mega difícil","points":1000,"category":"Mega Desafio","question":"PERGUNTA DO MILHÃO: qual princípio afirma que não é possível conhecer simultaneamente, com precisão arbitrária, certas grandezas conjugadas como posição e momento. Você sabe a resposta?","options":["princípio de Pascal","princípio de Arquimedes","princípio da incerteza de Heisenberg","lei de Snell"],"answer":"C"}];
const rounds=[
 {p:100,d:"Fácil",pool:"Fácil"},{p:200,d:"Fácil",pool:"Fácil"},{p:250,d:"Fácil",pool:"Fácil"},
 {p:400,d:"Média",pool:"Média"},{p:500,d:"Média",pool:"Média"},
 {p:600,d:"Difícil",pool:"Difícil"},{p:800,d:"Difícil",pool:"Difícil"},
 {p:900,d:"SUPER DIFÍCIL",pool:"Super difícil / HARD"},{p:1000,d:"BÔNUS — MEGA DIFÍCIL",pool:"Bônus / Mega difícil"}
];
let round=0,points=0,current=null,locked=false,timerId=null,seconds=20;
const used={help:false,skip:false,eliminate:false};
const $=id=>document.getElementById(id);

function renderLevels(){
  $("levels").innerHTML=rounds.map((r,i)=>{
    const cls=i<round?"done":i===round?"active":i===8?"locked final":"locked";
    return `<div class="level ${cls}"><div class="case"><b>${i+1}</b></div><span class="value">${r.p.toLocaleString("pt-BR")}</span></div>`;
  }).join("");
}
function choose(){
  const pool=rounds[round].pool;
  const list=QUESTIONS.filter(q=>q.difficulty===pool);
  return list[Math.floor(Math.random()*list.length)];
}
function startTimer(){
  clearInterval(timerId);seconds=20;$("timer").style.width="100%";
  timerId=setInterval(()=>{seconds--;$("timer").style.width=(seconds/20*100)+"%";if(seconds<=0){clearInterval(timerId);finish("⏰ Tempo esgotado!",`A partida terminou na Rodada ${round+1}.`)}},1000);
}
function helpAvailable(){return round<=6 && !locked;}
function refreshToolStates(){
  ["help","skip","eliminate"].forEach(id=>$(id).disabled=used[id]||!helpAvailable());
}
function loadRound(){
  locked=false;current=choose();renderLevels();
  const r=rounds[round];
  $("difficulty").innerHTML=`<span>${r.d}</span> · ${r.p.toLocaleString("pt-BR")} pontos`;
  $("tag").textContent=`Rodada ${round+1} de 9`;
  $("question").textContent=current.question;
  $("answers").innerHTML=current.options.map((o,i)=>`<button class="answer" data-letter="${"ABCD"[i]}"><span>${"ABCD"[i]}</span>${o}</button>`).join("");
  document.querySelectorAll(".answer").forEach(b=>b.addEventListener("click",()=>answer(b)));
  $("coins").textContent=points.toLocaleString("pt-BR");
  $("status").textContent="";
  refreshToolStates();
  startTimer();
}
function answer(btn){
  if(locked)return;locked=true;clearInterval(timerId);
  document.querySelectorAll(".answer").forEach(b=>{b.disabled=true;if(b.dataset.letter===current.answer)b.classList.add("correct")});
  if(btn.dataset.letter===current.answer){
    btn.classList.add("correct");points=rounds[round].p;$("coins").textContent=points.toLocaleString("pt-BR");$("status").textContent="✅ Resposta correta!";
    setTimeout(()=>{if(round===8)finishMillion();else{round++;loadRound()}},750);
  }else{btn.classList.add("wrong");finish("❌ Resposta incorreta!",`A partida terminou na Rodada ${round+1}. Pontuação da partida: ${points.toLocaleString("pt-BR")} moedas.`)}
}
function useHelp(){
  if(!helpAvailable()||used.help)return;
  used.help=true;refreshToolStates();
  const idx="ABCD".indexOf(current.answer);
  const hints=[
    `💡 Dica: a resposta correta é a alternativa ${current.answer}.`,
    `💡 Dica: procure a alternativa que corresponde ao tema “${current.category}”. A melhor aposta é ${current.options[idx]}.`
  ];
  $("status").textContent=hints[Math.floor(Math.random()*hints.length)];
}
function useSkip(){
  if(!helpAvailable()||used.skip)return;
  used.skip=true;refreshToolStates();clearInterval(timerId);locked=true;
  $("status").textContent="⏭️ Pergunta pulada. Você permanece na mesma rodada.";
  setTimeout(loadRound,500);
}
function useEliminate(){
  if(!helpAvailable()||used.eliminate)return;
  used.eliminate=true;refreshToolStates();
  const wrong=[...document.querySelectorAll(".answer")].filter(b=>b.dataset.letter!==current.answer);
  const roll=Math.random();
  const count=roll<0.60?1:roll<0.90?2:3;
  wrong.sort(()=>Math.random()-.5).slice(0,count).forEach(b=>{b.disabled=true;b.classList.add("eliminated");b.innerHTML=`<span>${b.dataset.letter}</span>❌ Eliminada`});
  $("status").textContent=`❌ Eliminar usado: ${count} alternativa${count>1?"s":""} eliminada${count>1?"s":""}.`;
}
function finish(title,text){locked=true;clearInterval(timerId);["help","skip","eliminate"].forEach(id=>$(id).disabled=true);$("modalTitle").textContent=title;$("modalText").textContent=text;$("modal").classList.add("show")}
function finishMillion(){finish("👑 VOCÊ CHEGOU AO MILHÃO!","1.000 moedas + pacote com 10 figurinhas. O Coringa será sorteado dentro do pacote conforme a probabilidade configurada no ADM.");}
$("help").onclick=useHelp;$("skip").onclick=useSkip;$("eliminate").onclick=useEliminate;
$("stop").onclick=()=>{if(!locked)finish("🛑 Você parou!",`Pontuação da partida: ${points.toLocaleString("pt-BR")} moedas.`)};
$("quit").onclick=()=>{if(!locked)finish("Você desistiu",`Pontuação da partida: ${points.toLocaleString("pt-BR")} moedas.`)};
$("restart").onclick=()=>location.reload();
renderLevels();loadRound();
</script>
