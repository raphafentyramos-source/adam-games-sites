<title>Adam Games • Roleta</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

  min-height:100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:#fff;

  background:

      #20a9ff 0%,

    ),

    radial-gradient(

      #16b56e 0%,

    linear-gradient(

}

.container{

  width:100%;

  margin:auto;

}


/* =====================================================
   TOPO
===================================================== */

.logo{

  text-align:center;
  margin-bottom:8px;

}

.logo h1{

  font-size:
    clamp(
      25px,
      7vw,
      38px
    );

  font-weight:900;

}

.logo .adam{
  color:#fff;
}

.logo .games{
  color:#ffd329;
}

.subtitle{

  text-align:center;
  color:#c9e2f4;
  font-size:16px;
  margin-bottom:20px;

}


/* =====================================================
   GIROS
===================================================== */

.giros{

  width:min(100%,350px);

  margin:
    0 auto
    22px;

  padding:
    14px
    20px;

  border-radius:30px;

  text-align:center;

  background:
    rgba(4,48,91,.82);

  border:
    1px solid
    rgba(255,255,255,.15);

  box-shadow:
    0 12px 30px
    rgba(0,0,0,.2);

}

.giros-label{

  font-size:14px;
  letter-spacing:3px;
  font-weight:bold;
  color:#bcd9ed;

}

.giros-numero{

  margin-top:4px;
  font-size:46px;
  line-height:1;
  color:#ffd52b;
  font-weight:900;

}


/* =====================================================
   ROLETA
===================================================== */

.roleta-area{

  width:100%;

  display:flex;
  justify-content:center;

  margin:
    8px auto
    22px;

}

.roleta-wrap{

  position:relative;

  width:
    min(
      88vw,
      640px
    );

  aspect-ratio:1 / 1;

}


/* BORDA */

.roleta-borda{

  position:absolute;

  inset:0;

  border-radius:50%;

  background:#ffd329;

  padding:10px;

  box-shadow:
    0 0 0 7px
    rgba(0,0,0,.15),

    0 15px 35px
    rgba(0,0,0,.3);

}


/* ROLETA REAL */

#roleta{

  position:absolute;

  inset:10px;

  border-radius:50%;

  overflow:hidden;

  border:
    3px solid
    rgba(255,255,255,.85);

  transform:rotate(0deg);

  transform-origin:center center;

}


/*
==========================================================
FATIAS

A roleta agora usa CONIC-GRADIENT.

Isso garante que:

4 prêmios = 4 fatias de 90°

5 prêmios = 5 fatias de 72°

6 prêmios = 6 fatias de 60°

etc.

Sem deixar fundo azul/cinza sobrando.
==========================================================
*/

#roletaBase{

  position:absolute;

  inset:0;

  border-radius:50%;

  overflow:hidden;

}


/* IMAGENS DOS PRÊMIOS */

.roleta-imagem{

  position:absolute;

  left:50%;
  top:50%;

  width:17%;
  height:17%;

  transform-origin:
    center
    calc(
      var(--raio)
    );

  object-fit:contain;

  filter:
    drop-shadow(
      0 4px 5px
      rgba(0,0,0,.45)
    );

  z-index:5;

  pointer-events:none;

}


/* LINHAS DIVISÓRIAS */

.roleta-linha{

  position:absolute;

  left:50%;
  top:50%;

  width:50%;
  height:3px;

  background:
    rgba(0,0,0,.72);

  transform-origin:left center;

  z-index:8;

  pointer-events:none;

}


/* =====================================================
   CENTRO
===================================================== */

.centro{

  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(
      -50%,
      -50%
    );

  width:100px;
  height:100px;

  border-radius:50%;

  background:#ffd329;

  border:
    10px solid
    #fff;

  display:flex;

  align-items:center;
  justify-content:center;

  z-index:50;

  box-shadow:
    0 5px 18px
    rgba(0,0,0,.35);

  font-size:38px;

}


/* =====================================================
   PONTEIRO
===================================================== */

.ponteiro{

  position:absolute;

  z-index:100;

  left:50%;
  top:-5px;

  transform:
    translateX(-50%);

  width:0;
  height:0;

  border-left:
    28px solid
    transparent;

  border-right:
    28px solid
    transparent;

  border-top:
    65px solid
    #ffd329;

  filter:
    drop-shadow(
      0 4px 4px
      rgba(0,0,0,.3)
    );

}


/* =====================================================
   BOTÃO
===================================================== */

.girar{

  width:100%;
  max-width:600px;

  margin:0 auto;

  display:block;

  padding:
    20px
    15px;

  border:0;

  border-radius:18px;

  background:
    linear-gradient(
      135deg,
      #ffd52b,
      #f3a600
    );

  color:#06345f;

  font-size:
    clamp(
      20px,
      5vw,
      27px
    );

  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 10px 25px

}

.girar:disabled{

}

.aviso{

  text-align:center;

  color:#c5dced;

  margin-top:14px;

}


/* =====================================================
   MENSAGEM
===================================================== */

.message{

    20px auto;

  padding:14px;

  border-radius:14px;

}

.message.error{

}

.message.success{

  background:

}


/* =====================================================
   POSSIBILIDADES
===================================================== */

.card{

/* =====================================================

<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  updateDoc,
  addDoc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:
    "adam-games-21081.firebaseapp.com",

  projectId:
    "adam-games-21081",

  storageBucket:
    "adam-games-21081.firebasestorage.app",

  messagingSenderId:
    "1055528418738",

  appId:
    "1:1055528418738:web:5fafdf63424ba9744eb8ab"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================================
   ESTADO
===================================================== */

let usuarioAuth = null;

let usuarioDoc = null;

let usuarioRef = null;

let premios = [];

let girando = false;

let rotacaoAtual = 0;


/* =====================================================
   ELEMENTOS
===================================================== */

const girosEl =
  document.getElementById(
    "giros"
  );

const roletaEl =
  document.getElementById(
    "roleta"
  );

const roletaBase =
  document.getElementById(
    "roletaBase"
  );

const girarBtn =
  document.getElementById(
    "girar"
  );

const messageEl =
  document.getElementById(
    "message"
  );

const listaPremios =
  document.getElementById(
    "listaPremios"
  );

const historicoLista =
  document.getElementById(
    "historicoLista"
  );

const modal =
  document.getElementById(
    "modal"
  );

const modalPremio =
  document.getElementById(
    "modalPremio"
  );

const modalImg =
  document.getElementById(
    "modalImg"
  );

const modalData =
  document.getElementById(
    "modalData"
  );


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
  texto,
  tipo
){

  messageEl.textContent =
    texto;

  messageEl.className =
    "message";

  if(
    texto &&
    tipo
  ){

    messageEl.classList.add(
      tipo
    );

  }

}


/* =====================================================
   LOCALIZAR USUÁRIO
===================================================== */

async function localizarUsuario(
  usuario
){

  try{

    const resultadoUID =
      await getDocs(

        query(

          collection(
            db,
            "admins"
          ),

          where(
            "uid",
            "==",
            usuario.uid
          )

        )

      );


    if(
      !resultadoUID.empty
    ){

      return {

        ref:
          resultadoUID.docs[0].ref,

        id:
          resultadoUID.docs[0].id,

        data:
          resultadoUID.docs[0].data()

      };

    }

  }
  catch(error){

    console.error(
      "Busca UID:",
      error
    );

  }


  if(
    usuario.email
  ){

    try{

      const email =
        usuario.email
          .trim()
          .toLowerCase();


      const resultadoEmail =
        await getDocs(

          query(

            collection(
              db,
              "admins"
            ),

            where(
              "email",
              "==",
              email
            )

          )

        );


      if(
        !resultadoEmail.empty
      ){

        return {

          ref:
            resultadoEmail.docs[0].ref,

          id:
            resultadoEmail.docs[0].id,

          data:
            resultadoEmail.docs[0].data()

        };

      }

    }
    catch(error){

      console.error(
        "Busca email:",
        error
      );

    }

  }


  return null;

}


/* =====================================================
   GIROS
===================================================== */

function atualizarGiros(){

  if(
    !usuarioDoc
  ){

    girosEl.textContent =
      "0";

    girarBtn.disabled =
      true;

    return;

  }


  const quantidade =
    Number(
      usuarioDoc.girosRoleta ||
      0
    );


  girosEl.textContent =
    quantidade.toLocaleString(
      "pt-BR"
    );


  girarBtn.disabled =
    quantidade <= 0 ||
    girando ||
    premios.length === 0;

}


/* =====================================================
   CARREGAR PRÊMIOS
===================================================== */

async function carregarPremios(){

  try{

    const resultado =
      await getDocs(

        collection(
          db,
          "premiosRoleta"
        )

      );


    premios =

      resultado.docs

        .map(
          documento => ({

            id:
              documento.id,

            ...documento.data()

          })
        )

        .filter(
          premio =>
            premio.ativo === true
        );


    desenharRoleta();

    mostrarPossibilidades();

    atualizarGiros();

  }
  catch(error){

    console.error(
      "Erro ao carregar prêmios:",
      error
    );


    listaPremios.innerHTML =

      "<div class='sem-premios'>" +
      "❌ Não foi possível carregar os prêmios." +
      "</div>";

  }

}


/* =====================================================
   DESENHAR ROLETA
===================================================== */

function desenharRoleta(){

  roletaBase.innerHTML =
    "";

  roletaBase.style.background =
    "";

  if(
    premios.length === 0
  ){

    roletaBase.style.background =
      "#102d4e";

    return;

  }


  const quantidade =
    premios.length;


  const angulo =
    360 /
    quantidade;


  const cores = [

    "#18a96b",
    "#eaae10",
    "#a83bd1",
    "#1685d4",
    "#e73583",
    "#7c4dff",
    "#e75d25",
    "#2ab7a9",
    "#d93d3d",
    "#5b63d8",
    "#d68c19",
    "#16a86b"

  ];


  /*
  ------------------------------------------------------
  CRIA O FUNDO DA PIZZA
  ------------------------------------------------------
  */

  const partes = [];

  let inicio = 0;


  premios.forEach(
    (
      premio,
      indice
    ) => {

      const fim =
        inicio +
        angulo;


      const cor =
        premio.cor ||
        cores[
          indice %
          cores.length
        ];


      partes.push(
        `${cor} ${inicio}deg ${fim}deg`
      );


      inicio =
        fim;

    }
  );


  roletaBase.style.background =
    `conic-gradient(${partes.join(",")})`;


  /*
  ------------------------------------------------------
  IMAGENS DOS PRÊMIOS
  ------------------------------------------------------
  */

  const raio =
    31;


  premios.forEach(
    (
      premio,
      indice
    ) => {

      const meio =
        indice *
        angulo +
        angulo / 2;


      if(
        premio.imagem
      ){

        const img =
          document.createElement(
            "img"
          );


        img.className =
          "roleta-imagem";


        img.src =
          premio.imagem;


        img.alt =
          premio.nome ||
          "Prêmio";


        img.style.setProperty(
          "--raio",
          `${raio}%`
        );


        /*
        A imagem vai para o meio
        da respectiva fatia.
        */

        img.style.transform =

          `
            translate(-50%, -50%)
            rotate(${meio}deg)
            translateY(-${raio}%)
            rotate(-${meio}deg)
          `;


        img.onerror =
          () => {

            img.remove();

          };


        roletaBase.appendChild(
          img
        );

      }

    }
  );


  /*
  ------------------------------------------------------
  LINHAS DAS FATIAS
  ------------------------------------------------------
  */

  premios.forEach(
    (
      premio,
      indice
    ) => {

      const anguloLinha =
        indice *
        angulo;


      if(
        indice === 0
      ){

        return;

      }


      const linha =
        document.createElement(
          "div"
        );


      linha.className =
        "roleta-linha";


      linha.style.transform =
        `rotate(${anguloLinha}deg)`;


      roletaBase.appendChild(
        linha
      );

    }
  );

}


/* =====================================================
   POSSIBILIDADES
===================================================== */

function mostrarPossibilidades(){

  listaPremios.innerHTML =
    "";


  if(
    premios.length === 0
  ){

    listaPremios.innerHTML =

      "<div class='sem-premios'>" +
      "Nenhum prêmio cadastrado na roleta." +
      "</div>";

    return;

  }


  premios.forEach(
    premio => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "premio-publico";


      const imagemBox =
        document.createElement(
          "div"
        );


      imagemBox.className =
        "premio-publico-img";


      if(
        premio.imagem
      ){

        const img =
          document.createElement(
            "img"

        );

}


/* =====================================================
   SORTEIO
===================================================== */

function escolherPremio(){

  if(
    premios.length === 0
  ){

    return null;

  }


  let total =
    0;


  premios.forEach(
    premio => {

      total +=
        Number(
          premio.peso ||
          1
        );

    }
  );


  let sorteio =
    Math.random() *
    total;


  for(
    const premio
    of premios
  ){

    sorteio -=
      Number(
        premio.peso ||
        1
      );


    if(
      sorteio <= 0
    ){

      return premio;

    }

  }


  return premios[
    premios.length - 1
  ];

}


/* =====================================================
   LOCAL STORAGE — HISTÓRICO DE SEGURANÇA
===================================================== */

function chaveHistorico(){

  if(
    !usuarioAuth
  ){

    return "adamGamesHistoricoRoleta";

  }


  return (
    "adamGamesHistoricoRoleta_" +
    usuarioAuth.uid
  );

}


function obterHistoricoLocal(){

  try{

    const dados =
      localStorage.getItem(
        chaveHistorico()
      );


    if(
      !dados
    ){

      return [];

    }


    const lista =
      JSON.parse(
        dados
      );


    return Array.isArray(
      lista
    )
      ? lista
      : [];

  }
  catch(error){

    console.error(
      "Erro histórico local:",
      error
    );

    return [];

  }

}


function salvarHistoricoLocal(
  registro
){

  try{

    const lista =
      obterHistoricoLocal();


    lista.unshift(
      registro
    );


    const limitada =
      lista.slice(
        0,
        50
      );


    localStorage.setItem(

      chaveHistorico(),

      JSON.stringify(
        limitada
      )

    );

  }
  catch(error){

    console.error(
      "Erro salvando histórico local:",
      error
    );

  }

}


/* =====================================================
   DATA
===================================================== */

function formatarData(
  data
){

  if(
    !data
  ){

    return "—";

  }


  let dataObjeto;


  if(
    data.toDate
  ){

    dataObjeto =
      data.toDate();

  }
  else if(
    typeof data ===
    "number"
  ){

    dataObjeto =
      new Date(
        data
      );

  }
  else{

    dataObjeto =
      new Date(
        data
      );

  }


  if(
    Number.isNaN(
      dataObjeto.getTime()
    )
  ){

    return "—";

  }


  return dataObjeto.toLocaleString(
    "pt-BR"
  );

}


/* =====================================================
   MOSTRAR UM RESULTADO NO HISTÓRICO
===================================================== */

function criarElementoHistorico(

){

    );

      :

      :

/* =====================================================
   CARREGAR HISTÓRICO
===================================================== */

async function carregarHistorico(){

  historicoLista.innerHTML =
    "";


  /*
  ------------------------------------------------------
  PRIMEIRO: MOSTRA HISTÓRICO LOCAL
  ------------------------------------------------------
  */

  const local =
    obterHistoricoLocal();


  local.forEach(
    registro => {

      historicoLista.appendChild(
        criarElementoHistorico(
          registro
        )
      );

    }
  );


  /*
  ------------------------------------------------------
  DEPOIS: TENTA FIREBASE
  ------------------------------------------------------
  */

  if(
    !usuarioAuth
  ){

    if(
      local.length === 0
    ){

      historicoLista.innerHTML =

        "<div class='sem-premios'>" +
        "Nenhum resultado registrado ainda." +
        "</div>";

    }

    return;

  }


  try{

    const resultado =
      await getDocs(

        query(

          collection(
            db,
            "resultadosRoleta"
          ),

          where(
            "usuarioId",
            "==",
            usuarioAuth.uid
          )

        )

      );


    const firebaseRegistros =

      resultado.docs

        .map(
          documento => ({

            id:
              documento.id,

            ...documento.data(),

            salvoFirebase:
              true

          })
        );


    /*
    ----------------------------------------------------
    MESCLA FIREBASE + LOCAL
    ----------------------------------------------------
    */

    const mapa =
      new Map();


    firebaseRegistros.forEach(
      registro => {

        mapa.set(
          registro.id,
          registro
        );

      }
    );


    local.forEach(
      registro => {

        if(
          registro.id &&
          mapa.has(
            registro.id
          )
        ){

          return;

        }


        mapa.set(

          registro.id ||
          (
            "local_" +
            Date.now() +
            Math.random()
          ),

          registro

        );

      }
    );


    const todos =
      Array.from(
        mapa.values()
      );


    todos.sort(
      (
        a,
        b
      ) => {

        const aTempo =
          obterTempo(
            a.criadoEm
          );

        const bTempo =
          obterTempo(
            b.criadoEm
          );

        return bTempo - aTempo;

      }
    );


    historicoLista.innerHTML =
      "";


    if(
      todos.length === 0
    ){

      historicoLista.innerHTML =

        "<div class='sem-premios'>" +
        "Você ainda não realizou nenhum giro." +
        "</div>";

      return;

    }


    todos.forEach(
      registro => {

        historicoLista.appendChild(
          criarElementoHistorico(
            registro
          )
        );

      }
    );

  }
  catch(error){

    console.error(
      "Histórico Firebase indisponível:",
      error
    );


    /*
    Se Firebase bloquear a leitura,
    NÃO apaga o histórico local.
    */

    if(
      local.length === 0
    ){

      historicoLista.innerHTML =

        "<div class='sem-premios'>" +
        "📱 Histórico temporariamente indisponível. " +
        "Novos resultados serão mantidos neste aparelho." +
        "</div>";

    }

  }

}


/* =====================================================
   TEMPO
===================================================== */

function obterTempo(
  valor
){

  if(
    !valor
  ){

    return 0;

  }


  if(
    valor.seconds
  ){

    return (
      valor.seconds *
      1000
    );

  }


  const tempo =
    new Date(
      valor
    ).getTime();


  return Number.isNaN(
    tempo
  )
    ? 0
    : tempo;

}


/* =====================================================
   GIRAR ROLETA
===================================================== */

async function girarRoleta(){

  if(
    girando
  ){

    return;

  }


  if(
    !usuarioDoc ||
    !usuarioRef
  ){

    mostrarMensagem(
      "Não foi possível encontrar seu cadastro.",
      "error"
    );

    return;

  }


  const girosAtuais =
    Number(
      usuarioDoc.girosRoleta ||
      0
    );


  if(
    girosAtuais <= 0
  ){

    mostrarMensagem(
      "Você não possui giros disponíveis.",
      "error"
    );

    return;

  }


  if(
    premios.length === 0
  ){

    mostrarMensagem(
      "Nenhum prêmio está disponível na roleta.",
      "error"
    );

    return;

  }


  girando =
    true;


  atualizarGiros();


  mostrarMensagem(
    "",
    ""
  );


  /*
  ------------------------------------------------------
  ESCOLHE O PRÊMIO
  ------------------------------------------------------
  */

  const premio =
    escolherPremio();


  if(
    !premio
  ){

    girando =
      false;

    atualizarGiros();

    return;

  }


  const indice =
    premios.findIndex(
      p =>
        p.id ===
        premio.id
    );


  const quantidade =
    premios.length;


  const angulo =
    360 /
    quantidade;


  /*
  ------------------------------------------------------
  O CENTRO DA FATIA É O PONTO
  QUE DEVE PARAR NO PONTEIRO.
  ------------------------------------------------------
  */

  const centroDaFatia =
    (
      indice *
      angulo
    ) +
    (
      angulo / 2
    );


  const voltas =
    6;


  const alvo =
    360 -
    centroDaFatia;


  const rotacaoFinal =
    rotacaoAtual +
    (
      voltas * 360
    ) +
    alvo;


  roletaEl.style.transition =
    "transform 5.5s cubic-bezier(.12,.72,.18,1)";


  roletaEl.style.transform =
    `rotate(${rotacaoFinal}deg)`;


  rotacaoAtual =
    rotacaoFinal;


  /*
  ------------------------------------------------------
  ESPERA TERMINAR
  ------------------------------------------------------
  */

  await new Promise(
    resolve =>
      setTimeout(
        resolve,
        5700
      )
  );


  /*
  ------------------------------------------------------
  AGORA DESCONTA O GIRO.
  ------------------------------------------------------
  */

  const novoSaldo =
    Math.max(
      0,
      girosAtuais - 1
    );


  try{

    await updateDoc(

      usuarioRef,

      {

        girosRoleta:
          novoSaldo

      }

    );


    usuarioDoc.girosRoleta =
      novoSaldo;

  }
  catch(error){

    console.error(
      "Erro ao descontar giro:",
      error
    );


    /*
    Não mostra prêmio como se tivesse
    dado erro.

    O usuário já viu o resultado.
    */

    usuarioDoc.girosRoleta =
      novoSaldo;

  }


  atualizarGiros();


  /*
  ------------------------------------------------------
  CRIA O REGISTRO LOCAL PRIMEIRO.
  
  Isso garante que o histórico NÃO desapareça
  mesmo se Firestore bloquear a gravação.
  ------------------------------------------------------
  */

  const agora =
    new Date();


  const idLocal =

    "local_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,8);


  const registroLocal = {

    id:
      idLocal,

    usuarioId:
      usuarioAuth.uid,

    usuarioDocId:
      usuarioDoc._docId ||
      "",

    usuarioEmail:
      usuarioAuth.email ||
      usuarioDoc.email ||
      "",

    usuarioNome:
      usuarioDoc.nome ||
      usuarioDoc.name ||
      "",

    premioId:
      premio.id,

    premioNome:
      premio.nome ||
      "",

    quantidade:
      Number(
        premio.quantidade ||
        0
      ),

    tipo:
      premio.tipo ||
      "outro",

    imagem:
      premio.imagem ||
      "",

    criadoEm:
      agora.toISOString(),

    entregue:
      false,

    salvoFirebase:
      false

  };


  salvarHistoricoLocal(
    registroLocal
  );


  /*
  ------------------------------------------------------
  TENTA REGISTRAR NO FIREBASE
  ------------------------------------------------------
  */

  let registroId =
    idLocal;


  try{

    const registro =
      await addDoc(

        collection(
          db,
          "resultadosRoleta"
        ),

        {

          usuarioId:
            usuarioAuth.uid,

          usuarioDocId:
            usuarioDoc._docId ||
            "",

          usuarioEmail:
            usuarioAuth.email ||
            usuarioDoc.email ||
            "",

          usuarioNome:
            usuarioDoc.nome ||
            usuarioDoc.name ||
            "",

          premioId:
            premio.id,

          premioNome:
            premio.nome ||
            "",

          quantidade:
            Number(
              premio.quantidade ||
              0
            ),

          tipo:
            premio.tipo ||
            "outro",

          imagem:
            premio.imagem ||
            "",

          saldoGirosAnterior:
            girosAtuais,

          saldoGirosFinal:
            novoSaldo,

          entregue:
            false,

          criadoEm:
            serverTimestamp()

        }

      );


    registroId =
      registro.id;


    /*
    Atualiza o ID local para o ID real
    do Firebase.

    */

    const historicoAtual =
      obterHistoricoLocal();


    const atualizado =
      historicoAtual.map(
        registroLocal => {

          if(
            registroLocal.id ===
            idLocal
          ){

            return {

              ...registroLocal,

              id:
                registro.id,

              salvoFirebase:
                true

            };

          }


          return registroLocal;

        }
      );


    localStorage.setItem(

      chaveHistorico(),

      JSON.stringify(
        atualizado
      )

    );

  }
  catch(error){

    /*
    ----------------------------------------------------
    FIREBASE PODE ESTAR BLOQUEANDO A COLLECTION.
    
    MAS ISSO NÃO É MAIS UM ERRO DO GIRO.
    O resultado já está salvo localmente.
    ----------------------------------------------------
    */

    console.warn(
      "Firebase não registrou o histórico:",
      error
    );

  }


  /*
  ------------------------------------------------------
  MOSTRA O PRÊMIO.
  ------------------------------------------------------
  */

  mostrarResultado(

    premio,

    registroId

  );


  /*
  Atualiza histórico imediatamente.
  */

  await carregarHistorico();


  girando =
    false;


  atualizarGiros();

}


/* =====================================================
   MOSTRAR RESULTADO
===================================================== */

function mostrarResultado(
  premio,
  registroId
){

  modalPremio.textContent =

    (
      Number(
        premio.quantidade ||
        0
      )
    ).toLocaleString(
      "pt-BR"
    ) +

    " " +

    (
      premio.nome ||
      "Prêmio"
    );


  modalImg.innerHTML =
    "";


  if(
    premio.imagem
  ){

    const img =
      document.createElement(
        "img"
      );


    img.src =
      premio.imagem;


    img.alt =
      "Prêmio";


    img.onerror =
      () => {

        modalImg.textContent =
          "🎁";

      };


    modalImg.appendChild(
      img
    );

  }
  else{

    modalImg.textContent =
      "🎁";

  }


  modalData.textContent =

    "Giro realizado em " +

    new Date()
      .toLocaleString(
        "pt-BR"
      ) +

    " • Resultado registrado";


  modal.classList.add(
    "show"
  );

}


/* =====================================================
   AUTENTICAÇÃO
===================================================== */

onAuthStateChanged(

  auth,

  async usuario => {

    if(
      !usuario
    ){

      window.location.replace(
        "index.html"
      );

      return;

    }


    usuarioAuth =
      usuario;


    try{

      const cadastro =
        await localizarUsuario(
          usuario
        );


      if(
        !cadastro
      ){

        mostrarMensagem(
          "Não foi possível encontrar seu cadastro.",
          "error"
        );

        girosEl.textContent =
          "0";

        girarBtn.disabled =
          true;

        return;

      }


      usuarioRef =
        cadastro.ref;


      usuarioDoc = {

        ...cadastro.data,

        _docId:
          cadastro.id

      };


      await carregarPremios();

      await carregarHistorico();

      atualizarGiros();

    }
    catch(error){

      console.error(
        "Erro geral:",
        error
      );


      mostrarMensagem(
        "Ocorreu um erro ao carregar a roleta.",
        "error"
      );

    }

  }

);

   EVENTOS

girarBtn.addEventListener(

);


document

  )
  .addEventListener(

      modal.classList.remove(

      );

    }
  );


</script>
