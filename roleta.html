===================================================== */

    0

}


canvas{

  height:100%;

  display:block;

  border-radius:50%;

  filter:
    drop-shadow(
      0 18px 30px
      rgba(0,0,0,.4)
    );

}


.pointer{

  position:absolute;

  z-index:5;

  top:-5px;

  left:50%;

  transform:
    translateX(-50%);

  width:0;

  height:0;

  border-left:
    22px solid transparent;

  border-right:
    22px solid transparent;

  border-top:
    0 solid transparent;

  border-bottom:
    55px solid #ffd52a;

  filter:
    drop-shadow(
      0 4px 6px
      rgba(0,0,0,.4)
    );

}


.pointer::after{

  content:"";

  position:absolute;

  left:-11px;

  top:0;

  width:22px;

  height:22px;

  border-radius:50%;

  background:#ffd52a;

}


/* =====================================================
   BOTÃO
===================================================== */

.girar{

  display:block;

  width:

<script type="module">


/* =====================================================

from

from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:
    "adam-games-21081.firebaseapp.com",

  projectId:
    "adam-games-21081",

  storageBucket:
    "adam-games-21081.firebasestorage.app",

  messagingSenderId:
    "1055528418738",

  appId:
    "1:1055528418738:web:5fafdf63424ba9744eb8ab"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================================
   VARIÁVEIS
===================================================== */

let usuarioAtual =
  null;

let premios =
  [];

let anguloAtual =
  0;

let girando =
  false;


/* =====================================================
   ELEMENTOS
===================================================== */

const canvas =
  document.getElementById(
    "roleta"
  );

const ctx =
  canvas.getContext(
    "2d"
  );

const girosNumero =
  document.getElementById(
    "girosNumero"
  );

const girar =
  document.getElementById(
    "girar"
  );

const possibilidades =
  document.getElementById(
    "possibilidades"
  );

const historico =
  document.getElementById(
    "historico"
  );

const resultado =
  document.getElementById(
    "resultado"
  );

const resultadoImagem =
  document.getElementById(
    "resultadoImagem"
  );

const resultadoPremio =
  document.getElementById(
    "resultadoPremio"
  );

const resultadoData =
  document.getElementById(
    "resultadoData"
  );


/* =====================================================
   CORES DAS FATIAS
===================================================== */

const cores = [

  "#167bd4",
  "#19a86b",
  "#d99718",
  "#a43bd2",
  "#dc4141",
  "#168fa3",
  "#d35b9c",
  "#5278d8",
  "#e17d24",
  "#3aaf72",
  "#7c52c9",
  "#c94370",
  "#2775ad",
  "#bd8b19"

];


/* =====================================================
   FORMATAÇÃO
===================================================== */

function formatarNumero(
  valor
){

  return Number(
    valor || 0
  ).toLocaleString(
    "pt-BR"
  );

}


function textoPremio(
  premio
){

  const quantidade =
    formatarNumero(
      premio.quantidade
    );


  return (
    quantidade +
    " " +
    (
      premio.nome ||
      "Prêmio"
    )
  );

}


/* =====================================================
   PESO
===================================================== */

function sortearPorPeso(
  lista
){

  const total =
    lista.reduce(
      (
        soma,
        premio
      ) =>
        soma +
        Math.max(
          1,
          Number(
            premio.peso || 1
          )
        ),
      0
    );


  let alvo =
    Math.random() *
    total;


  for(
    const premio of lista
  ){

    alvo -=
      Math.max(
        1,
        Number(
          premio.peso || 1
        )
      );


    if(
      alvo <= 0
    ){

      return premio;

    }

  }


  return lista[
    lista.length - 1
  ];

}


/* =====================================================
   CARREGAR PRÊMIOS
===================================================== */

async function carregarPremios(){

  possibilidades.innerHTML =
    `
    <div class="carregando">
      🔄 Carregando prêmios...
    </div>
    `;


  try{

    const referencia =
      collection(
        db,
        "premiosRoleta"
      );


    const consulta =
      query(
        referencia,
        where(
          "ativo",
          "==",
          true
        )
      );


    const resultado =
      await getDocs(
        consulta
      );


    premios =
      resultado.docs.map(
        documento => ({

          id:
            documento.id,

          ...documento.data()

        })
      );


    /*
    Ordenação estável.
    */

    premios.sort(
      (
        a,
        b
      ) =>
        String(
          a.nome || ""
        ).localeCompare(
          String(
            b.nome || ""
          ),
          "pt-BR"
        )
    );


    mostrarPossibilidades();


    desenharRoleta();


  }
  catch(error){

    console.error(
      "Erro ao carregar prêmios:",
      error
    );


    possibilidades.innerHTML =
      `
      <div class="sem-premios">
        ❌ Não foi possível carregar os prêmios da roleta.
      </div>
      `;

  }

}


/* =====================================================
   POSSIBILIDADES
===================================================== */

function mostrarPossibilidades(){

  possibilidades.innerHTML =
    "";


  if(
    premios.length === 0
  ){

    possibilidades.innerHTML =
      `
      <div class="sem-premios">
        Nenhum prêmio ativo foi cadastrado na roleta.
      </div>
      `;

    return;

  }


  premios.forEach(
    (
      premio,
      indice
    ) => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "premio-lista";


      const imagem =
        document.createElement(
          "div"
        );


      imagem.className =
        "lista-imagem";


      if(
        premio.imagem
      ){

        const img =
          document.createElement(
            "img"
          );


        img.src =
          premio.imagem;


        img.alt =
          "";


        img.onerror =
          () => {

            imagem.innerHTML =
              "🎁";

          };


        imagem.appendChild(
          img
        );

      }
      else{

        imagem.textContent =
          "🎁";

      }


      const textos =
        document.createElement(
          "div"
        );


      const nome =
        document.createElement(
          "div"
        );


      nome.className =
        "lista-nome";


      nome.textContent =
        premio.nome ||
        "Prêmio";


      const quantidade =
        document.createElement(
          "div"
        );


      quantidade.className =
        "lista-quantidade";


      quantidade.textContent =
        formatarNumero(
          premio.quantidade
        ) +
        " unidades";


      textos.appendChild(
        nome
      );

      textos.appendChild(
        quantidade
      );


      item.appendChild(
        imagem
      );

      item.appendChild(
        textos
      );


      possibilidades.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   DESENHAR ROLETA
===================================================== */

function desenharRoleta(){

  const total =
    premios.length;


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  if(
    total === 0
  ){

    desenharRoletaVazia();

    return;

  }


  const centro =
    canvas.width / 2;


  const raio =
    centro - 22;


  const tamanhoFatia =
    (
      Math.PI * 2
    ) /
    total;


  for(
    let i = 0;
    i < total;
    i++
  ){

    const inicio =
      anguloAtual +
      i *
      tamanhoFatia;


    const fim =
      inicio +
      tamanhoFatia;


    ctx.beginPath();


    ctx.moveTo(
      centro,
      centro
    );


    ctx.arc(
      centro,
      centro,
      raio,
      inicio,
      fim
    );


    ctx.closePath();


    /*
    Se existir imagem,
    ela será desenhada dentro
    da fatia.

    O texto do prêmio NÃO aparece.
    */

    ctx.fillStyle =
      cores[
        i %
        cores.length
      ];


    ctx.fill();


    ctx.lineWidth =
      5;


    ctx.strokeStyle =
      "#071d38";


    ctx.stroke();


    /*
    Imagem temática da fatia.
    */

    const imagem =
      premios[i].imagem;


    if(
      imagem
    ){

      const img =
        new Image();


      img.onload =
        () => {

          const meio =
            inicio +
            tamanhoFatia / 2;


          const distancia =
            raio * .60;


          const x =
            centro +
            Math.cos(meio) *
            distancia;


          const y =
            centro +
            Math.sin(meio) *
            distancia;


          const tamanho =
            Math.min(
              82,
              tamanhoFatia *
              raio *
              .52
            );


          ctx.save();


          ctx.beginPath();


          ctx.arc(
            x,
            y,
            tamanho / 2,
            0,
            Math.PI * 2
          );


          ctx.clip();


          ctx.drawImage(
            img,
            x - tamanho / 2,
            y - tamanho / 2,
            tamanho,
            tamanho
          );


          ctx.restore();

        };


      img.src =
        imagem;

    }

  }


  /*
  Borda externa.
  */

  ctx.beginPath();


  ctx.arc(
    centro,
    centro,
    raio,
    0,
    Math.PI * 2
  );


  ctx.lineWidth =
    14;


  ctx.strokeStyle =
    "#ffd52a";


  ctx.stroke();


  /*
  Borda interna.
  */

  ctx.beginPath();


  ctx.arc(
    centro,
    centro,
    raio - 13,
    0,
    Math.PI * 2
  );


  ctx.lineWidth =
    3;


  ctx.strokeStyle =
    "#ffffff";


  ctx.stroke();


  /*
  Centro.
  */

  ctx.beginPath();


  ctx.arc(
    centro,
    centro,
    68,
    0,
    Math.PI * 2
  );


  ctx.fillStyle =
    "#ffffff";


  ctx.fill();


  ctx.beginPath();


  ctx.arc(
    centro,
    centro,
    57,
    0,
    Math.PI * 2
  );


  ctx.fillStyle =
    "#ffc928";


  ctx.fill();


  ctx.font =
    "44px Arial";


  ctx.textAlign =
    "center";


  ctx.textBaseline =
    "middle";


  ctx.fillText(
    "🎰",
    centro,
    centro
  );

}


/* =====================================================
   ROLETA VAZIA
===================================================== */

function desenharRoletaVazia(){

  const centro =
    canvas.width / 2;


  const raio =
    centro - 22;


  ctx.beginPath();


  ctx.arc(
    centro,
    centro,
    raio,
    0,
    Math.PI * 2
  );


  ctx.fillStyle =
    "#132f4f";


  ctx.fill();


  ctx.lineWidth =
    14;


  ctx.strokeStyle =
    "#ffd52a";


  ctx.stroke();


  ctx.font =
    "70px Arial";


  ctx.textAlign =
    "center";


  ctx.textBaseline =
    "middle";


  ctx.fillText(
    "🎰",
    centro,
    centro
  );

}


/* =====================================================
   ATUALIZAR GIROS
===================================================== */

function atualizarGiros(
  valor
){

  const numero =
    Math.max(
      0,
      Number(
        valor || 0
      )
    );


  girosNumero.textContent =
    numero;


  girar.disabled =
    numero <= 0 ||
    premios.length === 0 ||
    girando;

}


/* =====================================================
   LOCALIZAR USUÁRIO
===================================================== */

async function carregarDadosUsuario(){

  if(
    !usuarioAtual
  ){

    return;

  }


  try{

    const referencia =
      collection(
        db,
        "admins"
      );


    const consulta =
      query(
        referencia,
        where(
          "uid",
          "==",
          usuarioAtual.uid
        )
      );


    const resultado =
      await getDocs(
        consulta
      );


    if(
      resultado.empty
    ){

      atualizarGiros(0);

      return;

    }


    const dados =
      resultado.docs[0].data();


    /*
    O sistema usa girosRoleta
    exclusivamente para a roleta.

    Se ainda não existir,
    fica em zero.
    */

    atualizarGiros(
      dados.girosRoleta || 0
    );

  }
  catch(error){

    console.error(
      "Erro ao carregar usuário:",
      error
    );

    atualizarGiros(0);

  }

}

/* =====================================================
   GIRO
===================================================== */

async function girarRoleta(){

  if(
    girando ||
    !usuarioAtual ||
    premios.length === 0
  ){

    return;

  }


  girando =
    true;


  girar.disabled =
    true;


  try{

    /*
    Primeiro reserva/consome
    um giro no Firebase.
    */

    const referencia =
      collection(
        db,
        "admins"
      );


    const consulta =
      query(
        referencia,
        where(
          "uid",
          "==",
          usuarioAtual.uid
        )
      );


    const resultadoUsuario =
      await getDocs(
        consulta
      );


    if(
      resultadoUsuario.empty
    ){

      throw new Error(
        "Usuário não encontrado."
      );

    }


    const documentoUsuario =
      resultadoUsuario.docs[0];


    const referenciaUsuario =
      documentoUsuario.ref;


    const premio =
      sortearPorPeso(
        premios
      );


    /*
    Transação para evitar
    dois giros simultâneos.
    */

    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            referenciaUsuario
          );


        const dados =
          snap.data() ||
          {};


        const giros =
          Number(
            dados.girosRoleta || 0
          );


        if(
          giros <= 0
        ){

          throw new Error(
            "Você não possui giros disponíveis."
          );

        }


        transaction.update(
          referenciaUsuario,
          {

            girosRoleta:
              giros - 1

          }
        );

      }
    );


    /*
    Escolhe a posição da fatia
    correspondente ao prêmio.
    */

    const indice =
      premios.findIndex(
        item =>
          item.id ===
          premio.id
      );


    const total =
      premios.length;


    const tamanhoFatia =
      (
        Math.PI * 2
      ) /
      total;


    /*
    A seta está no topo.
    Calculamos o centro da fatia
    desejada e fazemos várias voltas.
    */

    const centroFatia =
      indice *
      tamanhoFatia +
      tamanhoFatia / 2;


    const alvo =
      (
        Math.PI * 1.5
      ) -
      centroFatia;


    const voltas =
      6 +
      Math.floor(
        Math.random() * 3
      );


    const inicio =
      anguloAtual;


    let delta =
      alvo -
      inicio;


    while(
      delta < 0
    ){

      delta +=
        Math.PI * 2;

    }


    delta +=
      voltas *
      Math.PI *
      2;


    const duracao =
      5000;


    const inicioTempo =
      performance.now();


    function animar(
      tempo
    ){

      const progresso =
        Math.min(
          1,
          (
            tempo -
            inicioTempo
          ) /
          duracao
        );


      /*
      Ease-out.
      */

      const ease =
        1 -
        Math.pow(
          1 - progresso,
          4
        );


      anguloAtual =
        inicio +
        delta *
        ease;


      desenharRoleta();


      if(
        progresso < 1
      ){

        requestAnimationFrame(
          animar
        );

      }
      else{

        anguloAtual =
          anguloAtual %
          (
            Math.PI * 2
          );


        finalizarGiro(
          premio
        );

      }

    }


    requestAnimationFrame(
      animar
    );

  }
  catch(error){

    console.error(
      "Erro no giro:",
      error
    );


    alert(
      "❌ " +
      (
        error.message ||
        "Não foi possível realizar o giro."
      )
    );


    girando =
      false;


    await carregarDadosUsuario();

  }

}


/* =====================================================
   FINALIZAR GIRO
===================================================== */

async function finalizarGiro(
  premio
){

  const data =
    new Date();


  try{

    await registrarResultado(
      premio,
      data
    );


    resultadoPremio.textContent =
      textoPremio(
        premio
      );


    resultadoData.textContent =
      "Giro realizado em " +
      data.toLocaleString(
        "pt-BR"
      );


    resultadoImagem.innerHTML =
      "";


    if(
      premio.imagem
    ){

      const img =
        document.createElement(
          "img"
        );


      img.src =
        premio.imagem;


      img.alt =
        premio.nome ||
        "Prêmio";


      img.onerror =
        () => {

          resultadoImagem.textContent =
            "🎁";

        };


      resultadoImagem.appendChild(
        img
      );

    }
    else{

      resultadoImagem.textContent =
        "🎁";

    }


    resultado.classList.add(
      "show"
    );


    await carregarDadosUsuario();

    await carregarHistorico();


  }
  catch(error){

    console.error(
      "Erro ao registrar resultado:",
      error
    );


    alert(
      "O giro aconteceu, mas houve um problema ao registrar o resultado. " +
      "Entre em contato com o administrador."
    );


    await carregarDadosUsuario();

  }


  girando =
    false;


  girar.disabled =
    Number(
      girosNumero.textContent || 0
    ) <= 0;

}


/* =====================================================
   HISTÓRICO DO JOGADOR
===================================================== */

async function carregarHistorico(){

  if(
    !usuarioAtual
  ){

    return;

  }


  historico.innerHTML =
    `
    <div class="carregando">
      🔄 Carregando histórico...
    </div>
    `;


  try{

    const referencia =
      collection(
        db,
        "historicoRoleta"
      );


    const consulta =
      query(
        referencia,
        where(
          "uid",
          "==",
          usuarioAtual.uid
        )
      );


    const resultado =
      await getDocs(
        consulta
      );


    if(
      resultado.empty
    ){

      historico.innerHTML =
        `
        <div class="sem-premios">
          Nenhum giro realizado ainda.
        </div>
        `;

      return;

    }


    const registros =
      resultado.docs

      .map(
        documento => ({

          id:
            documento.id,

          ...documento.data()

        })
      )

      .sort(
        (
          a,
          b
        ) =>
          String(
            b.dataHora || ""
          ).localeCompare(
            String(
              a.dataHora || ""
            )
          )
      )

      .slice(
        0,
        20
      );


    historico.innerHTML =
      "";


    registros.forEach(
      registro => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "giro-historico";


        const topo =
          document.createElement(
            "div"
          );


        topo.className =
          "giro-topo";


        const premio =
          document.createElement(
            "div"
          );


        premio.className =
          "giro-premio";


        premio.textContent =
          textoPremio({

            nome:
              registro.premioNome,

            quantidade:
              registro.quantidade

          });


        const data =
          document.createElement(
            "div"
          );


        data.className =
          "giro-data";


        let dataFormatada =
          "—";


        if(
          registro.dataHora
        ){

          const d =
            new Date(
              registro.dataHora
            );


          if(
            !Number.isNaN(
              d.getTime()
            )
          ){

            dataFormatada =
              d.toLocaleString(
                "pt-BR"
              );

          }

        }


        data.textContent =
          dataFormatada;


        topo.appendChild(
          premio
        );


        topo.appendChild(
          data
        );


        const status =
          document.createElement(
            "div"
          );


        status.className =
          "giro-status";


        status.textContent =
          registro.entregue === true
            ?
            "✅ Prêmio entregue"
            :
            "🕐 Aguardando entrega";


        item.appendChild(
          topo
        );


        item.appendChild(
          status
        );


        historico.appendChild(
          item
        );

      }
    );

  }
  catch(error){

    console.error(
      "Erro no histórico:",
      error
    );


    historico.innerHTML =
      `
      <div class="sem-premios">
        ❌ Não foi possível carregar seu histórico.
      </div>
      `;

  }

}
