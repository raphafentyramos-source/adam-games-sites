===================================================== */

  font-weight:900;

}

}

}


/* =====================================================
   GIROS
===================================================== */

.giros{

    20px
    auto
    25px;

    20px;

/* =====================================================
   ROLETA
===================================================== */

.wheel-area{

  position:relative;

  width:
    min(
      92vw,
      650px
    );

  aspect-ratio:1;

  margin:
    0
    auto
    25px;

}


#wheel{

  width:100%;

  height:100%;

  display:block;

  border-radius:50%;

  filter:
    drop-shadow(
      0 15px 18px
      rgba(0,0,0,.3)
    );

}


/* =====================================================
   PONTEIRO
===================================================== */

.pointer{

  position:absolute;

  z-index:10;

  top:-3px;

  left:50%;

  transform:
    translateX(-50%);

  width:0;

  height:0;

  border-left:
    31px solid transparent;

  border-right:
    31px solid transparent;

  border-top:
    72px solid #ffd52a;

  filter:
    drop-shadow(
      0 5px 5px
      rgba(0,0,0,.3)
    );

}


.pointer::before{

  content:"";

  position:absolute;

  width:27px;

  height:27px;

  border-radius:50%;

  background:#ffd52a;

  top:-73px;

  left:-13.5px;

}

===================================================== */

  padding:

    rgba(0,0,0,.35);

}


.resultado.show{

<script type="module">

from

/* =====================================================
   CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:

  projectId:

    ),

};


const app =

  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================================
   ESTADO
===================================================== */

let usuarioAtual =
  null;

let documentoUsuario =
  null;

let premios =
  [];

let rotacaoAtual =
  0;

let girando =
  false;


/* =====================================================
   ELEMENTOS
===================================================== */

const canvas =
  document.getElementById(
    "wheel"
  );


const ctx =
  canvas.getContext(
    "2d"
  );


const girosElement =
  document.getElementById(
    "giros"
  );


const botaoGirar =
  document.getElementById(
    "girar"
  );


const possibilidades =
  document.getElementById(
    "possibilidades"
  );


const historico =
  document.getElementById(
    "historico"
  );


const resultado =
  document.getElementById(
    "resultado"
  );


const resultadoPremio =
  document.getElementById(
    "resultadoPremio"
  );


const resultadoData =
  document.getElementById(
    "resultadoData"
  );


const mensagem =
  document.getElementById(
    "mensagem"
  );


/* =====================================================
   CORES
===================================================== */

const CORES = [

  "#e4a514",

  "#a83bd1",

  "#1681d7",

  "#18a96c",

  "#e53985",

  "#f07b1e",

  "#7c4fd8",

  "#e24b36",

  "#22b8a8",

  "#65b96f"

];


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
  texto,
  tipo
){

  mensagem.textContent =
    texto;

  mensagem.className =
    "mensagem " +
    tipo;

}


/* =====================================================
   TAMANHO CANVAS
===================================================== */

function ajustarCanvas(){

  const tamanho =
    canvas.clientWidth;

  const dpr =
    window.devicePixelRatio ||
    1;

  canvas.width =
    tamanho * dpr;

  canvas.height =
    tamanho * dpr;

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  desenharRoleta();

}


/* =====================================================
   DESENHAR ROLETA
===================================================== */

function desenharRoleta(){

  const tamanho =
    canvas.clientWidth;


  if(!tamanho){

    return;

  }


  ctx.clearRect(
    0,
    0,
    tamanho,
    tamanho
  );


  const centro =
    tamanho / 2;


  const raio =
    tamanho / 2 - 18;


  /* ---------------------------------------------------
     BORDA EXTERNA
  --------------------------------------------------- */

  ctx.beginPath();

  ctx.arc(
    centro,
    centro,
    raio + 10,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "#ffd52a";

  ctx.fill();


  ctx.beginPath();

  ctx.arc(
    centro,
    centro,
    raio + 2,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "#fff";

  ctx.fill();


  ctx.save();

  ctx.translate(
    centro,
    centro
  );

  ctx.rotate(
    rotacaoAtual
  );

  const quantidade =
    premios.length;


  if(
    quantidade === 0
  ){

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      raio,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "#142f4e";

    ctx.fill();

    ctx.restore();

    desenharCentro();

    return;

  }


  const angulo =
    (
      Math.PI * 2
    ) /
    quantidade;


  for(
    let i = 0;
    i < quantidade;
    i++
  ){

    const inicio =
      -Math.PI / 2 +
      i * angulo;


    const fim =
      inicio + angulo;


    const premio =
      premios[i];


    /*
    ---------------------------------------------------
    COR DA FATIA
    ---------------------------------------------------
    */

    ctx.beginPath();

    ctx.moveTo(
      0,
      0
    );

    ctx.arc(
      0,
      0,
      raio,
      inicio,
      fim
    );

    ctx.closePath();


    ctx.fillStyle =
      premio.cor ||
      CORES[
        i %
        CORES.length
      ];


    ctx.fill();


    ctx.strokeStyle =
      "rgba(0,0,0,.85)";

    ctx.lineWidth =
      2;

    ctx.stroke();


    /*
    ---------------------------------------------------
    IMAGEM TEMÁTICA
    ---------------------------------------------------
    */

    if(
      premio.imagem
    ){

      desenharImagemNaFatia(
        premio,
        i,
        angulo,
        raio
      );

    }

  }


  ctx.restore();


  desenharCentro();

}


/* =====================================================
   IMAGEM NA FATIA
===================================================== */

function desenharImagemNaFatia(
  premio,
  indice,
  angulo,
  raio
){

  const imagem =
    new Image();


  imagem.onload =
    () => {

      const tamanho =
        canvas.clientWidth;


      const centro =
        tamanho / 2;


      const posicao =
        -Math.PI / 2 +
        indice * angulo +
        angulo / 2;


      const distancia =
        raio * .62;


      const x =
        centro +
        Math.cos(
          posicao
        ) *
        distancia;


      const y =
        centro +
        Math.sin(
          posicao
        ) *
        distancia;


      const lado =
        Math.min(
          70,
          raio *
          .24
        );


      ctx.save();

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        lado / 2,
        0,
        Math.PI * 2
      );

      ctx.clip();


      ctx.drawImage(
        imagem,
        x - lado / 2,
        y - lado / 2,
        lado,
        lado
      );


      ctx.restore();

    };


  imagem.onerror =
    () => {};


  imagem.src =
    premio.imagem;

}


/* =====================================================
   CENTRO
===================================================== */

function desenharCentro(){

  const tamanho =
    canvas.clientWidth;


  const centro =
    tamanho / 2;


  const raio =
    Math.max(
      48,
      tamanho * .095
    );


  ctx.beginPath();

  ctx.arc(
    centro,
    centro,
    raio + 9,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "#fff";

  ctx.fill();


  ctx.beginPath();

  ctx.arc(
    centro,
    centro,
    raio,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "#ffd52a";

  ctx.fill();


  ctx.font =
    `${raio * .55}px Arial`;

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  ctx.fillText(
    "🎰",
    centro,
    centro
  );

}


/* =====================================================
   CARREGAR USUÁRIO
===================================================== */

async function carregarUsuario(){

  if(!usuarioAtual){

    return;

  }


  const referencia =
    collection(
      db,
      "admins"
    );


  const resultado =
    await getDocs(
      query(
        referencia,
        where(
          "uid",
          "==",
          usuarioAtual.uid
        )
      )
    );


  if(
    resultado.empty
  ){

    mostrarMensagem(
      "Não foi possível encontrar seu cadastro.",
      "error"
    );

    return;

  }


  documentoUsuario =
    resultado.docs[0];


  atualizarGiros(
    documentoUsuario.data().chances
  );

}


/* =====================================================
   MOSTRAR GIROS
===================================================== */

function atualizarGiros(
  valor
){

  const numero =
    Number(
      valor || 0
    );


  girosElement.textContent =
    numero.toLocaleString(
      "pt-BR"
    );


  botaoGirar.disabled =
    numero <= 0 ||
    premios.length === 0 ||
    girando;

}


/* =====================================================
   CARREGAR PRÊMIOS
===================================================== */

async function carregarPremios(){

  possibilidades.innerHTML =
    "<div class='vazio'>🔄 Carregando prêmios...</div>";


  const referencia =
    collection(
      db,
      "premiosRoleta"
    );


  const resultado =
    await getDocs(
      referencia
    );


  premios =
    resultado.docs

    .map(
      documento => ({

        id:
          documento.id,

        ...documento.data()

      })
    )

    .filter(
      premio =>
        premio.ativo === true
    );


  /*
  ---------------------------------------------------
  IMPORTANTE:
  O NÚMERO DE FATIAS É EXATAMENTE O NÚMERO
  DE PRÊMIOS ATIVOS.
  ---------------------------------------------------
  */


  desenharRoleta();


  renderizarPossibilidades();


  if(
    documentoUsuario
  ){

    atualizarGiros(
      documentoUsuario.data().chances
    );

  }

}


/* =====================================================
   POSSIBILIDADES
===================================================== */

function renderizarPossibilidades(){

  possibilidades.innerHTML =
    "";


  if(
    premios.length === 0
  ){

    possibilidades.innerHTML =
      "<div class='vazio'>" +
      "Nenhum prêmio disponível no momento." +
      "</div>";

    return;

  }


  premios.forEach(
    premio => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "possibilidade";


      if(
        premio.imagem
      ){

        const img =
          document.createElement(
            "img"
          );


        img.src =
          premio.imagem;


        img.alt =
          "";


        item.appendChild(
          img
        );

      }
      else{

        const semImagem =
          document.createElement(
            "div"
          );


        semImagem.className =
          "possibilidadeSemImagem";


        semImagem.textContent =
          "🎁";


        item.appendChild(
          semImagem
        );

      }


      const texto =
        document.createElement(
          "div"
        );


      const nome =
        document.createElement(
          "div"
        );


      nome.className =
        "possibilidadeNome";


      nome.textContent =
        (
          Number(
            premio.quantidade || 0
          ).toLocaleString(
            "pt-BR"
          ) +
          " " +
          (
            premio.nome ||
            "Prêmio"
          )
        );


      const tipo =
        document.createElement(
          "div"
        );


      tipo.className =
        "possibilidadeTipo";


      tipo.textContent =
        premio.descricao ||
        "Prêmio da Roleta Adam Games";


      texto.appendChild(
        nome
      );


      texto.appendChild(
        tipo
      );


      item.appendChild(
        texto
      );


      possibilidades.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   ESCOLHER PRÊMIO PELO PESO
===================================================== */

function escolherPremio(){

  if(
    premios.length === 0
  ){

    return null;

  }


  const total =
    premios.reduce(
      (
        soma,
        premio
      ) =>
        soma +
        Math.max(
          1,
          Number(
            premio.peso || 1
          )
        ),
      0
    );


  let sorteio =
    Math.random() *
    total;


  for(
    const premio of premios
  ){

    sorteio -=
      Math.max(
        1,
        Number(
          premio.peso || 1
        )
      );


    if(
      sorteio <= 0
    ){

      return premio;

    }

  }


  return premios[
    premios.length - 1
  ];

}


/* =====================================================
   ÍNDICE DA FATIA
===================================================== */

function indiceDoPremio(
  premio
){

  return premios.findIndex(
    item =>
      item.id ===
      premio.id
  );

}


/* =====================================================
   GIRAR
===================================================== */

async function girarRoleta(){

  if(
    girando
  ){

    return;

  }


  if(
    !usuarioAtual ||
    !documentoUsuario
  ){

    mostrarMensagem(
      "Aguarde o carregamento da sua conta.",
      "error"
    );

    return;

  }


  if(
    premios.length === 0
  ){

    mostrarMensagem(
      "Não existem prêmios disponíveis.",
      "error"
    );

    return;

  }


  /*
  =====================================================
  AQUI ESTÁ A CORREÇÃO PRINCIPAL.

  O giro NÃO é descontado no carregamento.

  Ele somente é descontado agora, dentro de uma
  transação, quando o usuário clicou no botão.
  =====================================================
  */


  const refUsuario =
    doc(
      db,
      "admins",
      documentoUsuario.id
    );


  let novoSaldo;


  try{

    novoSaldo =
      await runTransaction(
        db,
        async transaction => {

          const snapshot =
            await transaction.get(
              refUsuario
            );


          if(
            !snapshot.exists()
          ){

            throw new Error(
              "USER_NOT_FOUND"
            );

          }


          const dados =
            snapshot.data();


          const giros =
            Number(
              dados.chances || 0
            );


          if(
            giros <= 0
          ){

            throw new Error(
              "NO_SPINS"
            );

          }


          const novo =
            giros - 1;


          transaction.update(
            refUsuario,
            {
              chances:
                novo
            }
          );


          return novo;

        }
      );

  }
  catch(error){

    console.error(
      "Erro ao descontar giro:",
      error
    );


    if(
      error.message ===
      "NO_SPINS"
    ){

      atualizarGiros(
        0
      );


      mostrarMensagem(
        "Você não possui giros disponíveis.",
        "error"
      );

    }
    else{

      mostrarMensagem(
        "Não foi possível iniciar o giro. Tente novamente.",
        "error"
      );

    }


    return;

  }


  /*
  =====================================================
  SOMENTE DEPOIS DO DESCONTO CONFIRMADO
  A ROLETA COMEÇA A GIRAR.
  =====================================================
  */


  girando =
    true;


  atualizarGiros(
    novoSaldo
  );


  botaoGirar.disabled =
    true;


  resultado.classList.remove(
    "show"
  );


  const premio =
    escolherPremio();


  if(
    !premio
  ){

    girando =
      false;

    return;

  }


  const indice =
    indiceDoPremio(
      premio
    );


  const quantidade =
    premios.length;


  const angulo =
    (
      Math.PI * 2
    ) /
    quantidade;


  /*
  =====================================================
  A FATIA DO PRÊMIO FICA CENTRALIZADA NO PONTEIRO.
  =====================================================
  */


  const centroDaFatia =
    -Math.PI / 2 +
    indice * angulo +
    angulo / 2;


  const voltas =
    6 +
    Math.floor(
      Math.random() * 3
    );


  const alvo =
    (
      Math.PI * 2 * voltas
    ) +
    (
      -centroDaFatia
    );


  const inicio =
    rotacaoAtual;


  const final =
    inicio +
    alvo;


  const duracao =
    5200;


  const inicioTempo =
    performance.now();


  function animar(
    agora
  ){

    const progresso =
      Math.min(
        1,
        (
          agora -
          inicioTempo
        ) /
        duracao
      );


    /*
    Ease-out forte para dar sensação
    de roleta desacelerando.
    */

    const suavizado =
      1 -
      Math.pow(
        1 - progresso,
        4
      );


    rotacaoAtual =
      inicio +
      (
        final -
        inicio
      ) *
      suavizado;


    desenharRoleta();


    if(
      progresso < 1
    ){

      requestAnimationFrame(
        animar
      );

      return;

    }


    rotacaoAtual =
      final;


    desenharRoleta();


    finalizarGiro(
      premio
    );

  }


  requestAnimationFrame(
    animar
  );

}


/* =====================================================
   FINALIZAR GIRO
===================================================== */

async function finalizarGiro(
  premio
){

  /*
  O saldo já foi descontado ANTES da animação.
  Portanto recarregar durante a animação não gera
  um segundo desconto.
  */


  const agora =
    new Date();


  const dataHora =
    agora.toLocaleString(
      "pt-BR"
    );


  resultadoPremio.textContent =

    Number(
      premio.quantidade || 0
    ).toLocaleString(
      "pt-BR"
    ) +

    " " +

    (
      premio.nome ||
      "Prêmio"
    );


  resultadoData.textContent =
    "🎰 Giro realizado em " +
    dataHora;


  resultado.classList.add(
    "show"
  );


  /*
  =====================================================
  REGISTRO DO RESULTADO
  =====================================================
  */


  try{

    await addDoc(
      collection(
        db,
        "resultadosRoleta"
      ),
      {

        uid:
          usuarioAtual.uid,

        usuarioId:
          documentoUsuario.id,

        email:
          usuarioAtual.email ||
          "",

        premioId:
          premio.id,

        premioNome:
          premio.nome ||
          "",

        quantidade:
          Number(
            premio.quantidade || 0
          ),

        tipo:
          premio.tipo ||
          "outro",

        imagem:
          premio.imagem ||
          "",

        descricao:
          premio.descricao ||
          "",

        entregue:
          false,

        criadoEm:
          serverTimestamp()

      }
    );


  }
  catch(error){

    console.error(
      "Erro ao registrar resultado:",
      error
    );


    mostrarMensagem(
      "O prêmio saiu, mas não foi possível registrar o histórico. Avise o administrador.",
      "error"
    );

  }


  await carregarHistorico();


  girando =
    false;


  if(
    documentoUsuario
  ){

    /*
    Atualiza o documento local para que o valor
    permaneça correto mesmo sem recarregar.
    */

    documentoUsuario.data().chances =
      Number(
        documentoUsuario.data().chances || 0
      ) - 1;

  }


  atualizarGiros(
    documentoUsuario.data().chances
  );

}


/* =====================================================
   HISTÓRICO
===================================================== */

async function carregarHistorico(){

  if(
    !usuarioAtual
  ){

    return;

  }


  historico.innerHTML =
    "<div class='vazio'>🔄 Carregando...</div>";


  try{

    const referencia =
      collection(
        db,
        "resultadosRoleta"
      );


    const resultado =
      await getDocs(
        query(
          referencia,
          where(
            "uid",
            "==",
            usuarioAtual.uid
          )
        )
      );


    if(
      resultado.empty
    ){

      historico.innerHTML =
        "<div class='vazio'>" +
        "Você ainda não realizou nenhum giro." +
        "</div>";

      return;

    }


    const registros =

      resultado.docs

      .map(
        documento => ({

          id:
            documento.id,

          ...documento.data()

        })
      )

      .sort(
        (
          a,
          b
        ) => {

          const aData =
            a.criadoEm?.toMillis
              ? a.criadoEm.toMillis()
              : 0;


          const bData =
            b.criadoEm?.toMillis
              ? b.criadoEm.toMillis()
              : 0;


          return bData - aData;

        }
      );


    historico.innerHTML =
      "";


    registros
      .slice(
        0,
        20
      )
      .forEach(
        registro => {

          const item =
            document.createElement(
              "div"
            );


          item.className =
            "historicoItem";


          const premio =
            document.createElement(
              "div"
            );


          premio.className =
            "historicoPremio";


          premio.textContent =

            Number(
              registro.quantidade || 0
            ).toLocaleString(
              "pt-BR"
            ) +

            " " +

            (
              registro.premioNome ||
              "Prêmio"
            );


          const data =
            document.createElement(
              "div"
            );


          data.className =
            "historicoData";


          let dataTexto =
            "Data não disponível";


          if(
            registro.criadoEm &&
            typeof
            registro.criadoEm.toDate ===
            "function"
          ){

            dataTexto =
              registro.criadoEm
              .toDate()
              .toLocaleString(
                "pt-BR"
              );

          }


          data.textContent =
            "🎰 " +
            dataTexto;


          item.appendChild(
            premio
          );


          item.appendChild(
            data
          );


          historico.appendChild(
            item
          );

        }
      );


  }
  catch(error){

    console.error(
      "Erro no histórico:",
      error
    );


    historico.innerHTML =
      "<div class='vazio'>" +
      "Não foi possível carregar o histórico." +
      "</div>";

  }

}


/* =====================================================
   AUTENTICAÇÃO
===================================================== */

onAuthStateChanged(
  auth,
  async usuario => {

    if(
      !usuario
    ){

      window.location.replace(
        "index.html"
      );

      return;

    }


    usuarioAtual =
      usuario;


    try{

      await carregarUsuario();

      await carregarPremios();

      await carregarHistorico();

      ajustarCanvas();

    }
    catch(error){

      console.error(
        "Erro inicial:",
        error
      );


      mostrarMensagem(
        "Não foi possível carregar a Roleta.",
        "error"
      );

    }

  }
);


/* =====================================================
   EVENTO GIRAR
===================================================== */

botaoGirar.addEventListener(
  "click",
  girarRoleta
);


/* =====================================================
   REDIMENSIONAMENTO
===================================================== */

window.addEventListener(
  "resize",
  ajustarCanvas
);

</script>
