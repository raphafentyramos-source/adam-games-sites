/* =====================================================

<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,

  where,
  getDocs,

  addDoc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:
    "adam-games-21081.firebaseapp.com",

  projectId:
    "adam-games-21081",

  storageBucket:
    "adam-games-21081.firebasestorage.app",

  messagingSenderId:
    "1055528418738",

  appId:
    "1:1055528418738:web:5fafdf63424ba9744eb8ab"

};


const app =
  initializeApp(
    firebaseConfig
  );

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =====================================================
   ESTADO
===================================================== */

let usuarioAuth = null;

let usuarioDoc = null;

let usuarioRef = null;

let premios = [];

let girando = false;

let rotacaoAtual = 0;


/* =====================================================
   ELEMENTOS
===================================================== */

const girosEl =
  document.getElementById(
    "giros"
  );

const roletaEl =
  document.getElementById(
    "roleta"
  );

const roletaBase =
  document.getElementById(
    "roletaBase"
  );

const girarBtn =
  document.getElementById(
    "girar"
  );

const messageEl =
  document.getElementById(
    "message"
  );

const listaPremios =
  document.getElementById(
    "listaPremios"
  );

const historicoLista =
  document.getElementById(
    "historicoLista"
  );

const modal =
  document.getElementById(
    "modal"
  );

const modalPremio =
  document.getElementById(
    "modalPremio"
  );

const modalImg =
  document.getElementById(
    "modalImg"
  );

const modalData =
  document.getElementById(
    "modalData"
  );


/* =====================================================
   IR PARA JOGOS
===================================================== */

document
  .getElementById("irJogos")
  .addEventListener(
    "click",
    () => {

      window.location.href =
        "jogos.html";

    }
  );


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
  texto,
  tipo
){

  messageEl.textContent =
    texto;

  messageEl.className =
    "message";

  if(
    texto &&
    tipo
  ){

    messageEl.classList.add(
      tipo
    );

  }

}


/* =====================================================
   LOCALIZAR USUÁRIO
===================================================== */

async function localizarUsuario(
  usuario
){

  const resultadoUID =
    await getDocs(

      query(

        collection(
          db,
          "admins"
        ),

        where(
          "uid",
          "==",
          usuario.uid
        )

      )

    );


  if(
    !resultadoUID.empty
  ){

    return {

      ref:
        resultadoUID.docs[0].ref,

      id:
        resultadoUID.docs[0].id,

      data:
        resultadoUID.docs[0].data()

    };

  }


  if(
    usuario.email
  ){

    const resultadoEmail =
      await getDocs(

        query(

          collection(
            db,
            "admins"
          ),

          where(
            "email",
            "==",
            usuario.email
              .trim()
              .toLowerCase()
          )

        )

      );


    if(
      !resultadoEmail.empty
    ){

      return {

        ref:
          resultadoEmail.docs[0].ref,

        id:
          resultadoEmail.docs[0].id,

        data:
          resultadoEmail.docs[0].data()

      };

    }

  }


  return null;

}


/* =====================================================
   GIROS
===================================================== */

function atualizarGiros(){

  if(
    !usuarioDoc
  ){

    girosEl.textContent =
      "0";

    girarBtn.disabled =
      true;

    return;

  }


  const quantidade =
    Number(
      usuarioDoc.girosRoleta ||
      0
    );


  girosEl.textContent =
    quantidade.toLocaleString(
      "pt-BR"
    );


  girarBtn.disabled =
    quantidade <= 0 ||
    girando ||
    premios.length === 0;

}


/* =====================================================
   CARREGAR PRÊMIOS
=====================================================

   CORREÇÃO PRINCIPAL:

   where("ativo","==",true)

   As regras do Firestore exigem que
   a consulta já seja limitada aos
   prêmios ativos.
===================================================== */

async function carregarPremios(){

  listaPremios.innerHTML =

    "<div class='sem-premios'>" +
    "🔄 Carregando prêmios..." +
    "</div>";


  try{

    const consulta =
      query(

        collection(
          db,
          "premiosRoleta"
        ),

        where(
          "ativo",
          "==",
          true
        )

      );


    const resultado =
      await getDocs(
        consulta
      );


    premios =
      resultado.docs.map(
        documento => ({

          id:
            documento.id,

          ...documento.data()

        })
      );


    desenharRoleta();

    mostrarPossibilidades();

    atualizarGiros();

  }
  catch(error){

    console.error(
      "ERRO PRÊMIOS:",
      error
    );


    premios = [];


    listaPremios.innerHTML =

      "<div class='sem-premios'>" +

      "❌ Não foi possível carregar os prêmios." +

      "<br><br>" +

      "<small>" +

      (
        error.code ||
        "erro"
      ) +

      "</small>" +

      "</div>";


    atualizarGiros();

  }

}


/* =====================================================
   DESENHAR ROLETA
===================================================== */

function desenharRoleta(){

  roletaBase.innerHTML =
    "";

  roletaBase.style.background =
    "";


  if(
    premios.length === 0
  ){

    roletaBase.style.background =
      "#102d4e";

    return;

  }


  const quantidade =
    premios.length;


  const angulo =
    360 /
    quantidade;


  const cores = [

    "#18a96b",
    "#eaae10",
    "#a83bd1",
    "#1685d4",
    "#e73583",
    "#7c4dff",
    "#e75d25",
    "#2ab7a9",
    "#d93d3d",
    "#5b63d8",
    "#d68c19",
    "#16a86b"

  ];


  const partes = [];


  let inicio = 0;


  premios.forEach(
    (
      premio,
      indice
    ) => {

      const fim =
        inicio +
        angulo;


      const cor =
        premio.cor ||
        cores[
          indice %
          cores.length
        ];


      partes.push(
        `${cor} ${inicio}deg ${fim}deg`
      );


      inicio =
        fim;

    }
  );


  roletaBase.style.background =
    `conic-gradient(${partes.join(",")})`;


  /* =================================================
     IMAGENS
  ================================================= */

  const raio =
    31;


  premios.forEach(
    (
      premio,
      indice
    ) => {

      const meio =
        indice *
        angulo +
        angulo /
        2;


      if(
        !premio.imagem
      ){

        return;

      }


      const img =
        document.createElement(
          "img"
        );


      img.className =
        "roleta-imagem";


      img.src =
        premio.imagem;


      img.alt =
        premio.nome ||
        "Prêmio";


      img.style.transform =

        `
        translate(-50%, -50%)
        rotate(${meio}deg)
        translateY(-${raio}%)
        rotate(-${meio}deg)
        `;


      img.onerror =
        () => {

          img.remove();

        };


      roletaBase.appendChild(
        img
      );

    }
  );

}


/* =====================================================
   POSSIBILIDADES
===================================================== */

  ){

  }

        document.createElement(

        );

/* =====================================================
   SORTEIO
===================================================== */

function escolherPremio(){

  if(
    premios.length === 0
  ){

    return null;

  }


  let total = 0;


  premios.forEach(
    premio => {

      total +=
        Number(
          premio.peso ||
          1
        );

    }
  );


  let sorteio =
    Math.random() *
    total;


  for(
    const premio of premios
  ){

    sorteio -=
      Number(
        premio.peso ||
        1
      );


    if(
      sorteio <= 0
    ){

      return premio;

    }

  }


  return premios[
    premios.length - 1
  ];

}


/* =====================================================
   DATA
===================================================== */

function formatarData(
  valor
){

  if(
    !valor
  ){

    return "—";

  }


  let data;


  if(
    typeof valor.toDate ===
    "function"
  ){

    data =
      valor.toDate();

  }

  else if(
    typeof valor ===
    "number"
  ){

    data =
      new Date(
        valor
      );

  }

  else{

    data =
      new Date(
        valor
      );

  }


  if(
    Number.isNaN(
      data.getTime()
    )
  ){

    return "—";

  }


  return data.toLocaleString(
    "pt-BR"
  );

}


/* =====================================================
   HISTÓRICO
===================================================== */

async function carregarHistorico(){

  historicoLista.innerHTML =

    "<div class='sem-premios'>" +
    "🔄 Carregando resultados..." +
    "</div>";


  if(
    !usuarioAuth
  ){

    historicoLista.innerHTML =

      "<div class='sem-premios'>" +
      "Nenhum resultado registrado ainda." +
      "</div>";

    return;

  }


  try{

    const consulta =
      query(

        collection(
          db,
          "historicoRoleta"
        ),

        where(
          "uid",
          "==",
          usuarioAuth.uid
        )

      );


    const resultado =
      await getDocs(
        consulta
      );


    const registros =

      resultado.docs

        .map(
          documento => ({

            id:
              documento.id,

            ...documento.data()

          })
        );


    registros.sort(
      (
        a,
        b
      ) => {

        const ta =
          new Date(
            a.dataHora ||
            0
          ).getTime();

        const tb =
          new Date(
            b.dataHora ||
            0
          ).getTime();

        return tb - ta;

      }
    );


    historicoLista.innerHTML =
      "";


    if(
      registros.length === 0
    ){

      historicoLista.innerHTML =

        "<div class='sem-premios'>" +
        "Você ainda não realizou nenhum giro." +
        "</div>";

      return;

    }


    registros.forEach(
      registro => {

        historicoLista.appendChild(
          criarElementoHistorico(
            registro
          )
        );

      }
    );

  }
  catch(error){

    console.error(
      "ERRO HISTÓRICO:",
      error
    );


    historicoLista.innerHTML =

      "<div class='sem-premios'>" +

      "❌ Não foi possível carregar seu histórico." +

      "<br><br>" +

      "<small>" +

      (
        error.code ||
        "erro"
      ) +

      "</small>" +

      "</div>";

  }

}


/* =====================================================
   ELEMENTO HISTÓRICO
===================================================== */

function criarElementoHistorico(
  registro
){

  const item =
    document.createElement(
      "div"
    );


  item.className =
    "resultado";


  const top =
    document.createElement(
      "div"
    );


  top.className =
    "resultado-top";


  const premio =
    document.createElement(
      "div"
    );


  premio.className =
    "resultado-premio";


  premio.textContent =

    Number(
      registro.quantidade ||
      0
    ).toLocaleString(
      "pt-BR"
    ) +

    " " +

    (
      registro.premioNome ||
      "Prêmio"
    );


  const data =
    document.createElement(
      "div"
    );


  data.className =
    "resultado-data";


  data.textContent =
    formatarData(
      registro.dataHora
    );


  top.appendChild(
    premio
  );

  top.appendChild(
    data
  );


  const status =
    document.createElement(
      "div"
    );


  status.className =
    "resultado-status";


  status.textContent =

    registro.entregue === true

      ?

    "✅ Prêmio entregue"

      :

    "⏳ Prêmio pendente de entrega";


  const info =
    document.createElement(
      "div"
    );


  info.className =
    "resultado-info";


  info.textContent =

    "Tipo: " +
    (
      registro.tipo ||
      "Prêmio"
    ) +

    " • Giro registrado: " +
    (
      registro.dataHora ||
      "—"
    );


  item.appendChild(
    top
  );

  item.appendChild(
    status
  );

  item.appendChild(
    info
  );


  return item;

}


/* =====================================================
   GIRAR ROLETA
===================================================== */

async function girarRoleta(){

  if(
    girando
  ){

    return;

  }


  if(
    !usuarioDoc ||
    !usuarioRef
  ){

    mostrarMensagem(
      "Não foi possível encontrar seu cadastro.",
      "error"
    );

    return;

  }


  const girosAtuais =
    Number(
      usuarioDoc.girosRoleta ||
      0
    );


  if(
    girosAtuais <= 0
  ){

    mostrarMensagem(
      "Você não possui giros disponíveis.",
      "error"
    );

    return;

  }


  if(
    premios.length === 0
  ){

    mostrarMensagem(
      "Nenhum prêmio está disponível.",
      "error"
    );

    return;

  }


  girando =
    true;

  atualizarGiros();

  mostrarMensagem(
    "",
    ""
  );


  const premio =
    escolherPremio();


  if(
    !premio
  ){

    girando =
      false;

    atualizarGiros();

    return;

  }


  const indice =
    premios.findIndex(
      p =>
        p.id ===
        premio.id
    );


  const quantidade =
    premios.length;


  const angulo =
    360 /
    quantidade;


  const centroDaFatia =
    indice *
    angulo +
    angulo /
    2;


  const voltas =
    6;


  const alvo =
    360 -
    centroDaFatia;


  const rotacaoFinal =

    rotacaoAtual +

    (
      voltas *
      360
    ) +

    alvo;


  roletaEl.style.transition =
    "transform 5.5s cubic-bezier(.12,.72,.18,1)";


  roletaEl.style.transform =
    `rotate(${rotacaoFinal}deg)`;


  rotacaoAtual =
    rotacaoFinal;


  await new Promise(
    resolve =>
      setTimeout(
        resolve,
        5700
      )
  );


  /* =================================================
     DESCONTA GIRO
  ================================================= */

  const novoSaldo =
    Math.max(
      0,
      girosAtuais - 1
    );


  try{

    await updateDoc(

      usuarioRef,

      {

        girosRoleta:
          novoSaldo

      }

    );


    usuarioDoc.girosRoleta =
      novoSaldo;

  }
  catch(error){

    console.error(
      "Erro ao descontar giro:",
      error
    );


    girando =
      false;

    atualizarGiros();

    mostrarMensagem(
      "O giro não pôde ser confirmado. O prêmio não foi registrado.",
      "error"
    );

    return;

  }


  atualizarGiros();


  /* =================================================
     REGISTRO COMPLETO
  ================================================= */

  const agora =
    new Date();


  const dataHora =
    agora.toISOString();


  const dadosHistorico = {

    uid:
      usuarioAuth.uid,

    usuarioUid:
      usuarioAuth.uid,

    usuarioId:
      usuarioAuth.uid,

    usuarioNome:
      usuarioDoc.nome ||
      "",

    usuarioEmail:
      usuarioAuth.email ||
      usuarioDoc.email ||
      "",

    premioId:
      premio.id,

    premioNome:
      premio.nome ||
      "Prêmio",

    quantidade:
      Number(
        premio.quantidade ||
        0
      ),

    tipo:
      premio.tipo ||
      "outro",

    imagem:
      premio.imagem ||
      "",

    dataHora:
      dataHora,

    criadoEm:
      dataHora,

    entregue:
      false,

    status:
      "pendente",

    saldoGirosAnterior:
      girosAtuais,

    saldoGirosFinal:
      novoSaldo

  };


  /* =================================================
     GRAVA NO HISTÓRICO ADMINISTRATIVO
     
     É ESTE REGISTRO QUE FICA PENDENTE
     PARA O ADMINISTRADOR ENTREGAR.
  ================================================= */

  try{

    await addDoc(

      collection(
        db,
        "historicoRoleta"
      ),

      {

        ...dadosHistorico,

        dataHora:
          dataHora

      }

    );

  }
  catch(error){

    console.error(
      "Erro ao registrar historicoRoleta:",
      error
    );


    mostrarMensagem(
      "O giro foi realizado, mas houve um erro ao registrar o prêmio. Avise o administrador.",
      "error"
    );

    girando =
      false;

    atualizarGiros();

    return;

  }


  /* =================================================
     REGISTRO DE RESULTADO
     
     Mantemos também a coleção resultadosRoleta
     para compatibilidade com o sistema anterior.
  ================================================= */

  try{

    await addDoc(

      collection(
        db,
        "resultadosRoleta"
      ),

      {

        usuarioId:
          usuarioAuth.uid,

        usuarioDocId:
          usuarioDoc._docId ||
          "",

        usuarioEmail:
          usuarioAuth.email ||
          usuarioDoc.email ||
          "",

        usuarioNome:
          usuarioDoc.nome ||
          "",

        premioId:
          premio.id,

        premioNome:
          premio.nome ||
          "",

        quantidade:
          Number(
            premio.quantidade ||
            0
          ),

        tipo:
          premio.tipo ||
          "outro",

        imagem:
          premio.imagem ||
          "",

        saldoGirosAnterior:
          girosAtuais,

        saldoGirosFinal:
          novoSaldo,

        entregue:
          false,

        criadoEm:
          serverTimestamp()

      }

    );

  }
  catch(error){

    console.warn(
      "ResultadosRoleta não registrado:",
      error
    );

  }


  /* =================================================
     MOSTRA RESULTADO
  ================================================= */

  mostrarResultado(
    premio
  );


  await carregarHistorico();


  girando =
    false;

  atualizarGiros();

}


/* =====================================================
   MOSTRAR RESULTADO
===================================================== */

function mostrarResultado(
  premio
){

  modalPremio.textContent =

    Number(
      premio.quantidade ||
      0
    ).toLocaleString(
      "pt-BR"
    ) +

    " " +

    (
      premio.nome ||
      "Prêmio"
    );


  modalImg.innerHTML =
    "";


  if(
    premio.imagem
  ){

    const img =
      document.createElement(
        "img"
      );


    img.src =
      premio.imagem;


    img.alt =
      premio.nome ||
      "Prêmio";


    img.onerror =
      () => {

        modalImg.textContent =
          "🎁";

      };


    modalImg.appendChild(
      img
    );

  }
  else{

    modalImg.textContent =
      "🎁";

  }


  modalData.textContent =

    "Giro realizado em " +

    new Date()
      .toLocaleString(
        "pt-BR"
      ) +

    " • Prêmio pendente de entrega";


  modal.classList.add(
    "show"
  );

}


/* =====================================================
   FECHAR MODAL
===================================================== */

document
  .getElementById(
    "fechar"
  )
  .addEventListener(
    "click",
    () => {

      modal.classList.remove(
        "show"
      );

    }
  );


/* =====================================================
   AUTENTICAÇÃO
===================================================== */

onAuthStateChanged(

  auth,

  async usuario => {

    if(
      !usuario
    ){

      window.location.replace(
        "index.html"
      );

      return;

    }


    usuarioAuth =
      usuario;


    try{

      const cadastro =
        await localizarUsuario(
          usuario
        );


      if(
        !cadastro
      ){

        mostrarMensagem(
          "Não foi possível encontrar seu cadastro.",
          "error"
        );

        return;

      }


      usuarioRef =
        cadastro.ref;


      usuarioDoc = {

        ...cadastro.data,

        _docId:
          cadastro.id

      };


      /*
      Carrega os dois.
      */

      await carregarPremios();

      await carregarHistorico();

      atualizarGiros();

    }
    catch(error){

      console.error(
        "ERRO GERAL:",
        error
      );


      mostrarMensagem(
        "Ocorreu um erro ao carregar a roleta.",
        "error"
      );

    }

  }

);


/* =====================================================
   FIM
===================================================== */

</script>
