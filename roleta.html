<!DOCTYPE html>

<title>Adam Games • Roleta</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

  min-height:100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:#fff;

  background:
    radial-gradient(
      circle at 15% 5%,
      #20a9ff 0%,
      transparent 32%
    ),

    radial-gradient(
      circle at 90% 20%,
      #16b56e 0%,
      transparent 30%

    linear-gradient(
      145deg,
      #0787df,

    22px
    12px
    60px;

}

.container{

  width:100%;

  max-width:850px;

  margin:auto;

}


/* =====================================================
   TOPO
===================================================== */

.logo{

  text-align:center;

  margin-bottom:8px;

}

.logo h1{

  font-size:
    clamp(
      25px,
      7vw,
      38px
    );

  font-weight:900;

}

.logo .adam{

  color:#fff;

}

.logo .games{

  color:#ffd329;

}

.subtitle{

  text-align:center;

  color:#c9e2f4;

  font-size:16px;

  margin-bottom:20px;

}


/* =====================================================
   GIROS
===================================================== */

.giros{

  width:
    min(
      100%,
      350px
    );

  margin:
    0 auto
    22px;

  padding:
    14px
    20px;

  border-radius:30px;

  text-align:center;

  background:
    rgba(4,48,91,.82);

  border:
    1px solid
    rgba(255,255,255,.15);

  box-shadow:
    0 12px 30px
    rgba(0,0,0,.2);

}

.giros-label{

  font-size:14px;

  letter-spacing:3px;

  font-weight:bold;

  color:#bcd9ed;

}

.giros-numero{

  margin-top:4px;

  font-size:46px;

  line-height:1;

  color:#ffd52b;

  font-weight:900;

}


/* =====================================================
   ROLETA
===================================================== */

.roleta-area{

  width:100%;

  display:flex;

  justify-content:center;

  margin:
    8px auto
    22px;

}

.roleta-wrap{

  position:relative;

  width:
    min(
      88vw,
      640px
    );

  aspect-ratio:1 / 1;

}


/* =====================================================
   BORDA
===================================================== */

.roleta-borda{

  position:absolute;

  inset:0;

  border-radius:50%;

  background:#ffd329;

  padding:10px;

  box-shadow:
    0 0 0 7px
    rgba(0,0,0,.15),

    0 15px 35px
    rgba(0,0,0,.3);

}


/* =====================================================
   CÍRCULO DA ROLETA
===================================================== */

#roleta{

  position:absolute;

  inset:10px;

  border-radius:50%;

  overflow:hidden;

  background:#102d4e;

  border:
    3px solid
    rgba(255,255,255,.85);

  transform:
    rotate(0deg);

  transition:
    transform 5.5s
    cubic-bezier(.12,.72,.18,1);

}


/*
---------------------------------------------------------
IMAGENS DOS PRÊMIOS
---------------------------------------------------------
*/

.fatia-imagem{

  position:absolute;

  width:19%;

  height:19%;

  display:flex;

  align-items:center;

  justify-content:center;

  z-index:5;

  pointer-events:none;

}

.fatia-imagem img{

  width:100%;

  height:100%;

  object-fit:contain;

  filter:
    drop-shadow(
      0 4px 5px
      rgba(0,0,0,.4)
    );

}


/* =====================================================
   CENTRO
===================================================== */

.centro{

  position:absolute;

  left:50%;

  top:50%;

  transform:
    translate(
      -50%,
      -50%
    );

  width:
    100px;

  height:
    100px;

  border-radius:50%;

  background:
    #ffd329;

  border:
    10px solid
    #fff;

  display:flex;

  align-items:center;

  justify-content:center;

  z-index:50;

  box-shadow:
    0 5px 18px
    rgba(0,0,0,.35);

  font-size:38px;

}


/* =====================================================
   PONTEIRO
===================================================== */

.ponteiro{

  position:absolute;

  z-index:100;

  left:50%;

  top:-5px;

  transform:
    translateX(-50%);

  width:0;

  height:0;

  border-left:
    28px solid
    transparent;

  border-right:
    28px solid
    transparent;

  border-top:
    65px solid
    #ffd329;

  filter:
    drop-shadow(
      0 4px 4px
      rgba(0,0,0,.3)
    );

}


/* =====================================================
   BOTÃO
===================================================== */

.girar{

  width:100%;

  max-width:600px;

  margin:
    0 auto;

  display:block;

  padding:
    20px
    15px;

  border:0;

  border-radius:18px;

  background:
    linear-gradient(
      135deg,
      #ffd52b,
      #f3a600
    );

  color:#06345f;

  font-size:
    clamp(
      20px,
      5vw,
      27px
    );

  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 10px 25px
    rgba(0,0,0,.25);

}

.girar:active{

  transform:
    scale(.98);

}

.girar:disabled{

  opacity:.55;

  cursor:not-allowed;

}


.aviso{

  text-align:center;

  color:#c5dced;

  margin-top:14px;

  font-size:14px;

}


/* =====================================================
   MENSAGEM
===================================================== */

.message{

  margin:
    20px
    auto;

  padding:14px;

  max-width:700px;

  border-radius:14px;

  text-align:center;

  background:
    rgba(255,255,255,.07);

  display:none;

}

.message.error{

  display:block;

  color:#ff9eaa;

  background:
    rgba(255,40,60,.12);

}

.message.success{

  display:block;

  color:#79ffad;

  background:
    rgba(0,220,110,.12);

}


/* =====================================================
   POSSIBILIDADES
===================================================== */

.card{

  margin-top:28px;

  padding:22px;

  border-radius:22px;

  background:
    rgba(2,30,62,.94);

  border:
    1px solid

  box-shadow:
    0 15px 35px
    rgba(0,0,0,.18);

}

.card h2{

    );

}

.lista-premios{

}

.premio-publico{

  display:flex;

  align-items:center;

  gap:12px;

  padding:12px;

  border-radius:14px;

  background:
    rgba(255,255,255,.055);

}

.premio-publico-img{

  flex-shrink:0;

  border-radius:11px;

  background:#0a2849;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

}

.premio-publico-img img{

  width:100%;

  height:100%;

}

.premio-publico-info{

}

.premio-publico-nome{

  font-size:15px;

  font-weight:bold;

}

.premio-publico-qtd{

  color:#ffd52b;

  margin-top:3px;

  font-size:13px;

  font-weight:bold;

}

.sem-premios{

  padding:15px;

  text-align:center;

===================================================== */

.historico{

.historico h2{

}

.resultado{

}

.resultado-top{

.resultado-premio{

.resultado-data{

}

.resultado-status{

  margin-top:9px;

  color:#9fc1d8;

}

.resultado-id{

    rgba(0,0,0,.2);

/* =====================================================
   MODAL
===================================================== */

.modal{

  position:fixed;

  inset:0;

  z-index:1000;

.modal-card{

.modal-data{

.fechar{

/* =====================================================

@media(max-width:600px){

  }

  }

</style>

<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  doc,
  getDoc,
  updateDoc,
  setDoc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:
    "adam-games-21081.firebaseapp.com",

  projectId:
    "adam-games-21081",

  storageBucket:
    "adam-games-21081.firebasestorage.app",

  messagingSenderId:
    "1055528418738",

  appId:
    "1:1055528418738:web:5fafdf63424ba9744eb8ab"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================================
   ESTADO
===================================================== */

let usuarioAuth =
  null;

let usuarioDoc =
  null;

let usuarioRef =
  null;

let premios =
  [];

let girando =
  false;

let rotacaoAtual =
  0;


/* =====================================================
   ELEMENTOS
===================================================== */

const girosEl =
  document.getElementById(
    "giros"
  );

const roletaEl =
  document.getElementById(
    "roleta"
  );

const girarBtn =
  document.getElementById(
    "girar"
  );

const messageEl =
  document.getElementById(
    "message"
  );

const listaPremios =
  document.getElementById(
    "listaPremios"
  );

const historicoLista =
  document.getElementById(
    "historicoLista"
  );

const modal =
  document.getElementById(
    "modal"
  );

const modalPremio =
  document.getElementById(
    "modalPremio"
  );

const modalImg =
  document.getElementById(
    "modalImg"
  );

const modalData =
  document.getElementById(
    "modalData"
  );


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
  texto,
  tipo
){

  messageEl.textContent =
    texto;

  messageEl.className =
    "message " +
    tipo;

}


/* =====================================================
   LOCALIZAR USUÁRIO
===================================================== */

async function localizarUsuario(
  usuario
){

  try{

    const resultadoUID =
      await getDocs(

        query(

          collection(
            db,
            "admins"
          ),

          where(
            "uid",
            "==",
            usuario.uid
          )

        )

      );


    if(
      !resultadoUID.empty
    ){

      return {

        ref:
          resultadoUID.docs[0].ref,

        id:
          resultadoUID.docs[0].id,

        data:
          resultadoUID.docs[0].data()

      };

    }

  }
  catch(error){

    console.error(
      "Erro na busca por UID:",
      error
    );

  }


  if(
    usuario.email
  ){

    try{

      const email =
        usuario.email
        .trim()
        .toLowerCase();


      const resultadoEmail =
        await getDocs(

          query(

            collection(
              db,
              "admins"
            ),

            where(
              "email",
              "==",
              email
            )

          )

        );


      if(
        !resultadoEmail.empty
      ){

        return {

          ref:
            resultadoEmail.docs[0].ref,

          id:
            resultadoEmail.docs[0].id,

          data:
            resultadoEmail.docs[0].data()

        };

      }

    }
    catch(error){

      console.error(
        "Erro na busca por e-mail:",
        error
      );

    }

  }


  try{

    const referencia =
      doc(
        db,
        "admins",
        usuario.uid
      );


    const documento =
      await getDoc(
        referencia
      );


    if(
      documento.exists()
    ){

      return {

        ref:
          documento.ref,

        id:
          documento.id,

        data:
          documento.data()

      };

    }

  }
  catch(error){

    console.error(
      "Erro na busca direta:",
      error
    );

  }


  return null;

}


/* =====================================================
   ATUALIZAR GIROS
===================================================== */

function atualizarGiros(){

  if(
    !usuarioDoc
  ){

    girosEl.textContent =
      "0";

    girarBtn.disabled =
      true;

    return;

  }


  const quantidade =
    Number(
      usuarioDoc.girosRoleta ||
      0
    );


  girosEl.textContent =
    quantidade.toLocaleString(
      "pt-BR"
    );


  girarBtn.disabled =
    quantidade <= 0 ||
    girando ||
    premios.length === 0;

}


/* =====================================================
   CARREGAR PRÊMIOS
===================================================== */

async function carregarPremios(){

  try{

    const resultado =
      await getDocs(

        collection(
          db,
          "premiosRoleta"
        )

      );


    premios =

      resultado.docs

      .map(
        documento => ({

          id:
            documento.id,

          ...documento.data()

        })
      )

      .filter(
        premio =>
          premio.ativo === true
      );


    desenharRoleta();

    mostrarPossibilidades();

    atualizarGiros();

  }
  catch(error){

    console.error(
      "Erro ao carregar prêmios:",
      error
    );


    listaPremios.innerHTML =
      "<div class='sem-premios'>" +
      "❌ Não foi possível carregar os prêmios." +
      "</div>";

  }

}


/* =====================================================
   DESENHAR ROLETA
===================================================== */

function desenharRoleta(){

  roletaEl.innerHTML =
    "";

  roletaEl.style.transition =
    "none";

  roletaEl.style.transform =
    "rotate(0deg)";

  rotacaoAtual =
    0;


  if(
    premios.length === 0
  ){

    const vazio =
      document.createElement(
        "div"
      );


    vazio.style.cssText = `

      position:absolute;

      inset:0;

      display:flex;

      align-items:center;

      justify-content:center;

      color:#fff;

      font-size:18px;

      text-align:center;

      padding:30px;

    `;


    vazio.textContent =
      "Nenhum prêmio disponível";


    roletaEl.appendChild(
      vazio
    );


    return;

  }


  const quantidade =
    premios.length;


  const angulo =
    360 /
    quantidade;


  const cores = [

    "#18a96b",
    "#e7aa12",
    "#a83bd1",
    "#1685d3",
    "#e73583",
    "#7549df",
    "#e75d25",
    "#20b49e",
    "#d83c3c",
    "#5964d9",
    "#d58c19",
    "#15a66b"

  ];


  /*
  -----------------------------------------------------
  A ROLETA AGORA É UMA ÚNICA PIZZA.
  
  Conic-gradient divide 100% do círculo.
  Portanto:
  
  4 prêmios = 4 fatias
  6 prêmios = 6 fatias
  8 prêmios = 8 fatias
  
  Nunca ficam pedaços vazios.
  -----------------------------------------------------
  */


  const partes =
    premios.map(
      (
        premio,
        indice
      ) => {

        const inicio =
          indice *
          angulo;


        const fim =
          (
            indice + 1
          ) *
          angulo;


        const cor =
          premio.cor ||
          cores[
            indice %
            cores.length
          ];


        return (
          `${cor} ${inicio}deg ${fim}deg`
        );

      }
    );


  roletaEl.style.background =
    `conic-gradient(from -90deg, ${partes.join(",")})`;


  /*
  -----------------------------------------------------
  IMAGENS NO CENTRO DE CADA FATIA
  -----------------------------------------------------
  */


  const raio =
    31;


  premios.forEach(
    (
      premio,
      indice
    ) => {

      if(
        !premio.imagem
      ){

        return;

      }


      const centro =
        indice *
        angulo +
        angulo / 2;


      const radianos =
        (
          centro - 90
        ) *
        Math.PI /
        180;


      const x =
        50 +
        raio *
        Math.cos(
          radianos
        );


      const y =
        50 +
        raio *
        Math.sin(
          radianos
        );


      const imagemBox =
        document.createElement(
          "div"
        );


      imagemBox.className =
        "fatia-imagem";


      imagemBox.style.left =
        x + "%";


      imagemBox.style.top =
        y + "%";


      imagemBox.style.transform =
        "translate(-50%, -50%)";


      const img =
        document.createElement(
          "img"
        );


      img.src =
        premio.imagem;


      img.alt =
        "";


      img.onerror =
        () => {

          imagemBox.remove();

        };


      imagemBox.appendChild(
        img
      );


      roletaEl.appendChild(
        imagemBox
      );

    }
  );

}


/* =====================================================
   POSSIBILIDADES
===================================================== */

function mostrarPossibilidades(){

  listaPremios.innerHTML =
    "";


  if(
    premios.length === 0
  ){

    listaPremios.innerHTML =
      "<div class='sem-premios'>" +
      "Nenhum prêmio cadastrado na roleta." +
      "</div>";

    return;

  }


  premios.forEach(
    premio => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "premio-publico";


      const imagemBox =
        document.createElement(
          "div"
        );


      imagemBox.className =
        "premio-publico-img";


      if(
        premio.imagem
      ){

        const img =
          document.createElement(
            "img"
          );


        img.src =
          premio.imagem;


        img.alt =
          premio.nome ||
          "Prêmio";


        img.onerror =
          () => {

            imagemBox.textContent =
              "🎁";

          };


        imagemBox.appendChild(
          img
        );

      }
      else{

        imagemBox.textContent =
          "🎁";

      }


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "premio-publico-info";


      const nome =
        document.createElement(
          "div"
        );


      nome.className =
        "premio-publico-nome";


      nome.textContent =

        (
          premio.quantidade ||
          0
        ).toLocaleString(
          "pt-BR"
        )

        +

        " "

        +

        (
          premio.nome ||
          "Prêmio"
        );


      const tipo =
        document.createElement(
          "div"
        );


      tipo.className =
        "premio-publico-qtd";


      tipo.textContent =
        premio.tipo ||
        "Prêmio";


      info.appendChild(
        nome
      );

      info.appendChild(
        tipo
      );


      item.appendChild(
        imagemBox
      );

      item.appendChild(
        info
      );


      listaPremios.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   PESO
===================================================== */

function escolherPremio(){

  if(
    premios.length === 0
  ){

    return null;

  }


  let total =
    0;


  premios.forEach(
    premio => {

      total +=
        Math.max(
          0,
          Number(
            premio.peso ||
            1
          )
        );

    }
  );


  if(
    total <= 0
  ){

    return premios[0];

  }


  let sorteio =
    Math.random() *
    total;


  for(
    const premio
    of premios
  ){

    sorteio -=
      Math.max(
        0,
        Number(
          premio.peso ||
          1
        )
      );


    if(
      sorteio <= 0
    ){

      return premio;

    }

  }


  return premios[
    premios.length - 1
  ];

}


/* =====================================================
   DATA
===================================================== */

function formatarData(
  data
){

  if(
    !data
  ){

    return "—";

  }


  let dataObjeto;


  if(
    typeof data.toDate ===
    "function"
  ){

    dataObjeto =
      data.toDate();

  }
  else{

    dataObjeto =
      new Date(
        data
      );

  }


  if(
    Number.isNaN(
      dataObjeto.getTime()
    )
  ){

    return "—";

  }


  return dataObjeto.toLocaleString(
    "pt-BR"
  );

}


/* =====================================================
   GIRAR ROLETA
===================================================== */

async function girarRoleta(){

  if(
    girando
  ){

    return;

  }


  if(
    !usuarioDoc ||
    !usuarioRef
  ){

    mostrarMensagem(
      "Não foi possível encontrar seu cadastro.",
      "error"
    );

    return;

  }


  const girosAtuais =
    Number(
      usuarioDoc.girosRoleta ||
      0
    );


  if(
    girosAtuais <= 0
  ){

    mostrarMensagem(
      "Você não possui giros disponíveis.",
      "error"
    );

    return;

  }


  if(
    premios.length === 0
  ){

    mostrarMensagem(
      "Nenhum prêmio está disponível na roleta.",
      "error"
    );

    return;

  }


  girando =
    true;


  girarBtn.disabled =
    true;


  mostrarMensagem(
    "",
    ""
  );


  const premio =
    escolherPremio();


  if(
    !premio
  ){

    girando =
      false;

    atualizarGiros();

    return;

  }


  const indice =
    premios.findIndex(
      p =>
        p.id ===
        premio.id
    );


  const quantidade =
    premios.length;


  const angulo =
    360 /
    quantidade;


  /*
  -----------------------------------------------------
  Calcula o centro da fatia sorteada.
  -----------------------------------------------------
  */

  const centroFatia =
    indice *
    angulo +
    angulo / 2;


  /*
  -----------------------------------------------------
  O ponteiro está no topo.
  -----------------------------------------------------
  */

  const alvo =
    360 -
    centroFatia;


  /*
  Várias voltas para a animação ficar bonita.
  */

  const voltas =
    6;


  const rotacaoFinal =
    rotacaoAtual +
    (
      voltas * 360
    ) +
    alvo;


  roletaEl.style.transition =
    "transform 5.5s cubic-bezier(.12,.72,.18,1)";


  roletaEl.style.transform =
    `rotate(${rotacaoFinal}deg)`;


  rotacaoAtual =
    rotacaoFinal;


  /*
  -----------------------------------------------------
  Espera a animação.
  -----------------------------------------------------
  */

  await new Promise(
    resolve =>
      setTimeout(
        resolve,
        5700
      )
  );


  /*
  -----------------------------------------------------
  REGISTRO NO FIREBASE
  -----------------------------------------------------
  */

  try{

    /*
    ---------------------------------------------------
    CONFERE NOVAMENTE O SALDO DIRETAMENTE NO FIREBASE.
    
    Isso evita que duas abas usem o mesmo giro.
    ---------------------------------------------------
    */

    const documentoAtual =
      await getDoc(
        usuarioRef
      );


    if(
      !documentoAtual.exists()
    ){

      throw new Error(
        "Seu cadastro não foi encontrado."
      );

    }


    const dadosAtuais =
      documentoAtual.data();


    const saldoReal =
      Number(
        dadosAtuais.girosRoleta ||
        0
      );


    if(
      saldoReal <= 0
    ){

      throw new Error(
        "Este giro já foi utilizado."
      );

    }


    const novoSaldo =
      saldoReal - 1;


    /*
    ---------------------------------------------------
    ID ÚNICO DO RESULTADO
    ---------------------------------------------------
    */

    const resultadoRef =
      doc(
        collection(
          db,
          "resultadosRoleta"
        )
      );


    /*
    ---------------------------------------------------
    ATUALIZA O SALDO E CRIA O RESULTADO.
    
    As duas operações são feitas juntas.
    ---------------------------------------------------
    */

    await updateDoc(

      usuarioRef,

      {

        girosRoleta:
          novoSaldo

      }

    );


    await setDoc(

      resultadoRef,

      {

        usuarioId:
          usuarioAuth.uid,

        usuarioDocId:
          usuarioDoc._docId,

        usuarioEmail:
          usuarioAuth.email ||
          usuarioDoc.email ||
          "",

        usuarioNome:
          usuarioDoc.nome ||
          usuarioDoc.name ||
          "",

        publicId:
          usuarioDoc.publicId ||
          "",

        premioId:
          premio.id,

        premioNome:
          premio.nome ||
          "",

        quantidade:
          Number(
            premio.quantidade ||
            0
          ),

        tipo:
          premio.tipo ||
          "outro",

        imagem:
          premio.imagem ||
          "",

        giroNumero:
          saldoReal,

        saldoGirosAnterior:
          saldoReal,

        saldoGirosFinal:
          novoSaldo,

        entregue:
          false,

        criadoEm:
          serverTimestamp()

      }

    );


    /*
    ---------------------------------------------------
    ATUALIZA A TELA
    ---------------------------------------------------
    */

    usuarioDoc.girosRoleta =
      novoSaldo;


    atualizarGiros();


    mostrarResultado(

      premio,

      resultadoRef.id

    );


    await carregarHistorico();


  }
  catch(error){

    console.error(
      "ERRO COMPLETO AO REGISTRAR ROLETA:",
      error
    );


    /*
    ---------------------------------------------------
    MOSTRA O ERRO REAL.
    ---------------------------------------------------
    */

    mostrarMensagem(

      "⚠️ Não foi possível registrar o giro no Firebase: " +
      (
        error.message ||
        "erro desconhecido"
      ),

      "error"

    );

  }


  girando =
    false;


  atualizarGiros();

}


/* =====================================================
   MOSTRAR RESULTADO
===================================================== */

function mostrarResultado(
  premio,
  registroId
){

  modalPremio.textContent =

    (
      premio.quantidade ||
      0
    ).toLocaleString(
      "pt-BR"
    )

    +

    " "

    +

    (
      premio.nome ||
      "Prêmio"
    );


  modalImg.innerHTML =
    "";


  if(
    premio.imagem
  ){

    const img =
      document.createElement(
        "img"
      );


    img.src =
      premio.imagem;


    img.alt =
      "Prêmio";


    img.onerror =
      () => {

        modalImg.textContent =
          "🎁";

      };


    modalImg.appendChild(
      img
    );

  }
  else{

    modalImg.textContent =
      "🎁";

  }


  modalData.textContent =

    "Giro realizado em " +

    new Date()
      .toLocaleString(
        "pt-BR"
      )

    +

    " • Registro: "

    +

    registroId;


  modal.classList.add(
    "show"
  );


  mostrarMensagem(
    "🎉 Giro realizado com sucesso!",
    "success"
  );

}


/* =====================================================
   HISTÓRICO
===================================================== */

async function carregarHistorico(){

  if(
    !usuarioAuth
  ){

    return;

  }


  try{

    const resultado =
      await getDocs(

        query(

          collection(
            db,
            "resultadosRoleta"
          ),

          where(
            "usuarioId",
            "==",
            usuarioAuth.uid
          )

        )

      );


    if(
      resultado.empty
    ){

      historicoLista.innerHTML =
        "<div class='sem-premios'>" +
        "Você ainda não realizou nenhum giro." +
        "</div>";

      return;

    }


    const registros =

      resultado.docs

      .map(
        documento => ({

          id:
            documento.id,

          ...documento.data()

        })
      )

      .sort(
        (
          a,
          b
        ) => {

          const aData =
            a.criadoEm?.seconds ||
            0;


          const bData =
            b.criadoEm?.seconds ||
            0;


          return (
            bData -
            aData
          );

        }
      );


    historicoLista.innerHTML =
      "";


    registros.forEach(
      registro => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "resultado";


        const top =
          document.createElement(
            "div"
          );


        top.className =
          "resultado-top";


        const premio =
          document.createElement(
            "div"
          );


        premio.className =
          "resultado-premio";


        premio.textContent =

          (
            registro.quantidade ||
            0
          ).toLocaleString(
            "pt-BR"
          )

          +

          " "

          +

          (
            registro.premioNome ||
            "Prêmio"
          );


        const data =
          document.createElement(
            "div"
          );


        data.className =
          "resultado-data";


        data.textContent =
          formatarData(
            registro.criadoEm
          );


        top.appendChild(
          premio
        );


        top.appendChild(
          data
        );


        const status =
          document.createElement(
            "div"
          );


        status.className =
          "resultado-status";


        status.textContent =

          registro.entregue === true

            ?

            "✅ Prêmio entregue"

            :

            "⏳ Aguardando entrega";


        const id =
          document.createElement(
            "div"
          );


        id.className =
          "resultado-id";


        id.textContent =
          "ID do resultado: " +
          registro.id;


        item.appendChild(
          top
        );


        item.appendChild(
          status
        );


        item.appendChild(
          id
        );


        historicoLista.appendChild(
          item
        );

      }
    );

  }
  catch(error){

    console.error(
      "Erro no histórico:",
      error
    );


    historicoLista.innerHTML =
      "<div class='sem-premios'>" +
      "Não foi possível carregar seu histórico." +
      "</div>";

  }

}


/* =====================================================
   AUTENTICAÇÃO
===================================================== */

onAuthStateChanged(

  auth,

  async usuario => {

    if(
      !usuario
    ){

      window.location.replace(
        "index.html"
      );

      return;

    }


    usuarioAuth =
      usuario;


    try{

      const cadastro =
        await localizarUsuario(
          usuario
        );


      if(
        !cadastro
      ){

        console.error(
          "Cadastro não encontrado:",
          usuario.uid
        );


        mostrarMensagem(
          "Não foi possível encontrar seu cadastro.",
          "error"
        );


        girosEl.textContent =
          "0";


        girarBtn.disabled =
          true;


        return;

      }


      usuarioRef =
        cadastro.ref;


      usuarioDoc = {

        ...cadastro.data,

        _docId:
          cadastro.id

      };


      await carregarPremios();

      await carregarHistorico();

      atualizarGiros();

    }
    catch(error){

      console.error(
        "Erro ao iniciar roleta:",
        error
      );


      mostrarMensagem(

        "⚠️ Erro ao carregar a roleta: " +
        (
          error.message ||
          "erro desconhecido"
        ),

        "error"

      );

    }

  }

);


/* =====================================================
   EVENTOS
===================================================== */

girarBtn.addEventListener(

  "click",

  girarRoleta

);


document
  .getElementById(
    "fechar"
  )
  .addEventListener(

    "click",

    () => {

      modal.classList.remove(
        "show"
      );

    }

  );

</script>
