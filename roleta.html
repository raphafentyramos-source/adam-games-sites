<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Adam Games • Roleta</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

  min-height:100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:#fff;

  background:
    radial-gradient(
      circle at 20% 0%,
      #20a9ff 0%,
      transparent 30%
    ),

    radial-gradient(
      circle at 90% 20%,
      #16a56b 0%,
      transparent 28%
    ),

    linear-gradient(
      145deg,
      #087edb,
      #031a3b 75%
    );

  padding:
    18px
    12px
    60px;

}

.container{

  width:100%;
  max-width:760px;
  margin:auto;

}


/* =====================================================
   TOPO
===================================================== */

header{

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  margin-bottom:20px;

}

.logo{

  display:flex;
  align-items:center;
  gap:11px;

}

.logoIcon{

  width:52px;
  height:52px;

  border-radius:16px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:27px;

  background:
    linear-gradient(
      145deg,
      #ffd72a,
      #c68100
    );

  box-shadow:
    0 8px 20px
    rgba(0,0,0,.25);

}

.logo h1{

  font-size:20px;

}

.logo span{

  color:#ffd52b;

}

.back{

  border:0;

  padding:
    11px
    14px;

  border-radius:11px;

  background:#123b65;

  color:#fff;

  font-weight:bold;

  cursor:pointer;

}


/* =====================================================
   TÍTULO
===================================================== */

.title{

  text-align:center;

  margin-bottom:8px;

}

.title h2{

  font-size:
    clamp(
      30px,
      8vw,
      42px
    );

  font-weight:900;

}

.title p{

  color:#b9d8ef;

  margin-top:7px;

  font-size:14px;

}


/* =====================================================
   GIROS
===================================================== */

.spins{

  width:max-content;

  max-width:100%;

  margin:
    18px
    auto;

  padding:
    10px
    18px;

  border-radius:30px;

  background:
    rgba(0,0,0,.25);

  border:
    1px solid
    rgba(255,255,255,.12);

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.18);

  text-align:center;

}

.spins small{

  display:block;

  color:#a9c9e4;

  font-size:10px;

  font-weight:bold;

  letter-spacing:1px;

}

.spins strong{

  display:block;

  margin-top:3px;

  color:#ffd52b;

  font-size:24px;

}


/* =====================================================
   ROLETA
===================================================== */

.wheel-area{

  position:relative;

  width:
    min(
      92vw,
      560px
    );

  aspect-ratio:1;

  margin:
    20px
    auto
    25px;

  display:flex;

  align-items:center;
  justify-content:center;

}


/*
---------------------------------------------------------
PONTEIRO
---------------------------------------------------------
*/

.pointer{

  position:absolute;

  z-index:20;

  top:-5px;

  left:50%;

  transform:
    translateX(-50%);

  width:0;
  height:0;

  border-left:
    17px solid transparent;

  border-right:
    17px solid transparent;

  border-top:
    42px solid #ffd52b;

  filter:
    drop-shadow(
      0 4px 5px
      rgba(0,0,0,.45)
    );

}


/*
---------------------------------------------------------
BRILHO EXTERNO
---------------------------------------------------------
*/

.wheel-glow{

  position:absolute;

  inset:-10px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      transparent 63%,
      rgba(255,215,42,.16) 69%,
      transparent 76%
    );

  pointer-events:none;

}


/*
---------------------------------------------------------
RODA
---------------------------------------------------------
*/

.wheel{

  position:relative;

  width:100%;
  height:100%;

  border-radius:50%;

  overflow:hidden;

  border:
    9px solid
    #f6c72b;

  box-shadow:

    0 0 0 5px
    #163b63,

    0 15px 45px
    rgba(0,0,0,.45),

    inset 0 0 25px
    rgba(0,0,0,.5);

  background:#132e4d;

  transform:
    rotate(0deg);

  transition:
    transform
    5s
    cubic-bezier(
      .12,
      .7,
      .08,
      1
    );

}


/*
---------------------------------------------------------
FATIAS
---------------------------------------------------------
*/

.slice{

  position:absolute;

  width:50%;
  height:50%;

  left:50%;
  top:50%;

  transform-origin:
    0 0;

  clip-path:
    polygon(
      0 0,
      100% 0,
      0 100%
    );

  overflow:hidden;

}


/*
Conteúdo visual da fatia.
O prêmio NÃO será mostrado aqui.
*/

.sliceVisual{

  position:absolute;

  width:100%;
  height:100%;

  left:0;
  top:0;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:
    8px;

  transform:
    rotate(22deg);

  pointer-events:none;

}

.sliceVisual img{

  width:
    62px;

  height:
    62px;

  object-fit:contain;

  filter:
    drop-shadow(
      0 3px 4px
      rgba(0,0,0,.35)
    );

}

.sliceColor{

  position:absolute;

  inset:0;

  opacity:.95;

}


/*
---------------------------------------------------------
CENTRO
---------------------------------------------------------
*/

.center{

  position:absolute;

  z-index:15;

  width:
    92px;

  height:
    92px;

  border-radius:50%;

  display:flex;

  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at 35% 30%,
      #ffe879,
      #f3ad00 58%,
      #a96c00
    );

  border:
    6px solid
    #fff;

  box-shadow:

    0 0 0 5px
    #173a5e,

    0 8px 18px
    rgba(0,0,0,.4);

  font-size:37px;

}


/* =====================================================
   BOTÃO GIRAR
===================================================== */

.spin-button{

  display:block;

  width:
    min(
      90%,
      390px
    );

  margin:
    0
    auto
    18px;

  padding:
    17px;

  border:0;

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      #ffd72a,
      #e89400
    );

  color:#17243a;

  font-size:18px;

  font-weight:900;

  box-shadow:
    0 10px 25px
    rgba(0,0,0,.25);

  cursor:pointer;

  transition:
    transform .15s,
    filter .15s;

}

.spin-button:active{

  transform:
    scale(.97);

}

.spin-button:disabled{

  cursor:not-allowed;

  opacity:.45;

  filter:
    grayscale(.5);

}


/* =====================================================
   AVISO
===================================================== */

.notice{

  text-align:center;

  color:#94b6d2;

  font-size:11px;

  margin-bottom:18px;

}


/* =====================================================
   RESULTADO
===================================================== */

.result{

  display:none;

  margin-top:20px;

  padding:22px;

  border-radius:22px;

  text-align:center;

  background:
    linear-gradient(
      145deg,
      rgba(17,185,104,.18),
      rgba(3,30,62,.95)
    );

  border:
    1px solid
    rgba(91,255,170,.3);

  box-shadow:
    0 15px 35px
    rgba(0,0,0,.25);

  animation:
    resultIn .45s ease;

}

.result.show{

  display:block;

}

@keyframes resultIn{

  from{

    opacity:0;

    transform:
      translateY(15px)
      scale(.96);

  }

  to{

    opacity:1;

    transform:
      translateY(0)
      scale(1);

  }

}

.resultTitle{

  color:#6effa8;

  font-size:12px;

  font-weight:bold;

  letter-spacing:1px;

}

.resultImage{

  width:105px;
  height:105px;

  margin:
    13px
    auto;

  border-radius:20px;

  display:flex;

  align-items:center;
  justify-content:center;

  background:
    rgba(255,255,255,.06);

  overflow:hidden;

  font-size:52px;

}

.resultImage img{

  width:100%;
  height:100%;

  object-fit:contain;

}

.resultName{

  font-size:24px;

  font-weight:900;

}

.resultQuantity{

  margin-top:5px;

  color:#ffd52b;

  font-size:19px;

  font-weight:bold;

}


/* =====================================================
   CARREGANDO
===================================================== */

.loading{

  text-align:center;

  padding:20px;

  color:#a9c9e4;

}


/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:500px){

  .logo h1{
    font-size:17px;
  }

  .logoIcon{

    width:46px;
    height:46px;

    font-size:24px;

  }

  .back{

    padding:
      9px
      11px;

    font-size:11px;

  }

  .wheel{

    border-width:7px;

  }

  .center{

    width:76px;
    height:76px;

    font-size:29px;

  }

  .sliceVisual img{

    width:45px;
    height:45px;

  }

}


/* =====================================================
   ERRO
===================================================== */

.error{

  display:none;

  margin:15px auto;

  max-width:600px;

  padding:14px;

  border-radius:12px;

  background:
    rgba(255,50,70,.12);

  border:
    1px solid
    rgba(255,50,70,.2);

  color:#ff9ca8;

  text-align:center;

  font-size:13px;

}

.error.show{

  display:block;

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     TOPO
===================================================== -->

<header>

  <div class="logo">

    <div class="logoIcon">
      🎰
    </div>

    <div>

      <h1>
        ADAM <span>GAMES</span>
      </h1>

    </div>

  </div>


  <button
    class="back"
    id="back"
    type="button">

    ← Voltar

  </button>

</header>


<!-- =====================================================
     TÍTULO
===================================================== -->

<div class="title">

  <h2>
    🎰 Roleta da Sorte
  </h2>

  <p>
    Gire a roleta e descubra seu prêmio!
  </p>

</div>


<!-- =====================================================
     GIROS
===================================================== -->

<div class="spins">

  <small>
    GIROS DISPONÍVEIS
  </small>

  <strong id="spinCount">
    0
  </strong>

</div>


<!-- =====================================================
     ERRO
===================================================== -->

<div
  class="error"
  id="error">
</div>


<!-- =====================================================
     ROLETA
===================================================== -->

<div class="wheel-area">

  <div class="pointer"></div>

  <div class="wheel-glow"></div>

  <div
    class="wheel"
    id="wheel">

    <div
      class="loading"
      id="wheelLoading">

      🎰

    </div>

  </div>


  <div class="center">
    🎰
  </div>

<!-- =====================================================
     BOTÃO
===================================================== -->

<button
  class="spin-button"
  id="spinButton"
  type="button"
  disabled>

  🎰 GIRAR ROLETA

</button>


<div class="notice">

  O prêmio é revelado somente quando a roleta parar.

</div>


<!-- =====================================================
     RESULTADO
===================================================== -->

<div
  class="result"
  id="result">

  <div class="resultTitle">
    🎉 VOCÊ GANHOU!
  </div>


  <div
    class="resultImage"
    id="resultImage">

    🎁

  </div>


  <div
    class="resultName"
    id="resultName">

    Prêmio

  </div>


  <div
    class="resultQuantity"
    id="resultQuantity">

    —

  </div>

</div>


</div>


<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:
    "adam-games-21081.firebaseapp.com",

  projectId:
    "adam-games-21081",

  storageBucket:
    "adam-games-21081.firebasestorage.app",

  messagingSenderId:
    "1055528418738",

  appId:
    "1:1055528418738:web:5fafdf63424ba9744eb8ab"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================================
   ELEMENTOS
===================================================== */

const wheel =
  document.getElementById(
    "wheel"
  );


const spinButton =
  document.getElementById(
    "spinButton"
  );


const spinCount =
  document.getElementById(
    "spinCount"
  );


const result =
  document.getElementById(
    "result"
  );


const resultImage =
  document.getElementById(
    "resultImage"
  );


const resultName =
  document.getElementById(
    "resultName"
  );


const resultQuantity =
  document.getElementById(
    "resultQuantity"
  );


const errorBox =
  document.getElementById(
    "error"
  );


/* =====================================================
   VARIÁVEIS
===================================================== */

let usuarioAtual =
  null;

let premios =
  [];

let girando =
  false;

let rotacaoAtual =
  0;


/*
---------------------------------------------------------
IMPORTANTE

Nesta primeira versão estamos preparando
a interface.

O sorteio definitivo será conectado ao
servidor em seguida.

Não vamos confiar no navegador para decidir
o prêmio definitivo.
---------------------------------------------------------
*/


/* =====================================================
   ÍCONES PADRÃO
===================================================== */

const icones = {

  rubis:
    "💎",

  itens:
    "📦",

  chaves:
    "🔑",

  ferramentas_rubi:
    "🔴",

  ferramentas_ouro:
    "🟡",

  energias:
    "⚡",

  comida_castor:
    "🦫",

  chapeus_bobo:
    "🎩",

  evento:
    "🎉",

  outro:
    "🎁"

};


function obterIcone(
  tipo
){

  return (
    icones[tipo]
    ||
    "🎁"
  );

}


/* =====================================================
   ERRO
===================================================== */

function mostrarErro(
  texto
){

  errorBox.textContent =
    texto;

  errorBox.classList.add(
    "show"
  );

}


function esconderErro(){

  errorBox.classList.remove(
    "show"
  );

}


/* =====================================================
   CORES DAS FATIAS
===================================================== */

const cores = [

  "#087edb",
  "#e83e8c",
  "#16a56b",
  "#8b5cf6",
  "#f59e0b",
  "#ef4444",
  "#06b6d4",
  "#7c3aed",
  "#10b981",
  "#ec4899",
  "#2563eb",
  "#d97706"

];


/* =====================================================
   CRIAR ROLETA
===================================================== */

function criarRoleta(
  lista
){

  wheel.innerHTML =
    "";


  if(
    !lista.length
  ){

    wheel.innerHTML =

      "<div class='loading'>" +

        "Nenhum prêmio disponível." +

      "</div>";

    spinButton.disabled =
      true;

    return;

  }


  const total =
    lista.length;


  const angulo =
    360 / total;


  lista.forEach(
    (
      premio,
      index
    ) => {

      const slice =
        document.createElement(
          "div"
        );


      slice.className =
        "slice";


      /*
      Cada fatia recebe sua
      rotação correspondente.
      */

      slice.style.transform =

        "rotate(" +
        (
          index * angulo
        ) +
        "deg)";


      /*
      Visual da fatia.
      */

      const visual =
        document.createElement(
          "div"
        );


      visual.className =
        "sliceVisual";


      /*
      Se o prêmio tiver imagem,
      usa a imagem.

      Caso contrário,
      usa a cor/ícone.
      */

      if(
        premio.imagem &&
        premio.imagem.trim() !== ""
      ){

        const img =
          document.createElement(
            "img"
          );


        img.src =
          premio.imagem;


        img.alt =
          "";


        img.onerror =
          () => {

            visual.innerHTML =
              "<div style='font-size:42px'>" +
              obterIcone(
                premio.tipo
              ) +
              "</div>";

          };


        visual.appendChild(
          img
        );

      }
      else{

        const color =
          document.createElement(
            "div"
          );


        color.className =
          "sliceColor";


        color.style.background =
          cores[
            index %
            cores.length
          ];


        visual.appendChild(
          color
        );


        const icon =
          document.createElement(
            "div"
          );


        icon.style.position =
          "relative";


        icon.style.zIndex =
          "2";


        icon.style.fontSize =
          "38px";


        icon.textContent =
          obterIcone(
            premio.tipo
          );


        visual.appendChild(
          icon
        );

      }


      slice.appendChild(
        visual
      );


      wheel.appendChild(
        slice
      );

    }
  );

}


/* =====================================================
   CARREGAR PRÊMIOS
===================================================== */

async function carregarPremios(){

  try{

    /*
    Atenção:
    Esta leitura é apenas provisória para
    construir a interface.

    Antes de colocar a roleta em produção,
    vamos substituir isso por uma função
    protegida que não entregue a lista
    completa dos prêmios ao jogador.
    */

    const resultado =
      await getDocs(

        collection(
          db,
          "premiosRoleta"
        )

      );


    premios =

      resultado.docs

      .map(
        documento => ({

          id:
            documento.id,

          ...documento.data()

        })
      )

      .filter(
        premio =>
          premio.ativo === true
      );


    criarRoleta(
      premios
    );


    /*
    Para teste visual:
    */

    if(
      premios.length > 0
    ){

      spinButton.disabled =
        false;

    }

  }
  catch(error){

    console.error(
      error
    );


    mostrarErro(
      "Não foi possível carregar a roleta."
    );

  }

}


/* =====================================================
   SORTEIO TEMPORÁRIO
===================================================== */

function sortearPremioTeste(){

  if(
    !premios.length
  ){

    return null;

  }


  let totalPeso =
    0;


  premios.forEach(
    premio => {

      totalPeso +=
        Number(
          premio.peso || 0
        );

    }
  );


  if(
    totalPeso <= 0
  ){

    return premios[
      Math.floor(
        Math.random() *
        premios.length
      )
    ];

  }


  let sorteio =
    Math.random() *
    totalPeso;


  for(
    const premio
    of premios
  ){

    sorteio -=
      Number(
        premio.peso || 0
      );


    if(
      sorteio <= 0
    ){

      return premio;

    }

  }


  return premios[
    premios.length - 1
  ];

}


/* =====================================================
   LOCALIZAR FATIA
===================================================== */

function indiceDoPremio(
  premio
){

  return premios.findIndex(
    item =>
      item.id ===
      premio.id
  );

}


/* =====================================================
   GIRAR
===================================================== */

async function girar(){

  if(
    girando
  ){

    return;

  }


  if(
    !premios.length
  ){

    mostrarErro(
      "Não existem prêmios ativos na roleta."
    );

    return;

  }


  girando =
    true;


  spinButton.disabled =
    true;


  esconderErro();


  result.classList.remove(
    "show"
  );


  /*
  Sorteio temporário.

  Depois vamos substituir pelo
  resultado seguro do backend.
  */

  const premio =
    sortearPremioTeste();


  if(
    !premio
  ){

    girando =
      false;

    spinButton.disabled =
      false;

    return;

  }


  const indice =
    indiceDoPremio(
      premio
    );


  const quantidade =
    premios.length;


  const angulo =
    360 / quantidade;


  /*
  O ponteiro fica no topo.

  Calculamos o centro da fatia
  sorteada e fazemos várias voltas.
  */

  const centroFatia =
    (
      indice * angulo
    ) +
    (
      angulo / 2
    );


  const voltas =
    5 +
    Math.floor(
      Math.random() * 3
    );


  const destino =
    (
      rotacaoAtual +
      (
        voltas * 360
      ) +
      (
        360 -
        centroFatia
      )
    );


  rotacaoAtual =
    destino;


  wheel.style.transform =
    "rotate(" +
    destino +
    "deg)";


  setTimeout(
    () => {

      mostrarResultado(
        premio
      );


      girando =
        false;


      /*
      Temporariamente mantém o botão
      bloqueado após um giro.

      O sistema real de giros será conectado
      na próxima etapa.
      */

      spinButton.disabled =
        true;

    },

    5250

  );

}


/* =====================================================
   MOSTRAR RESULTADO
===================================================== */

function mostrarResultado(
  premio
){

  result.classList.add(
    "show"
  );


  resultName.textContent =
    premio.nome ||
    "Prêmio";


  resultQuantity.textContent =

    Number(
      premio.quantidade || 0
    ).toLocaleString(
      "pt-BR"
    );


  resultImage.innerHTML =
    "";


  if(
    premio.imagem &&
    premio.imagem.trim() !== ""
  ){

    const img =
      document.createElement(
        "img"
      );


    img.src =
      premio.imagem;


    img.alt =
      premio.nome ||
      "Prêmio";


    img.onerror =
      () => {

        resultImage.textContent =
          obterIcone(
            premio.tipo
          );

      };


    resultImage.appendChild(
      img
    );

  }
  else{

    resultImage.textContent =
      obterIcone(
        premio.tipo
      );

  }


  result.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}


/* =====================================================
   BOTÃO
===================================================== */

spinButton.addEventListener(
  "click",
  girar
);


/* =====================================================
   VOLTAR
===================================================== */

document
  .getElementById(
    "back"
  )
  .addEventListener(
    "click",
    () => {

      window.history.back();

    }
  );


/* =====================================================
   AUTENTICAÇÃO
===================================================== */

onAuthStateChanged(

  auth,

  async usuario => {

    if(
      !usuario
    ){

      window.location.replace(
        "index.html"
      );

      return;

    }


    usuarioAtual =
      usuario;


    /*
    Por enquanto deixamos
    o contador visual em 0.

    Na próxima etapa vamos ligar
    ao campo de giros do usuário.
    */

    spinCount.textContent =
      "0";


    await carregarPremios();

  }

);

</script>
