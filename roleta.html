.roleta-wrap{

  padding:10px;

/* FATIAS */

.setor{

  vector-effect:
    non-scaling-stroke;

}


/* IMAGENS */

.setor-imagem{

  pointer-events:none;

  user-select:none;

}


/* =====================================================
   CENTRO
===================================================== */

.centro{

  position:absolute;

<script type="module">


/* =====================================================

===================================================== */

import {

from

/* =====================================================
   CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:
    "adam-games-21081.firebaseapp.com",

  projectId:
    "adam-games-21081",

  storageBucket:
    "adam-games-21081.firebasestorage.app",

  messagingSenderId:
    "1055528418738",

  appId:
    "1:1055528418738:web:5fafdf63424ba9744eb8ab"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================================
   ESTADO
===================================================== */

let usuarioAuth =
  null;

let usuarioDoc =
  null;

let usuarioRef =
  null;

let premios =
  [];

let girando =
  false;

let rotacaoAtual =
  0;


/* =====================================================
   ELEMENTOS
===================================================== */

const girosEl =
  document.getElementById(
    "giros"
  );


const roletaGrupo =
  document.getElementById(
    "roletaGrupo"
  );


const girarBtn =
  document.getElementById(
    "girar"
  );


const messageEl =
  document.getElementById(
    "message"
  );


const listaPremios =
  document.getElementById(
    "listaPremios"
  );


const historicoLista =
  document.getElementById(
    "historicoLista"
  );


const modal =
  document.getElementById(
    "modal"
  );


const modalPremio =
  document.getElementById(
    "modalPremio"
  );


const modalImg =
  document.getElementById(
    "modalImg"
  );


const modalData =

  );


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
  texto,
  tipo
){

  if(!texto){

    messageEl.textContent =
      "";

    messageEl.className =
      "message";

    return;

  }


  messageEl.textContent =
    texto;

  messageEl.className =
    "message " +
    tipo;

}


/* =====================================================
   LOCALIZAR USUÁRIO
===================================================== */

async function localizarUsuario(
  usuario
){

  try{

    const resultadoUID =
      await getDocs(

        query(

          collection(
            db,
            "admins"
          ),

          where(
            "uid",
            "==",
            usuario.uid
          )

        )

      );


    if(
      !resultadoUID.empty
    ){

      return {

        ref:
          resultadoUID.docs[0].ref,

        id:
          resultadoUID.docs[0].id,

        data:
          resultadoUID.docs[0].data()

      };

    }

  }

  catch(error){

    console.error(
      "Erro na busca por UID:",
      error
    );

  }


  if(
    usuario.email
  ){

    try{

      const email =
        usuario.email
          .trim()
          .toLowerCase();


      const resultadoEmail =
        await getDocs(

          query(

            collection(
              db,
              "admins"
            ),

            where(
              "email",
              "==",
              email
            )

          )

        );


      if(
        !resultadoEmail.empty
      ){

        return {

          ref:
            resultadoEmail.docs[0].ref,

          id:
            resultadoEmail.docs[0].id,

          data:
            resultadoEmail.docs[0].data()

        };

      }

    }

    catch(error){

      console.error(
        "Erro na busca por e-mail:",
        error
      );

    }

  }


  try{

    const referencia =
      doc(
        db,
        "admins",
        usuario.uid
      );


    const documento =
      await getDoc(
        referencia
      );


    if(
      documento.exists()
    ){

      return {

        ref:
          documento.ref,

        id:
          documento.id,

        data:
          documento.data()

      };

    }

  }

  catch(error){

    console.error(
      "Erro na busca direta:",
      error
    );

  }


  return null;

}


/* =====================================================
   GIROS
===================================================== */

function atualizarGiros(){

  if(!usuarioDoc){

    girosEl.textContent =
      "0";

    girarBtn.disabled =
      true;

    return;

  }


  const quantidade =
    Number(
      usuarioDoc.girosRoleta ||
      0
    );


  girosEl.textContent =
    quantidade.toLocaleString(
      "pt-BR"
    );


  girarBtn.disabled =
    quantidade <= 0 ||
    girando ||
    premios.length === 0;

}


/* =====================================================
   CARREGAR PRÊMIOS
===================================================== */

async function carregarPremios(){

  try{

    const resultado =
      await getDocs(

        collection(
          db,
          "premiosRoleta"
        )

      );


    premios =

      resultado.docs

        .map(
          documento => ({

            id:
              documento.id,

            ...documento.data()

          })
        )

        .filter(
          premio =>
            premio.ativo === true
        );


    desenharRoleta();

    mostrarPossibilidades();

    atualizarGiros();

  }

  catch(error){

    console.error(
      "Erro ao carregar prêmios:",
      error
    );


    listaPremios.innerHTML =

      "<div class='sem-premios'>" +

      "❌ Não foi possível carregar os prêmios." +

      "</div>";

  }

}


/* =====================================================
   CALCULAR PONTO NA CIRCUNFERÊNCIA
===================================================== */

function pontoCirculo(
  angulo,
  raio
){

  const rad =
    angulo *
    Math.PI /
    180;


  return {

    x:
      250 +
      raio *
      Math.sin(rad),

    y:
      250 -
      raio *
      Math.cos(rad)

  };

}


/* =====================================================
   CRIAR SETOR SVG
===================================================== */

function criarCaminhoSetor(
  inicio,
  fim
){

  const raio =
    245;


  const p1 =
    pontoCirculo(
      inicio,
      raio
    );


  const p2 =
    pontoCirculo(
      fim,
      raio
    );


  const tamanho =
    fim -
    inicio;


  const grandeArco =
    tamanho >
    180
      ? 1
      : 0;


  return `

    M 250 250

    L ${p1.x} ${p1.y}

    A ${raio} ${raio}
      0 ${grandeArco} 1
      ${p2.x} ${p2.y}

    Z

  `;

}


/* =====================================================
   DESENHAR ROLETA NOVA
===================================================== */

function desenharRoleta(){

  roletaGrupo.innerHTML =
    "";


  rotacaoAtual =
    0;


  roletaGrupo.style.transform =
    "rotate(0deg)";


  if(
    premios.length === 0
  ){

    return;

  }


  const quantidade =
    premios.length;


  const angulo =
    360 /
    quantidade;


  const cores = [

    "#19a86b",
    "#e8aa13",
    "#a93bd2",
    "#1886d5",
    "#e73583",
    "#7047df",
    "#e65d25",
    "#22ae9b",
    "#d83e3e",
    "#5965d9",
    "#d58a18",
    "#15a66a"

  ];


  premios.forEach(
    (
      premio,
      indice
    ) => {

      const inicio =
        indice *
        angulo;


      const fim =
        inicio +
        angulo;


      const centro =
        inicio +
        angulo / 2;


      /*
      SETOR
      */

      const path =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "path"
        );


      path.setAttribute(
        "d",
        criarCaminhoSetor(
          inicio,
          fim
        )
      );


      path.setAttribute(
        "fill",
        premio.cor ||
        cores[
          indice %
          cores.length
        ]
      );


      path.setAttribute(
        "class",
        "setor"
      );


      roletaGrupo.appendChild(
        path
      );


      /*
      IMAGEM
      */

      if(
        premio.imagem
      ){

        const pos =
          pontoCirculo(
            centro,
            165
          );


        const imagem =
          document.createElementNS(
            "http://www.w3.org/2000/svg",
            "image"
          );


        const tamanho =
          Math.min(
            105,
            Math.max(
              58,
              270 /
              quantidade
            )
          );


        imagem.setAttribute(
          "href",
          premio.imagem
        );


        imagem.setAttribute(
          "x",
          pos.x -
          tamanho / 2
        );


        imagem.setAttribute(
          "y",
          pos.y -
          tamanho / 2
        );


        imagem.setAttribute(
          "width",
          tamanho
        );


        imagem.setAttribute(
          "height",
          tamanho
        );


        imagem.setAttribute(
          "preserveAspectRatio",
          "xMidYMid meet"
        );


        imagem.setAttribute(
          "class",
          "setor-imagem"
        );


        roletaGrupo.appendChild(
          imagem
        );

      }

    }
  );

}

/* =====================================================
   SORTEIO
===================================================== */

function escolherPremio(){

  if(
    premios.length === 0
  ){

    return null;

  }


  let total =
    0;


  premios.forEach(
    premio => {

      total +=
        Number(
          premio.peso ||
          1
        );

    }
  );


  let sorteio =
    Math.random() *
    total;


  for(
    const premio
    of premios
  ){

    sorteio -=
      Number(
        premio.peso ||
        1
      );


    if(
      sorteio <= 0
    ){

      return premio;

    }

  }


  return premios[
    premios.length - 1
  ];

}


/* =====================================================
   FORMATAR DATA
===================================================== */

function formatarData(
  data
){

  if(
    !data
  ){

    return "—";

  }


  let objeto;


  if(
    typeof data.toDate ===
    "function"
  ){

    objeto =
      data.toDate();

  }

  else{

    objeto =
      new Date(
        data
      );

  }


  if(
    Number.isNaN(
      objeto.getTime()
    )
  ){

    return "—";

  }


  return objeto.toLocaleString(
    "pt-BR"
  );

}


/* =====================================================
   SALVAR RESULTADO
===================================================== */

async function salvarResultado(
  premio,
  girosAnterior,
  saldoFinal
){

  try{

    const registro =
      await addDoc(

        collection(
          db,
          "resultadosRoleta"
        ),

        {

          usuarioId:
            usuarioAuth.uid,

          usuarioDocId:
            usuarioDoc._docId,

          usuarioEmail:
            usuarioAuth.email ||
            usuarioDoc.email ||
            "",

          usuarioNome:
            usuarioDoc.nome ||
            usuarioDoc.name ||
            "",

          publicId:
            usuarioDoc.publicId ||
            "",

          premioId:
            premio.id,

          premioNome:
            premio.nome ||
            "",

          quantidade:
            Number(
              premio.quantidade ||
              0
            ),

          tipo:
            premio.tipo ||
            "outro",

          imagem:
            premio.imagem ||
            "",

          giroNumero:
            girosAnterior,

          saldoGirosAnterior:
            girosAnterior,

          saldoGirosFinal:
            saldoFinal,

          entregue:
            false,

          criadoEm:
            serverTimestamp()

        }

      );


    return registro.id;

  }

  catch(error){

    /*
    IMPORTANTE:

    Se as Rules impedirem o histórico,
    NÃO impedimos o prêmio de aparecer.
    */

    console.error(
      "Não foi possível salvar histórico:",
      error
    );


    return null;

  }

}

/* =====================================================
   GIRAR ROLETA
===================================================== */

async function girarRoleta(){

  if(
    girando
  ){

    return;

  }


  if(
    !usuarioDoc ||
    !usuarioRef
  ){

    mostrarMensagem(
      "Não foi possível encontrar seu cadastro.",
      "error"
    );

    return;

  }


  const girosAtuais =
    Number(
      usuarioDoc.girosRoleta ||
      0
    );


  if(
    girosAtuais <= 0
  ){

    mostrarMensagem(
      "Você não possui giros disponíveis.",
      "error"
    );

    return;

  }


  if(
    premios.length === 0
  ){

    mostrarMensagem(
      "Nenhum prêmio está disponível na roleta.",
      "error"
    );

    return;

  }


  girando =
    true;


  girarBtn.disabled =
    true;


  mostrarMensagem(
    "",
    ""
  );


  /*
  -----------------------------------------------------
  ESCOLHE O PRÊMIO
  -----------------------------------------------------
  */

  const premio =
    escolherPremio();


  if(
    !premio
  ){

    girando =
      false;

    atualizarGiros();

    return;

  }


  const indice =
    premios.findIndex(
      p =>
        p.id ===
        premio.id
    );


  const quantidade =
    premios.length;


  const angulo =
    360 /
    quantidade;


  /*
  -----------------------------------------------------
  CENTRO DA FATIA
  -----------------------------------------------------
  */

  const centroDaFatia =
    indice *
    angulo +
    angulo / 2;


  /*
  -----------------------------------------------------
  QUEREMOS QUE O CENTRO DA FATIA
  TERMINE EXATAMENTE NO PONTEIRO.
  -----------------------------------------------------
  */

  const voltas =
    6;


  const ajuste =
    360 -
    centroDaFatia;


  const rotacaoFinal =

    rotacaoAtual +

    voltas * 360 +

    ajuste;


  roletaGrupo.style.transition =

    "transform 5.5s cubic-bezier(.12,.72,.18,1)";


  roletaGrupo.style.transform =

    "rotate(" +
    rotacaoFinal +
    "deg)";


  rotacaoAtual =
    rotacaoFinal;


  /*
  -----------------------------------------------------
  ESPERA A ROLETA PARAR
  -----------------------------------------------------
  */

  await new Promise(
    resolve =>
      setTimeout(
        resolve,
        5700
      )
  );


  /*
  -----------------------------------------------------
  DESCONTA O GIRO
  -----------------------------------------------------
  */

  const novoSaldo =
    Math.max(
      0,
      girosAtuais - 1
    );


  try{

    await updateDoc(

      usuarioRef,

      {

        girosRoleta:
          novoSaldo

      }

    );


    usuarioDoc.girosRoleta =
      novoSaldo;


  }

  catch(error){

    console.error(
      "Erro ao descontar giro:",
      error
    );


    /*
    Mesmo que dê erro,
    não escondemos o prêmio.
    */

    mostrarMensagem(
      "⚠️ O prêmio foi sorteado. Houve um problema ao atualizar seus giros.",
      "error"
    );

  }


  /*
  -----------------------------------------------------
  ATUALIZA NÚMERO DE GIROS
  -----------------------------------------------------
  */

  atualizarGiros();


  /*
  -----------------------------------------------------
  MOSTRA O PRÊMIO IMEDIATAMENTE
  -----------------------------------------------------
  */

  let registroId =
    null;


  /*
  Tentamos salvar o histórico,
  mas isso NÃO pode impedir o prêmio.
  */

  registroId =
    await salvarResultado(
      premio,
      girosAtuais,
      novoSaldo
    );


  /*
  -----------------------------------------------------
  MOSTRA RESULTADO
  -----------------------------------------------------
  */

  mostrarResultado(
    premio,
    registroId
  );


  /*
  -----------------------------------------------------
  HISTÓRICO
  -----------------------------------------------------
  */

  await carregarHistorico();


  girando =
    false;


  atualizarGiros();

}


/* =====================================================
   HISTÓRICO
===================================================== */

async function carregarHistorico(){

  if(
    !usuarioAuth
  ){

    return;

  }


  try{

    const resultado =
      await getDocs(

        query(

          collection(
            db,
            "resultadosRoleta"
          ),

          where(
            "usuarioId",
            "==",
            usuarioAuth.uid
          )

        )

      );


    if(
      resultado.empty
    ){

      historicoLista.innerHTML =

        "<div class='sem-premios'>" +

        "Você ainda não realizou nenhum giro." +

        "</div>";

      return;

    }


    const registros =

      resultado.docs

        .map(
          documento => ({

            id:
              documento.id,

            ...documento.data()

          })
        )

        .sort(
          (
            a,
            b
          ) => {

            const aData =
              a.criadoEm?.seconds ||
              0;


            const bData =
              b.criadoEm?.seconds ||
              0;


            return bData - aData;

          }
        );


    historicoLista.innerHTML =
      "";


    registros.forEach(
      registro => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "resultado";


        const top =
          document.createElement(
            "div"
          );


        top.className =
          "resultado-top";


        const premio =
          document.createElement(
            "div"
          );


        premio.className =
          "resultado-premio";


        premio.textContent =

          Number(
            registro.quantidade ||
            0
          ).toLocaleString(
            "pt-BR"
          )

          +

          " "

          +

          (
            registro.premioNome ||
            "Prêmio"
          );


        const data =
          document.createElement(
            "div"
          );


        data.className =
          "resultado-data";


        data.textContent =
          formatarData(
            registro.criadoEm
          );


        top.appendChild(
          premio
        );


        top.appendChild(
          data
        );


        const status =
          document.createElement(
            "div"
          );


        status.className =
          "resultado-status";


        status.textContent =

          registro.entregue === true

            ?

            "✅ Prêmio entregue"

            :

            "⏳ Aguardando entrega";


        const id =
          document.createElement(
            "div"
          );


        id.className =
          "resultado-id";


        id.textContent =

          "ID do resultado: " +
          registro.id;


        item.appendChild(
          top
        );


        item.appendChild(
          status
        );


        item.appendChild(
          id
        );


        historicoLista.appendChild(
          item
        );

      }
    );

  }

  catch(error){

    /*
    Se as Rules ainda não permitirem
    leitura do histórico, NÃO quebra a roleta.
    */

    console.warn(
      "Histórico indisponível:",
      error
    );


    historicoLista.innerHTML =

      "<div class='sem-premios'>" +

      "📜 Histórico temporariamente indisponível." +

      "</div>";

  }

}


/* =====================================================
   AUTENTICAÇÃO
===================================================== */

onAuthStateChanged(

  auth,

  async usuario => {

    if(
      !usuario
    ){

      window.location.replace(
        "index.html"
      );

      return;

    }


    usuarioAuth =
      usuario;


    try{

      const cadastro =
        await localizarUsuario(
          usuario
        );


      if(
        !cadastro
      ){

        mostrarMensagem(
          "Não foi possível encontrar seu cadastro.",
          "error"
        );


        girosEl.textContent =
          "0";


        girarBtn.disabled =
          true;


        return;

      }


      usuarioRef =
        cadastro.ref;


      usuarioDoc = {

        ...cadastro.data,

        _docId:
          cadastro.id

      };


      await carregarPremios();

      await carregarHistorico();

      atualizarGiros();

    }

    catch(error){

      console.error(
        "Erro ao iniciar roleta:",
        error
      );


      mostrarMensagem(
        "Erro ao carregar a roleta.",
        "error"
      );

    }

  }

);

      );

    }

);
