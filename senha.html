<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Adam Games • Senha</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:#fff;

  background:
    linear-gradient(
      180deg,
      #06304b,
      #031c2d
    );

}


/* =====================================================
   PÁGINA
===================================================== */

.page{

  width:100%;
  max-width:700px;

  margin:0 auto;

  padding:
    14px
    14px
    45px;

}


/* =====================================================
   TOPO
===================================================== */

.top{

  display:grid;

  grid-template-columns:
    50px
    1fr
    50px;

  align-items:center;

  margin-bottom:8px;

}

.back{

  width:46px;
  height:46px;

  border:0;
  border-radius:14px;

  background:
    rgba(8,55,90,.9);

  color:#fff;

  font-size:27px;

  cursor:pointer;

}

.title{

  text-align:center;

}

.title small{

  display:block;

  color:#9bd8f2;

  font-size:10px;

  letter-spacing:3px;

}

.title strong{

  display:block;

  margin-top:2px;

  font-size:25px;

}


/* =====================================================
   INFORMAÇÕES
===================================================== */

.stats{

  display:grid;

  grid-template-columns:
    1fr
    1fr
    1fr;

  gap:8px;

  margin-top:10px;

}

.stat{

  padding:11px 5px;

  text-align:center;

  border-radius:14px;

  background:
    rgba(3,37,61,.82);

  border:
    1px solid
    rgba(255,255,255,.07);

}

.stat-label{

  color:#9fc9df;

  font-size:10px;

  font-weight:bold;

}

.stat-value{

  margin-top:4px;

  font-size:22px;

  font-weight:900;

}

.coins{
  color:#ffd52b;
}

.chances{
  color:#63ffa2;
}

.level{
  color:#72d5ff;
}


/* =====================================================
   BARRA DE PROGRESSO
===================================================== */

.progress{

  width:100%;

  height:9px;

  margin-top:10px;

  overflow:hidden;

  border-radius:20px;

  background:
    rgba(255,255,255,.10);

}

.progress-bar{

  height:100%;

  width:33.333%;

  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      #21dc68,
      #ffe01b
    );

  transition:
    width .3s ease;

}


/* =====================================================
   TÍTULO DA FASE
===================================================== */

.phase-info{

  text-align:center;

  padding:15px 5px 12px;

}

.phase-info h1{

  font-size:
    clamp(
      24px,
      7vw,
      34px
    );

  font-weight:900;

}

.phase-info p{

  margin-top:5px;

  color:#b9d7e8;

  font-size:15px;

}


/* =====================================================
   ÁREA DO JOGO
===================================================== */

.game-area{

  position:relative;

  width:100%;

}


/* =====================================================
   FUNDO DO TABULEIRO
===================================================== */

.board-background{

  position:relative;

  width:100%;

  overflow:hidden;

  border-radius:18px;

  background:#08334d;

  box-shadow:
    0 12px 30px
    rgba(0,0,0,.35);

}


/*
   IMPORTANTE:

   Não usamos o PNG do tabuleiro.

   Somente o fundo da fase.
*/

.board-background img{

  display:block;

  width:100%;

  height:auto;

  user-select:none;

  pointer-events:none;

}


/* =====================================================
   TENTATIVAS SOBRE O FUNDO
===================================================== */

.attempts{

  position:absolute;

  inset:0;

  padding:
    18%
    7%
    19%;

  display:flex;

  flex-direction:column;

  justify-content:space-between;

  pointer-events:none;

}


/* =====================================================
   UMA LINHA
===================================================== */

.attempt{

  width:100%;

  min-height:6.7%;

  display:flex;

  align-items:center;

  gap:7px;

}


/* número */

.attempt-number{

  width:22px;

  flex-shrink:0;

  color:#fff;

  font-size:13px;

  font-weight:900;

  text-align:center;

  text-shadow:
    0 2px 4px #000;

}


/* área das cores */

.attempt-colors{

  display:flex;

  align-items:center;

  gap:5px;

  flex:1;

  min-width:0;

}


/* área das pistas */

.attempt-result{

  width:45px;

  min-width:45px;

  display:flex;

  justify-content:flex-end;

  align-items:center;

  gap:3px;

}


/* =====================================================
   BOLINHAS COLORIDAS DAS TENTATIVAS
===================================================== */

.guess-ball{

  width:
    clamp(
      24px,
      7vw,
      42px
    );

  height:
    clamp(
      24px,
      7vw,
      42px
    );

  border-radius:50%;

  flex-shrink:0;

  border:
    2px solid
    rgba(75,40,10,.8);

  box-shadow:
    0 2px 5px
    rgba(0,0,0,.45);

}


/* =====================================================
   BOLINHAS PRETAS / BRANCAS
===================================================== */

.result-ball{

  width:
    clamp(
      8px,
      2.3vw,
      13px
    );

  height:
    clamp(
      8px,
      2.3vw,
      13px
    );

  border-radius:50%;

  flex-shrink:0;

  border:
    1px solid
    rgba(0,0,0,.5);

  box-shadow:
    0 1px 3px
    rgba(0,0,0,.45);

}

.result-black{

  background:#050505;

}

.result-white{

  background:#fff;

}


/* =====================================================
   ÁREA DE ESCOLHA
===================================================== */

.controls{

  margin-top:12px;

}


/* =====================================================
   TENTATIVA ATUAL
===================================================== */

.current-guess{

  min-height:55px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:7px;

  margin-bottom:9px;

  padding:8px;

  border-radius:15px;

  background:
    rgba(20,12,8,.88);

  border:
    2px solid
    rgba(180,120,50,.75);

}


/* =====================================================
   PALETA
===================================================== */

.palette{

  display:grid;

  grid-template-columns:
    repeat(6,1fr);

  gap:7px;

  padding:8px;

  border-radius:17px;

  background:
    rgba(20,13,10,.94);

  border:
    2px solid
    rgba(180,120,50,.8);

}


/* botão */

.color-button{

  height:65px;

  display:flex;

  align-items:center;

  justify-content:center;

  border:0;

  border-radius:13px;

  background:
    rgba(255,255,255,.06);

  cursor:pointer;

}

.color-button:active{

  transform:scale(.94);

}


/* =====================================================
   BOLAS DA PALETA
===================================================== */

.palette-ball{

  width:
    clamp(
      42px,
      11vw,
      58px
    );

  height:
    clamp(
      42px,
      11vw,
      58px
    );

  border-radius:50%;

  border:
    2px solid
    rgba(75,40,10,.9);

  box-shadow:
    inset
    0 2px 5px
    rgba(255,255,255,.35),

    0 3px 6px
    rgba(0,0,0,.45);

}


/* =====================================================
   CORES
===================================================== */

.vermelho{

  background:
    radial-gradient(
      circle at 30% 25%,
      #ff7373,
      #ef1111 45%,
      #b50000
    );

}

.azul{

  background:
    radial-gradient(
      circle at 30% 25%,
      #72bfff,
      #0870df 45%,
      #00449c
    );

}

.verde{

  background:
    radial-gradient(
      circle at 30% 25%,
      #77ef83,
      #12c62c 45%,
      #008313
    );

}

.amarelo{

  background:
    radial-gradient(
      circle at 30% 25%,
      #fff27a,
      #ffd000 45%,
      #d99b00
    );

}

.roxo{

  background:
    radial-gradient(
      circle at 30% 25%,
      #d083ff,
      #8d19e8 45%,
      #5b009f
    );

}

.laranja{

  background:
    radial-gradient(
      circle at 30% 25%,
      #ffc274,
      #ff8b00 45%,
      #cf5800
    );

}


/* =====================================================
   BOTÕES
===================================================== */

.action-buttons{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:10px;

  margin-top:10px;

}

.action{

  height:55px;

  border:0;

  border-radius:15px;

  color:#fff;

  font-size:16px;

  font-weight:900;

  cursor:pointer;

}

.clear{

  background:
    linear-gradient(
      135deg,
      #315d82,
      #174366
    );

}

.confirm{

  background:
    linear-gradient(
      135deg,
      #25d86d,
      #0a9847
    );

}

.action:active{

  transform:scale(.98);

}

.action:disabled{

  opacity:.45;

  cursor:not-allowed;

}


/* =====================================================
   MENSAGEM
===================================================== */

.message{

  min-height:24px;

  margin-top:9px;

  text-align:center;

  color:#bcd9e8;

  font-size:13px;

  font-weight:bold;

}

.message.error{

  color:#ff7777;

}

.message.success{

  color:#62ff9e;

}


/* =====================================================
   MODAL
===================================================== */

.modal{

  position:fixed;

  inset:0;

  z-index:999;

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:
    rgba(0,10,20,.82);

  backdrop-filter:
    blur(5px);

}

.modal.show{

  display:flex;

}

.modal-card{

  width:100%;

  max-width:360px;

  padding:25px 20px;

  text-align:center;

  border-radius:22px;

  background:
    #082742;

  border:
    1px solid
    rgba(255,255,255,.12);

}

.modal-icon{

  font-size:45px;

}

.modal-card h2{

  margin-top:8px;

  font-size:24px;

}

.modal-card p{

  margin-top:8px;

  color:#bdd7e7;

  line-height:1.5;

}

.modal-button{

  width:100%;

  height:50px;

  margin-top:18px;

  border:0;

  border-radius:13px;

  background:#19b961;

  color:#fff;

  font-weight:900;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:430px){

  .page{

    padding:
      10px
      10px
      35px;

  }

  .attempts{

    padding:
      17%
      5%
      18%;

  }

  .attempt{

    gap:4px;

  }

  .attempt-number{

    width:18px;

    font-size:11px;

  }

  .attempt-result{

    width:39px;

    min-width:39px;

    gap:2px;

  }

  .palette{

    gap:4px;

    padding:6px;

  }

  .color-button{

    height:58px;

  }

  .current-guess{

    min-height:50px;

  }

}


/* =====================================================
   TELAS MUITO PEQUENAS
===================================================== */

@media(max-width:360px){

  .palette-ball{

    width:38px;

    height:38px;

  }

  .color-button{

    height:53px;

  }

}

</style>

</head>


<body>


<div class="page">

<!-- =====================================================
     MODAL

<div
  class="modal"
  id="modal">

    </div>

    </p>


    <button

<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  updateDoc,
  increment
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:
    "adam-games-21081.firebaseapp.com",

  projectId:
    "adam-games-21081",

  storageBucket:
    "adam-games-21081.firebasestorage.app",

  messagingSenderId:
    "1055528418738",

  appId:
    "1:1055528418738:web:5fafdf63424ba9744eb8ab"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================================
   ELEMENTOS
===================================================== */

const coinsEl =
  document.getElementById("coins");

const chancesEl =
  document.getElementById("chances");

const levelEl =
  document.getElementById("level");

const progressBar =
  document.getElementById("progressBar");

const phaseTitle =
  document.getElementById("phaseTitle");

const phaseText =
  document.getElementById("phaseText");

const attemptsEl =
  document.getElementById("attempts");

const currentGuessEl =
  document.getElementById("currentGuess");

const clearButton =
  document.getElementById("clear");

const confirmButton =
  document.getElementById("confirm");

const messageEl =
  document.getElementById("message");

const modal =
  document.getElementById("modal");

const modalIcon =
  document.getElementById("modalIcon");

const modalTitle =
  document.getElementById("modalTitle");

const modalText =
  document.getElementById("modalText");

const modalButton =
  document.getElementById("modalButton");


/* =====================================================
   ESTADO DO JOGO
===================================================== */

let usuario = null;

let documentoId = null;

let nivel = 1;

let tentativaAtual = [];

let tentativaNumero = 0;

let senha = [];

let jogoIniciado = false;

let jogoEncerrado = false;


/* =====================================================
   CORES DISPONÍVEIS
===================================================== */

const cores = [

  "vermelho",
  "azul",
  "verde",
  "amarelo",
  "roxo",
  "laranja"

];


/* =====================================================
   GERAR SENHA
===================================================== */

function gerarSenha(){

  const novaSenha = [];

  for(let i = 0; i < 3; i++){

    const indice =
      Math.floor(
        Math.random() * cores.length
      );

    novaSenha.push(
      cores[indice]
    );

  }

  return novaSenha;

}


/*
   A senha existe somente na memória JavaScript.

   Ela NÃO é colocada no HTML.

   Ela NÃO é exibida na tela.
*/

function iniciarNivel(){

  senha =
    gerarSenha();

  tentativaAtual = [];

  tentativaNumero = 0;

  jogoEncerrado = false;

  renderTentativas();

  renderTentativaAtual();

  atualizarInformacoes();

  messageEl.textContent =
    "Escolha as 3 cores da senha.";

  messageEl.className =
    "message";

}


/* =====================================================
   LOCALIZAR USUÁRIO
===================================================== */

async function localizarUsuario(user){

  let resultado =
    await getDocs(

      query(
        collection(db,"admins"),
        where(
          "uid",
          "==",
          user.uid
        )
      )

    );


  if(
    resultado.empty &&
    user.email
  ){

    resultado =
      await getDocs(

        query(
          collection(db,"admins"),
          where(
            "email",
            "==",
            user.email.toLowerCase()
          )
        )

      );

  }


  if(
    resultado.empty
  ){

    return null;

  }


  return resultado.docs[0];

}


/* =====================================================
   ATUALIZAR SALDOS
===================================================== */

function atualizarInformacoes(){

  if(!usuario){

    return;

  }


  coinsEl.textContent =
    Number(
      usuario.moedas || 0
    ).toLocaleString("pt-BR");


  chancesEl.textContent =
    Number(
      usuario.chances || 0
    ).toLocaleString("pt-BR");


  levelEl.textContent =
    nivel + " / 3";


  progressBar.style.width =
    (
      (nivel / 3) * 100
    ) + "%";


  phaseTitle.textContent =
    "NÍVEL " +
    nivel +
    " — DESCUBRA A SENHA";


  phaseText.textContent =
    "A senha possui 3 cores. Você tem 10 tentativas.";

}


/* =====================================================
   CRIAR 10 LINHAS
===================================================== */

function renderTentativas(){

  attemptsEl.innerHTML = "";


  for(
    let i = 0;
    i < 10;
    i++
  ){

    const linha =
      document.createElement("div");

    linha.className =
      "attempt";


    const numero =
      document.createElement("div");

    numero.className =
      "attempt-number";

    numero.textContent =
      i + 1;


    const coresArea =
      document.createElement("div");

    coresArea.className =
      "attempt-colors";


    const resultadoArea =
      document.createElement("div");

    resultadoArea.className =
      "attempt-result";


    /*
       Se essa tentativa já aconteceu,
       desenha as cores e resultados.
    */

    if(i < tentativaNumero){

      const tentativa =
        historico[i];


      tentativa.cores.forEach(
        cor => {

          const bola =
            document.createElement("span");

          bola.className =
            "guess-ball " + cor;

          coresArea.appendChild(
            bola
          );

        }
      );


      tentativa.resultado.forEach(
        resultado => {

          const bola =
            document.createElement("span");

          bola.className =
            "result-ball " +
            (
              resultado === "preta"
                ? "result-black"
                : "result-white"
            );

          resultadoArea.appendChild(
            bola
          );

        }
      );

    }


    linha.appendChild(
      numero
    );

    linha.appendChild(
      coresArea
    );

    linha.appendChild(
      resultadoArea
    );


    attemptsEl.appendChild(
      linha
    );

  }

}


/* =====================================================
   HISTÓRICO
===================================================== */

let historico = [];


/* =====================================================
   MOSTRAR TENTATIVA ATUAL
===================================================== */

function renderTentativaAtual(){

  currentGuessEl.innerHTML = "";


  if(
    tentativaAtual.length === 0
  ){

    const texto =
      document.createElement("span");

    texto.textContent =
      "Escolha as 3 cores";

    texto.style.color =
      "#9db8c8";

    texto.style.fontSize =
      "13px";

    texto.style.fontWeight =
      "bold";

    currentGuessEl.appendChild(
      texto
    );

  }


  tentativaAtual.forEach(
    cor => {

      const bola =
        document.createElement("span");

      bola.className =
        "guess-ball " + cor;

      currentGuessEl.appendChild(
        bola
      );

    }
  );


  confirmButton.disabled =
    tentativaAtual.length !== 3;

}


/* =====================================================
   ESCOLHER COR
===================================================== */

document
  .querySelectorAll(".color-button")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          if(
            jogoEncerrado
          ){

            return;

          }


          if(
            tentativaAtual.length >= 3
          ){

            return;

          }


          const cor =
            button.dataset.color;


          tentativaAtual.push(
            cor
          );


          renderTentativaAtual();

        }
      );

    }
  );


/* =====================================================
   LIMPAR
===================================================== */

clearButton.addEventListener(
  "click",
  () => {

    if(jogoEncerrado){

      return;

    }


    tentativaAtual = [];

    renderTentativaAtual();

  }
);


/* =====================================================
   CALCULAR RESULTADO
===================================================== */

function calcularResultado(
  tentativa,
  resposta
){

  const resultado = [];

  const restantesSenha = {};

  const restantesTentativa = {};


  /*
     PRIMEIRO:
     cor certa no lugar certo.
  */

  for(
    let i = 0;
    i < 3;
    i++
  ){

    if(
      tentativa[i] === resposta[i]
    ){

      resultado.push(
        "preta"
      );

    }
    else{

      resultado.push(
        null
      );

      restantesSenha[
        resposta[i]
      ] =
        (
          restantesSenha[
            resposta[i]
          ] || 0
        ) + 1;

      restantesTentativa[
        tentativa[i]
      ] =
        (
          restantesTentativa[
            tentativa[i]
          ] || 0
        ) + 1;

    }

  }


  /*
     SEGUNDO:
     cor certa no lugar errado.
  */

  for(
    let i = 0;
    i < 3;
    i++
  ){

    if(
      resultado[i] !== null
    ){

      continue;

    }


    const cor =
      tentativa[i];


    if(
      restantesSenha[cor] > 0
    ){

      resultado[i] =
        "branca";

      restantesSenha[cor]--;

    }
    else{

      resultado[i] =
        null;

    }

  }


  /*
     Somente mostramos as bolas de resultado.
  */

  return resultado.filter(
    resultado =>
      resultado !== null
  );

}


/* =====================================================
   CONFIRMAR
===================================================== */

confirmButton.addEventListener(
  "click",
  async () => {

    if(
      jogoEncerrado ||
      tentativaAtual.length !== 3
    ){

      return;

    }


    const tentativa =
      [...tentativaAtual];


    const resultado =
      calcularResultado(
        tentativa,
        senha
      );


    historico.push({

      cores:
        tentativa,

      resultado:
        resultado

    });


    tentativaNumero++;


    /*
       ACERTOU A SENHA
    */

    const acertou =
      tentativa[0] === senha[0] &&
      tentativa[1] === senha[1] &&
      tentativa[2] === senha[2];


    tentativaAtual = [];


    renderTentativas();

    renderTentativaAtual();


    if(acertou){

      jogoEncerrado = true;


      /*
         Níveis 1–3:
         +20 moedas
      */

      await adicionarMoedas(
        20
      );


      messageEl.textContent =
        "🎉 Senha correta! +20 moedas.";

      messageEl.className =
        "message success";


      mostrarModal(

        "🎉",

        "Senha descoberta!",

        "Você acertou a senha do nível " +
        nivel +
        " e ganhou +20 Adam Coins.",

        nivel < 3
          ? "PRÓXIMO NÍVEL"
          : "FINALIZAR"

      );


      return;

    }


    /*
       ACABARAM AS 10 TENTATIVAS
    */

    if(
      tentativaNumero >= 10
    ){

      jogoEncerrado = true;


      messageEl.textContent =
        "❌ Suas 10 tentativas acabaram.";

      messageEl.className =
        "message error";


      mostrarModal(

        "💔",

        "Fim da fase",

        "Você não descobriu a senha desta vez.",

        "VOLTAR"

      );


      return;

    }


    messageEl.textContent =
      "Tentativa " +
      tentativaNumero +
      "/10 registrada.";

  }

);


/* =====================================================
   MODAL
===================================================== */

function mostrarModal(
  icone,
  titulo,
  texto,
  botao
){

  modalIcon.textContent =
    icone;

  modalTitle.textContent =
    titulo;

  modalText.textContent =
    texto;

  modalButton.textContent =
    botao;

  modal.classList.add(
    "show"
  );

}


/* =====================================================
   BOTÃO DO MODAL
===================================================== */

modalButton.addEventListener(
  "click",
  () => {

    modal.classList.remove(
      "show"
    );


    /*
       PRÓXIMO NÍVEL
    */

    if(
      nivel < 3 &&
      jogoEncerrado &&
      historico.length > 0
    ){

      /*
         Verifica se foi vitória
         pela mensagem.
      */

      if(
        messageEl.classList.contains(
          "success"
        )
      ){

        nivel++;

        historico = [];

        iniciarNivel();

        return;

      }

    }


    /*
       Final da fase 3
    */

    window.location.href =
      "jogos.html";

  }
);


/* =====================================================
   ADICIONAR MOEDAS
===================================================== */

async function adicionarMoedas(
  quantidade
){

  if(
    !documentoId ||
    !usuario
  ){

    return;

  }


  try{

    await updateDoc(

      (
        await getDocs(

          query(
            collection(
              db,
              "admins"
            ),
            where(
              "__name__",
              "==",
              documentoId
            )
          )

        )
      ).docs[0].ref,

      {

        moedas:
          increment(
            quantidade
          )

      }

    );


    usuario.moedas =
      Number(
        usuario.moedas || 0
      ) +
      quantidade;


    atualizarInformacoes();

  }
  catch(error){

    console.error(
      "Erro ao adicionar moedas:",
      error
    );

  }

}


/* =====================================================
   INICIAR PARTIDA
===================================================== */

async function iniciarPartida(){

  if(
    jogoIniciado
  ){

    return;

  }


  jogoIniciado = true;


  /*
     Ao iniciar:

     -1 chance
     +30 moedas

     sessionStorage evita que um simples
     refresh consuma outra chance.
  */

  const chaveInicio =
    "senha_partida_iniciada";


  const jaIniciou =
    sessionStorage.getItem(
      chaveInicio
    );


  if(
    !jaIniciou &&
    usuario &&
    documentoId
  ){

    try{

      const docs =
        await getDocs(

          query(
            collection(
              db,
              "admins"
            ),
            where(
              "__name__",
              "==",
              documentoId
            )
          )

        );


      if(
        !docs.empty
      ){

        await updateDoc(
          docs.docs[0].ref,
          {

            chances:
              increment(-1),

            moedas:
              increment(30)

          }
        );


        usuario.chances =
          Math.max(
            0,
            Number(
              usuario.chances || 0
            ) - 1
          );


        usuario.moedas =
          Number(
            usuario.moedas || 0
          ) + 30;


        sessionStorage.setItem(
          chaveInicio,
          "1"
        );

      }

    }
    catch(error){

      console.error(
        "Erro ao iniciar partida:",
        error
      );

    }

  }


  atualizarInformacoes();

}


/* =====================================================
   VOLTAR
===================================================== */

document
  .getElementById("back")
  .addEventListener(
    "click",
    () => {

      window.location.href =
        "jogos.html";

    }
  );


/* =====================================================
   FIREBASE — LOGIN
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      window.location.replace(
        "index.html"
      );

      return;

    }


    try{

      const documento =
        await localizarUsuario(
          user
        );


      if(
        !documento
      ){

        chancesEl.textContent =
          "—";

        messageEl.textContent =
          "Cadastro não encontrado.";

        messageEl.className =
          "message error";

        return;

      }


      usuario =
        documento.data();


      documentoId =
        documento.id;


      atualizarInformacoes();


      /*
         Começa a partida.
      */

      iniciarPartida();

    }
    catch(error){

      console.error(
        error
      );

      messageEl.textContent =
        "Erro ao carregar o jogo.";

      messageEl.className =
        "message error";

    }

  }
);


/* =====================================================
   INICIALIZAÇÃO VISUAL
===================================================== */

iniciarNivel();


</script>
