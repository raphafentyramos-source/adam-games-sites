<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,viewport-fit=cover"
>

<title>Adam Games • Senha</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  min-height:100%;
  background:#061b2d;
}

body{

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:#fff;

  background:
    radial-gradient(
      circle at 15% 0%,
      rgba(40,190,255,.25),
      transparent 32%
    ),

    radial-gradient(
      circle at 85% 10%,
      rgba(120,60,255,.18),
      transparent 30%
    ),

    linear-gradient(
      180deg,
      #07506c 0%,
      #073653 48%,
      #031b2d 100%
    );

}

button{
  font:inherit;
  -webkit-tap-highlight-color:transparent;
}

.page{

  width:100%;
  max-width:720px;
  margin:auto;

  padding:
    14px
    10px
    70px;

}

.top{

  display:flex;
  align-items:center;
  justify-content:space-between;

}

.back{

  width:45px;
  height:45px;

  border:0;
  border-radius:14px;

  background:#073d60;

  color:#fff;

  font-size:26px;

  cursor:pointer;

}

.title{

  text-align:center;

  text-shadow:
    0 2px 6px #000;

}

.title small{

  display:block;

  color:#bcecff;

  font-size:10px;

  letter-spacing:2px;

}

.title strong{

  font-size:22px;

}

.spacer{
  width:45px;
}

.card{

  margin-top:13px;

  padding:12px;

  border-radius:23px;

  background:
    rgba(2,28,47,.88);

  border:
    1px solid
    rgba(255,255,255,.12);

  box-shadow:
    0 15px 35px
    rgba(0,0,0,.35);

}

.stats{

  display:grid;

  grid-template-columns:
    1fr 1fr 1fr;

  gap:8px;

}

.stat{

  padding:
    9px 5px;

  border-radius:14px;

  text-align:center;

  background:
    rgba(0,0,0,.22);

}

.stat small{

  display:block;

  color:#a9d7eb;

  font-size:9px;

  font-weight:900;

}

.stat b{

  display:block;

  margin-top:4px;

  font-size:20px;

}

.coins{
  color:#ffd52b;
}

.chances{
  color:#58ff9b;
}

.level{
  color:#6fd5ff;
}

.progress{

  height:8px;

  margin-top:10px;

  border-radius:20px;

  overflow:hidden;

  background:#16394e;

}

.progress-bar{

  height:100%;

  width:0;

  background:
    linear-gradient(
      90deg,
      #18d66b,
      #ffd52b
    );

  transition:.3s;

}

.timer{

  display:none;

  margin-top:10px;

  padding:9px;

  border-radius:13px;

  text-align:center;

  background:
    rgba(255,205,40,.12);

  border:
    1px solid
    rgba(255,210,40,.4);

  color:#ffd52b;

  font-weight:900;

}

.timer.show{
  display:block;
}

.timer.danger{

  color:#ff555f;

  border-color:#ff555f;

}

.info{

  padding:
    13px
    5px
    6px;

  text-align:center;

}

.info h1{

  font-size:21px;

  font-weight:900;

}

.info p{

  margin-top:5px;

  color:#c3dfea;

  font-size:13px;

}

.board-area{

  position:relative;

  width:100%;

  overflow:hidden;

  border-radius:18px;

  background:
    rgba(255,255,255,.035);

}

.board{

  position:relative;

  width:100%;

  aspect-ratio:1024/1536;

  background:
    url("./C0A67B9D-67BE-49A6-8747-B5B2A32411C4.png")
    center/100% 100%
    no-repeat;

}

.rows{

  position:absolute;

  z-index:2;

  left:9.5%;
  right:9.5%;
  top:15%;
  bottom:15%;

  display:grid;

  grid-template-rows:
    repeat(10,1fr);

}

.row{

  display:flex;

  align-items:center;

}

.guesses{

  width:62%;

  display:flex;

  align-items:center;

  gap:2.5%;

}

.slot{

  width:15%;

  aspect-ratio:1;

  border-radius:50%;

  overflow:hidden;

  display:flex;

  align-items:center;

  justify-content:center;

}

.slot img{

  width:100%;
  height:100%;

  object-fit:contain;

}

.feedback{

  width:31%;

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:5%;

  padding:0 4%;

}

.feedback-dot{

  width:100%;

  aspect-ratio:1;

  border-radius:50%;

  background-size:
    contain;

  background-position:center;

  background-repeat:no-repeat;

}

.feedback-dot.black{

  background-image:
    url("./preto.png");

}

.feedback-dot.white{

  background-image:
    url("./branco.png");

}

.palette{

  position:relative;

  z-index:50;

  display:grid;

  grid-template-columns:
    repeat(6,1fr);

  gap:7px;

  margin-top:12px;

  padding:10px;

  border-radius:18px;

  background:
    rgba(38,20,8,.82);

  border:
    2px solid
    #9b6a32;

}

.color-button{

  height:62px;

  display:flex;

  align-items:center;

  justify-content:center;

  border:0;

  border-radius:13px;

  background:
    rgba(255,255,255,.04);

  cursor:pointer;

}

.color-button:active{

  transform:scale(.92);

}

.color-button.selected{

  background:
    rgba(255,255,255,.2);

  box-shadow:
    inset 0 0 0 2px
    #fff8;

}

.color-button img{

  width:100%;
  height:100%;

  max-height:55px;

  object-fit:contain;

  pointer-events:none;

}

.current{

  min-height:48px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:7px;

  margin-top:8px;

}

.current-ball{

  width:35px;

  height:35px;

  border-radius:50%;

  overflow:hidden;

  background:#130d08;

  border:
    2px solid
    #8d6337;

}

.current-ball img{

  width:100%;
  height:100%;

  object-fit:contain;

}

.controls{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:9px;

  margin-top:9px;

}

.control{

  height:48px;

  border:0;

  border-radius:14px;

  color:#fff;

  font-weight:900;

  cursor:pointer;

}

.clear{

  background:
    linear-gradient(
      145deg,
      #315b79,
      #183c58
    );

}

.confirm{

  background:
    linear-gradient(
      145deg,
      #25d86d,
      #087d42
    );

}

.message{

  min-height:22px;

  margin-top:8px;

  text-align:center;

  color:#c5e1ed;

  font-size:12px;

  font-weight:800;

}

.modal{

  position:fixed;

  inset:0;

  z-index:999;

  display:none;

  align-items:center;

  justify-content:center;

  padding:18px;

  background:
    rgba(0,10,22,.86);

  backdrop-filter:
    blur(6px);

}

.modal.show{
  display:flex;
}

.modal-card{

  width:100%;
  max-width:390px;

  padding:24px 18px;

  border-radius:23px;

  text-align:center;

  background:
    linear-gradient(
      145deg,
      #0a3c55,
      #251044
    );

  border:
    1px solid
    rgba(255,255,255,.15);

}

.modal-card h2{
  font-size:23px;
}

.modal-card p{

  margin-top:10px;

  color:#c5dce9;

  font-size:14px;

  line-height:1.5;

}

.modal-buttons{

  display:grid;

  gap:9px;

  margin-top:18px;

}

.modal-buttons button{

  height:47px;

  border:0;

  border-radius:14px;

  color:#fff;

  font-weight:900;

  cursor:pointer;

}

.primary{
  background:#19b760;
}

.secondary{
  background:#ffffff18;
}

.gold{
  color:#ffd52b;
}

@media(max-width:500px){

  .card{
    padding:9px;
  }

  .color-button{
    height:55px;
  }

  .color-button img{
    max-height:48px;
  }

  .stat b{
    font-size:17px;
  }

}

</style>

</head>


<body>


<div class="page">


  <div class="top">

    <div class="title">

  </div>


  <div class="card">

</div>

    <div

      id="modalButtons">

    </div>

  </div>

</div>


<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  doc,
  updateDoc,
  increment
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:
    "adam-games-21081.firebaseapp.com",

  projectId:
    "adam-games-21081",

  storageBucket:
    "adam-games-21081.firebasestorage.app",

  messagingSenderId:
    "1055528418738",

  appId:
    "1:1055528418738:web:5fafdf63424ba9744eb8ab"

};


const app=
  initializeApp(
    firebaseConfig
  );

const auth=
  getAuth(app);

const db=
  getFirestore(app);


/* =====================================================
   ELEMENTOS
===================================================== */

const $=
  id =>
    document.getElementById(id);


/* =====================================================
   ASSETS
===================================================== */

const COLORS=[

  "vermelho",
  "azul",
  "verde",
  "amarelo",
  "roxo",
  "laranja"

];


const FILES={

  vermelho:
    "./vermelho.png",

  azul:
    "./azul.png",

  verde:
    "./verde.png",

  amarelo:
    "./amarelo.png",

  roxo:
    "./roxo.png",

  laranja:
    "./laranja.png"

};


/* =====================================================
   CONFIGURAÇÃO DAS 9 FASES
===================================================== */

const LEVELS={

  1:{
    colors:3,
    reward:20
  },

  2:{
    colors:3,
    reward:20
  },

  3:{
    colors:3,
    reward:20
  },

  4:{
    colors:4,
    reward:30
  },

  5:{
    colors:4,
    reward:30
  },

  6:{
    colors:4,
    reward:30
  },

  7:{
    colors:5,
    reward:30
  },

  8:{
    colors:6,
    reward:75,
    hard:true
  },

  9:{
    colors:6,
    rewardNormal:100,
    rewardFast:150,
    bonus:true
  }

};


const MAX_ATTEMPTS=10;

const BONUS_SECONDS=30;


/* =====================================================
   ESTADO
===================================================== */

let usuario=null;

let usuarioDoc=null;

let nivel=1;

let senha=[];

let tentativa=[];

let tentativaNumero=0;

let bloqueado=false;

let timerInterval=null;

let timerStart=0;

let entradaProcessada=false;


/* =====================================================
   SESSION KEY
===================================================== */

function sessionKey(){

  if(!usuario){
    return null;
  }

  return:
    "adam_senha_entrada_" +
    usuario.uid;

}


/* =====================================================
   VERIFICAR SE JÁ ENTROU
===================================================== */

function jaEntrouNestaSessao(){

  const key=
    sessionKey();

  if(!key){
    return false;
  }

  return sessionStorage.getItem(
    key
  ) === "1";

}


function marcarEntrada(){

  const key=
    sessionKey();

  if(key){

    sessionStorage.setItem(
      key,
      "1"
    );

  }

}


/* =====================================================
   SALDOS
===================================================== */

function renderSaldo(){

  $("coins").textContent=
    Number(
      usuario?.moedas || 0
    ).toLocaleString(
      "pt-BR"
    );


  $("chances").textContent=
    Number(
      usuario?.chances || 0
    ).toLocaleString(
      "pt-BR"
    );


  $("level").textContent=
    `${nivel} / 9`;


  $("progress").style.width=
    `${nivel/9*100}%`;

}


/* =====================================================
   LOCALIZAR USUÁRIO
===================================================== */

async function localizarUsuario(user){

  let resultado=
    await getDocs(

      query(
        collection(
          db,
          "admins"
        ),

        where(
          "uid",
          "==",
          user.uid
        )

      )

    );


  if(
    resultado.empty &&
    user.email
  ){

    resultado=
      await getDocs(

        query(
          collection(
            db,
            "admins"
          ),

          where(
            "email",
            "==",
            user.email.toLowerCase()
          )

        )

      );

  }


  if(resultado.empty){

    return null;

  }


  return resultado.docs[0];

}


/* =====================================================
   ALTERAR SALDO
===================================================== */

async function alterarSaldo(
  moedas,
  chances
){

  const ref=
    doc(
      db,
      "admins",
      usuarioDoc.id
    );


  const moedasAtual=
    Number(
      usuario.moedas || 0
    );


  const chancesAtual=
    Number(
      usuario.chances || 0
    );


  const novasMoedas=
    moedasAtual +
    moedas;


  const novasChances=
    chancesAtual +
    chances;


  if(
    novasChances < 0
  ){

    throw new Error(
      "Você não possui chances suficientes."
    );

  }


  await updateDoc(
    ref,
    {

      moedas:
        increment(moedas),

      chances:
        increment(chances)

    }
  );


  usuario.moedas=
    novasMoedas;


  usuario.chances=
    novasChances;


  renderSaldo();

}


/* =====================================================
   GERAR SENHA
===================================================== */

function gerarSenha(tamanho){

  /*
    A senha existe SOMENTE nesta variável.
    Não é inserida no HTML.
  */

  const disponiveis=
    [
      ...COLORS
    ];


  const resultado=[];


  while(
    resultado.length <
    tamanho
  ){

    const indice=
      Math.floor(
        Math.random() *
        disponiveis.length
      );


    resultado.push(
      disponiveis[indice]
    );


    disponiveis.splice(
      indice,
      1
    );

  }


  return resultado;

}


/* =====================================================
   PALETA
===================================================== */

function montarPaleta(){

  const palette=
    $("palette");


  palette.innerHTML="";


  COLORS.forEach(
    cor=>{

      const button=
        document.createElement(
          "button"
        );


      button.type="button";

      button.className=
        "color-button";


      const img=
        document.createElement(
          "img"
        );


      img.src=
        FILES[cor];

      img.alt="";


      button.appendChild(
        img
      );


      button.addEventListener(
        "click",
        ()=>{

          escolherCor(
            cor,
            button
          );

        }
      );


      palette.appendChild(
        button
      );

    }
  );

}


/* =====================================================
   ESCOLHER COR
===================================================== */

function escolherCor(
  cor,
  button
){

  if(
    bloqueado
  ){

    return;

  }


  const quantidade=
    LEVELS[nivel].colors;


  if(
    tentativa.length >=
    quantidade
  ){

    $("message").textContent=
      "Você já escolheu todas as cores.";

    return;

  }


  tentativa.push(
    cor
  );


  button.classList.add(
    "selected"
  );


  setTimeout(
    ()=>{
      button.classList.remove(
        "selected"
      );
    },
    200
  );


  renderTentativa();


  $("message").textContent=
    `${tentativa.length}/${quantidade} cores escolhidas.`;

}


/* =====================================================
   MOSTRAR ESCOLHA ATUAL
===================================================== */

function renderTentativa(){

  const current=
    $("current");


  current.innerHTML="";


  tentativa.forEach(
    cor=>{

      const bola=
        document.createElement(
          "div"
        );


      bola.className=
        "current-ball";


      const img=
        document.createElement(
          "img"
        );


      img.src=
        FILES[cor];

      img.alt="";


      bola.appendChild(
        img
      );


      current.appendChild(
        bola
      );

    }
  );


  renderLinhaAtual();

}


/* =====================================================
   CRIAR 10 LINHAS
===================================================== */

function criarTabuleiro(){

  const rows=
    $("rows");


  rows.innerHTML="";


  for(
    let linha=0;
    linha<MAX_ATTEMPTS;
    linha++
  ){

    const row=
      document.createElement(
        "div"
      );


    row.className=
      "row";


    row.dataset.row=
      linha;


    const guesses=
      document.createElement(
        "div"
      );


    guesses.className=
      "guesses";


    for(
      let i=0;
      i<6;
      i++
    ){

      const slot=
        document.createElement(
          "div"
        );


      slot.className=
        "slot";


      slot.dataset.slot=
        i;


      guesses.appendChild(
        slot
      );

    }


    const feedback=
      document.createElement(
        "div"
      );


    feedback.className=
      "feedback";


    for(
      let i=0;
      i<5;
      i++
    ){

      const dot=
        document.createElement(
          "span"
        );


      dot.className=
        "feedback-dot";


      feedback.appendChild(
        dot
      );

    }


    row.append(
      guesses,
      feedback
    );


    rows.appendChild(
      row
    );

  }


  ajustarQuantidadeSlots();

}


/* =====================================================
   OCULTAR SLOTS QUE NÃO SÃO USADOS
===================================================== */

function ajustarQuantidadeSlots(){

  const quantidade=
    LEVELS[nivel].colors;


  document
    .querySelectorAll(
      ".row"
    )
    .forEach(
      row=>{

        [
          ...row.querySelectorAll(
            ".slot"
          )
        ]
        .forEach(
          (slot,index)=>{

            slot.style.visibility=
              index <
              quantidade
                ? "visible"
                : "hidden";

          }
        );

      }
    );

}


/* =====================================================
   LINHA ATUAL
===================================================== */

function renderLinhaAtual(){

  const row=
    document.querySelector(
      `.row[data-row="${tentativaNumero}"]`
    );


  if(!row){
    return;
  }


  const slots=
    [
      ...row.querySelectorAll(
        ".slot"
      )
    ];


  slots.forEach(
    (slot,index)=>{

      slot.innerHTML="";


      if(
        tentativa[index]
      ){

        const img=
          document.createElement(
            "img"
          );


        img.src=
          FILES[
            tentativa[index]
          ];


        img.alt="";


        slot.appendChild(
          img
        );

      }

    }
  );

}


/* =====================================================
   COMPARAR
===================================================== */

function comparar(
  palpite,
  resposta
){

  let pretas=0;

  let brancas=0;


  const respostaUsada=
    new Array(
      resposta.length
    )
    .fill(false);


  const palpiteUsado=
    new Array(
      palpite.length
    )
    .fill(false);


  /*
    Primeiro:
    posição correta.
  */

  for(
    let i=0;
    i<resposta.length;
    i++
  ){

    if(
      palpite[i] ===
      resposta[i]
    ){

      pretas++;

      respostaUsada[i]=true;

      palpiteUsado[i]=true;

    }

  }


  /*
    Segundo:
    cor correta em
    posição errada.
  */

  for(
    let i=0;
    i<palpite.length;
    i++
  ){

    if(
      palpiteUsado[i]
    ){

      continue;

    }


    for(
      let j=0;
      j<resposta.length;
      j++
    ){

      if(
        respostaUsada[j]
      ){

        continue;

      }


      if(
        palpite[i] ===
        resposta[j]
      ){

        brancas++;

        respostaUsada[j]=true;

        palpiteUsado[i]=true;

        break;

      }

    }

  }


  return {
    pretas,
    brancas
  };

}


/* =====================================================
   MOSTRAR RESULTADO
===================================================== */

function mostrarResultado(
  resultado
){

  const row=
    document.querySelector(
      `.row[data-row="${tentativaNumero}"]`
    );


  if(!row){
    return;
  }


  const dots=
    [
      ...row.querySelectorAll(
        ".feedback-dot"
      )
    ];


  for(
    let i=0;
    i<resultado.pretas;
    i++
  ){

    dots[i].classList.add(
      "black"
    );

  }


  for(
    let i=0;
    i<resultado.brancas;
    i++
  ){

    dots[
      resultado.pretas+i
    ]
    .classList.add(
      "white"
    );

  }

}


/* =====================================================
   CRONÔMETRO
===================================================== */

function pararCronometro(){

  if(timerInterval){

    clearInterval(
      timerInterval
    );

  }


  timerInterval=null;

}


function iniciarCronometro(){

  pararCronometro();


  if(
    nivel !== 9
  ){

    return;

  }


  $("timer")
    .classList.add(
      "show"
    );


  $("timer")
    .classList.remove(
      "danger"
    );


  timerStart=
    Date.now();


  $("timerValue")
    .textContent=
      BONUS_SECONDS;


  timerInterval=
    setInterval(
      ()=>{

        const segundos=
          Math.floor(
            (
              Date.now() -
              timerStart
            ) / 1000
          );


        const restante=
          Math.max(
            0,
            BONUS_SECONDS -
            segundos
          );


        $("timerValue")
          .textContent=
            restante;


        if(
          restante <= 10
        ){

          $("timer")
            .classList.add(
              "danger"
            );

        }


        if(
          restante <= 0
        ){

          pararCronometro();

        }

      },
      200
    );

}


/* =====================================================
   INICIAR FASE
===================================================== */

function iniciarFase(){

  pararCronometro();


  $("timer")
    .classList.remove(
      "show",
      "danger"
    );


  const config=
    LEVELS[nivel];


  /*
    NOVA SENHA.
    NUNCA É EXIBIDA.
  */

  senha=
    gerarSenha(
      config.colors
    );


  tentativa=[];

  tentativaNumero=0;

  bloqueado=false;


  $("phaseTitle")
    .textContent=

      nivel === 8

        ? "NÍVEL 8 — HARD"

        : nivel === 9

        ? "NÍVEL 9 — FASE BÔNUS"

        : `NÍVEL ${nivel} — DESCUBRA A SENHA`;


  $("phaseText")
    .textContent=

      nivel === 9

        ? "Descubra a combinação em até 30 segundos."

        : `Descubra a senha de ${config.colors} cores. Você tem 10 tentativas.`;


  $("message")
    .textContent=
      "Escolha as cores da sua tentativa.";


  criarTabuleiro();

  renderTentativa();

  renderSaldo();


  /*
    NÍVEL 9:
    cronômetro começa imediatamente.
  */

  if(
    nivel === 9
  ){

    iniciarCronometro();

  }

}


/* =====================================================
   CONFIRMAR
===================================================== */

async function confirmar(){

  if(
    bloqueado
  ){

    return;

  }


  const tamanho=
    LEVELS[nivel].colors;


  if(
    tentativa.length !==
    tamanho
  ){

    $("message")
      .textContent=
        `Escolha ${tamanho} cores antes de confirmar.`;

    return;

  }


  const palpite=[
    ...tentativa
  ];


  const resultado=
    comparar(
      palpite,
      senha
    );


  mostrarResultado(
    resultado
  );


  const acertou=
    resultado.pretas ===
    tamanho;


  if(
    acertou
  ){

    await acertar();

    return;

  }


  tentativaNumero++;

  tentativa=[];

  renderTentativa();


  if(
    tentativaNumero >=
    MAX_ATTEMPTS
  ){

    await perdeu();

    return;

  }


  $("message")
    .textContent=
      `Não foi dessa vez. Tentativa ${tentativaNumero+1} de ${MAX_ATTEMPTS}.`;

}


/* =====================================================
   ACERTO
===================================================== */

async function acertar(){

  bloqueado=true;

  pararCronometro();


  let recompensa=
    LEVELS[nivel].reward;


  let texto="";


  if(
    nivel === 9
  ){

    const tempo=
      Math.floor(
        (
          Date.now() -
          timerStart
        ) / 1000
      );


    if(
      tempo <= BONUS_SECONDS
    ){

      recompensa=150;

      texto=
        `
        ⏱️ Você fez em
        <b>${tempo} segundos</b>.

        <br><br>

        <span class="gold">
        🏆 +150 ADAM COINS
        </span>
        `;

    }
    else{

      recompensa=100;

      texto=
        `
        ⏱️ Você fez em
        <b>${tempo} segundos</b>.

        <br><br>

        <span class="gold">
        +100 ADAM COINS
        </span>
        `;

    }

  }
  else{

    texto=
      `
      <span class="gold">
      +${recompensa} ADAM COINS
      </span>
      `;

  }


  try{

    await alterarSaldo(
      recompensa,
      0
    );

  }
  catch(error){

    console.error(error);

    $("message")
      .textContent=
        "Erro ao registrar a recompensa.";

    bloqueado=false;

    return;

  }


  /*
    A senha só é revelada AGORA,
    depois do acerto.
  */

  const senhaRevelada=
    senha
      .map(
        cor =>
          cor
            .charAt(0)
            .toUpperCase() +
          cor.slice(1)
      )
      .join(" • ");


  if(
    nivel < 9
  ){

    abrirModal(

      "🎉 SENHA CORRETA!",

      `
      Você descobriu a combinação!

      <br><br>

      <b>
        ${senhaRevelada}
      </b>

      <br><br>

      ${texto}
      `,

      [

        {

          texto:
            "PRÓXIMO NÍVEL",

          classe:
            "primary",

          funcao:
            ()=>{

              fecharModal();

              nivel++;

              iniciarFase();

            }

        }

      ]

    );

  }
  else{

    abrirModal(

      "🏆 FASE BÔNUS CONCLUÍDA!",

      `
      Você descobriu a senha!

      <br><br>

      <b>
        ${senhaRevelada}
      </b>

      <br><br>

      ${texto}
      `,

      [

        {

          texto:
            "VOLTAR AOS JOGOS",

          classe:
            "primary",

          funcao:
            ()=>{

              window.location.href=
                "jogos.html";

            }

        }

      ]

    );

  }

}


/* =====================================================
   PERDEU
===================================================== */

async function perdeu(){

  bloqueado=true;

  pararCronometro();


  const senhaTexto=
    senha
      .map(
        cor =>
          cor
            .charAt(0)
            .toUpperCase() +
          cor.slice(1)
      )
      .join(" • ");


  abrirModal(

    "💥 TENTATIVAS ESGOTADAS",

    `
    A senha correta era:

    <br><br>

    <b>
      ${senhaTexto}
    </b>

    <br><br>

    Você utilizou as 10 tentativas.
    `,

    [

      {

        texto:
          "JOGAR NOVAMENTE",

        classe:
          "primary",

        funcao:
          ()=>{

            fecharModal();

            iniciarFase();

          }

      },

      {

        texto:
          "VOLTAR AOS JOGOS",

        classe:
          "secondary",

        funcao:
          ()=>{

            window.location.href=
              "jogos.html";

          }

      }

    ]

  );

}


/* =====================================================
   MODAL
===================================================== */

function abrirModal(
  titulo,
  texto,
  botoes
){

  $("modalTitle")
    .textContent=
      titulo;


  $("modalText")
    .innerHTML=
      texto;


  $("modalButtons")
    .innerHTML="";


  botoes.forEach(
    botao=>{

      const b=
        document.createElement(
          "button"
        );


      b.type=
        "button";


      b.textContent=
        botao.texto;


      b.className=
        botao.classe ||
        "secondary";


      b.addEventListener(
        "click",
        botao.funcao
      );


      $("modalButtons")
        .appendChild(
          b
        );

    }
  );


  $("modal")
    .classList.add(
      "show"
    );

}


function fecharModal(){

  $("modal")
    .classList.remove(
      "show"
    );

}


/* =====================================================
   LIMPAR
===================================================== */

$("clear")
  .addEventListener(
    "click",
    ()=>{

      if(
        bloqueado
      ){

        return;

      }


      tentativa=[];

      renderTentativa();


      $("message")
        .textContent=
          "Escolha novamente as cores.";

    }
  );


/* =====================================================
   CONFIRMAR
===================================================== */

$("confirm")
  .addEventListener(
    "click",
    ()=>{

      confirmar();

    }
  );


/* =====================================================
   VOLTAR
===================================================== */

$("back")
  .addEventListener(
    "click",
    ()=>{

      pararCronometro();

      window.location.href=
        "jogos.html";

    }
  );


/* =====================================================
   INICIAR JOGO
===================================================== */

async function iniciarJogo(){

  /*
    ESSA PARTE É EXECUTADA
    UMA ÚNICA VEZ POR SESSÃO.
  */

  if(
    entradaProcessada
  ){

    return;

  }


  entradaProcessada=true;


  if(
    jaEntrouNestaSessao()
  ){

    /*
      Não cobra chance novamente.
      Não dá +30 novamente.
    */

    iniciarFase();

    return;

  }


  if(
    Number(
      usuario.chances || 0
    ) <= 0
  ){

    abrirModal(

      "🎟️ SEM CHANCES",

      `
      Você não possui chances
      para iniciar uma partida.
      `,

      [

        {

          texto:
            "VOLTAR",

          classe:
            "primary",

          funcao:
            ()=>{
              window.location.href=
                "jogos.html";
            }

        }

      ]

    );


    return;

  }


  try{

    /*
      ENTRADA:
      -1 CHANCE
      +30 MOEDAS
    */

    await alterarSaldo(
      30,
      -1
    );


    marcarEntrada();


    iniciarFase();


  }
  catch(error){

    console.error(
      error
    );


    entradaProcessada=false;


    $("message")
      .textContent=
        error.message;

  }

}


/* =====================================================
   AUTENTICAÇÃO
===================================================== */

onAuthStateChanged(
  auth,
  async user=>{

    if(!user){

      window.location.replace(
        "index.html"
      );

      return;

    }


    try{

      usuarioDoc=
        await localizarUsuario(
          user
        );


      if(!usuarioDoc){

        $("message")
          .textContent=
            "Cadastro não encontrado.";

        return;

      }


      usuario=
        usuarioDoc.data();


      montarPaleta();

      renderSaldo();

      iniciarJogo();

    }
    catch(error){

      console.error(
        error
      );


      $("message")
        .textContent=
          "Erro ao carregar o jogo.";

    }

  }
);
