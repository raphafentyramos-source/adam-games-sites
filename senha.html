<!DOCTYPE html>

<title>Adam Games • Senha</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  min-height:100%;
  background:#061b2d;
}

body{

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:#fff;

  background:
    radial-gradient(
      circle at 15% 0%,
      rgba(46,183,255,.24),
      transparent 30%
    ),
    radial-gradient(
      circle at 85% 10%,
      rgba(118,55,255,.20),
      transparent 28%
    ),
    linear-gradient(
      180deg,
      #073a4a 0%,
      #06263d 50%,
      #031b2d 100%
    );

}

button{
  font:inherit;
}

.page{

  width:100%;
  max-width:700px;
  margin:auto;

  padding:
    14px
    12px
    80px;

}

.top{

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

}

.back{

  width:44px;
  height:44px;

  border:0;
  border-radius:14px;

  background:
    linear-gradient(
      145deg,
      #0c6fa5,
      #07436e
    );

  color:#fff;

  font-size:25px;

  box-shadow:
    0 5px 12px #0006;

  cursor:pointer;

}

.title{

  text-align:center;

  text-shadow:
    0 2px 6px #000;

}

.title small{

  display:block;

  font-size:10px;

  letter-spacing:2px;

  color:#bcecff;

}

.title strong{

  font-size:21px;

}

.spacer{
  width:44px;
}

.card{

  margin-top:12px;

  padding:13px;

  border-radius:22px;

  background:
    rgba(3,29,48,.88);

  border:
    1px solid #ffffff18;

  box-shadow:
    0 14px 35px #0006;

}

.stats{

  display:grid;

  grid-template-columns:
    1fr 1fr 1fr;

  gap:8px;

}

.stat{

  padding:
    9px 6px;

  border-radius:13px;

  background:#0000002b;

  text-align:center;

}

.stat small{

  font-size:9px;

  font-weight:900;

  color:#a9d7eb;

}

.stat b{

  display:block;

  margin-top:3px;

  font-size:19px;

}

.coins{
  color:#ffd52b;
}

.chances{
  color:#ff6670;
}

.level{
  color:#72d7ff;
}

.progress{

  height:8px;

  background:#17394e;

  border-radius:20px;

  overflow:hidden;

  margin-top:10px;

}

.progress div{

  height:100%;

  width:0;

  background:
    linear-gradient(
      90deg,
      #28d56c,
      #ffd52b
    );

  transition:.3s;

}

.timer{

  display:none;

  margin-top:10px;

  padding:9px;

  border-radius:12px;

  background:
    rgba(255,193,7,.12);

  border:
    1px solid
    rgba(255,210,60,.35);

  text-align:center;

  color:#ffd52b;

  font-size:15px;

  font-weight:900;

}

.timer.show{
  display:block;
}

.timer.danger{

  color:#ff5964;

  border-color:
    rgba(255,80,90,.55);

  animation:
    pulse .8s infinite alternate;

}

@keyframes pulse{

  from{
    transform:scale(1);
  }

  to{
    transform:scale(1.02);
  }

}

.info{

  text-align:center;

  padding:
    12px 6px 4px;

}

.info h1{
  font-size:20px;
}

.info p{

  margin-top:5px;

  color:#b9d7e8;

  font-size:12px;

  line-height:1.4;

}

.game-wrap{

  position:relative;

  z-index:1;

  margin-top:8px;

  display:flex;

  justify-content:center;

  overflow:hidden;

  border-radius:18px;

  background-position:center;

  background-size:cover;

  background-repeat:no-repeat;

}

.board{

  position:relative;

  width:min(100%,720px);

  aspect-ratio:1024/1536;

  background-image:
    url("./C0A67B9D-67BE-49A6-8747-B5B2A32411C4.png");

  background-size:100% 100%;

  background-repeat:no-repeat;

}

.rows{

  position:absolute;

  left:9.5%;

  right:9.5%;

  top:15%;

  bottom:15%;

  display:grid;

  grid-template-rows:
    repeat(10,1fr);

  z-index:2;

}

.row{

  position:relative;

  display:flex;

  align-items:center;

}

.row-number{

  width:9%;

  height:54%;

  font-size:0;

}

.guess-slots{

  width:60%;

  display:flex;

  gap:2.5%;

  align-items:center;

  justify-content:flex-start;

  padding-left:1%;

}

.guess-slot{

  width:15.2%;

  aspect-ratio:1;

  border-radius:50%;

  background:transparent;

  border:0;

  overflow:hidden;

  display:flex;

  align-items:center;

  justify-content:center;

}

.guess-slot img{

  width:100%;

  height:100%;

  object-fit:contain;

}

.feedback{

  width:31%;

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:4%;

  padding:
    0 4%;

  align-items:center;

}

.feedback-dot{

  width:100%;

  aspect-ratio:1;

  border-radius:50%;

  background:transparent;

  background-size:contain;

  background-position:center;

  background-repeat:no-repeat;

}

.feedback-dot.black{

  background-image:
    url("./preto.png");

}

.feedback-dot.white{

  background-image:
    url("./branco.png");

}

.palette{

  position:relative;

  z-index:9999;

  pointer-events:auto;

  margin:
    12px auto 0;

  width:min(100%,560px);

  display:grid;

  grid-template-columns:
    repeat(6,1fr);

  gap:7px;

  padding:10px;

  border-radius:18px;

  background:
    rgba(35,18,8,.78);

  border:
    2px solid #9b6a32;

  box-shadow:
    0 8px 20px #0008;

}

.color-btn{

  position:relative;

  z-index:20;

  border:0;

  background:transparent;

  display:flex;

  align-items:center;

  justify-content:center;

  cursor:pointer;

  min-width:0;

  touch-action:manipulation;

  pointer-events:auto;

  -webkit-user-select:none;

  user-select:none;

  -webkit-touch-callout:none;

  -webkit-tap-highlight-color:transparent;

}

.color-btn img{

  width:100%;

  height:100%;

  max-height:58px;

  object-fit:contain;

  filter:
    drop-shadow(
      0 3px 3px #0008
    );

  pointer-events:none;

  user-select:none;

  -webkit-user-drag:none;

}

.color-btn:active img{

  transform:scale(.88);

}

.color-btn.selected img{

  filter:
    drop-shadow(
      0 0 9px #fff
    )
    drop-shadow(
      0 3px 3px #0008
    );

}

.selected-preview{

  min-height:44px;

  margin-top:9px;

  display:flex;

  justify-content:center;

  align-items:center;

  gap:7px;

}

.preview-dot{

  width:34px;

  height:34px;

  border-radius:50%;

  overflow:hidden;

  background:#1d140c;

  border:
    2px solid #7b542b;

}

.preview-dot img{

  width:100%;

  height:100%;

  object-fit:contain;

}

.controls{

  position:relative;

  z-index:9999;

  pointer-events:auto;

  margin-top:10px;

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:9px;

}

.control{

  height:47px;

  border:0;

  border-radius:14px;

  color:#fff;

  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 5px 10px #0005;

}

.clear{

  background:
    linear-gradient(
      145deg,
      #315878,
      #183b57
    );

}

.confirm{

  background:
    linear-gradient(
      145deg,
      #28d86d,
      #08783e
    );

}

.message{

  text-align:center;

  min-height:20px;

  margin-top:7px;

  color:#bfe3f2;

  font-size:12px;

  font-weight:800;

}

.modal{

  position:fixed;

  inset:0;

  z-index:100;

  display:none;

  align-items:center;

  justify-content:center;

  padding:18px;

  background:#00101dcc;

  backdrop-filter:blur(6px);

}

.modal.show{
  display:flex;
}

.modal-card{

  width:min(100%,390px);

  padding:
    22px 18px;

  border-radius:22px;

  text-align:center;

  background:
    linear-gradient(
      145deg,
      #0b3a52,
      #241044
    );

  border:
    1px solid #ffffff1c;

  box-shadow:
    0 20px 50px #0009;

}

.modal-card h2{
  font-size:22px;
}

.modal-card p{

  margin-top:9px;

  color:#c3ddeb;

  font-size:14px;

  line-height:1.5;

}

.modal-buttons{

  display:grid;

  gap:9px;

  margin-top:17px;

}

.modal-buttons button{

  height:46px;

  border:0;

  border-radius:13px;

  color:#fff;

  font-weight:900;

  cursor:pointer;

}

.primary{
  background:#19ae60;
}

.secondary{
  background:#ffffff17;
}

.gold{
  color:#ffd52b;
}

@media(max-width:520px){

  .page{

    padding-left:8px;
    padding-right:8px;

  }

  .card{
    padding:9px;
  }

  .stat b{
    font-size:17px;
  }

  .info h1{
    font-size:18px;
  }

}

</style>

<script type="module">


import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  doc,
  updateDoc,
  increment
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:
    "adam-games-21081.firebaseapp.com",

  projectId:
    "adam-games-21081",

  storageBucket:
    "adam-games-21081.firebasestorage.app",

  messagingSenderId:
    "1055528418738",

  appId:
    "1:1055528418738:web:5fafdf63424ba9744eb8ab"

};


const app=
  initializeApp(
    firebaseConfig
  );

const auth=
  getAuth(app);

const db=
  getFirestore(app);

const $=
  id =>
    document.getElementById(id);


/* =====================================================
   CORES
===================================================== */

const COLORS=[

  "vermelho",
  "azul",
  "verde",
  "amarelo",
  "roxo",
  "laranja"

];


const FILES={

  vermelho:"./vermelho.png",
  azul:"./azul.png",
  verde:"./verde.png",
  amarelo:"./amarelo.png",
  roxo:"./roxo.png",
  laranja:"./laranja.png"

};


const FEEDBACK={

  black:"./preto.png",
  white:"./branco.png"

};


/* =====================================================
   NÍVEIS
===================================================== */

const LEVELS={

  1:{
    length:3,
    reward:20
  },

  2:{
    length:3,
    reward:20
  },

  3:{
    length:3,
    reward:20
  },

  4:{
    length:4,
    reward:30
  },

  5:{
    length:4,
    reward:30
  },

  6:{
    length:4,
    reward:30
  },

  7:{
    length:5,
    reward:30
  },

  8:{
    length:6,
    reward:75
  },

  9:{
    length:6,
    reward:100,
    bonusReward:150
  }

};


const MAX_ATTEMPTS=10;

const BONUS_TIME=30;


/* =====================================================
   ESTADO
===================================================== */

let userDoc=null;

let userData=null;

let level=1;

let secret=[];

let current=[];

let attempt=0;

let busy=false;

let timerInterval=null;

let timerStart=0;


/* =====================================================
   SALDO
===================================================== */

function money(){

  return Number(
    userData?.moedas || 0
  ).toLocaleString(
    "pt-BR"
  );

}


function renderStats(){

  $("coins").textContent=
    money();

  $("chances").textContent=
    Number(
      userData?.chances || 0
    ).toLocaleString(
      "pt-BR"
    );

  $("level").textContent=
    `${level} / 9`;

  $("progress").style.width=
    `${(level/9)*100}%`;

}


/* =====================================================
   GERAR SENHA
   A SENHA É CRIADA INTERNAMENTE.
   NUNCA É MOSTRADA NA TELA.
===================================================== */

function randomSecret(length){

  const pool=[
    ...COLORS
  ];

  const result=[];


  while(
    result.length < length
  ){

    const i=
      Math.floor(
        Math.random() *
        pool.length
      );

    result.push(
      pool.splice(i,1)[0]
    );

  }


  return result;

}


/* =====================================================
   PALETA
===================================================== */

function buildPalette(){

  const el=
    $("palette");

  el.innerHTML="";


  COLORS.forEach(
    color=>{

      const btn=
        document.createElement(
          "button"
        );

      btn.className=
        "color-btn";

      btn.type="button";


      const img=
        document.createElement(
          "img"
        );

      img.src=
        FILES[color];

      img.alt="";

      img.draggable=false;


      btn.appendChild(
        img
      );


      btn.addEventListener(
        "click",
        event=>{

          event.preventDefault();

          event.stopPropagation();

          selecionarCor(
            color,
            btn
          );

        }
      );


      el.appendChild(
        btn
      );

    }
  );

}


/* =====================================================
   ESCOLHER COR
===================================================== */

function selecionarCor(
  color,
  btn
){

  if(busy)
    return;


  const config=
    LEVELS[level];


  if(!config)
    return;


  if(
    current.length >=
    config.length
  ){

    $("message")
      .textContent=
        `Você já escolheu ${config.length} cores.`;

    return;

  }


  current.push(
    color
  );


  btn.classList.add(
    "selected"
  );


  setTimeout(
    ()=>{
      btn.classList.remove(
        "selected"
      );
    },
    180
  );


  renderPreview();

  renderCurrentRow();


  $("message")
    .textContent=
      `${current.length}/${config.length} cores escolhidas.`;

}


/* =====================================================
   PREVIEW DA ESCOLHA DO JOGADOR
===================================================== */

function renderPreview(){

  const p=
    $("preview");

  p.innerHTML="";


  current.forEach(
    color=>{

      const d=
        document.createElement(
          "div"
        );

      d.className=
        "preview-dot";


      const img=
        document.createElement(
          "img"
        );

      img.src=
        FILES[color];

      img.alt="";


      d.appendChild(
        img
      );


      p.appendChild(
        d
      );

    }
  );

}


/* =====================================================
   HISTÓRICO
===================================================== */

function makeRows(){

  const rows=
    $("rows");

  rows.innerHTML="";


  for(
    let r=0;
    r<MAX_ATTEMPTS;
    r++
  ){

    const row=
      document.createElement(
        "div"
      );

    row.className=
      "row";

    row.dataset.row=
      r;


    const number=
      document.createElement(
        "div"
      );

    number.className=
      "row-number";

    number.textContent=
      r+1;


    const slots=
      document.createElement(
        "div"
      );

    slots.className=
      "guess-slots";


    for(
      let i=0;
      i<6;
      i++
    ){

      const slot=
        document.createElement(
          "div"
        );

      slot.className=
        "guess-slot";


      slot.dataset.slot=
        i;


      if(
        i >=
        LEVELS[level].length
      ){

        slot.style.visibility=
          "hidden";

      }


      slots.appendChild(
        slot
      );

    }


    const feedback=
      document.createElement(
        "div"
      );

    feedback.className=
      "feedback";


    for(
      let i=0;
      i<5;
      i++
    ){

      const dot=
        document.createElement(
          "span"
        );

      dot.className=
        "feedback-dot";


      feedback.appendChild(
        dot
      );

    }


    row.append(
      number,
      slots,
      feedback
    );


    rows.appendChild(
      row
    );

  }

}


/* =====================================================
   DESENHAR TENTATIVA
===================================================== */

function renderCurrentRow(){

  const row=
    document.querySelector(
      `.row[data-row="${attempt}"]`
    );


  if(!row)
    return;


  [
    ...row.querySelectorAll(
      ".guess-slot"
    )
  ]
  .forEach(
    (slot,i)=>{

      slot.innerHTML="";


      if(
        i <
        current.length
      ){

        const img=
          document.createElement(
            "img"
          );

        img.src=
          FILES[
            current[i]
          ];

        img.alt="";


        slot.appendChild(
          img
        );

      }

    }
  );

}


/* =====================================================
   CALCULAR RESULTADO
===================================================== */

function calculateResult(
  guess,
  answer
){

  let exact=0;

  let misplaced=0;


  for(
    let i=0;
    i<answer.length;
    i++
  ){

    if(
      guess[i] ===
      answer[i]
    ){

      exact++;

    }

  }


  for(
    let i=0;
    i<guess.length;
    i++
  ){

    if(
      guess[i] !==
      answer[i] &&
      answer.includes(
        guess[i]
      )
    ){

      misplaced++;

    }

  }


  return {
    exact,
    misplaced
  };

}


/* =====================================================
   MOSTRAR RESULTADO
===================================================== */

function paintResult(
  rowIndex,
  result
){

  const row=
    document.querySelector(
      `.row[data-row="${rowIndex}"]`
    );


  if(!row)
    return;


  const dots=[
    ...row.querySelectorAll(
      ".feedback-dot"
    )
  ];


  for(
    let i=0;
    i<result.exact;
    i++
  ){

    dots[i]
      .classList.add(
        "black"
      );

  }


  for(
    let i=0;
    i<result.misplaced;
    i++
  ){

    dots[
      result.exact+i
    ]
    .classList.add(
      "white"
    );

  }

}


/* =====================================================
   REGISTRAR TENTATIVA
===================================================== */

function addAttempt(){

  const result=
    calculateResult(
      current,
      secret
    );


  paintResult(
    attempt,
    result
  );

}


/* =====================================================
   MODAL
===================================================== */

function openModal(
  title,
  text,
  buttons
){

  $("modalTitle")
    .textContent=
      title;


  $("modalText")
    .innerHTML=
      text;


  $("modalButtons")
    .innerHTML="";


  buttons.forEach(
    item=>{

      const b=
        document.createElement(
          "button"
        );

      b.type="button";

      b.textContent=
        item.text;

      b.className=
        item.cls ||
        "secondary";

      b.onclick=
        item.fn;


      $("modalButtons")
        .appendChild(
          b
        );

    }
  );


  $("modal")
    .classList.add(
      "show"
    );

}


function closeModal(){

  $("modal")
    .classList.remove(
      "show"
    );

}


/* =====================================================
   FIREBASE
===================================================== */

async function updateAccount(
  deltaCoins=0,
  deltaChances=0
){

  if(!userDoc){

    throw new Error(
      "Cadastro não encontrado."
    );

  }


  const ref=
    doc(
      db,
      "admins",
      userDoc.id
    );


  const oldCoins=
    Number(
      userData?.moedas || 0
    );


  const oldChances=
    Number(
      userData?.chances || 0
    );


  const newCoins=
    oldCoins +
    Number(deltaCoins || 0);


  const newChances=
    oldChances +
    Number(deltaChances || 0);


  if(
    newChances < 0
  ){

    throw new Error(
      "Você não possui chances suficientes."
    );

  }


  await updateDoc(
    ref,
    {

      moedas:
        increment(
          Number(
            deltaCoins || 0
          )
        ),

      chances:
        increment(
          Number(
            deltaChances || 0
          )
        )

    }
  );


  userData={

    ...userData,

    moedas:newCoins,

    chances:newChances

  };


  renderStats();

}


/* =====================================================
   CRONÔMETRO FASE 9
===================================================== */

function stopTimer(){

  if(timerInterval){

    clearInterval(
      timerInterval
    );

  }


  timerInterval=null;

}


function startTimer(){

  stopTimer();


  if(
    level !== 9
  )
    return;


  const timer=
    $("timer");

  const value=
    $("timerValue");


  timer.classList.add(
    "show"
  );

  timer.classList.remove(
    "danger"
  );


  timerStart=
    Date.now();


  value.textContent=
    "30";


  timerInterval=
    setInterval(
      ()=>{

        const elapsed=
          Math.floor(
            (
              Date.now() -
              timerStart
            ) / 1000
          );


        const remaining=
          Math.max(
            0,
            BONUS_TIME -
            elapsed
          );


        value.textContent=
          remaining;


        if(
          remaining <= 10
        ){

          timer.classList.add(
            "danger"
          );

        }


        if(
          remaining <= 0
        ){

          stopTimer();

          value.textContent=
            "0";

        }

      },
      200
    );

}


function hideTimer(){

  stopTimer();

  $("timer")
    .classList.remove(
      "show",
      "danger"
    );

}


/* =====================================================
   FUNDO
===================================================== */

function setLevelBackground(){

  const bg=
    level <= 3
      ? "./fundo_nivel_01_03.png"

      : level <= 6
      ? "./fundo_nivel_04_06.png"

      : level === 7
      ? "./fundo_nivel_07.png"

      : "./fundo_nivel_08_09.png";


  const wrap=
    document.querySelector(
      ".game-wrap"
    );


  if(!wrap)
    return;


  wrap.style.backgroundImage=
    `url("${bg}")`;

  wrap.style.backgroundSize=
    "cover";

  wrap.style.backgroundPosition=
    "center";

  wrap.style.backgroundRepeat=
    "no-repeat";

}


/* =====================================================
   INICIAR FASE
===================================================== */

function startLevel(){

  stopTimer();

  hideTimer();


  const config=
    LEVELS[level];


  secret=
    randomSecret(
      config.length
    );


  /*
    IMPORTANTE:
    A senha é criada aqui,
    mas NUNCA é colocada no HTML.
  */


  current=[];

  attempt=0;

  busy=false;


  $("phaseTitle")
    .textContent=
      level === 8
        ? "NÍVEL 8 — HARD"

        : level === 9
        ? "NÍVEL 9 — BÔNUS"

        : `NÍVEL ${level} — DESCUBRA A SENHA`;


  if(
    level === 9
  ){

    $("phaseText")
      .textContent=
        "Descubra a combinação. Até 30 segundos: 150 Adam Coins.";

  }else{

    $("phaseText")
      .textContent=
        `A senha tem ${config.length} cores. Você tem ${MAX_ATTEMPTS} tentativas.`;

  }


  $("message")
    .textContent=
      "Sua vez! Monte a combinação e confirme.";


  makeRows();

  renderPreview();

  renderStats();

  setLevelBackground();


  /*
    FASE 9 começa o cronômetro
    imediatamente.
  */

  if(
    level === 9
  ){

    startTimer();

  }

}


/* =====================================================
   VITÓRIA
===================================================== */

async function win(){

  busy=true;

  stopTimer();


  let reward=
    LEVELS[level].reward;


  let textExtra="";


  if(
    level === 9
  ){

    const elapsed=
      Math.floor(
        (
          Date.now() -
          timerStart
        ) / 1000
      );


    if(
      elapsed <= BONUS_TIME
    ){

      reward=150;

      textExtra=
        `
        <br>
        ⏱️ Tempo: <b>${elapsed}s</b>

        <br><br>

        <span class="gold">
          🏆 BÔNUS MÁXIMO
          <br>
          <b>+150 Adam Coins</b>
        </span>
        `;

    }else{

      reward=100;

      textExtra=
        `
        <br>
        ⏱️ Tempo: <b>${elapsed}s</b>

        <br><br>

        <span class="gold">
          <b>+100 Adam Coins</b>
        </span>
        `;

    }

  }


  await updateAccount(
    reward,
    0
  );


  if(
    level < 9
  ){

    openModal(

      "🎉 SENHA CORRETA!",

      `
      Você descobriu a combinação!

      <br><br>

      <span class="gold">
        <b>+${reward} Adam Coins</b>
      </span>
      `,

      [

        {

          text:
            "PRÓXIMO NÍVEL",

          cls:
            "primary",

          fn:
            ()=>{

              closeModal();

              level++;

              startLevel();

            }

        }

      ]

    );


    return;

  }


  openModal(

    "🏆 FASE BÔNUS CONCLUÍDA!",

    `
    Você completou a Fase 9!

    ${textExtra}
    `,

    [

      {

        text:
          "VOLTAR AOS JOGOS",

        cls:
          "primary",

        fn:
          ()=>{
            window.location.href=
              "jogos.html";
          }

      }

    ]

  );

}


/* =====================================================
   DERROTA
===================================================== */

async function lose(){

  busy=true;

  stopTimer();


  const correct=
    secret
      .map(
        c =>
          c.toUpperCase()
      )
      .join(" • ");


  openModal(

    "💥 VOCÊ PERDEU!",

    `
    A combinação correta era:

    <br><br>

    <b>${correct}</b>

    <br><br>

    Você pode reiniciar a fase
    ou continuar usando uma chance.
    `,

    [

      {

        text:
          "REINICIAR FASE",

        cls:
          "primary",

        fn:
          ()=>{

            closeModal();

            startLevel();

          }

      },

      {

        text:
          "CONTINUAR NESTA FASE (-1 CHANCE)",

        cls:
          "secondary",

        fn:
          async()=>{

            try{

              await updateAccount(
                0,
                -1
              );


              closeModal();

              startLevel();


            }catch(error){

              $("modalText")
                .textContent=
                  error.message;

            }

          }

      }

    ]

  );

}


/* =====================================================
   CONFIRMAR
===================================================== */

let acaoProcessada=false;


async function confirmar(){

  if(busy)
    return;


  if(
    current.length !==
    secret.length
  ){

    $("message")
      .textContent=
        `Escolha ${secret.length} cores antes de confirmar.`;

    return;

  }


  addAttempt();


  const guess=[
    ...current
  ];


  const correct=
    guess.every(
      (color,i)=>
        color ===
        secret[i]
    );


  if(correct){

    await win();

    return;

  }


  attempt++;

  current=[];

  renderPreview();


  if(
    attempt >=
    MAX_ATTEMPTS
  ){

    await lose();

    return;

  }


  renderCurrentRow();


  $("message")
    .textContent=
      `Senha incorreta. Tentativa ${attempt+1} de ${MAX_ATTEMPTS}.`;

}


/* =====================================================
   BOTÃO CONFIRMAR
===================================================== */

$("confirmBtn")
  .addEventListener(
    "click",
    event=>{

      event.preventDefault();


      if(
        acaoProcessada
      )
        return;


      acaoProcessada=true;


      confirmar()
        .finally(
          ()=>{

            setTimeout(
              ()=>{
                acaoProcessada=false;
              },
              250
            );

          }
        );

    }
  );


/* =====================================================
   LIMPAR
===================================================== */

$("clearBtn")
  .addEventListener(
    "click",
    event=>{

      event.preventDefault();


      if(busy)
        return;


      current=[];

      renderPreview();

      renderCurrentRow();

      $("message")
        .textContent="";

    }
  );


/* =====================================================
   VOLTAR
===================================================== */

$("back")
  .addEventListener(
    "click",
    ()=>{

      window.location.href=
        "jogos.html";

    }
  );


/* =====================================================
   LOCALIZAR USUÁRIO
===================================================== */

async function localizarUsuario(
  user
){

  let result=
    await getDocs(

      query(
        collection(
          db,
          "admins"
        ),

        where(
          "uid",
          "==",
          user.uid
        )

      )

    );


  if(
    result.empty &&
    user.email
  ){

    result=
      await getDocs(

        query(
          collection(
            db,
            "admins"
          ),

          where(
            "email",
            "==",
            user.email.toLowerCase()
          )

        )

      );

  }


  return result.empty
    ? null
    : result.docs[0];

}


/* =====================================================
   LOGIN
===================================================== */

onAuthStateChanged(

  auth,

  async user=>{

    if(!user){

      window.location.replace(
        "index.html"
      );

      return;

    }


    try{

      buildPalette();

      setLevelBackground();


      userDoc=
        await localizarUsuario(
          user
        );


      if(!userDoc){

        $("message")
          .textContent=
            "Cadastro não encontrado.";

        return;

      }


      userData=
        userDoc.data();


      renderStats();


      if(
        Number(
          userData.chances || 0
        ) <= 0
      ){

        openModal(

          "SEM CHANCES",

          "Você precisa ter pelo menos 1 chance para iniciar o jogo.",

          [

            {

              text:
                "VOLTAR",

              cls:
                "primary",

              fn:
                ()=>{
                  window.location.href=
                    "jogos.html";
                }

            }

          ]

        );


        return;

      }


      /*
        ENTRADA:
        +30 Adam Coins
        -1 chance
      */

      try{

        await updateAccount(
          30,
          -1
        );


      }catch(error){

        console.error(
          "ERRO AO ATUALIZAR SALDO:",
          error
        );

      }


      startLevel();


    }catch(error){

      console.error(
        "ERRO AO INICIAR:",
        error
      );


      $("message")
        .textContent=
          "Erro ao carregar o jogo.";

    }

  }

);

</script>
