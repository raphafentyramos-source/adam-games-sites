<!DOCTYPE html>
<html lang="pt-BR">

<head>

<title>Adam Games • Senha</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  min-height:100%;
}

body{

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:#fff;

  background:
    linear-gradient(
      180deg,
      #073454,
      #021d32
    );

  overflow-x:hidden;

}


/* =====================================================
   PÁGINA
===================================================== */

.page{

  width:100%;

  max-width:680px;

  margin:0 auto;

  padding:
    14px
    12px
    70px;

}


/* =====================================================
   TOPO
===================================================== */

.top{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:12px;

}


.back{

  width:44px;

  height:44px;

  border:0;

  border-radius:14px;

  background:
    rgba(4,38,65,.9);

  color:#fff;

  font-size:27px;

  cursor:pointer;

}


.title{

  text-align:center;

}


.title small{

  display:block;

  font-size:10px;

  letter-spacing:3px;

  color:#a8d7ee;

}


.title strong{

  display:block;

  margin-top:2px;

  font-size:24px;

  text-shadow:
    0 3px 8px #000;

}


.top-space{

  width:44px;

}


/* =====================================================
   STATUS
===================================================== */

.status{

  display:grid;

  grid-template-columns:
    1fr
    1fr
    1fr;

  gap:8px;

}


.status-box{

  padding:10px 6px;

  border-radius:15px;

  text-align:center;

  background:
    rgba(3,34,57,.88);

  border:
    1px solid
    rgba(255,255,255,.07);

}


.status-label{

  font-size:9px;

  font-weight:bold;

  color:#9fc9df;

  letter-spacing:.7px;

}


.status-value{

  margin-top:3px;

  font-size:21px;

  font-weight:900;

}


.coins{

  color:#ffd52b;

}


.level{

  color:#62d9ff;

}


.chances{

  color:#72ff9e;

}


/* =====================================================
   PROGRESSO
===================================================== */

.progress{

  height:8px;

  margin:
    12px
    2px
    12px;

  border-radius:10px;

  overflow:hidden;

  background:
    rgba(255,255,255,.12);

}


.progress-bar{

  width:33.33%;

  height:100%;

  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      #23d86b,
      #ffe01b
    );

  transition:
    width .3s ease;

}


/* =====================================================
   TÍTULO DA FASE
===================================================== */

.phase-info{

  text-align:center;

  margin-bottom:12px;

}


.phase-info h1{

  font-size:
    clamp(
      22px,
      6vw,
      31px
    );

  text-shadow:
    0 3px 8px #000;

}


.phase-info p{

  margin-top:5px;

  color:#b9d9e9;

  font-size:13px;

}


/* =====================================================
   ÁREA DO JOGO
===================================================== */

.game-area{

  position:relative;

  width:100%;

  max-width:620px;

  margin:0 auto;

}


/*
   O FUNDO É SOMENTE A IMAGEM.

   Não existe outro painel por cima.
*/

.board-background{

  position:relative;

  width:100%;

  display:block;

  user-select:none;

  -webkit-user-drag:none;

}


/* =====================================================
   LINHAS SOBRE O TABULEIRO
===================================================== */

.board-overlay{

  position:absolute;

  inset:0;

  pointer-events:none;

}


/*
   Cada linha ocupa a largura da área
   das cinco bolas grandes.
*/

.row{

  position:absolute;

  left:20%;

  width:60%;

  height:6%;

  display:flex;

  align-items:center;

  justify-content:flex-start;

  gap:3.4%;

}


/*
   As linhas do fundo possuem 10 posições.
*/

.row:nth-child(1){
  top:9.8%;
}

.row:nth-child(2){
  top:17.8%;
}

.row:nth-child(3){
  top:25.8%;
}

.row:nth-child(4){
  top:33.8%;
}

.row:nth-child(5){
  top:41.8%;
}

.row:nth-child(6){
  top:49.8%;
}

.row:nth-child(7){
  top:57.8%;
}

.row:nth-child(8){
  top:65.8%;
}

.row:nth-child(9){
  top:73.8%;
}

.row:nth-child(10){
  top:81.8%;
}


/* =====================================================
   BOLINHAS ESCOLHIDAS
===================================================== */

.slot{

  width:17%;

  aspect-ratio:1;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

}


.slot img{

  width:100%;

  height:100%;

  object-fit:contain;

  display:block;

}


/*
   Quando a posição ainda está vazia,
   deixamos transparente.
*/

.slot.empty{

  background:transparent;

}


/* =====================================================
   HISTÓRICO PEQUENO
===================================================== */

.history{

  position:absolute;

  right:14%;

  width:17%;

  display:flex;

  align-items:center;

  justify-content:flex-end;

  gap:4px;

}


.history-dot{

  width:11px;

  height:11px;

  border-radius:50%;

  border:
    1px solid
    rgba(255,255,255,.35);

  background:
    rgba(0,0,0,.18);

}


.history-dot.black{

  background:#111;

}


.history-dot.white{

  background:#fff;

}


/* =====================================================
   PAINEL DE CORES
===================================================== */

.color-panel{

  margin-top:10px;

  padding:10px;

  border-radius:20px;

  background:
    rgba(24,13,8,.78);

  border:
    2px solid
    rgba(190,125,45,.65);

  display:grid;

  grid-template-columns:
    repeat(6,1fr);

  gap:8px;

}


/* =====================================================
   BOTÕES DAS CORES
===================================================== */

.color-button{

  min-width:0;

  aspect-ratio:1;

  border:0;

  border-radius:15px;

  background:
    rgba(255,255,255,.07);

  display:flex;

  align-items:center;

  justify-content:center;

  cursor:pointer;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;

}


.color-button:active{

  transform:scale(.93);

}


.color-button img{

  width:75%;

  height:75%;

  object-fit:contain;

  pointer-events:none;

}


/* =====================================================
   BOTÕES
===================================================== */

.actions{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:12px;

  margin-top:10px;

}


.action{

  height:52px;

  border:0;

  border-radius:16px;

  color:#fff;

  font-size:16px;

  font-weight:900;

  cursor:pointer;

  touch-action:manipulation;

}


.clear{

  background:
    linear-gradient(
      135deg,
      #315d83,
      #183d5c
    );

}


.confirm{

  background:
    linear-gradient(
      135deg,
      #22d66c,
      #079044
    );

}


.action:active{

  transform:scale(.97);

}


/* =====================================================
   TEXTO DE STATUS
===================================================== */

.message{

  min-height:24px;

  margin-top:9px;

  text-align:center;

  font-size:13px;

  font-weight:bold;

  color:#b8d9e9;

}


.message.success{

  color:#6cff9d;

}


.message.error{

  color:#ff8585;

}


.message.warning{

  color:#ffd45c;

}


/* =====================================================
   SENHA REVELADA
===================================================== */

.reveal{

  display:none;

  margin-top:10px;

  padding:12px;

  border-radius:15px;

  text-align:center;

  background:
    rgba(12,55,35,.85);

  border:
    1px solid
    rgba(91,255,145,.3);

}


.reveal.show{

  display:block;

}


.reveal-title{

  color:#76ff9f;

  font-size:12px;

  font-weight:bold;

}


.reveal-colors{

  display:flex;

  justify-content:center;

  gap:8px;

  margin-top:7px;

}


.reveal-colors img{

  width:38px;

  height:38px;

  object-fit:contain;

}


/* =====================================================
   CARREGANDO
===================================================== */

.loading{

  position:fixed;

  inset:0;

  z-index:1000;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#031d31;

  font-size:16px;

  font-weight:bold;

}


.loading.hide{

  display:none;

}


/* =====================================================
   MODAL
===================================================== */

.modal{

  position:fixed;

  inset:0;

  z-index:500;

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:
    rgba(0,10,20,.82);

}


.modal.show{

  display:flex;

}


.modal-card{

  width:100%;

  max-width:360px;

  padding:25px;

  border-radius:22px;

  text-align:center;

  background:#082d49;

  border:
    1px solid
    rgba(255,255,255,.1);

}


.modal-card h2{

}


.modal-card p{

  margin-top:8px;

  color:#b9d6e5;

  font-size:14px;

  line-height:1.4;

}


.modal-button{

  width:100%;

  height:48px;

  margin-top:18px;

  border:0;

  border-radius:14px;

  background:#18bd68;

  color:#fff;

  font-weight:900;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:430px){

  .page{

  }

    padding:9px 4px;

  }

    font-size:19px;

  }

  .phase-info h1{

    font-size:24px;

  }

  .color-panel{

    gap:5px;

  }

  .color-button{

    border-radius:12px;

  }

  .actions{

    gap:8px;

  }

  .action{

    height:50px;

    font-size:15px;

  }

}


/* =====================================================
   TELAS MUITO PEQUENAS
===================================================== */

@media(max-width:360px){

  .history-dot{

    width:9px;

    height:9px;

  }

  .history{

    gap:2px;

  }

}

</style>

<script type="module">


/* =====================================================

===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {

}
from

from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:
    "adam-games-21081.firebaseapp.com",

  messagingSenderId:
    "1055528418738",

  appId:
    "1:1055528418738:web:5fafdf63424ba9744eb8ab"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================================
   ELEMENTOS
===================================================== */

const loading =
  document.getElementById("loading");

const coinsEl =
  document.getElementById("coins");

const chancesEl =
  document.getElementById("chances");

const levelEl =
  document.getElementById("level");

const progressBar =

const messageEl =

const revealEl =

const revealColorsEl =

const clearButton =
  document.getElementById("clearButton");

const noChanceModal =
  document.getElementById("noChanceModal");


/* =====================================================
   CONFIGURAÇÃO DO JOGO
===================================================== */

const COLORS = {

  vermelho:
    "./vermelho.png",

  azul:
    "./azul.png",

  verde:
    "./verde.png",

  amarelo:
    "./amarelo.png",

  roxo:
    "./roxo.png",

  laranja:
    "./laranja.png"

};


const COLOR_NAMES =
  Object.keys(COLORS);


/*
   Por enquanto:

   NÍVEL 1 = 3 cores
   NÍVEL 2 = 3 cores
   NÍVEL 3 = 3 cores

   Depois adicionaremos:

   4-6 = 4 cores
   7 = 5 cores
   8 = 6 cores
   9 = especial
*/

const LEVELS = {

  1:{
    length:3,
    reward:20
  },

  2:{
    length:3,
    reward:20
  },

  3:{
    length:3,
    reward:20
  }

};


/* =====================================================
   ESTADO
===================================================== */

let usuario = null;

let usuarioDoc = null;

let currentLevel = 1;

let secret = [];

let selected = [];

let attempts = 0;

const MAX_ATTEMPTS = 10;

let gameStarted = false;

let gameFinished = false;


/* =====================================================
   GERAR SENHA
===================================================== */

function generateSecret(){

  const config =
    LEVELS[currentLevel];

  secret = [];

  for(
    let i = 0;
    i < config.length;
    i++
  ){

    const randomIndex =
      Math.floor(
        Math.random() *
        COLOR_NAMES.length
      );

    secret.push(
      COLOR_NAMES[randomIndex]
    );

  }

  /*
     IMPORTANTE:

     A senha NÃO é mostrada
     na tela.

     Ela fica somente nesta
     variável em memória.
  */

  console.log(
    "Senha criada internamente:",
    secret
  );

}


/* =====================================================
   LOCALIZAR USUÁRIO
===================================================== */

async function localizarUsuario(user){

  let resultado =
    await getDocs(

      query(
        collection(db,"admins"),
        where(
          "uid",
          "==",
          user.uid
        )
      )

    );


  if(
    resultado.empty &&
    user.email
  ){

    resultado =
      await getDocs(

        query(
          collection(db,"admins"),
          where(
            "email",
            "==",
            user.email.toLowerCase()
          )
        )

      );

  }


  if(
    resultado.empty
  ){

    return null;

  }


  return resultado.docs[0];

}


/* =====================================================
   ATUALIZAR SALDO NA TELA
===================================================== */

function atualizarSaldo(){

  if(!usuario){

    coinsEl.textContent =
      "0";

    chancesEl.textContent =
      "0";

    return;

  }


  coinsEl.textContent =
    Number(
      usuario.moedas || 0
    ).toLocaleString("pt-BR");


  chancesEl.textContent =
    Number(
      usuario.chances || 0
    ).toLocaleString("pt-BR");

}


/* =====================================================
   INICIAR PARTIDA
===================================================== */

async function iniciarPartida(){

  /*
     Evita descontar outra chance
     quando a pessoa simplesmente
     recarrega a página.
  */

  const sessionKey =
    "adam_senha_partida_iniciada";


  if(
    sessionStorage.getItem(
      sessionKey
    )
  ){

    gameStarted = true;

    generateSecret();

    return;

  }


  const chances =
    Number(
      usuario.chances || 0
    );


  if(
    chances <= 0
  ){

    noChanceModal.classList.add(
      "show"
    );

    messageEl.textContent =
      "Você não possui chances.";

    return;

  }


  /*
     AO INICIAR:

     -1 chance
     +30 Adam Coins
  */

  const novasChances =
    chances - 1;


  const novasMoedas =
    Number(
      usuario.moedas || 0
    ) + 30;


  await updateDoc(

    doc(
      db,
      "admins",
      usuarioDoc.id
    ),

    {

      chances:
        novasChances,

      moedas:
        novasMoedas

    }

  );


  usuario.chances =
    novasChances;

  usuario.moedas =
    novasMoedas;


  sessionStorage.setItem(
    sessionKey,
    "1"
  );


  gameStarted = true;

  atualizarSaldo();

  generateSecret();

}


/* =====================================================
   MOSTRAR COR NA LINHA
===================================================== */

function renderSelected(){

  const rows =
    document.querySelectorAll(
      ".row"
    );


  /*
     Limpamos somente a linha atual.
  */

  const currentRow =
    rows[attempts];


  if(!currentRow){

    return;

  }


  const slots =
    currentRow.querySelectorAll(
      ".slot"
    );


  slots.forEach(
    (slot,index) => {

      slot.innerHTML = "";

      slot.classList.add(
        "empty"
      );


      if(
        selected[index]
      ){

        const img =
          document.createElement(
            "img"
          );

        img.src =
          COLORS[
            selected[index]
          ];

        img.alt =
          selected[index];

        slot.appendChild(
          img
        );

        slot.classList.remove(
          "empty"
        );

      }

    }
  );

}


/* =====================================================
   ESCOLHER COR
===================================================== */

document
  .querySelectorAll(
    ".color-button"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          if(
            !gameStarted ||
            gameFinished
          ){

            return;

          }


          const max =
            LEVELS[
              currentLevel
            ].length;


          /*
             Não permite colocar
             mais cores que o tamanho
             da senha.
          */

          if(
            selected.length >= max
          ){

            return;

          }


          selected.push(
            button.dataset.color
          );


          renderSelected();


          messageEl.textContent =
            `${selected.length}/${max} cores escolhidas.`;

        }
      );

    }
  );


/* =====================================================
   LIMPAR
===================================================== */

clearButton.addEventListener(
  "click",
  () => {

    if(
      !gameStarted ||
      gameFinished
    ){

      return;

    }


    selected = [];


    renderSelected();


    const max =
      LEVELS[
        currentLevel
      ].length;


    messageEl.textContent =
      `Escolha as ${max} cores da senha.`;

    messageEl.className =
      "message";

  }
);


/* =====================================================
   CALCULAR PISTAS
===================================================== */

function calculateHints(
  guess,
  answer
){

  let black = 0;

  let white = 0;


  const answerUsed =
    new Array(
      answer.length
    ).fill(false);


  const guessUsed =
    new Array(
      guess.length
    ).fill(false);


  /*
     PRIMEIRO:

     cor certa no lugar certo.
  */

  for(
    let i = 0;
    i < answer.length;
    i++
  ){

    if(
      guess[i] === answer[i]
    ){

      black++;

      answerUsed[i] =
        true;

      guessUsed[i] =
        true;

    }

  }


  /*
     SEGUNDO:

     cor certa no lugar errado.
  */

  for(
    let i = 0;
    i < guess.length;
    i++
  ){

    if(
      guessUsed[i]
    ){

      continue;

    }


    for(
      let j = 0;
      j < answer.length;
      j++
    ){

      if(
        answerUsed[j]
      ){

        continue;

      }


      if(
        guess[i] === answer[j]
      ){

        white++;

        answerUsed[j] =
          true;

        break;

      }

    }

  }


  return {
    black,
    white
  };

}


/* =====================================================
   MOSTRAR HISTÓRICO
===================================================== */

function showHistory(
  rowIndex,
  black,
  white
){

  const rows =
    document.querySelectorAll(
      ".row"
    );


  const row =
    rows[rowIndex];


  if(!row){

    return;

  }


  /*
     Histórico minúsculo.

     Não colocamos nada grande
     por cima do tabuleiro.
  */

  let history =
    row.querySelector(
      ".history"
    );


  if(!history){

    history =
      document.createElement(
        "div"
      );

    history.className =
      "history";

    row.appendChild(
      history
    );

  }


  history.innerHTML = "";


  for(
    let i = 0;
    i < black;
    i++
  ){

    const dot =
      document.createElement(
        "div"
      );

    dot.className =
      "history-dot black";

    history.appendChild(
      dot
    );

  }


  for(
    let i = 0;
    i < white;
    i++
  ){

    const dot =
      document.createElement(
        "div"
      );

    dot.className =
      "history-dot white";

    history.appendChild(
      dot
    );

  }

}


/* =====================================================
   CONFIRMAR
===================================================== */

confirmButton.addEventListener(
  "click",
  async () => {

    if(
      !gameStarted ||
      gameFinished
    ){

      return;

    }


    const max =
      LEVELS[
        currentLevel
      ].length;


    if(
      selected.length !== max
    ){

      messageEl.textContent =
        `Escolha as ${max} cores antes de confirmar.`;

      messageEl.className =
        "message warning";

      return;

    }


    const result =
      calculateHints(
        selected,
        secret
      );


    showHistory(
      attempts,
      result.black,
      result.white
    );


    /*
       SENHA COMPLETAMENTE CERTA
    */

    if(
      result.black === max
    ){

      await venceuNivel();

      return;

    }


    /*
       ERRO
    */

    attempts++;


    selected = [];


    if(
      attempts >= MAX_ATTEMPTS
    ){

      perdeuNivel();

      return;

    }


    messageEl.textContent =
      `Senha incorreta. Tentativa ${attempts + 1} de ${MAX_ATTEMPTS}.`;

    messageEl.className =
      "message error";


    renderSelected();

  }
);


/* =====================================================
   VENCEU
===================================================== */

async function venceuNivel(){

  gameFinished = true;


  const reward =
    LEVELS[
      currentLevel
    ].reward;


  const novasMoedas =
    Number(
      usuario.moedas || 0
    ) + reward;


  await updateDoc(

    doc(
      db,
      "admins",
      usuarioDoc.id
    ),

    {

      moedas:
        novasMoedas

    }

  );


  usuario.moedas =
    novasMoedas;


  atualizarSaldo();


  messageEl.textContent =
    `🎉 ACERTOU! +${reward} Adam Coins`;

  messageEl.className =
    "message success";


  /*
     AGORA SIM:

     mostramos a senha.
  */

  revealColorsEl.innerHTML = "";


  secret.forEach(
    color => {

      const img =
        document.createElement(
          "img"
        );

      img.src =
        COLORS[color];

      img.alt =
        color;

      revealColorsEl.appendChild(
        img
      );

    }
  );


  revealEl.classList.add(
    "show"
  );


  if(
    currentLevel < 3
  ){

    setTimeout(
      () => {

        currentLevel++;

        iniciarNovoNivel();

      },
      1800
    );

  }
  else{

    messageEl.textContent =
      `🏆 NÍVEIS 1 A 3 CONCLUÍDOS! +${reward} Adam Coins`;

  }

}


/* =====================================================
   NOVO NÍVEL
===================================================== */

function iniciarNovoNivel(){

  gameFinished = false;

  attempts = 0;

  selected = [];

  revealEl.classList.remove(
    "show"
  );


  levelEl.textContent =
    `${currentLevel} / 3`;


  progressBar.style.width =
    `${(currentLevel / 3) * 100}%`;


  document
    .querySelectorAll(
      ".history"
    )
    .forEach(
      el => el.remove()
    );


  document
    .querySelectorAll(
      ".slot"
    )
    .forEach(
      slot => {

        slot.innerHTML = "";

        slot.classList.add(
          "empty"
        );

      }
    );


  messageEl.className =
    "message";


  messageEl.textContent =
    "Escolha as 3 cores da nova senha.";


  generateSecret();

}


/* =====================================================
   PERDEU
===================================================== */

function perdeuNivel(){

  gameFinished = true;


  messageEl.textContent =
    "💔 Você esgotou as 10 tentativas.";

  messageEl.className =
    "message error";


  /*
     Mostramos a senha somente
     depois que a pessoa perdeu.
  */

  revealColorsEl.innerHTML = "";


  secret.forEach(
    color => {

      const img =
        document.createElement(
          "img"
        );

      img.src =
        COLORS[color];

      img.alt =
        color;

      revealColorsEl.appendChild(
        img
      );

    }
  );


  revealEl.classList.add(
    "show"
  );

}


/* =====================================================
   VOLTAR
===================================================== */

document
  .getElementById("back")
  .addEventListener(
    "click",
    () => {

      sessionStorage.removeItem(
        "adam_senha_partida_iniciada"
      );

      window.location.href =
        "jogos.html";

    }
  );


/* =====================================================
   MODAL
===================================================== */

document
  .getElementById("modalClose")
  .addEventListener(
    "click",
    () => {

      noChanceModal.classList.remove(
        "show"
      );

      window.location.href =
        "jogos.html";

    }
  );


/* =====================================================
   FIREBASE / INICIALIZAÇÃO
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      window.location.replace(
        "index.html"
      );

      return;

    }


    try{

      usuarioDoc =
        await localizarUsuario(
          user
        );


      if(!usuarioDoc){

        loading.classList.add(
          "hide"
        );

        messageEl.textContent =
          "Não foi possível localizar seu cadastro.";

        messageEl.className =
          "message error";

        return;

      }


      usuario =
        usuarioDoc.data();


      atualizarSaldo();


      await iniciarPartida();


      loading.classList.add(
        "hide"
      );

    }

    catch(error){

      console.error(
        "Erro no jogo Senha:",
        error
      );


      loading.classList.add(
        "hide"
      );


      messageEl.textContent =
        "Erro ao carregar o jogo.";

      messageEl.className =
        "message error";

    }

  }
);

</script>
