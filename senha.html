<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Adam Games • Senha</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  min-height:100%;
  background:#061b2d;
}

body{

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:#fff;

  overflow-x:hidden;

}


/* =====================================================
   PÁGINA
===================================================== */

.page{

  width:100%;

  max-width:700px;

  margin:0 auto;

  padding:
    14px
    14px
    50px;

}


/* =====================================================
   TOPO
===================================================== */

.top{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:14px;

}


.back{

  width:46px;
  height:46px;

  border:0;

  border-radius:14px;

  background:
    rgba(0,35,65,.9);

  color:#fff;

  font-size:27px;

  cursor:pointer;

}


.title{

  text-align:center;

}


.title small{

  display:block;

  font-size:10px;

  letter-spacing:3px;

  color:#a9d8ee;

}


.title strong{

  display:block;

  margin-top:2px;

  font-size:25px;

  text-shadow:
    0 3px 8px #000;

}


/* =====================================================
   SALDOS
===================================================== */

.saldos{

  display:grid;

  grid-template-columns:
    1fr
    1fr
    1fr;

  gap:8px;

}


.saldo{

  min-height:70px;

  padding:10px 6px;

  border-radius:16px;

  text-align:center;

  background:
    rgba(2,28,53,.92);

  border:
    1px solid
    rgba(255,255,255,.08);

}


.saldo-label{

  font-size:10px;

  font-weight:900;

  color:#a9d5e9;

}


.saldo-value{

  margin-top:5px;

  font-size:25px;

  font-weight:900;

}


.moedas{
  color:#ffd52b;
}

.chances{
  color:#58ff9b;
}

.fase{
  color:#61c8ff;
}


/* =====================================================
   PROGRESSO
===================================================== */

.progress-wrap{

  margin-top:12px;

  height:10px;

  overflow:hidden;

  border-radius:20px;

  background:
    rgba(255,255,255,.12);

}


.progress{

  height:100%;

  width:33.33%;

  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      #18d86b,
      #ffe02b
    );

  transition:
    width .3s ease;

}


/* =====================================================
   TÍTULO DO NÍVEL
===================================================== */

.level-title{

  margin-top:18px;

  text-align:center;

}


.level-title h1{

  font-size:
    clamp(
      25px,
      7vw,
      34px
    );

  line-height:1.05;

  text-shadow:
    0 3px 8px #000;

}


.level-title p{

  margin-top:7px;

  color:#c4dfed;

  font-size:14px;

}


/* =====================================================
   ÁREA DO FUNDO
===================================================== */

.scene{

  position:relative;

  width:100%;

  margin-top:18px;

  border-radius:20px;

  overflow:hidden;

  background:#0b2940;

}


.scene-bg{

  display:block;

  width:100%;

  height:auto;

  min-height:420px;

  object-fit:cover;

}


/* =====================================================
   HISTÓRICO
===================================================== */

.history-box{

  margin-top:16px;

  padding:13px;

  border-radius:18px;

  background:
    rgba(10,25,38,.96);

  border:
    2px solid
    #9a692d;

  box-shadow:
    0 7px 20px
    rgba(0,0,0,.25);

}


.history-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:9px;

}


.history-title{

  color:#ffd86b;

  font-size:13px;

  font-weight:900;

  letter-spacing:.4px;

}


.history-count{

  color:#b8d8e9;

  font-size:12px;

  font-weight:bold;

}


/* =====================================================
   LINHAS DO HISTÓRICO
===================================================== */

.history-list{

  display:flex;

  flex-direction:column;

  gap:5px;

}


.history-row{

  min-height:39px;

  display:flex;

  align-items:center;

  gap:8px;

  padding:4px 7px;

  border-radius:9px;

  background:
    rgba(255,255,255,.045);

}


.history-number{

  width:22px;

  color:#ffd86b;

  font-size:12px;

  font-weight:900;

  text-align:center;

  flex-shrink:0;

}


.history-colors{

  display:flex;

  align-items:center;

  gap:5px;

  flex:1;

  min-width:0;

}


.history-result{

  width:62px;

  display:flex;

  align-items:center;

  justify-content:flex-end;

  flex-wrap:wrap;

  gap:3px;

}


.empty-ball{

  width:10px;

  height:10px;

  border-radius:50%;

  border:
    1px solid
    rgba(255,255,255,.15);

  background:
    rgba(255,255,255,.06);

}


.result-ball{

  width:11px;

  height:11px;

  object-fit:contain;

  flex-shrink:0;

}


/* =====================================================
   BOLAS DAS TENTATIVAS
===================================================== */

.attempt-box{

  margin-top:14px;

  padding:14px;

  border-radius:18px;

  background:
    rgba(8,25,39,.97);

  border:
    2px solid
    rgba(154,105,45,.9);

}


.attempt-title{

  text-align:center;

  color:#ffd86b;

  font-size:12px;

  font-weight:900;

  letter-spacing:1px;

}


.attempt-slots{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:12px;

  min-height:64px;

  margin-top:9px;

}


.attempt-slot{

  width:54px;

  height:54px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  border:
    2px dashed
    rgba(255,255,255,.3);

  background:
    rgba(255,255,255,.04);

}


.attempt-slot img{

  width:48px;

  height:48px;

  object-fit:contain;

}


.attempt-empty{

  color:#557083;

  font-size:22px;

}


/* =====================================================
   PALETA
===================================================== */

.palette{

  margin-top:12px;

  padding:10px;

  display:grid;

  grid-template-columns:
    repeat(6,1fr);

  gap:8px;

  border-radius:18px;

  background:
    rgba(20,18,17,.96);

  border:
    2px solid
    #9a692d;

}


.color-button{

  min-width:0;

  height:66px;

  display:flex;

  align-items:center;

  justify-content:center;

  border:0;

  border-radius:13px;

  background:
    rgba(255,255,255,.07);

  cursor:pointer;

  -webkit-tap-highlight-color:
    transparent;

}


.color-button:active{

  transform:scale(.94);

}


.color-button img{

  width:52px;

  height:52px;

  object-fit:contain;

  pointer-events:none;

}


/* =====================================================
   BOTÕES
===================================================== */

.actions{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:10px;

  margin-top:12px;

}


.action{

  height:54px;

  border:0;

  border-radius:15px;

  color:#fff;

  font-size:16px;

  font-weight:900;

  cursor:pointer;

}


.clear{

  background:
    linear-gradient(
      135deg,
      #315f83,
      #173b5c
    );

}


.confirm{

  background:
    linear-gradient(
      135deg,
      #20d96b,
      #09944a
    );

}


.action:active{

  transform:scale(.98);

}


.action:disabled{

  opacity:.45;

  cursor:not-allowed;

}


/* =====================================================
   STATUS
===================================================== */

.status{

  min-height:25px;

  margin-top:10px;

  text-align:center;

  font-size:13px;

  font-weight:bold;

  color:#bcd9e8;

}


.status.error{

  color:#ff7777;

}


.status.success{

  color:#65ff9a;

}


/* =====================================================
   MODAL
===================================================== */

.modal{

  position:fixed;

  inset:0;

  z-index:1000;

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:
    rgba(0,8,18,.84);

  backdrop-filter:
    blur(5px);

}


.modal.show{

  display:flex;

}


.modal-card{

  width:100%;

  max-width:370px;

  padding:25px 20px;

  border-radius:22px;

  text-align:center;

  background:#082742;

  border:
    1px solid
    rgba(255,255,255,.12);

}


.modal-icon{

  font-size:45px;

}


.modal-card h2{

  margin-top:7px;

  font-size:24px;

}


.modal-card p{

  margin-top:9px;

  color:#b9d5e8;

  line-height:1.45;

  font-size:14px;

}


.modal-button{

  width:100%;

  height:48px;

  margin-top:20px;

  border:0;

  border-radius:13px;

  background:#18a85c;

  color:#fff;

  font-weight:900;

  cursor:pointer;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:430px){

  .page{

    padding:
      12px
      10px
      40px;

  }


  .saldo{

    min-height:66px;

  }


  .saldo-value{

    font-size:23px;

  }


  .history-box{

    padding:10px;

  }


  .history-result{

    width:55px;

  }


  .attempt-slot{

    width:50px;

    height:50px;

  }


  .attempt-slot img{

    width:45px;

    height:45px;

  }


  .palette{

    gap:6px;

    padding:8px;

  }


  .color-button{

    height:61px;

  }


  .color-button img{

    width:48px;

    height:48px;

  }

}

</style>

</head>


<body>

<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  doc,
  runTransaction
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:
    "adam-games-21081.firebaseapp.com",

  projectId:
    "adam-games-21081",

  storageBucket:
    "adam-games-21081.firebasestorage.app",

  messagingSenderId:
    "1055528418738",

  appId:
    "1:1055528418738:web:5fafdf63424ba9744eb8ab"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================================
   ELEMENTOS
===================================================== */

const moedasEl =
  document.getElementById("moedas");

const chancesEl =
  document.getElementById("chances");

const faseEl =
  document.getElementById("fase");

const progressEl =
  document.getElementById("progress");

const levelTitleEl =
  document.getElementById("levelTitle");

const levelDescriptionEl =
  document.getElementById("levelDescription");

const sceneBg =
  document.getElementById("sceneBg");

const historyList =
  document.getElementById("historyList");

const historyCount =
  document.getElementById("historyCount");

const attemptSlots =
  document.getElementById("attemptSlots");

const statusEl =
  document.getElementById("status");

const modal =
  document.getElementById("modal");

const modalIcon =
  document.getElementById("modalIcon");

const modalTitle =
  document.getElementById("modalTitle");

const modalText =
  document.getElementById("modalText");

const modalButton =
  document.getElementById("modalButton");


/* =====================================================
   CORES
===================================================== */

const cores = {

  vermelho:
    "./vermelho.png",

  azul:
    "./azul.png",

  verde:
    "./verde.png",

  amarelo:
    "./amarelo.png",

  roxo:
    "./roxo.png",

  laranja:
    "./laranja.png"

};


const nomesCores =
  Object.keys(cores);


/* =====================================================
   CONFIGURAÇÃO DOS NÍVEIS
===================================================== */

const niveis = [

  {
    numero:1,
    tamanho:3
  },

  {
    numero:2,
    tamanho:3
  },

  {
    numero:3,
    tamanho:3
  }

];


/* =====================================================
   ESTADO
===================================================== */

let usuario = null;

let documentoUsuario = null;

let nivelAtual = 0;

let senhaSecreta = [];

let tentativaAtual = [];

let historico = [];

let partidaIniciada = false;


/* =====================================================
   LOCALIZAR USUÁRIO
===================================================== */

async function localizarUsuario(user){

  let resultado =
    await getDocs(

      query(
        collection(db,"admins"),
        where(
          "uid",
          "==",
          user.uid
        )
      )

    );


  if(
    resultado.empty &&
    user.email
  ){

    resultado =
      await getDocs(

        query(
          collection(db,"admins"),
          where(
            "email",
            "==",
            user.email.toLowerCase()
          )
        )

      );

  }


  if(
    resultado.empty
  ){

    return null;

  }


  return resultado.docs[0];

}


/* =====================================================
   ATUALIZAR SALDOS
===================================================== */

function atualizarSaldos(){

  if(!usuario){

    moedasEl.textContent =
      "0";

    chancesEl.textContent =
      "0";

    return;

  }


  moedasEl.textContent =
    Number(
      usuario.moedas || 0
    ).toLocaleString("pt-BR");


  chancesEl.textContent =
    Number(
      usuario.chances || 0
    ).toLocaleString("pt-BR");

}


/* =====================================================
   GERAR SENHA
===================================================== */

function gerarSenha(){

  const tamanho =
    niveis[nivelAtual].tamanho;


  const senha = [];


  for(
    let i = 0;
    i < tamanho;
    i++
  ){

    const indice =
      Math.floor(
        Math.random() *
        nomesCores.length
      );


    senha.push(
      nomesCores[indice]
    );

  }


  return senha;

}


/* =====================================================
   MOSTRAR TENTATIVA
===================================================== */

function renderizarTentativa(){

  attemptSlots.innerHTML = "";


  for(
    let i = 0;
    i < 3;
    i++
  ){

    const slot =
      document.createElement("div");

    slot.className =
      "attempt-slot";


    if(
      tentativaAtual[i]
    ){

      const img =
        document.createElement("img");

      img.src =
        cores[
          tentativaAtual[i]
        ];

      img.alt =
        tentativaAtual[i];

      slot.appendChild(img);

    }
    else{

      const vazio =
        document.createElement("span");

      vazio.className =
        "attempt-empty";

      vazio.textContent =
        "•";

      slot.appendChild(vazio);

    }


    attemptSlots.appendChild(slot);

  }


  statusEl.textContent =
    tentativaAtual.length +
    "/3 cores escolhidas.";

}


/* =====================================================
   CRIAR HISTÓRICO VAZIO
===================================================== */

function criarHistorico(){

  historyList.innerHTML = "";


  for(
    let i = 0;
    i < 10;
    i++
  ){

    const row =
      document.createElement("div");

    row.className =
      "history-row";


    const numero =
      document.createElement("div");

    numero.className =
      "history-number";

    numero.textContent =
      i + 1;


    const colors =
      document.createElement("div");

    colors.className =
      "history-colors";


    for(
      let j = 0;
      j < 3;
      j++
    ){

      const vazio =
        document.createElement("div");

      vazio.className =
        "empty-ball";

      colors.appendChild(
        vazio
      );

    }


    const resultado =
      document.createElement("div");

    resultado.className =
      "history-result";


    for(
      let j = 0;
      j < 3;
      j++
    ){

      const vazio =
        document.createElement("div");

      vazio.className =
        "empty-ball";

      resultado.appendChild(
        vazio
      );

    }


    row.appendChild(
      numero
    );

    row.appendChild(
      colors
    );

    row.appendChild(
      resultado
    );


    historyList.appendChild(
      row
    );

  }


  historyCount.textContent =
    "0 / 10";

}


/* =====================================================
   ATUALIZAR HISTÓRICO
===================================================== */

function renderizarHistorico(){

  criarHistorico();


  historico.forEach(
    (item,index) => {

      const row =
        historyList.children[index];


      const colors =
        row.querySelector(
          ".history-colors"
        );


      const resultado =
        row.querySelector(
          ".history-result"
        );


      colors.innerHTML = "";

      resultado.innerHTML = "";


      item.tentativa.forEach(
        cor => {

          const img =
            document.createElement("img");

          img.className =
            "result-ball";

          img.src =
            cores[cor];

          img.alt =
            cor;

          colors.appendChild(
            img
          );

        }
      );


      item.resultado.forEach(
        tipo => {

          const img =
            document.createElement("img");

          img.className =
            "result-ball";


          if(
            tipo === "preta"
          ){

            img.src =
              "./preto.png";

          }
          else if(
            tipo === "branca"
          ){

            img.src =
              "./branco.png";

          }


          img.alt =
            tipo;

          resultado.appendChild(
            img
          );

        }
      );

    }
  );


  historyCount.textContent =
    historico.length +
    " / 10";

}


/* =====================================================
   CALCULAR RESULTADO
===================================================== */

function calcularResultado(
  tentativa,
  senha
){

  const resultado = [];

  const usadosSenha =
    new Array(
      senha.length
    ).fill(false);

  const usadosTentativa =
    new Array(
      tentativa.length
    ).fill(false);


  /*
    PRIMEIRA PASSAGEM:

    PRETA =
    mesma cor + mesma posição
  */

  for(
    let i = 0;
    i < senha.length;
    i++
  ){

    if(
      tentativa[i] === senha[i]
    ){

      resultado.push(
        "preta"
      );

      usadosSenha[i] =
        true;

      usadosTentativa[i] =
        true;

    }

  }


  /*
    SEGUNDA PASSAGEM:

    BRANCA =
    cor existe,
    mas está em posição diferente.
  */

  for(
    let i = 0;
    i < tentativa.length;
    i++
  ){

    if(
      usadosTentativa[i]
    ){

      continue;

    }


    for(
      let j = 0;
      j < senha.length;
      j++
    ){

      if(
        usadosSenha[j]
      ){

        continue;

      }


      if(
        tentativa[i] === senha[j]
      ){

        resultado.push(
          "branca"
        );

        usadosSenha[j] =
          true;

        break;

      }

    }

  }


  return resultado;

}


/* =====================================================
   ADICIONAR TENTATIVA
===================================================== */

function adicionarTentativa(){

  if(
    tentativaAtual.length !== 3
  ){

    statusEl.textContent =
      "Escolha exatamente 3 cores.";

    statusEl.className =
      "status error";

    return;

  }


  const resultado =
    calcularResultado(
      tentativaAtual,
      senhaSecreta
    );


  historico.push({

    tentativa:
      [...tentativaAtual],

    resultado:
      [...resultado]

  });


  renderizarHistorico();


  const acertou =
    resultado.length === 3 &&
    resultado.every(
      tipo =>
        tipo === "preta"
    );


  tentativaAtual = [];

  renderizarTentativa();


  if(acertou){

    venceuNivel();

    return;

  }


  if(
    historico.length >= 10
  ){

    perdeuNivel();

    return;

  }


  statusEl.textContent =
    "Tentativa registrada. Tente novamente.";

  statusEl.className =
    "status";

}


/* =====================================================
   ESCOLHER COR
===================================================== */

document
  .querySelectorAll(
    ".color-button"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          if(
            tentativaAtual.length >= 3
          ){

            return;

          }


          const cor =
            button.dataset.color;


          tentativaAtual.push(
            cor
          );


          renderizarTentativa();

        }
      );

    }
  );


/* =====================================================
   LIMPAR
===================================================== */

document
  .getElementById(
    "clearButton"
  )
  .addEventListener(
    "click",
    () => {

      tentativaAtual = [];

      renderizarTentativa();

      statusEl.textContent =
        "Tentativa limpa.";

      statusEl.className =
        "status";

    }
  );


/* =====================================================
   CONFIRMAR
===================================================== */

document
  .getElementById(
    "confirmButton"
  )
  .addEventListener(
    "click",
    () => {

      adicionarTentativa();

    }
  );


/* =====================================================
   PREPARAR NÍVEL
===================================================== */

function prepararNivel(){

  tentativaAtual = [];

  historico = [];

  senhaSecreta =
    gerarSenha();


  /*
    IMPORTANTE:

    A senha fica somente
    nesta variável.

    Ela NÃO é colocada
    no HTML.
  */


  faseEl.textContent =
    (nivelAtual + 1) +
    " / 3";


  levelTitleEl.textContent =
    "NÍVEL " +
    (nivelAtual + 1) +
    " — DESCUBRA A SENHA";


  levelDescriptionEl.textContent =
    "Memorize as 3 cores e reproduza a sequência.";


  progressEl.style.width =
    (
      ((nivelAtual + 1) / 3) *
      100
    ) +
    "%";


  renderizarTentativa();

  criarHistorico();


  statusEl.textContent =
    "Escolha 3 cores e confirme.";

  statusEl.className =
    "status";


  /*
    O fundo é o mesmo
    para os níveis 1 a 3.
  */

  sceneBg.src =
    "./fundo_nivel_01_03.png";

}


/* =====================================================
   VITÓRIA
===================================================== */

async function venceuNivel(){

  statusEl.textContent =
    "🎉 Senha correta!";

  statusEl.className =
    "status success";


  if(
    nivelAtual < 2
  ){

    modalIcon.textContent =
      "🎉";

    modalTitle.textContent =
      "NÍVEL CONCLUÍDO!";

    modalText.textContent =
      "Você acertou a senha. Preparado para o próximo nível?";

    modalButton.textContent =
      "PRÓXIMO NÍVEL";


    modalButton.onclick =
      () => {

        modal.classList.remove(
          "show"
        );

        nivelAtual++;

        prepararNivel();

      };


    modal.classList.add(
      "show"
    );


  }
  else{

    modalIcon.textContent =
      "🏆";

    modalTitle.textContent =
      "PARABÉNS!";

    modalText.textContent =
      "Você completou os 3 níveis da Senha!";

    modalButton.textContent =
      "VOLTAR AOS JOGOS";


    modalButton.onclick =
      () => {

        window.location.href =
          "jogos.html";

      };


    modal.classList.add(
      "show"
    );

  }

}


/* =====================================================
   DERROTA
===================================================== */

function perdeuNivel(){

  statusEl.textContent =
    "❌ Suas 10 tentativas acabaram.";

  statusEl.className =
    "status error";


  modalIcon.textContent =
    "💔";

  modalTitle.textContent =
    "FIM DAS TENTATIVAS";

  modalText.textContent =
    "Você não conseguiu descobrir a senha neste nível.";

  modalButton.textContent =
    "TENTAR NOVAMENTE";


  modalButton.onclick =
    () => {

      modal.classList.remove(
        "show"
      );

      prepararNivel();

    };


  modal.classList.add(
    "show"
  );

}


/* =====================================================
   DESCONTAR CHANCE
===================================================== */

async function descontarChance(){

  if(
    !documentoUsuario
  ){

    return false;

  }


  try{

    const referencia =
      doc(
        db,
        "admins",
        documentoUsuario.id
      );


    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            referencia
          );


        if(
          !snap.exists()
        ){

          throw new Error(
            "Usuário não encontrado."
          );

        }


        const dados =
          snap.data();


        const chances =
          Number(
            dados.chances || 0
          );


        if(
          chances <= 0
        ){

          throw new Error(
            "SEM_CHANCES"
          );

        }


        transaction.update(
          referencia,
          {
            chances:
              chances - 1
          }
        );

      }
    );


    usuario.chances =
      Number(
        usuario.chances || 0
      ) - 1;


    atualizarSaldos();


    return true;

  }
  catch(error){

    console.error(
      "Erro ao descontar chance:",
      error
    );


    if(
      error.message ===
      "SEM_CHANCES"
    ){

      statusEl.textContent =
        "Você não possui chances para jogar.";

    }
    else{

      statusEl.textContent =
        "Não foi possível iniciar a partida.";

    }


    statusEl.className =
      "status error";


    return false;

  }

}


/* =====================================================
   INICIAR PARTIDA
===================================================== */

async function iniciarPartida(){

  /*
    Evita descontar outra chance
    caso a página seja recarregada
    durante o teste.
  */

  const chave =
    "adam_games_senha_partida";


  const partidaAnterior =
    sessionStorage.getItem(
      chave
    );


  if(
    partidaAnterior === "ativa"
  ){

    prepararNivel();

    return;

  }


  const ok =
    await descontarChance();


  if(!ok){

    return;

  }


  sessionStorage.setItem(
    chave,
    "ativa"
  );


  prepararNivel();

}


/* =====================================================
   VOLTAR
===================================================== */

document
  .getElementById("back")
  .addEventListener(
    "click",
    () => {

      window.location.href =
        "jogos.html";

    }
  );


/* =====================================================
   FIREBASE / LOGIN
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      window.location.replace(
        "index.html"
      );

      return;

    }


    try{

      documentoUsuario =
        await localizarUsuario(
          user
        );


      if(
        !documentoUsuario
      ){

        statusEl.textContent =
          "Cadastro não encontrado.";

        statusEl.className =
          "status error";

        return;

      }


      usuario =
        documentoUsuario.data();


      atualizarSaldos();


      await iniciarPartida();

    }
    catch(error){

      console.error(error);

      statusEl.textContent =
        "Erro ao carregar o jogo.";

      statusEl.className =
        "status error";

    }

  }
);
