<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Adam Games • Senha</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  min-height:100%;
  background:#031c35;
}

body{

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:#fff;

  overflow-x:hidden;

}


/* =====================================================
   PÁGINA
===================================================== */

.page{

  width:100%;
  max-width:700px;

  margin:0 auto;

  padding:
    12px
    14px
    50px;

}


/* =====================================================
   TOPO
===================================================== */

.top{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:10px;

}


.back{

  width:48px;
  height:48px;

  border:0;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #0d75aa,
      #064c78
    );

  color:#fff;

  font-size:28px;

  cursor:pointer;

}


.title{

  text-align:center;

}


.title small{

  display:block;

  color:#9dd8ef;

  font-size:10px;

  letter-spacing:3px;

}


.title strong{

  display:block;

  margin-top:2px;

  font-size:25px;

  font-weight:900;

}


/* =====================================================
   SALDOS
===================================================== */

.status{

  display:grid;

  grid-template-columns:
    1fr
    1fr
    1fr;

  gap:8px;

}


.status-card{

  padding:
    11px
    6px;

  border-radius:15px;

  text-align:center;

  background:
    rgba(2,31,55,.94);

  border:
    1px solid
    rgba(255,255,255,.08);

}


.status-label{

  color:#9dc9df;

  font-size:10px;

  font-weight:bold;

  letter-spacing:.6px;

}


.status-value{

  margin-top:3px;

  font-size:22px;

  font-weight:900;

}


.coins{
  color:#ffd42a;
}

.chances{
  color:#59ff9b;
}

.level{
  color:#63c9ff;
}


/* =====================================================
   PROGRESSO
===================================================== */

.progress{

  height:10px;

  margin-top:10px;

  overflow:hidden;

  border-radius:20px;

  background:
    #123b54;

}


.progress-bar{

  width:33.33%;

  height:100%;

  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      #26d86d,
      #ffd52b
    );

  transition:
    width .3s ease;

}


/* =====================================================
   TÍTULO DO NÍVEL
===================================================== */

.level-title{

  margin-top:18px;

  text-align:center;

}


.level-title h1{

  font-size:
    clamp(
      24px,
      7vw,
      34px
    );

  font-weight:900;

}


.level-title p{

  margin-top:6px;

  color:#b9d9e9;

  font-size:14px;

}


/* =====================================================
   ÁREA PRINCIPAL
===================================================== */

.game-area{

  position:relative;

  margin-top:15px;

  overflow:hidden;

  border-radius:20px;

  background:#082d47;

  box-shadow:
    0 12px 30px
    rgba(0,0,0,.35);

}


/* =====================================================
   FUNDO DO JOGO
===================================================== */

.game-background{

  position:relative;

  width:100%;

  min-height:620px;

  background-image:
    url("./fundo_nivel_01_03.png");

  background-size:
    cover;

  background-position:
    center;

}


/* =====================================================
   TABULEIRO SIMPLES
===================================================== */

.board{

  position:absolute;

  left:4%;

  right:4%;

  top:35px;

  padding:12px;

  border-radius:18px;

  background:
    rgba(20,15,10,.68);

  border:
    2px solid
    rgba(190,125,42,.9);

  box-shadow:
    0 8px 20px
    rgba(0,0,0,.35);

}


/* =====================================================
   CABEÇALHO DO HISTÓRICO
===================================================== */

.board-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:8px;

}


.board-title{

  font-size:13px;

  font-weight:900;

  color:#ffd45a;

}


.attempt-counter{

  font-size:11px;

  color:#fff;

  font-weight:bold;

}


/* =====================================================
   TENTATIVAS
===================================================== */

.rows{

  display:flex;

  flex-direction:column;

  gap:5px;

}


.row{

  min-height:39px;

  display:flex;

  align-items:center;

  gap:6px;

  padding:
    4px
    6px;

  border-radius:9px;

  background:
    rgba(255,255,255,.07);

}


.row-number{

  width:20px;

  flex:none;

  text-align:center;

  color:#eacb83;

  font-size:11px;

  font-weight:bold;

}


.guess{

  display:flex;

  align-items:center;

  gap:4px;

  flex:1;

  min-width:0;

}


.feedback{

  display:flex;

  align-items:center;

  justify-content:flex-end;

  gap:3px;

  width:52px;

  flex:none;

}


/* =====================================================
   BOLAS DA TENTATIVA
===================================================== */

.small-color{

  width:27px;

  height:27px;

  flex:none;

  border-radius:50%;

  border:
    2px solid
    rgba(255,255,255,.35);

  box-shadow:
    inset 0 2px 3px rgba(255,255,255,.25),
    0 2px 4px rgba(0,0,0,.35);

}


.empty-color{

  width:27px;

  height:27px;

  flex:none;

  border-radius:50%;

  background:
    rgba(0,0,0,.28);

  border:
    2px solid
    rgba(255,255,255,.16);

}


/* =====================================================
   BOLAS PRETA / BRANCA
===================================================== */

.feedback-dot{

  width:9px;

  height:9px;

  border-radius:50%;

  flex:none;

  border:
    1px solid
    rgba(0,0,0,.5);

}


.feedback-black{

  background:#111;

  box-shadow:
    0 1px 2px rgba(0,0,0,.5);

}


.feedback-white{

  background:#fff;

  box-shadow:
    0 1px 2px rgba(0,0,0,.5);

}


/* =====================================================
   ÁREA DA TENTATIVA ATUAL
===================================================== */

.current{

  position:absolute;

  left:5%;

  right:5%;

  bottom:18px;

  padding:12px;

  border-radius:17px;

  background:
    rgba(8,18,25,.92);

  border:
    2px solid
    rgba(189,128,42,.9);

}


.current-title{

  text-align:center;

  color:#ffd45a;

  font-size:12px;

  font-weight:900;

  margin-bottom:8px;

}


.current-guess{

  min-height:54px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:8px;

}


/* =====================================================
   BOLAS GRANDES DA TENTATIVA
===================================================== */

.current-ball{

  width:48px;

  height:48px;

  border-radius:50%;

  border:
    2px solid
    rgba(255,255,255,.35);

  box-shadow:
    inset 0 3px 5px
    rgba(255,255,255,.25),

    0 4px 8px
    rgba(0,0,0,.45);

}


.current-empty{

  width:48px;

  height:48px;

  border-radius:50%;

  background:
    rgba(0,0,0,.25);

  border:
    2px dashed
    rgba(255,255,255,.2);

}


/* =====================================================
   CORES
===================================================== */

.color-red{
  background:
    radial-gradient(circle at 30% 25%, #ff7777, #ed1018 45%, #a60008);
}

.color-blue{
  background:
    radial-gradient(circle at 30% 25%, #71b8ff, #0872e8 45%, #003d9b);
}

.color-green{
  background:
    radial-gradient(circle at 30% 25%, #82ff91, #10c735 45%, #008021);
}

.color-yellow{
  background:
    radial-gradient(circle at 30% 25%, #fff68a, #ffd000 45%, #b88400);
}

.color-purple{
  background:
    radial-gradient(circle at 30% 25%, #d58aff, #8b20e8 45%, #4c008d);
}

.color-orange{
  background:
    radial-gradient(circle at 30% 25%, #ffd08a, #ff8a00 45%, #a84a00);
}


/* =====================================================
   PALETA
===================================================== */

.palette{

  display:grid;

  grid-template-columns:
    repeat(6,1fr);

  gap:8px;

  margin-top:10px;

  padding:10px;

  border-radius:17px;

  background:
    rgba(12,10,10,.92);

  border:
    2px solid
    rgba(177,118,39,.85);

}


.color-button{

  min-height:65px;

  display:flex;

  align-items:center;

  justify-content:center;

  border:0;

  border-radius:12px;

  background:
    rgba(255,255,255,.06);

  cursor:pointer;

  -webkit-tap-highlight-color:
    transparent;

}


.color-button:active{

  transform:
    scale(.94);

}


.color-button.disabled{

  opacity:.4;

  pointer-events:none;

}


.palette-ball{

  width:45px;

  height:45px;

  border-radius:50%;

  border:
    2px solid
    rgba(255,255,255,.25);

  box-shadow:
    inset 0 3px 5px
    rgba(255,255,255,.25),

    0 3px 6px
    rgba(0,0,0,.45);

}


/* =====================================================
   BOTÕES
===================================================== */

.actions{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:10px;

  margin-top:10px;

}


.action{

  height:55px;

  border:0;

  border-radius:15px;

  color:#fff;

  font-size:16px;

  font-weight:900;

  cursor:pointer;

}


.clear{

  background:
    linear-gradient(
      135deg,
      #285f87,
      #174363
    );

}


.confirm{

  background:
    linear-gradient(
      135deg,
      #28d96c,
      #08a84f
    );

}


.action:disabled{

  opacity:.45;

  cursor:not-allowed;

}


/* =====================================================
   MENSAGEM
===================================================== */

.message{

  min-height:25px;

  margin-top:9px;

  text-align:center;

  font-size:13px;

  font-weight:bold;

}


.message.error{

  color:#ff7777;

}


.message.success{

  color:#5dff9a;

}


.message.info{

  color:#b8d9e9;

}


/* =====================================================
   MODAL
===================================================== */

.modal{

  position:fixed;

  inset:0;

  z-index:1000;

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:
    rgba(0,0,0,.8);

}


.modal.show{

  display:flex;

}


.modal-card{

  width:100%;

  max-width:380px;

  padding:25px;

  border-radius:20px;

  text-align:center;

  background:#082742;

  border:
    1px solid
    rgba(255,255,255,.15);

}


.modal-card h2{

  font-size:24px;

}


.modal-card p{

  margin-top:10px;

  color:#bdd8e8;

  line-height:1.5;

}


.modal-button{

  width:100%;

  height:48px;

  margin-top:20px;

  border:0;

  border-radius:13px;

  background:#18ad60;

  color:#fff;

  font-weight:900;

}


/* =====================================================
   CELULAR
===================================================== */

@media(max-width:430px){

  .page{

    padding-left:10px;

    padding-right:10px;

  }


  .status{

    gap:6px;

  }


  .status-card{

    padding:
      10px
      4px;

  }


  .status-value{

    font-size:20px;

  }


  .game-background{

    min-height:590px;

  }


  .board{

    left:3%;

    right:3%;

    top:25px;

    padding:8px;

  }


  .small-color{

    width:25px;
    height:25px;
  }


  .empty-color{

    width:25px;
    height:25px;
  }


  .current{

    left:4%;
    right:4%;

  }


  .current-ball,
  .current-empty{

    width:43px;
    height:43px;

  }


  .palette-ball{

    width:42px;
    height:42px;

  }

}


/* =====================================================
   TELA PEQUENA
===================================================== */

@media(max-width:360px){

  .palette{

    gap:4px;

    padding:7px;

  }


  .color-button{

    min-height:56px;

  }


  .palette-ball{

    width:37px;
    height:37px;

  }


  .current-ball,
  .current-empty{

    width:39px;
    height:39px;

  }

}

</style>

</head>

<script type="module">

from

import {

}
from

from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

    "adam-games-21081.firebaseapp.com",

  storageBucket:

  messagingSenderId:

};


const app =

/* =====================================================
   ELEMENTOS
===================================================== */

const moedasEl =
  document.getElementById(

  );


const chancesEl =
  document.getElementById(
    "chances"
  );


const nivelEl =
  document.getElementById(
    "nivel"
  );


const levelTitleEl =
  document.getElementById(
    "levelTitle"
  );


const instructionEl =
  document.getElementById(
    "instruction"
  );


const progressBar =
  document.getElementById(
    "progressBar"
  );


const rowsEl =
  document.getElementById(
    "rows"
  );


const currentGuessEl =
  document.getElementById(
    "currentGuess"
  );


const attemptCounterEl =
  document.getElementById(
    "attemptCounter"
  );


const messageEl =
  document.getElementById(
    "message"
  );


const confirmButton =
  document.getElementById(

const clearButton =

  );

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const MAX_TENTATIVAS =
  10;


/*
   Por enquanto:

   Nível 1 = 3 cores
   Nível 2 = 3 cores
   Nível 3 = 3 cores

   Depois podemos aumentar.
*/

const NIVEL_CONFIG = {

  1:{
    tamanho:3,
    recompensa:20
  },

  2:{
    tamanho:3,
    recompensa:20
  },

  3:{
    tamanho:3,
    recompensa:20
  }

};


const CORES = [

  "red",
  "blue",
  "green",
  "yellow",
  "purple",
  "orange"

];


/* =====================================================
   ESTADO
===================================================== */

let usuario = null;

let usuarioDocId = null;

let nivel = 1;

let senha = [];

let tentativaAtual = [];

let tentativas = [];

let jogoIniciado = false;

let bloqueado = false;

let recompensaInicioAplicada = false;


/* =====================================================
   LOCALIZAR USUÁRIO
===================================================== */

async function localizarUsuario(user){

  try{

    let resultado =
      await getDocs(

        query(
          collection(
            db,
            "admins"
          ),

          where(
            "uid",
            "==",
            user.uid
          )

        )

      );


    if(
      resultado.empty &&
      user.email
    ){

      resultado =
        await getDocs(

          query(
            collection(
              db,
              "admins"
            ),

            where(
              "email",
              "==",
              user.email.toLowerCase()
            )

          )

        );

    }


    if(
      resultado.empty
    ){

      throw new Error(
        "Cadastro não encontrado na coleção admins."
      );

    }


    const documento =
      resultado.docs[0];


    usuarioDocId =
      documento.id;


    return documento.data();

  }

  catch(error){

    console.error(
      "ERRO AO LOCALIZAR USUÁRIO:",
      error
    );

    throw error;

  }

}


/* =====================================================
   ATUALIZAR SALDOS NA TELA
===================================================== */

function atualizarSaldos(){

  if(!usuario){

    moedasEl.textContent =
      "—";

    chancesEl.textContent =
      "—";

    return;

  }


  moedasEl.textContent =
    Number(
      usuario.moedas || 0
    ).toLocaleString(
      "pt-BR"
    );


  chancesEl.textContent =
    Number(
      usuario.chances || 0
    ).toLocaleString(
      "pt-BR"
    );

}


/* =====================================================
   ATUALIZAR NÍVEL
===================================================== */

function atualizarNivelTela(){

  nivelEl.textContent =
    nivel + " / 3";


  levelTitleEl.textContent =
    "NÍVEL " +
    nivel +
    " — DESCUBRA A SENHA";


  const tamanho =
    NIVEL_CONFIG[nivel].tamanho;


  instructionEl.textContent =
    "Descubra a sequência de " +
    tamanho +
    " cores.";


  progressBar.style.width =
    (
      (nivel / 3) *
      100
    ) +
    "%";

}


/* =====================================================
   GERAR SENHA
===================================================== */

function gerarSenha(){

  senha = [];


  const tamanho =
    NIVEL_CONFIG[nivel].tamanho;


  for(
    let i = 0;
    i < tamanho;
    i++
  ){

    const indice =
      Math.floor(
        Math.random() *
        CORES.length
      );


    senha.push(
      CORES[indice]
    );

  }


  /*
     IMPORTANTE:

     A senha fica somente
     na variável JavaScript.

     Ela NÃO é colocada
     no HTML.

     Portanto o jogador
     não consegue vê-la
     na tela.
  */

  console.log(
    "Senha gerada internamente:",
    senha
  );

}


/* =====================================================
   MOSTRAR TENTATIVA ATUAL
===================================================== */

function renderizarTentativa(){

  currentGuessEl.innerHTML =
    "";


  const tamanho =
    NIVEL_CONFIG[nivel].tamanho;


  for(
    let i = 0;
    i < tamanho;
    i++
  ){

    const ball =
      document.createElement(
        "div"
      );


    if(
      tentativaAtual[i]
    ){

      ball.className =
        "current-ball color-" +
        tentativaAtual[i];

    }

    else{

      ball.className =
        "current-empty";

    }


    currentGuessEl.appendChild(
      ball
    );

  }

}


/* =====================================================
   CRIAR HISTÓRICO
===================================================== */

function renderizarHistorico(){

  rowsEl.innerHTML =
    "";


  for(
    let i = 0;
    i < MAX_TENTATIVAS;
    i++
  ){

    const row =
      document.createElement(
        "div"
      );


    row.className =
      "row";


    const numero =
      document.createElement(
        "div"
      );


    numero.className =
      "row-number";


    numero.textContent =
      i + 1;


    const guess =
      document.createElement(
        "div"
      );


    guess.className =
      "guess";


    const feedback =
      document.createElement(
        "div"
      );


    feedback.className =
      "feedback";


    if(
      tentativas[i]
    ){

      const tentativa =
        tentativas[i];


      tentativa.forEach(
        cor => {

          const bola =
            document.createElement(
              "span"
            );


          bola.className =
            "small-color color-" +
            cor;


          guess.appendChild(
            bola
          );

        }
      );


      /*
         Preenche espaços
         restantes.
      */

      for(
        let j =
          tentativa.length;

        j <
        NIVEL_CONFIG[nivel].tamanho;

        j++
      ){

        const vazio =
          document.createElement(
            "span"
          );


        vazio.className =
          "empty-color";


        guess.appendChild(
          vazio
        );

      }


      const resultado =
        avaliarTentativa(
          tentativa,
          senha
        );


      /*
         PRETAS:

         cor correta
         no lugar correto
      */

      for(
        let j = 0;
        j < resultado.pretas;
        j++
      ){

        const dot =
          document.createElement(
            "span"
          );


        dot.className =
          "feedback-dot feedback-black";


        feedback.appendChild(
          dot
        );

      }


      /*
         BRANCAS:

         cor correta
         no lugar errado
      */

      for(
        let j = 0;
        j < resultado.brancas;
        j++
      ){

        const dot =
          document.createElement(
            "span"
          );


        dot.className =
          "feedback-dot feedback-white";


        feedback.appendChild(
          dot
        );

      }

    }

    else{

      const tamanho =
        NIVEL_CONFIG[nivel].tamanho;


      for(
        let j = 0;
        j < tamanho;
        j++
      ){

        const vazio =
          document.createElement(
            "span"
          );


        vazio.className =
          "empty-color";


        guess.appendChild(
          vazio
        );

      }

    }


    row.appendChild(
      numero
    );


    row.appendChild(
      guess
    );


    row.appendChild(
      feedback
    );


    rowsEl.appendChild(
      row
    );

  }


  attemptCounterEl.textContent =
    tentativas.length +
    " / " +
    MAX_TENTATIVAS;

}


/* =====================================================
   AVALIAR TENTATIVA
===================================================== */

function avaliarTentativa(
  tentativa,
  resposta
){

  let pretas = 0;

  let brancas = 0;


  const usadosResposta =
    new Array(
      resposta.length
    ).fill(false);


  const usadosTentativa =
    new Array(
      tentativa.length
    ).fill(false);


  /*
     PRIMEIRO:

     verifica posição
     exata.
  */

  for(
    let i = 0;
    i < resposta.length;
    i++
  ){

    if(
      tentativa[i] ===
      resposta[i]
    ){

      pretas++;

      usadosResposta[i] =
        true;

      usadosTentativa[i] =
        true;

    }

  }


  /*
     SEGUNDO:

     verifica cores
     certas em posições
     diferentes.
  */

  for(
    let i = 0;
    i < tentativa.length;
    i++
  ){

    if(
      usadosTentativa[i]
    ){

      continue;

    }


    for(
      let j = 0;
      j < resposta.length;
      j++
    ){

      if(
        usadosResposta[j]
      ){

        continue;

      }


      if(
        tentativa[i] ===
        resposta[j]
      ){

        brancas++;

        usadosResposta[j] =
          true;

        usadosTentativa[i] =
          true;

        break;

      }

    }

  }


  return {
    pretas,
    brancas
  };

}


/* =====================================================
   CLICAR EM COR
===================================================== */

function selecionarCor(cor){

  if(
    bloqueado ||
    !jogoIniciado
  ){

    return;

  }


  const tamanho =
    NIVEL_CONFIG[nivel].tamanho;


  if(
    tentativaAtual.length >=
    tamanho
  ){

    mostrarMensagem(
      "Você já escolheu todas as cores.",
      "info"
    );

    return;

  }


  tentativaAtual.push(
    cor
  );


  renderizarTentativa();


  mostrarMensagem(
    tentativaAtual.length +
    "/" +
    tamanho +
    " cores escolhidas.",
    "info"
  );

}


/* =====================================================
   LIMPAR
===================================================== */

function limparTentativa(){

  if(
    bloqueado ||
    !jogoIniciado
  ){

    return;

  }


  tentativaAtual = [];


  renderizarTentativa();


  mostrarMensagem(
    "Escolha as cores da sua tentativa.",
    "info"
  );

}


/* =====================================================
   CONFIRMAR
===================================================== */

async function confirmar(){

  if(
    bloqueado ||
    !jogoIniciado
  ){

    return;

  }


  const tamanho =
    NIVEL_CONFIG[nivel].tamanho;


  if(
    tentativaAtual.length !==
    tamanho
  ){

    mostrarMensagem(
      "Escolha " +
      tamanho +
      " cores antes de confirmar.",
      "error"
    );

    return;

  }


  bloqueado =
    true;


  confirmButton.disabled =
    true;


  clearButton.disabled =
    true;


  /*
     Guarda a tentativa.
  */

  tentativas.push(
    [...tentativaAtual]
  );


  const resultado =
    avaliarTentativa(
      tentativaAtual,
      senha
    );


  renderizarHistorico();


  /*
     SENHA CORRETA
  */

  if(
    resultado.pretas ===
    tamanho
  ){

    await vencerNivel();

    return;

  }


  /*
     ERRO
  */

  mostrarMensagem(
    "Tentativa " +
    tentativas.length +
    "/10. " +
    resultado.pretas +
    " certa(s) no lugar + " +
    resultado.brancas +
    " certa(s) no lugar errado.",
    "error"
  );


  tentativaAtual = [];


  renderizarTentativa();


  /*
     ACABARAM AS TENTATIVAS
  */

  if(
    tentativas.length >=
    MAX_TENTATIVAS
  ){

    perderNivel();

    return;

  }


  bloqueado =
    false;


  confirmButton.disabled =
    false;


  clearButton.disabled =
    false;

}


/* =====================================================
   VENCER NÍVEL
===================================================== */

async function vencerNivel(){

  bloqueado =
    true;


  const recompensa =
    NIVEL_CONFIG[nivel].recompensa;


  try{

    /*
       Adiciona a recompensa
       ao usuário.

       Não descontamos chance
       novamente aqui.
    */

    if(
      usuarioDocId
    ){

      await updateDoc(

        doc(
          db,
          "admins",
          usuarioDocId
        ),

        {

          moedas:
            increment(
              recompensa
            )

        }

      );


      usuario.moedas =
        Number(
          usuario.moedas || 0
        ) +
        recompensa;


      atualizarSaldos();

    }


    if(
      nivel >= 3
    ){

      mostrarModal(
        "🎉 PARABÉNS!",
        "Você completou os 3 primeiros níveis da Senha! +" +
        recompensa +
        " Adam Coins.",
        "VOLTAR AOS JOGOS"
      );


      return;

    }


    mostrarModal(
      "🎉 SENHA CORRETA!",
      "Você acertou a senha e ganhou +" +
      recompensa +
      " Adam Coins.",
      "PRÓXIMO NÍVEL"
    );


    modalButton.onclick =
      () => {

        modal.classList.remove(
          "show"
        );

        nivel++;

        iniciarNivel();

      };

  }

  catch(error){

    console.error(
      "ERRO AO PAGAR RECOMPENSA:",
      error
    );


    mostrarErroFirebase(
      error,
      "Você acertou a senha, mas houve um erro ao registrar a recompensa."
    );

  }

}


/* =====================================================
   PERDEU
===================================================== */

function perderNivel(){

  bloqueado =
    true;


  mostrarModal(
    "💔 FIM DAS TENTATIVAS",
    "Você não descobriu a senha desta fase.",
    "TENTAR NOVAMENTE"
  );


  modalButton.onclick =
    () => {

      modal.classList.remove(
        "show"
      );

      iniciarNivel();

    };

}


/* =====================================================
   INICIAR NÍVEL
===================================================== */

function iniciarNivel(){

  tentativaAtual =
    [];

  tentativas =
    [];

  bloqueado =
    true;


  atualizarNivelTela();


  renderizarTentativa();


  renderizarHistorico();


  gerarSenha();


  /*
     Pequeno intervalo
     para preparar o jogo.

     A senha NÃO é mostrada.
  */

  setTimeout(
    () => {

      jogoIniciado =
        true;

      bloqueado =
        false;


      confirmButton.disabled =
        false;

      clearButton.disabled =
        false;


      mostrarMensagem(
        "Escolha as cores da sua tentativa.",
        "info"
      );

    },
    400
  );

}


/* =====================================================
   APLICAR CUSTO INICIAL
===================================================== */

async function aplicarInicio(){

  if(
    recompensaInicioAplicada
  ){

    return;

  }


  if(
    !usuarioDocId
  ){

    throw new Error(
      "ID do cadastro não localizado."
    );

  }


  const chances =
    Number(
      usuario.chances || 0
    );


  if(
    chances <= 0
  ){

    throw new Error(
      "Você não possui chances disponíveis."
    );

  }


  /*
     Ao iniciar:

     -1 chance
     +30 moedas
  */

  await updateDoc(

    doc(
      db,
      "admins",
      usuarioDocId
    ),

    {

      chances:
        increment(-1),

      moedas:
        increment(30)

    }

  );


  usuario.chances =
    chances - 1;


  usuario.moedas =
    Number(
      usuario.moedas || 0
    ) +
    30;


  recompensaInicioAplicada =
    true;


  atualizarSaldos();

}


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
  texto,
  tipo
){

  messageEl.textContent =
    texto;


  messageEl.className =
    "message " +
    tipo;

}


/* =====================================================
   ERRO FIREBASE
===================================================== */

function mostrarErroFirebase(
  error,
  prefixo
){

  console.error(
    "================================="
  );

  console.error(
    "ERRO FIREBASE DO JOGO SENHA"
  );

  console.error(
    "code:",
    error?.code
  );

  console.error(
    "message:",
    error?.message
  );

  console.error(
    "error:",
    error
  );

  console.error(
    "================================="
  );


  const codigo =
    error?.code ||
    "sem-codigo";


  const mensagem =
    error?.message ||
    "Erro desconhecido";


  messageEl.textContent =
    prefixo +
    " [" +
    codigo +
    "] " +
    mensagem;


  messageEl.className =
    "message error";


  /*
     IMPORTANTE:

     Não esconder o erro.

     Assim conseguimos descobrir
     exatamente por que a conta
     da sua amiga está falhando.
  */

}


/* =====================================================
   MODAL
===================================================== */

function mostrarModal(
  titulo,
  texto,
  botao
){

  modalTitle.textContent =
    titulo;


  modalText.textContent =
    texto;


  modalButton.textContent =
    botao;


  modal.classList.add(
    "show"
  );

}


/* =====================================================
   EVENTOS DAS CORES
===================================================== */

document
  .querySelectorAll(
    ".color-button"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          const cor =
            button.dataset.color;


          selecionarCor(
            cor
          );

        }
      );

    }
  );


/* =====================================================
   LIMPAR
===================================================== */

clearButton.addEventListener(
  "click",
  limparTentativa
);


/* =====================================================
   CONFIRMAR
===================================================== */

confirmButton.addEventListener(
  "click",
  confirmar
);


/* =====================================================
   MODAL
===================================================== */

modalButton.addEventListener(
  "click",
  () => {

    modal.classList.remove(
      "show"
    );

  }
);


/* =====================================================
   VOLTAR
===================================================== */

document
  .getElementById("back")
  .addEventListener(
    "click",
    () => {

      window.location.href =
        "jogos.html";

    }
  );


/* =====================================================
   FIREBASE — LOGIN
===================================================== */

onAuthStateChanged(
  auth,

  async user => {

    try{

      if(!user){

        window.location.replace(
          "index.html"
        );

        return;

      }


      mostrarMensagem(
        "Carregando seu cadastro...",
        "info"
      );


      /*
         Localiza o documento
         do jogador.
      */

      usuario =
        await localizarUsuario(
          user
        );


      atualizarSaldos();


      /*
         Primeiro desconta
         a chance e dá +30.
      */

      await aplicarInicio();


      /*
         Depois inicia o nível.
      */

      iniciarNivel();

    }

    catch(error){

      console.error(
        "================================="
      );

      console.error(
        "ERRO AO CARREGAR O JOGO"
      );

      console.error(
        "code:",
        error?.code
      );

      console.error(
        "message:",
        error?.message
      );

      console.error(
        "stack:",
        error?.stack
      );

      console.error(
        error
      );

      console.error(
        "================================="
      );


      /*
         Aqui NÃO vamos mais mostrar
         apenas "Erro ao carregar".

         O código real aparecerá
         na tela.

         Isso vai permitir descobrir
         o problema da conta da sua
         amiga.
      */

      mostrarErroFirebase(
        error,
        "Erro ao carregar o jogo."
      );


      jogoIniciado =
        false;


      bloqueado =
        true;


      confirmButton.disabled =
        true;


      clearButton.disabled =
        true;

    }

  );


</script>
