<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Adam Games • Senha</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#061b2d}
body{
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 15% 0%,rgba(46,183,255,.24),transparent 30%),
    radial-gradient(circle at 85% 10%,rgba(118,55,255,.20),transparent 28%),
    linear-gradient(180deg,#073a4a 0%,#06263d 50%,#031b2d 100%);
}
button{font:inherit;-webkit-tap-highlight-color:transparent}
.page{width:100%;max-width:700px;margin:auto;padding:14px 10px 80px}
.top{display:flex;align-items:center;justify-content:space-between}
.back{
 width:44px;height:44px;border:0;border-radius:14px;
 background:linear-gradient(145deg,#0c6fa5,#07436e);
 color:#fff;font-size:25px;cursor:pointer
}
.title{text-align:center;text-shadow:0 2px 6px #000}
.title small{display:block;font-size:10px;letter-spacing:2px;color:#bcecff}
.title strong{font-size:21px}
.spacer{width:44px}

.card{
 margin-top:12px;padding:12px;border-radius:22px;
 background:rgba(3,29,48,.84);border:1px solid #ffffff18;
 box-shadow:0 14px 35px #0006
}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{padding:9px 5px;border-radius:13px;background:#0000002b;text-align:center}
.stat small{font-size:9px;font-weight:900;color:#a9d7eb}
.stat b{display:block;margin-top:3px;font-size:19px}
.coins{color:#ffd52b}.chances{color:#ff6670}.level{color:#72d7ff}
.progress{height:8px;background:#17394e;border-radius:20px;overflow:hidden;margin-top:10px}
.progress div{height:100%;width:11%;background:linear-gradient(90deg,#28d56c,#ffd52b)}

.info{text-align:center;padding:12px 6px 5px}
.info h1{font-size:20px}
.info p{margin-top:5px;color:#b9d7e8;font-size:12px}

.game-area{
 margin-top:8px;padding:10px;border-radius:18px;
 background:
   linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.18)),
   url("./fundo_nivel_01_03.png") center/cover no-repeat;
}

.board{
 position:relative;width:100%;max-width:430px;margin:auto;
 aspect-ratio:1024/1536;
 background:url("./C0A67B9D-67BE-49A6-8747-B5B2A32411C4.png") center/100% 100% no-repeat;
}
.rows{
 position:absolute;left:9.5%;right:9.5%;top:15%;bottom:15%;
 display:grid;grid-template-rows:repeat(10,1fr)
}
.row{display:flex;align-items:center}
.row-number{width:9%}
.guess-slots{
 width:60%;display:flex;gap:2.5%;padding-left:1%;align-items:center
}
.guess-slot{
 width:15.2%;aspect-ratio:1;border-radius:50%;
 display:flex;align-items:center;justify-content:center
}
.guess-slot .circle{width:100%;height:100%;font-size:clamp(20px,7vw,34px);line-height:1}

.feedback{
 width:31%;display:grid;grid-template-columns:repeat(5,1fr);
 gap:4%;padding:0 4%;align-items:center
}
.feedback-dot{
 width:100%;aspect-ratio:1;border-radius:50%;
 display:flex;align-items:center;justify-content:center;
 font-size:clamp(9px,2.5vw,14px)
}

.palette{
 margin:12px auto 0;max-width:430px;
 display:grid;grid-template-columns:repeat(6,1fr);gap:7px;
 padding:10px;border-radius:18px;
 background:rgba(35,18,8,.82);
 border:2px solid #9b6a32
}
.color-btn{
 appearance:none;-webkit-appearance:none;
 border:0;border-radius:14px;
 background:rgba(255,255,255,.08);
 min-height:58px;
 display:flex;align-items:center;justify-content:center;
 cursor:pointer;
 touch-action:manipulation;
 user-select:none;
 box-shadow:inset 0 1px 0 #fff2,0 3px 7px #0006;
}
.color-btn:active{transform:scale(.9)}
.color-btn.selected{background:rgba(255,255,255,.22);box-shadow:0 0 0 3px #fff8,0 4px 10px #0008}
.emoji{
 font-size:clamp(28px,8vw,42px);
 line-height:1;
 pointer-events:none;
}

.selected-preview{
 min-height:48px;margin-top:8px;display:flex;
 justify-content:center;align-items:center;gap:6px
}
.preview-dot{font-size:32px;line-height:1}

.controls{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.control{
 height:48px;border:0;border-radius:14px;color:#fff;
 font-weight:900;cursor:pointer;touch-action:manipulation
}
.clear{background:linear-gradient(145deg,#315878,#183b57)}
.confirm{background:linear-gradient(145deg,#28d86d,#08783e)}
.control:disabled{opacity:.45}

.message{text-align:center;min-height:22px;margin-top:7px;color:#bfe3f2;font-size:12px;font-weight:800}

.modal{
 position:fixed;inset:0;z-index:100;display:none;
 align-items:center;justify-content:center;padding:18px;
 background:#00101dcc;backdrop-filter:blur(6px)
}
.modal.show{display:flex}
.modal-card{
 width:min(100%,390px);padding:22px 18px;border-radius:22px;
 text-align:center;background:linear-gradient(145deg,#0b3a52,#241044)
}
.modal-card h2{font-size:22px}
.modal-card p{margin-top:9px;color:#c3ddeb;font-size:14px;line-height:1.5}
.modal-buttons{display:grid;gap:9px;margin-top:17px}
.modal-buttons button{
 height:46px;border:0;border-radius:13px;color:#fff;font-weight:900;cursor:pointer
}
.primary{background:#19ae60}.secondary{background:#ffffff17}

@media(max-width:430px){
 .page{padding-left:6px;padding-right:6px}
 .card{padding:8px}
}
</style>
</head>

<body>

<div class="page">

<div class="top">
  <button class="back" id="back" type="button">←</button>
  <div class="title"><small>ADAM GAMES</small><strong>SENHA</strong></div>
  <div class="spacer"></div>
</div>

<div class="card">

<div class="stats">
  <div class="stat"><small>ADAM COINS</small><b class="coins" id="coins">30</b></div>
  <div class="stat"><small>CHANCES</small><b class="chances" id="chances">—</b></div>
  <div class="stat level"><small>FASE</small><b id="level">1 / 3</b></div>
</div>

<div class="progress"><div id="progress"></div></div>

<div class="info">
  <h1 id="phaseTitle">NÍVEL 1 — DESCUBRA A SENHA</h1>
  <p id="phaseText">Memorize as 3 cores. Depois reproduza a sequência.</p>
</div>

<div class="selected-preview" id="preview"></div>

<div class="game-area">
  <div class="board">
    <div class="rows" id="rows"></div>
  </div>

  <div class="palette" id="palette">
    <button class="color-btn" data-color="vermelho" type="button"><span class="emoji">🔴</span></button>
    <button class="color-btn" data-color="azul" type="button"><span class="emoji">🔵</span></button>
    <button class="color-btn" data-color="verde" type="button"><span class="emoji">🟢</span></button>
    <button class="color-btn" data-color="amarelo" type="button"><span class="emoji">🟡</span></button>
    <button class="color-btn" data-color="roxo" type="button"><span class="emoji">🟣</span></button>
    <button class="color-btn" data-color="laranja" type="button"><span class="emoji">🟠</span></button>
  </div>
</div>

<div class="controls">
  <button class="control clear" id="clearBtn" type="button">LIMPAR</button>
  <button class="control confirm" id="confirmBtn" type="button">CONFIRMAR</button>
</div>

<div class="message" id="message"></div>

</div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <div class="modal-buttons" id="modalButtons"></div>
  </div>
</div>

<script>
/*
  VERSÃO DE TESTE:
  os botões usam círculos/emoji, sem PNG nas cores.
  Isso elimina qualquer problema dos assets coloridos.
*/

const COLORS = ["vermelho","azul","verde","amarelo","roxo","laranja"];

const EMOJI = {
  vermelho:"🔴",
  azul:"🔵",
  verde:"🟢",
  amarelo:"🟡",
  roxo:"🟣",
  laranja:"🟠"
};

const LEVELS = {
  1:{length:3,reward:20},
  2:{length:3,reward:20},
  3:{length:3,reward:20}
};

const MAX_ATTEMPTS = 10;

let level = 1;
let secret = [];
let current = [];
let attempt = 0;
let busy = true;
let coins = 30;

const $ = id => document.getElementById(id);

function randomSecret(length){
  const pool = [...COLORS];
  const result = [];

  while(result.length < length){
    const index = Math.floor(Math.random()*pool.length);
    result.push(pool.splice(index,1)[0]);
  }

  return result;
}

function renderPreview(){
  const preview = $("preview");
  preview.innerHTML = "";

  current.forEach(color=>{
    const span = document.createElement("span");
    span.className = "preview-dot";
    span.textContent = EMOJI[color];
    preview.appendChild(span);
  });
}

function makeRows(){
  const rows = $("rows");
  rows.innerHTML = "";

  for(let r=0;r<MAX_ATTEMPTS;r++){
    const row = document.createElement("div");
    row.className = "row";
    row.dataset.row = r;

    const number = document.createElement("div");
    number.className = "row-number";
    number.textContent = r+1;

    const slots = document.createElement("div");
    slots.className = "guess-slots";

    for(let i=0;i<3;i++){
      const slot = document.createElement("div");
      slot.className = "guess-slot";
      slot.dataset.slot = i;
      slots.appendChild(slot);
    }

    const feedback = document.createElement("div");
    feedback.className = "feedback";

    for(let i=0;i<5;i++){
      const dot = document.createElement("div");
      dot.className = "feedback-dot";
      feedback.appendChild(dot);
    }

    row.append(number,slots,feedback);
    rows.appendChild(row);
  }
}

function renderCurrentRow(){
  const row = document.querySelector(`.row[data-row="${attempt}"]`);
  if(!row) return;

  row.querySelectorAll(".guess-slot").forEach((slot,i)=>{
    slot.innerHTML = "";

    if(current[i]){
      const span = document.createElement("span");
      span.className = "circle";
      span.textContent = EMOJI[current[i]];
      slot.appendChild(span);
    }
  });
}

function calculateResult(guess,answer){
  let exact = 0;
  let misplaced = 0;

  for(let i=0;i<answer.length;i++){
    if(guess[i] === answer[i]) exact++;
  }

  for(let i=0;i<guess.length;i++){
    if(guess[i] !== answer[i] && answer.includes(guess[i])){
      misplaced++;
    }
  }

  return {exact,misplaced};
}

function paintResult(result){
  const row = document.querySelector(`.row[data-row="${attempt}"]`);
  if(!row) return;

  const dots = [...row.querySelectorAll(".feedback-dot")];

  for(let i=0;i<result.exact;i++){
    dots[i].textContent = "⚫";
  }

  for(let i=0;i<result.misplaced;i++){
    dots[result.exact+i].textContent = "⚪";
  }
}

function startLevel(){
  const config = LEVELS[level];

  secret = randomSecret(config.length);
  current = [];
  attempt = 0;
  busy = true;

  $("level").textContent = `${level} / 3`;
  $("phaseTitle").textContent = `NÍVEL ${level} — DESCUBRA A SENHA`;
  $("phaseText").textContent = "Memorize as 3 cores. Depois reproduza a sequência.";
  $("message").textContent = "MEMORIZE A SENHA...";
  $("progress").style.width = `${(level/3)*100}%`;

  makeRows();
  renderPreview();

  const firstRow = document.querySelector('.row[data-row="0"]');

  secret.forEach((color,i)=>{
    const span = document.createElement("span");
    span.className = "circle";
    span.textContent = EMOJI[color];
    firstRow.querySelectorAll(".guess-slot")[i].appendChild(span);
  });

  setTimeout(()=>{
    firstRow.querySelectorAll(".guess-slot").forEach(slot=>{
      slot.innerHTML = "";
    });

    busy = false;
    current = [];
    renderPreview();
    $("message").textContent = "Sua vez! Escolha 3 cores.";
  },2500);
}

function chooseColor(color){
  if(busy) return;

  if(current.length >= 3){
    $("message").textContent = "Você já escolheu 3 cores.";
    return;
  }

  current.push(color);
  renderPreview();
  renderCurrentRow();

  $("message").textContent =
    `${current.length}/3 cores escolhidas.`;
}

function clearCurrent(){
  if(busy) return;

  current = [];
  renderPreview();
  renderCurrentRow();

  $("message").textContent = "Escolha novamente as 3 cores.";
}

function confirmGuess(){
  if(busy) return;

  if(current.length !== 3){
    $("message").textContent = "Escolha exatamente 3 cores.";
    return;
  }

  const result = calculateResult(current,secret);
  paintResult(result);

  if(result.exact === 3){
    coins += LEVELS[level].reward;
    $("coins").textContent = coins;

    busy = true;

    if(level < 3){
      showModal(
        `NÍVEL ${level} CONCLUÍDO!`,
        `Você acertou a senha!<br><br><b>+${LEVELS[level].reward} Adam Coins</b>`,
        [{
          text:"PRÓXIMO NÍVEL",
          cls:"primary",
          fn:()=>{
            closeModal();
            level++;
            startLevel();
          }
        }]
      );
    }else{
      showModal(
        "PARABÉNS!",
        `Você concluiu os 3 níveis de teste!<br><br><b>Total ganho nesta partida: ${coins} Adam Coins</b>`,
        [{
          text:"JOGAR NOVAMENTE",
          cls:"primary",
          fn:()=>{
            closeModal();
            level=1;
            coins=30;
            $("coins").textContent=coins;
            startLevel();
          }
        }]
      );
    }

    return;
  }

  attempt++;

  if(attempt >= MAX_ATTEMPTS){
    busy = true;

    showModal(
      "FIM DE JOGO",
      `A senha era:<br><br><b>${secret.map(c=>EMOJI[c]).join(" ")}</b>`,
      [{
        text:"TENTAR NOVAMENTE",
        cls:"primary",
        fn:()=>{
          closeModal();
          startLevel();
        }
      }]
    );

    return;
  }

  current = [];
  renderPreview();
  attempt = Math.min(attempt,MAX_ATTEMPTS-1);
  renderCurrentRow();

  $("message").textContent =
    `Tentativa ${attempt+1} de ${MAX_ATTEMPTS}.`;
}

function showModal(title,text,buttons){
  $("modalTitle").textContent = title;
  $("modalText").innerHTML = text;
  $("modalButtons").innerHTML = "";

  buttons.forEach(item=>{
    const button = document.createElement("button");
    button.type = "button";
    button.className = item.cls || "secondary";
    button.textContent = item.text;
    button.addEventListener("click",item.fn);
    $("modalButtons").appendChild(button);
  });

  $("modal").classList.add("show");
}

function closeModal(){
  $("modal").classList.remove("show");
}

/* Os próprios BUTTONS recebem o clique. */
document.querySelectorAll(".color-btn").forEach(button=>{
  button.addEventListener("click",()=>{
    chooseColor(button.dataset.color);
  });
});

$("clearBtn").addEventListener("click",clearCurrent);
$("confirmBtn").addEventListener("click",confirmGuess);

$("back").addEventListener("click",()=>{
  window.location.href = "jogos.html";
});

/*
  Começa o teste imediatamente.
  Não depende de Firebase, autenticação ou banco.
*/
startLevel();
</script>

</body>
</html>
