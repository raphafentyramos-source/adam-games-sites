<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Adam Games • Senha</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#031c2e}
body{
  font-family:Arial,Helvetica,sans-serif;color:#fff;
  background:
    radial-gradient(circle at 15% 0%,rgba(37,166,235,.20),transparent 28%),
    radial-gradient(circle at 85% 10%,rgba(80,45,170,.16),transparent 28%),
    linear-gradient(180deg,#084763 0%,#06334b 45%,#031c2e 100%);
}
button,input{font:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.page{width:100%;max-width:760px;margin:auto;padding:12px 14px 80px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.back{
  width:44px;height:44px;border:0;border-radius:14px;
  background:linear-gradient(145deg,#0c78ad,#06456c);
  color:#fff;font-size:25px;box-shadow:0 5px 12px #0006;cursor:pointer
}
.title{text-align:center;text-shadow:0 2px 6px #000}
.title small{display:block;font-size:10px;letter-spacing:2px;color:#bcecff}
.title strong{font-size:21px}
.spacer{width:44px}

.card{
  padding:13px;border-radius:24px;
  background:rgba(2,29,46,.80);
  border:1px solid #ffffff16;
  box-shadow:0 14px 35px #0007;
  backdrop-filter:blur(6px)
}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.stat{padding:11px 6px;border-radius:16px;background:#001a2bd9;text-align:center}
.stat small{font-size:10px;font-weight:900;color:#a8d5e8;letter-spacing:.5px}
.stat b{display:block;margin-top:3px;font-size:21px}
.coins{color:#ffd42a}.chances{color:#55ef91}.level{color:#66cfff}
.progress{height:8px;background:#214b60;border-radius:20px;overflow:hidden;margin-top:10px}
.progress div{height:100%;width:0;background:linear-gradient(90deg,#28dc72,#ffd52b);transition:.3s}

.info{text-align:center;padding:15px 4px 10px}
.info h1{font-size:25px;line-height:1.1;text-shadow:0 3px 7px #000}
.info p{margin-top:7px;color:#c2dce8;font-size:15px;line-height:1.4}

.hearts{
  display:flex;justify-content:center;align-items:center;gap:7px;
  min-height:32px;margin:2px 0 9px
}
.heart{font-size:25px;filter:drop-shadow(0 2px 3px #0008)}
.heart.off{filter:grayscale(1);opacity:.28}
.heart-label{font-size:11px;font-weight:900;color:#ff8b9a;margin-left:4px}

.panel{
  margin-top:9px;padding:14px;border-radius:24px;
  background:rgba(0,27,41,.78);
  border:2px solid #8f6b16;
  box-shadow:0 8px 22px #0005
}
.panel-title{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;color:#ffd52b;font-weight:900;font-size:17px;
  letter-spacing:.5px;margin-bottom:11px
}
.panel-title .count{color:#fff;font-size:17px}

.legend{
  display:flex;align-items:center;justify-content:center;gap:13px;flex-wrap:wrap;
  padding:9px 8px;border-radius:16px;background:#00131fe8;
  color:#dceaf0;font-size:12px;font-weight:800
}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:19px;height:19px;border-radius:50%;border:2px dashed #77838a;background:transparent}
.legend-dot.black{border:2px solid #101010;background:#050505;box-shadow:inset 0 0 3px #777}
.legend-dot.white{border:2px solid #eee;background:#fff;box-shadow:inset 0 0 3px #999}

.history{
  display:grid;gap:8px;max-height:900px;overflow-y:auto;overflow-x:hidden
}
.history-row{
  min-height:61px;border-radius:16px;background:linear-gradient(90deg,#183a4b,#123448);
  border:1px solid #ffffff12;display:flex;align-items:center;padding:8px 10px;gap:10px
}
.history-number{width:28px;text-align:center;font-size:16px;font-weight:900}
.history-slots{display:flex;gap:8px;align-items:center;flex:1}
.h-slot{
  width:38px;height:38px;border-radius:50%;border:3px dashed #677982;
  background:transparent;display:flex;align-items:center;justify-content:center;overflow:hidden
}
.h-slot img{width:100%;height:100%;object-fit:contain}
.feedback{
  display:flex;gap:5px;align-items:center;justify-content:flex-end;
  min-width:70px
}
.feedback-dot{
  width:15px;height:15px;border-radius:50%;
  border:2px dashed #66757c;background:transparent
}
.feedback-dot.black{border:2px solid #111;background:#080808}
.feedback-dot.white{border:2px solid #f2f2f2;background:#fff}

.current-title{
  display:flex;justify-content:center;align-items:center;
  color:#ffd52b;font-weight:900;font-size:17px;letter-spacing:.7px
}
.current{
  min-height:74px;display:flex;justify-content:center;align-items:center;gap:12px;
  padding:9px 4px 4px
}
.current-slot{
  width:48px;height:48px;border-radius:50%;
  border:3px dashed #6c7b82;background:transparent;
  display:flex;align-items:center;justify-content:center;overflow:hidden
}
.current-slot img{width:100%;height:100%;object-fit:contain}

.palette{
  margin-top:12px;padding:9px;border-radius:18px;
  background:#090b10;border:3px solid #a6751c;
  display:grid;grid-template-columns:repeat(6,1fr);gap:7px
}
.color-btn{
  min-width:0;height:64px;border:0;border-radius:13px;background:#15161a;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:inset 0 0 0 1px #ffffff0c
}
.color-btn img{width:51px;height:51px;object-fit:contain;filter:drop-shadow(0 3px 3px #0008)}
.color-btn:active img{transform:scale(.88)}
.color-btn.selected{outline:2px solid #ffd52b;box-shadow:0 0 10px #ffd52b66}

.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.control{
  height:55px;border:0;border-radius:17px;color:#fff;font-weight:900;
  cursor:pointer;box-shadow:0 6px 12px #0005
}
.clear{background:linear-gradient(145deg,#356b9c,#1e517f)}
.confirm{background:linear-gradient(145deg,#27df73,#06a54d)}
.control:disabled{opacity:.45;cursor:not-allowed}
.skip{
  width:100%;height:44px;margin-top:9px;
  background:linear-gradient(145deg,#7655a8,#51347c);
  font-size:13px
}
.message{text-align:center;min-height:24px;margin-top:9px;color:#d5e8ef;font-size:13px;font-weight:900}
.message.ok{color:#58f39a}.message.bad{color:#ff8790}

.modal{
  position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  padding:18px;background:#00101dcc;backdrop-filter:blur(7px)
}
.modal.show{display:flex}
.modal-card{
  width:min(100%,410px);padding:23px 18px;border-radius:23px;text-align:center;
  background:linear-gradient(145deg,#0b4057,#251044);
  border:1px solid #ffffff1c;box-shadow:0 20px 50px #0009
}
.modal-card .icon{font-size:42px;margin-bottom:5px}
.modal-card h2{font-size:23px}
.modal-card p{margin-top:10px;color:#c9dfe9;font-size:14px;line-height:1.5}
.modal-buttons{display:grid;gap:9px;margin-top:17px}
.modal-buttons button{
  height:47px;border:0;border-radius:14px;color:#fff;font-weight:900;cursor:pointer
}
.primary{background:#18ae60}.secondary{background:#ffffff18}
.gold{color:#ffd52b}

@media(max-width:520px){
  .page{padding-left:9px;padding-right:9px}
  .card{padding:10px}
  .info h1{font-size:22px}
  .info p{font-size:14px}
  .history-row{min-height:56px;padding:7px 8px}
  .h-slot{width:34px;height:34px}
  .history-slots{gap:6px}
  .feedback{min-width:62px}
  .feedback-dot{width:14px;height:14px}
  .current-slot{width:43px;height:43px}
  .palette{gap:5px}
  .color-btn{height:58px}
  .color-btn img{width:46px;height:46px}
}
</style>

<style id="feedback-fix">
.history-row{
  display:grid !important;
  grid-template-columns:32px minmax(0,1fr) auto !important;
  align-items:center !important;
  gap:8px !important;
}
.history-colors{
  display:flex !important;
  align-items:center !important;
  gap:5px !important;
  min-width:0 !important;
}
.history-feedback{
  display:flex !important;
  align-items:center !important;
  justify-content:flex-end !important;
  gap:4px !important;
  min-width:42px !important;
}
.feedback-dot{
  width:12px !important;
  height:12px !important;
  min-width:12px !important;
  border-radius:50% !important;
  border:2px solid rgba(255,255,255,.45) !important;
  box-sizing:border-box !important;
  background:transparent !important;
  box-shadow:none !important;
}
.feedback-dot.black{
  background:#050505 !important;
  border-color:#777 !important;
  box-shadow:0 0 2px #000 !important;
}
.feedback-dot.white{
  background:#fff !important;
  border-color:#ddd !important;
  box-shadow:0 0 2px rgba(255,255,255,.7) !important;
}
@media(max-width:480px){
  .history-row{grid-template-columns:25px minmax(0,1fr) auto !important;gap:5px !important}
  .feedback-dot{width:11px !important;height:11px !important;min-width:11px !important}
  .history-feedback{gap:3px !important}
}
.timer-box{margin:4px auto 9px;width:max-content;min-width:120px;padding:7px 14px;border:2px solid #ffd52b;border-radius:14px;background:#00131fe8;color:#ffd52b;font-weight:900;text-align:center}
</style>

</head>

<body>
<div class="page">
  <div class="top">
    <button class="back" id="back">←</button>
    <div class="title"><small>ADAM GAMES</small><strong>SENHA</strong></div>
    <div class="spacer"></div>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><small>ADAM COINS</small><b class="coins" id="coins">0</b></div>
      <div class="stat"><small>CHANCES</small><b class="chances" id="chances">0</b></div>
      <div class="stat level"><small>FASE</small><b id="level">1 / 9</b></div>
    </div>

    <div class="progress"><div id="progress"></div></div>

    <div class="info">
      <h1 id="phaseTitle">NÍVEL 1 — DESCUBRA A SENHA</h1>
      <p id="phaseText">Descubra a senha escolhendo 3 cores.</p>
    </div>

    <div class="hearts" id="hearts"></div>

    <div class="panel">
      <div class="panel-title">
        <span>🎯 HISTÓRICO DE TENTATIVAS</span>
        <span class="count" id="attemptCount">0 / 10</span>
      </div>

      <div class="history" id="history"></div>

      <div class="legend" style="margin-top:10px">
        <div class="legend-item"><span class="legend-dot black"></span> Cor certa + lugar certo</div>
        <div class="legend-item"><span class="legend-dot white"></span> Cor certa + lugar errado</div>
      </div>
    </div>

    <div class="panel">
      <div class="current-title">🎯 SUA TENTATIVA</div>
      <div class="current" id="current"></div>

      <div class="palette" id="palette"></div>

      <div class="controls">
        <button class="control clear" id="clearBtn">LIMPAR</button>
        <button class="control confirm" id="confirmBtn">CONFIRMAR</button>
      </div>

      <button class="control skip" id="skipBtn">⏭️ PULAR SENHA • -1 ❤️</button>

      <div class="message" id="message"></div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="icon" id="modalIcon">🎉</div>
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <div class="modal-buttons" id="modalButtons"></div>
  </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,query,where,getDocs,doc,updateDoc,increment} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",
  authDomain:"adam-games-21081.firebaseapp.com",
  projectId:"adam-games-21081",
  storageBucket:"adam-games-21081.firebasestorage.app",
  messagingSenderId:"1055528418738",
  appId:"1:1055528418738:web:5fafdf63424ba9744eb8ab"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);

const COLORS=["vermelho","azul","verde","amarelo","roxo","laranja"];
const FILES={
  vermelho:"./vermelho.png", azul:"./azul.png", verde:"./verde.png",
  amarelo:"./amarelo.png", roxo:"./roxo.png", laranja:"./laranja.png"
};

const LEVELS={
  1:{length:3,reward:20},
  2:{length:3,reward:20},
  3:{length:3,reward:20},
  4:{length:4,reward:30},
  5:{length:4,reward:30},
  6:{length:5,reward:30},
  7:{length:5,reward:30},
  8:{length:6,reward:75},
  9:{length:6,reward:0}
};

const HEARTS_START=3;
const SESSION_KEY="adam_senha_session_v6";
const SECRET_SHOW_MS=0; // A senha NUNCA é exibida.

let userDoc=null,userData=null;
let level=1,secret=[],current=[],attempt=0,hearts=HEARTS_START;
let busy=false,sessionStarted=false,entryCharged=false;
let timerId=null,timerStartedAt=0;

function maxAttempts(){return (level===7||level===8)?15:10;}
function money(){return Number(userData?.moedas||0).toLocaleString("pt-BR");}
function renderStats(){
  $("coins").textContent=money();
  $("chances").textContent=Number(userData?.chances||0).toLocaleString("pt-BR");
  $("level").textContent=`${level} / 9`;
  $("progress").style.width=`${(level/9)*100}%`;
}
function renderHearts(){
  const el=$("hearts"), skip=$("skipBtn");
  el.innerHTML="";
  for(let i=0;i<3;i++){
    const s=document.createElement("span");
    s.className="heart"+(i>=hearts?" off":""); s.textContent="❤️"; el.appendChild(s);
  }
  if(level<=7){
    const label=document.createElement("span"); label.className="heart-label";
    label.textContent=`${hearts} coração${hearts===1?"":"ões"} • usar para continuar/pular`;
    el.appendChild(label);
    skip.style.display="block";
    skip.disabled=hearts<=0 || busy;
    skip.textContent=hearts>0?"⏭️ PULAR SENHA • -1 ❤️":"❤️ SEM CORAÇÕES PARA PULAR";
  }else{
    skip.style.display="none";
  }
}
function saveSession(){
  if(!sessionStarted)return;
  const data={
    level,secret,current,attempt,hearts,entryCharged:true,sessionStarted:true,
    timerStartedAt:timerStartedAt||0
  };
  localStorage.setItem(SESSION_KEY,JSON.stringify(data));
}
function clearSession(){localStorage.removeItem(SESSION_KEY);}
function loadSession(){
  try{const raw=localStorage.getItem(SESSION_KEY);return raw?JSON.parse(raw):null;}catch{return null;}
}
function randomSecret(length){
  const pool=[...COLORS],out=[];
  while(out.length<length){const i=Math.floor(Math.random()*pool.length);out.push(pool.splice(i,1)[0]);}
  return out;
}
function buildPalette(){
  const el=$("palette"); el.innerHTML="";
  COLORS.forEach(color=>{
    const btn=document.createElement("button"); btn.className="color-btn"; btn.type="button";
    const img=document.createElement("img"); img.src=FILES[color]; img.alt=""; img.draggable=false;
    btn.appendChild(img);
    btn.addEventListener("click",e=>{e.preventDefault();if(!busy)selectColor(color,btn);});
    el.appendChild(btn);
  });
}
function selectColor(color,btn){
  const len=LEVELS[level].length;
  if(busy||current.length>=len)return;
  current.push(color); btn?.classList.add("selected");
  setTimeout(()=>btn?.classList.remove("selected"),180);
  renderCurrent(); saveSession();
  $("message").className="message";
  $("message").textContent=`${current.length}/${len} cores escolhidas.`;
}
function renderCurrent(){
  const el=$("current"); el.innerHTML="";
  for(let i=0;i<LEVELS[level].length;i++){
    const slot=document.createElement("div"); slot.className="current-slot";
    if(current[i]){const img=document.createElement("img");img.src=FILES[current[i]];img.alt="";slot.appendChild(img);}
    el.appendChild(slot);
  }
}
function makeHistory(){
  const el=$("history"); el.innerHTML="";
  const max=maxAttempts(),len=LEVELS[level].length;
  for(let r=0;r<max;r++){
    const row=document.createElement("div");row.className="history-row";row.dataset.row=r;
    const num=document.createElement("div");num.className="history-number";num.textContent=r+1;
    const slots=document.createElement("div");slots.className="history-slots";
    for(let i=0;i<len;i++){const s=document.createElement("div");s.className="h-slot";s.dataset.slot=i;slots.appendChild(s);}
    const feedback=document.createElement("div");feedback.className="feedback";
    for(let i=0;i<len;i++){const d=document.createElement("span");d.className="feedback-dot";d.dataset.feedback=i;feedback.appendChild(d);}
    row.append(num,slots,feedback);el.appendChild(row);
  }
  $("attemptCount").textContent=`${attempt} / ${max}`;
}
function calculateFeedback(guess,answer){
  const out=Array(guess.length).fill("");
  const usedA=Array(answer.length).fill(false),usedG=Array(guess.length).fill(false);
  for(let i=0;i<guess.length;i++){
    if(guess[i]===answer[i]){out[i]="black";usedA[i]=true;usedG[i]=true;}
  }
  for(let i=0;i<guess.length;i++){
    if(usedG[i])continue;
    for(let j=0;j<answer.length;j++){
      if(!usedA[j]&&guess[i]===answer[j]){out[i]="white";usedA[j]=true;break;}
    }
  }
  return out;
}
function addHistory(guess,feedback){
  const row=document.querySelector(`.history-row[data-row="${attempt}"]`);
  if(!row)return;
  const slots=[...row.querySelectorAll(".h-slot")];
  guess.forEach((color,i)=>{
    if(!slots[i])return;
    const img=document.createElement("img");img.src=FILES[color];img.alt="";slots[i].appendChild(img);
  });
  const dots=[...row.querySelectorAll(".feedback-dot")];
  feedback.forEach((type,i)=>{if(dots[i]&&type)dots[i].classList.add(type);});
  $("attemptCount").textContent=`${attempt+1} / ${maxAttempts()}`;
}
function openModal(title,text,buttons,icon="🎉"){
  $("modalIcon").textContent=icon;$("modalTitle").textContent=title;$("modalText").innerHTML=text;$("modalButtons").innerHTML="";
  buttons.forEach(item=>{const b=document.createElement("button");b.type="button";b.textContent=item.text;b.className=item.cls||"secondary";b.onclick=item.fn;$("modalButtons").appendChild(b);});
  $("modal").classList.add("show");
}
function closeModal(){$("modal").classList.remove("show");}
async function updateAccount(deltaCoins=0,deltaChances=0){
  if(!userDoc)throw new Error("Cadastro não encontrado.");
  const ref=doc(db,"admins",userDoc.id);
  const coins=Number(userData?.moedas||0),chances=Number(userData?.chances||0);
  if(chances+deltaChances<0)throw new Error("Você não possui chances suficientes.");
  await updateDoc(ref,{moedas:increment(Number(deltaCoins)),chances:increment(Number(deltaChances))});
  userData={...userData,moedas:coins+Number(deltaCoins),chances:chances+Number(deltaChances)};renderStats();
}
async function chargeEntry(){
  const stored=loadSession();
  if(stored?.sessionStarted){entryCharged=true;sessionStarted=true;restoreSession(stored);return true;}
  if(Number(userData?.chances||0)<1){openModal("SEM CHANCES","Você precisa ter pelo menos <b>1 chance</b> para iniciar o jogo.",[{text:"VOLTAR",cls:"primary",fn:()=>location.href="jogos.html"}],"❤️");return false;}
  try{
    await updateAccount(30,-1);
    entryCharged=true;sessionStarted=true;
    level=1;hearts=HEARTS_START;attempt=0;current=[];secret=randomSecret(LEVELS[1].length);
    timerStartedAt=0;saveSession();
    $("message").textContent="🪙 +30 Adam Coins • -1 chance";
    return true;
  }catch(error){openModal("ERRO",String(error?.message||"Não foi possível iniciar a partida."),[{text:"VOLTAR",cls:"primary",fn:()=>location.href="jogos.html"}],"⚠️");return false;}
}
function restoreSession(s){
  level=Number(s.level)||1;secret=Array.isArray(s.secret)?s.secret:randomSecret(LEVELS[level].length);current=Array.isArray(s.current)?s.current:[];attempt=Number(s.attempt)||0;hearts=Number.isFinite(s.hearts)?s.hearts:HEARTS_START;timerStartedAt=Number(s.timerStartedAt)||0;
}
function setLevelText(){
  const len=LEVELS[level].length;
  let name=level<=3?"FÁCIL":level<=6?"MÉDIO":level===7?"DIFÍCIL":level===8?"HARD":"BÔNUS";
  $("phaseTitle").textContent=`NÍVEL ${level} — ${level===8?"HARD":level===9?"BÔNUS":"DESCUBRA A SENHA"}`;
  $("phaseText").textContent=`${name} • Descubra a senha escolhendo ${len} cores.`;
}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}
function elapsedSeconds(){return timerStartedAt?Math.floor((Date.now()-timerStartedAt)/1000):0;}
function updateTimer(){
  if(level!==9)return;
  const sec=elapsedSeconds();
  let label=document.getElementById("timerBox");
  if(!label)return;
  label.textContent=`⏱️ ${Math.max(0,120-sec)}s`;
  if(sec>=120){stopTimer();busy=true;openModal("TEMPO ESGOTADO","O bônus terminou sem completar a senha.",[{text:"VOLTAR AOS JOGOS",cls:"primary",fn:()=>location.href="jogos.html"}],"⏰");}
}
function startTimerIfNeeded(){
  stopTimer();
  if(level!==9)return;
  if(!timerStartedAt)timerStartedAt=Date.now();
  let box=document.getElementById("timerBox");if(!box){box=document.createElement("div");box.id="timerBox";box.className="timer-box";$("hearts").after(box);}
  updateTimer();timerId=setInterval(updateTimer,250);saveSession();
}
function startLevel({keepState=false}={}){
  busy=false;
  if(!keepState){secret=randomSecret(LEVELS[level].length);current=[];attempt=0;timerStartedAt=0;}
  setLevelText();renderStats();renderHearts();makeHistory();renderCurrent();
  $("message").className="message";$("message").textContent="Sua vez! A senha não é exibida.";
  // Recria o histórico já salvo quando a página foi atualizada.
  const stored=loadSession();
  if(keepState&&stored?.history){
    stored.history.forEach(item=>{
      const row=document.querySelector(`.history-row[data-row="${item.index}"]`);if(!row)return;
      const slots=[...row.querySelectorAll(".h-slot")];(item.guess||[]).forEach((c,i)=>{if(slots[i]){const img=document.createElement("img");img.src=FILES[c];img.alt="";slots[i].appendChild(img);}});
      const dots=[...row.querySelectorAll(".feedback-dot")];(item.feedback||[]).forEach((t,i)=>{if(dots[i]&&t)dots[i].classList.add(t);});
    });
    $("attemptCount").textContent=`${attempt} / ${maxAttempts()}`;
  }
  startTimerIfNeeded();saveSession();
}
function saveHistoryEntry(index,guess,feedback){
  const s=loadSession()||{};s.history=Array.isArray(s.history)?s.history:[];s.history.push({index,guess,feedback});s.history=s.history.slice(-maxAttempts());Object.assign(s,{level,secret,current,attempt,hearts,sessionStarted:true,entryCharged:true,timerStartedAt});localStorage.setItem(SESSION_KEY,JSON.stringify(s));
}
async function win(){
  busy=true;stopTimer();
  let reward=LEVELS[level].reward;
  if(level===9){const sec=elapsedSeconds();reward=sec<=30?200:sec<=70?150:sec<=120?120:0;}
  try{if(reward>0)await updateAccount(reward,0);}catch(e){console.error(e);}
  if(level<8){openModal("SENHA CORRETA!",`Você descobriu a senha!<br><br><span class="gold"><b>+${reward} Adam Coins</b></span>`,[{text:"PRÓXIMO NÍVEL",cls:"primary",fn:()=>{closeModal();level++;attempt=0;current=[];timerStartedAt=0;const s=loadSession()||{};s.level=level;s.secret=randomSecret(LEVELS[level].length);s.current=[];s.attempt=0;s.history=[];s.timerStartedAt=0;localStorage.setItem(SESSION_KEY,JSON.stringify(s));startLevel({keepState:true});}}],"🎉");return;}
  if(level===8){openModal("HARD CONCLUÍDO!",`+${reward} Adam Coins<br><br>Você venceu o Nível 8 e liberou o <b>BÔNUS — NÍVEL 9</b>.`,[{text:"IR PARA O NÍVEL 9",cls:"primary",fn:()=>{closeModal();level=9;attempt=0;current=[];hearts=0;secret=randomSecret(6);timerStartedAt=Date.now();const s=loadSession()||{};Object.assign(s,{level:9,secret,current:[],attempt:0,history:[],hearts:0,timerStartedAt});localStorage.setItem(SESSION_KEY,JSON.stringify(s));startLevel({keepState:true});}}],"🔥");return;}
  const sec=elapsedSeconds();openModal("BÔNUS CONCLUÍDO!",`Tempo: <b>${sec}s</b><br><br><span class="gold"><b>+${reward} Adam Coins</b></span>`,[{text:"VOLTAR AOS JOGOS",cls:"primary",fn:()=>{clearSession();location.href="jogos.html"}}],"👑");
}
async function failRound(){
  const max=maxAttempts();
  if(attempt+1>=max){
    if(level<=7&&hearts>0){
      openModal("TENTATIVAS ESGOTADAS",`Você usou as <b>${max} tentativas</b>.<br><br>Você ainda tem <b>${hearts} ❤️</b>.`,[{text:"❤️ CONTINUAR • -1 ❤️",cls:"primary",fn:continueWithHeart},{text:"SAIR",cls:"secondary",fn:()=>location.href="jogos.html"}],"💔");
    }else{openModal(level===8?"HARD PERDIDO":"PARTIDA ENCERRADA",`Você esgotou as <b>${max} tentativas</b>.`,[{text:"VOLTAR AOS JOGOS",cls:"primary",fn:()=>location.href="jogos.html"}],"💀");}
    return;
  }
  attempt++;current=[];renderCurrent();busy=false;saveSession();$("attemptCount").textContent=`${attempt} / ${max}`;$("message").textContent=`Tentativa ${attempt} registrada.`;
}
async function clearCurrent(){if(busy)return;current=[];renderCurrent();saveSession();$("message").textContent="";}
async function continueWithHeart(){
  if(hearts<=0)return;
  try{await updateAccount(30,-1);}catch(e){$("message").textContent=e.message;return;}
  hearts--;attempt=0;current=[];secret=randomSecret(LEVELS[level].length);timerStartedAt=level===9?Date.now():0;const s=loadSession()||{};Object.assign(s,{level,secret,current:[],attempt:0,hearts,history:[],timerStartedAt,sessionStarted:true,entryCharged:true});localStorage.setItem(SESSION_KEY,JSON.stringify(s));closeModal();startLevel({keepState:true});$("message").textContent="❤️ Coração usado. Você continua no mesmo nível.";
}
async function skipWithHeart(){
  if(level>=8||hearts<=0)return;
  hearts--;attempt=0;current=[];secret=randomSecret(LEVELS[level].length);timerStartedAt=0;const s=loadSession()||{};Object.assign(s,{level,secret,current:[],attempt:0,hearts,history:[],timerStartedAt});localStorage.setItem(SESSION_KEY,JSON.stringify(s));startLevel({keepState:true});$("message").textContent="⏭️ Senha pulada. Nova senha no mesmo nível.";
}
async function confirmar(){
  if(busy)return;
  if(level===9&&elapsedSeconds()>=120){updateTimer();return;}
  const len=LEVELS[level].length;
  if(current.length!==len){$("message").className="message bad";$("message").textContent=`Escolha ${len} cores antes de confirmar.`;return;}
  const guess=[...current],feedback=calculateFeedback(guess,secret);addHistory(guess,feedback);saveHistoryEntry(attempt,guess,feedback);
  const correct=feedback.every(x=>x==="black");
  if(correct){await win();return;}
  await failRound();
}
$("confirmBtn").addEventListener("click",e=>{e.preventDefault();confirmar();});
$("clearBtn").addEventListener("click",e=>{e.preventDefault();clearCurrent();});
$("skipBtn").addEventListener("click",e=>{e.preventDefault();skipWithHeart();});
$("back").addEventListener("click",()=>location.href="jogos.html");
async function localizarUsuario(user){
  let result=await getDocs(query(collection(db,"admins"),where("uid","==",user.uid)));
  if(result.empty&&user.email)result=await getDocs(query(collection(db,"admins"),where("email","==",user.email.toLowerCase())));
  return result.empty?null:result.docs[0];
}
onAuthStateChanged(auth,async user=>{
  if(!user){location.replace("index.html");return;}
  try{
    buildPalette();userDoc=await localizarUsuario(user);
    if(!userDoc){$("message").textContent="Cadastro não encontrado.";return;}
    userData=userDoc.data();renderStats();
    const ok=await chargeEntry();if(!ok)return;
    const stored=loadSession();
    startLevel({keepState:!!stored?.sessionStarted});
  }catch(error){console.error("ERRO AO INICIAR SENHA:",error);$("message").textContent="Erro ao iniciar o jogo: "+String(error?.message||"erro");}
});
</script>
