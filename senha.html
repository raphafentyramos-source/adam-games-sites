<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Adam Games • Senha</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#061b2d}
body{
  font-family:Arial,Helvetica,sans-serif;color:#fff;
  background:
    radial-gradient(circle at 15% 0%,rgba(46,183,255,.24),transparent 30%),
    radial-gradient(circle at 85% 10%,rgba(118,55,255,.20),transparent 28%),
    linear-gradient(180deg,#073a4a 0%,#06263d 50%,#031b2d 100%);
}
button{font:inherit}
.page{width:100%;max-width:700px;margin:auto;padding:14px 12px 80px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{
  width:44px;height:44px;border:0;border-radius:14px;
  background:linear-gradient(145deg,#0c6fa5,#07436e);
  color:#fff;font-size:25px;box-shadow:0 5px 12px #0006;cursor:pointer
}
.title{text-align:center;text-shadow:0 2px 6px #000}
.title small{display:block;font-size:10px;letter-spacing:2px;color:#bcecff}
.title strong{font-size:21px}
.spacer{width:44px}

.card{
  margin-top:12px;padding:13px;border-radius:22px;
  background:rgba(3,29,48,.82);border:1px solid #ffffff18;
  box-shadow:0 14px 35px #0006;backdrop-filter:blur(5px)
}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{padding:9px 6px;border-radius:13px;background:#0000002b;text-align:center}
.stat small{font-size:9px;font-weight:900;color:#a9d7eb}
.stat b{display:block;margin-top:3px;font-size:19px}
.coins{color:#ffd52b}.chances{color:#ff6670}.level{color:#72d7ff}
.progress{height:8px;background:#17394e;border-radius:20px;overflow:hidden;margin-top:10px}
.progress div{height:100%;width:0;background:linear-gradient(90deg,#28d56c,#ffd52b);transition:.3s}

.info{text-align:center;padding:12px 6px 4px}
.info h1{font-size:20px}
.info p{margin-top:5px;color:#b9d7e8;font-size:12px;line-height:1.4}

.game-wrap{
  margin-top:8px;display:flex;justify-content:center;
  overflow:hidden;border-radius:18px;
  background-position:center;background-size:cover;background-repeat:no-repeat;
  transition:background-image .2s ease
}
.board{
  position:relative;width:min(100%,720px);aspect-ratio:1024/1536;
  background-image:url("./C0A67B9D-67BE-49A6-8747-B5B2A32411C4.png");
  background-size:100% 100%;background-repeat:no-repeat;
}
.palette{
  margin:12px auto 0;width:min(100%,560px);display:grid;grid-template-columns:repeat(7,1fr);
  gap:7px;padding:10px;border-radius:18px;background:rgba(35,18,8,.78);border:2px solid #9b6a32;box-shadow:0 8px 20px #0008;z-index:3
}
.color-btn{
  border:0;background:transparent;display:flex;align-items:center;
  justify-content:center;cursor:pointer;min-width:0
}
.color-btn img{width:100%;height:100%;max-height:58px;object-fit:contain;filter:drop-shadow(0 3px 3px #0008)}
.color-btn:active img{transform:scale(.88)}
.color-btn.selected img{filter:drop-shadow(0 0 9px #fff) drop-shadow(0 3px 3px #0008)}

.rows{
  position:absolute;left:9.5%;right:9.5%;top:15.0%;bottom:15.0%;
  display:grid;grid-template-rows:repeat(10,1fr);z-index:2
}
.row{
  position:relative;display:flex;align-items:center;
}
.row-number{width:9%;height:54%;font-size:0}
.guess-slots{
  width:60%;display:flex;gap:2.5%;align-items:center;justify-content:flex-start;padding-left:1%
}
.guess-slot{
  width:15.2%;aspect-ratio:1;border-radius:50%;background:transparent;
  border:0;box-shadow:none;overflow:hidden;display:flex;align-items:center;justify-content:center
}
.guess-slot img{width:100%;height:100%;object-fit:contain}
.feedback{
  width:31%;display:grid;grid-template-columns:repeat(5,1fr);
  gap:4%;padding:0 4%;align-items:center
}
.feedback-dot{
  width:100%;aspect-ratio:1;border-radius:50%;
  background:#4a2b16;border:0;box-shadow:none;background-size:contain;background-position:center;background-repeat:no-repeat
}
.feedback-dot.black{background:#171717 url("./preto.png") center/contain no-repeat;border-color:transparent;box-shadow:none}
.feedback-dot.white{background-image:url("./branco.png");background-size:contain;background-position:center;background-repeat:no-repeat;border-color:transparent;box-shadow:none}

.controls{
  margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:9px
}
.control{
  height:47px;border:0;border-radius:14px;color:#fff;font-weight:900;cursor:pointer;
  box-shadow:0 5px 10px #0005
}
.clear{background:linear-gradient(145deg,#315878,#183b57)}
.confirm{background:linear-gradient(145deg,#28d86d,#08783e)}
.control:disabled{opacity:.45;cursor:not-allowed}
.message{text-align:center;min-height:20px;margin-top:7px;color:#bfe3f2;font-size:12px;font-weight:800}

.selected-preview{
  min-height:44px;margin-top:9px;display:flex;justify-content:center;align-items:center;gap:7px
}
.preview-dot{width:34px;height:34px;border-radius:50%;overflow:hidden;background:#1d140c;border:2px solid #7b542b}
.preview-dot img{width:100%;height:100%;object-fit:contain}

.modal{
  position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  padding:18px;background:#00101dcc;backdrop-filter:blur(6px)
}
.modal.show{display:flex}
.modal-card{
  width:min(100%,390px);padding:22px 18px;border-radius:22px;text-align:center;
  background:linear-gradient(145deg,#0b3a52,#241044);
  border:1px solid #ffffff1c;box-shadow:0 20px 50px #0009
}
.modal-card h2{font-size:22px}
.modal-card p{margin-top:9px;color:#c3ddeb;font-size:14px;line-height:1.5}
.modal-buttons{display:grid;gap:9px;margin-top:17px}
.modal-buttons button{
  height:46px;border:0;border-radius:13px;color:#fff;font-weight:900;cursor:pointer
}
.primary{background:#19ae60}.secondary{background:#ffffff17}
.gold{color:#ffd52b}

@media(max-width:520px){
  .page{padding-left:8px;padding-right:8px}
  .card{padding:9px}
  .stat b{font-size:17px}
  .info h1{font-size:18px}
}
</style>
</head>

<body>
<div class="page">
  <div class="top">
    <button class="back" id="back">←</button>
    <div class="title"><small>ADAM GAMES</small><strong>SENHA</strong></div>
    <div class="spacer"></div>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><small>ADAM COINS</small><b class="coins" id="coins">0</b></div>
      <div class="stat"><small>CHANCES</small><b class="chances" id="chances">0</b></div>
      <div class="stat level"><small>FASE</small><b id="level">1 / 9</b></div>
    </div>

    <div class="progress"><div id="progress"></div></div>

    <div class="info">
      <h1 id="phaseTitle">DESCUBRA A SENHA</h1>
      <p id="phaseText">Observe a sequência. Ela desaparece e você precisa reproduzi-la.</p>
    </div>

    <div class="selected-preview" id="preview"></div>

    <div class="game-wrap">
      <div>
        <div class="board">
          <div class="rows" id="rows"></div>
        </div>
        <div class="palette" id="palette"></div>
      </div>
    </div>

    <div class="controls">
      <button class="control clear" id="clearBtn">LIMPAR</button>
      <button class="control confirm" id="confirmBtn">CONFIRMAR</button>
    </div>
    <div class="message" id="message"></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <div class="modal-buttons" id="modalButtons"></div>
  </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,query,where,getDocs,doc,updateDoc,increment} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",
  authDomain:"adam-games-21081.firebaseapp.com",
  projectId:"adam-games-21081",
  storageBucket:"adam-games-21081.firebasestorage.app",
  messagingSenderId:"1055528418738",
  appId:"1:1055528418738:web:5fafdf63424ba9744eb8ab"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);

const COLORS=["vermelho","azul","verde","amarelo","roxo","laranja"];

const FILES={
  vermelho:"./vermelho.png",
  azul:"./azul.png",
  verde:"./verde.png",
  amarelo:"./amarelo.png",
  roxo:"./roxo.png",
  laranja:"./laranja.png",
  rosa:"./rosa.png",
};

const FEEDBACK={black:"./preto.png",white:"./branco.png"};

/*
  ESTRUTURA DOS NÍVEIS
  Agora ativados: 1, 2 e 3.
  A estrutura já está preparada para os demais:
  1-3 = 3 cores | +20 moedas
  4-7 = 4/5 cores | +30 moedas
  8   = 6 cores   | +75 moedas
  9   = senha dupla | +150 / +100
*/
const LEVELS={
  1:{length:3,reward:20},
  2:{length:3,reward:20},
  3:{length:3,reward:20},
  4:{length:4,reward:30},
  5:{length:4,reward:30},
  6:{length:4,reward:30},
  7:{length:5,reward:30},
  8:{length:6,reward:75},
  9:{length:6,reward:150,bonus:true}
};

const MAX_ATTEMPTS=10;

let userDoc=null;
let userData=null;
let level=1;
let secret=[];
let current=[];
let attempt=0;
let busy=true;
let gameStarted=false;

function money(){
  return Number(userData?.moedas||0).toLocaleString("pt-BR");
}

function renderStats(){
  $("coins").textContent=money();
  $("chances").textContent=Number(userData?.chances||0).toLocaleString("pt-BR");
  $("level").textContent=`${level} / 9`;
  $("progress").style.width=`${(level/9)*100}%`;
}

function randomSecret(length){
  // Sem cores repetidas dentro da senha.
  const pool=[...COLORS];
  const result=[];
  while(result.length<length){
    const i=Math.floor(Math.random()*pool.length);
    result.push(pool.splice(i,1)[0]);
  }
  return result;
}

function buildPalette(){
  const el=$("palette");
  el.innerHTML="";
  COLORS.forEach(color=>{
    const btn=document.createElement("button");
    btn.className="color-btn";
    btn.type="button";
    btn.title=color;

    const img=document.createElement("img");
    img.src=FILES[color];
    img.alt="";
    img.draggable=false;

    btn.appendChild(img);

    btn.addEventListener("click",()=>{
      if(busy || current.length>=secret.length) return;

      current.push(color);
      renderPreview();
      renderCurrentRow();
    });

    el.appendChild(btn);
  });
}

function renderPreview(){
  const p=$("preview");
  p.innerHTML="";
  current.forEach(color=>{
    const d=document.createElement("div");
    d.className="preview-dot";
    const img=document.createElement("img");
    img.src=FILES[color];
    img.alt="";
    d.appendChild(img);
    p.appendChild(d);
  });
}

function makeRows(){
  const rows=$("rows");
  rows.innerHTML="";

  for(let r=0;r<MAX_ATTEMPTS;r++){
    const row=document.createElement("div");
    row.className="row";
    row.dataset.row=r;

    const number=document.createElement("div");
    number.className="row-number";
    number.textContent=r+1;

    const slots=document.createElement("div");
    slots.className="guess-slots";

    // O tabuleiro tem 6 espaços grandes. Nos níveis 1-3,
    // somente os 3 primeiros serão usados.
    for(let i=0;i<6;i++){
      const slot=document.createElement("div");
      slot.className="guess-slot";
      slot.dataset.slot=i;
      if(i>=secret.length) slot.style.visibility="hidden";
      slots.appendChild(slot);
    }

    const feedback=document.createElement("div");
    feedback.className="feedback";
    for(let i=0;i<5;i++){
      const dot=document.createElement("span");
      dot.className="feedback-dot";
      feedback.appendChild(dot);
    }

    row.append(number,slots,feedback);
    rows.appendChild(row);
  }
}

function renderCurrentRow(){
  const row=$(`.row[data-row="${attempt}"]`);
  if(!row) return;

  [...row.querySelectorAll(".guess-slot")].forEach((slot,i)=>{
    slot.innerHTML="";
    if(i<current.length){
      const img=document.createElement("img");
      img.src=FILES[current[i]];
      img.alt="";
      slot.appendChild(img);
    }
  });
}

function calculateResult(guess, answer){
  // Como a senha é criada sem repetição, a contagem fica simples.
  let exact=0;
  let misplaced=0;

  for(let i=0;i<answer.length;i++){
    if(guess[i]===answer[i]) exact++;
  }

  for(let i=0;i<guess.length;i++){
    if(guess[i]!==answer[i] && answer.includes(guess[i])) misplaced++;
  }

  return {exact,misplaced};
}

function paintResult(rowIndex,result){
  const row=$(`.row[data-row="${rowIndex}"]`);
  if(!row) return;

  const dots=[...row.querySelectorAll(".feedback-dot")];

  // Preto = cor certa no lugar certo.
  for(let i=0;i<result.exact;i++){ dots[i].classList.add("black"); dots[i].style.backgroundImage=`url("${FEEDBACK.black}")`; }

  // Branco = cor certa no lugar errado.
  for(let i=0;i<result.misplaced;i++){ dots[result.exact+i].classList.add("white"); dots[result.exact+i].style.backgroundImage=`url("${FEEDBACK.white}")`; }
}

function addAttempt(){
  const row=$(`.row[data-row="${attempt}"]`);
  if(!row) return;

  const result=calculateResult(current,secret);
  paintResult(attempt,result);

  [...row.querySelectorAll(".guess-slot")].forEach((slot,i)=>{
    slot.style.visibility=i<secret.length?"visible":"hidden";
  });
}

function openModal(title,text,buttons){
  $("modalTitle").textContent=title;
  $("modalText").innerHTML=text;
  $("modalButtons").innerHTML="";

  buttons.forEach(item=>{
    const b=document.createElement("button");
    b.type="button";
    b.textContent=item.text;
    b.className=item.cls||"secondary";
    b.onclick=item.fn;
    $("modalButtons").appendChild(b);
  });

  $("modal").classList.add("show");
}

function closeModal(){
  $("modal").classList.remove("show");
}

async function updateAccount(deltaCoins=0,deltaChances=0){
  if(!userDoc) throw new Error("Cadastro não encontrado.");

  const ref=doc(db,"admins",userDoc.id);

  const oldCoins=Number(userData?.moedas||0);
  const oldChances=Number(userData?.chances||0);
  const newCoins=oldCoins+Number(deltaCoins||0);
  const newChances=oldChances+Number(deltaChances||0);

  if(newChances<0){
    throw new Error("Você não possui chances suficientes.");
  }

  await updateDoc(ref,{
    moedas:increment(Number(deltaCoins||0)),
    chances:increment(Number(deltaChances||0))
  });

  userData={...userData,moedas:newCoins,chances:newChances};
  renderStats();
}

function showSecret(){
  const row=$(`.row[data-row="0"]`);
  // A combinação é mostrada no topo do tabuleiro usando o próprio espaço visual.
  // Durante a memorização, os pinos da senha aparecem temporariamente.
  if(!row) return;

  [...row.querySelectorAll(".guess-slot")].forEach((slot,i)=>{
    slot.innerHTML="";
    if(i<secret.length){
      const img=document.createElement("img");
      img.src=FILES[secret[i]];
      img.alt="";
      slot.appendChild(img);
      slot.style.visibility="visible";
    }else{
      slot.style.visibility="hidden";
    }
  });

  $("message").textContent="MEMORIZE A SENHA...";

  setTimeout(()=>{
    [...row.querySelectorAll(".guess-slot")].forEach(slot=>{
      slot.innerHTML="";
    });
    current=[];
    renderPreview();
    renderCurrentRow();
    busy=false;
    $("message").textContent="Sua vez! Monte a senha e confirme.";
  },2600);
}

function setLevelBackground(){
  const bg = level <= 3 ? "./fundo_nivel_01_03.png"
    : level <= 6 ? "./fundo_nivel_04_06.png"
    : level === 7 ? "./fundo_nivel_07.png"
    : "./fundo_nivel_08_09.png";

  const wrap=$(".game-wrap");
  wrap.style.backgroundImage=`url("${bg}")`;
  wrap.style.backgroundSize="cover";
  wrap.style.backgroundPosition="center";
  wrap.style.backgroundRepeat="no-repeat";

  document.body.style.backgroundImage=`url("${bg}")`;
  document.body.style.backgroundSize="cover";
  document.body.style.backgroundAttachment="fixed";
  document.body.style.backgroundPosition="center";
  document.body.style.backgroundRepeat="no-repeat";
}

function startLevel(){
  const config=LEVELS[level];
  setLevelBackground();
  secret=randomSecret(config.length);
  current=[];
  attempt=0;
  busy=true;

  $("phaseTitle").textContent=`NÍVEL ${level} — DESCUBRA A SENHA`;
  $("phaseText").textContent=`A senha tem ${config.length} cores. Você tem ${MAX_ATTEMPTS} tentativas.`;
  $("message").textContent="";

  makeRows();
  renderPreview();
  renderStats();
  showSecret();
}

async function win(){
  busy=true;

  const reward=LEVELS[level].reward;
  await updateAccount(reward,0);

  if(level<3){
    openModal(
      "🎉 SENHA CORRETA!",
      `Você descobriu a senha!<br><br><span class="gold"><b>+${reward} Adam Coins</b></span>`,
      [{
        text:"PRÓXIMO NÍVEL",
        cls:"primary",
        fn:()=>{
          closeModal();
          level++;
          startLevel();
        }
      }]
    );
    return;
  }

  openModal(
    "🎉 NÍVEL 3 CONCLUÍDO!",
    `Você completou a primeira etapa da <b>Senha</b>.<br><br><span class="gold"><b>+${reward} Adam Coins</b></span>`,
    [{
      text:"VOLTAR AOS JOGOS",
      cls:"primary",
      fn:()=>window.location.href="jogos.html"
    }]
  );
}

async function lose(){
  busy=true;

  const correct=secret.map(c=>c.toUpperCase()).join(" • ");

  openModal(
    "💥 VOCÊ PERDEU!",
    `A senha correta era:<br><br><b>${correct}</b><br><br>Você pode reiniciar a fase ou usar uma nova chance.`,
    [
      {
        text:"REINICIAR FASE",
        cls:"primary",
        fn:()=>{
          closeModal();
          startLevel();
        }
      },
      {
        text:"CONTINUAR NESTA FASE (+20)",
        cls:"secondary",
        fn:async()=>{
          try{
            await updateAccount(20,-1);
            closeModal();
            startLevel();
          }catch(error){
            $("modalText").textContent=error.message;
          }
        }
      }
    ]
  );
}

$("confirmBtn").addEventListener("click",async()=>{
  if(busy) return;

  if(current.length!==secret.length){
    $("message").textContent=`Escolha ${secret.length} cores antes de confirmar.`;
    return;
  }

  addAttempt();

  const guess=[...current];
  const correct=guess.every((color,i)=>color===secret[i]);

  if(correct){
    await win();
    return;
  }

  attempt++;
  current=[];
  renderPreview();

  if(attempt>=MAX_ATTEMPTS){
    await lose();
    return;
  }

  renderCurrentRow();
  $("message").textContent=`Senha incorreta. Tentativa ${attempt+1} de ${MAX_ATTEMPTS}.`;
});

$("clearBtn").addEventListener("click",()=>{
  if(busy) return;
  current=[];
  renderPreview();
  renderCurrentRow();
  $("message").textContent="";
});

$("back").addEventListener("click",()=>{
  window.location.href="jogos.html";
});

async function localizarUsuario(user){
  let result=await getDocs(
    query(collection(db,"admins"),where("uid","==",user.uid))
  );

  if(result.empty && user.email){
    result=await getDocs(
      query(collection(db,"admins"),where("email","==",user.email.toLowerCase()))
    );
  }

  return result.empty?null:result.docs[0];
}

onAuthStateChanged(auth,async user=>{
  if(!user){
    window.location.replace("index.html");
    return;
  }

  try{
    // Monta a parte visual imediatamente.
    // Assim o fundo nunca fica dependente da atualização do Firebase.
    buildPalette();
    setLevelBackground();

    userDoc=await localizarUsuario(user);

    if(!userDoc){
      $("message").textContent="Cadastro não encontrado.";
      return;
    }

    userData=userDoc.data();
    renderStats();

    if(Number(userData.chances||0)<=0){
      openModal(
        "SEM CHANCES",
        "Você precisa ter pelo menos 1 chance para iniciar o jogo.",
        [{
          text:"VOLTAR",
          cls:"primary",
          fn:()=>window.location.href="jogos.html"
        }]
      );
      return;
    }

    // Ao entrar na partida:
    // -1 chance
    // +30 Adam Coins
    await updateAccount(30,-1);

    gameStarted=true;
    startLevel();

  }catch(error){
    console.error("ERRO AO INICIAR SENHA:",error);
    $("message").textContent="Não foi possível registrar a partida.";

    openModal(
      "ERRO AO INICIAR",
      "As imagens foram carregadas, mas não foi possível registrar a entrada da partida.<br><br><small>"+
      String(error?.message||"Erro desconhecido").replace(/[<>]/g,"")+
      "</small>",
      [{
        text:"VOLTAR AOS JOGOS",
        cls:"primary",
        fn:()=>window.location.href="jogos.html"
      }]
    );
  }
});
</script>
</body>
</html>
