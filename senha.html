<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>Adam Games • Senha</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  min-height:100%;
}

body{

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:#fff;

  background:
    linear-gradient(
      180deg,
      #073754,
      #021d31
    );

  overflow-x:hidden;

}


/* =====================================================
   PÁGINA
===================================================== */

.page{

  width:100%;

  max-width:680px;

  margin:0 auto;

  padding:
    10px
    9px
    70px;

}


/* =====================================================
   TOPO
===================================================== */

.top{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:12px;

}


.back{

  width:44px;

  height:44px;

  border:0;

  border-radius:14px;

  background:
    rgba(2,38,64,.92);

  color:#fff;

  font-size:27px;

  cursor:pointer;

}


.title{

  text-align:center;

}


.title small{

  display:block;

  color:#a9d7eb;

  font-size:10px;

  letter-spacing:3px;

}


.title strong{

  display:block;

  margin-top:2px;

  font-size:24px;

  text-shadow:
    0 3px 8px #000;

}


.top-space{

  width:44px;

}


/* =====================================================
   STATUS
===================================================== */

.status{

  display:grid;

  grid-template-columns:
    1fr
    1fr
    1fr;

  gap:8px;

}


.status-box{

  padding:10px 5px;

  border-radius:15px;

  text-align:center;

  background:
    rgba(2,29,49,.9);

  border:
    1px solid
    rgba(255,255,255,.07);

}


.status-label{

  color:#9fc9df;

  font-size:9px;

  font-weight:bold;

  letter-spacing:.6px;

}


.status-value{

  margin-top:3px;

  font-size:21px;

  font-weight:900;

}


.coins{
  color:#ffd52b;
}

.chances{
  color:#70ff9d;
}

.level{
  color:#65d9ff;
}


/* =====================================================
   PROGRESSO
===================================================== */

.progress{

  height:8px;

  margin:
    12px
    2px
    12px;

  overflow:hidden;

  border-radius:10px;

  background:
    rgba(255,255,255,.12);

}


.progress-bar{

  width:33.33%;

  height:100%;

  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      #22d76a,
      #ffe01c
    );

}


/* =====================================================
   TÍTULO
===================================================== */

.phase-info{

  text-align:center;

  margin-bottom:10px;

}


.phase-info h1{

  font-size:
    clamp(
      22px,
      6vw,
      30px
    );

  text-shadow:
    0 3px 8px #000;

}


.phase-info p{

  margin-top:5px;

  color:#c2deeb;

  font-size:13px;

}


/* =====================================================
   ÁREA DO JOGO
===================================================== */

.game-background{

  position:relative;

  width:100%;

  min-height:610px;

  padding:
    12px;

  border-radius:21px;

  overflow:hidden;

  background-image:
    url("./fundo_nivel_01_03.png");

  background-size:cover;

  background-position:center;

  border:
    1px solid
    rgba(255,255,255,.12);

  box-shadow:
    0 12px 35px
    rgba(0,0,0,.32);

}


/* =====================================================
   QUADRO DE 10 TENTATIVAS
===================================================== */

.history{

  position:absolute;

  left:10px;

  right:10px;

  bottom:14px;

  padding:
    9px
    8px;

  border-radius:15px;

  background:
    rgba(9,29,39,.68);

  border:
    1px solid
    rgba(255,255,255,.20);

  backdrop-filter:
    blur(3px);

}


/* =====================================================
   CABEÇALHO PEQUENO
===================================================== */

.history-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin:
    0
    4px
    5px;

}


.history-title{

  color:#fff;

  font-size:10px;

  font-weight:900;

  letter-spacing:.7px;

  text-transform:uppercase;

}


.history-counter{

  color:#c9e2ec;

  font-size:10px;

  font-weight:bold;

}


/* =====================================================
   FILEIRAS
===================================================== */

.attempt{

  width:100%;

  min-height:32px;

  margin-top:3px;

  display:flex;

  align-items:center;

  padding:
    2px
    4px;

  border-radius:8px;

  background:
    rgba(255,255,255,.055);

}


/* =====================================================
   NÚMERO
===================================================== */

.attempt-number{

  width:21px;

  flex-shrink:0;

  color:#d9edf5;

  font-size:9px;

  font-weight:900;

  text-align:center;

}


/* =====================================================
   ÁREA DAS CORES
===================================================== */

.attempt-colors{

  flex:1;

  min-width:0;

  display:flex;

  align-items:center;

  justify-content:flex-start;

  gap:4px;

}


/* =====================================================
   BOLA COLORIDA
===================================================== */

.attempt-color{

  width:27px;

  height:27px;

  object-fit:contain;

  flex-shrink:0;

}


/* =====================================================
   ESPAÇO VAZIO
===================================================== */

.empty-slot{

  width:27px;

  height:27px;

  flex-shrink:0;

  border-radius:50%;

  background:
    rgba(0,0,0,.12);

  border:
    1px solid
    rgba(255,255,255,.13);

}


/* =====================================================
   ÁREA PRETA / BRANCA
===================================================== */

.feedback{

  width:61px;

  flex-shrink:0;

  display:flex;

  align-items:center;

  justify-content:flex-end;

  flex-wrap:wrap;

  gap:3px;

  padding-left:5px;

}


/* =====================================================
   BOLINHA DE RESULTADO
===================================================== */

.feedback-dot{

  width:8px;

  height:8px;

  border-radius:50%;

  flex-shrink:0;

}


.feedback-dot.black{

  background:#000;

  border:
    1px solid
    rgba(255,255,255,.55);

}


.feedback-dot.white{

  background:#fff;

  border:
    1px solid
    #888;

}


/* =====================================================
   ÁREA DE ESCOLHA
===================================================== */

.choice-area{

  margin-top:10px;

  padding:9px;

  border-radius:17px;

  background:
    rgba(7,28,41,.88);

  border:
    1px solid
    rgba(255,255,255,.14);

}


/* =====================================================
   TENTATIVA ATUAL
===================================================== */

.current-label{

  text-align:center;

  color:#c6dfe9;

  font-size:11px;

  font-weight:bold;

}


.current-selection{

  min-height:42px;

  margin-top:5px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:5px;

}


.current-selection img{

  width:39px;

  height:39px;

  object-fit:contain;

}


.current-empty{

  color:#7693a4;

  font-size:11px;

}


/* =====================================================
   PALETA
===================================================== */

.colors{

  display:grid;

  grid-template-columns:
    repeat(6,1fr);

  gap:6px;

  margin-top:6px;

}


.color-button{

  width:100%;

  aspect-ratio:1;

  display:flex;

  align-items:center;

  justify-content:center;

  border:0;

  border-radius:12px;

  background:
    rgba(255,255,255,.07);

  cursor:pointer;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;

}


.color-button:active{

  transform:scale(.92);

}


.color-button img{

  width:80%;

  height:80%;

  object-fit:contain;

  pointer-events:none;

}


/* =====================================================
   BOTÕES
===================================================== */

.actions{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:8px;

  margin-top:8px;

}


.action{

  height:48px;

  border:0;

  border-radius:14px;

  color:#fff;

  font-size:14px;

  font-weight:900;

  cursor:pointer;

  touch-action:manipulation;

}


.clear{

  background:
    linear-gradient(
      135deg,
      #315e84,
      #193e5c
    );

}


.confirm{

  background:
    linear-gradient(
      135deg,
      #20d76b,
      #078d43
    );

}


.action:active{

  transform:scale(.97);

}


/* =====================================================
   MENSAGEM
===================================================== */

.message{

  min-height:19px;

  margin-top:7px;

  text-align:center;

  color:#bfdbe7;

  font-size:11px;

  font-weight:bold;

}


.message.success{

  color:#69ff9c;

}


.message.error{

  color:#ff8585;

}


.message.warning{

  color:#ffd45c;

}


/* =====================================================
   MODAL
===================================================== */

.modal{

  position:fixed;

  inset:0;

  z-index:1000;

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:
    rgba(0,10,20,.85);

}


.modal.show{

  display:flex;

}


.modal-card{

  width:100%;

  max-width:350px;

  padding:24px;

  border-radius:21px;

  text-align:center;

  background:#082d49;

}


.modal-card h2{

  font-size:22px;

}


.modal-card p{

  margin-top:8px;

  color:#b8d4e2;

  font-size:14px;

}


.modal-button{

  width:100%;

  height:48px;

  margin-top:17px;

  border:0;

  border-radius:14px;

  background:#19b960;

  color:#fff;

  font-weight:900;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

  position:fixed;

  inset:0;

  z-index:2000;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#031d31;

  color:#fff;

  font-size:16px;

  font-weight:bold;

}


.loading.hide{

  display:none;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:430px){

  .page{

    padding:
      8px
      6px
      55px;

  }


  .game-background{

    min-height:610px;

    padding:8px;

  }


  .history{

    left:8px;

    right:8px;

    bottom:10px;

    padding:7px 6px;

  }


  .attempt{

    min-height:30px;

  }


  .attempt-number{

    width:19px;

    font-size:8px;

  }


  .attempt-color,
  .empty-slot{

    width:24px;

    height:24px;

  }


  .feedback{

    width:54px;

  }


  .feedback-dot{

    width:7px;

    height:7px;

  }


  .current-selection img{

    width:36px;

    height:36px;

  }

}


</style>

</head>


<body>


<div
  class="loading"
  id="loading">

  Carregando jogo...

</div>


<div class="page">


<!-- =====================================================
     TOPO
===================================================== -->

<div class="top">

  <button
    class="back"

  </button>


  <div class="title">

<!-- =====================================================

===================================================== -->

  <div class="history">

    class="current-selection"

  <div class="colors">


    <button

        src="./vermelho.png"

    <button

        src="./azul.png"

    <button
      class="color-button"

        src="./verde.png"

    <button
      class="color-button"

      type="button">

        src="./amarelo.png"

        src="./roxo.png"
        alt="Roxo">

<!-- =====================================================
     MODAL
===================================================== -->

<div
  class="modal"
  id="noChanceModal">

  <div class="modal-card">

    <h2>

    </h2>

    <p>
      Você não possui chances suficientes
      para jogar.

    <button
      class="modal-button"
      id="modalClose"

      VOLTAR

    </button>

  </div>

</div>


<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  doc,
  updateDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",

  authDomain:
    "adam-games-21081.firebaseapp.com",

  projectId:
    "adam-games-21081",

  storageBucket:
    "adam-games-21081.firebasestorage.app",

  messagingSenderId:
    "1055528418738",

  appId:
    "1:1055528418738:web:5fafdf63424ba9744eb8ab"

};


const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================================
   ELEMENTOS
===================================================== */

const loading =
  document.getElementById("loading");

const coinsEl =
  document.getElementById("coins");

const chancesEl =
  document.getElementById("chances");

const levelEl =
  document.getElementById("level");

const progressBar =
  document.getElementById("progressBar");

const selectedEl =
  document.getElementById("selected");

const attemptsList =
  document.getElementById("attemptsList");

const attemptCounter =
  document.getElementById("attemptCounter");

const messageEl =
  document.getElementById("message");

const noChanceModal =
  document.getElementById("noChanceModal");


/* =====================================================
   CORES
===================================================== */

const COLORS = {

  vermelho:
    "./vermelho.png",

  azul:
    "./azul.png",

  verde:
    "./verde.png",

  amarelo:
    "./amarelo.png",

  roxo:
    "./roxo.png",

  laranja:
    "./laranja.png"

};


const COLOR_NAMES =
  Object.keys(COLORS);


/* =====================================================
   NÍVEIS
===================================================== */

const LEVELS = {

  1:{
    length:3,
    reward:20
  },

  2:{
    length:4,
    reward:30
  },

  3:{
    length:5,
    reward:40
  }

};


const MAX_ATTEMPTS = 10;


/* =====================================================
   ESTADO
===================================================== */

let usuario = null;

let usuarioDoc = null;

let currentLevel = 1;

let secret = [];

let selected = [];

let attempts = 0;

let gameStarted = false;

let gameFinished = false;


/* =====================================================
   GERAR SENHA
===================================================== */

function generateSecret(){

  const size =
    LEVELS[currentLevel].length;


  secret = [];


  for(
    let i = 0;
    i < size;
    i++
  ){

    const random =
      Math.floor(
        Math.random() *
        COLOR_NAMES.length
      );


    secret.push(
      COLOR_NAMES[random]
    );

  }

}


/* =====================================================
   CRIAR 10 FILEIRAS
===================================================== */

function createAttemptRows(){

  attemptsList.innerHTML = "";


  const size =
    LEVELS[currentLevel].length;


  for(
    let i = 0;
    i < MAX_ATTEMPTS;
    i++
  ){

    const row =
      document.createElement("div");

    row.className =
      "attempt";


    const number =
      document.createElement("div");

    number.className =
      "attempt-number";

    number.textContent =
      i + 1;


    const colors =
      document.createElement("div");

    colors.className =
      "attempt-colors";


    for(
      let c = 0;
      c < size;
      c++
    ){

      const empty =
        document.createElement("div");

      empty.className =
        "empty-slot";

      colors.appendChild(
        empty
      );

    }


    const feedback =
      document.createElement("div");

    feedback.className =
      "feedback";


    row.appendChild(number);

    row.appendChild(colors);

    row.appendChild(feedback);


    attemptsList.appendChild(row);

  }

}


/* =====================================================
   MOSTRAR SELEÇÃO
===================================================== */

function renderSelected(){

  selectedEl.innerHTML = "";


  if(
    selected.length === 0
  ){

    const empty =
      document.createElement("div");

    empty.className =
      "current-empty";

    empty.textContent =
      "Escolha as cores";

    selectedEl.appendChild(
      empty
    );

    return;

  }


  selected.forEach(
    color => {

      const img =
        document.createElement("img");

      img.src =
        COLORS[color];

      img.alt =
        color;

      selectedEl.appendChild(
        img
      );

    }
  );

}


/* =====================================================
   ATUALIZAR CONTADOR
===================================================== */

function updateCounter(){

  attemptCounter.textContent =
    `${attempts} / ${MAX_ATTEMPTS}`;

}


/* =====================================================
   SALDOS
===================================================== */

function atualizarSaldo(){

  coinsEl.textContent =
    Number(
      usuario?.moedas || 0
    ).toLocaleString("pt-BR");


  chancesEl.textContent =
    Number(
      usuario?.chances || 0
    ).toLocaleString("pt-BR");

}


/* =====================================================
   LOCALIZAR USUÁRIO
===================================================== */

async function localizarUsuario(user){

  let resultado =
    await getDocs(

      query(
        collection(db,"admins"),
        where("uid","==",user.uid)
      )

    );


  if(
    resultado.empty &&
    user.email
  ){

    resultado =
      await getDocs(

        query(
          collection(db,"admins"),
          where(
            "email",
            "==",
            user.email.toLowerCase()
          )
        )

      );

  }


  if(
    resultado.empty
  ){

    return null;

  }


  return resultado.docs[0];

}


/* =====================================================
   INICIAR
===================================================== */

async function iniciarPartida(){

  const chances =
    Number(
      usuario.chances || 0
    );


  if(
    chances <= 0
  ){

    noChanceModal.classList.add(
      "show"
    );

    messageEl.textContent =
      "Você não possui chances.";

    return;

  }


  /*
     Consome 1 chance.

     Também entrega 30 moedas
     por iniciar a partida.
  */

  const novasChances =
    chances - 1;


  const novasMoedas =
    Number(
      usuario.moedas || 0
    ) + 30;


  await updateDoc(

    doc(
      db,
      "admins",
      usuarioDoc.id
    ),

    {

      chances:
        novasChances,

      moedas:
        novasMoedas

    }

  );


  usuario.chances =
    novasChances;


  usuario.moedas =
    novasMoedas;


  atualizarSaldo();


  gameStarted = true;


  generateSecret();

}


/* =====================================================
   ESCOLHER COR
===================================================== */

document
  .querySelectorAll(".color-button")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          if(
            !gameStarted ||
            gameFinished
          ){

            return;

          }


          const size =
            LEVELS[currentLevel].length;


          if(
            selected.length >= size
          ){

            messageEl.textContent =
              `A senha possui ${size} cores.`;

            messageEl.className =
              "message warning";

            return;

          }


          selected.push(
            button.dataset.color
          );


          renderSelected();


          messageEl.textContent =
            `${selected.length}/${size} cores escolhidas.`;

          messageEl.className =
            "message";

        }
      );

    }
  );


/* =====================================================
   LIMPAR
===================================================== */

document
  .getElementById("clearButton")
  .addEventListener(
    "click",
    () => {

      if(
        !gameStarted ||
        gameFinished
      ){

        return;

      }


      selected = [];


      renderSelected();


      messageEl.textContent =
        `Escolha as ${LEVELS[currentLevel].length} cores.`;

      messageEl.className =
        "message";

    }
  );


/* =====================================================
   CALCULAR PISTAS
===================================================== */

function calculateHints(
  guess,
  answer
){

  let black = 0;

  let white = 0;


  const answerUsed =
    new Array(
      answer.length
    ).fill(false);


  const guessUsed =
    new Array(
      guess.length
    ).fill(false);


  /*
     PRETO:
     mesma cor e mesma posição.
  */

  for(
    let i = 0;
    i < answer.length;
    i++
  ){

    if(
      guess[i] === answer[i]
    ){

      black++;

      answerUsed[i] = true;

      guessUsed[i] = true;

    }

  }


  /*
     BRANCO:
     mesma cor, posição diferente.
  */

  for(
    let i = 0;
    i < guess.length;
    i++
  ){

    if(
      guessUsed[i]
    ){

      continue;

    }


    for(
      let j = 0;
      j < answer.length;
      j++
    ){

      if(
        answerUsed[j]
      ){

        continue;

      }


      if(
        guess[i] === answer[j]
      ){

        white++;

        answerUsed[j] = true;

        break;

      }

    }

  }


  return {
    black,
    white
  };

}


/* =====================================================
   COLOCAR TENTATIVA NA FILEIRA
===================================================== */

function showAttempt(
  guess,
  black,
  white
){

  const rows =
    attemptsList.querySelectorAll(
      ".attempt"
    );


  const row =
    rows[attempts];


  if(!row){

    return;

  }


  const colors =
    row.querySelector(
      ".attempt-colors"
    );


  const feedback =
    row.querySelector(
      ".feedback"
    );


  colors.innerHTML = "";


  guess.forEach(
    color => {

      const img =
        document.createElement("img");

      img.className =
        "attempt-color";

      img.src =
        COLORS[color];

      img.alt =
        color;

      colors.appendChild(
        img
      );

    }
  );


  feedback.innerHTML = "";


  /*
     PRETAS
  */

  for(
    let i = 0;
    i < black;
    i++
  ){

    const dot =
      document.createElement("div");

    dot.className =
      "feedback-dot black";

    feedback.appendChild(
      dot
    );

  }


  /*
     BRANCAS
  */

  for(
    let i = 0;
    i < white;
    i++
  ){

    const dot =
      document.createElement("div");

    dot.className =
      "feedback-dot white";

    feedback.appendChild(
      dot
    );

  }

}


/* =====================================================
   CONFIRMAR
===================================================== */

document
  .getElementById("confirmButton")
  .addEventListener(
    "click",
    async () => {

      if(
        !gameStarted ||
        gameFinished
      ){

        return;

      }


      const size =
        LEVELS[currentLevel].length;


      if(
        selected.length !== size
      ){

        messageEl.textContent =
          `Escolha exatamente ${size} cores.`;

        messageEl.className =
          "message warning";

        return;

      }


      const guess =
        [...selected];


      const result =
        calculateHints(
          guess,
          secret
        );


      /*
         Coloca a tentativa
         na fileira atual.
      */

      showAttempt(
        guess,
        result.black,
        result.white
      );


      attempts++;


      updateCounter();


      /*
         SENHA CORRETA
      */

      if(
        result.black === size
      ){

        await venceuNivel();

        return;

      }


      /*
         ACABARAM AS TENTATIVAS
      */

      if(
        attempts >= MAX_ATTEMPTS
      ){

        gameFinished = true;


        messageEl.textContent =
          "❌ Você perdeu as 10 tentativas.";

        messageEl.className =
          "message error";

        selected = [];

        renderSelected();

        return;

      }


      selected = [];

      renderSelected();


      messageEl.textContent =
        "❌ Incorreto. Tente novamente.";

      messageEl.className =
        "message error";

    }
  );


/* =====================================================
   VITÓRIA
===================================================== */

async function venceuNivel(){

  gameFinished = true;


  const reward =
    LEVELS[currentLevel].reward;


  const novasMoedas =
    Number(
      usuario.moedas || 0
    ) + reward;


  await updateDoc(

    doc(
      db,
      "admins",
      usuarioDoc.id
    ),

    {

      moedas:
        novasMoedas

    }

  );


  usuario.moedas =
    novasMoedas;


  atualizarSaldo();


  /*
     NÃO MOSTRA A SENHA.
  */

  messageEl.textContent =
    `🎉 SENHA CORRETA! +${reward} Adam Coins`;

  messageEl.className =
    "message success";


  if(
    currentLevel < 3
  ){

    setTimeout(
      () => {

        currentLevel++;

        iniciarNovoNivel();

      },
      1500
    );

  }
  else{

    messageEl.textContent =
      "🏆 VOCÊ CONCLUIU OS 3 NÍVEIS!";

  }

}


/* =====================================================
   NOVO NÍVEL
===================================================== */

function iniciarNovoNivel(){

  gameFinished = false;

  attempts = 0;

  selected = [];


  levelEl.textContent =
    `${currentLevel} / 3`;


  progressBar.style.width =
    `${(currentLevel / 3) * 100}%`;


  document.getElementById(
    "phaseTitle"
  ).textContent =
    `NÍVEL ${currentLevel} — DESCUBRA A SENHA`;


  document.getElementById(
    "phaseDescription"
  ).textContent =
    `Descubra a sequência de ${LEVELS[currentLevel].length} cores.`;


  createAttemptRows();


  updateCounter();


  renderSelected();


  messageEl.textContent =
    `Escolha as ${LEVELS[currentLevel].length} cores.`;

  messageEl.className =
    "message";


  generateSecret();

}

/* =====================================================
   AUTENTICAÇÃO
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      window.location.replace(
        "index.html"
      );

      return;

    }


    try{

      usuarioDoc =
        await localizarUsuario(
          user
        );


      if(!usuarioDoc){

        loading.classList.add(
          "hide"
        );

        messageEl.textContent =
          "Não foi possível localizar seu cadastro.";

        messageEl.className =
          "message error";

        return;

      }


      usuario =
        usuarioDoc.data();


      atualizarSaldo();


      createAttemptRows();


      updateCounter();


      await iniciarPartida();


      loading.classList.add(
        "hide"
      );

    }

    catch(error){

      console.error(
        error
      );


      loading.classList.add(
        "hide"
      );


      messageEl.textContent =
        "Erro ao carregar o jogo.";

      messageEl.className =
        "message error";

    }

  }
);

</script>
