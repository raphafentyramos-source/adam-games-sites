<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Adam Games • Voucher</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#061a32,#0b3156 55%,#06213b);color:#fff}body{padding:18px 12px 40px}.wrap{width:min(760px,100%);margin:auto}.brand{text-align:center;margin:5px 0 14px}.brand b{font-size:25px}.brand span{color:#ffd52a}.hero{text-align:center;padding:10px 10px 20px}.hero h1{font-size:30px;margin:5px 0 7px}.hero p{color:#b8d5eb;font-size:14px;margin:0}.panel{background:rgba(3,28,57,.92);border:1px solid rgba(255,255,255,.11);border-radius:25px;padding:16px;box-shadow:0 20px 45px rgba(0,0,0,.28)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.voucher-card{aspect-ratio:3/4.25;border:0;padding:0;background:transparent;cursor:pointer;perspective:1000px}.inner{width:100%;height:100%;position:relative;transition:transform .7s;transform-style:preserve-3d}.voucher-card.revealed .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:17px;overflow:hidden;background:#123;box-shadow:0 10px 24px rgba(0,0,0,.28)}.face img{width:100%;height:100%;display:block;object-fit:cover}.prizeOverlay{position:absolute;left:13%;right:13%;top:32%;bottom:19%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#132d3d;text-shadow:0 1px 0 rgba(255,255,255,.35);font-weight:1000}.prizeOverlay .big{font-size:34px;line-height:1}.prizeOverlay .small{margin-top:8px;font-size:11px;line-height:1.25}.prizeOverlay .mini{margin-top:6px;font-size:9px;line-height:1.2}.back{transform:rotateY(180deg)}.voucher-card:disabled{cursor:default}.counter{text-align:center;margin-top:15px;color:#b8d5e8;font-size:13px}.counter strong{color:#ffd52a}.result{display:none;margin-top:16px;text-align:center;padding:20px;border-radius:20px;background:linear-gradient(145deg,rgba(255,213,42,.14),rgba(255,255,255,.045));border:1px solid rgba(255,213,42,.3)}.result.show{display:block}.result .percent{font-size:48px;font-weight:1000;color:#ffd52a;text-shadow:0 4px 12px rgba(255,190,0,.22)}.result .min{margin-top:5px;color:#dbeaf7;font-size:14px}.result .code{margin-top:12px;padding:10px;border-radius:10px;background:#061a34;color:#79d0ff;font-weight:900;font-size:12px;word-break:break-all}.history{margin-top:18px}.history h3{font-size:16px;margin:0 0 10px}.history-list{display:grid;gap:8px}.history-item{padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;gap:10px}.history-item b{color:#ffd52a}.history-item small{color:#8fb5d0}.empty{text-align:center;color:#8eabc1;font-size:12px;padding:12px}.error{padding:18px;text-align:center;color:#ffb0ba;background:rgba(255,50,70,.08);border:1px solid rgba(255,50,70,.18);border-radius:15px}@media(max-width:480px){.cards{gap:7px}.panel{padding:11px}.hero h1{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">♛ <b>Adam <span>Games</span></b></div>
  <div class="hero"><h1>🎁 Escolha seu Voucher!</h1><p>Escolha uma das 6 cartas para descobrir seu desconto.</p></div>
  <div class="panel" id="app"><div class="cards" id="cards"></div><div class="counter" id="counter">Carregando seu voucher...</div><div class="result" id="result"><div style="font-size:13px;font-weight:900">🎉 VOCÊ GANHOU</div><div class="percent" id="percent">--%</div><div class="min" id="minimum">Compras a partir de R$ 0,00</div><div class="code" id="code">Voucher registrado neste link</div></div><div class="history"><h3>📜 Histórico deste voucher</h3><div class="history-list" id="history"><div class="empty">Nenhuma escolha ainda.</div></div></div></div>
</div>
<script type="module">
import {initializeApp,getApps} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,doc,getDoc,runTransaction,collection,addDoc,getDocs,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const config={apiKey:"AIzaSyC4Zp45lescRGFKXjgRBz0mAg1pcae72qc",authDomain:"adam-games-21081.firebaseapp.com",projectId:"adam-games-21081",storageBucket:"adam-games-21081.firebasestorage.app",messagingSenderId:"1055528418738",appId:"1:1055528418738:web:5fafdf63424ba9744eb8ab",measurementId:"G-KVFSF864GE"};
const app=getApps().length?getApps()[0]:initializeApp(config),auth=getAuth(app),db=getFirestore(app);const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search),id=params.get("id");let voucher=null,remaining=0,locked=false;
const costas="voucher_costas.png",frente="voucher_frente.png";
function money(v){return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}function date(v){const d=v?.toDate?v.toDate():new Date(v);return d.toLocaleString("pt-BR")}
function weighted(prizes){const total=prizes.reduce((s,p)=>s+Number(p.peso||0),0);let r=Math.random()*total;for(const p of prizes){r-=Number(p.peso||0);if(r<0)return p}return prizes[prizes.length-1]}
function renderCards(){const box=$("cards");box.innerHTML="";for(let i=0;i<6;i++){const b=document.createElement("button");b.className="voucher-card";b.type="button";b.innerHTML=`<div class="inner"><div class="face"><img src="${costas}" alt="Voucher fechado"></div><div class="face back"><img src="${frente}" alt="Voucher revelado"><div class="prizeOverlay"><div class="big">?</div><div class="small">ESCOLHA REVELADA</div></div></div></div>`;b.onclick=()=>choose(b);box.appendChild(b)}}
function updateCounter(){if(remaining>0){$("counter").innerHTML=`Você tem <strong>${remaining}</strong> escolha${remaining===1?"":"s"} restante${remaining===1?"":"s"}. Escolha uma carta.`}else{$("counter").innerHTML="🎉 Todas as escolhas deste link já foram usadas."}}
async function choose(card){if(locked||remaining<=0||card.disabled)return;locked=true;try{if(!auth.currentUser)await signInAnonymously(auth)}catch(authError){console.error("ERRO AUTENTICAÇÃO ANÔNIMA:",authError);locked=false;document.querySelectorAll(".voucher-card").forEach(x=>x.disabled=false);alert("Não foi possível ativar o voucher. Verifique se a autenticação anônima está habilitada no Firebase.");return;}document.querySelectorAll(".voucher-card").forEach(x=>x.disabled=true);const prize=weighted(voucher.premios||[]);try{await runTransaction(db,async tx=>{const ref=doc(db,"vouchersDesconto",id),snap=await tx.get(ref);if(!snap.exists())throw new Error("Voucher não encontrado.");const v=snap.data();const used=Number(v.escolhasUsadas||0),total=Number(v.escolhasTotal||0);if(used>=total)throw new Error("Este link já atingiu o limite de escolhas.");tx.update(ref,{escolhasUsadas:used+1,atualizadoEm:serverTimestamp()});});await addDoc(collection(db,"vouchersDesconto",id,"historico"),{percentual:Number(prize.percentual),minimo:Number(prize.minimo),dataHora:serverTimestamp(),tipo:"revelacao"});card.classList.add("revealed");card.querySelector(".prizeOverlay").innerHTML=`<div class="big">${prize.percentual}%</div><div class="small">OFF</div><div class="mini">Compras a partir de ${money(prize.minimo)}</div>`;$("percent").textContent=`${prize.percentual}% OFF`;$("minimum").textContent=`Válido para compras a partir de ${money(prize.minimo)}`;$("code").textContent=`${prize.percentual}% OFF • compra mínima ${money(prize.minimo)}`;$("result").classList.add("show");remaining--;updateCounter();setTimeout(()=>{document.querySelectorAll(".voucher-card").forEach(x=>{x.classList.remove("revealed");x.disabled=remaining<=0});locked=false;loadHistory()},900)}catch(e){console.error(e);locked=false;document.querySelectorAll(".voucher-card").forEach(x=>x.disabled=false);alert("Não foi possível registrar esta escolha. Tente novamente.")}}
async function loadHistory(){const box=$("history");try{const snap=await getDocs(query(collection(db,"vouchersDesconto",id,"historico"),orderBy("dataHora","desc")));if(snap.empty){box.innerHTML='<div class="empty">Nenhuma escolha ainda.</div>';return}box.innerHTML=snap.docs.map((d,i)=>{const x=d.data();return `<div class="history-item"><div><b>${Number(x.percentual||0)}% OFF</b><br><small>Compra mínima: ${money(x.minimo)}</small></div><small>#${snap.size-i} • ${date(x.dataHora)}</small></div>`}).join("")}catch(e){box.innerHTML='<div class="empty">Histórico indisponível.</div>'}}
async function start(){
  if(!id){$("app").innerHTML='<div class="error">❌ Link de voucher inválido.</div>';return}
  try{
    // O cliente não precisa fazer login. Usamos autenticação anônima
    // automaticamente antes de acessar o Firestore.
    if(!auth.currentUser){await signInAnonymously(auth)}
    const snap=await getDoc(doc(db,"vouchersDesconto",id));
    if(!snap.exists()){
      throw new Error("notfound");
    }
    voucher={id:snap.id,...snap.data()};
    remaining=Math.max(0,Number(voucher.escolhasTotal||0)-Number(voucher.escolhasUsadas||0));
    renderCards();
    updateCounter();
    loadHistory();
  }catch(e){
    console.error("ERRO AO CARREGAR VOUCHER:",e);
    $("app").innerHTML='<div class="error">❌ Não foi possível carregar este voucher. Verifique se o link foi gerado no Admin e se as Rules do Firestore permitem a leitura pública de <b>vouchersDesconto</b>.</div>';
  }
}
start();
</script>
</body></html>
